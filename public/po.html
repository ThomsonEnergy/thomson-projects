<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Purchase order</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/document-fonts.css?v=1" />
<link rel="stylesheet" href="/css/style.css?v=23" />
<script src="/js/vendor/supabase-2.js?v=1"></script>
<style>
  /* Same A4 sheets as invoice.html (794 x 1123 px at 96 dpi), without the payment parts. */
  @page { size: A4; margin: 0; }
  body { background: #e6e9ef; }
  .inv-sheets { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .inv-sheet {
    position: relative; width: 794px; height: 1123px; margin: 0 auto 22px; overflow: hidden;
    background: #fff; color: #000; box-shadow: 0 6px 28px rgba(15, 23, 42, 0.18);
    font-family: 'Arimo', Arial, Helvetica, sans-serif; font-size: 13px; line-height: 1.3;
    padding: 34px 38px 0;
  }
  .inv-sheet * { box-sizing: border-box; }
  .inv-head { display: flex; justify-content: space-between; align-items: flex-start; }
  .inv-logo { display: block; height: 112px; width: auto; max-width: 300px; }
  .inv-web { font-size: 12px; margin-top: 8px; }
  .inv-contact { font-size: 13.5px; line-height: 1.38; margin-top: 2px; }
  .inv-meta-row { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 52px; }
  .inv-bill { font-size: 13px; line-height: 1.38; padding: 10px 0 0 8px; max-width: 330px; }
  .inv-bill .k { font-size: 10px; text-transform: uppercase; letter-spacing: 0.02em; color: #555; }
  .inv-right { width: 340px; }
  .inv-strip { display: flex; border: 1px solid #6b6b6b; border-radius: 6px; overflow: hidden; }
  .inv-strip > div { flex: 1; text-align: center; padding: 8px 4px 9px; border-right: 1px solid #6b6b6b; }
  .inv-strip > div:last-child { border-right: none; }
  .inv-strip .k { font-size: 10px; text-transform: uppercase; letter-spacing: 0.02em; }
  .inv-strip .v { font-size: 14px; font-weight: 700; margin-top: 8px; white-space: nowrap; }
  .inv-strip .amt { background: #98989d; color: #fff; }
  .inv-title { text-align: right; font-size: 20px; font-weight: 700; margin: 14px 0 0; letter-spacing: 0.01em; }
  .inv-details { background: #ececec; border-radius: 6px; padding: 12px 14px 10px; margin-top: 14px; font-size: 12px; line-height: 1.5; }
  .inv-details div { display: flex; gap: 10px; }
  .inv-details .k { font-weight: 700; width: 78px; flex: none; }
  .inv-details .v { overflow-wrap: anywhere; }
  .inv-body { margin-top: 20px; }
  .inv-sec { margin-bottom: 18px; }
  .inv-sec h3 { margin: 0 0 4px; font-size: 13px; font-weight: 700; }
  .inv-sheet table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; border: none; margin: 0; }
  .inv-sheet th { background: #98989d; color: #fff; font-weight: 700; font-size: 13px; padding: 2px 6px; text-align: center; border: none; text-transform: none; letter-spacing: 0; }
  .inv-sheet th:first-child { border-top-left-radius: 6px; }
  .inv-sheet th:last-child { border-top-right-radius: 6px; }
  .inv-sheet td { border: 1px solid #8e8e93; border-top: none; padding: 2px 6px; font-size: 13px; background: #fff; color: #000; vertical-align: top; }
  .inv-sheet td + td { border-left: none; }
  .inv-sheet td.num, .inv-sheet th.num { text-align: right; }
  .inv-sheet td.ctr { text-align: center; }
  .inv-sheet tr:last-child td:first-child { border-bottom-left-radius: 4px; }
  .inv-sheet tr:last-child td:last-child { border-bottom-right-radius: 4px; }
  .inv-foot { position: absolute; left: 38px; right: 38px; bottom: 26px; text-align: center; font-size: 11px; font-weight: 700; }
  .inv-final { margin-top: 10px; }
  .inv-final-top { display: flex; justify-content: space-between; gap: 24px; border-bottom: 1px solid #000; padding-bottom: 12px; }
  .inv-terms { font-size: 13px; line-height: 1.5; max-width: 440px; }
  .inv-totals { font-size: 12px; line-height: 1.55; }
  .inv-totals div { display: flex; justify-content: flex-end; gap: 22px; }
  .inv-totals .k { font-weight: 700; text-align: right; }
  .inv-totals .v { min-width: 84px; text-align: right; }

  @media print {
    .topbar { display: none !important; }
    html, body { background: #fff !important; }
    .wrap { max-width: none !important; width: 210mm !important; margin: 0 !important; padding: 0 !important; }
    .inv-sheets { zoom: 1 !important; }
    .inv-sheet { margin: 0; box-shadow: none; page-break-after: always; break-after: page; }
    .inv-sheet:last-child { page-break-after: auto; break-after: auto; }
  }
  .as-paper .topbar { display: none !important; }
  .as-paper .wrap { max-width: none !important; width: 794px !important; margin: 0 !important; padding: 0 !important; }
  .as-paper .inv-sheet { margin: 0; box-shadow: none; }
  /* Phone: a plain full-size summary card above the zoomed A4 sheet (never printed, never in the PDF).
     The 8px wrap gutter keeps the zoomed sheet (window width minus 16px) on screen. */
  .doc-sum { display: none; }
  @media (max-width: 839px) {
    .wrap { padding-left: 8px !important; padding-right: 8px !important; }
    .doc-sum { display: block; background: #fff; color: #0a0a0a; border-radius: 12px; padding: 18px 16px; margin: 0 0 18px; box-shadow: 0 4px 18px rgba(15,23,42,0.12); font-size: 16px; line-height: 1.45; }
    .doc-sum .ds-kicker { font-size: 14px; font-weight: 600; color: #4b5563; }
    .doc-sum .ds-amount { font-size: 34px; font-weight: 700; margin: 2px 0; }
    .doc-sum h3 { font-size: 16px; margin: 16px 0 6px; padding-top: 14px; border-top: 1px solid #e5e7eb; }
    .doc-sum .ds-row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
    .doc-sum .ds-row .k { color: #4b5563; }
    .doc-sum .ds-row .v { font-weight: 700; text-align: right; overflow-wrap: anywhere; }
    .doc-sum .ds-item { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #e5e7eb; }
    .doc-sum .ds-item .q { font-weight: 700; white-space: nowrap; }
    .doc-sum .ds-note { font-size: 14px; color: #4b5563; margin: 14px 0 0; }
    .doc-sum a { color: #0b3d91; }
  }
  @media print { .doc-sum { display: none !important; } }
  .as-paper .doc-sum { display: none !important; }
</style>
</head>
<body>
  <div class="topbar">
    <span id="brand-mark" class="brand">PURCHASE ORDER</span>
    <button class="secondary" onclick="window.print()">Print / Save as PDF</button>
  </div>

  <div class="wrap" style="max-width:860px;">
    <div id="content"><p class="subtitle">Loading the purchase order...</p></div>
  </div>

  <script src="/js/supabase-client.js?v=115"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    const isPrint = new URLSearchParams(window.location.search).get('print') === '1';
    if (isPrint) document.documentElement.classList.add('as-paper');

    const ORDERS_EMAIL = 'admin@thomsonenergy.com.au';
    const INVOICES_EMAIL = 'invoice@thomsonenergy.com.au';
    const PAGE_H = 1123, FOOT_RESERVE = 60;
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const dateText = (d) => d.toLocaleDateString('en-AU', { day: '2-digit', month: '2-digit', year: 'numeric' });

    async function load() {
      const { data, error } = await supabaseClient.rpc('get_po_by_token', { p_token: token });
      const content = document.getElementById('content');
      if (error || !data) {
        content.innerHTML = `<div class="error-box">This purchase order link isn't valid. Please check the link or contact us.</div>`;
        return;
      }

      const po = data.po;
      const deliver = data.deliver || {};
      const s = data.company || {};
      s.logo_url = await smallLogoUrl(s.logo_url);
      const lines = data.lines || [];

      if (s.logo_url) document.getElementById('brand-mark').innerHTML = `<img src="${s.logo_url}" style="max-height:28px;" />`;
      else if (s.company_name) document.getElementById('brand-mark').textContent = s.company_name;
      document.title = `Purchase order ${po.po_number} - ${s.company_name || 'Thomson Energy'}`;

      const showPrices = !!po.show_prices; // off by default: the supplier sees items and quantities only
      const subtotal = lines.reduce((t, l) => t + (Number(l.quantity) || 0) * (Number(l.unit_cost) || 0), 0);
      const gst = Math.round(subtotal * 0.10 * 100) / 100;
      const total = subtotal + gst;
      const orderDate = po.order_date ? new Date(po.order_date + 'T00:00:00') : new Date();

      const rows = lines.map((l) => showPrices ? {
        cells: [esc(l.description), (Number(l.quantity) || 0).toFixed(2), money(l.unit_cost), money((Number(l.quantity) || 0) * (Number(l.unit_cost) || 0))],
        cls: ['', 'ctr', 'num', 'num'],
      } : { cells: [esc(l.description), poQty(l.quantity)], cls: ['', 'ctr'] });
      if (!rows.length) rows.push(showPrices ? { cells: ['Items to be confirmed', '', '', ''], cls: ['', 'ctr', 'num', 'num'] } : { cells: ['Items to be confirmed', ''], cls: ['', 'ctr'] });
      const sections = [{ title: po.description || 'Items', rows }];

      const link = (href, text) => `<a href="${esc(href)}" style="color:inherit; text-decoration:none;">${esc(text)}</a>`;
      const addressParts = String(s.address || '').split(/,\s*|\n/).filter(Boolean).slice(0, 3);
      const contactLines = [
        link('mailto:' + ORDERS_EMAIL, ORDERS_EMAIL),
        s.phone ? `Tel. ${link('tel:' + String(s.phone).replace(/[^+\d]/g, ''), s.phone)}` : '',
        addressParts.length ? addressParts.map(esc).join('<br>') : '',
        s.abn ? esc(`ABN ${s.abn}`) : '',
      ].filter(Boolean);
      const detailRows = [
        deliver.job_number ? ['Job No.', `J${deliver.job_number}`] : null,
        deliver.address ? ['Deliver to', deliver.address] : (deliver.label ? ['Deliver to', deliver.label === 'Warehouse' ? (s.address || 'Warehouse') : deliver.label] : null),
        ['Reference', `Please quote ${po.po_number} on your invoice`],
      ].filter(Boolean);

      const sheetHtml = (first) => `
        <section class="inv-sheet">
          <div class="inv-head">
            <div>
              ${s.logo_url ? `<img class="inv-logo" src="${s.logo_url}" alt="${esc(s.company_name || '')}" />` : `<div style="font-size:26px; font-weight:700;">${esc(s.company_name || '')}</div>`}
              ${s.website ? (() => { const u = /^https?:/i.test(s.website) ? s.website : 'https://' + s.website; return `<div class="inv-web"><a href="${esc(u)}" style="color:inherit; text-decoration:none;">${esc(u)}</a></div>`; })() : ''}
            </div>
            <div class="inv-contact">${contactLines.join('<br>')}</div>
          </div>
          <div class="inv-meta-row">
            <div class="inv-bill">${first ? `<div class="k">Supplier</div>${esc(po.supplier_name || '')}` : ''}</div>
            <div class="inv-right">
              <div class="inv-strip">
                <div><div class="k">Order date</div><div class="v">${dateText(orderDate)}</div></div>
                ${showPrices ? `<div class="amt"><div class="k">Total inc GST</div><div class="v">${money(total)}</div></div>` : `<div class="amt"><div class="k">PO number</div><div class="v">${esc(po.po_number)}</div></div>`}
              </div>
              <div class="inv-title">PURCHASE ORDER ${esc(po.po_number)}</div>
              ${first && detailRows.length ? `<div class="inv-details">${detailRows.map(([k, v]) => `<div><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('')}</div>` : ''}
            </div>
          </div>
          <div class="inv-body"></div>
          <div class="inv-foot"></div>
        </section>`;

      const finalHtml = `
        <div class="inv-final">
          <div class="inv-final-top">
            <div class="inv-terms">
              ${po.supplier_notes ? `<div style="font-weight:700;">Notes</div><div style="white-space:pre-wrap; margin-bottom:10px;">${esc(po.supplier_notes)}</div>` : ''}
              Please quote <strong>${esc(po.po_number)}</strong> on your invoice and delivery docket, and email invoices to ${link('mailto:' + INVOICES_EMAIL, INVOICES_EMAIL)}.${showPrices ? ' Prices are ex GST.' : ''}
            </div>
            ${showPrices ? `<div class="inv-totals">
              <div><span class="k">Sub-Total ex GST</span><span class="v">${money(subtotal)}</span></div>
              <div><span class="k">GST</span><span class="v">${money(gst)}</span></div>
              <div><span class="k">Total inc GST</span><span class="v">${money(total)}</span></div>
            </div>` : ''}
          </div>
        </div>`;

      // Phone: a plain summary card above the A4 sheet (the CSS shows it only under 840px; never in the PDF).
      const sumRows = detailRows.filter(([k]) => k !== 'Reference');
      const itemsHtml = lines.length ? lines.map((l) => {
        const qty = Number(l.quantity) || 0;
        return `<div class="ds-item"><span>${esc(l.description)}${showPrices ? `<br><small>${money(l.unit_cost)} each</small>` : ''}</span><span class="q">x ${esc(poQty(l.quantity))}${showPrices ? `<br>${money(qty * (Number(l.unit_cost) || 0))}` : ''}</span></div>`;
      }).join('') : '<div class="ds-item">Items to be confirmed</div>';
      const summaryHtml = isPrint ? '' : `
        <div class="doc-sum">
          <div class="ds-kicker">Purchase order</div>
          <div class="ds-amount">${esc(po.po_number)}</div>
          <div>Order date ${esc(dateText(orderDate))}${po.supplier_name ? `<br>For ${esc(po.supplier_name)}` : ''}</div>
          ${sumRows.map(([k, v]) => `<div class="ds-row"><span class="k">${esc(k)}</span><span class="v">${esc(v)}</span></div>`).join('')}
          <h3>Items</h3>
          ${itemsHtml}
          ${showPrices ? `
          <div class="ds-row"><span class="k">Sub-total ex GST</span><span class="v">${money(subtotal)}</span></div>
          <div class="ds-row"><span class="k">GST</span><span class="v">${money(gst)}</span></div>
          <div class="ds-row"><span class="k">Total inc GST</span><span class="v">${money(total)}</span></div>` : ''}
          ${po.supplier_notes ? `<h3>Notes</h3><div style="white-space:pre-wrap;">${esc(po.supplier_notes)}</div>` : ''}
          <p style="margin:14px 0 0;">Please quote <b>${esc(po.po_number)}</b> on your invoice and delivery docket, and email invoices to <a href="${esc('mailto:' + INVOICES_EMAIL)}">${esc(INVOICES_EMAIL)}</a>.</p>
          ${s.phone ? `<p style="margin:6px 0 0;">Questions: <a href="${esc('tel:' + String(s.phone).replace(/[^+\d]/g, ''))}">${esc(s.phone)}</a></p>` : ''}
          <p class="ds-note">The full purchase order is below. Use Print / Save as PDF for a copy.</p>
        </div>`;

      // ---- build the sheets, moving rows onto a new sheet whenever one fills up (as invoice.html) ----
      content.innerHTML = summaryHtml + '<div class="inv-sheets" id="inv-sheets"></div>';
      const host = document.getElementById('inv-sheets');
      const sheets = [];
      const addSheet = () => {
        const wrap = document.createElement('div');
        wrap.innerHTML = sheetHtml(sheets.length === 0).trim();
        const el = wrap.firstElementChild;
        host.appendChild(el); sheets.push(el);
        return el;
      };
      const bottomOf = (sheet, el) => el.getBoundingClientRect().bottom - sheet.getBoundingClientRect().top;
      const limit = PAGE_H - FOOT_RESERVE;
      const makeSection = (sec) => {
        const box = document.createElement('div'); box.className = 'inv-sec';
        const head = showPrices ? ['Item', 'Quantity', 'Unit Price', 'Total'] : ['Item', 'Quantity'];
        const hcls = showPrices ? ['', 'ctr', 'num', 'num'] : ['', 'ctr'];
        const widths = showPrices ? ['52%', '14%', '17%', '17%'] : ['82%', '18%'];
        box.innerHTML = `<h3>${esc(sec.title)}</h3><table><colgroup>${widths.map((w) => `<col style="width:${w}">`).join('')}</colgroup><thead><tr>${head.map((h, i) => `<th class="${hcls[i]}">${esc(h)}</th>`).join('')}</tr></thead><tbody></tbody></table>`;
        return box;
      };
      let sheet = addSheet();
      sections.forEach((sec) => {
        let body = sheet.querySelector('.inv-body');
        let box = makeSection(sec); body.appendChild(box);
        let tbody = box.querySelector('tbody');
        sec.rows.forEach((r) => {
          const tr = document.createElement('tr');
          tr.innerHTML = r.cells.map((cell, i) => `<td class="${(r.cls && r.cls[i]) || ''}">${cell}</td>`).join('');
          tbody.appendChild(tr);
          if (bottomOf(sheet, box) > limit && tbody.children.length > 1) {
            tbody.removeChild(tr);
            sheet = addSheet(); body = sheet.querySelector('.inv-body');
            box = makeSection(sec); body.appendChild(box);
            tbody = box.querySelector('tbody'); tbody.appendChild(tr);
          }
        });
      });
      const finalWrap = document.createElement('div'); finalWrap.innerHTML = finalHtml.trim();
      const finalEl = finalWrap.firstElementChild;
      sheet.querySelector('.inv-body').appendChild(finalEl);
      if (bottomOf(sheet, finalEl) > PAGE_H - 30) {
        finalEl.remove();
        sheet = addSheet(); sheet.querySelector('.inv-body').appendChild(finalEl);
      }
      sheets.forEach((el, i) => { el.querySelector('.inv-foot').textContent = `Page ${i + 1}/${sheets.length}`; });

      if (!isPrint && window.innerWidth < 840) host.style.zoom = String(Math.max(0.3, (window.innerWidth - 16) / 794));
    }

    load().then(async () => {
      // generate-client-document-pdf.js waits for data-print-ready, as with invoice.html
      const images = [...document.querySelectorAll('img')];
      await Promise.all(images.map((img) => img.complete ? Promise.resolve() : new Promise((res) => { img.onload = img.onerror = res; })));
      document.body.dataset.printReady = 'true';
      if (isPrint) window.print();
    });
  </script>
</body>
</html>
