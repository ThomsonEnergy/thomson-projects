<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('te-theme') || 'dark');</script>
<title>Stock - Thomson Energy</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=8" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('mobile-menu-dropdown').classList.toggle('open')">&#9776;</button>
    <div class="mobile-menu-dropdown" id="mobile-menu-dropdown"></div>
    <nav class="topbar-tabs" id="topbar-tabs"></nav>
    <div class="topbar-right">
      <a href="/schedule.html" class="topbar-icon-link" title="Schedule">&#128197;</a>
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/home.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="wrap wide">
    <h1>Stock</h1>
    <p class="subtitle">Materials on hand - cost and sell price, so job costing has real numbers to work from once this feeds into quoting.</p>

    <div class="grid cols-2">
      <div class="stat"><div class="label">Total stock cost</div><div class="value" id="stat-total-stock-cost">-</div></div>
      <div class="stat"><div class="label">Below minimum</div><div class="value" id="stat-below-minimum">-</div></div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
        <input id="stock-search" placeholder="Search by name, category, or supplier..." style="max-width:320px;" />
        <div>
          <button id="create-stock-po-btn" style="margin-right:8px;">+ Create PO</button>
          <button class="secondary" id="suggest-restock-btn" style="margin-right:8px;">Suggest restock PO</button>
          <button class="secondary" id="upload-pricelist-btn" style="margin-right:8px;">Upload pricelist</button>
          <button id="add-material-btn">+ Add material</button>
        </div>
      </div>
      <div id="stock-list"><p class="subtitle">Loading...</p></div>
    </div>

    <div class="card">
      <h2>Stock purchase orders</h2>
      <p class="subtitle" style="margin-bottom:14px;">Purchase orders for general stock replenishment - not tied to any specific job.</p>
      <div id="stock-pos-list"><p class="subtitle">Loading...</p></div>
    </div>
  </div>

  <script src="/js/supabase-client.js?v=2"></script>
  <script src="/js/theme.js"></script>
  <script>
    let allMaterials = [];
    let allSuppliers = [];
    let stockVehicles = [];
    let locationRows = [];

    async function loadMaterials() {
      const listEl = document.getElementById('stock-list');
      const { data, error } = await supabaseClient.from('materials').select('*, suppliers(id, name)').order('name');
      if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }
      allMaterials = data || [];

      const { data: vehicles } = await supabaseClient.from('fleet_vehicles').select('id, vehicle_name, rego').eq('holds_stock', true).order('vehicle_name');
      stockVehicles = vehicles || [];
      const { data: locations } = await supabaseClient.from('material_stock_by_location').select('*');
      locationRows = locations || [];

      renderMaterials();
    }

    function locationBreakdown(materialId) {
      const warehouseQty = locationRows.find(r => r.material_id === materialId && r.location_type === 'warehouse')?.quantity || 0;
      const parts = [`${warehouseQty} Warehouse`];
      stockVehicles.forEach(v => {
        const qty = locationRows.find(r => r.material_id === materialId && r.location_type === 'vehicle' && r.vehicle_id === v.id)?.quantity || 0;
        parts.push(`${qty} ${v.vehicle_name || v.rego}`);
      });
      return parts.join(' &middot; ');
    }

    function renderMaterials() {
      const listEl = document.getElementById('stock-list');
      const q = document.getElementById('stock-search').value.trim().toLowerCase();
      const filtered = q
        ? allMaterials.filter(m => (m.name || '').toLowerCase().includes(q) || (m.category || '').toLowerCase().includes(q) || (m.suppliers?.name || '').toLowerCase().includes(q))
        : allMaterials;

      const totalStockCost = allMaterials.reduce((s, m) => s + (Number(m.quantity_on_hand) || 0) * (Number(m.cost_price) || 0), 0);
      const belowMinimumCount = allMaterials.filter(m => Number(m.minimum_quantity) > 0 && Number(m.quantity_on_hand) < Number(m.minimum_quantity)).length;
      document.getElementById('stat-total-stock-cost').textContent = money(totalStockCost);
      document.getElementById('stat-below-minimum').textContent = belowMinimumCount;

      if (!filtered.length) { listEl.innerHTML = `<p class="subtitle">No materials yet - add one to get started.</p>`; return; }

      listEl.innerHTML = `
        <table class="responsive-stack">
          <thead><tr><th>Name</th><th>Category</th><th>Supplier</th><th class="num">Cost</th><th class="num">Sell</th><th class="num">Qty on hand</th><th class="num">Minimum</th><th></th></tr></thead>
          <tbody>
            ${filtered.map(m => {
              const isBelowMin = Number(m.minimum_quantity) > 0 && Number(m.quantity_on_hand) < Number(m.minimum_quantity);
              return `
              <tr>
                <td data-label="Name">${m.name}</td>
                <td data-label="Category">${m.category || '-'}</td>
                <td data-label="Supplier">${m.suppliers?.name || '-'}</td>
                <td class="num" data-label="Cost">${money(m.cost_price)}</td>
                <td class="num" data-label="Sell">${money(m.sell_price)}</td>
                <td class="num" data-label="Qty" style="${isBelowMin ? 'color:var(--red); font-weight:600;' : ''}">
                  ${m.quantity_on_hand}${isBelowMin ? ' &#9888;' : ''}
                  ${stockVehicles.length ? `<div class="subtitle" style="font-size:11px; font-weight:400; white-space:nowrap;">${locationBreakdown(m.id)}</div>` : ''}
                </td>
                <td class="num" data-label="Minimum">${m.minimum_quantity || '-'}</td>
                <td data-label="">
                  <button class="secondary edit-material-btn" data-id="${m.id}" style="font-size:12px; padding:6px 10px;">Edit</button>
                </td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>`;

      listEl.querySelectorAll('.edit-material-btn').forEach(btn => {
        btn.addEventListener('click', () => openMaterialPanel(allMaterials.find(m => m.id === btn.dataset.id)));
      });
    }

    document.getElementById('stock-search').addEventListener('input', renderMaterials);

    function openMaterialPanel(material) {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:440px; width:100%; max-height:85vh; overflow-y:auto;">
          <h2>${material ? 'Edit material' : 'Add material'}</h2>
          <label style="margin-top:0">Name</label>
          <input id="mat-name" value="${material?.name || ''}" />
          <div class="grid cols-2">
            <div>
              <label>Category</label>
              <input id="mat-category" value="${material?.category || ''}" placeholder="e.g. Cable" />
            </div>
            <div>
              <label>Supplier</label>
              <select id="mat-supplier"><option value="">-- None --</option>${allSuppliers.map(s => `<option value="${s.id}" ${material?.supplier_id === s.id ? 'selected' : ''}>${s.name}</option>`).join('')}</select>
            </div>
          </div>
          <div class="grid cols-3">
            <div>
              <label>Cost price</label>
              <input id="mat-cost" type="number" step="0.01" value="${material?.cost_price || 0}" />
            </div>
            <div>
              <label>Sell price</label>
              <input id="mat-sell" type="number" step="0.01" value="${material?.sell_price || 0}" />
            </div>
            <div>
              <label>Qty on hand</label>
              <input id="mat-qty" type="number" step="1" value="${material?.quantity_on_hand || 0}" />
            </div>
          </div>
          <label>Minimum quantity - flags for restocking below this</label>
          <input id="mat-minimum" type="number" step="1" value="${material?.minimum_quantity || 0}" />
          <label>Notes</label>
          <textarea id="mat-notes" style="min-height:60px;">${material?.notes || ''}</textarea>
          <div style="margin-top:14px; display:flex; justify-content:space-between;">
            <div>
              <button id="mat-save-btn">Save</button>
              <button type="button" class="secondary" id="mat-cancel-btn">Cancel</button>
            </div>
            ${material ? `<button type="button" class="secondary" id="mat-delete-btn" style="color:var(--red);">Delete</button>` : ''}
          </div>
          <div id="mat-msg"></div>
        </div>`;
      document.body.appendChild(overlay);

      overlay.querySelector('#mat-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#mat-save-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#mat-msg');
        const name = overlay.querySelector('#mat-name').value.trim();
        if (!name) { msg.innerHTML = `<div class="error-box">Name is required.</div>`; return; }
        const fields = {
          name,
          category: overlay.querySelector('#mat-category').value.trim() || null,
          supplier_id: overlay.querySelector('#mat-supplier').value || null,
          cost_price: parseFloat(overlay.querySelector('#mat-cost').value) || 0,
          sell_price: parseFloat(overlay.querySelector('#mat-sell').value) || 0,
          quantity_on_hand: parseFloat(overlay.querySelector('#mat-qty').value) || 0,
          minimum_quantity: parseFloat(overlay.querySelector('#mat-minimum').value) || 0,
          notes: overlay.querySelector('#mat-notes').value.trim() || null,
        };
        const { error } = material
          ? await supabaseClient.from('materials').update(fields).eq('id', material.id)
          : await supabaseClient.from('materials').insert(fields);
        if (error) { msg.innerHTML = `<div class="error-box">${error.message}</div>`; return; }
        overlay.remove();
        await loadMaterials();
      });

      if (material) {
        overlay.querySelector('#mat-delete-btn').addEventListener('click', async () => {
          if (!confirm(`Delete ${material.name}?`)) return;
          const { error } = await supabaseClient.from('materials').delete().eq('id', material.id);
          if (error) { alert(error.message); return; }
          overlay.remove();
          await loadMaterials();
        });
      }
    }

    document.getElementById('add-material-btn').addEventListener('click', () => openMaterialPanel(null));

    document.getElementById('create-stock-po-btn').addEventListener('click', openCreateStockPoPanel);

    async function openCreateStockPoPanel() {
      const { data: suppliers } = await supabaseClient.from('suppliers').select('id, name').order('name');
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:560px; width:100%; max-height:90vh; overflow-y:auto;">
          <h2>Create purchase order for Stock</h2>
          <label style="margin-top:0">Supplier</label>
          <select id="csp-supplier"><option value="">-- Select --</option>${(suppliers || []).map(s => `<option value="${s.id}">${s.name}</option>`).join('')}</select>
          <label style="margin-top:14px;">Items</label>
          <div id="csp-items"></div>
          <button type="button" class="secondary" id="csp-add-line-btn" style="font-size:12px; padding:6px 10px;">+ Add item</button>
          <div style="margin-top:14px;">
            <button id="csp-save-btn">Create PO</button>
            <button type="button" class="secondary" id="csp-cancel-btn">Cancel</button>
          </div>
          <div id="csp-msg"></div>
        </div>`;
      document.body.appendChild(overlay);

      function addLineRow() {
        const row = document.createElement('div');
        row.className = 'csp-line';
        row.style.cssText = 'display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:6px; margin-bottom:6px;';
        row.innerHTML = `
          <select class="csp-line-material" style="font-size:13px;">${allMaterials.map(m => `<option value="${m.id}" data-cost="${m.cost_price}">${m.name}</option>`).join('')}</select>
          <input class="csp-line-qty" type="number" step="1" value="1" placeholder="Qty" style="font-size:13px;" />
          <input class="csp-line-cost" type="number" step="0.01" value="${allMaterials[0]?.cost_price || 0}" placeholder="Unit cost" style="font-size:13px;" />
          <button type="button" class="secondary csp-remove-line" style="padding:6px 10px; font-size:12px;">&times;</button>`;
        overlay.querySelector('#csp-items').appendChild(row);
        row.querySelector('.csp-remove-line').addEventListener('click', () => row.remove());
        row.querySelector('.csp-line-material').addEventListener('change', (e) => {
          row.querySelector('.csp-line-cost').value = e.target.selectedOptions[0].dataset.cost || 0;
        });
      }
      addLineRow();
      overlay.querySelector('#csp-add-line-btn').addEventListener('click', addLineRow);

      overlay.querySelector('#csp-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#csp-save-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#csp-msg');
        const supplierId = overlay.querySelector('#csp-supplier').value;
        if (!supplierId) { msg.innerHTML = `<div class="error-box">Pick a supplier.</div>`; return; }

        try {
          const { data: { user } } = await supabaseClient.auth.getUser();
          const supplierName = overlay.querySelector('#csp-supplier').selectedOptions[0].textContent;

          const { data: newPo, error: poErr } = await supabaseClient.from('purchase_orders').insert({
            project_id: null, supplier_id: supplierId, supplier_name: supplierName,
            po_number: await drawNextPoNumber(),
            po_type: 'fixed', locked: true, status: 'ordered', amount: 0,
            description: 'Stock purchase order',
          }).select('id').single();
          if (poErr) throw poErr;

          const lines = [...overlay.querySelectorAll('.csp-line')].map(row => ({
            po_id: newPo.id,
            material_id: row.querySelector('.csp-line-material').value,
            description: row.querySelector('.csp-line-material').selectedOptions[0].textContent,
            quantity: parseFloat(row.querySelector('.csp-line-qty').value) || 0,
            unit_cost: parseFloat(row.querySelector('.csp-line-cost').value) || 0,
            added_by: user.id,
          })).filter(l => l.quantity > 0);
          if (lines.length) {
            const { error: liErr } = await supabaseClient.from('purchase_order_line_items').insert(lines);
            if (liErr) throw liErr;
          }

          overlay.remove();
          await loadStockPOs();
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        }
      });
    }

    document.getElementById('suggest-restock-btn').addEventListener('click', openRestockPanel);

    async function openRestockPanel() {
      const belowMinimum = allMaterials.filter(m => Number(m.minimum_quantity) > 0 && Number(m.quantity_on_hand) < Number(m.minimum_quantity));

      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      document.body.appendChild(overlay);

      if (!belowMinimum.length) {
        overlay.innerHTML = `<div class="card" style="max-width:400px; width:100%;"><h2>Nothing needs restocking</h2><p class="subtitle">No materials are below their minimum quantity.</p><button type="button" class="secondary" id="rk-close-btn">Close</button></div>`;
        overlay.querySelector('#rk-close-btn').addEventListener('click', () => overlay.remove());
        return;
      }

      const { data: materialsWithSupplier } = await supabaseClient.from('materials').select('id, name, cost_price, supplier_id, quantity_on_hand, minimum_quantity, suppliers(name)').in('id', belowMinimum.map(m => m.id));

      const grouped = {}; // supplier_id -> { supplierName, items: [] }
      const noSupplier = [];
      (materialsWithSupplier || []).forEach(m => {
        const shortfall = Number(m.minimum_quantity) - Number(m.quantity_on_hand);
        const item = { materialId: m.id, description: m.name, quantity: shortfall, unit_cost: m.cost_price };
        if (m.supplier_id) {
          if (!grouped[m.supplier_id]) grouped[m.supplier_id] = { supplierName: m.suppliers?.name || 'Unknown', items: [] };
          grouped[m.supplier_id].items.push(item);
        } else {
          noSupplier.push(item);
        }
      });

      overlay.style.overflowY = 'auto';
      overlay.innerHTML = `
        <div class="card" style="max-width:640px; width:100%; max-height:90vh; overflow-y:auto;">
          <h2>Suggested restock POs</h2>
          <p class="subtitle" style="margin-bottom:14px;">Below minimum quantity - nothing's created yet, review then confirm.</p>

          ${Object.entries(grouped).map(([supplierId, group]) => `
            <div class="rk-group" data-supplier-id="${supplierId}" style="border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px;">
              <label style="margin-top:0; display:flex; align-items:center; gap:8px;"><input type="checkbox" class="rk-include" checked style="width:auto;" /><strong>${group.supplierName}</strong></label>
              ${group.items.map(item => `<div style="font-size:13px; display:flex; justify-content:space-between; padding:4px 0;"><span>${item.description} x${item.quantity}</span><span>${money(item.quantity * item.unit_cost)}</span></div>`).join('')}
              <p class="subtitle" style="margin-top:6px;">Total: ${money(group.items.reduce((s, i) => s + i.quantity * i.unit_cost, 0))}</p>
            </div>`).join('')}

          ${noSupplier.length ? `
            <div style="border:1px solid var(--red); border-radius:8px; padding:12px; margin-bottom:10px;">
              <p style="margin:0 0 8px; color:var(--red); font-weight:600;">No supplier assigned - can't include in a PO</p>
              ${noSupplier.map(item => `<div style="font-size:13px; padding:4px 0;">${item.description} x${item.quantity} - assign a supplier on this material first</div>`).join('')}
            </div>` : ''}

          <div style="margin-top:14px;">
            <button id="rk-confirm-btn">Create purchase orders</button>
            <button type="button" class="secondary" id="rk-cancel-btn">Cancel</button>
          </div>
          <div id="rk-msg"></div>
        </div>`;

      overlay.querySelector('#rk-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#rk-confirm-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#rk-msg');
        const confirmBtn = overlay.querySelector('#rk-confirm-btn');
        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Creating...';
        try {
          const { data: { user } } = await supabaseClient.auth.getUser();
          let created = 0;
          for (const groupEl of overlay.querySelectorAll('.rk-group')) {
            if (!groupEl.querySelector('.rk-include').checked) continue;
            const supplierId = groupEl.dataset.supplierId;
            const group = grouped[supplierId];
            const { data: newPo, error: poErr } = await supabaseClient.from('purchase_orders').insert({
              project_id: null, supplier_id: supplierId, supplier_name: group.supplierName,
              po_number: await drawNextPoNumber(),
              po_type: 'fixed', locked: true, status: 'ordered', amount: 0,
              description: 'Restock - below minimum quantity',
            }).select('id').single();
            if (poErr) throw poErr;
            await supabaseClient.from('purchase_order_line_items').insert(
              group.items.map(item => ({ po_id: newPo.id, material_id: item.materialId, description: item.description, quantity: item.quantity, unit_cost: item.unit_cost, added_by: user.id }))
            );
            created++;
          }
          overlay.remove();
          alert(`Created ${created} restock purchase order${created === 1 ? '' : 's'}.`);
          await loadStockPOs();
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
          confirmBtn.disabled = false;
          confirmBtn.textContent = 'Create purchase orders';
        }
      });
    }

    async function loadStockPOs() {
      const listEl = document.getElementById('stock-pos-list');
      const { data: pos, error } = await supabaseClient
        .from('purchase_orders')
        .select('*, purchase_order_line_items(*), suppliers(name)')
        .is('project_id', null)
        .order('created_at', { ascending: false });
      if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }
      if (!pos.length) { listEl.innerHTML = `<p class="subtitle">No stock purchase orders yet.</p>`; return; }

      listEl.innerHTML = pos.map(po => {
        const items = po.purchase_order_line_items || [];
        const total = items.length ? items.reduce((s, li) => s + Number(li.quantity) * Number(li.unit_cost), 0) : Number(po.amount) || 0;
        return `
          <div style="border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px;">
            <div style="display:flex; justify-content:space-between;">
              <strong>${po.suppliers?.name || po.supplier_name || 'Unknown supplier'}${po.po_number ? ' (' + po.po_number + ')' : ''}</strong>
              <span class="badge ${po.received ? 'accepted' : 'draft'}">${po.received ? 'Fully received' : po.status}</span>
            </div>
            <p class="subtitle" style="margin:4px 0 8px;">${po.description || ''} - ${money(total)}</p>
            ${renderPoLineItemsReceivable(po, true)}
            ${po.supplier_id && !po.received ? `<button type="button" class="secondary upload-invoice-btn" data-po-id="${po.id}" style="font-size:12px; padding:6px 10px; margin-top:8px;">Upload invoice</button>` : ''}
          </div>`;
      }).join('');

      listEl.querySelectorAll('.upload-invoice-btn').forEach(btn => {
        btn.addEventListener('click', () => uploadInvoiceForPo(pos.find(p => p.id === btn.dataset.poId)));
      });

      wireReceiveLineItemButtons(
        listEl,
        pos,
        () => 'warehouse', // POs on this page default to Warehouse
        async () => { await loadStockPOs(); await loadMaterials(); }
      );
    }

    document.getElementById('upload-pricelist-btn').addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.pdf,.jpg,.jpeg,.png';
      input.onchange = async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
        overlay.innerHTML = `<div class="card" style="max-width:400px; width:100%;"><p class="subtitle">Reading the price list - this can take a little longer for a long document...</p></div>`;
        document.body.appendChild(overlay);
        try {
          const data = await runBackgroundExtraction('pricelist', 'extract-pricelist-background', file, file.type);
          overlay.remove();
          await resolveSupplierAndHandoff(data.supplier, 'pricelist', { items: data.items }, file);
        } catch (err) {
          overlay.querySelector('.card').innerHTML = `<h2>Couldn't read that price list</h2><div class="error-box">${err.message}</div><button type="button" class="secondary" id="sp-close">Close</button>`;
          overlay.querySelector('#sp-close').addEventListener('click', () => overlay.remove());
        }
      };
      input.click();
    });

    (async function () {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();
      renderMainNav('stock');
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });
      const { data: suppliersData } = await supabaseClient.from('suppliers').select('id, name').order('name');
      allSuppliers = suppliersData || [];
      await loadMaterials();
      await loadStockPOs();
    })();
