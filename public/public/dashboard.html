<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('te-theme') || 'dark');</script>
<title>Projects - Thomson Energy</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=3" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="topbar">
    <nav class="topbar-tabs">
      <a href="/leads.html" class="topbar-tab">Leads<span class="tab-total">&mdash;</span></a>
      <a href="/sales.html" class="topbar-tab">Sales<span class="tab-total">&mdash;</span></a>
      <a href="/quotes.html" class="topbar-tab">Quotes<span class="tab-total">&mdash;</span></a>
      <a href="/dashboard.html" class="topbar-tab active">Projects<span class="tab-total">&mdash;</span></a>
      <a href="/invoices.html" class="topbar-tab">Invoices<span class="tab-total">&mdash;</span></a>
      <a href="/purchase-orders.html" class="topbar-tab">Purchase Orders<span class="tab-total">&mdash;</span></a>
      <a href="/timesheets.html" class="topbar-tab">Timesheets<span class="tab-total">&mdash;</span></a>
    </nav>
    <div class="topbar-right">
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/dashboard.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="wrap wide">
    <h1>Job pipeline</h1>
    <p class="subtitle">Every project, left to right through its lifecycle. Move a card manually for now — automatic stage changes come online in later phases.</p>

    <div id="board" class="pipeline-board">
      <p class="subtitle">Loading...</p>
    </div>
  </div>

  <script src="/js/supabase-client.js"></script>
  <script src="/js/theme.js"></script>
  <script>
    const STAGES = [
      { key: 'lead',              label: 'Lead' },
      { key: 'draft_quote',       label: 'Draft Quote' },
      { key: 'quote_approved',    label: 'Quote Approved' },
      { key: 'deposit_paid',      label: 'Deposit Paid' },
      { key: 'ready_to_book',     label: 'Ready to Book' },
      { key: 'job_booked',        label: 'Job Booked' },
      { key: 'job_not_complete',  label: 'Job Not Complete' },
      { key: 'client_handover',   label: 'Client Handover' },
      { key: 'awaiting_payment',  label: 'Awaiting Payment' },
    ];
    // Archived sits off-board per the spec — it's a valid stage value but
    // doesn't get its own column here.

    (async function () {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();

      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });

      const { data: projects, error } = await supabaseClient
        .from('projects')
        .select('id, name, client_name, pipeline_stage')
        .neq('pipeline_stage', 'archived')
        .order('created_at', { ascending: false });

      const board = document.getElementById('board');

      if (error) {
        board.innerHTML = `<div class="error-box">${error.message}${error.message.includes('pipeline_stage') ? ' — looks like migration_006 hasn\'t been run against this database yet.' : ''}</div>`;
        return;
      }

      const byStage = {};
      STAGES.forEach(s => byStage[s.key] = []);
      (projects || []).forEach(p => {
        const stage = byStage[p.pipeline_stage] ? p.pipeline_stage : 'lead';
        byStage[stage].push(p);
      });

      board.innerHTML = STAGES.map(stage => `
        <div class="pipeline-column">
          <div class="pipeline-column-header">
            <span>${stage.label}</span>
            <span class="count">${byStage[stage.key].length}</span>
          </div>
          <div class="pipeline-column-body">
            ${byStage[stage.key].length ? byStage[stage.key].map(p => cardHtml(p)).join('') : `<div class="pipeline-column-empty">No projects here</div>`}
          </div>
        </div>
      `).join('');

      function cardHtml(p) {
        return `
          <div class="pipeline-card" data-id="${p.id}">
            <a class="name" href="/project.html?id=${p.id}">${p.name}</a>
            <div class="client">${p.client_name || ''}</div>
            <select class="stage-select" data-id="${p.id}">
              ${STAGES.map(s => `<option value="${s.key}" ${s.key === p.pipeline_stage ? 'selected' : ''}>${s.label}</option>`).join('')}
              <option value="archived" ${p.pipeline_stage === 'archived' ? 'selected' : ''}>Archived</option>
            </select>
          </div>`;
      }

      board.querySelectorAll('.stage-select').forEach(sel => {
        sel.addEventListener('change', async () => {
          const id = sel.dataset.id;
          const newStage = sel.value;
          sel.disabled = true;
          const { error: updateErr } = await supabaseClient
            .from('projects')
            .update({ pipeline_stage: newStage })
            .eq('id', id);
          if (updateErr) {
            alert('Could not move this card: ' + updateErr.message);
            sel.disabled = false;
            return;
          }
          // Re-render so the card lands in its new column.
          location.reload();
        });
      });
    })();
  </script>
</body>
</html>
