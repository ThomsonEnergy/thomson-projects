<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('te-theme') || (matchMedia('(pointer: coarse)').matches ? 'dark' : 'navy'));</script>
<title>Staff profile - Thomson Energy</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=16" />
<link rel="stylesheet" href="/css/hr.css?v=1" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .staff-head { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
  .staff-avatar { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; background: var(--surface-2); }
  .staff-avatar-fallback { width: 72px; height: 72px; border-radius: 50%; background: var(--accent-dim); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 22px; }
</style>
</head>
<body>
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('mobile-menu-dropdown').classList.toggle('open')">&#9776;</button>
    <div class="mobile-menu-dropdown" id="mobile-menu-dropdown"></div>
    <nav class="topbar-tabs" id="topbar-tabs"></nav>
    <div class="topbar-right">
      <a href="/schedule.html" class="topbar-icon-link" title="Schedule">&#128197;</a>
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/home.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="wrap wide">
    <p style="margin:0 0 10px;"><a class="link-quiet" href="/team.html">&larr; Team</a></p>
    <div id="content"><p class="subtitle">Loading...</p></div>
  </div>

  <script src="/js/supabase-client.js?v=68"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/hr-templates.js?v=2"></script>
  <script src="/js/hr-shared.js?v=1"></script>
  <script src="/js/staff-editor.js?v=2"></script>
  <script>
    // Staff profile: everything about one team member in one place, laid out
    // like a job (tabs for overview, documents, photos, letters, incidents
    // and KPIs). Admin and finance only - the tables behind it (migrations
    // 147 and 148) are locked to is_finance_role() at the database level too.
    // Letters and incidents use the shared workflow in hr-shared.js.
    let staffId = new URLSearchParams(location.search).get('id');
    // selfView: a staff member looking at their own card (read only, no HR files,
    // photos, incidents or drafts - the database hides those from them anyway).
    let selfView = false;
    const ROLE_LABELS = { admin: 'Admin', finance: 'Finance', sales: 'Sales', staff: 'Staff' };
    const EMPLOYMENT_LABELS = { full_time: 'Full-time', part_time: 'Part-time', casual: 'Casual' };
    const KPI_STATUS_LABELS = { active: 'In progress', met: 'Met', not_met: 'Not met', cancelled: 'Cancelled' };
    const KPI_STATUS_BADGE = { active: 'sent', met: 'accepted', not_met: 'red', cancelled: 'draft' };

    let person = null, staffEmail = '';
    let letters = [], incidentLinks = [], kpis = [], files = [];

    const fmtDate = (d) => d ? new Date(/^\d{4}-\d{2}-\d{2}$/.test(d) ? d + 'T00:00:00' : d).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
    const val = (root, sel) => { const el = root.querySelector(sel); return el ? el.value.trim() : ''; };
    const orNull = (v) => (v === '' ? null : v);
    const personRef = () => ({ id: person.id, full_name: person.full_name, job_title: person.job_title });

    // ---------- Loading ----------
    async function loadPerson() {
      const [{ data: profile, error }, { data: sensitive }, { data: licences }, { data: contract }] = await Promise.all([
        supabaseClient.from('profiles').select(`id, full_name, role, active, job_title, mobile_number, notes, photo_url, created_at,
          employment_type, employment_start_date, pay_type, has_company_vehicle, has_probationary_period,
          emergency_contact_name, emergency_contact_relationship, onboarding_completed_at, onboarding_reissue_reason, xero_payroll_status`)
          .eq('id', staffId).single(),
        supabaseClient.from('profiles_sensitive_secure').select('*').eq('id', staffId).maybeSingle(),
        supabaseClient.from('profile_licences').select('*').eq('profile_id', staffId).order('expiry_date'),
        supabaseClient.from('employee_contracts').select('status, updated_at').eq('profile_id', staffId).maybeSingle(),
      ]);
      if (error) throw error;
      // The signed contract itself: the latest signature on the contract template.
      const { data: tmpl } = await supabaseClient.from('onboarding_documents').select('id').eq('is_contract', true).maybeSingle();
      const contractSig = tmpl ? (await supabaseClient.from('onboarding_document_signatures').select('id, signed_at, file_path, document_title_snapshot')
        .eq('profile_id', staffId).eq('document_id', tmpl.id).order('signed_at', { ascending: false }).limit(1).maybeSingle()).data : null;
      person = Object.assign(profile, sensitive || {}, { licences: licences || [], contract, contractSig });
      person.address_full = [person.residential_address, person.residential_suburb, person.residential_state, person.residential_postcode].filter(Boolean).join(', ');
    }

    async function loadEmail() {
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        const res = await fetch('/.netlify/functions/list-staff-emails', { headers: { Authorization: `Bearer ${session.access_token}` } });
        const json = await res.json();
        staffEmail = (res.ok && json.ok ? json.emails : []).find(e => e.id === staffId)?.email || '';
      } catch { staffEmail = ''; }
    }

    async function loadRecords() {
      const [w, i, k, f] = await Promise.all([
        supabaseClient.from('staff_warnings').select('*').eq('profile_id', staffId).order('issued_date', { ascending: false }),
        supabaseClient.from('incident_people').select('id, role, at_fault, what_happened, finding, incident:incident_reports(*)').eq('profile_id', staffId),
        supabaseClient.from('staff_kpis').select('*').eq('profile_id', staffId).order('created_at', { ascending: false }),
        supabaseClient.from('staff_files').select('*').eq('profile_id', staffId).order('created_at', { ascending: false }),
      ]);
      const firstErr = [w, i, k, f].find(r => r.error);
      if (firstErr) throw new Error(firstErr.error.message);
      letters = w.data || []; kpis = k.data || []; files = f.data || [];
      incidentLinks = (i.data || []).filter(x => x.incident).sort((a, b) => (b.incident.incident_date || '').localeCompare(a.incident.incident_date || ''));
    }
    async function reloadLetters() {
      letters = (await supabaseClient.from('staff_warnings').select('*').eq('profile_id', staffId).order('issued_date', { ascending: false })).data || [];
      refreshAll();
    }

    // ---------- Shell ----------
    function renderShell() {
      const initials = (person.full_name || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
      document.title = `${person.full_name || 'Staff'} - Thomson Energy`;
      document.getElementById('content').innerHTML = `
        <div class="staff-head">
          ${person.photo_url ? `<img class="staff-avatar" src="${escapeHtml(person.photo_url)}" alt="" />` : `<div class="staff-avatar-fallback">${escapeHtml(initials)}</div>`}
          <div style="flex:1; min-width:200px;">
            <h1 style="margin:0;">${escapeHtml(person.full_name || 'Unnamed')}</h1>
            <p class="subtitle" style="margin:2px 0 0;">${escapeHtml(person.job_title || ROLE_LABELS[person.role] || person.role)}
              &middot; <span class="badge draft">${escapeHtml(ROLE_LABELS[person.role] || person.role)}</span>
              ${person.active ? '' : ' &middot; <span class="badge red">Inactive</span>'}</p>
          </div>
          ${selfView ? '' : `<div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" class="secondary" id="head-new-letter">New letter</button>
            <button type="button" class="secondary" id="head-new-incident">Log incident</button>
            ${HR.myRole === 'admin' ? '<button type="button" id="head-edit">Edit employee</button>' : ''}
          </div>`}
        </div>

        <div class="settings-tabs" id="staff-tabs" style="flex-direction:row; position:static; border-bottom:1px solid var(--border); margin-bottom:20px; overflow-x:auto;">
          <button class="settings-tab active" data-panel="overview">Overview</button>
          <button class="settings-tab" data-panel="documents">Documents</button>
          ${selfView ? '' : '<button class="settings-tab" data-panel="photos">Photos</button>'}
          <button class="settings-tab" data-panel="warnings">Letters<span class="tab-count" id="count-warnings"></span></button>
          <button class="settings-tab" data-panel="incidents" ${selfView ? 'style="display:none;"' : ''}>Incidents<span class="tab-count" id="count-incidents"></span></button>
          <button class="settings-tab" data-panel="kpis">KPIs</button>
        </div>

        <div class="settings-panel active" id="panel-overview"></div>
        <div class="settings-panel" id="panel-documents">
          <div class="card" ${selfView ? 'style="display:none;"' : ''}>
            <h2>Employment documents</h2>
            <p class="subtitle" style="margin-bottom:12px;">Make a document from this person's record, or view a blank template to print and fill in by hand.</p>
            <div id="employment-docs"></div>
          </div>
          <div class="card">
            <h2>Signed onboarding documents</h2>
            <div id="signed-docs-list"><p class="subtitle">Loading...</p></div>
          </div>
          <div class="card" ${selfView ? 'style="display:none;"' : ''}>
            <h2>HR files</h2>
            <p class="subtitle" style="margin-bottom:12px;">Certificates, references, medical certificates, anything else for their personnel file. Only admin and finance can open these.</p>
            <div id="doc-folder-pills" style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px;"></div>
            <div id="hr-files-list"></div>
            <div style="display:flex; gap:8px; align-items:center; margin-top:14px; flex-wrap:wrap;">
              <select id="doc-folder-select" style="flex:1; min-width:150px;"></select>
              <span class="subtitle">or</span>
              <input id="doc-new-folder" placeholder="New folder name" style="flex:1; min-width:150px;" />
            </div>
            <input type="file" id="doc-file-input" multiple style="margin-top:8px;" />
            <div id="doc-upload-msg"></div>
          </div>
        </div>
        <div class="settings-panel" id="panel-photos">
          <div class="card">
            <h2>Photos</h2>
            <p class="subtitle" style="margin-bottom:12px;">ID photos, PPE or uniform checks, vehicle condition. Private to admin and finance. Incident photos go on the incident.</p>
            <input type="file" id="photo-file-input" accept="image/*" multiple />
            <div id="photo-upload-msg"></div>
            <div id="photos-list" class="photo-grid" style="margin-top:14px;"></div>
          </div>
        </div>
        <div class="settings-panel" id="panel-warnings">
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
              <h2 style="margin:0;">Letters and warnings</h2>
              <div ${selfView ? 'style="display:none;"' : ''}><button type="button" class="secondary" id="blank-warning-btn">Blank template</button> <button type="button" id="new-warning-btn">+ New letter</button></div>
            </div>
            <p class="subtitle" style="margin-bottom:12px;">${selfView ? 'Letters sent to you by management. Open one to read it, add comments and sign it.' : `Draft it, meet with them (they can bring a support person), then sign and issue it here. They sign on this device in the meeting, or you send it to their app. Mark it resolved once things have improved.`}</p>
            <div id="warnings-list"></div>
          </div>
        </div>
        <div class="settings-panel" id="panel-incidents">
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
              <h2 style="margin:0;">Incidents they're part of</h2>
              <div><a class="btn secondary" href="/incidents.html">Incident register</a> <button type="button" id="new-incident-btn">+ Log incident</button></div>
            </div>
            <div id="incidents-list"></div>
          </div>
        </div>
        <div class="settings-panel" id="panel-kpis">
          <div class="card">
            <h2>At a glance</h2>
            <div id="kpi-stats" class="stat-tiles"><p class="subtitle">Loading...</p></div>
          </div>
          <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
              <h2 style="margin:0;">KPIs</h2>
              <button type="button" id="new-kpi-btn" ${selfView ? 'style="display:none;"' : ''}>+ Add KPI</button>
            </div>
            <div id="kpis-list"></div>
          </div>
        </div>`;

      document.querySelectorAll('#staff-tabs .settings-tab').forEach(btn => btn.addEventListener('click', () => showTab(btn.dataset.panel)));
      const newLetter = () => hrOpenLetterEditor({ person: personRef(), onSaved: async () => { await reloadLetters(); showTab('warnings'); } });
      const headEdit = document.getElementById('head-edit');
      if (headEdit) headEdit.addEventListener('click', openEditor);
      if (!selfView) {
        document.getElementById('head-new-letter').addEventListener('click', newLetter);
        document.getElementById('head-new-incident').addEventListener('click', () => hrNewIncident({ preselect: [staffId] }));
      }
      document.getElementById('new-warning-btn').addEventListener('click', newLetter);
      document.getElementById('new-incident-btn').addEventListener('click', () => hrNewIncident({ preselect: [staffId] }));
      document.getElementById('blank-warning-btn').addEventListener('click', () => showHrDocument(writtenWarningHtml({}, {}, HR.company), 'Blank written warning'));
      document.getElementById('new-kpi-btn').addEventListener('click', () => openKpiEditor(null));
      document.getElementById('doc-file-input').addEventListener('change', uploadHrFiles);
      if (!selfView) document.getElementById('photo-file-input').addEventListener('change', uploadPhotosToProfile);

      const tab = new URLSearchParams(location.search).get('tab');
      if (tab && document.getElementById('panel-' + tab)) showTab(tab);
    }

    // Details, rates, allowances, licences, employment terms, onboarding
    // re-issue and the contract (staff-editor.js). Admin only.
    function openEditor() {
      const reload = async () => { await loadPerson(); renderShell(); refreshAll(); renderEmploymentDocs(); renderHrFiles(); renderPhotos(); loadSignedDocs(); };
      openStaffEditor(staffId, { onSaved: reload, onClosed: reload });
    }

    function showTab(panel) {
      document.querySelectorAll('#staff-tabs .settings-tab').forEach(b => b.classList.toggle('active', b.dataset.panel === panel));
      document.querySelectorAll('.settings-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + panel));
      const url = new URL(location.href); url.searchParams.set('tab', panel); history.replaceState(null, '', url);
    }

    function renderCounts() {
      const live = letters.filter(w => w.letter_type !== 'counselling' && warningIsLive(w)).length;
      const c = document.getElementById('count-warnings');
      c.textContent = live || ''; c.style.display = live ? '' : 'none'; c.title = 'Live warnings';
      const ci = document.getElementById('count-incidents');
      ci.textContent = incidentLinks.length || ''; ci.style.display = incidentLinks.length ? '' : 'none';
    }

    // ---------- Overview ----------
    function serviceLength(start) {
      if (!start) return '';
      const months = Math.floor((Date.now() - new Date(start + 'T00:00:00')) / (30.44 * 86400000));
      if (months < 0) return 'starts soon';
      const y = Math.floor(months / 12), m = months % 12;
      return [y ? `${y} yr${y === 1 ? '' : 's'}` : '', m || !y ? `${m} mth${m === 1 ? '' : 's'}` : ''].filter(Boolean).join(' ');
    }

    // Contract status, with the signed copy when there is one.
    function contractHtml(p) {
      if (!p.contract) return '<span class="subtitle">Not generated</span>';
      const signed = p.contract.status === 'signed' && p.contractSig;
      return `<span class="badge ${p.contract.status === 'signed' ? 'accepted' : p.contract.status === 'ready_to_sign' ? 'sent' : 'draft'}">${p.contract.status.replace(/_/g, ' ')}</span>`
        + (signed ? ` <span class="subtitle">${fmtDate(p.contractSig.signed_at)}</span>${p.contractSig.file_path ? ' <button type="button" class="secondary contract-pdf" style="font-size:12px; padding:3px 9px;">View signed contract</button>' : ''}` : '');
    }
    function wireContractPdf(root) {
      root.querySelectorAll('.contract-pdf').forEach(b => b.addEventListener('click', () => openPdfViewer(person.contractSig.file_path, person.contractSig.document_title_snapshot || 'Employment contract')));
    }

    function renderOverview() {
      const p = person;
      const contractBadge = contractHtml(p);
      const live = letters.filter(w => w.letter_type !== 'counselling' && warningIsLive(w));
      const unsigned = letters.filter(w => w.status === 'issued' && !w.employee_signed_at && !w.refused_to_sign).length;
      document.getElementById('panel-overview').innerHTML = `
        <div class="grid cols-2" style="align-items:start;">
          <div class="card" style="margin:0;">
            <h2>Contact &amp; employment</h2>
            <dl class="kv">
              <dt>Mobile</dt><dd>${p.mobile_number ? `<a class="link-quiet" href="tel:${escapeHtml(p.mobile_number)}">${escapeHtml(p.mobile_number)}</a>` : '-'}</dd>
              <dt>Email</dt><dd>${staffEmail ? `<a class="link-quiet" href="mailto:${escapeHtml(staffEmail)}">${escapeHtml(staffEmail)}</a>` : '-'}</dd>
              <dt>Position</dt><dd>${escapeHtml(p.job_title || '-')}</dd>
              <dt>Employment type</dt><dd>${EMPLOYMENT_LABELS[p.employment_type] || '-'}</dd>
              <dt>Start date</dt><dd>${fmtDate(p.employment_start_date)}${p.employment_start_date ? ` <span class="subtitle">(${serviceLength(p.employment_start_date)})</span>` : ''}</dd>
              <dt>Pay type</dt><dd>${p.pay_type === 'salary' ? 'Salary' : 'Hourly'}</dd>
              <dt>Company vehicle</dt><dd>${p.has_company_vehicle ? 'Yes' : 'No'}</dd>
              <dt>Probation</dt><dd>${p.has_probationary_period === false ? 'No' : 'Yes'}</dd>
            </dl>
          </div>
          <div class="card" style="margin:0;">
            <h2>Personal</h2>
            <dl class="kv">
              <dt>Date of birth</dt><dd>${fmtDate(p.date_of_birth)}</dd>
              <dt>Address</dt><dd>${escapeHtml(p.address_full || '-')}</dd>
              <dt>Emergency contact</dt><dd>${escapeHtml(p.emergency_contact_name || '-')}${p.emergency_contact_relationship ? ` <span class="subtitle">(${escapeHtml(p.emergency_contact_relationship)})</span>` : ''}</dd>
              <dt>Emergency phone</dt><dd>${p.emergency_contact_phone ? `<a class="link-quiet" href="tel:${escapeHtml(p.emergency_contact_phone)}">${escapeHtml(p.emergency_contact_phone)}</a>` : '-'}</dd>
            </dl>
            ${p.notes ? `<p class="subtitle" style="margin:12px 0 4px;">Notes</p><p style="white-space:pre-wrap; margin:0;">${escapeHtml(p.notes)}</p>` : ''}
          </div>
          <div class="card" style="margin:0;">
            <h2>Onboarding &amp; payroll</h2>
            <dl class="kv">
              <dt>Onboarding</dt><dd>${p.onboarding_completed_at ? `Completed ${fmtDate(p.onboarding_completed_at)}` : '<span class="badge amber">Not finished</span>'}</dd>
              <dt>Employment contract</dt><dd>${contractBadge}</dd>
              <dt>Xero Payroll</dt><dd>${escapeHtml(p.xero_payroll_status || '-')}</dd>
            </dl>
          </div>
          <div class="card" style="margin:0; ${selfView ? 'display:none;' : ''}">
            <h2>HR summary</h2>
            <dl class="kv">
              <dt>Live warnings</dt><dd>${live.length ? live.map(w => `${escapeHtml(letterTitle(w).toLowerCase())} (${escapeHtml(WARNING_CATEGORY_LABELS[w.category].toLowerCase())}) until ${fmtDate(warningExpiry(w))}`).join('<br>') : 'None'}</dd>
              <dt>Letters on file</dt><dd>${letters.length || 'None'}${unsigned ? ` <span class="badge amber">${unsigned} waiting for signature</span>` : ''}</dd>
              <dt>Incidents</dt><dd>${incidentLinks.length ? `${incidentLinks.length} (${incidentLinks.filter(x => x.incident.status === 'open').length} open)` : 'None'}</dd>
              <dt>KPIs in progress</dt><dd>${kpis.filter(k => k.status === 'active').length || 'None'}</dd>
            </dl>
          </div>
        </div>
        <div class="card">
          <h2>Licences</h2>
          ${p.licences.length ? `<table class="responsive-stack"><thead><tr><th>Licence</th><th>Number</th><th>Expiry</th><th></th></tr></thead><tbody>
            ${p.licences.map(l => `<tr>
              <td data-label="Licence">${escapeHtml(l.licence_name)}</td>
              <td data-label="Number">${escapeHtml(l.licence_number || '-')}</td>
              <td data-label="Expiry">${expiryBadge(l.expiry_date)}</td>
              <td data-label="">${l.file_path ? `<button type="button" class="secondary lic-view" data-path="${escapeHtml(l.file_path)}" data-title="${escapeHtml(l.licence_name)}" style="font-size:12px; padding:4px 10px;">View file</button>` : '<span class="subtitle" style="font-size:12px;">No file</span>'}</td>
            </tr>`).join('')}</tbody></table>` : '<p class="subtitle">No licences recorded. Add them on the Team page.</p>'}
        </div>`;
      wireContractPdf(document.getElementById('panel-overview'));
      document.querySelectorAll('#panel-overview .lic-view').forEach(b => b.addEventListener('click', async () => {
        try { await viewStoredFile(b.dataset.path, b.dataset.title); } catch (err) { alert(err.message); }
      }));
    }

    // ---------- Documents ----------
    function renderEmploymentDocs() {
      const p = person;
      const contractLine = 'Employment contract: ' + contractHtml(p);
      document.getElementById('employment-docs').innerHTML = `
        <div class="project-list-item">
          <div><div class="name">${contractLine}</div><div class="meta">Made from the contract template using their employment details, then signed by them in onboarding.</div></div>
          <div class="row-actions" style="white-space:nowrap;">${HR.myRole === 'admin' ? `<button type="button" class="secondary" id="doc-edit-contract">${p.contract ? 'Edit contract' : 'Generate contract'}</button>` : '<span class="subtitle" style="font-size:12px;">Admin only</span>'}</div>
        </div>
        <div class="project-list-item">
          <div><div class="name">Written warning or letter of counselling</div><div class="meta">Signed in the app by you and them, kept on the Letters tab.</div></div>
          <div class="row-actions" style="white-space:nowrap;"><button type="button" class="secondary" id="doc-blank-warning">Blank</button><button type="button" id="doc-new-warning">Create</button></div>
        </div>
        <div class="project-list-item">
          <div><div class="name">Incident and injury report (WHS Form 10)</div><div class="meta">Logged as an incident with everyone involved tagged.</div></div>
          <div class="row-actions" style="white-space:nowrap;"><button type="button" class="secondary" id="doc-blank-incident">Blank</button><button type="button" id="doc-new-incident">Create</button></div>
        </div>`;
      wireContractPdf(document.getElementById('employment-docs'));
      const editContract = document.getElementById('doc-edit-contract');
      if (editContract) editContract.addEventListener('click', openEditor);
      document.getElementById('doc-blank-warning').addEventListener('click', () => showHrDocument(writtenWarningHtml({}, {}, HR.company), 'Blank written warning'));
      document.getElementById('doc-new-warning').addEventListener('click', () => hrOpenLetterEditor({ person: personRef(), onSaved: async () => { await reloadLetters(); showTab('warnings'); } }));
      document.getElementById('doc-blank-incident').addEventListener('click', () => showHrDocument(incidentReportHtml({}, HR.company), 'Blank Form 10'));
      document.getElementById('doc-new-incident').addEventListener('click', () => hrNewIncident({ preselect: [staffId] }));
    }

    async function loadSignedDocs() {
      const el = document.getElementById('signed-docs-list');
      const { data: sigs, error } = await supabaseClient.from('onboarding_document_signatures')
        .select('id, document_title_snapshot, document_body_snapshot, signature_data_url, signed_by_name, signed_at, file_path')
        .eq('profile_id', staffId).order('signed_at', { ascending: false });
      if (error) { el.innerHTML = `<div class="error-box">${escapeHtml(error.message)}</div>`; return; }
      if (!sigs.length) { el.innerHTML = '<p class="subtitle">Nothing signed yet.</p>'; return; }
      el.innerHTML = sigs.map(s => `
        <div class="project-list-item">
          <div><div class="name">${escapeHtml(s.document_title_snapshot)}</div>
            <div class="meta">Signed ${fmtDate(s.signed_at)} as ${escapeHtml(s.signed_by_name)}</div></div>
          <div class="row-actions" style="white-space:nowrap;">
            ${s.file_path ? `<button type="button" class="secondary sig-pdf" data-id="${s.id}">View PDF</button>` : ''}
            <button type="button" class="secondary sig-view" data-id="${s.id}">View</button>
          </div>
        </div>`).join('');
      el.querySelectorAll('.sig-pdf').forEach(b => b.addEventListener('click', () => {
        const s = sigs.find(x => x.id === b.dataset.id); openPdfViewer(s.file_path, s.document_title_snapshot);
      }));
      el.querySelectorAll('.sig-view').forEach(b => b.addEventListener('click', () => {
        const s = sigs.find(x => x.id === b.dataset.id);
        const o = hrModal(`
          <h2>${escapeHtml(s.document_title_snapshot)}</h2>
          <p class="subtitle" style="margin-bottom:10px;">Signed ${new Date(s.signed_at).toLocaleString('en-AU')} as ${escapeHtml(s.signed_by_name)}, shown exactly as it was at the time.</p>
          <div style="white-space:pre-wrap; line-height:1.6; max-height:50vh; overflow-y:auto; padding:14px; background:var(--surface-2); border-radius:8px;">${escapeHtml(s.document_body_snapshot)}</div>
          ${s.signature_data_url ? `<img src="${s.signature_data_url}" style="max-width:200px; margin-top:10px; background:#fff; border-radius:6px;" />` : ''}
          <div style="margin-top:14px;"><button type="button" class="secondary close-btn">Close</button></div>`);
        o.querySelector('.close-btn').addEventListener('click', () => o.remove());
      }));
    }

    let activeFolder = 'All';
    function renderHrFiles() {
      const docs = files.filter(f => f.kind === 'document');
      const folders = [...new Set(['General', ...docs.map(d => d.folder)])].sort();
      document.getElementById('doc-folder-select').innerHTML = folders.map(f => `<option value="${escapeHtml(f)}">${escapeHtml(f)}</option>`).join('');
      document.getElementById('doc-folder-pills').innerHTML = ['All', ...folders.filter(f => docs.some(d => d.folder === f))].map(f =>
        `<button type="button" class="${f === activeFolder ? '' : 'secondary'} folder-pill" data-folder="${escapeHtml(f)}" style="font-size:12px; padding:4px 10px;">${escapeHtml(f)}</button>`).join('');
      document.querySelectorAll('.folder-pill').forEach(b => b.addEventListener('click', () => { activeFolder = b.dataset.folder; renderHrFiles(); }));
      const shown = docs.filter(d => activeFolder === 'All' || d.folder === activeFolder);
      const el = document.getElementById('hr-files-list');
      el.innerHTML = shown.length ? shown.map(d => `
        <div class="project-list-item">
          <div><div class="name">${escapeHtml(d.title || d.file_name)}</div><div class="meta">${escapeHtml(d.folder)} &middot; added ${fmtDate(d.created_at)}</div></div>
          <div class="row-actions" style="white-space:nowrap;">
            <button type="button" class="secondary file-view" data-id="${d.id}">View</button>
            <button type="button" class="secondary file-del" data-id="${d.id}">Delete</button>
          </div>
        </div>`).join('') : '<p class="subtitle">No files yet.</p>';
      el.querySelectorAll('.file-view').forEach(b => b.addEventListener('click', async () => {
        const d = files.find(x => x.id === b.dataset.id);
        try { await hrViewFile(d.file_path, d.title || d.file_name); } catch (err) { alert(err.message); }
      }));
      el.querySelectorAll('.file-del').forEach(b => b.addEventListener('click', () => deleteStaffFile(b.dataset.id)));
    }

    async function deleteStaffFile(id) {
      const f = files.find(x => x.id === id);
      if (!confirm(`Delete ${f.title || f.file_name}? This cannot be undone.`)) return;
      const { error } = await supabaseClient.from('staff_files').delete().eq('id', id);
      if (error) { alert(error.message); return; }
      await supabaseClient.storage.from(HR_BUCKET).remove([f.file_path]);
      files = files.filter(x => x.id !== id);
      f.kind === 'photo' ? renderPhotos() : renderHrFiles();
    }

    async function uploadHrFiles(e) {
      const list = [...e.target.files];
      if (!list.length) return;
      const msg = document.getElementById('doc-upload-msg');
      const folder = document.getElementById('doc-new-folder').value.trim() || document.getElementById('doc-folder-select').value || 'General';
      try {
        for (let n = 0; n < list.length; n++) {
          msg.innerHTML = `<p class="subtitle">Uploading ${n + 1} of ${list.length}...</p>`;
          const path = await hrUpload(list[n], `${staffId}/documents`);
          const { data, error } = await supabaseClient.from('staff_files').insert({
            profile_id: staffId, kind: 'document', folder, title: list[n].name, file_path: path, file_name: list[n].name, uploaded_by: HR.me.id,
          }).select().single();
          if (error) throw error;
          files.unshift(data);
        }
        msg.innerHTML = '<div class="success-box">Uploaded.</div>';
        document.getElementById('doc-new-folder').value = '';
      } catch (err) { msg.innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`; }
      e.target.value = '';
      renderHrFiles();
    }

    // ---------- Photos ----------
    async function renderPhotos() {
      const el = document.getElementById('photos-list');
      const photos = files.filter(f => f.kind === 'photo');
      if (!photos.length) { el.innerHTML = '<p class="subtitle">No photos yet.</p>'; return; }
      const { data: signed } = await supabaseClient.storage.from(HR_BUCKET).createSignedUrls(photos.map(p => p.file_path), 3600);
      const urls = photos.map(p => (signed || []).find(s => s.path === p.file_path)?.signedUrl || '');
      el.innerHTML = photos.map((p, i) => `<div class="ph" data-i="${i}"><img src="${urls[i]}" alt="" loading="lazy" /><button type="button" class="secondary ph-del" data-id="${p.id}">&times;</button></div>`).join('');
      el.querySelectorAll('.ph').forEach(d => d.addEventListener('click', (e) => {
        if (e.target.closest('.ph-del')) return;
        openPhotoLightbox(urls.filter(Boolean), Number(d.dataset.i));
      }));
      el.querySelectorAll('.ph-del').forEach(b => b.addEventListener('click', () => deleteStaffFile(b.dataset.id)));
    }

    async function uploadPhotosToProfile(e) {
      const list = [...e.target.files];
      if (!list.length) return;
      const msg = document.getElementById('photo-upload-msg');
      try {
        for (let n = 0; n < list.length; n++) {
          msg.innerHTML = `<p class="subtitle">Uploading ${n + 1} of ${list.length}...</p>`;
          const file = await compressImage(list[n]);
          const path = await hrUpload(file, `${staffId}/photos`);
          const { data, error } = await supabaseClient.from('staff_files').insert({
            profile_id: staffId, kind: 'photo', folder: 'Photos', title: list[n].name, file_path: path, file_name: file.name, uploaded_by: HR.me.id,
          }).select().single();
          if (error) throw error;
          files.unshift(data);
        }
        msg.innerHTML = '';
      } catch (err) { msg.innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`; }
      e.target.value = '';
      renderPhotos();
    }

    // ---------- Letters ----------
    function renderWarnings() {
      if (selfView) {
        const el = document.getElementById('warnings-list');
        el.innerHTML = letters.length ? letters.map(w => `
          <a class="project-list-item" href="/letter.html?id=${w.id}">
            <div><div class="name">${escapeHtml(letterTitle(w))}${w.subject ? ' - ' + escapeHtml(w.subject) : ''}</div>
              <div class="meta">${fmtDate(w.issued_date)} &middot; ${w.status === 'resolved' ? 'resolved' : w.employee_signed_at ? 'signed' : '<strong>needs your signature</strong>'}</div></div>
            <span class="subtitle">Open &rarr;</span>
          </a>`).join('') : '<p class="subtitle">No letters.</p>';
        return;
      }
      hrRenderLetterList(document.getElementById('warnings-list'), letters, () => personRef(), reloadLetters,
        { emptyText: 'No letters on file.' });
    }

    // ---------- Incidents ----------
    function renderIncidents() {
      const el = document.getElementById('incidents-list');
      if (!incidentLinks.length) { el.innerHTML = '<p class="subtitle">Not tagged in any incidents.</p>'; return; }
      el.innerHTML = incidentLinks.map(x => {
        const r = x.incident;
        return `
        <a class="project-list-item" href="/incident.html?id=${r.id}">
          <div>
            <div class="name">${escapeHtml(incidentRef(r))} &middot; ${escapeHtml(r.title || INCIDENT_NATURE_LABELS[r.nature])}</div>
            <div class="meta">${escapeHtml(INCIDENT_NATURE_LABELS[r.nature])} &middot; ${fmtDate(r.incident_date)}
              &middot; ${escapeHtml(INCIDENT_ROLE_LABELS[x.role])}${x.at_fault ? ' &middot; <span class="badge amber">Contributing fault</span>' : ''}
              &middot; <span class="badge ${r.status === 'open' ? 'amber' : 'accepted'}">${r.status}</span></div>
            ${x.finding ? `<div class="meta">${escapeHtml(x.finding)}</div>` : ''}
          </div>
          <span class="subtitle">Open &rarr;</span>
        </a>`;
      }).join('');
    }

    // ---------- KPIs ----------
    async function loadKpiStats() {
      const el = document.getElementById('kpi-stats');
      const since90 = new Date(Date.now() - 90 * 86400000);
      const since30 = new Date(Date.now() - 30 * 86400000);
      const { data: entries, error } = await supabaseClient.from('time_entries')
        .select('clock_in, clock_out, break_minutes, project_id, time_category')
        .eq('staff_id', staffId).gte('clock_in', since90.toISOString());
      if (error) { el.innerHTML = `<div class="error-box">${escapeHtml(error.message)}</div>`; return; }
      const hours = (list) => list.reduce((sum, e) => sum + (e.clock_out ? Math.max(0, (new Date(e.clock_out) - new Date(e.clock_in)) / 3600000 - (e.break_minutes || 0) / 60) : 0), 0);
      const last30 = entries.filter(e => new Date(e.clock_in) >= since30);
      const jobHours90 = hours(entries.filter(e => e.time_category === 'job' && e.project_id));
      const total90 = hours(entries);
      const daysWorked90 = new Set(entries.map(e => sydneyDateKey(new Date(e.clock_in)))).size;
      const yearAgo = new Date(Date.now() - 365 * 86400000).toISOString().slice(0, 10);
      const tiles = [
        [hours(last30).toFixed(1), 'Hours, last 30 days'],
        [total90.toFixed(1), 'Hours, last 90 days'],
        [total90 ? Math.round((jobHours90 / total90) * 100) + '%' : '-', 'On job time, last 90 days'],
        [new Set(entries.filter(e => e.project_id).map(e => e.project_id)).size, 'Jobs worked on, last 90 days'],
        [daysWorked90, 'Days worked, last 90 days'],
        [letters.filter(w => w.letter_type !== 'counselling' && ['issued', 'acknowledged', 'resolved'].includes(w.status) && w.issued_date >= yearAgo).length, 'Warnings, last 12 months'],
        ...(selfView ? [] : [[incidentLinks.filter(x => x.incident.incident_date >= yearAgo).length, 'Incidents, last 12 months']]),
        [kpis.filter(k => k.status === 'met').length + ' / ' + kpis.filter(k => k.status !== 'cancelled').length, 'KPIs met'],
      ];
      el.innerHTML = tiles.map(([v, l]) => `<div class="stat-tile"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('');
    }

    function renderKpis() {
      const el = document.getElementById('kpis-list');
      if (!kpis.length) { el.innerHTML = '<p class="subtitle">No KPIs set yet. Add targets to review at their next catch-up, e.g. "Zero callbacks on installs this quarter".</p>'; return; }
      el.innerHTML = kpis.map(k => `
        <div class="project-list-item">
          <div>
            <div class="name">${escapeHtml(k.title)} <span class="badge ${KPI_STATUS_BADGE[k.status]}" style="font-weight:600;">${KPI_STATUS_LABELS[k.status]}</span></div>
            <div class="meta">${k.target ? 'Target: ' + escapeHtml(k.target) : ''}${k.measure ? ' &middot; Measured by: ' + escapeHtml(k.measure) : ''}
              ${k.period_start || k.period_end ? ` &middot; ${fmtDate(k.period_start)} to ${fmtDate(k.period_end)}` : ''}
              ${k.result ? ` &middot; Result: ${escapeHtml(k.result)}` : ''}${k.rating ? ` &middot; ${'&#9733;'.repeat(k.rating)}${'&#9734;'.repeat(5 - k.rating)}` : ''}</div>
            ${k.notes ? `<div class="meta" style="white-space:pre-wrap;">${escapeHtml(k.notes)}</div>` : ''}
          </div>
          <div class="row-actions" style="white-space:nowrap; ${selfView ? 'display:none;' : ''}">
            <button type="button" class="secondary k-edit" data-id="${k.id}">Edit</button>
            <button type="button" class="secondary k-del" data-id="${k.id}">Delete</button>
          </div>
        </div>`).join('');
      el.querySelectorAll('.k-edit').forEach(b => b.addEventListener('click', () => openKpiEditor(kpis.find(k => k.id === b.dataset.id))));
      el.querySelectorAll('.k-del').forEach(b => b.addEventListener('click', async () => {
        if (!confirm('Delete this KPI?')) return;
        const { error } = await supabaseClient.from('staff_kpis').delete().eq('id', b.dataset.id);
        if (error) { alert(error.message); return; }
        kpis = kpis.filter(k => k.id !== b.dataset.id); refreshAll();
      }));
    }

    function openKpiEditor(existing) {
      const k = existing || { status: 'active' };
      const o = hrModal(`
        <h2>${existing ? 'Edit' : 'Add'} KPI - ${escapeHtml(person.full_name)}</h2>
        <label style="margin-top:0">KPI</label><input id="k-title" value="${escapeHtml(k.title || '')}" placeholder="e.g. Zero install callbacks" />
        <div class="grid cols-2">
          <div><label>Target</label><input id="k-target" value="${escapeHtml(k.target || '')}" placeholder="e.g. 0 callbacks" /></div>
          <div><label>How it's measured</label><input id="k-measure" value="${escapeHtml(k.measure || '')}" placeholder="e.g. Warranty jobs raised against their installs" /></div>
        </div>
        <div class="grid cols-2">
          <div><label>From</label><input type="date" id="k-start" value="${k.period_start || ''}" /></div>
          <div><label>To</label><input type="date" id="k-end" value="${k.period_end || ''}" /></div>
        </div>
        <div class="grid cols-3">
          <div><label>Status</label><select id="k-status">${Object.entries(KPI_STATUS_LABELS).map(([v, l]) => `<option value="${v}" ${v === k.status ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
          <div><label>Result</label><input id="k-result" value="${escapeHtml(k.result || '')}" /></div>
          <div><label>Rating (1-5)</label><select id="k-rating"><option value="">-</option>${[1, 2, 3, 4, 5].map(n => `<option value="${n}" ${k.rating === n ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
        </div>
        <label>Notes</label><textarea id="k-notes">${escapeHtml(k.notes || '')}</textarea>
        <div style="margin-top:14px;"><button type="button" id="k-save">Save</button> <button type="button" class="secondary" id="k-cancel">Cancel</button></div>
        <div id="k-msg"></div>`, 560);
      o.querySelector('#k-cancel').addEventListener('click', () => o.remove());
      o.querySelector('#k-save').addEventListener('click', async () => {
        const payload = {
          profile_id: staffId, title: val(o, '#k-title'), target: orNull(val(o, '#k-target')), measure: orNull(val(o, '#k-measure')),
          period_start: orNull(val(o, '#k-start')), period_end: orNull(val(o, '#k-end')), status: val(o, '#k-status'),
          result: orNull(val(o, '#k-result')), rating: val(o, '#k-rating') ? Number(val(o, '#k-rating')) : null,
          notes: orNull(val(o, '#k-notes')), updated_at: new Date().toISOString(),
        };
        if (!payload.title) { o.querySelector('#k-msg').innerHTML = '<div class="error-box">Give the KPI a name.</div>'; return; }
        const q = existing
          ? supabaseClient.from('staff_kpis').update(payload).eq('id', existing.id).select().single()
          : supabaseClient.from('staff_kpis').insert(payload).select().single();
        const { data, error } = await q;
        if (error) { o.querySelector('#k-msg').innerHTML = `<div class="error-box">${escapeHtml(error.message)}</div>`; return; }
        kpis = existing ? kpis.map(x => (x.id === data.id ? data : x)) : [data, ...kpis];
        o.remove(); refreshAll();
      });
    }

    function refreshAll() {
      renderCounts(); renderOverview(); renderWarnings(); renderIncidents(); renderKpis(); loadKpiStats();
    }

    (async function () {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();
      renderMainNav('team');
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault(); await supabaseClient.auth.signOut(); window.location.href = '/login.html';
      });
      const content = document.getElementById('content');
      try {
        await hrInit(session);
        if (!staffId && !hrIsFinance()) staffId = session.user.id;
        selfView = !hrIsFinance();
        if (selfView && staffId !== session.user.id) { content.innerHTML = '<div class="card"><p>You can only open your own profile. <a href="/staff.html">Open mine</a></p></div>'; return; }
        if (!staffId) { content.innerHTML = '<div class="card"><p>No staff member selected. Open someone from the <a href="/team.html">Team</a> page.</p></div>'; return; }
        await Promise.all([loadPerson(), loadEmail()]);
        renderShell();
        await loadRecords();
        refreshAll();
        renderEmploymentDocs();
        renderHrFiles();
        renderPhotos();
        loadSignedDocs();
        if (HR.myRole === 'admin' && new URLSearchParams(location.search).get('edit') === '1') {
          const url = new URL(location.href); url.searchParams.delete('edit'); history.replaceState(null, '', url);
          openEditor();
        }
      } catch (err) {
        content.innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`;
      }
    })();
  </script>
</body>
