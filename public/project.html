<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('te-theme') || 'dark');</script>
<title>Project - Thomson Energy</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=6" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('mobile-menu-dropdown').classList.toggle('open')">&#9776;</button>
    <div class="mobile-menu-dropdown" id="mobile-menu-dropdown">
      <a href="/leads.html" class="">Leads<span class="tab-total">-</span></a>
      <a href="/sales.html" class="">Sales<span class="tab-total">-</span></a>
      <a href="/quotes.html" class="active">Quotes<span class="tab-total">-</span></a>
      <a href="/dashboard.html" class="">Projects<span class="tab-total">-</span></a>
      <a href="/invoices.html" class="">Invoices<span class="tab-total">-</span></a>
      <a href="/purchase-orders.html" class="">Purchase Orders<span class="tab-total">-</span></a>
      <a href="/timesheets.html" class="">Timesheets<span class="tab-total">-</span></a>
    </div>
    <nav class="topbar-tabs">
      <a href="/leads.html" class="topbar-tab">Leads<span class="tab-total">-</span></a>
      <a href="/sales.html" class="topbar-tab">Sales<span class="tab-total">-</span></a>
      <a href="/quotes.html" class="topbar-tab active">Quotes<span class="tab-total">-</span></a>
      <a href="/dashboard.html" class="topbar-tab">Projects<span class="tab-total">-</span></a>
      <a href="/invoices.html" class="topbar-tab">Invoices<span class="tab-total">-</span></a>
      <a href="/purchase-orders.html" class="topbar-tab">Purchase Orders<span class="tab-total">-</span></a>
      <a href="/timesheets.html" class="topbar-tab">Timesheets<span class="tab-total">-</span></a>
    </nav>
    <div class="topbar-right">
      <a href="/schedule.html" class="topbar-icon-link" title="Schedule">&#128197;</a>
      <a href="/clients.html" class="topbar-icon-link" title="Clients">&#128100;</a>
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/dashboard.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="wrap">
    <div id="content"><p class="subtitle">Loading...</p></div>
  </div>

  <script src="/js/supabase-client.js"></script>
  <script src="/js/theme.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const projectId = params.get('id');

    async function loadProject() {
      const centreCols = await costCentreColumns();
      const { data: project, error } = await supabaseClient
        .from('projects')
        .select(`*, cost_centres(${centreCols}),
          project_manager:client_contacts!project_manager_contact_id(name, phone, email),
          site_contact:client_contacts!site_contact_id(name, phone, email),
          job_contact:client_contacts!job_contact_id(name, phone, email),
          sales_contact:client_contacts!sales_contact_id(name, phone, email),
          accounts_contact:client_contacts!accounts_contact_id(name, phone, email)`)
        .eq('id', projectId)
        .single();
      if (error) {
        document.getElementById('content').innerHTML = `<div class="error-box">${error.message}</div>`;
        return null;
      }
      return project;
    }

    function render(project, pricingVisible) {
      const centres = project.cost_centres.sort((a, b) => a.sort_order - b.sort_order);
      const quoted = centres.reduce((s, c) => s + Number(c.quoted_amount || 0), 0);
      const cost = centres.reduce((s, c) => s + Number(c.labour_cost || 0) + Number(c.material_cost || 0), 0);
      const invoiced = centres.reduce((s, c) => s + Number(c.invoiced_amount || 0), 0);
      const profit = quoted - cost;
      const pctComplete = quoted ? Math.min(100, Math.round((invoiced / quoted) * 100)) : 0;
      const remaining = Math.max(0, quoted - invoiced);
      const quoteUrl = `${window.location.origin}/quote.html?token=${project.quote_token}`;

      const content = document.getElementById('content');
      content.innerHTML = `
        <h1>${project.name}</h1>
        <p class="subtitle">${project.client_name} &middot; <span class="badge ${project.status}">${project.status.replace('_',' ')}</span></p>
        <div style="margin-bottom:20px;">
          ${pricingVisible ? `
            <a class="btn secondary" href="/new-project.html?id=${project.id}">Edit quote</a>
            <button id="duplicate-btn" class="secondary">Duplicate as new project</button>
          ` : ''}
        </div>

        ${pricingVisible ? `
          <div class="grid cols-4">
            <div class="stat"><div class="label">Quoted total</div><div class="value">${money(quoted)}</div></div>
            <div class="stat"><div class="label">Cost allocated</div><div class="value">${money(cost)}</div></div>
            <div class="stat"><div class="label">Profit (quoted - cost)</div><div class="value ${profit >= 0 ? 'positive' : 'negative'}">${money(profit)}</div></div>
            <div class="stat"><div class="label">Left to invoice</div><div class="value">${money(remaining)}</div></div>
          </div>

          <div class="card" style="margin-top:20px;">
            <h2>Progress</h2>
            <div class="progress-track"><div class="progress-fill" style="width:${pctComplete}%"></div></div>
            <p class="subtitle" style="margin:8px 0 0;">${pctComplete}% invoiced (${money(invoiced)} of ${money(quoted)})</p>
          </div>
        ` : ''}

        ${(() => {
          const contactRows = [
            { label: 'Project manager', c: project.project_manager },
            { label: 'Site supervisor', c: project.site_contact },
            { label: 'Job contact', c: project.job_contact },
            { label: 'Sales contact', c: project.sales_contact },
            { label: 'Accounts contact', c: project.accounts_contact },
          ].filter(r => r.c && r.c.name);
          if (!contactRows.length) return '';
          return `
        <div class="card">
          <h2>Who's running this job</h2>
          <table>
            <thead><tr><th>Role</th><th>Name</th><th>Phone</th><th>Email</th></tr></thead>
            <tbody>
              ${contactRows.map(r => `<tr><td>${r.label}</td><td>${r.c.name || ''}</td><td>${r.c.phone ? `<a class="link-quiet" href="tel:${r.c.phone}">${r.c.phone}</a>` : ''}</td><td>${r.c.email ? `<a class="link-quiet" href="mailto:${r.c.email}">${r.c.email}</a>` : ''}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>`;
        })()}

        ${project.proposal_template !== 'time_and_materials' ? `
        <div class="card">
          <h2>Client quote link</h2>
          <p class="subtitle" style="margin-bottom:10px;">Share this link with the client, or email them the quote directly.</p>
          <input readonly value="${quoteUrl}" style="margin-bottom:10px;" onclick="this.select()" />
          <a class="btn secondary" href="mailto:${project.client_email || ''}?subject=${encodeURIComponent('Quote: ' + project.name)}&body=${encodeURIComponent('Hi ' + project.client_name + ',\n\nPlease find your quote here:\n' + quoteUrl + '\n\nThanks,\nThomson Energy')}">Email quote to client</a>
          ${pricingVisible ? `<p class="subtitle" style="margin-top:14px;">Deposit: ${project.deposit_percent}% (${money(quoted * (project.deposit_percent / 100))}) due on acceptance, remainder invoiced per stage on completion.</p>` : ''}
          ${project.proposal_template === 'solar' && project.pylon_link ? `<p class="subtitle" style="margin-top:6px;">Pylon design: <a class="link-quiet" href="${project.pylon_link}" target="_blank" rel="noopener">${project.pylon_link}</a></p>` : ''}
        </div>
        ` : ''}

        <div class="card">
          <h2>Stages</h2>
          <table>
            <thead>
              <tr>
                <th>Stage</th>
                ${pricingVisible ? '<th class="num">Quoted</th><th class="num">Labour</th><th class="num">Materials</th><th class="num">Invoiced</th>' : ''}
              </tr>
            </thead>
            <tbody>
              ${centres.map(c => `
                <tr>
                  <td>${c.name}</td>
                  ${pricingVisible ? `
                    <td class="num">${moneyOrHidden(c.quoted_amount)}</td>
                    <td class="num">${moneyOrHidden(c.labour_cost)}</td>
                    <td class="num">${moneyOrHidden(c.material_cost)}</td>
                    <td class="num">${moneyOrHidden(c.invoiced_amount)}</td>
                  ` : ''}
                </tr>`).join('')}
            </tbody>
          </table>
        </div>

        <div class="card">
          <h2>Purchase orders &amp; supplier invoices</h2>
          <p class="subtitle" style="margin-bottom:14px;">Tracked separately so costs aren't double-counted.</p>
          <div id="po-list"></div>
          <div style="border-top:1px solid var(--border); padding-top:16px; margin-top:${centres.length ? '16px' : '0'};">
            <div class="grid cols-3">
              <div>
                <label style="margin-top:0">Supplier</label>
                <input id="po-supplier" placeholder="e.g. Reece" />
              </div>
              <div>
                <label style="margin-top:0">PO number (optional)</label>
                <input id="po-number" />
              </div>
              <div>
                <label style="margin-top:0">Amount $</label>
                <input id="po-amount" type="number" step="0.01" />
              </div>
            </div>
            <div class="grid cols-3">
              <div>
                <label style="margin-top:0">Description</label>
                <input id="po-description" placeholder="What was ordered" />
              </div>
              <div>
                <label style="margin-top:0">Stage (optional)</label>
                <select id="po-stage">
                  <option value="">Whole project</option>
                  ${centres.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
                </select>
              </div>
              <div>
                <label style="margin-top:0">Status</label>
                <select id="po-status">
                  <option value="ordered">Ordered</option>
                  <option value="received">Received</option>
                  <option value="invoiced">Invoiced</option>
                  <option value="paid">Paid</option>
                </select>
              </div>
            </div>
            <label style="margin-top:0">Attach invoice or PO document (optional)</label>
            <input type="file" id="po-file" />
            <button type="button" id="add-po-btn" class="secondary" style="margin-top:12px;">Add purchase order</button>
            <div id="po-msg"></div>
          </div>
        </div>
      `;

      loadPurchaseOrders(project.id, centres);

      const duplicateBtn = document.getElementById('duplicate-btn');
      if (duplicateBtn) duplicateBtn.addEventListener('click', async () => {
        const btn = document.getElementById('duplicate-btn');
        btn.disabled = true;
        btn.textContent = 'Duplicating...';
        try {
          const { data: fullProject, error: loadErr } = await supabaseClient
            .from('projects')
            .select('*, cost_centres(*, cost_centre_line_items(*), cost_centre_photo_groups(*))')
            .eq('id', project.id)
            .single();
          if (loadErr) throw loadErr;

          const { data: newProject, error: insErr } = await supabaseClient
            .from('projects')
            .insert({
              name: `${fullProject.name} (copy)`,
              client_name: fullProject.client_name,
              client_email: fullProject.client_email,
              client_address: fullProject.client_address,
              sow_text: fullProject.sow_text,
              proposal_subtitle: fullProject.proposal_subtitle,
              terms_text: fullProject.terms_text,
              deposit_percent: fullProject.deposit_percent,
              pylon_link: fullProject.pylon_link,
              reference_photos: fullProject.reference_photos,
              cover_photos: fullProject.cover_photos,
            })
            .select()
            .single();
          if (insErr) throw insErr;

          const stages = fullProject.cost_centres.sort((a, b) => a.sort_order - b.sort_order);
          const { data: newStages, error: stagesErr } = await supabaseClient
            .from('cost_centres')
            .insert(stages.map(s => ({
              project_id: newProject.id,
              name: s.name,
              description: s.description,
              sort_order: s.sort_order,
              markup_percent: s.markup_percent,
              estimated_labour_cost: s.estimated_labour_cost,
              estimated_material_cost: s.estimated_material_cost,
              quoted_amount: s.quoted_amount,
            })))
            .select();
          if (stagesErr) throw stagesErr;

          const allLineItems = [];
          const allPhotoGroups = [];
          stages.forEach((s, i) => {
            (s.cost_centre_line_items || []).forEach(li => {
              allLineItems.push({
                cost_centre_id: newStages[i].id,
                description: li.description,
                item_type: li.item_type,
                quantity: li.quantity,
                unit_cost: li.unit_cost,
                sort_order: li.sort_order,
              });
            });
            (s.cost_centre_photo_groups || []).forEach(pg => {
              allPhotoGroups.push({
                cost_centre_id: newStages[i].id,
                description: pg.description,
                photos: pg.photos,
                sort_order: pg.sort_order,
              });
            });
          });
          if (allLineItems.length) {
            const { error: liErr } = await supabaseClient.from('cost_centre_line_items').insert(allLineItems);
            if (liErr) throw liErr;
          }
          if (allPhotoGroups.length) {
            const { error: pgErr } = await supabaseClient.from('cost_centre_photo_groups').insert(allPhotoGroups);
            if (pgErr) throw pgErr;
          }

          window.location.href = `/new-project.html?id=${newProject.id}`;
        } catch (err) {
          document.getElementById('action-msg').innerHTML = `<div class="error-box">${err.message}</div>`;
          btn.disabled = false;
          btn.textContent = 'Duplicate as new project';
        }
      });

    }

    async function loadPurchaseOrders(projectId, centres) {
      const { data: pos, error } = await supabaseClient
        .from('purchase_orders')
        .select('*')
        .eq('project_id', projectId)
        .order('created_at', { ascending: false });

      const listEl = document.getElementById('po-list');
      if (error) {
        listEl.innerHTML = `<div class="error-box">${error.message}</div>`;
      } else if (!pos.length) {
        listEl.innerHTML = `<p class="subtitle">No purchase orders logged yet.</p>`;
      } else {
        const stageName = (id) => (centres.find(c => c.id === id) || {}).name || 'Whole project';
        listEl.innerHTML = `
          <table>
            <thead><tr><th>Supplier</th><th>Description</th><th>Stage</th><th>Status</th><th class="num">Amount</th><th>File</th></tr></thead>
            <tbody>
              ${pos.map(po => `
                <tr>
                  <td>${po.supplier_name}${po.po_number ? ' (' + po.po_number + ')' : ''}</td>
                  <td style="color:var(--muted)">${po.description || ''}</td>
                  <td>${stageName(po.cost_centre_id)}</td>
                  <td><span class="badge ${po.status === 'paid' || po.status === 'invoiced' ? 'accepted' : 'draft'}">${po.status}</span></td>
                  <td class="num">${money(po.amount)}</td>
                  <td>${po.file_path ? `<a href="#" class="link-quiet view-doc" data-path="${po.file_path}">${po.file_name || 'View'}</a>` : ''}</td>
                </tr>`).join('')}
            </tbody>
          </table>
          <p class="subtitle" style="margin-top:10px;">Total: ${money(pos.reduce((s, p) => s + Number(p.amount), 0))}</p>
        `;
        listEl.querySelectorAll('.view-doc').forEach(a => {
          a.addEventListener('click', async (e) => {
            e.preventDefault();
            try {
              const url = await getSignedDocUrl(a.dataset.path);
              window.open(url, '_blank');
            } catch (err) {
              alert(err.message);
            }
          });
        });
      }

      document.getElementById('add-po-btn').onclick = async () => {
        const msg = document.getElementById('po-msg');
        const supplier_name = document.getElementById('po-supplier').value.trim();
        const amount = parseFloat(document.getElementById('po-amount').value) || 0;
        if (!supplier_name) {
          msg.innerHTML = `<div class="error-box">Enter a supplier name.</div>`;
          return;
        }
        msg.innerHTML = '';
        try {
          const fileInput = document.getElementById('po-file');
          let file_path = null, file_name = null;
          if (fileInput.files.length) {
            file_path = await uploadPrivateFile(fileInput.files[0], projectId);
            file_name = fileInput.files[0].name;
          }
          const { error: insErr } = await supabaseClient.from('purchase_orders').insert({
            project_id: projectId,
            cost_centre_id: document.getElementById('po-stage').value || null,
            supplier_name,
            po_number: document.getElementById('po-number').value.trim(),
            description: document.getElementById('po-description').value.trim(),
            amount,
            status: document.getElementById('po-status').value,
            file_path, file_name,
          });
          if (insErr) throw insErr;
          await loadPurchaseOrders(projectId, centres);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        }
      };
    }

    (async function () {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });
      const project = await loadProject();
      const myRole = await getMyRole();
      if (project) render(project, isPricingRole(myRole));
    })();
  </script>
</body>
</html>
