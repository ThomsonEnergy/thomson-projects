    async function wireEditForm(project) {
      // Once a job number exists, editing is scoped to Cost Centres only -
      // the Details tab (client/template/SOW/deposit/Pylon/T&Cs) stays
      // read-only, so all of that wiring below is quote-edit only.
      const isQuoteEdit = !project.job_number;

      if (isQuoteEdit) {
      document.querySelectorAll('.template-option').forEach(btn => btn.addEventListener('click', () => applyEditTemplate(btn.dataset.template)));

      document.getElementById('clear-client-btn').addEventListener('click', () => {
        document.getElementById('client-search-input').value = '';
        setSelectedEditClient(null);
        loadEditJobContactPickers(null);
      });

      let clientSearchTimeout = null;
      document.getElementById('client-search-input').addEventListener('input', (e) => {
        clearTimeout(clientSearchTimeout);
        const q = e.target.value.trim();
        const resultsEl = document.getElementById('client-search-results');
        if (q.length < 2) { resultsEl.style.display = 'none'; return; }
        clientSearchTimeout = setTimeout(async () => {
          const { data, error } = await supabaseClient.from('clients').select('*')
            .or(`name.ilike.%${q}%,email.ilike.%${q}%,phone.ilike.%${q}%`).limit(8);
          if (error || !data || !data.length) {
            resultsEl.innerHTML = `<div style="padding:10px 12px; font-size:13px; color:var(--muted);">No matches</div>`;
            resultsEl.style.display = 'block';
            return;
          }
          resultsEl.innerHTML = data.map(c => `
            <div class="client-result" data-id="${c.id}" style="padding:8px 12px; cursor:pointer; font-size:13px; border-bottom:1px solid var(--border);">
              <div style="font-weight:600;">${c.name}</div>
              <div style="color:var(--muted); font-size:12px;">${[c.email, c.phone].filter(Boolean).join(' &middot; ')}</div>
            </div>`).join('');
          resultsEl.querySelectorAll('.client-result').forEach(row => {
            row.addEventListener('click', () => {
              const client = data.find(c => c.id === row.dataset.id);
              document.getElementById('client-search-input').value = client.name;
              setSelectedEditClient(client);
              loadEditJobContactPickers(client.id);
            });
          });
          resultsEl.style.display = 'block';
        }, 250);
      });

      document.getElementById('sow-doc-upload-btn').addEventListener('click', async () => {
        const fileInput = document.getElementById('sow-doc-file');
        const msg = document.getElementById('sow-doc-msg');
        if (!fileInput.files.length) { msg.innerHTML = `<div class="error-box">Choose one or more files first.</div>`; return; }
        msg.innerHTML = '';
        try {
          for (const file of fileInput.files) {
            const path = await uploadPrivateFile(file, 'sow-source');
            sowDocs.push({ path, name: file.name, mime: file.type });
          }
          renderEditSowDocList();
          fileInput.value = '';
        } catch (err) { msg.innerHTML = `<div class="error-box">${err.message}</div>`; }
      });

      document.getElementById('generate-scope-btn').addEventListener('click', async () => {
        const btn = document.getElementById('generate-scope-btn');
        const msg = document.getElementById('generate-msg');
        const brief = document.getElementById('p-brief').value.trim();
        const projectName = document.getElementById('p-name').value.trim();
        const rows = [...document.querySelectorAll('#cc-rows .cc-row')];
        const stageNames = rows.map(r => r.dataset.name).filter(Boolean);
        if (!brief) { msg.innerHTML = `<div class="error-box">Add a few notes first.</div>`; return; }
        if (stageNames.length === 0) { msg.innerHTML = `<div class="error-box">Add at least one stage first.</div>`; return; }

        btn.disabled = true;
        msg.innerHTML = '';
        try {
          btn.textContent = 'Drafting stage names and descriptions...';
          const scopeRes = await fetch('/.netlify/functions/generate-scope', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ projectName: projectName || 'This project', brief, stageNames }),
          });
          const scopeJson = await scopeRes.json();
          if (!scopeJson.ok) throw new Error(scopeJson.error);

          rows.forEach((row, i) => {
            const stage = scopeJson.stages[i];
            if (!stage) return;
            if (stage.name) { row.querySelector('.cc-name').value = stage.name; row.dataset.name = stage.name.trim(); }
            if (stage.description) row.querySelector('.cc-desc').value = stage.description;
          });
          renumberEditStages();

          const updatedStageNames = rows.map(r => r.dataset.name).filter(Boolean);
          const updatedDescriptions = Object.fromEntries(rows.map(r => [r.dataset.name, r.querySelector('.cc-desc').value]));

          btn.textContent = 'Writing scope of works...';
          const sowRes = await fetch('/.netlify/functions/generate-sow', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              projectName: projectName || 'This project', brief, stageNames: updatedStageNames,
              stageDescriptions: updatedDescriptions, documentPaths: sowDocs.map(d => d.path),
            }),
          });
          const sowJson = await sowRes.json();
          if (!sowJson.ok) throw new Error(sowJson.error);
          document.getElementById('p-sow').value = sowJson.sow;
          msg.innerHTML = `<div class="success-box">Stage names, descriptions, and scope of works drafted. Review and edit as needed.</div>`;
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        } finally {
          btn.disabled = false;
          btn.textContent = 'Generate scope of works with AI';
        }
      });

      document.getElementById('reference-upload-btn').addEventListener('click', async () => {
        const fileInput = document.getElementById('reference-file');
        const msg = document.getElementById('reference-msg');
        if (!fileInput.files.length) { msg.innerHTML = `<div class="error-box">Choose one or more photos first.</div>`; return; }
        msg.innerHTML = '';
        try {
          const urls = await uploadPhotos(fileInput.files, 'reference');
          referencePhotos.push(...urls);
          renderPhotoThumbs(document.getElementById('reference-thumbs'), referencePhotos);
          fileInput.value = '';
        } catch (err) { msg.innerHTML = `<div class="error-box">${err.message}</div>`; }
      });

      document.getElementById('pylon-pull-btn').addEventListener('click', async () => {
        const msg = document.getElementById('pylon-msg');
        const pylonProjectId = document.getElementById('p-pylon-id').value.trim();
        if (!pylonProjectId) { msg.innerHTML = `<div class="error-box">Enter a Pylon project ID first.</div>`; return; }
        msg.innerHTML = '';
        try {
          const res = await fetch('/.netlify/functions/pylon-sync', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ projectId: project.id, pylonProjectId }),
          });
          const json = await res.json();
          if (!json.ok) throw new Error(json.error);
          msg.innerHTML = `<div class="success-box">Pulled data from Pylon.</div>`;
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message} (Pylon's API needs verifying against your actual access, see SETUP.md)</div>`;
        }
      });
      } // end isQuoteEdit-only wiring

      document.getElementById('add-row').addEventListener('click', () => addRow());
      document.getElementById('save-edit-btn').addEventListener('click', () => saveEdits(project));
      document.getElementById('cancel-edit-btn').addEventListener('click', () => { editMode = false; render(project, true); });

      if (isQuoteEdit) {
        applyEditTemplate(project.proposal_template || 'new_build');
        document.getElementById('p-estimate-disclaimer').value = project.estimate_disclaimer_text || '';
        document.getElementById('p-name').value = project.name || '';
        document.getElementById('p-subtitle').value = project.proposal_subtitle || '';
        document.getElementById('p-client').value = project.client_name || '';
        document.getElementById('p-email').value = project.client_email || '';
        document.getElementById('p-phone').value = project.client_phone || '';
        document.getElementById('p-address').value = project.client_address || '';
        document.getElementById('p-sow').value = project.sow_text || '';
        document.getElementById('p-terms').value = project.terms_text || '';
        document.getElementById('p-deposit').value = project.deposit_percent;
        document.getElementById('p-pylon-link').value = project.pylon_link || '';
        document.getElementById('p-pylon-id').value = project.pylon_project_id || '';

        selectedClientId = project.client_id || null;
        referencePhotos = (project.reference_photos || []).map(p => p.url || p);
        renderPhotoThumbs(document.getElementById('reference-thumbs'), referencePhotos);
        sowDocs = [];
        renderEditSowDocList();

        if (project.client_id) {
          const { data: client } = await supabaseClient.from('clients').select('*').eq('id', project.client_id).maybeSingle();
          if (client) {
            document.getElementById('client-search-input').value = client.name;
            document.getElementById('p-payment-terms').value = client.payment_terms || 'cod';
            document.getElementById('selected-client-note').innerHTML = `Linked to existing client: <strong>${client.name}</strong>. <a class="link-quiet" href="/clients.html" target="_blank">View on Clients page</a>.`;
          }
          await loadEditJobContactPickers(project.client_id, {
            project_manager_contact_id: project.project_manager_contact_id,
            site_contact_id: project.site_contact_id,
            job_contact_id: project.job_contact_id,
            sales_contact_id: project.sales_contact_id,
            accounts_contact_id: project.accounts_contact_id,
          });
        }
      } else {
        // addRow()'s singleStage check still needs a real template - jobs
        // don't show the picker, so just carry the job's own template
        // through without touching any Details-tab DOM.
        currentTemplate = project.proposal_template || 'new_build';
      }

      const stages = (project.cost_centres || []).slice().sort((a, b) => a.sort_order - b.sort_order);
      stages.forEach(stage => {
        addRow({
          id: stage.id,
          name: stage.name, description: stage.description, markup_percent: stage.markup_percent, stc_total: stage.stc_total || 0,
          lineItems: (stage.cost_centre_line_items || []).slice().sort((a, b) => a.sort_order - b.sort_order)
            .map(li => ({ id: li.id, description: li.description, item_type: li.item_type, quantity: li.quantity, unit_cost: li.unit_cost, rate_tier_id: li.rate_tier_id })),
          photoGroups: (stage.cost_centre_photo_groups || []).slice().sort((a, b) => a.sort_order - b.sort_order)
            .map(pg => ({ description: pg.description, photos: (pg.photos || []).map(p => p.url || p) })),
        });
      });
      if (!stages.length) addRow({ name: 'Stage 1' });
      updateEditTotal();
      if (isQuoteEdit) loadEditAddressAutocomplete(companySettings.google_maps_api_key);
    }

    // Presents the choice - quick note vs full signed Variation - for a set
    // of stage $ changes on an already-approved job. Resolves to a
    // ready-to-insert variations row, or undefined if the user backs out
    // of the whole save (not just this dialog).
    function openVariationChoiceModal(changes) {
      return new Promise((resolve) => {
        const totalDelta = changes.reduce((s, c) => s + (c.new_amount - c.old_amount), 0);
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
        overlay.innerHTML = `
          <div class="card" style="max-width:520px; width:100%; max-height:90vh; overflow-y:auto;">
            <h2>This changes the job's quoted total</h2>
            <p class="subtitle" style="margin-bottom:10px;">This job's quote was already approved - record why this changed.</p>
            <table class="responsive-stack" style="margin-bottom:10px;">
              <thead><tr><th>Stage</th><th class="num">Was</th><th class="num">Now</th><th class="num">Change</th></tr></thead>
              <tbody>
                ${changes.map(c => `
                  <tr>
                    <td data-label="Stage">${c.cost_centre_name}</td>
                    <td class="num" data-label="Was">${money(c.old_amount)}</td>
                    <td class="num" data-label="Now">${money(c.new_amount)}</td>
                    <td class="num" data-label="Change" style="color:${c.new_amount >= c.old_amount ? 'var(--green)' : 'var(--red)'};">${c.new_amount >= c.old_amount ? '+' : ''}${money(c.new_amount - c.old_amount)}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
            <p style="margin:0 0 14px; font-weight:600;">Total change: <span style="color:${totalDelta >= 0 ? 'var(--green)' : 'var(--red)'};">${totalDelta >= 0 ? '+' : ''}${money(totalDelta)}</span></p>

            <label style="margin-top:0">Reason for this change</label>
            <textarea id="var-description" placeholder="e.g. Client requested an extra 4 downlights in the living room" style="min-height:70px;"></textarea>

            <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;">
              <button id="var-quick-btn">Record as quick note</button>
              <button type="button" class="secondary" id="var-full-btn">Open full Variation Form to sign</button>
              <button type="button" class="secondary" id="var-cancel-btn">Cancel save</button>
            </div>
            <div id="var-msg"></div>
          </div>`;
        document.body.appendChild(overlay);

        overlay.querySelector('#var-cancel-btn').addEventListener('click', () => { overlay.remove(); resolve(undefined); });

        overlay.querySelector('#var-quick-btn').addEventListener('click', () => {
          const description = overlay.querySelector('#var-description').value.trim();
          if (!description) { overlay.querySelector('#var-msg').innerHTML = `<div class="error-box">Enter a reason first.</div>`; return; }
          overlay.remove();
          resolve({ description, changes, total_delta: totalDelta, variation_type: 'quick_note', status: 'recorded' });
        });

        overlay.querySelector('#var-full-btn').addEventListener('click', () => {
          const description = overlay.querySelector('#var-description').value.trim();
          if (!description) { overlay.querySelector('#var-msg').innerHTML = `<div class="error-box">Enter a reason first.</div>`; return; }
          overlay.remove();
          openFullVariationSignPanel(changes, totalDelta, description, resolve);
        });
      });
    }

    // On-screen signing only for now - a client-link remote-sign entry
    // point (same underlying record, a second way to reach this) is a
    // planned follow-up, not built yet.
    function openFullVariationSignPanel(changes, totalDelta, description, resolve) {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:520px; width:100%; max-height:90vh; overflow-y:auto;">
          <h2>Sign this variation</h2>
          <p class="subtitle" style="margin-bottom:10px;">Total change: <strong style="color:${totalDelta >= 0 ? 'var(--green)' : 'var(--red)'};">${totalDelta >= 0 ? '+' : ''}${money(totalDelta)}</strong></p>
          <p style="margin:0 0 14px;">${description}</p>

          <label style="margin-top:0">Signed by (name)</label>
          <input id="var-signed-name" placeholder="Full name" />

          <label>Signature</label>
          <canvas id="var-sig-canvas" width="460" height="150" style="border:1px solid var(--border); border-radius:8px; background:#fff; touch-action:none; width:100%; max-width:460px; height:150px; display:block;"></canvas>
          <button type="button" class="secondary" id="var-sig-clear-btn" style="margin-top:8px; font-size:12px; padding:6px 10px;">Clear signature</button>

          <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;">
            <button id="var-sign-btn">Sign &amp; lock</button>
            <button type="button" class="secondary" id="var-sign-cancel-btn">Cancel save</button>
          </div>
          <div id="var-sign-msg"></div>
        </div>`;
      document.body.appendChild(overlay);

      const canvas = overlay.querySelector('#var-sig-canvas');
      const ctx = canvas.getContext('2d');
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      let drawing = false, hasSignature = false;
      const pointerPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        return { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height) };
      };
      canvas.addEventListener('pointerdown', (e) => { drawing = true; hasSignature = true; const p = pointerPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
      canvas.addEventListener('pointermove', (e) => { if (!drawing) return; const p = pointerPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
      const stopDrawing = () => { drawing = false; };
      canvas.addEventListener('pointerup', stopDrawing);
      canvas.addEventListener('pointerleave', stopDrawing);
      overlay.querySelector('#var-sig-clear-btn').addEventListener('click', () => { ctx.clearRect(0, 0, canvas.width, canvas.height); hasSignature = false; });

      overlay.querySelector('#var-sign-cancel-btn').addEventListener('click', () => { overlay.remove(); resolve(undefined); });

      overlay.querySelector('#var-sign-btn').addEventListener('click', () => {
        const signedMsg = overlay.querySelector('#var-sign-msg');
        const signed_by_name = overlay.querySelector('#var-signed-name').value.trim();
        if (!signed_by_name) { signedMsg.innerHTML = `<div class="error-box">Enter the signer's name.</div>`; return; }
        if (!hasSignature) { signedMsg.innerHTML = `<div class="error-box">Draw a signature.</div>`; return; }
        const signature_data_url = canvas.toDataURL('image/png');
        overlay.remove();
        resolve({
          description, changes, total_delta: totalDelta, variation_type: 'full', status: 'signed',
          signature_data_url, signed_by_name, signed_at: new Date().toISOString(),
        });
      });
    }

    async function saveEdits(project) {
      const msg = document.getElementById('edit-msg');
      const saveBtn = document.getElementById('save-edit-btn');
      msg.innerHTML = '';

      const isJob = !!project.job_number;

      const stageRows = [...document.querySelectorAll('#cc-rows .cc-row')];
      const stagesPayload = stageRows.map((row, i) => ({
        id: row.dataset.id || null,
        name: row.querySelector('.cc-name').value.trim(),
        description: row.querySelector('.cc-desc').value.trim(),
        markup_percent: parseFloat(row.querySelector('.cc-markup').value) || 0,
        stc_total: parseFloat(row.querySelector('.cc-stc-total').value) || 0,
        estimated_labour_cost: parseFloat(row.dataset.labourTotal) || 0,
        estimated_material_cost: parseFloat(row.dataset.materialTotal) || 0,
        quoted_amount: parseFloat(row.dataset.salePrice) || 0,
        sort_order: i,
        lineItems: [...row.querySelectorAll('.li-row')].map((li, j) => {
          const item_type = li.querySelector('.li-type').value;
          const rate_tier_id = li.querySelector('.li-tier').value || null;
          let description = li.querySelector('.li-desc').value.trim();
          // Labour description is optional - if left blank, fall back to
          // the rate tier's own name (e.g. "Principal Electrician") rather
          // than dropping the line entirely.
          if (!description && item_type === 'labour' && rate_tier_id) {
            description = RATE_TIERS.find(t => t.id === rate_tier_id)?.name || '';
          }
          return {
            description, item_type,
            quantity: parseFloat(li.querySelector('.li-qty').value) || 0,
            unit_cost: parseFloat(li.querySelector('.li-cost').value) || 0,
            rate_tier_id,
            sort_order: j,
          };
        }).filter(li => li.description),
        photoGroups: [...row.querySelectorAll('.pg-row')].map((pg, j) => ({
          description: pg.querySelector('.pg-desc').value.trim(),
          photos: JSON.parse(pg.dataset.photos || '[]').map(url => ({ url })),
          sort_order: j,
        })).filter(pg => pg.description || pg.photos.length),
      })).filter(s => s.name);

      if (stagesPayload.length === 0) {
        msg.innerHTML = `<div class="error-box">Add at least one stage.</div>`;
        return;
      }

      if (!isJob) {
        // ---------- Quote path: unchanged - nothing real is attached yet,
        // so a full delete-and-reinsert is simplest and safe. ----------
        const reasons = await checkProjectHasActivity(project);
        if (reasons.length) {
          msg.innerHTML = `<div class="error-box">Can't save stage changes - this quote already ${reasons.join(', ')}. Editing here would delete and re-create every stage, which isn't safe once real activity is attached.</div>`;
          return;
        }

        const name = document.getElementById('p-name').value.trim();
        const client_name = document.getElementById('p-client').value.trim();
        const client_email = document.getElementById('p-email').value.trim();
        const client_phone = document.getElementById('p-phone').value.trim();
        const client_address = document.getElementById('p-address').value.trim();
        const payment_terms = document.getElementById('p-payment-terms').value;
        const sow_text = document.getElementById('p-sow').value;
        const proposal_subtitle = document.getElementById('p-subtitle').value.trim();
        const terms_text = document.getElementById('p-terms').value;
        const deposit_percent = parseFloat(document.getElementById('p-deposit').value) || 0;
        const pylon_link = document.getElementById('p-pylon-link').value.trim();
        const pylon_project_id = document.getElementById('p-pylon-id').value.trim();

        if (!name || !client_name) {
          msg.innerHTML = `<div class="error-box">Please fill in the project name and client name.</div>`;
          return;
        }

        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving...';
        try {
          let clientId = selectedClientId;
          const clientFields = { name: client_name, email: client_email || null, phone: client_phone || null, address: client_address || null, payment_terms };
          if (clientId) {
            await supabaseClient.from('clients').update(clientFields).eq('id', clientId);
          } else {
            const { data: newClient, error: clientErr } = await supabaseClient.from('clients').insert(clientFields).select().single();
            if (clientErr) throw clientErr;
            clientId = newClient.id;
          }

          const { data: settings } = await supabaseClient.from('company_settings').select('portfolio_photos').eq('id', 1).single();
          const allPhotos = (settings && settings.portfolio_photos) || [];
          const wantCategory = TEMPLATE_INFO[currentTemplate].photoCategory;
          const coverPhotos = allPhotos.filter(p => (p.category || 'general') === wantCategory);

          const projectFields = {
            name, client_id: clientId, client_name, client_email, client_phone, client_address,
            sow_text, proposal_subtitle, terms_text, deposit_percent, pylon_link, pylon_project_id,
            reference_photos: referencePhotos.map(url => ({ url })),
            cover_photos: coverPhotos,
            proposal_template: currentTemplate,
            estimate_disclaimer_text: document.getElementById('p-estimate-disclaimer').value,
            project_manager_contact_id: assignedContactIds.project_manager_contact_id || null,
            site_contact_id: assignedContactIds.site_contact_id || null,
            job_contact_id: assignedContactIds.job_contact_id || null,
            sales_contact_id: assignedContactIds.sales_contact_id || null,
            accounts_contact_id: assignedContactIds.accounts_contact_id || null,
          };

          const { error: updateErr } = await supabaseClient.from('projects').update(projectFields).eq('id', project.id);
          if (updateErr) throw updateErr;
          const { error: delErr } = await supabaseClient.from('cost_centres').delete().eq('project_id', project.id);
          if (delErr) throw delErr;

          const { data: insertedStages, error: ccErr } = await supabaseClient
            .from('cost_centres')
            .insert(stagesPayload.map(({ id, lineItems, photoGroups, ...s }) => ({ ...s, project_id: project.id })))
            .select();
          if (ccErr) throw ccErr;

          const allLineItems = [];
          const allPhotoGroups = [];
          insertedStages.forEach((stage, i) => {
            stagesPayload[i].lineItems.forEach(li => allLineItems.push({ ...li, cost_centre_id: stage.id }));
            stagesPayload[i].photoGroups.forEach(pg => allPhotoGroups.push({ ...pg, cost_centre_id: stage.id }));
          });
          if (allLineItems.length) {
            const { error: liErr } = await supabaseClient.from('cost_centre_line_items').insert(allLineItems);
            if (liErr) throw liErr;
          }
          if (allPhotoGroups.length) {
            const { error: pgErr } = await supabaseClient.from('cost_centre_photo_groups').insert(allPhotoGroups);
            if (pgErr) throw pgErr;
          }

          editMode = false;
          const refreshed = await loadProject();
          const myRole = await getMyRole();
          if (refreshed) render(refreshed, isPricingRole(myRole));
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save changes';
        }
        return;
      }

      // ---------- Job path: non-destructive. Existing stages are UPDATEd
      // in place (preserving the id every invoice/PO/timesheet entry
      // downstream might reference), only genuinely new stages get
      // inserted, and a stage can only be removed if nothing real is
      // attached to it specifically. Line items/photo groups within a
      // surviving stage are still delete-and-reinsert - nothing else
      // references their ids directly, so that stays simple. ----------
      const existingCentres = project.cost_centres || [];
      const keptIds = stagesPayload.map(s => s.id).filter(Boolean);
      const removedCentres = existingCentres.filter(c => !keptIds.includes(c.id));

      for (const centre of removedCentres) {
        const reasons = await checkCostCentreHasActivity(centre);
        if (reasons.length) {
          msg.innerHTML = `<div class="error-box">Can't remove "${centre.name}" - it ${reasons.join(', ')}. Adjust its line items instead of deleting the stage, or add it back.</div>`;
          return;
        }
      }

      const changes = [];
      stagesPayload.forEach(s => {
        if (!s.id) {
          changes.push({ cost_centre_id: null, cost_centre_name: s.name, old_amount: 0, new_amount: s.quoted_amount });
          return;
        }
        const original = existingCentres.find(c => c.id === s.id);
        if (!original) return;
        const oldAmount = Number(original.quoted_amount) || 0;
        if (Math.abs(s.quoted_amount - oldAmount) >= 0.01) {
          changes.push({ cost_centre_id: s.id, cost_centre_name: s.name, old_amount: oldAmount, new_amount: s.quoted_amount });
        }
      });
      removedCentres.forEach(c => {
        changes.push({ cost_centre_id: c.id, cost_centre_name: c.name, old_amount: Number(c.quoted_amount) || 0, new_amount: 0 });
      });

      let pendingVariation = null;
      if (changes.length) {
        pendingVariation = await openVariationChoiceModal(changes);
        if (pendingVariation === undefined) return; // backed out of the whole save
      }

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';
      try {
        for (const s of stagesPayload) {
          const { id, lineItems, photoGroups, ...fields } = s;
          let centreId = id;
          if (centreId) {
            const { error } = await supabaseClient.from('cost_centres').update(fields).eq('id', centreId);
            if (error) throw error;
          } else {
            const { data: newCentre, error } = await supabaseClient.from('cost_centres').insert({ ...fields, project_id: project.id }).select().single();
            if (error) throw error;
            centreId = newCentre.id;
          }

          const { error: delLiErr } = await supabaseClient.from('cost_centre_line_items').delete().eq('cost_centre_id', centreId);
          if (delLiErr) throw delLiErr;
          if (lineItems.length) {
            const { error: liErr } = await supabaseClient.from('cost_centre_line_items').insert(lineItems.map(li => ({ ...li, cost_centre_id: centreId })));
            if (liErr) throw liErr;
          }

          const { error: delPgErr } = await supabaseClient.from('cost_centre_photo_groups').delete().eq('cost_centre_id', centreId);
          if (delPgErr) throw delPgErr;
          if (photoGroups.length) {
            const { error: pgErr } = await supabaseClient.from('cost_centre_photo_groups').insert(photoGroups.map(pg => ({ ...pg, cost_centre_id: centreId })));
            if (pgErr) throw pgErr;
          }
        }

        if (removedCentres.length) {
          const { error: delCentreErr } = await supabaseClient.from('cost_centres').delete().in('id', removedCentres.map(c => c.id));
          if (delCentreErr) throw delCentreErr;
        }

        if (pendingVariation) {
          const { data: { user } } = await supabaseClient.auth.getUser();
          const { error: varErr } = await supabaseClient.from('variations').insert({ ...pendingVariation, project_id: project.id, created_by: user.id });
          if (varErr) throw varErr;
          await logActivity('project', project.id, 'variation_recorded', pendingVariation.description);
        }

        editMode = false;
        const refreshed = await loadProject();
        const myRole = await getMyRole();
        if (refreshed) render(refreshed, isPricingRole(myRole));
      } catch (err) {
        msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save changes';
      }
    }

    // Merges legacy single-stage invoices (linked via invoices.cost_centre_id
    // directly) with new multi-stage claims (linked via invoice_claims,
    // invoice.cost_centre_id left null) into one list per cost centre - the
    // two never overlap for the same invoice, since a new invoice always
    // uses invoice_claims. Shared by the per-stage claims card and the
    // "Invoice project" modal so remaining-to-claim can never drift between
    // the two.
    function stageClaimSummary(c) {
      const legacyInvoices = (c.invoices || []).map(inv => ({
        invoice_number: inv.invoice_number, invoice_token: inv.invoice_token, sent_at: inv.sent_at,
        paid_at: inv.paid_at, xero_invoice_id: inv.xero_invoice_id, id: inv.id,
        labour_amount: inv.labour_amount, material_amount: inv.material_amount, stc_amount: inv.stc_amount,
      }));
      const claimInvoices = (c.invoice_claims || []).map(ic => ({
        invoice_number: ic.invoices?.invoice_number, invoice_token: ic.invoices?.invoice_token, sent_at: ic.invoices?.sent_at,
        paid_at: ic.invoices?.paid_at, xero_invoice_id: ic.invoices?.xero_invoice_id, id: ic.invoices?.id,
        labour_amount: ic.labour_amount, material_amount: ic.material_amount, stc_amount: ic.stc_amount,
      }));
      const stageInvoices = [...legacyInvoices, ...claimInvoices].sort((a, b) => new Date(a.sent_at) - new Date(b.sent_at));
      const claimedTotal = stageInvoices.reduce((s, inv) => s + Number(inv.labour_amount) + Number(inv.material_amount), 0);
      const quotedAmt = Number(c.quoted_amount) || 0;
      const remaining = Math.max(0, quotedAmt - claimedTotal);
      const stcApplied = stageInvoices.reduce((s, inv) => s + Number(inv.stc_amount || 0), 0);
      const stcRemaining = Math.max(0, Number(c.stc_total || 0) - stcApplied);
      return { stageInvoices, claimedTotal, quotedAmt, remaining, stcApplied, stcRemaining };
    }

    // Splits a stage's claimed $ into labour/materials using the same ratio
    // as its estimated cost breakdown - matches how each stage's own
    // estimated_labour_cost/estimated_material_cost split was already being
    // used to default a single-stage claim before this was project-wide.
    function splitLabourMaterial(centre, amount) {
      const labourCost = Number(centre.estimated_labour_cost) || 0;
      const materialCost = Number(centre.estimated_material_cost) || 0;
      const costTotal = labourCost + materialCost;
      const labourShare = costTotal > 0 ? labourCost / costTotal : 1;
      const labourAmount = Math.round(amount * labourShare * 100) / 100;
      const materialAmount = Math.round((amount - labourAmount) * 100) / 100;
      return { labourAmount, materialAmount };
    }

    // One invoice, multiple stage-claim lines: either a single % of the
    // whole project's contract value (distributed across every stage in
    // proportion to its quoted amount, capped at each stage's own
    // remaining balance and waterfalled to other stages if capped), or a
    // hand-picked amount per stage. opts.preselectCentreId starts the
    // panel in per-stage mode with just that one stage checked - the entry
    // point from a single stage's own "Create & send next claim" button.
    function openInvoiceProjectPanel(project, pricingVisible, opts = {}) {
      const centres = (project.cost_centres || []).map(c => ({ centre: c, ...stageClaimSummary(c) })).filter(x => x.remaining > 0.004);
      if (!centres.length) return;
      const projectRemaining = centres.reduce((s, x) => s + x.remaining, 0);
      const mode = opts.preselectCentreId ? 'stage' : 'project';

      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:640px; width:100%; max-height:88vh; overflow-y:auto;">
          <h2>Invoice project</h2>
          <p class="subtitle" style="margin-bottom:12px;">${money(projectRemaining)} remaining to claim across ${centres.length} stage${centres.length === 1 ? '' : 's'}.</p>

          <div style="display:flex; gap:16px; margin-bottom:14px;">
            <label style="display:flex; align-items:center; gap:6px; margin-top:0;"><input type="radio" name="inv-mode" value="project" ${mode === 'project' ? 'checked' : ''} style="width:auto;" /> Whole project %</label>
            <label style="display:flex; align-items:center; gap:6px; margin-top:0;"><input type="radio" name="inv-mode" value="stage" ${mode === 'stage' ? 'checked' : ''} style="width:auto;" /> Choose per stage</label>
          </div>

          <div id="inv-mode-project" style="${mode === 'project' ? '' : 'display:none;'}">
            <label style="margin-top:0">Claim this % of the total contract value</label>
            <input type="number" id="inv-project-pct" min="0" max="100" step="1" value="100" />
            <p class="subtitle" id="inv-project-preview" style="margin-top:8px;"></p>
          </div>

          <div id="inv-mode-stage" style="${mode === 'stage' ? '' : 'display:none;'}">
            <table class="responsive-stack">
              <thead><tr><th></th><th>Stage</th><th class="num">Remaining</th><th class="num">Claim %</th><th class="num">Claim $</th></tr></thead>
              <tbody>
                ${centres.map(x => `
                  <tr>
                    <td data-label=""><input type="checkbox" class="inv-stage-check" data-id="${x.centre.id}" style="width:auto;" ${opts.preselectCentreId ? (opts.preselectCentreId === x.centre.id ? 'checked' : '') : 'checked'} /></td>
                    <td data-label="Stage">${x.centre.name}${x.stcRemaining > 0 ? `<br><span class="subtitle" style="font-size:11px;">${money(x.stcRemaining)} STC credit outstanding</span>` : ''}</td>
                    <td class="num" data-label="Remaining">${money(x.remaining)}</td>
                    <td class="num" data-label="Claim %"><input type="number" class="inv-stage-pct" data-id="${x.centre.id}" min="0" max="100" step="1" value="${!opts.preselectCentreId || opts.preselectCentreId === x.centre.id ? 100 : 0}" style="width:70px;" /></td>
                    <td class="num" data-label="Claim $"><input type="number" class="inv-stage-amt" data-id="${x.centre.id}" step="0.01" style="width:100px;" /></td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>

          <label style="margin-top:14px;">Invoice number</label>
          <input id="inv-invoice-number" placeholder="Leave blank to auto-assign the next number" />

          <p style="margin-top:14px; font-size:16px;">Total this claim: <strong id="inv-total-display">$0.00</strong></p>

          <div style="margin-top:8px;">
            <button id="inv-confirm-btn">Create &amp; send</button>
            <button type="button" class="secondary" id="inv-cancel-btn">Cancel</button>
          </div>
          <div id="inv-panel-msg"></div>
        </div>`;

      // Returns the current claim per stage, as {costCentreId, labourAmount,
      // materialAmount, stcAmount, claimPercent}[] - the single source both
      // the live preview and the submit handler read from, so what's shown
      // is always exactly what gets sent.
      function computeClaims() {
        const selectedMode = overlay.querySelector('input[name="inv-mode"]:checked').value;
        if (selectedMode === 'project') {
          const pct = Math.max(0, Math.min(100, parseFloat(overlay.querySelector('#inv-project-pct').value) || 0));
          let targetTotal = projectRemaining * (pct / 100);
          // Proportional-to-remaining, capped per stage, waterfalled: any
          // amount a stage can't absorb (because pct x its remaining alone
          // would be fine, but rounding/edge cases could push it over) is
          // redistributed across stages that still have headroom.
          const allocated = {};
          let pool = centres.map(x => ({ id: x.centre.id, cap: x.remaining, given: 0 }));
          let toDistribute = targetTotal;
          for (let pass = 0; pass < 3 && toDistribute > 0.004 && pool.some(p => p.given < p.cap); pass++) {
            const headroomTotal = pool.reduce((s, p) => s + (p.cap - p.given), 0);
            if (headroomTotal <= 0) break;
            pool.forEach(p => {
              const share = (p.cap - p.given) / headroomTotal * toDistribute;
              const give = Math.min(share, p.cap - p.given);
              p.given += give;
            });
            const given = pool.reduce((s, p) => s + p.given, 0);
            toDistribute = targetTotal - given;
          }
          pool.forEach(p => { allocated[p.id] = Math.round(p.given * 100) / 100; });
          return centres.map(x => {
            const amt = allocated[x.centre.id] || 0;
            const { labourAmount, materialAmount } = splitLabourMaterial(x.centre, amt);
            const stcAmount = amt >= x.remaining - 0.01 ? x.stcRemaining : 0; // full stage claimed -> pick up its STC credit too
            return { costCentreId: x.centre.id, labourAmount, materialAmount, stcAmount, claimPercent: x.quotedAmt > 0 ? Math.round(((x.claimedTotal + amt) / x.quotedAmt) * 10000) / 100 : null };
          }).filter(c => c.labourAmount + c.materialAmount + c.stcAmount > 0);
        }

        return centres
          .filter(x => overlay.querySelector(`.inv-stage-check[data-id="${x.centre.id}"]`)?.checked)
          .map(x => {
            const amtInput = overlay.querySelector(`.inv-stage-amt[data-id="${x.centre.id}"]`);
            const amt = Math.max(0, Math.min(x.remaining, parseFloat(amtInput.value) || 0));
            const { labourAmount, materialAmount } = splitLabourMaterial(x.centre, amt);
            const stcAmount = amt >= x.remaining - 0.01 ? x.stcRemaining : 0;
            return { costCentreId: x.centre.id, labourAmount, materialAmount, stcAmount, claimPercent: x.quotedAmt > 0 ? Math.round(((x.claimedTotal + amt) / x.quotedAmt) * 10000) / 100 : null };
          })
          .filter(c => c.labourAmount + c.materialAmount + c.stcAmount > 0);
      }

      function refreshStagePctFromDollar(centreId) {
        const x = centres.find(c => c.centre.id === centreId);
        const amtInput = overlay.querySelector(`.inv-stage-amt[data-id="${centreId}"]`);
        const pctInput = overlay.querySelector(`.inv-stage-pct[data-id="${centreId}"]`);
        const amt = Math.max(0, Math.min(x.remaining, parseFloat(amtInput.value) || 0));
        pctInput.value = x.remaining > 0 ? Math.round((amt / x.remaining) * 100) : 0;
      }
      function refreshStageDollarFromPct(centreId) {
        const x = centres.find(c => c.centre.id === centreId);
        const pctInput = overlay.querySelector(`.inv-stage-pct[data-id="${centreId}"]`);
        const amtInput = overlay.querySelector(`.inv-stage-amt[data-id="${centreId}"]`);
        const pct = Math.max(0, Math.min(100, parseFloat(pctInput.value) || 0));
        amtInput.value = Math.round(x.remaining * (pct / 100) * 100) / 100;
      }
      centres.forEach(x => refreshStageDollarFromPct(x.centre.id));

      function refresh() {
        const claims = computeClaims();
        const total = claims.reduce((s, c) => s + c.labourAmount + c.materialAmount + c.stcAmount, 0);
        overlay.querySelector('#inv-total-display').textContent = money(total);
        const pctPreview = overlay.querySelector('#inv-project-preview');
        if (pctPreview) {
          const pct = Math.max(0, Math.min(100, parseFloat(overlay.querySelector('#inv-project-pct').value) || 0));
          pctPreview.textContent = `${money(projectRemaining * (pct / 100))} across ${claims.length} stage${claims.length === 1 ? '' : 's'}.`;
        }
      }

      overlay.querySelectorAll('input[name="inv-mode"]').forEach(r => r.addEventListener('change', () => {
        const selectedMode = overlay.querySelector('input[name="inv-mode"]:checked').value;
        overlay.querySelector('#inv-mode-project').style.display = selectedMode === 'project' ? '' : 'none';
        overlay.querySelector('#inv-mode-stage').style.display = selectedMode === 'stage' ? '' : 'none';
        refresh();
      }));
      overlay.querySelector('#inv-project-pct').addEventListener('input', refresh);
      overlay.querySelectorAll('.inv-stage-check').forEach(cb => cb.addEventListener('change', refresh));
      overlay.querySelectorAll('.inv-stage-pct').forEach(inp => inp.addEventListener('input', () => { refreshStageDollarFromPct(inp.dataset.id); refresh(); }));
      overlay.querySelectorAll('.inv-stage-amt').forEach(inp => inp.addEventListener('input', () => { refreshStagePctFromDollar(inp.dataset.id); refresh(); }));

      overlay.querySelector('#inv-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#inv-confirm-btn').addEventListener('click', async () => {
        const confirmBtn = overlay.querySelector('#inv-confirm-btn');
        const panelMsg = overlay.querySelector('#inv-panel-msg');
        const claims = computeClaims();
        if (!claims.length) { panelMsg.innerHTML = `<div class="error-box">Select at least one stage with a non-zero claim.</div>`; return; }

        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Creating...';
        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          const res = await fetch('/.netlify/functions/create-invoice', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
            body: JSON.stringify({
              projectId: project.id,
              claims,
              invoiceNumber: overlay.querySelector('#inv-invoice-number').value.trim() || null,
            }),
          });
          const data = await res.json();
          if (!res.ok || !data.ok) throw new Error(data.error || 'Could not create the invoice');

          const invoiceUrl = `${window.location.origin}/invoice.html?token=${data.invoiceToken}`;
          panelMsg.innerHTML = `
            <div class="success-box">Created as ${data.invoiceNumber}.</div>
            <label>Invoice link</label>
            <input readonly value="${invoiceUrl}" onclick="this.select()" />
            <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
              <a class="btn secondary" target="_blank" href="${gmailComposeUrl({ to: project.client_email || '', subject: 'Invoice ' + data.invoiceNumber + ' - ' + project.name, body: 'Hi ' + project.client_name + ',\n\nPlease find your invoice here:\n' + invoiceUrl + '\n\nThanks,\nThomson Energy' })}">Email invoice to client</a>
              <a class="btn secondary" target="_blank" href="/invoice.html?token=${data.invoiceToken}&print=1">Download PDF</a>
            </div>
            <p class="subtitle" style="margin-top:6px;">Gmail opens in a new tab ready to send - the PDF downloads separately, so you'll need to attach it yourself once Gmail's open (no browser can auto-attach a file for you). The client's invoice page already has a Pay Online option alongside your bank details, generated automatically - nothing else to do here.</p>`;
          confirmBtn.style.display = 'none';
          overlay.querySelector('#inv-cancel-btn').textContent = 'Close';

          const refreshed = await loadProject();
          if (refreshed) render(refreshed, pricingVisible);
        } catch (err) {
          panelMsg.innerHTML = `<div class="error-box">${err.message}</div>`;
          confirmBtn.disabled = false;
          confirmBtn.textContent = 'Create & send';
        }
      });

      document.body.appendChild(overlay);
      refresh();
    }

    async function pushExistingInvoiceToXero(btn, msgElId = 'push-xero-msg') {
      const msg = document.getElementById(msgElId);
      btn.disabled = true;
      btn.textContent = 'Pushing...';
      msg.innerHTML = '';
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        const res = await fetch('/.netlify/functions/push-invoice-to-xero', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify({ invoiceId: btn.dataset.invoiceId }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Push failed');
        msg.innerHTML = `<div class="success-box">Pushed ${data.invoiceNumber} to Xero.</div>`;
        location.reload();
      } catch (err) {
        msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        btn.disabled = false;
        btn.textContent = 'Push to Xero';
      }
    }

    // Internal view of every invoice raised for this job - shown as its own
    // tab rather than only a link out to the client-facing page, and
    // specifically showing how each one will actually post to Xero: split
    // into Labour/Materials/STC groups (not by stage - that's how Xero
    // actually codes them), using the accounts set in Settings > Xero
    // Mapping. Same xeroBreakdownHtml() the standalone Invoices list uses,
    // so the two can never disagree. Each invoice pushes to Xero on its
    // own; never bundled together by project.
    async function loadJobInvoices(project) {
      const listEl = document.getElementById('job-invoices-list');
      const [{ data: invoices, error }, { data: mappings }, { data: client }] = await Promise.all([
        supabaseClient.from('invoices').select('*, cost_centres(name), invoice_claims(*, cost_centres(name, sort_order))').eq('project_id', project.id).order('sent_at', { ascending: false }),
        supabaseClient.from('xero_account_mapping').select('*'),
        project.client_id ? supabaseClient.from('clients').select('client_type').eq('id', project.client_id).maybeSingle() : Promise.resolve({ data: null }),
      ]);
      if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }
      if (!invoices.length) { listEl.innerHTML = `<p class="subtitle">No invoices raised yet.</p>`; return; }

      const clientType = client?.client_type || 'individual';

      listEl.innerHTML = invoices.map(inv => `
        <div style="border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:14px;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px;">
            <div>
              <strong>${inv.invoice_number}</strong>
              <span class="badge ${inv.paid_at ? 'accepted' : 'sent'}" style="margin-left:6px;">${inv.paid_at ? 'Paid' : 'Awaiting payment'}</span>
              <p class="subtitle" style="margin:4px 0 0; font-size:12px;">${new Date(inv.sent_at).toLocaleDateString('en-AU')}</p>
            </div>
            <div>
              <a class="link-quiet" href="/invoice.html?token=${inv.invoice_token}" target="_blank" style="font-size:12px; margin-right:10px;">View client-facing invoice</a>
              ${inv.xero_invoice_id ? '<span class="subtitle" style="font-size:12px;">In Xero</span>' : `<button type="button" class="secondary push-xero-tab-btn" data-invoice-id="${inv.id}" style="font-size:12px; padding:6px 10px;">Push to Xero</button>`}
            </div>
          </div>
          <div style="margin-top:12px;">${xeroBreakdownHtml(inv, mappings, clientType)}</div>
        </div>`).join('') + `<div id="job-invoices-msg"></div>`;

      listEl.querySelectorAll('.push-xero-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => pushExistingInvoiceToXero(btn, 'job-invoices-msg'));
      });
    }

    async function initCcewSection(project) {
      const el = document.getElementById('ccew-section');
      if (!el) return;

      if (project.ccew_file_path) {
        let viewUrl = '#';
        try { viewUrl = await getSignedDocUrl(project.ccew_file_path); } catch {}
        el.innerHTML = `
          <div class="success-box" style="margin-bottom:10px;">CCEW uploaded.</div>
          <a class="btn secondary" href="${viewUrl}" target="_blank">View certificate</a>
          <button type="button" class="secondary" id="ccew-replace-btn" style="margin-left:8px;">Replace</button>`;
        el.querySelector('#ccew-replace-btn').addEventListener('click', () => renderCcewUploadForm(project));
      } else if (project.ccew_not_required_reason) {
        el.innerHTML = `
          <div class="badge draft" style="margin-bottom:10px; display:inline-block;">Not required</div>
          <p class="subtitle" style="margin-bottom:10px;">${project.ccew_not_required_reason}</p>
          <button type="button" class="secondary" id="ccew-change-btn">Upload one instead / change reason</button>`;
        el.querySelector('#ccew-change-btn').addEventListener('click', () => renderCcewUploadForm(project));
      } else {
        renderCcewUploadForm(project);
      }
    }

    function renderCcewUploadForm(project) {
      const el = document.getElementById('ccew-section');
      el.innerHTML = `
        <label style="margin-top:0">Upload the certificate</label>
        <input type="file" id="ccew-file-input" accept=".pdf,.jpg,.jpeg,.png" />
        <p class="subtitle" style="margin:10px 0 4px;">Or, if this job isn't electrical work and no CCEW applies:</p>
        <input id="ccew-reason-input" placeholder="e.g. Not electrical work" />
        <button id="ccew-save-reason-btn" style="margin-top:8px;">Save reason</button>
        <div id="ccew-msg"></div>`;

      el.querySelector('#ccew-file-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const msg = el.querySelector('#ccew-msg');
        msg.innerHTML = `<p class="subtitle">Uploading...</p>`;
        try {
          const path = await uploadPrivateFile(file, `ccew/${project.id}`);
          const { error } = await supabaseClient.from('projects').update({ ccew_file_path: path, ccew_not_required_reason: null }).eq('id', project.id);
          if (error) throw error;
          project.ccew_file_path = path;
          project.ccew_not_required_reason = null;
          await initCcewSection(project);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        }
      });

      el.querySelector('#ccew-save-reason-btn').addEventListener('click', async () => {
        const reason = el.querySelector('#ccew-reason-input').value.trim();
        const msg = el.querySelector('#ccew-msg');
        if (!reason) { msg.innerHTML = `<div class="error-box">Enter a reason.</div>`; return; }
        const { error } = await supabaseClient.from('projects').update({ ccew_not_required_reason: reason, ccew_file_path: null }).eq('id', project.id);
        if (error) { msg.innerHTML = `<div class="error-box">${error.message}</div>`; return; }
        project.ccew_not_required_reason = reason;
        project.ccew_file_path = null;
        await initCcewSection(project);
      });
    }

    function render(project, pricingVisible) {
      const centres = project.cost_centres.sort((a, b) => a.sort_order - b.sort_order);
      const quoted = centres.reduce((s, c) => s + Number(c.quoted_amount || 0), 0);
      // estimated_labour_cost is a SELL total (hours x the rate tier's sell
      // rate - there's no separate cost rate in this app), not a cost. For
      // the cost/profit breakdown below we need an actual cost, so it's
      // backed out using the same cost->sell relationship materials use
      // (sell = cost x (1 + markup%)), per stage since markup% varies.
      const labourSellTotal = centres.reduce((s, c) => s + Number(c.estimated_labour_cost || 0), 0);
      const labourCostTotal = centres.reduce((s, c) => {
        const markupFactor = 1 + (Number(c.markup_percent) || 45) / 100;
        return s + (Number(c.estimated_labour_cost) || 0) / markupFactor;
      }, 0);
      const materialCostTotal = centres.reduce((s, c) => s + Number(c.estimated_material_cost || 0), 0);
      const cost = labourCostTotal + materialCostTotal;
      const invoiced = centres.reduce((s, c) => s + Number(c.invoiced_amount || 0), 0);
      const profit = quoted - cost;
      const pctComplete = quoted ? Math.min(100, Math.round((invoiced / quoted) * 100)) : 0;
      const remaining = Math.max(0, quoted - invoiced);
      const quoteUrl = `${window.location.origin}/quote.html?token=${project.quote_token}`;
      const actualLabourTotal = centres.reduce((s, c) => s + Number(c.actual_labour_cost || 0), 0);
      const quotedHoursTotal = centres.reduce((s, c) => s + Number(c.quoted_hours || 0), 0);
      const actualHoursTotal = centres.reduce((s, c) => s + Number(c.actual_hours || 0), 0);

      // "Cost allocated" and "Profit" on jobs must always reflect real
      // spend, never the estimate - accrued labour comes from logged
      // timesheets (actual_labour_cost, per stage), accrued materials
      // from PO line items that have actually been received.
      const accruedMaterialTotal = Number(project.accrued_material_cost) || 0;
      const accruedTotal = actualLabourTotal + accruedMaterialTotal;
      const accruedProfit = quoted - accruedTotal;
      const costBarMax = Math.max(cost, accruedTotal, 1);
      const estimatedBarPct = Math.round((cost / costBarMax) * 100);
      const accruedBarPct = Math.round((accruedTotal / costBarMax) * 100);
      const accruedOverEstimate = accruedTotal > cost;
      const isAccepted = ['accepted', 'in_progress', 'complete'].includes(project.status);

      const content = document.getElementById('content');
      const numberLine = [
        project.job_number ? `J${project.job_number}` : null,
        project.quote_number ? `Q${project.quote_number}` : null,
      ].filter(Boolean).join(' &middot; ');

      // Quoted-split donut (Materials/Labour/Profit) - only meaningful
      // when there's a positive quote and cost hasn't blown past it;
      // otherwise a slice would go negative, which conic-gradient can't
      // render, so we fall back to a plain text line instead.
      const donutOk = pricingVisible && quoted > 0 && profit >= 0;
      let materialsPct = 0, labourPct = 0;
      if (donutOk) {
        materialsPct = Math.min(100, Math.round((materialCostTotal / quoted) * 1000) / 10);
        labourPct = Math.min(100 - materialsPct, Math.round((labourCostTotal / quoted) * 1000) / 10);
      }
      const profitPct = donutOk ? Math.max(0, Math.round((100 - materialsPct - labourPct) * 10) / 10) : 0;

      // Job split - the same breakdown, but from real spend instead of the
      // estimate: accrued materials/labour (see "Estimated vs accrued
      // cost" above) against the quoted total, so it's directly
      // comparable to the Quoted split donut next to it.
      const jobDonutOk = pricingVisible && !!project.job_number && quoted > 0 && accruedProfit >= 0;
      let actualMaterialsPct = 0, actualLabourPct = 0;
      if (jobDonutOk) {
        actualMaterialsPct = Math.min(100, Math.round((accruedMaterialTotal / quoted) * 1000) / 10);
        actualLabourPct = Math.min(100 - actualMaterialsPct, Math.round((actualLabourTotal / quoted) * 1000) / 10);
      }
      const actualProfitPct = jobDonutOk ? Math.max(0, Math.round((100 - actualMaterialsPct - actualLabourPct) * 10) / 10) : 0;

      const overallBudgetPercent = labourSellTotal > 0 ? Math.round((actualLabourTotal / labourSellTotal) * 100) : 0;
      const overallIsOver = overallBudgetPercent > 100;

      content.innerHTML = `
        <h1>${project.name}</h1>
        <p class="subtitle">${project.client_name} &middot; <span class="badge ${project.status}">${project.status.replace('_',' ')}</span>${numberLine ? ' &middot; ' + numberLine : ''}</p>
        <div style="margin-bottom:20px;">
          ${pricingVisible && !editMode ? `
            <button id="edit-toggle-btn" class="secondary">${project.job_number ? 'Edit stages' : 'Edit quote'}</button>
            <button id="duplicate-btn" class="secondary">Duplicate as new project</button>
            ${project.job_number && project.quote_token ? `<a class="btn secondary" href="/quote.html?token=${project.quote_token}" target="_blank">Go to quote</a>` : ''}
            ${!project.job_number && isAccepted ? `<button type="button" class="secondary" id="go-to-job-btn">Go to job</button>` : ''}
          ` : ''}
          ${editMode ? `
            <button id="save-edit-btn">Save changes</button>
            <button type="button" class="secondary" id="cancel-edit-btn">Cancel</button>
          ` : ''}
          <div id="action-msg"></div>
          <div id="edit-msg"></div>
        </div>

        <div class="settings-tabs" id="job-tabs" style="flex-direction:row; position:static; border-bottom:1px solid var(--border); margin-bottom:20px; overflow-x:auto;">
          <button class="settings-tab active" data-panel="summary">Summary</button>
          <button class="settings-tab" data-panel="costcentres">Cost Centres</button>
          ${project.job_number && !editMode ? `<button class="settings-tab" data-panel="pos">Purchase Orders</button>` : ''}
          ${project.job_number && !editMode && pricingVisible ? `<button class="settings-tab" data-panel="invoices">Invoices</button>` : ''}
          <button class="settings-tab" data-panel="details">Details</button>
          ${!editMode ? `<button class="settings-tab" data-panel="documents">Documents</button>` : ''}
        </div>

        <div class="job-tab-layout">
          <div class="job-tab-main">

            <div class="settings-panel active" id="panel-summary">
              ${pricingVisible ? `
                <div class="grid cols-${project.job_number ? '4' : '3'}">
                  <div class="stat"><div class="label">Quote total</div><div class="value">${money(quoted)}</div></div>
                  <div class="stat"><div class="label">Cost estimate</div><div class="value">${money(cost)}</div></div>
                  <div class="stat"><div class="label">Estimated profit</div><div class="value ${profit >= 0 ? 'positive' : 'negative'}">${money(profit)}</div></div>
                  ${project.job_number ? `<div class="stat"><div class="label">Invoiced</div><div class="value">${money(invoiced)}</div></div>` : ''}
                </div>

                ${project.job_number ? `
                <div class="grid cols-2" style="margin-top:10px;">
                  <div class="stat"><div class="label">Actual cost</div><div class="value">${money(accruedTotal)}</div></div>
                  <div class="stat"><div class="label">Actual profit</div><div class="value ${accruedProfit >= 0 ? 'positive' : 'negative'}">${money(accruedProfit)}</div></div>
                </div>
                ` : ''}

                ${project.job_number ? `
                <div class="card" style="margin-top:20px;">
                  <h2>Progress</h2>
                  <div class="progress-track"><div class="progress-fill" style="width:${pctComplete}%"></div></div>
                  <p class="subtitle" style="margin:8px 0 0;">${pctComplete}% invoiced (${money(invoiced)} of ${money(quoted)})</p>
                  ${remaining > 0 ? `<button class="secondary" id="invoice-project-btn" style="margin-top:12px;">Invoice project...</button>` : ''}
                </div>

                <div class="card" style="margin-top:20px;">
                  <h2 style="margin-bottom:14px;">Estimated vs accrued cost</h2>
                  <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                    <span class="subtitle">Estimated</span>
                    <span style="font-weight:600;">${money(cost)}</span>
                  </div>
                  <div style="background:var(--surface-2); border-radius:999px; height:10px; overflow:hidden; margin-bottom:14px;">
                    <div style="background:var(--muted); width:${estimatedBarPct}%; height:100%; border-radius:999px;"></div>
                  </div>
                  <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                    <span class="subtitle">Accrued (real)</span>
                    <span id="cost-allocated-value" style="font-weight:600; cursor:pointer; text-decoration:underline dotted; text-underline-offset:4px; color:${accruedOverEstimate ? 'var(--red)' : 'var(--green)'};" title="Click to see the timesheets behind this figure">${money(accruedTotal)}</span>
                  </div>
                  <div style="background:var(--surface-2); border-radius:999px; height:10px; overflow:hidden;">
                    <div style="background:${accruedOverEstimate ? 'var(--red)' : 'var(--green)'}; width:${accruedBarPct}%; height:100%; border-radius:999px;"></div>
                  </div>
                  <p class="subtitle" style="margin-top:8px;">Accrued = actual labour cost from timesheets + received purchase order line items. Click the accrued figure to see the timesheets behind it.</p>
                </div>
                ` : ''}
              ` : ''}

              <div class="card">
                <h2>Needs attention</h2>
                <div id="summary-po-line">${project.job_number ? `<p class="subtitle">Loading purchase orders...</p>` : `<p class="subtitle">Purchase orders start once this quote is approved and becomes a job.</p>`}</div>
              </div>

              ${!editMode ? `
              <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                  <h2 style="margin:0;">Tasks</h2>
                  <button type="button" id="add-task-btn" class="secondary">+ Add task</button>
                </div>
                <div id="job-tasks-list"><p class="subtitle">Loading...</p></div>
              </div>
              ` : ''}

              ${pricingVisible ? `
                <div class="grid ${project.job_number ? 'cols-2' : ''}">
                  <div class="card">
                    <h2>Quoted split</h2>
                    ${donutOk ? `
                      <div style="display:flex; align-items:center; gap:24px; flex-wrap:wrap;">
                        <div style="width:120px; height:120px; border-radius:50%; flex-shrink:0; background:conic-gradient(var(--accent) 0% ${materialsPct}%, var(--green) ${materialsPct}% ${materialsPct + labourPct}%, ${profit >= 0 ? 'var(--muted)' : 'var(--red)'} ${materialsPct + labourPct}% 100%);"></div>
                        <div>
                          <p style="margin:0 0 6px;"><span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--accent); margin-right:8px;"></span>Materials - ${money(materialCostTotal)} (${materialsPct}%)</p>
                          <p style="margin:0 0 6px;"><span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--green); margin-right:8px;"></span>Labour - ${money(labourCostTotal)} (${labourPct}%)</p>
                          <p style="margin:0;"><span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--muted); margin-right:8px;"></span>Profit - ${money(profit)} (${profitPct}%)</p>
                        </div>
                      </div>
                    ` : `<p class="subtitle">${quoted > 0 ? `Cost (${money(cost)}) has passed the quoted total (${money(quoted)}) - no split to show.` : 'Add quoted amounts to a stage to see the split.'}</p>`}
                  </div>

                  ${project.job_number ? `
                  <div class="card">
                    <h2>Job split</h2>
                    <p class="subtitle" style="margin:0 0 12px;">Same breakdown, from real spend so far.</p>

                              ${!inv.xero_invoice_id ? `<button class="secondary push-xero-btn" data-invoice-id="${inv.id}" style="font-size:12px; padding:6px 10px;">Push to Xero</button>` : `<span class="subtitle" style="font-size:11px;">In Xero</span>`}

                  ${c.stc_total > 0 ? `<p class="subtitle">STC entitlement: ${money(c.stc_total)} - applied so far: ${money(stcApplied)}, remaining: ${money(stcRemaining)}.</p>` : ''}
                  ${remaining > 0 ? `<button class="secondary create-invoice-btn" data-id="${c.id}" style="margin-top:6px;">Create &amp; send next claim</button>` : ''}
                </div>`;
              }).join('') : ''}
              <div id="push-xero-msg"></div>
              `}
            </div>

            ${project.job_number && !editMode ? `
            <div class="settings-panel" id="panel-pos">
              <div class="card">
                <h2>Purchase orders &amp; supplier invoices</h2>
                <p class="subtitle" style="margin-bottom:14px;">Tracked separately so costs aren't double-counted.</p>
                <div id="po-list"></div>
                <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:${centres.length ? '16px' : '0'};">
                  <button type="button" id="create-po-btn" class="secondary">+ Create purchase order</button>
                  <button type="button" id="suggest-po-btn" class="secondary">Generate PO suggestions from quote</button>
                </div>
                <div id="po-msg"></div>
              </div>

            ${project.job_number && !editMode && pricingVisible ? `
            <div class="settings-panel" id="panel-invoices">
              <div class="card">
                <h2>Invoices</h2>
                <p class="subtitle" style="margin-bottom:14px;">How each invoice is coded to post to Xero - materials, labour, and STC credit as their own lines, per the mapping in Settings &gt; Xero Mapping. Each invoice pushes to Xero on its own, never bundled with others.</p>
                <div id="job-invoices-list"><p class="subtitle">Loading...</p></div>

            </div>
            ` : ''}

            <div class="settings-panel" id="panel-details">
              ${editMode && !project.job_number ? editorPanelHtml() : `
              ${(() => {
                const contactRows = [
                  { label: 'Project manager', c: project.project_manager },
                  { label: 'Site supervisor', c: project.site_contact },
                  { label: 'Job contact', c: project.job_contact },

                return `

                  <thead><tr><th>Role</th><th>Name</th><th>Phone</th><th>Email</th></tr></thead>
                  <tbody>
                    ${contactRows.map(r => `<tr><td>${r.label}</td><td>${r.c.name || ''}</td><td>${r.c.phone ? `<a class="link-quiet" href="tel:${r.c.phone}">${r.c.phone}</a>` : ''}</td><td>${r.c.email ? `<a class="link-quiet" href="mailto:${r.c.email}">${r.c.email}</a>` : ''}</td></tr>`).join('')}

              ${!['time_and_materials', 'direct_job'].includes(project.proposal_template) ? `

                  <a class="btn secondary" target="_blank" href="${quoteUrl}${quoteUrl.includes('?') ? '&' : '?'}print=1">Download PDF</a>
                </div>
                ${pricingVisible ? `<p class="subtitle" style="margin-top:14px;">Deposit: ${project.deposit_percent}% (${money(quoted * (project.deposit_percent / 100))}) due on acceptance, remainder invoiced per stage on completion.</p>` : ''}
                ${project.proposal_template === 'solar' && project.pylon_link ? `<p class="subtitle" style="margin-top:6px;">Pylon design: <a class="link-quiet" href="${project.pylon_link}" target="_blank" rel="noopener">${project.pylon_link}</a></p>` : ''}
              </div>
              ` : ''}

              ${['client_handover', 'awaiting_payment', 'archived'].includes(project.pipeline_stage) ? `
              <div class="card">
                <h2>Compliance - CCEW</h2>

                <div id="ccew-section"></div>

                <div id="variations-list"><p class="subtitle">Loading...</p></div>
              </div>
              ` : ''}
              `}
            </div>

            ${!editMode ? `
            <div class="settings-panel" id="panel-documents">
              <div class="card">
                <h2>Documents</h2>
                <p class="subtitle" style="margin-bottom:14px;">Shared between the quote and the job - it's the same list either way, since they're the same underlying record.</p>
                <div id="doc-folder-pills" style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;"></div>

              <div class="card">
                <h2>Upload</h2>
                <label style="margin-top:0">Folder</label>
                <div style="display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap;">

                  <span class="subtitle">or</span>
                  <input id="doc-new-folder" placeholder="New folder name" style="flex:1; min-width:160px;" />
                </div>
                <input type="file" id="doc-file-input" multiple />
                <button type="button" id="doc-upload-btn" class="secondary" style="margin-top:10px;">Upload</button>
                <div id="doc-upload-msg"></div>
              </div>
            </div>

          </div>

          <div class="job-activity-sidebar">
            <div class="card">
              <h2>Activity log</h2>
              <div id="job-activity-log"><p class="subtitle">Loading...</p></div>
            </div>
          </div>
        </div>
      `;

      document.querySelectorAll('#job-tabs .settings-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#job-tabs .settings-tab').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.job-tab-main .settings-panel').forEach(p => p.classList.remove('active'));

          document.getElementById('panel-' + btn.dataset.panel).classList.add('active');

      renderActivityLog('project', project.id, 'job-activity-log');

      if (editMode) {
        wireEditForm(project);

      if (project.job_number) loadPurchaseOrders(project.id, centres);
      if (document.getElementById('job-invoices-list')) loadJobInvoices(project);

      wireDocumentUpload(project);
      if (document.getElementById('ccew-section')) initCcewSection(project);

      const costAllocatedEl = document.getElementById('cost-allocated-value');
      if (costAllocatedEl) costAllocatedEl.addEventListener('click', () => openTimesheetDrilldown(project, pricingVisible));

      document.querySelectorAll('.create-invoice-btn').forEach(btn => {
        btn.addEventListener('click', () => openInvoiceProjectPanel(project, pricingVisible, { preselectCentreId: btn.dataset.id }));
      });
      const invoiceProjectBtn = document.getElementById('invoice-project-btn');
      if (invoiceProjectBtn) invoiceProjectBtn.addEventListener('click', () => openInvoiceProjectPanel(project, pricingVisible));
      document.querySelectorAll('.push-xero-btn').forEach(btn => {
        btn.addEventListener('click', () => pushExistingInvoiceToXero(btn));

      const editToggleBtn = document.getElementById('edit-toggle-btn');
      if (editToggleBtn) editToggleBtn.addEventListener('click', () => enterEditMode(project));

      document.getElementById('toggle-line-items-btn').addEventListener('click', () => {
        showLineItems = !showLineItems;
        render(project, pricingVisible);
        document.querySelector('#job-tabs .settings-tab[data-panel="costcentres"]').click();
      });

      // Job numbers are assigned automatically the moment a quote is
      // accepted - this button only ever shows for the rare case where
      // this page was already loaded before that happened, so a reload
      // is all it takes to pick up the job number that's already there.
      const goToJobBtn = document.getElementById('go-to-job-btn');
      if (goToJobBtn) goToJobBtn.addEventListener('click', () => location.reload());

      const duplicateBtn = document.getElementById('duplicate-btn');
      if (duplicateBtn) duplicateBtn.addEventListener('click', async () => {
        const btn = document.getElementById('duplicate-btn');
        btn.disabled = true;
        btn.textContent = 'Duplicating...';
        try {
          const { data: fullProject, error: loadErr } = await supabaseClient
            .from('projects')
            .select('*, cost_centres(*, cost_centre_line_items(*), cost_centre_photo_groups(*))')
            .eq('id', project.id)
            .single();
          if (loadErr) throw loadErr;

          const { data: newProject, error: insErr } = await supabaseClient
            .from('projects')
            .insert({
              name: `${fullProject.name} (copy)`,
              client_name: fullProject.client_name,
              client_email: fullProject.client_email,
              client_address: fullProject.client_address,
              sow_text: fullProject.sow_text,
              proposal_subtitle: fullProject.proposal_subtitle,
              terms_text: fullProject.terms_text,
              deposit_percent: fullProject.deposit_percent,
              pylon_link: fullProject.pylon_link,
              reference_photos: fullProject.reference_photos,
              cover_photos: fullProject.cover_photos,
            })
            .select()
            .single();
          if (insErr) throw insErr;

          const stages = fullProject.cost_centres.sort((a, b) => a.sort_order - b.sort_order);
          const { data: newStages, error: stagesErr } = await supabaseClient
            .from('cost_centres')
            .insert(stages.map(s => ({
              project_id: newProject.id,
              name: s.name,
              description: s.description,
              sort_order: s.sort_order,
              markup_percent: s.markup_percent,
              estimated_labour_cost: s.estimated_labour_cost,
              estimated_material_cost: s.estimated_material_cost,
              quoted_amount: s.quoted_amount,
            })))
            .select();
          if (stagesErr) throw stagesErr;

          const allLineItems = [];
          const allPhotoGroups = [];
          stages.forEach((s, i) => {
            (s.cost_centre_line_items || []).forEach(li => {
              allLineItems.push({
                cost_centre_id: newStages[i].id,
                description: li.description,
                item_type: li.item_type,
                quantity: li.quantity,
                unit_cost: li.unit_cost,
                sort_order: li.sort_order,
              });
            });
            (s.cost_centre_photo_groups || []).forEach(pg => {
              allPhotoGroups.push({
                cost_centre_id: newStages[i].id,
                description: pg.description,
                photos: pg.photos,
                sort_order: pg.sort_order,
              });
            });
          });
          if (allLineItems.length) {
            const { error: liErr } = await supabaseClient.from('cost_centre_line_items').insert(allLineItems);
            if (liErr) throw liErr;
          }
          if (allPhotoGroups.length) {
            const { error: pgErr } = await supabaseClient.from('cost_centre_photo_groups').insert(allPhotoGroups);
            if (pgErr) throw pgErr;
          }

          window.location.href = `/new-project.html?id=${newProject.id}`;
        } catch (err) {
          document.getElementById('action-msg').innerHTML = `<div class="error-box">${err.message}</div>`;
          btn.disabled = false;
          btn.textContent = 'Duplicate as new project';
        }
      });
