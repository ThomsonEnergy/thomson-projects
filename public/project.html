<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('te-theme') || 'dark');</script>
<title>Project - Thomson Energy</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=8" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('mobile-menu-dropdown').classList.toggle('open')">&#9776;</button>
    <div class="mobile-menu-dropdown" id="mobile-menu-dropdown"></div>
    <nav class="topbar-tabs" id="topbar-tabs"></nav>
    <div class="topbar-right">
      <a href="/schedule.html" class="topbar-icon-link" title="Schedule">&#128197;</a>
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/home.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="wrap">
    <div id="content"><p class="subtitle">Loading...</p></div>
  </div>

  <script src="/js/supabase-client.js"></script>
  <script src="/js/theme.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const projectId = params.get('id');

    async function loadProject() {
      const centreCols = await costCentreColumns();
      const { data: project, error } = await supabaseClient
        .from('projects')
        .select(`*, cost_centres(${centreCols}, invoices(*), cost_centre_line_items(id, item_type, description, quantity, unit_cost)),
          project_manager:client_contacts!project_manager_contact_id(name, phone, email),
          site_contact:client_contacts!site_contact_id(name, phone, email),
          job_contact:client_contacts!job_contact_id(name, phone, email),
          sales_contact:client_contacts!sales_contact_id(name, phone, email),
          accounts_contact:client_contacts!accounts_contact_id(name, phone, email)`)
        .eq('id', projectId)
        .single();
      if (error) {
        document.getElementById('content').innerHTML = `<div class="error-box">${error.message}</div>`;
        return null;
      }

      // Real labour cost/hours per stage - fetched here (async RPCs) so
      // render() itself can stay a plain synchronous template function.
      for (const centre of project.cost_centres || []) {
        const [{ data: actualCost }, { data: actualHours }] = await Promise.all([
          supabaseClient.rpc('get_stage_actual_labour_cost', { p_cost_centre_id: centre.id }),
          supabaseClient.rpc('get_stage_actual_hours', { p_cost_centre_id: centre.id }),
        ]);
        centre.actual_labour_cost = Number(actualCost) || 0;
        centre.actual_hours = Number(actualHours) || 0;
        centre.quoted_hours = (centre.cost_centre_line_items || [])
          .filter(li => li.item_type === 'labour')
          .reduce((sum, li) => sum + (Number(li.quantity) || 0), 0);
      }

      return project;
    }

    function openCreateInvoicePanel(btn, project, pricingVisible) {
      const centreId = btn.dataset.id;
      const centre = project.cost_centres.find(c => c.id === centreId);
      if (!centre) return;

      const stageInvoices = centre.invoices || [];
      const claimedTotal = stageInvoices.reduce((s, inv) => s + Number(inv.labour_amount) + Number(inv.material_amount), 0);
      const quotedAmount = Number(centre.quoted_amount) || 0;
      const remaining = Math.max(0, quotedAmount - claimedTotal);

      const labourCost = Number(centre.labour_cost) || 0;
      const materialCost = Number(centre.material_cost) || 0;
      const costTotal = labourCost + materialCost;
      const labourShare = costTotal > 0 ? labourCost / costTotal : 1;
      const defaultLabourAmount = Math.round(remaining * labourShare * 100) / 100;
      const defaultMaterialAmount = Math.round((remaining - defaultLabourAmount) * 100) / 100;

      const stcApplied = stageInvoices.reduce((s, inv) => s + Number(inv.stc_amount || 0), 0);
      const stcRemaining = Math.max(0, Number(centre.stc_total || 0) - stcApplied);

      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:480px; width:100%; max-height:85vh; overflow-y:auto;">
          <h2>Create &amp; send ${stageInvoices.length ? 'next claim' : 'invoice'}</h2>
          <p class="subtitle" style="margin-bottom:12px;">${centre.name} &middot; ${money(remaining)} remaining to claim. Adjust the amounts or invoice number if this claim shouldn't be for the full remaining balance.</p>

          <label style="margin-top:0">Invoice number</label>
          <input id="create-invoice-number" placeholder="Leave blank to auto-assign the next number" />

          <div class="grid cols-3">
            <div>
              <label>Labour amount</label>
              <input type="number" step="0.01" id="create-invoice-labour" value="${defaultLabourAmount}" />
            </div>
            <div>
              <label>Materials amount</label>
              <input type="number" step="0.01" id="create-invoice-materials" value="${defaultMaterialAmount}" />
            </div>
            <div>
              <label>Total</label>
              <input id="create-invoice-total" readonly style="background:var(--surface); color:var(--muted);" />
            </div>
          </div>

          ${stcRemaining > 0 ? `
            <label>STC credit to apply on this claim</label>
            <input type="number" step="0.01" id="create-invoice-stc" value="${stcRemaining}" />
            <p class="subtitle" style="margin:4px 0 0;">${money(stcRemaining)} STC credit outstanding for this stage. Set to 0 to defer it to a later claim - it'll still show as owing on the claim summary either way.</p>
          ` : '<input type="hidden" id="create-invoice-stc" value="0" />'}

          <div style="margin-top:14px;">
            <button id="create-invoice-confirm-btn">Create &amp; send</button>
            <button type="button" class="secondary" id="create-invoice-cancel-btn">Cancel</button>
          </div>
          <div id="create-invoice-panel-msg"></div>
        </div>`;

      function updateTotal() {
        const l = parseFloat(overlay.querySelector('#create-invoice-labour').value) || 0;
        const m = parseFloat(overlay.querySelector('#create-invoice-materials').value) || 0;
        const s = parseFloat(overlay.querySelector('#create-invoice-stc').value) || 0;
        overlay.querySelector('#create-invoice-total').value = money(l + m - s);
      }
      overlay.querySelector('#create-invoice-labour').addEventListener('input', updateTotal);
      overlay.querySelector('#create-invoice-materials').addEventListener('input', updateTotal);
      const stcInput = overlay.querySelector('#create-invoice-stc');
      if (stcInput) stcInput.addEventListener('input', updateTotal);

      overlay.querySelector('#create-invoice-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#create-invoice-confirm-btn').addEventListener('click', async () => {
        const confirmBtn = overlay.querySelector('#create-invoice-confirm-btn');
        const panelMsg = overlay.querySelector('#create-invoice-panel-msg');
        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Creating...';

        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          const labourAmt = parseFloat(overlay.querySelector('#create-invoice-labour').value) || 0;
          const materialAmt = parseFloat(overlay.querySelector('#create-invoice-materials').value) || 0;
          const claimPercent = quotedAmount > 0 ? Math.round(((claimedTotal + labourAmt + materialAmt) / quotedAmount) * 10000) / 100 : 100;

          const res = await fetch('/.netlify/functions/create-invoice', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
            body: JSON.stringify({
              costCentreId: centreId,
              labourAmount: labourAmt,
              materialAmount: materialAmt,
              stcAmount: parseFloat(overlay.querySelector('#create-invoice-stc').value) || 0,
              claimPercent,
              invoiceNumber: overlay.querySelector('#create-invoice-number').value.trim() || null,
            }),
          });
          const data = await res.json();
          if (!res.ok || !data.ok) throw new Error(data.error || 'Could not create the invoice');

          const invoiceUrl = `${window.location.origin}/invoice.html?token=${data.invoiceToken}`;
          panelMsg.innerHTML = `
            <div class="success-box">Created as ${data.invoiceNumber}.</div>
            <label>Invoice link</label>
            <input readonly value="${invoiceUrl}" onclick="this.select()" />
            <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
              <a class="btn secondary" target="_blank" href="${gmailComposeUrl({ to: project.client_email || '', subject: 'Invoice ' + data.invoiceNumber + ' - ' + project.name, body: 'Hi ' + project.client_name + ',\n\nPlease find your invoice here:\n' + invoiceUrl + '\n\nThanks,\nThomson Energy' })}">Email invoice to client</a>
              <a class="btn secondary" target="_blank" href="/invoice.html?token=${data.invoiceToken}&print=1">Download PDF</a>
            </div>
            <p class="subtitle" style="margin-top:6px;">Gmail opens in a new tab ready to send - the PDF downloads separately, so you'll need to attach it yourself once Gmail's open (no browser can auto-attach a file for you). The client's invoice page already has a Pay Online option alongside your bank details, generated automatically - nothing else to do here.</p>`;
          confirmBtn.style.display = 'none';
          overlay.querySelector('#create-invoice-cancel-btn').textContent = 'Close';

          const refreshed = await loadProject();
          if (refreshed) render(refreshed, pricingVisible);
        } catch (err) {
          panelMsg.innerHTML = `<div class="error-box">${err.message}</div>`;
          confirmBtn.disabled = false;
          confirmBtn.textContent = 'Create & send';
        }
      });

      document.body.appendChild(overlay);
      updateTotal();
    }

    async function pushExistingInvoiceToXero(btn) {
      const msg = document.getElementById('push-xero-msg');
      btn.disabled = true;
      btn.textContent = 'Pushing...';
      msg.innerHTML = '';
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        const res = await fetch('/.netlify/functions/push-invoice-to-xero', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify({ invoiceId: btn.dataset.invoiceId }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Push failed');
        msg.innerHTML = `<div class="success-box">Pushed ${data.invoiceNumber} to Xero.</div>`;
        location.reload();
      } catch (err) {
        msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        btn.disabled = false;
        btn.textContent = 'Push to Xero';
      }
    }

    async function initCcewSection(project) {
      const el = document.getElementById('ccew-section');
      if (!el) return;

      if (project.ccew_file_path) {
        let viewUrl = '#';
        try { viewUrl = await getSignedDocUrl(project.ccew_file_path); } catch {}
        el.innerHTML = `
          <div class="success-box" style="margin-bottom:10px;">CCEW uploaded.</div>
          <a class="btn secondary" href="${viewUrl}" target="_blank">View certificate</a>
          <button type="button" class="secondary" id="ccew-replace-btn" style="margin-left:8px;">Replace</button>`;
        el.querySelector('#ccew-replace-btn').addEventListener('click', () => renderCcewUploadForm(project));
      } else if (project.ccew_not_required_reason) {
        el.innerHTML = `
          <div class="badge draft" style="margin-bottom:10px; display:inline-block;">Not required</div>
          <p class="subtitle" style="margin-bottom:10px;">${project.ccew_not_required_reason}</p>
          <button type="button" class="secondary" id="ccew-change-btn">Upload one instead / change reason</button>`;
        el.querySelector('#ccew-change-btn').addEventListener('click', () => renderCcewUploadForm(project));
      } else {
        renderCcewUploadForm(project);
      }
    }

    function renderCcewUploadForm(project) {
      const el = document.getElementById('ccew-section');
      el.innerHTML = `
        <label style="margin-top:0">Upload the certificate</label>
        <input type="file" id="ccew-file-input" accept=".pdf,.jpg,.jpeg,.png" />
        <p class="subtitle" style="margin:10px 0 4px;">Or, if this job isn't electrical work and no CCEW applies:</p>
        <input id="ccew-reason-input" placeholder="e.g. Not electrical work" />
        <button id="ccew-save-reason-btn" style="margin-top:8px;">Save reason</button>
        <div id="ccew-msg"></div>`;

      el.querySelector('#ccew-file-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const msg = el.querySelector('#ccew-msg');
        msg.innerHTML = `<p class="subtitle">Uploading...</p>`;
        try {
          const path = await uploadPrivateFile(file, `ccew/${project.id}`);
          const { error } = await supabaseClient.from('projects').update({ ccew_file_path: path, ccew_not_required_reason: null }).eq('id', project.id);
          if (error) throw error;
          project.ccew_file_path = path;
          project.ccew_not_required_reason = null;
          await initCcewSection(project);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        }
      });

      el.querySelector('#ccew-save-reason-btn').addEventListener('click', async () => {
        const reason = el.querySelector('#ccew-reason-input').value.trim();
        const msg = el.querySelector('#ccew-msg');
        if (!reason) { msg.innerHTML = `<div class="error-box">Enter a reason.</div>`; return; }
        const { error } = await supabaseClient.from('projects').update({ ccew_not_required_reason: reason, ccew_file_path: null }).eq('id', project.id);
        if (error) { msg.innerHTML = `<div class="error-box">${error.message}</div>`; return; }
        project.ccew_not_required_reason = reason;
        project.ccew_file_path = null;
        await initCcewSection(project);
      });
    }

    function render(project, pricingVisible) {
      const centres = project.cost_centres.sort((a, b) => a.sort_order - b.sort_order);
      const quoted = centres.reduce((s, c) => s + Number(c.quoted_amount || 0), 0);
      const cost = centres.reduce((s, c) => s + Number(c.labour_cost || 0) + Number(c.material_cost || 0), 0);
      const invoiced = centres.reduce((s, c) => s + Number(c.invoiced_amount || 0), 0);
      const profit = quoted - cost;
      const pctComplete = quoted ? Math.min(100, Math.round((invoiced / quoted) * 100)) : 0;
      const remaining = Math.max(0, quoted - invoiced);
      const quoteUrl = `${window.location.origin}/quote.html?token=${project.quote_token}`;

      const content = document.getElementById('content');
      const numberLine = [
        project.job_number ? `Job #${project.job_number}` : null,
        project.quote_number ? `Quote #${project.quote_number}` : null,
      ].filter(Boolean).join(' &middot; ');
      content.innerHTML = `
        <h1>${project.name}</h1>
        <p class="subtitle">${project.client_name} &middot; <span class="badge ${project.status}">${project.status.replace('_',' ')}</span>${numberLine ? ' &middot; ' + numberLine : ''}</p>
        <div style="margin-bottom:20px;">
          ${pricingVisible ? `
            <a class="btn secondary" href="/new-project.html?id=${project.id}">Edit quote</a>
            <button id="duplicate-btn" class="secondary">Duplicate as new project</button>
          ` : ''}
        </div>

        ${pricingVisible ? `
          <div class="grid cols-4">
            <div class="stat"><div class="label">Quoted total</div><div class="value">${money(quoted)}</div></div>
            <div class="stat"><div class="label">Cost allocated</div><div class="value">${money(cost)}</div></div>
            <div class="stat"><div class="label">Profit (quoted - cost)</div><div class="value ${profit >= 0 ? 'positive' : 'negative'}">${money(profit)}</div></div>
            <div class="stat"><div class="label">Left to invoice</div><div class="value">${money(remaining)}</div></div>
          </div>

          <div class="card" style="margin-top:20px;">
            <h2>Progress</h2>
            <div class="progress-track"><div class="progress-fill" style="width:${pctComplete}%"></div></div>
            <p class="subtitle" style="margin:8px 0 0;">${pctComplete}% invoiced (${money(invoiced)} of ${money(quoted)})</p>
          </div>
        ` : ''}

        ${(() => {
          const contactRows = [
            { label: 'Project manager', c: project.project_manager },
            { label: 'Site supervisor', c: project.site_contact },
            { label: 'Job contact', c: project.job_contact },
            { label: 'Sales contact', c: project.sales_contact },
            { label: 'Accounts contact', c: project.accounts_contact },
          ].filter(r => r.c && r.c.name);
          if (!contactRows.length) return '';
          return `
        <div class="card">
          <h2>Who's running this job</h2>
          <table>
            <thead><tr><th>Role</th><th>Name</th><th>Phone</th><th>Email</th></tr></thead>
            <tbody>
              ${contactRows.map(r => `<tr><td>${r.label}</td><td>${r.c.name || ''}</td><td>${r.c.phone ? `<a class="link-quiet" href="tel:${r.c.phone}">${r.c.phone}</a>` : ''}</td><td>${r.c.email ? `<a class="link-quiet" href="mailto:${r.c.email}">${r.c.email}</a>` : ''}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>`;
        })()}

        ${!['time_and_materials', 'direct_job'].includes(project.proposal_template) ? `
        <div class="card">
          <h2>Client quote link</h2>
          <p class="subtitle" style="margin-bottom:10px;">Share this link with the client, or email them the quote directly.</p>
          <input readonly value="${quoteUrl}" style="margin-bottom:10px;" onclick="this.select()" />
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <a class="btn secondary" target="_blank" href="${gmailComposeUrl({ to: project.client_email || '', subject: 'Quote: ' + project.name, body: 'Hi ' + project.client_name + ',\n\nPlease find your quote here:\n' + quoteUrl + '\n\nThanks,\nThomson Energy' })}">Email quote to client</a>
            <a class="btn secondary" target="_blank" href="${quoteUrl}${quoteUrl.includes('?') ? '&' : '?'}print=1">Download PDF</a>
          </div>
          ${pricingVisible ? `<p class="subtitle" style="margin-top:14px;">Deposit: ${project.deposit_percent}% (${money(quoted * (project.deposit_percent / 100))}) due on acceptance, remainder invoiced per stage on completion.</p>` : ''}
          ${project.proposal_template === 'solar' && project.pylon_link ? `<p class="subtitle" style="margin-top:6px;">Pylon design: <a class="link-quiet" href="${project.pylon_link}" target="_blank" rel="noopener">${project.pylon_link}</a></p>` : ''}
        </div>
        ` : ''}

        ${['client_handover', 'awaiting_payment', 'archived'].includes(project.pipeline_stage) ? `
        <div class="card">
          <h2>Compliance - CCEW</h2>
          <p class="subtitle" style="margin-bottom:10px;">Submitted through the Building and Energy Commission's own website - upload the resulting certificate here for the record, or state why one isn't needed.</p>
          <div id="ccew-section"></div>
        </div>
        ` : ''}

        <div class="card">
          <h2>Stages</h2>
          <table class="responsive-stack">
            <thead>
              <tr>
                <th>#</th><th>Stage</th>
                ${pricingVisible ? '<th class="num">Quoted</th><th class="num">Labour</th><th class="num">Materials</th><th class="num">Invoiced</th>' : ''}
              </tr>
            </thead>
            <tbody>
              ${centres.map((c, i) => `
                <tr>
                  <td data-label="#">${costCentreNumber(project.job_number, i + 1)}</td>
                  <td data-label="Stage">${c.name}</td>
                  ${pricingVisible ? `
                    <td class="num" data-label="Quoted">${moneyOrHidden(c.quoted_amount)}</td>
                    <td class="num" data-label="Labour">${moneyOrHidden(c.labour_cost)}</td>
                    <td class="num" data-label="Materials">${moneyOrHidden(c.material_cost)}</td>
                    <td class="num" data-label="Invoiced">${moneyOrHidden(c.invoiced_amount)}</td>
                  ` : ''}
                </tr>`).join('')}
            </tbody>
          </table>
        </div>

        ${centres.map((c, i) => {
          const quotedLabour = Number(c.labour_cost) || 0;
          const actualLabour = Number(c.actual_labour_cost) || 0;
          const quotedHours = Number(c.quoted_hours) || 0;
          const actualHours = Number(c.actual_hours) || 0;
          const budgetPercent = quotedLabour > 0 ? Math.round((actualLabour / quotedLabour) * 100) : 0;
          const isOver = budgetPercent > 100;

          if (pricingVisible) {
            const marginPercent = quotedLabour > 0 ? Math.round(((quotedLabour - actualLabour) / quotedLabour) * 100) : null;
            return `
            <div class="card">
              <h2 style="margin-bottom:2px;">${costCentreNumber(project.job_number, i + 1)} ${c.name} - labour</h2>
              <p class="subtitle" style="margin-bottom:14px;">Labour only - full gross profit needs materials cost too, once the materials database exists.</p>
              <div class="grid cols-3">
                <div>
                  <p class="subtitle" style="margin:0 0 4px;">Quoted</p>
                  <p style="font-size:20px; font-weight:600; margin:0;">${money(quotedLabour)}</p>
                </div>
                <div>
                  <p class="subtitle" style="margin:0 0 4px;">Actual cost</p>
                  <p style="font-size:20px; font-weight:600; margin:0;">${money(actualLabour)}</p>
                </div>
                <div>
                  <p class="subtitle" style="margin:0 0 4px;">Labour margin</p>
                  <p style="font-size:20px; font-weight:600; margin:0; color:${marginPercent === null ? 'inherit' : marginPercent >= 0 ? 'var(--green)' : 'var(--red)'};">${marginPercent === null ? '-' : marginPercent + '%'}</p>
                </div>
              </div>
            </div>`;
          }

          // Staff/Sales - hours only, budget-% bar (driven by real cost
          // internally, never shown as a dollar figure) so two apprentices
          // taking more hours at a lower rate can still correctly show as
          // under budget, rather than falsely flagging on hours alone.
          const barWidthPercent = Math.min(100, budgetPercent);
          const trackScale = isOver ? budgetPercent : 100;
          const markerPosition = isOver ? Math.round((100 / trackScale) * 100 * 10) / 10 : null;
          return `
          <div class="card">
            <h2 style="margin-bottom:2px;">${costCentreNumber(project.job_number, i + 1)} ${c.name} - labour</h2>
            <p class="subtitle" style="margin-bottom:14px;">${actualHours} hrs logged - ${quotedHours} hrs quoted</p>
            <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
              <span class="subtitle">Labour budget</span>
              <span style="font-weight:600; color:${isOver ? 'var(--red)' : 'var(--green)'};">${budgetPercent}%</span>
            </div>
            <div style="position:relative; background:var(--surface-2); border-radius:999px; height:10px; overflow:${isOver ? 'visible' : 'hidden'};">
              <div style="background:${isOver ? 'var(--red)' : 'var(--green)'}; width:${isOver ? '100%' : barWidthPercent + '%'}; height:100%; border-radius:999px;"></div>
              ${isOver ? `<div style="position:absolute; left:${markerPosition}%; top:-4px; width:2px; height:18px; background:var(--text);"></div>` : ''}
            </div>
            ${isOver ? `<div style="position:relative; height:14px;"><span style="position:absolute; left:${markerPosition}%; transform:translateX(-50%); font-size:11px; color:var(--muted);">100%</span></div>` : ''}
            <p class="subtitle" style="margin-top:8px; color:${isOver ? 'var(--red)' : 'var(--green)'};">${isOver ? (budgetPercent - 100) + '% over' : (100 - budgetPercent) + '% remaining'}</p>
          </div>`;
        }).join('')}

        ${pricingVisible ? centres.map((c, i) => {

          const remaining = Math.max(0, quotedAmt - claimedTotal);
          const stcApplied = stageInvoices.reduce((s, inv) => s + Number(inv.stc_amount || 0), 0);

      if (document.getElementById('ccew-section')) initCcewSection(project);

      document.querySelectorAll('.create-invoice-btn').forEach(btn => {
        btn.addEventListener('click', () => openCreateInvoicePanel(btn, project, pricingVisible));

      document.querySelectorAll('.push-xero-btn').forEach(btn => {

      const duplicateBtn = document.getElementById('duplicate-btn');
      if (duplicateBtn) duplicateBtn.addEventListener('click', async () => {

        try {

            .from('projects')

            .single();
          if (loadErr) throw loadErr;

          const { data: newProject, error: insErr } = await supabaseClient
            .from('projects')
            .insert({
              name: `${fullProject.name} (copy)`,
              client_name: fullProject.client_name,
              client_email: fullProject.client_email,
              client_address: fullProject.client_address,
              sow_text: fullProject.sow_text,
              proposal_subtitle: fullProject.proposal_subtitle,
              terms_text: fullProject.terms_text,
              deposit_percent: fullProject.deposit_percent,
              pylon_link: fullProject.pylon_link,
              reference_photos: fullProject.reference_photos,
              cover_photos: fullProject.cover_photos,
            })
            .select()
            .single();
          if (insErr) throw insErr;

          const stages = fullProject.cost_centres.sort((a, b) => a.sort_order - b.sort_order);
          const { data: newStages, error: stagesErr } = await supabaseClient
            .from('cost_centres')
            .insert(stages.map(s => ({
              project_id: newProject.id,
              name: s.name,
              description: s.description,
              sort_order: s.sort_order,
              markup_percent: s.markup_percent,
              estimated_labour_cost: s.estimated_labour_cost,
              estimated_material_cost: s.estimated_material_cost,
              quoted_amount: s.quoted_amount,
            })))
            .select();
          if (stagesErr) throw stagesErr;

          const allLineItems = [];
          const allPhotoGroups = [];
          stages.forEach((s, i) => {
            (s.cost_centre_line_items || []).forEach(li => {
              allLineItems.push({
                cost_centre_id: newStages[i].id,
                description: li.description,
                item_type: li.item_type,
                quantity: li.quantity,
                unit_cost: li.unit_cost,
                sort_order: li.sort_order,
              });
            });
            (s.cost_centre_photo_groups || []).forEach(pg => {
              allPhotoGroups.push({
                cost_centre_id: newStages[i].id,
                description: pg.description,
                photos: pg.photos,
                sort_order: pg.sort_order,
              });
            });
          });
          if (allLineItems.length) {
            const { error: liErr } = await supabaseClient.from('cost_centre_line_items').insert(allLineItems);
            if (liErr) throw liErr;
          }
          if (allPhotoGroups.length) {
            const { error: pgErr } = await supabaseClient.from('cost_centre_photo_groups').insert(allPhotoGroups);
            if (pgErr) throw pgErr;
          }

          window.location.href = `/new-project.html?id=${newProject.id}`;
        } catch (err) {
          document.getElementById('action-msg').innerHTML = `<div class="error-box">${err.message}</div>`;
          btn.disabled = false;
          btn.textContent = 'Duplicate as new project';
        }
      });

    }

            <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px;">

                <span class="badge draft" style="margin-left:6px;">${po.po_type === 'open' ? 'Open-ended' : 'Fixed'}</span>
                ${po.locked ? '<span class="badge draft">Locked</span>' : ''}
              </div>
              <div>

                <div style="background:var(--surface-2); border-radius:999px; height:8px; overflow:hidden;">
                  <div style="background:${budgetPercent > 100 ? 'var(--red)' : 'var(--green)'}; width:${Math.min(100, budgetPercent)}%; height:100%;"></div>

            ${po.file_path ? `<a href="#" class="link-quiet view-doc" data-path="${po.file_path}" style="display:block; margin-top:8px; font-size:13px;">${po.file_name || 'View attached document'}</a>` : ''}

      listEl.querySelectorAll('.view-doc').forEach(a => {

          } catch (err) {
            alert(err.message);
          }
        });
      });
      listEl.querySelectorAll('.add-po-item-btn').forEach(btn => {
        btn.addEventListener('click', () => openAddPoItemPanel(btn.dataset.poId, projectId, centres));

      if (suggestBtn) suggestBtn.onclick = () => openSuggestPoPanel(projectId, centres);

    function fuzzyMatchScore(a, b) {
      const norm = (s) => (s || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(w => w.length > 2);
      const wordsA = new Set(norm(a));
      const wordsB = norm(b);
      if (!wordsA.size || !wordsB.length) return 0;
      const matches = wordsB.filter(w => wordsA.has(w)).length;
      return matches / Math.max(wordsA.size, wordsB.length);
    }

    async function openSuggestPoPanel(projectId, centres) {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `<div class="card" style="max-width:400px; width:100%;"><p class="subtitle">Matching quoted materials against Stock...</p></div>`;
      document.body.appendChild(overlay);

      const { data: materials } = await supabaseClient.from('materials').select('id, name, cost_price, supplier_id, suppliers(name)');
      const { data: existingPOItems } = await supabaseClient
        .from('purchase_order_line_items')
        .select('material_id, purchase_orders!inner(project_id)')
        .eq('purchase_orders.project_id', projectId);
      const alreadyOrderedMaterialIds = new Set((existingPOItems || []).map(x => x.material_id).filter(Boolean));

      const quotedMaterials = centres.flatMap(c => (c.cost_centre_line_items || [])
        .filter(li => li.item_type === 'material')
        .map(li => ({ ...li, stageName: c.name })));

      const matched = {}; // supplier_id -> { supplierName, items: [] }
      const unassigned = [];

      quotedMaterials.forEach(li => {
        let bestMatch = null, bestScore = 0;
        (materials || []).forEach(m => {
          const score = fuzzyMatchScore(m.name, li.description);
          if (score > bestScore) { bestScore = score; bestMatch = m; }
        });
        const match = bestScore >= 0.3 ? bestMatch : null;
        if (match && alreadyOrderedMaterialIds.has(match.id)) return; // already on a PO for this job, skip

        if (match && match.supplier_id) {
          if (!matched[match.supplier_id]) matched[match.supplier_id] = { supplierName: match.suppliers?.name || 'Unknown', items: [] };
          matched[match.supplier_id].items.push({ description: li.description, quantity: li.quantity, unit_cost: match.cost_price, materialId: match.id, stageName: li.stageName });
        } else {
          unassigned.push({ description: li.description, quantity: li.quantity, unit_cost: li.unit_cost, materialId: match?.id || null, stageName: li.stageName });
        }
      });

      const { data: suppliers } = await supabaseClient.from('suppliers').select('id, name').order('name');

      if (!Object.keys(matched).length && !unassigned.length) {
        overlay.querySelector('.card').innerHTML = `<h2>Nothing to suggest</h2><p class="subtitle">Every quoted material is either already on a PO for this job, or there are no material line items quoted.</p><button type="button" class="secondary" id="sp-close-btn">Close</button>`;
        overlay.querySelector('#sp-close-btn').addEventListener('click', () => overlay.remove());
        return;
      }

      overlay.style.overflowY = 'auto';
      overlay.innerHTML = `
        <div class="card" style="max-width:720px; width:100%; max-height:90vh; overflow-y:auto;">
          <h2>Suggested purchase orders</h2>
          <p class="subtitle" style="margin-bottom:14px;">Nothing's created yet - review each supplier group, then confirm.</p>

          ${Object.entries(matched).map(([supplierId, group]) => `
            <div class="sp-group" data-supplier-id="${supplierId}" style="border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px;">
              <label style="margin-top:0; display:flex; align-items:center; gap:8px;"><input type="checkbox" class="sp-include" checked style="width:auto;" /><strong>${group.supplierName}</strong></label>
              ${group.items.map(item => `<div style="font-size:13px; display:flex; justify-content:space-between; padding:4px 0;"><span>${item.description} (${item.stageName}) x${item.quantity}</span><span>${money(item.quantity * item.unit_cost)}</span></div>`).join('')}
              <p class="subtitle" style="margin-top:6px;">Total: ${money(group.items.reduce((s, i) => s + i.quantity * i.unit_cost, 0))}</p>
            </div>`).join('')}

          ${unassigned.length ? `
            <div style="border:1px solid var(--red); border-radius:8px; padding:12px; margin-bottom:10px;">
              <p style="margin:0 0 8px; color:var(--red); font-weight:600;">Needs a supplier assigned</p>
              ${unassigned.map((item, i) => `
                <div class="sp-unassigned-row" data-index="${i}" style="display:grid; grid-template-columns:2fr 1fr; gap:8px; margin-bottom:6px; align-items:center;">
                  <span style="font-size:13px;">${item.description} (${item.stageName}) x${item.quantity}</span>
                  <select class="sp-unassigned-supplier" style="font-size:12px;">
                    <option value="">-- Skip --</option>
                    ${(suppliers || []).map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
                  </select>
                </div>`).join('')}
            </div>` : ''}

          <div style="margin-top:14px;">
            <button id="sp-confirm-btn">Create purchase orders</button>
            <button type="button" class="secondary" id="sp-cancel-btn">Cancel</button>
          </div>
          <div id="sp-msg"></div>
        </div>`;

      overlay.querySelector('#sp-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#sp-confirm-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#sp-msg');
        const confirmBtn = overlay.querySelector('#sp-confirm-btn');
        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Creating...';

        try {
          const { data: { user } } = await supabaseClient.auth.getUser();
          let created = 0;

          for (const groupEl of overlay.querySelectorAll('.sp-group')) {
            if (!groupEl.querySelector('.sp-include').checked) continue;
            const supplierId = groupEl.dataset.supplierId;
            const group = matched[supplierId];
            const { data: newPo, error: poErr } = await supabaseClient.from('purchase_orders').insert({
              project_id: projectId, supplier_id: supplierId, supplier_name: group.supplierName,
              po_type: 'fixed', locked: true, status: 'ordered', amount: 0,
              description: 'Auto-suggested from quoted materials',
            }).select('id').single();
            if (poErr) throw poErr;
            await supabaseClient.from('purchase_order_line_items').insert(
              group.items.map(item => ({ po_id: newPo.id, material_id: item.materialId, description: item.description, quantity: item.quantity, unit_cost: item.unit_cost, added_by: user.id }))
            );
            created++;
          }

          // Group manually-assigned unassigned items by the supplier picked
          const manualGroups = {};
          overlay.querySelectorAll('.sp-unassigned-row').forEach(row => {
            const supplierId = row.querySelector('.sp-unassigned-supplier').value;
            if (!supplierId) return;
            const item = unassigned[parseInt(row.dataset.index)];
            if (!manualGroups[supplierId]) manualGroups[supplierId] = [];
            manualGroups[supplierId].push(item);
          });
          for (const [supplierId, items] of Object.entries(manualGroups)) {
            const supplierName = suppliers.find(s => s.id === supplierId)?.name || 'Unknown';
            const { data: newPo, error: poErr } = await supabaseClient.from('purchase_orders').insert({
              project_id: projectId, supplier_id: supplierId, supplier_name: supplierName,
              po_type: 'fixed', locked: true, status: 'ordered', amount: 0,
              description: 'Auto-suggested from quoted materials (manually assigned)',
            }).select('id').single();
            if (poErr) throw poErr;
            await supabaseClient.from('purchase_order_line_items').insert(
              items.map(item => ({ po_id: newPo.id, material_id: item.materialId, description: item.description, quantity: item.quantity, unit_cost: item.unit_cost, added_by: user.id }))
            );
            created++;
          }

          overlay.remove();
          alert(`Created ${created} purchase order${created === 1 ? '' : 's'}.`);
          await loadPurchaseOrders(projectId, centres);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
          confirmBtn.disabled = false;
          confirmBtn.textContent = 'Create purchase orders';
        }
      });
    }

      overlay.querySelector('#cp-save-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#cp-msg');
        const supplierId = overlay.querySelector('#cp-supplier').value;
        if (!supplierId) { msg.innerHTML = `<div class="error-box">Pick a supplier.</div>`; return; }
        const poType = overlay.querySelector('input[name="cp-type"]:checked').value;

        try {
          const { data: { user } } = await supabaseClient.auth.getUser();
          const fileInput = overlay.querySelector('#cp-file');
          let file_path = null, file_name = null;
          if (fileInput.files.length) {
            file_path = await uploadPrivateFile(fileInput.files[0], projectId);
            file_name = fileInput.files[0].name;
          }

          const supplierName = overlay.querySelector('#cp-supplier').selectedOptions[0].textContent;
          const { data: newPo, error: poErr } = await supabaseClient.from('purchase_orders').insert({
            project_id: projectId,
            cost_centre_id: overlay.querySelector('#cp-stage').value || null,
            supplier_id: supplierId,
            supplier_name: supplierName,
            po_number: overlay.querySelector('#cp-number').value.trim() || null,
            description: overlay.querySelector('#cp-description').value.trim() || null,
            po_type: poType,
            locked: poType === 'fixed',
            budget_cap: poType === 'open' ? (parseFloat(overlay.querySelector('#cp-budget-cap').value) || null) : null,
            status: 'ordered',
            amount: 0,
            file_path, file_name,
          }).select('id').single();
          if (poErr) throw poErr;

          if (poType === 'fixed') {
            const lines = [...overlay.querySelectorAll('.cp-fixed-line')]
              .map(row => ({
                po_id: newPo.id,
                description: row.querySelector('.cp-line-desc').value.trim(),
                quantity: parseFloat(row.querySelector('.cp-line-qty').value) || 0,
                unit_cost: parseFloat(row.querySelector('.cp-line-cost').value) || 0,
                added_by: user.id,
              }))
              .filter(l => l.description);
            if (lines.length) {
              const { error: liErr } = await supabaseClient.from('purchase_order_line_items').insert(lines);
              if (liErr) throw liErr;
            }
          }

          overlay.remove();
          await loadPurchaseOrders(projectId, centres);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        }
      });
    }

    function openAddPoItemPanel(poId, projectId, centres) {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:400px; width:100%;">
          <h2>Add item</h2>
          <label style="margin-top:0">Description</label>
          <input id="ap-desc" />
          <div class="grid cols-2">
            <div><label>Quantity</label><input id="ap-qty" type="number" step="0.01" value="1" /></div>
            <div><label>Unit cost</label><input id="ap-cost" type="number" step="0.01" /></div>
          </div>
          <div style="margin-top:14px;">
            <button id="ap-save-btn">Add</button>
            <button type="button" class="secondary" id="ap-cancel-btn">Cancel</button>
          </div>
          <div id="ap-msg"></div>
        </div>`;
      document.body.appendChild(overlay);

      overlay.querySelector('#ap-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#ap-save-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#ap-msg');
        const description = overlay.querySelector('#ap-desc').value.trim();
        if (!description) { msg.innerHTML = `<div class="error-box">Enter a description.</div>`; return; }
        const { data: { user } } = await supabaseClient.auth.getUser();
        const { error } = await supabaseClient.from('purchase_order_line_items').insert({
          po_id: poId,
          description,
          quantity: parseFloat(overlay.querySelector('#ap-qty').value) || 1,
          unit_cost: parseFloat(overlay.querySelector('#ap-cost').value) || 0,
          added_by: user.id,
        });
        if (error) { msg.innerHTML = `<div class="error-box">${error.message}</div>`; return; }
        overlay.remove();
        await loadPurchaseOrders(projectId, centres);
      });
    }

    function openOverridePoPanel(po, projectId, centres) {
      const items = po.purchase_order_line_items || [];
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; overflow-y:auto;';
      overlay.innerHTML = `
        <div class="card" style="max-width:520px; width:100%; max-height:85vh; overflow-y:auto;">
          <h2>Override PO ${po.po_number || ''}</h2>
          <p class="subtitle" style="margin-bottom:10px;">This PO was sent and locked - only Admin/Finance can adjust it after the fact, for when the real invoice comes in different.</p>
          <div id="ov-items">
            ${items.map(li => `
              <div class="ov-line" data-id="${li.id}" style="display:grid; grid-template-columns:2fr 1fr 1fr; gap:6px; margin-bottom:6px;">
                <input class="ov-desc" value="${li.description}" style="font-size:13px;" />
                <input class="ov-qty" type="number" step="0.01" value="${li.quantity}" style="font-size:13px;" />
                <input class="ov-cost" type="number" step="0.01" value="${li.unit_cost}" style="font-size:13px;" />
              </div>`).join('')}
          </div>
          <div style="margin-top:14px;">
            <button id="ov-save-btn">Save changes</button>
            <button type="button" class="secondary" id="ov-cancel-btn">Cancel</button>
          </div>
          <div id="ov-msg"></div>
        </div>`;
      document.body.appendChild(overlay);

      overlay.querySelector('#ov-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#ov-save-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#ov-msg');
        try {
          const rows = [...overlay.querySelectorAll('.ov-line')];
          for (const row of rows) {
            await supabaseClient.from('purchase_order_line_items').update({
              description: row.querySelector('.ov-desc').value.trim(),
              quantity: parseFloat(row.querySelector('.ov-qty').value) || 0,
              unit_cost: parseFloat(row.querySelector('.ov-cost').value) || 0,
            }).eq('id', row.dataset.id);
          }
          overlay.remove();
          await loadPurchaseOrders(projectId, centres);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        }
      });
    }

    (async function () {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();
      renderMainNav('job-pipeline');
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });
      const project = await loadProject();
      const myRole = await getMyRole();
      if (project) render(project, isPricingRole(myRole));
    })();
  </script>
</body>
</html>
