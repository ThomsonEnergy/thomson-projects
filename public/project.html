  <script>
    const params = new URLSearchParams(window.location.search);
    const projectId = params.get('id');

    function entryHours(te) { return (new Date(te.clock_out) - new Date(te.clock_in)) / 3600000; }

    // Real accrued labour cost, per stage, from each employee's actual pay
    // rates - computed entirely server-side now (get-accrued-labour-cost.js)
    // so an individual's ordinary_rate/rate_1_5x/rate_2x never has to
    // reach any browser, no matter who's viewing this page. Pay rates stay
    // visible only to admin/finance (Settings > Users & Roles).
    // Labour cost is wages plus direct overhead; indirect overhead comes
    // back per stage for the "incl. overheads" lines. Pricing roles also
    // get the average overhead rates per hour (kept in overheadRates) for
    // the estimate side.
    let overheadRates = null;
    async function fetchAccruedLabourCost(projectIds) {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const res = await fetch('/.netlify/functions/get-accrued-labour-cost', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ projectIds }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || 'Could not load accrued labour cost');
      if (data.overheadRates) overheadRates = data.overheadRates;
      return data.byProject;
    }

    async function loadProject() {
      // Item 96: the slow accrued-labour function starts straight away, alongside the
      // job itself, instead of after it. Its own failure is logged and skipped below.
      const accruedPromise = fetchAccruedLabourCost([projectId]).then(byProject => ({ byProject }), err => ({ err }));
      await getMyRole(); // one profiles read; both column lists below then come from its cache
      const [centreCols, liCols] = await Promise.all([costCentreColumns(), lineItemColumns()]);
      const { data: project, error } = await supabaseClient
        .from('projects')
        .select(`*, cost_centres(${centreCols}, invoices(*), invoice_claims(*, invoices(id, invoice_number, invoice_token, sent_at, created_at, paid_at, xero_invoice_id)), credit_note_claims(*), cost_centre_line_items(${liCols}, rate_tier_id, prebuild_group_id, prebuild_client_description, prebuild_base_quantity), cost_centre_photo_groups(*)),
          project_manager:client_contacts!project_manager_contact_id(name, phone, email),
          site_contact:client_contacts!site_contact_id(name, phone, email),
          job_contact:client_contacts!job_contact_id(name, phone, email),
          sales_contact:client_contacts!sales_contact_id(name, phone, email),
          accounts_contact:client_contacts!accounts_contact_id(name, phone, email),
          source_quote:projects!source_quote_id(id, quote_token, quote_number),
          payment_milestones(*)`)
        .eq('id', projectId)
        .single();
      if (error) {
        document.getElementById('content').innerHTML = `<div class="error-box">${escapeHtml(friendlyError(error))}</div>`;
        return null;
      }
      paintJobHeaderEarly(project);

      const isJob = !!project.job_number;
      const rows = (query) => query.then(({ data }) => data || null);
      // Everything below only needs the job row, so it all runs at once (item 96):
      // - Real material cost accrued so far: only PO lines actually received count, so a
      //   PO that's just been placed doesn't inflate "accrued" before anything's landed
      //   (every PO line received to this job, whichever PO it is on).
      // - The same spend per stage: job_material_usage is the authoritative "what actually
      //   got used against this cost centre" record (stock draws + PO receipts landed
      //   straight on a job). Each row has exactly one cost_centre_id, so summing here is safe.
      // - A quote never becomes the job in place: approval spins up a separate project row
      //   (create-job-from-quote.js), so an approved quote looks up that job for "Go to job".
      // - A warranty job pulls just enough of the original job (ref + scope of works) for the
      //   reference card on the Summary tab.
      // - A job with warranty jobs against it pulls those, for the net warranty cost below.
      const [accrued, liRows, usageRows, resultingJob, original, warrantyJobs] = await Promise.all([
        accruedPromise,
        isJob ? rows(supabaseClient.from('purchase_order_line_items').select('quantity, unit_cost')
          .eq('received', true).eq('destination_type', 'job').eq('destination_job_id', projectId)) : null,
        isJob ? rows(supabaseClient.from('job_material_usage').select('cost_centre_id, quantity, unit_cost').eq('project_id', projectId)) : null,
        !isJob && project.status === 'approved'
          ? rows(supabaseClient.from('projects').select('id, job_number').eq('source_quote_id', project.id).maybeSingle()) : undefined,
        project.warranty_of_project_id
          ? rows(supabaseClient.from('projects').select('id, name, job_number, sow_text').eq('id', project.warranty_of_project_id).maybeSingle()) : undefined,
        isJob && !project.warranty_of_project_id
          ? rows(supabaseClient.from('projects').select('id, name, job_number, warranty_outcome, warranty_closed_at, cost_centres(id, invoiced_amount)')
            .eq('warranty_of_project_id', project.id).order('created_at')) : null,
      ]);

      // Real labour hours/cost per stage - fetched from a serverless
      // function that computes it from time_entries server-side, rather
      // than the get_stage_actual_hours/get_stage_actual_labour_cost
      // database functions (which were undercounting hours - only entries
      // with a direct cost_centre_id match, missing ones still tagged via
      // selected_cost_centre_ids pending a split - and returning the
      // billable SELL rate as if it were a cost), and rather than fetching
      // pay rates directly here, which would expose every employee's
      // ordinary_rate/rate_1_5x/rate_2x to whoever's browser loaded this
      // page. See get-accrued-labour-cost.js.
      let accruedByCentre = {};
      if (accrued.err) console.error('Accrued labour cost fetch failed:', accrued.err.message);
      else {
        accruedByCentre = accrued.byProject[projectId]?.byCentre || {};
        project.labour_budget_percent = accrued.byProject[projectId]?.labourBudgetPercent;
      }
      for (const centre of project.cost_centres || []) {
        centre.actual_hours = accruedByCentre[centre.id]?.actualHours || 0;
        centre.actual_labour_cost = accruedByCentre[centre.id]?.actualLabourCost || 0;
        centre.actual_indirect_overhead = accruedByCentre[centre.id]?.actualIndirectOverhead || 0;
        centre.labour_budget_percent = accruedByCentre[centre.id]?.labourBudgetPercent;
        centre.quoted_hours = (centre.cost_centre_line_items || [])
          .filter(li => li.item_type === 'labour')
          .reduce((sum, li) => sum + (Number(li.quantity) || 0), 0);
      }

      project.accrued_material_cost = (liRows || []).reduce((s, li) => s + Number(li.quantity) * Number(li.unit_cost), 0);
      const materialByCentre = {};
      for (const row of usageRows || []) {
        if (!row.cost_centre_id) continue;
        materialByCentre[row.cost_centre_id] = (materialByCentre[row.cost_centre_id] || 0) + Number(row.quantity) * Number(row.unit_cost);
      }
      for (const centre of project.cost_centres || []) {
        centre.actual_material_cost = materialByCentre[centre.id] || 0;
      }

      if (resultingJob !== undefined) project.resulting_job = resultingJob || null;
      if (original !== undefined) project.warranty_original = original || null;

      // This job HAS warranty jobs against it - net cost of all of them
      // (accrued labour+material, minus whatever each has itself
      // invoiced back out via a manufacturer/client-partial close-out)
      // rolls into "Actual profit" below, since warranty work was never
      // part of the original estimate. Invoiced (not paid) counts as
      // "recovered", same convention the rest of the job's own progress/
      // profit figures already use.
      project.warranty_jobs = [];
      project.net_warranty_cost = 0;
      if (warrantyJobs && warrantyJobs.length) {
        const warrantyIds = warrantyJobs.map(w => w.id);
        const [accruedLabourByProject, warrantyLiRows] = await Promise.all([
          fetchAccruedLabourCost(warrantyIds).catch(err => { console.error('Warranty accrued labour fetch failed:', err.message); return {}; }),
          rows(supabaseClient.from('purchase_order_line_items').select('destination_job_id, quantity, unit_cost')
            .eq('received', true).eq('destination_type', 'job').in('destination_job_id', warrantyIds)),
        ]);
        const materialByProject = {};
        (warrantyLiRows || []).forEach(li => {
          materialByProject[li.destination_job_id] = (materialByProject[li.destination_job_id] || 0) + Number(li.quantity) * Number(li.unit_cost);
        });

        project.warranty_jobs = warrantyJobs.map(w => {
          const labourCost = Object.values(accruedLabourByProject[w.id]?.byCentre || {}).reduce((s, c) => s + Number(c.actualLabourCost || 0), 0);
          const materialCost = materialByProject[w.id] || 0;
          const accrued = labourCost + materialCost;
          const invoicedBack = (w.cost_centres || []).reduce((s, c) => s + Number(c.invoiced_amount || 0), 0);
          const net = Math.max(0, accrued - invoicedBack);
          return { id: w.id, name: w.name, job_number: w.job_number, warranty_outcome: w.warranty_outcome, warranty_closed_at: w.warranty_closed_at, accrued, invoicedBack, net };
        });
        project.net_warranty_cost = project.warranty_jobs.reduce((s, w) => s + w.net, 0);
      }

      return project;
    }

    // Item 96: on the first open, the job's name, client and tab title show as soon as the
    // job row lands, while the money figures are still being worked out. Later reloads
    // (after a save) skip this so the page on screen is not wiped.
    function paintJobHeaderEarly(project) {
      setJobTitle(project);
      if (document.getElementById('job-tabs')) return;
      document.getElementById('content').innerHTML = `
        <h1>${escapeHtml(project.name || '')}</h1>
        <p class="subtitle">${escapeHtml(project.client_name || '')}</p>
        <p class="subtitle">Loading...</p>`;
    }

    // Item 86: the browser tab reads "J7003 Smith reno - TEops" (or Q1234 for a quote).
    // setPageTitle (supabase-client.js) when it exists also keeps the notification bell's
    // "(3) " count prefix on our title; until then the bell's rewrites are caught here.
    function setJobTitle(project) {
      const num = projectNumberOnly(project);
      const text = [num !== '-' ? num : '', project.name || ''].filter(Boolean).join(' ') || 'Job';
      if (typeof setPageTitle === 'function') { setPageTitle(text); return; }
      window.__jobTitle = `${text} - TEops`;
      const keep = () => {
        const prefix = (/^\(\d+\+?\) /.exec(document.title) || [''])[0];
        if (document.title !== prefix + window.__jobTitle) document.title = prefix + window.__jobTitle;
      };
      keep();
      const titleEl = document.querySelector('title');
      if (titleEl && !window.__jobTitleWatch) {
        window.__jobTitleWatch = new MutationObserver(keep);
        window.__jobTitleWatch.observe(titleEl, { childList: true, characterData: true, subtree: true });
      }
    }

    // Item 104: the job's activity log, as renderJobActivityLog (supabase-client.js) draws
    // it (grouped on Summary, per tab elsewhere), but only the newest 50 entries load at
    // first; "Show older" fetches the next 50.
    const JOB_ACTIVITY_PAGE = 50;
    async function renderJobActivityLogCapped(projectId, containerId, titleId) {
      const containerEl = document.getElementById(containerId);
      if (!containerEl) return { setTab() {} };
      containerEl.classList.add('activity-log-scroll');
      containerEl.innerHTML = `<p class="subtitle">Loading...</p>`;
      const entries = [];
      let tab = 'summary', hasMore = false, loadingMore = false;

      const fetchPage = async () => {
        const { data, error } = await supabaseClient
          .from('activity_log')
          .select('*, profiles(full_name)')
          .eq('entity_type', 'project')
          .eq('entity_id', projectId)
          .order('created_at', { ascending: false })
          .range(entries.length, entries.length + JOB_ACTIVITY_PAGE); // one extra row says whether there are more
        if (error) throw error;
        hasMore = (data || []).length > JOB_ACTIVITY_PAGE;
        // Paged by position: a new entry since the last page shifts rows down, so skip ones already shown
        const seen = new Set(entries.map(e => e.id));
        entries.push(...(data || []).slice(0, JOB_ACTIVITY_PAGE).filter(e => !seen.has(e.id)));
      };

      const draw = () => {
        const titleEl = titleId && document.getElementById(titleId);
        if (titleEl) titleEl.textContent = tab === 'summary' ? 'Activity log' : 'Activity on this tab';
        let html;
        if (tab === 'summary') {
          const lines = groupJobActivity(entries);
          html = lines.length ? lines.map(l => activityEntryHtml(l.text, l.entry)).join('') : `<p class="subtitle">No activity logged yet.</p>`;
        } else {
          const mine = entries.filter(e => jobActivityTab(e.action) === tab);
          html = mine.length ? mine.map(e => activityEntryHtml(e.description, e)).join('')
            : `<p class="subtitle">Nothing logged on this tab${hasMore ? ' in the latest entries' : ''} yet.</p>`;
        }
        if (hasMore) html += `<button type="button" class="secondary job-activity-more" style="width:100%; margin-top:8px; font-size:13px;"${loadingMore ? ' disabled' : ''}>${loadingMore ? 'Loading...' : 'Show older'}</button>`;
        containerEl.innerHTML = html;
        const more = containerEl.querySelector('.job-activity-more');
        if (more) more.addEventListener('click', async () => {
          if (loadingMore) return;
          loadingMore = true; draw();
          try { await fetchPage(); } catch (err) { showToast(friendlyError(err), { error: true }); }
          loadingMore = false; draw();
        });
      };

      try { await fetchPage(); } catch (err) {
        containerEl.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
        return { setTab() {} };
      }
      draw();
      return { setTab(next) { tab = next; draw(); } };
    }

    // ============ Full quote editor (ported from new-project.html) ============
    // Lets a quote (no job_number yet) be edited entirely on this page instead
    // of navigating to new-project.html's separate scrolling form. Deliberately
    // NOT offered once a job_number exists - the save path below deletes and
    // re-inserts every cost centre, which would orphan any real invoices, POs,
    // or logged time already attached once a quote's been approved. That's the
    // same "block on real activity" principle as the bulk-delete feature.

    let editMode = false;
    let showLineItems = false;
    // Item 55: unsaved quote / stage edits are protected. Cancel asks only when
    // something changed; closing the tab, a menu link or Back (iPhone swipe) asks too.
    let editDirty = false;
    let editProject = null;
    const EDIT_LEAVE_MSG = 'You have unsaved changes. Leave without saving?';
    function endEditSession() { editDirty = false; if (history.state && history.state.teEdit) history.back(); }
    window.addEventListener('beforeunload', (e) => { if (editMode && editDirty) { e.preventDefault(); e.returnValue = ''; } });
    window.addEventListener('popstate', () => {
      if (!editMode) return;
      if (editDirty && !confirm(EDIT_LEAVE_MSG)) { history.pushState({ teEdit: true }, '', location.href); return; }
      editMode = false;
      editDirty = false;
      render(editProject, true);
    });
    document.addEventListener('click', (e) => {
      if (!editMode || !editDirty) return;
      const a = e.target.closest('a[href]');
      if (!a || a.target === '_blank') return;
      const href = a.getAttribute('href') || '';
      if (href.startsWith('#') || href.startsWith('tel:') || href.startsWith('mailto:')) return;
      if (!confirm(EDIT_LEAVE_MSG)) { e.preventDefault(); e.stopPropagation(); } else editDirty = false;
    }, true);
    let selectedDocFolder = 'All';
    let RATE_TIERS = [];
    let companySettings = {};
    let selectedClientId = null;
    let sitePicker = null; // attached when the quote edit form is on screen
    let referencePhotos = [];
    let sowDocs = [];
    let billDocs = []; // the electricity bill pages filed on the quote (step 1), see wireBillCard
    let assignedContactIds = {};
    let currentTemplate = 'new_build';
    let templateAnswers = {};

    const TEMPLATE_INFO = {
      new_build: {
        note: 'Multi-stage project with a deposit and full scope of works.',
        photoCategory: 'electrical', singleStage: false, showDeposit: true, showPylon: false,
      },
      solar: {
        note: 'Asks the solar questions (grid, existing system, roof, switchboard, supply) and tick Batteries as well to add the battery set. Pylon design on the cover. STC credit per stage.',
        photoCategory: 'solar', singleStage: false, showDeposit: true, showPylon: true, showStc: true,
      },
      battery: {
        note: 'Battery system proposal. Asks the battery questions (usable kWh, backup, location to AS/NZS 5139, CEC list, VPP, federal discount) and checks the SAA and Clean Energy Regulator rules before sending. Battery pages on the proposal.',
        photoCategory: 'solar', singleStage: false, showDeposit: true, showPylon: true, showStc: true,
      },
      renovation: {
        note: 'Multi-stage renovation with a deposit. Asks reno-specific questions (asbestos, switchboard, approvals, occupancy) that set up the pre-work and handover tasks.',
        photoCategory: 'electrical', singleStage: false, showDeposit: true, showPylon: false,
      },
      service_work: {
        note: 'Single-stage service call or repair with a deposit. Asks about urgency, access and parts, and sets up the pre-visit and sign-off tasks.',
        photoCategory: 'electrical', singleStage: true, showDeposit: true, showPylon: false,
      },
      quick_estimate: {
        note: 'Single cost centre, no deposit. Clearly labelled "Estimate only" on the client page - invoiced from actual hours and materials, not this figure.',
        photoCategory: 'general', singleStage: true, showDeposit: false, showPylon: false,
      },
    };

    function renumberEditStages() {
      document.querySelectorAll('#cc-rows .cc-row').forEach((row, i) => {
        const label = row.querySelector('.cc-number');
        if (label) label.textContent = `(stage ${i + 1})`;
      });
    }

    function lineItemTotal(li) {
      return (parseFloat(li.querySelector('.li-qty').value) || 0) * (parseFloat(li.querySelector('.li-cost').value) || 0);
    }

    function addLineItem(stageRow, { id = '', description = '', item_type = 'material', quantity = 1, unit_cost = '', rate_tier_id = '', prebuild_group_id = null, prebuild_client_description = null, prebuild_base_quantity = null } = {}, container = null) {
      const li = document.createElement('div');
      li.className = 'li-row';
      li.dataset.id = id;
      // Set only when this line came from "Add a prebuild" - lets the
      // client-facing quote collapse every component added in one click
      // back into a single line showing the prebuild's own client-facing
      // description, without changing how staff see/edit each line here.
      // prebuildBaseQuantity is the un-multiplied per-unit quantity from
      // the master prebuild - lets the group's own quantity control (see
      // renderPrebuildGroup) rescale every component from the same base
      // instead of compounding a rescale-of-a-rescale.
      li.dataset.prebuildGroupId = prebuild_group_id || '';
      li.dataset.prebuildClientDescription = prebuild_client_description || '';
      li.dataset.prebuildBaseQuantity = prebuild_base_quantity ?? '';
      li.style.cssText = 'display:grid; grid-template-columns:2fr 1fr 0.6fr 1fr 1fr auto; gap:8px; margin-bottom:6px; align-items:center;';
      const isLabour = item_type === 'labour';
      const descPlaceholder = isLabour ? 'Optional - defaults to the rate tier name' : 'e.g. Solar panels';
      li.innerHTML = `
        <input class="li-desc" placeholder="${descPlaceholder}" value="${escapeHtml(description)}" style="font-size:13px;" />
        <select class="li-type" style="font-size:13px;">
          <option value="material" ${item_type === 'material' ? 'selected' : ''}>Material</option>
          <option value="labour" ${item_type === 'labour' ? 'selected' : ''}>Labour</option>
        </select>
        <input class="li-qty" type="number" step="0.01" inputmode="decimal" value="${quantity}" placeholder="${isLabour ? 'Hours' : 'Qty'}" style="font-size:13px;" />
        <select class="li-tier" style="font-size:13px; display:${isLabour ? 'block' : 'none'};">
          <option value="">-- Select tier --</option>
          ${RATE_TIERS.map(t => `<option value="${t.id}" data-rate="${t.sell_rate}" ${rate_tier_id === t.id ? 'selected' : ''}>${escapeHtml(t.name)} ($${t.sell_rate}/hr)</option>`).join('')}
        </select>
        <input class="li-cost" type="number" step="0.01" inputmode="decimal" value="${unit_cost}" placeholder="Unit cost $" style="font-size:13px; display:${isLabour ? 'none' : 'block'};" />
        <div class="li-total" style="font-size:13px; font-weight:600;">$0.00</div>
        <button type="button" class="secondary li-remove" style="padding:6px 10px; font-size:12px;">x</button>
      `;
      (container || stageRow.querySelector('.li-rows')).appendChild(li);
      decorateLineItemRow(li);
      const recalc = () => updateStageTotals(stageRow);

      li.querySelector('.li-qty').addEventListener('input', recalc);
      li.querySelector('.li-cost').addEventListener('input', recalc);
      li.querySelector('.li-tier').addEventListener('change', (e) => {
        const selected = e.target.selectedOptions[0];
        li.querySelector('.li-cost').value = selected?.dataset.rate || '';
        recalc();
      });
      li.querySelector('.li-type').addEventListener('change', (e) => {
        const nowLabour = e.target.value === 'labour';
        li.querySelector('.li-qty').placeholder = nowLabour ? 'Hours' : 'Qty';
        li.querySelector('.li-desc').placeholder = nowLabour ? 'Optional - defaults to the rate tier name' : 'e.g. Solar panels';
        li.querySelector('.li-tier').style.display = nowLabour ? 'block' : 'none';
        li.querySelector('.li-cost').style.display = nowLabour ? 'none' : 'block';
        if (nowLabour) {
          const selected = li.querySelector('.li-tier').selectedOptions[0];
          li.querySelector('.li-cost').value = selected?.dataset.rate || '';
        }
        recalc();
      });
      li.querySelector('.li-remove').addEventListener('click', () => { li.remove(); recalc(); });
      updateStageTotals(stageRow);
    }

    function updateStageTotals(stageRow) {
      const items = [...stageRow.querySelectorAll('.li-row')];
      let labour = 0, material = 0;
      items.forEach(li => {
        const total = lineItemTotal(li);
        li.querySelector('.li-total').textContent = money(total);
        if (li.querySelector('.li-type').value === 'labour') labour += total; else material += total;
      });
      // Labour is priced straight off the billable rate tier's sell rate -
      // it's already a sell price, not a cost, so markup only applies to
      // materials (cost price -> sell price). Marking labour up again on
      // top would double the margin already baked into the tier rate.
      const markup = parseFloat(stageRow.querySelector('.cc-markup').value) || 0;
      const salePrice = material * (1 + markup / 100) + labour;
      stageRow.querySelector('.cc-labour-total').textContent = money(labour);
      stageRow.querySelector('.cc-material-total').textContent = money(material);
      stageRow.querySelector('.cc-sale-price').textContent = money(salePrice);
      stageRow.dataset.labourTotal = labour.toFixed(2);
      stageRow.dataset.materialTotal = material.toFixed(2);
      stageRow.dataset.salePrice = salePrice.toFixed(2);
      updateEditTotal();
    }

    // getPrebuilds()/getMaterials()/openStockPicker() are shared - see js/supabase-client.js

    // ---------- payment milestones ----------

    function milestoneRowHtml(m = {}) {
      return `
        <div class="milestone-row" style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
          <input class="milestone-label" placeholder="e.g. On booking install day" value="${escapeHtml(m.label || '')}" style="flex:2;" />
          <input class="milestone-percent" type="number" step="1" min="0" max="100" placeholder="%" value="${m.percent ?? ''}" style="flex:1; max-width:90px;" />
          <button type="button" class="secondary remove-milestone-btn" style="padding:8px 10px;">&times;</button>
        </div>`;
    }

    function refreshMilestoneTotal() {
      const total = [...document.querySelectorAll('.milestone-percent')].reduce((s, inp) => s + (parseFloat(inp.value) || 0), 0);
      const rowCount = document.querySelectorAll('.milestone-row').length;
      const note = document.getElementById('milestone-total-note');
      if (!note) return;
      if (!rowCount) { note.textContent = ''; return; }
      note.innerHTML = Math.round(total) === 100
        ? `Total: ${total}% - looks right.`
        : `<span style="color:var(--red);">Total: ${total}% - should add up to 100%.</span>`;
    }

    function wireMilestoneRows() {
      document.querySelectorAll('.remove-milestone-btn').forEach(btn => {
        btn.onclick = () => { btn.closest('.milestone-row').remove(); refreshMilestoneTotal(); };
      });
      document.querySelectorAll('.milestone-percent').forEach(inp => { inp.oninput = refreshMilestoneTotal; });
    }

    function readMilestones() {
      return [...document.querySelectorAll('.milestone-row')]
        .map((row, i) => ({
          label: row.querySelector('.milestone-label').value.trim(),
          percent: parseFloat(row.querySelector('.milestone-percent').value) || 0,
          sort_order: i,
        }))
        .filter(m => m.label && m.percent > 0);
    }

    let pylonKw = null;

    // A markup of 0% is real (signed fixed-price variation stages): only fall back to 45 when it is not set.
    function markupOr45(v) { const n = parseFloat(v); return Number.isFinite(n) ? n : 45; }

    function addRow({
      id = '', name = '', description = '', markup_percent = null, stc_total = 0, stc_quantity = null,
      stc_system_kw = null, stc_zone_rating = null, stc_install_year = null, stc_price_per_certificate = null,
      lineItems = [], photoGroups = [],
    } = {}) {
      const rowsEl = document.getElementById('cc-rows');
      const defaultMarkup = markup_percent != null ? markup_percent : markupOr45(document.getElementById('default-markup').value);
      const defaultStcPrice = stc_price_per_certificate ?? (parseFloat(document.getElementById('default-stc-price').value) || 35);
      const defaultStcZone = Number(stc_zone_rating ?? (parseFloat(document.getElementById('default-stc-zone').value) || 1.382));
      const defaultStcKw = stc_system_kw ?? pylonKw ?? '';
      const defaultStcYear = stc_install_year || new Date().getFullYear();
      const div = document.createElement('div');
      div.className = 'cc-row';
      div.dataset.id = id;
      div.dataset.name = name;
      div.innerHTML = `
        <div class="cc-row-top">
          <div>
            <label style="margin-top:0">Stage name <span class="cc-number" style="color:var(--muted); font-weight:400;"></span></label>
            <input class="cc-name" placeholder="e.g. Rough In" value="${escapeHtml(name)}" />
          </div>
          <div>
            <label style="margin-top:0">Description</label>
            <input class="cc-desc" placeholder="What's covered in this stage" value="${escapeHtml(description)}" />
          </div>
        </div>
        <div style="margin-top:12px;">
          <label style="margin-top:0">Line items <span style="color:var(--muted); font-weight:400;">(unit costs ex GST, GST is added at the end of the quote)</span></label>
          <div class="li-rows"></div>
          <button type="button" class="secondary prebuild-add" style="font-size:12px; padding:6px 12px;">+ Search material / prebuild</button>
          <button type="button" class="secondary li-add" style="font-size:12px; padding:6px 12px;">+ Add custom line</button>
        </div>
        <div style="margin-top:16px;">
          <label style="margin-top:0">Photos for this stage</label>
          <div class="photo-groups"></div>
          <button type="button" class="secondary pg-add" style="font-size:12px; padding:6px 12px;">+ Add photo group</button>
        </div>
        <div class="cc-row-costs" style="grid-template-columns: 1fr 1fr 0.7fr 1fr;">
          <div><label style="margin-top:0">Labour total (ex GST)</label><div class="readout cc-labour-total">$0.00</div></div>
          <div><label style="margin-top:0">Materials total (ex GST)</label><div class="readout cc-material-total">$0.00</div></div>
          <div><label style="margin-top:0">Markup %</label><input class="cc-markup" type="number" step="1" value="${defaultMarkup}" /></div>
          <div><label style="margin-top:0">Sale price (ex GST)</label><div class="readout cc-sale-price">$0.00</div></div>
        </div>
        <div class="cc-stc-block" style="margin-top:10px; padding:12px; background:var(--surface-2); border-radius:8px; display:${stc_total > 0 ? '' : 'none'};">
          <label style="margin-top:0; font-weight:600;">STC credit on this stage (older quote)</label>
          <p class="subtitle" style="margin:2px 0 0; font-size:12px;">Credits now sit on the quote itself (Pricing step, STC and BSTC). This stage still carries its old figure; clear it once the quote-level credit is set.</p>
          <div class="grid cols-4" style="margin-top:6px;">
            <div><label style="margin-top:0; font-size:12px;">Number of STCs</label><input class="cc-stc-qty" type="number" inputmode="numeric" step="1" min="0" value="${stc_quantity ?? ''}" placeholder="e.g. 85" /></div>
            <div><label style="margin-top:0; font-size:12px;">System size (kW)</label><input class="cc-stc-kw" type="number" step="0.01" value="${defaultStcKw}" placeholder="0.00" /></div>
            <div>
              <label style="margin-top:0; font-size:12px;">Zone rating</label>
              <select class="cc-stc-zone">
                ${STC_ZONES.map(z => `<option value="${z.rating}" ${defaultStcZone === z.rating ? 'selected' : ''}>${z.label}</option>`).join('')}
              </select>
            </div>
            <div><label style="margin-top:0; font-size:12px;">Install year</label><input class="cc-stc-year" type="number" step="1" value="${defaultStcYear}" /></div>
            <div><label style="margin-top:0; font-size:12px;">$ per STC</label><input class="cc-stc-price" type="number" step="0.01" value="${defaultStcPrice}" /></div>
          </div>
          <p class="subtitle cc-stc-calc-line" style="margin:8px 0 0;"></p>
          <label style="margin-top:10px;">STC total ($) - auto-filled from the calculator above, or type your own</label>
          <input class="cc-stc-total" type="number" step="0.01" value="${stc_total}" placeholder="0.00" />
        </div>
        <div style="text-align:right; margin-top:10px;">
          <button type="button" class="secondary remove-row">Remove stage</button>
        </div>`;
      rowsEl.appendChild(div);
      renumberEditStages();

      // Number of STCs: typed straight in (batteries: from usable kWh), or filled from the system
      // size calculator. Typing a size refills the count; a typed count is what the total uses.
      function recalcStc(fromSize) {
        const kw = parseFloat(div.querySelector('.cc-stc-kw').value) || 0;
        const zoneRating = parseFloat(div.querySelector('.cc-stc-zone').value) || 0;
        const installYear = parseInt(div.querySelector('.cc-stc-year').value, 10) || new Date().getFullYear();
        const price = parseFloat(div.querySelector('.cc-stc-price').value) || 0;
        const qtyEl = div.querySelector('.cc-stc-qty');
        if (fromSize || !qtyEl.value) {
          const calc = calculateStcQuantity({ kw, zoneRating, installYear });
          if (calc) qtyEl.value = calc;
        }
        const qty = parseFloat(qtyEl.value) || 0;
        div.querySelector('.cc-stc-calc-line').textContent = qty
          ? `= ${qty} STCs x ${money(price)} = ${money(qty * price)}`
          : '';
        if (qty) div.querySelector('.cc-stc-total').value = (qty * price).toFixed(2);
      }
      div.querySelectorAll('.cc-stc-kw, .cc-stc-zone, .cc-stc-year').forEach(el => {
        el.addEventListener('input', () => recalcStc(true));
        el.addEventListener('change', () => recalcStc(true));
      });
      div.querySelectorAll('.cc-stc-qty, .cc-stc-price').forEach(el => {
        el.addEventListener('input', () => recalcStc(false));
        el.addEventListener('change', () => recalcStc(false));
      });
      recalcStc(stc_quantity == null && !!defaultStcKw);

      div.querySelector('.cc-markup').addEventListener('input', () => updateStageTotals(div));
      div.querySelector('.cc-name').addEventListener('input', (e) => { div.dataset.name = e.target.value.trim(); renderCustomerGets(); });
      div.querySelector('.cc-desc').addEventListener('input', renderCustomerGets);
      div.querySelector('.li-add').addEventListener('click', () => addLineItem(div));
      div.querySelector('.prebuild-add').addEventListener('click', () => openStockPicker(div));
      div.querySelector('.pg-add').addEventListener('click', () => addPhotoGroup(div));
      div.querySelector('.remove-row').addEventListener('click', () => { div.remove(); updateEditTotal(); renumberEditStages(); renderCustomerGets(); });
      if ((TEMPLATE_INFO[currentTemplate] || {}).singleStage) div.querySelector('.remove-row').style.display = 'none';

      renderStageLineItems(div, lineItems);

      photoGroups.forEach(pg => addPhotoGroup(div, pg));
    }

    function addPhotoGroup(stageRow, { description = '', photos = [] } = {}) {
      const pg = document.createElement('div');
      pg.className = 'pg-row';
      pg.style.cssText = 'border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:10px;';
      pg.dataset.photos = JSON.stringify(photos);
      pg.innerHTML = `
        <input class="pg-desc" placeholder="e.g. Existing switchboard" value="${escapeHtml(description)}" style="margin-bottom:8px;" />
        <div class="pg-thumbs" style="margin-bottom:8px;"></div>
        <input type="file" class="pg-file" accept="image/*" multiple style="font-size:12px;" />
        <div class="pg-msg" style="font-size:12px;"></div>
        <button type="button" class="secondary pg-remove" style="font-size:12px; padding:6px 12px;">Remove group</button>
      `;
      stageRow.querySelector('.photo-groups').appendChild(pg);

      const renderThumbs = () => {
        const arr = JSON.parse(pg.dataset.photos);
        renderPhotoThumbs(pg.querySelector('.pg-thumbs'), arr, () => { pg.dataset.photos = JSON.stringify(arr); });
      };
      renderThumbs();

      // Fires the moment photos are chosen - previously needed a second
      // "Upload" click that staff often skipped, assuming picking the
      // file was already the whole job done.
      pg.querySelector('.pg-file').addEventListener('change', async () => {
        const fileInput = pg.querySelector('.pg-file');
        const msgEl = pg.querySelector('.pg-msg');
        if (!fileInput.files.length) return;
        fileInput.disabled = true;
        msgEl.innerHTML = `<p class="subtitle" style="margin:4px 0;">Uploading 1 of ${fileInput.files.length}...</p>`;
        try {
          const urls = await uploadPhotos(fileInput.files, 'stage-photos', 'proposal-photos', {
            onProgress: (done, total) => { if (done < total) msgEl.innerHTML = `<p class="subtitle" style="margin:4px 0;">Uploading ${done + 1} of ${total}...</p>`; },
          });
          const arr = JSON.parse(pg.dataset.photos);
          arr.push(...urls);
          pg.dataset.photos = JSON.stringify(arr);
          renderThumbs();
          msgEl.innerHTML = '';
        } catch (err) {
          msgEl.innerHTML = `<div class="error-box">Upload failed: ${escapeHtml(friendlyError(err))}. Choose the photos again.</div>`;
        } finally {
          fileInput.disabled = false;
          fileInput.value = '';
        }
      });
      pg.querySelector('.pg-remove').addEventListener('click', () => pg.remove());
    }

    function updateEditTotal() {
      const prices = [...document.querySelectorAll('#cc-rows .cc-row')].map(r => parseFloat(r.dataset.salePrice) || 0);
      const el = document.getElementById('total-display');
      if (el) el.textContent = money(prices.reduce((a, b) => a + b, 0));
    }

    function applyEditTemplate(template, applyDefaults = false) {
      const prevTemplate = currentTemplate;
      currentTemplate = template;
      document.querySelectorAll('.template-option').forEach(btn => btn.classList.toggle('active', btn.dataset.template === template));
      const info = TEMPLATE_INFO[template];
      document.getElementById('template-note').textContent = info.note;
      document.getElementById('add-row').style.display = info.singleStage ? 'none' : 'inline-flex';
      document.querySelectorAll('.remove-row').forEach(btn => { btn.style.display = info.singleStage ? 'none' : 'inline-flex'; });
      if (info.singleStage) [...document.querySelectorAll('.cc-row')].slice(1).forEach(row => row.remove());

      const depositCard = document.getElementById('deposit-card');
      if (depositCard) depositCard.style.display = info.showDeposit ? 'block' : 'none';
      if (!info.showDeposit) document.getElementById('p-deposit').value = 0;
      else if (applyDefaults) applyTemplatePaymentDefaults(prevTemplate, template);

      const disclaimerCard = document.getElementById('estimate-disclaimer-card');
      const disclaimerField = document.getElementById('p-estimate-disclaimer');
      disclaimerCard.style.display = template === 'quick_estimate' ? 'block' : 'none';
      if (template === 'quick_estimate' && !disclaimerField.value.trim()) {
        disclaimerField.value = companySettings.default_estimate_disclaimer
          || 'Estimate only - the final invoice is based on actual hours and materials used, not this figure. Accepting this estimate lets us schedule the work.';
      }

      const questionsEl = document.getElementById('template-questions');
      Object.assign(templateAnswers, readTemplateAnswers(questionsEl));
      renderTemplateQuestions(questionsEl, template, templateAnswers);

      document.getElementById('pylon-card').style.display = info.showPylon ? 'block' : 'none';
      if (!info.showPylon) { document.getElementById('p-pylon-link').value = ''; document.getElementById('p-pylon-id').value = ''; }
      // STC credit only belongs on a Solar or Battery proposal (an older stage that already has a
      // total keeps showing it so nothing is hidden).
      // Credits sit on the quote (item 27): the per-stage block only shows an older stage's leftover.
      document.querySelectorAll('.stc-only').forEach(el => { el.style.display = 'none'; });
      document.querySelectorAll('.cc-stc-block').forEach(el => {
        const total = parseFloat(el.querySelector('.cc-stc-total').value) || 0;
        el.style.display = total > 0 ? '' : 'none';
      });
      renderCustomerGets();
    }

    let lastPylonData = null;

    // Plain lines describing what the customer is getting: the Pylon equipment, the answers that
    // shape the system, and the stages. Shown above the AI brief and sent with it.
    function customerGetsLines() {
      const qEl = document.getElementById('template-questions');
      const a = Object.assign({}, templateAnswers, qEl ? readTemplateAnswers(qEl) : {});
      const lines = [];
      const pylon = pylonSystemSummary(lastPylonData).replace(/&middot;/g, ',');
      if (pylon) lines.push(`System (Pylon): ${pylon}`);
      const pick = (id, label) => { if (a[id]) lines.push(`${label}: ${a[id]}`); };
      pick('grid_type', 'Grid'); pick('existing_system', 'Existing system'); pick('existing_system_detail', 'Existing system details');
      pick('phases', 'Supply'); pick('roof_type', 'Roof'); pick('export_limit', 'Export limit'); pick('daily_usage', 'Daily use');
      if (quoteHasBattery(currentTemplate, a)) {
        pick('battery_kwh_wanted', 'Battery usable kWh'); pick('backup_needs', 'Backup'); pick('coupling', 'Coupling');
        pick('battery_location', 'Battery location'); pick('existing_pv', 'Existing PV');
        if (a.vpp_capable) lines.push(`VPP capable: ${a.vpp_capable}`);
      }
      pick('fault', 'Request'); pick('deadline', 'Deadline');
      const stages = [...document.querySelectorAll('#cc-rows .cc-row')].map(r => {
        const name = r.querySelector('.cc-name').value.trim();
        const desc = r.querySelector('.cc-desc').value.trim();
        return name ? (desc ? `${name}: ${desc}` : name) : '';
      }).filter(Boolean);
      if (stages.length) lines.push(`Stages: ${stages.join('; ')}`);
      return lines;
    }

    function renderCustomerGets() {
      const el = document.getElementById('customer-gets');
      if (!el) return;
      const lines = customerGetsLines();
      el.textContent = lines.length ? lines.join('\n') : 'Nothing yet. Answer the pre-quote questions, pull the Pylon design or add a stage.';
    }

      { key: 'project_manager_contact_id', type: 'project_manager', label: 'Project manager' },

    async function loadEditJobContactPickers(clientId, preselected = {}) {
      const card = document.getElementById('job-contacts-card');
      const container = document.getElementById('job-contacts-selects');
      assignedContactIds = { ...preselected };
      if (!clientId) { card.style.display = 'none'; return; }

      const { data: contacts, error } = await supabaseClient.from('client_contacts').select('*').eq('client_id', clientId);
      if (error || !contacts || !contacts.length) { card.style.display = 'none'; return; }

      card.style.display = 'block';
      container.innerHTML = JOB_CONTACT_TYPES.map(t => {
        const options = contacts.filter(c => c.contact_type === t.type);
        if (!options.length) return '';
        return `
          <div>
            <label style="margin-top:0">${t.label}</label>
            <select class="job-contact-select" data-key="${t.key}">
              <option value="">-- Not assigned --</option>
              ${options.map(c => `<option value="${c.id}" ${preselected[t.key] === c.id ? 'selected' : ''}>${escapeHtml(c.name || c.phone || c.email)}</option>`).join('')}

      }).join('');

        sel.addEventListener('change', () => { assignedContactIds[sel.dataset.key] = sel.value || null; });

        </div>`).join('');

    function loadEditAddressAutocomplete(apiKey) {
      if (!apiKey) return;
      if (window.google && window.google.maps) { initEditAddressAutocomplete(); return; }
      window._initEditAddressAutocomplete = initEditAddressAutocomplete;
      if (document.getElementById('google-places-script')) return;
      const script = document.createElement('script');
      script.id = 'google-places-script';
      script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(apiKey)}&libraries=places&callback=_initEditAddressAutocomplete`;
      script.async = true;
      document.head.appendChild(script);
    }

    function initEditAddressAutocomplete() {
      const input = document.getElementById('p-address');
      if (!input) return;
      const autocomplete = new google.maps.places.Autocomplete(input, {
        componentRestrictions: { country: 'au' }, fields: ['formatted_address'], types: ['address'],
      });
      autocomplete.addListener('place_changed', () => {
        const place = autocomplete.getPlace();
        if (place && place.formatted_address) input.value = place.formatted_address;
      });
    }

    function editorCostCentresHtml() {
      return `
        <div class="card">

            <div><label style="margin-top:0">Default markup %</label><input id="default-markup" type="number" step="1" value="45" /></div>
            <div class="stc-only" style="display:none;"><label style="margin-top:0">Default $ per STC</label><input id="default-stc-price" type="number" step="0.01" value="35" /></div>
            <div class="stc-only" style="display:none;">
              <label style="margin-top:0">Default STC zone</label>
              <select id="default-stc-zone">
                ${STC_ZONES.map(z => `<option value="${z.rating}" ${z.rating === 1.382 ? 'selected' : ''}>${z.label}</option>`).join('')}
              </select>

          </div>
          <div id="cc-rows"></div>

          <p class="subtitle" style="margin-top:6px;">GST and any STC credit are added on the proposal's Investment summary.</p>
        </div>`;
    }

    async function enterEditMode(project) {
      editMode = true;
      editDirty = false;
      editProject = project;
      try {
        if (!RATE_TIERS.length) {
          const { data: tiersData } = await supabaseClient.from('billable_rate_tiers').select('*').order('sort_order');
          RATE_TIERS = tiersData || [];
        }
        if (!Object.keys(companySettings).length) {
          const { data: settingsRow } = await supabaseClient.from('company_settings')
            .select('default_terms, default_estimate_disclaimer, google_maps_api_key').eq('id', 1).single();
          companySettings = settingsRow || {};
        }
        render(project, true);
        // One history entry for the editing session, so Back leaves the editor, not the page.
        if (!(history.state && history.state.teEdit)) history.pushState({ teEdit: true }, '', location.href);
      } catch (err) {
        // Was previously a silent no-op on failure - the click looked like
        // it did nothing at all, with the real error only visible in the
        // console. Surface it instead, and drop back to view mode rather
        // than leaving editMode true with no edit form actually shown.
        editMode = false;
        console.error('enterEditMode failed:', err);
        alert('Could not open the editor: ' + friendlyError(err));
      }
    }

    // ---------- shared wiring for the quote editor and the quote steps (item 27) ----------
    // Each wires the ids it finds; the quote steps panel and the full editor use the same ids.

    // ---------- Electricity bill on step 1 (backlog item 29) ----------
    // Pages are project_documents rows in the "Electricity bill" folder (private project-documents
    // bucket, bills/<quote id>/), read by read-electricity-bill.js into projects.bill_reading. The
    // sizing and the savings preview come from public/js/solar-roi.js, the same maths the proposal
    // uses, so what the staff see here is what the client sees.
    const BILL_FOLDER = 'Electricity bill';

    async function loadBillDocs(projectId) {
      const { data } = await supabaseClient.from('project_documents').select('id, file_path, file_name, mime_type, created_at')
        .eq('project_id', projectId).eq('folder', BILL_FOLDER).order('created_at');
      billDocs = data || [];
      return billDocs;
    }

    function wireBillCard(project, qEl, showMissing, refreshBar) {
      const card = document.getElementById('bill-card');
      if (!card) return;
      const listEl = document.getElementById('bill-doc-list');
      const fileInput = document.getElementById('bill-doc-file');
      const msg = document.getElementById('bill-doc-msg');
      const readBtn = document.getElementById('bill-read-btn');
      const readMsg = document.getElementById('bill-read-msg');
      const liveAnswers = () => Object.assign({}, templateAnswers, readTemplateAnswers(qEl));

      function renderList() {
        listEl.innerHTML = billDocs.length ? billDocs.map(d => `
          <div style="display:inline-flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:6px 10px; margin:0 8px 8px 0; font-size:12px;">
            <a href="#" class="bill-doc-view" data-path="${escapeHtml(d.file_path)}">${escapeHtml(d.file_name)}</a>
            <button type="button" class="bill-doc-remove" data-id="${d.id}" data-path="${escapeHtml(d.file_path)}" style="padding:2px 6px; font-size:11px;">x</button>
          </div>`).join('') : `<p class="subtitle" style="font-size:12px; margin:0 0 6px;">No pages yet.</p>`;
        listEl.querySelectorAll('.bill-doc-view').forEach(a => a.addEventListener('click', (e) => {
          e.preventDefault();
          openSignedDocInNewTab(a.dataset.path).catch(err => { msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`; });
        }));
        listEl.querySelectorAll('.bill-doc-remove').forEach(btn => btn.addEventListener('click', async () => {
          if (!confirm('Remove this page?')) return;
          try {
            const { error } = await supabaseClient.from('project_documents').delete().eq('id', btn.dataset.id);
            if (error) throw error;
            await supabaseClient.storage.from('project-documents').remove([btn.dataset.path]);
            billDocs = billDocs.filter(d => d.id !== btn.dataset.id);
            renderList();
          } catch (err) { msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`; }
        }));
        readBtn.disabled = !billDocs.length;
      }

      fileInput.addEventListener('change', async () => {
        if (!fileInput.files.length) return;
        const files = Array.from(fileInput.files);
        fileInput.disabled = true;
        try {
          const { data: { user } } = await supabaseClient.auth.getUser();
          for (let i = 0; i < files.length; i++) {
            msg.innerHTML = `<p class="subtitle">Uploading ${i + 1} of ${files.length}...</p>`;
            const file = files[i];
            const path = await uploadPrivateFile(file, `bills/${project.id}`); // photos are compressed on the way
            const ext = (path.split('.').pop() || '').toLowerCase();
            const mime = ext === 'pdf' ? 'application/pdf' : ext === 'png' ? 'image/png' : ext === 'webp' ? 'image/webp' : (ext === 'jpg' || ext === 'jpeg') ? 'image/jpeg' : (file.type || null);
            const { data, error } = await supabaseClient.from('project_documents')
              .insert({ project_id: project.id, folder: BILL_FOLDER, file_path: path, file_name: file.name, mime_type: mime, uploaded_by: user?.id || null })
              .select('id, file_path, file_name, mime_type, created_at').single();
            if (error) throw error;
            billDocs.push(data);
          }
          msg.innerHTML = '';
          renderList();
        } catch (err) { msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`; }
        finally { fileInput.value = ''; fileInput.disabled = false; }
      });

      readBtn.addEventListener('click', async () => {
        readBtn.disabled = true;
        const label = readBtn.innerHTML;
        readBtn.textContent = 'Reading the bill...';
        readMsg.innerHTML = '';
        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          const res = await fetch('/.netlify/functions/read-electricity-bill', {
            method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
            body: JSON.stringify({ projectId: project.id }),
          });
          const json = await res.json();
          if (!json.ok) throw new Error(json.error || 'The bill could not be read.');
          project.bill_reading = json.reading;
          project.template_answers = json.answers;
          templateAnswers = json.answers;
          renderTemplateQuestions(qEl, currentTemplate, templateAnswers);
          showMissing();
          renderCustomerGets();
          const filledKeys = Object.keys(json.filled || {});
          readMsg.innerHTML = `<div class="success-box">Bill read.${filledKeys.length ? ` Filled in and saved: ${filledKeys.join(', ')}.` : ''}</div>`;
          renderReading();
          refreshBar();
        } catch (err) { readMsg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`; }
        finally { readBtn.innerHTML = label; readBtn.disabled = !billDocs.length; }
      });

      // What the savings preview runs on: the step 3 inputs when they are on the page, else what is saved.
      function currentSolarKw() {
        if (currentTemplate === 'battery') return 0;
        const el = document.getElementById('q-stc-kw');
        const v = el ? parseFloat(el.value) : NaN;
        if (Number.isFinite(v) && v > 0) return v;
        return Number(project.stc_system_kw) || pylonKw || 0;
      }
      function currentBatteryKwh() {
        const answers = liveAnswers();
        if (!quoteHasBattery(currentTemplate, answers)) return 0;
        return parseFloat(answers.battery_kwh_wanted) || 0;
      }
      function currentNetCost() {
        const exGst = (project.cost_centres || []).reduce((s, c) => s + Number(c.quoted_amount || 0), 0);
        return Math.max(0, exGst * 1.1 - (Number(project.stc_total) || 0) - (Number(project.bstc_total) || 0));
      }
      function currentZone() {
        const el = document.getElementById('q-stc-zone');
        return (el && parseFloat(el.value)) || Number(project.stc_zone_rating) || 1.382;
      }

      function renderReading() {
        const out = document.getElementById('bill-reading');
        const when = document.getElementById('bill-read-when');
        const r = project.bill_reading;
        if (!out || !when) return;
        const gaps = roiGaps({ reading: r, answers: liveAnswers(), template: currentTemplate, newSolarKw: currentSolarKw(), batteryKwh: currentBatteryKwh(), netCost: currentNetCost() });
        const blocking = gaps.filter(g => g.blocking);
        const warnings = gaps.filter(g => !g.blocking);
        const gapsHtml = (blocking.length || warnings.length) ? `
          <div style="margin-top:10px; padding:10px 12px; border-radius:8px; border:1px solid ${blocking.length ? 'var(--red, #c0392b)' : 'var(--border)'}; background:var(--surface);">
            ${blocking.length ? `<strong style="font-size:13px;">Missing for the savings estimate</strong><p class="subtitle" style="margin:2px 0 6px; font-size:12px;">${project.show_roi === false ? 'The savings page is switched off on step 3.' : 'The proposal shows no figures while these are missing. It asks the customer for what it needs instead; the rest is ours to fill in.'}</p><ul style="margin:0 0 6px 18px; padding:0; font-size:13px;">${blocking.map(g => `<li>${escapeHtml(g.staff)}${g.client ? ` <span class="subtitle">(the proposal asks the customer for ${escapeHtml(g.client)})</span>` : ''}</li>`).join('')}</ul>` : ''}
            ${warnings.length ? `<strong style="font-size:13px;">Assumed</strong><ul style="margin:2px 0 0 18px; padding:0; font-size:12px; color:var(--muted);">${warnings.map(g => `<li>${escapeHtml(g.staff)}</li>`).join('')}</ul>` : ''}
          </div>` : '';
        if (!r) { out.innerHTML = gapsHtml; when.textContent = ''; return; }
        when.textContent = r.read_at ? `Read ${new Date(r.read_at).toLocaleString('en-AU', { dateStyle: 'medium', timeStyle: 'short' })}${r.pages ? `, ${r.pages} file${r.pages === 1 ? '' : 's'}` : ''}` : '';
        const m = billMetrics(r);
        const fmt = (v, unit) => (v == null ? '-' : `${v}${unit || ''}`);
        const rows = [
          ['Retailer', `${r.retailer || '-'}${r.distributor ? ` (network ${r.distributor})` : ''}`],
          ['NMI', r.nmi || '-'],
          ['Period', `${r.billing_period_start || '?'} to ${r.billing_period_end || '?'} (${fmt(m.days, ' days')})`],
          ['Use', `${fmt(m.totalKwh, ' kWh')} in the period, ${fmt(m.dailyKwh, ' kWh a day')}, about ${fmt(m.annualKwh, ' kWh a year')}`],
          ...(m.split ? [['Time of use', `peak ${m.split.peak} / shoulder ${m.split.shoulder} / off-peak ${m.split.offPeak} kWh${m.split.controlled ? `, controlled load ${m.split.controlled} kWh` : ''}`]] : []),
          ['Rates', `${fmt(r.usage_rate_c_per_kwh, ' c/kWh')} usage, ${fmt(r.supply_charge_c_per_day, ' c/day')} supply${r.feed_in_c_per_kwh != null ? `, feed-in ${r.feed_in_c_per_kwh} c/kWh` : ''}`],
          ['This bill', `${r.bill_total != null ? money(r.bill_total) : '-'}${m.annualBill ? `, about ${money(m.annualBill)} a year` : ''}`],
          ...(r.solar_export_kwh ? [['Solar export', `${r.solar_export_kwh} kWh (existing solar)`]] : []),
          ...(r.skipped_files && r.skipped_files.length ? [['Not read', r.skipped_files.join(', ')]] : []),
          ...(r.notes ? [['Note', r.notes]] : []),
        ];
        const s = r.sizing || {};
        const roi = roiFor({ reading: r, answers: liveAnswers(), newSolarKw: currentSolarKw(), batteryKwh: currentBatteryKwh(), netCost: currentNetCost(), zoneRating: currentZone() });
        const cell = (k, v) => `<tr><td style="white-space:nowrap; color:var(--muted); padding-right:10px;">${escapeHtml(k)}</td><td>${escapeHtml(String(v))}</td></tr>`;
        out.innerHTML = `
          <table style="margin-top:10px; font-size:13px;"><tbody>${rows.map(([k, v]) => cell(k, v)).join('')}</tbody></table>
          ${gapsHtml}
          <div style="margin-top:12px;">
            <label style="margin-top:0; font-weight:600;">Suggested size</label>
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0;">
              ${s.solarKw ? `<span><strong>${s.solarKw} kW</strong> solar</span>${currentTemplate !== 'battery' ? `<button type="button" class="secondary" id="bill-use-solar" style="font-size:12px; padding:4px 8px;">Use as system size (step 3)</button>` : ''}` : (s.solarKw === 0 ? `<span>Solar: the existing ${s.existingKw} kW already covers the use</span>` : '')}
              ${s.batteryKwh ? `<span><strong>${s.batteryKwh} kWh</strong> battery</span><button type="button" class="secondary" id="bill-use-battery" style="font-size:12px; padding:4px 8px;">Use as usable kWh wanted</button>` : ''}
            </div>
            ${(s.notes || []).map(n => `<p class="subtitle" style="margin:2px 0; font-size:12px;">${escapeHtml(n)}</p>`).join('')}
          </div>
          ${roi ? `
          <div style="margin-top:12px;">
            <label style="margin-top:0; font-weight:600;">Savings estimate${blocking.length ? ' (preview only: not on the proposal until the gaps above are filled)' : ' (as the proposal shows it)'}</label>
            <p class="subtitle" style="margin:2px 0 6px; font-size:12px;">${roi.newSolarKw ? `${roi.newSolarKw} kW of solar` : ''}${roi.newSolarKw && roi.batteryKwh ? ' and ' : ''}${roi.batteryKwh ? `a ${roi.batteryKwh} kWh battery` : ''}${roi.existingKw ? ` on top of the existing ${roi.existingKw} kW` : ''}${roi.netCost ? ` at ${money(roi.netCost)} after the credits (step 3)` : ' (no price on step 3 yet)'}. Follows the pricing and the answers; the tick on step 3 hides it from the proposal.</p>
            <table style="font-size:13px;"><tbody>${roiRows(roi, money).map(([k, v]) => cell(k, v)).join('')}</tbody></table>
          </div>` : `<p class="subtitle" style="margin-top:10px; font-size:12px;">The savings estimate appears once a system size (step 3) or a battery size (Usable kWh wanted, above) is set.</p>`}`;
        const useSolar = out.querySelector('#bill-use-solar');
        if (useSolar) useSolar.addEventListener('click', () => {
          const el = document.getElementById('q-stc-kw');
          if (el) { el.value = s.solarKw; el.dispatchEvent(new Event('input', { bubbles: true })); showToast(`${s.solarKw} kW set on step 3. Save pricing to keep it.`); }
          renderReading();
        });
        const useBattery = out.querySelector('#bill-use-battery');
        if (useBattery) useBattery.addEventListener('click', () => {
          const el = qEl.querySelector('.tq-input[data-qid="battery_kwh_wanted"]');
          if (!el) { showToast('Answer "Batteries as well?" with Yes first.', { error: true }); return; }
          el.value = s.batteryKwh;
          el.dispatchEvent(new Event('change', { bubbles: true }));
          showToast(`${s.batteryKwh} kWh set. Save answers to keep it.`);
          renderReading();
        });
      }

      qEl.addEventListener('change', () => { if (project.bill_reading) renderReading(); });
      ['q-stc-kw', 'q-stc-zone'].forEach(id => { const el = document.getElementById(id); if (el) el.addEventListener('input', () => { if (project.bill_reading) renderReading(); }); });
      loadBillDocs(project.id).then(() => { renderList(); renderReading(); });
    }

    // Supporting documents, Generate scope of works with AI, reference photos.
    function wireScopeTools(project) {
      document.getElementById('sow-doc-file').addEventListener('change', async () => {
        const fileInput = document.getElementById('sow-doc-file');
        const msg = document.getElementById('sow-doc-msg');
        if (!fileInput.files.length) return;
        msg.innerHTML = `<p class="subtitle">Uploading...</p>`;
        try {
          for (const file of fileInput.files) {
            const path = await uploadPrivateFile(file, 'sow-source');
            sowDocs.push({ path, name: file.name, mime: file.type });
          }
          renderEditSowDocList();
          fileInput.value = '';
          msg.innerHTML = '';
        } catch (err) { msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`; }
      });

      document.getElementById('generate-scope-btn').addEventListener('click', async () => {
        const btn = document.getElementById('generate-scope-btn');
        const msg = document.getElementById('generate-msg');
        const brief = document.getElementById('p-brief').value.trim();
        const projectName = document.getElementById('p-name').value.trim();
        const rows = [...document.querySelectorAll('#cc-rows .cc-row')];
        const stageNames = rows.map(r => r.dataset.name).filter(Boolean);
        Object.assign(templateAnswers, readTemplateAnswers(document.getElementById('template-questions')));
        const answersText = templateAnswersText(currentTemplate, templateAnswers);
        const customerGets = customerGetsLines().join('\n');
        const withBattery = quoteHasBattery(currentTemplate, templateAnswers);
        if (!brief && !answersText) { msg.innerHTML = `<div class="error-box">Add a few notes first, or answer the pre-quote questions.</div>`; return; }
        if (stageNames.length === 0) { msg.innerHTML = `<div class="error-box">Add at least one stage first (Cost Centres tab; a name is enough, the AI fills in the rest).</div>`; return; }

        btn.disabled = true;
        msg.innerHTML = '';
        try {
          btn.textContent = 'Drafting stage names and descriptions...';
          const { data: { session: aiSession } } = await supabaseClient.auth.getSession();
          const aiHeaders = { 'Content-Type': 'application/json', Authorization: `Bearer ${aiSession.access_token}` };
          const scopeRes = await fetch('/.netlify/functions/generate-scope', {
            method: 'POST', headers: aiHeaders,
            body: JSON.stringify({ projectName: projectName || 'This project', brief, stageNames, templateAnswers: answersText, customerGets, template: currentTemplate, withBattery }),
          });
          const scopeJson = await scopeRes.json();
          if (!scopeJson.ok) throw new Error(scopeJson.error);

          rows.forEach((row, i) => {
            const stage = scopeJson.stages[i];
            if (!stage) return;
            if (stage.name) { row.querySelector('.cc-name').value = stage.name; row.dataset.name = stage.name.trim(); }
            if (stage.description) row.querySelector('.cc-desc').value = stage.description;
          });
          renumberEditStages();

          const updatedStageNames = rows.map(r => r.dataset.name).filter(Boolean);
          const updatedDescriptions = Object.fromEntries(rows.map(r => [r.dataset.name, r.querySelector('.cc-desc').value]));

          btn.textContent = 'Writing scope of works...';
          const sowStyle = document.querySelector('input[name="sow-style"]:checked').value;
          const sowRes = await fetch('/.netlify/functions/generate-sow', {
            method: 'POST', headers: aiHeaders,
            body: JSON.stringify({
              projectName: projectName || 'This project', brief, stageNames: updatedStageNames,
              stageDescriptions: updatedDescriptions, documentPaths: [...sowDocs.map(d => d.path), ...billDocs.map(d => d.file_path)],
              style: sowStyle, template: currentTemplate, templateAnswers: answersText, customerGets, withBattery,
            }),
          });
          const sowJson = await sowRes.json();
          if (!sowJson.ok) throw new Error(sowJson.error);
          document.getElementById('p-sow').value = sowJson.sow;
          renderCustomerGets();
          msg.innerHTML = `<div class="success-box">Stage names, descriptions, and scope of works drafted. Review and edit as needed.</div>`;
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
        } finally {
          btn.disabled = false;
          btn.textContent = 'Generate scope of works with AI';
        }
      });

      document.getElementById('reference-file').addEventListener('change', async () => {
        const fileInput = document.getElementById('reference-file');
        const msg = document.getElementById('reference-msg');
        if (!fileInput.files.length) return;
        msg.innerHTML = `<p class="subtitle">Uploading...</p>`;
        try {
          const urls = await uploadPhotos(fileInput.files, 'reference');
          referencePhotos.push(...urls);
          renderPhotoThumbs(document.getElementById('reference-thumbs'), referencePhotos);
          fileInput.value = '';
          msg.innerHTML = '';
        } catch (err) { msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`; }
      });

    }

    // Create job in Pylon and Pull from Pylon.
    function wirePylonCard(project) {
      document.getElementById('pylon-create-btn').addEventListener('click', async () => {
        const btn = document.getElementById('pylon-create-btn');
        const msg = document.getElementById('pylon-create-msg');
        const name = document.getElementById('p-client').value.trim();
        const address = document.getElementById('p-address').value.trim();
        if (!name || !address) { msg.innerHTML = `<div class="error-box">Enter the client name and site address first.</div>`; return; }
        // Pylon's create API has no dedup by address/customer and this
        // app has no way to search their existing projects either
        // (confirmed against their docs - no address/email/phone filter
        // on GET /v1/solar_projects), so the only guard available is our
        // own record of having already pushed this one.
        if (document.getElementById('p-pylon-id').value.trim() && !confirm('This quote already has a Pylon project ID - creating another will make a duplicate project in Pylon for this address. Continue anyway?')) return;
        btn.disabled = true;
        btn.textContent = 'Creating in Pylon...';
        msg.innerHTML = '';
        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          const res = await fetch('/.netlify/functions/push-to-pylon', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
            body: JSON.stringify({
              name, address,
              email: document.getElementById('p-email').value.trim() || null,
              phone: document.getElementById('p-phone').value.trim() || null,
              referenceNumber: project.quote_number ? `Q${project.quote_number}` : (project.name || null),
            }),
          });
          const json = await res.json();
          if (!json.ok) throw new Error(json.error);
          if (json.pylonProjectId) document.getElementById('p-pylon-id').value = json.pylonProjectId;
          msg.innerHTML = `<div class="success-box">Created in Pylon${json.referenceNumber ? ` as ${json.referenceNumber}` : ''} with the client/site details filled in. <a class="link-quiet" href="https://app.getpylon.com/app" target="_blank" rel="noopener">Open Pylon</a> to finish the design, then paste the resulting proposal link above.</div>`;
        } catch (err) {
          // Falls back to just opening Pylon manually either way - e.g. a
          // Pylon account without solar-project-creation API access
          // (403 feature_not_available) shouldn't leave staff with no way
          // to create the job at all, just without the auto-filled details.
          msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))} - <a class="link-quiet" href="https://app.getpylon.com/app" target="_blank" rel="noopener">open Pylon</a> and create it manually instead.</div>`;
        }
        btn.disabled = false;
        btn.textContent = 'Create job in Pylon →';
      });

      document.getElementById('pylon-pull-btn').addEventListener('click', async () => {
        const msg = document.getElementById('pylon-msg');
        const pylonProjectId = document.getElementById('p-pylon-id').value.trim();
        if (!pylonProjectId) { msg.innerHTML = `<div class="error-box">Enter a Pylon project ID first.</div>`; return; }
        msg.innerHTML = '';
        try {
          const res = await fetch('/.netlify/functions/pylon-sync', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ projectId: project.id, pylonProjectId }),
          });
          const json = await res.json();
          if (!json.ok) throw new Error(json.error);
          lastPylonData = json.pylonData || null;
          renderCustomerGets();
          const summary = pylonSystemSummary(json.pylonData);
          msg.innerHTML = `<div class="success-box">Pulled from Pylon.${summary ? ' ' + summary : ' No hardware summary came back - check the function logs against the field names in the Pylon API docs.'}</div>`;
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))} (check Settings &gt; API Keys &gt; Pylon, and that this Pylon project ID is correct)</div>`;
        }
      });

    }

    async function wireEditForm(project) {
      // Once a job number exists, editing is scoped to Cost Centres only -
      // the Details tab (client/template/SOW/deposit/Pylon/T&Cs) stays
      // read-only, so all of that wiring below is quote-edit only.
      const isQuoteEdit = !project.job_number;

      // Item 55: any typed change, select change, file pick or button press in the
      // editor counts as a change. .job-tab-main is rebuilt by every render, so
      // these listeners never stack.
      const editArea = document.querySelector('.job-tab-main');
      if (editArea) {
        const markDirty = () => { editDirty = true; };
        editArea.addEventListener('input', markDirty);
        editArea.addEventListener('change', markDirty);
        editArea.addEventListener('click', (e) => { if (e.target.closest('button, .template-option')) markDirty(); });
      }

      try {
      if (isQuoteEdit) {
      document.querySelectorAll('.template-option').forEach(btn => btn.addEventListener('click', () => applyEditTemplate(btn.dataset.template, true)));

      // Pre-quote answers: the "Batteries as well" answer adds or removes the battery questions,
      // and every answer feeds the "What the customer gets" panel.
      document.getElementById('template-questions').addEventListener('change', (e) => {
        const el = e.target.closest('.tq-input');
        if (!el) return;
        Object.assign(templateAnswers, readTemplateAnswers(document.getElementById('template-questions')));
        if (el.dataset.qid === 'with_battery') {
          if (!templateAnswers.with_battery) delete templateAnswers.with_battery;
          renderTemplateQuestions(document.getElementById('template-questions'), currentTemplate, templateAnswers);
        }
        renderCustomerGets();
      });

      sitePicker = attachSitePicker(document.getElementById('p-site-pick'), document.getElementById('p-address'));
      document.getElementById('clear-client-btn').addEventListener('click', () => {
        document.getElementById('client-search-input').value = '';
        setSelectedEditClient(null);
        loadEditJobContactPickers(null);
      });

      let clientSearchTimeout = null;
      document.getElementById('client-search-input').addEventListener('input', (e) => {
        clearTimeout(clientSearchTimeout);
        const q = e.target.value.trim();
        const resultsEl = document.getElementById('client-search-results');
        if (q.length < 2) { resultsEl.style.display = 'none'; return; }
        clientSearchTimeout = setTimeout(async () => {
          const { data, error } = await supabaseClient.from('clients').select('*')
            .or(`name.ilike.%${q}%,email.ilike.%${q}%,phone.ilike.%${q}%`).limit(8);
          if (error || !data || !data.length) {
            resultsEl.innerHTML = `<div style="padding:10px 12px; font-size:13px; color:var(--muted);">No matches</div>`;
            resultsEl.style.display = 'block';
            return;
          }
          resultsEl.innerHTML = data.map(c => `
            <div class="client-result" data-id="${c.id}" style="padding:8px 12px; cursor:pointer; font-size:13px; border-bottom:1px solid var(--border);">
              <div style="font-weight:600;">${escapeHtml(c.name)}</div>
              <div style="color:var(--muted); font-size:12px;">${[c.email, c.phone].filter(Boolean).map(escapeHtml).join(' &middot; ')}</div>
            </div>`).join('');
          resultsEl.querySelectorAll('.client-result').forEach(row => {
            row.addEventListener('click', () => {
              const client = data.find(c => c.id === row.dataset.id);
              document.getElementById('client-search-input').value = client.name;
              setSelectedEditClient(client);
              loadEditJobContactPickers(client.id);
            });
          });
          resultsEl.style.display = 'block';
        }, 250);
      });

      wireScopeTools(project);
      wireMilestoneEditor(project);
      wirePylonCard(project);
      wireComplianceCard(project);

      } // end isQuoteEdit-only wiring

      document.getElementById('add-row').addEventListener('click', () => addRow());
      const suggestBtn = document.getElementById('suggest-prebuilds-btn');
      if (suggestBtn) suggestBtn.addEventListener('click', () => {
        const qEl = document.getElementById('template-questions');
        if (qEl) Object.assign(templateAnswers, readTemplateAnswers(qEl));
        const sowEl = document.getElementById('p-sow');
        suggestStagePrebuilds({
          projectId: project.id, template: currentTemplate,
          sow: sowEl ? sowEl.value : (project.sow_text || ''), answersText: templateAnswersText(currentTemplate, templateAnswers),
          btnEl: suggestBtn, msgEl: document.getElementById('suggest-prebuilds-msg'),
        });
      });
      document.getElementById('save-edit-btn').addEventListener('click', () => saveEdits(project));
      document.getElementById('cancel-edit-btn').addEventListener('click', () => {
        if (editDirty && !confirm('Discard your unsaved changes?')) return;
        editDirty = false;
        // Leave through the history entry so the popstate handler renders on the pre-edit URL
        if (history.state && history.state.teEdit) { history.back(); return; }
        editMode = false; render(project, true);
      });

      if (isQuoteEdit) {
        templateAnswers = project.template_answers || {};
        applyEditTemplate(project.proposal_template || 'new_build');
        document.getElementById('p-estimate-disclaimer').value = project.estimate_disclaimer_text || '';
        document.getElementById('p-name').value = project.name || '';
        document.getElementById('p-subtitle').value = project.proposal_subtitle || '';
        document.getElementById('p-client').value = project.client_name || '';
        document.getElementById('p-email').value = project.client_email || '';
        document.getElementById('p-phone').value = project.client_phone || '';
        document.getElementById('p-address').value = project.client_address || '';
        document.getElementById('p-notes').value = project.notes || '';
        document.getElementById('p-sow').value = project.sow_text || '';
        document.getElementById('p-brief').value = project.sow_brief || '';
        document.getElementById('p-terms').value = project.terms_text || '';
        document.getElementById('p-deposit').value = project.deposit_percent;
        document.getElementById('p-breakdown').checked = !!project.show_investment_breakdown;

        selectedClientId = project.client_id || null;

        renderPhotoThumbs(document.getElementById('reference-thumbs'), referencePhotos);
        sowDocs = (project.sow_documents || []).slice();
        renderEditSowDocList();
        showSiteInspectionNote(project);

        if (project.client_id) {
