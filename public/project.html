<link rel="icon" type="image/x-icon" href="/favicon.ico" />

<body>
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('mobile-menu-dropdown').classList.toggle('open')">&#9776;</button>
    <div class="mobile-menu-dropdown" id="mobile-menu-dropdown"></div>
    <nav class="topbar-tabs" id="topbar-tabs"></nav>
    <div class="topbar-right">
      <a href="/schedule.html" class="topbar-icon-link" title="Schedule">&#128197;</a>
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/home.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="wrap">
    <div id="content"><p class="subtitle">Loading...</p></div>
  </div>

  <script src="/js/supabase-client.js?v=2"></script>
  <script src="/js/theme.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const projectId = params.get('id');

    async function loadProject() {
      const centreCols = await costCentreColumns();
      const { data: project, error } = await supabaseClient
        .from('projects')
        .select(`*, cost_centres(${centreCols}, invoices(*), cost_centre_line_items(id, item_type, description, quantity, unit_cost, rate_tier_id, sort_order), cost_centre_photo_groups(*)),
          project_manager:client_contacts!project_manager_contact_id(name, phone, email),
          site_contact:client_contacts!site_contact_id(name, phone, email),
          job_contact:client_contacts!job_contact_id(name, phone, email),
          sales_contact:client_contacts!sales_contact_id(name, phone, email),
          accounts_contact:client_contacts!accounts_contact_id(name, phone, email)`)
        .eq('id', projectId)
        .single();
      if (error) {
        document.getElementById('content').innerHTML = `<div class="error-box">${error.message}</div>`;
        return null;
      }

      // Real labour cost/hours per stage - fetched here (async RPCs) so
      // render() itself can stay a plain synchronous template function.
      for (const centre of project.cost_centres || []) {
        const [{ data: actualCost }, { data: actualHours }] = await Promise.all([
          supabaseClient.rpc('get_stage_actual_labour_cost', { p_cost_centre_id: centre.id }),
          supabaseClient.rpc('get_stage_actual_hours', { p_cost_centre_id: centre.id }),
        ]);
        centre.actual_labour_cost = Number(actualCost) || 0;
        centre.actual_hours = Number(actualHours) || 0;
        centre.quoted_hours = (centre.cost_centre_line_items || [])
          .filter(li => li.item_type === 'labour')
          .reduce((sum, li) => sum + (Number(li.quantity) || 0), 0);
      }

      // Real material cost accrued so far - only line items actually
      // received count, so a PO that's just been placed doesn't inflate
      // "accrued" before anything's landed.
      if (project.job_number) {
        const { data: poRows } = await supabaseClient
          .from('purchase_orders')
          .select('purchase_order_line_items(quantity, unit_cost, received)')
          .eq('project_id', projectId);
        project.accrued_material_cost = (poRows || []).reduce((s, po) =>
          s + (po.purchase_order_line_items || [])
                .filter(li => li.received)
                .reduce((s2, li) => s2 + Number(li.quantity) * Number(li.unit_cost), 0), 0);
      } else {
        project.accrued_material_cost = 0;
      }

      return project;
    }

    // ============ Full quote editor (ported from new-project.html) ============
    // Lets a quote (no job_number yet) be edited entirely on this page instead
    // of navigating to new-project.html's separate scrolling form. Deliberately
    // NOT offered once a job_number exists - the save path below deletes and
    // re-inserts every cost centre, which would orphan any real invoices, POs,
    // or logged time already attached once a quote's been approved. That's the
    // same "block on real activity" principle as the bulk-delete feature.

    let editMode = false;
    let showLineItems = false;
    let selectedDocFolder = 'All';
    let RATE_TIERS = [];
    let companySettings = {};
    let selectedClientId = null;
    let referencePhotos = [];
    let sowDocs = [];
    let assignedContactIds = {};
    let currentTemplate = 'new_build';
    let _prebuildsCache = null;

    const TEMPLATE_INFO = {
      new_build: {
        note: 'Multi-stage project with a deposit and full scope of works.',
        photoCategory: 'electrical', singleStage: false, showDeposit: true, showPylon: false,
      },
      solar: {
        note: 'Pylon design link is prominent on the cover page. Defaults to a single stage - add more if needed.',
        photoCategory: 'solar', singleStage: false, showDeposit: true, showPylon: true,
      },
      quick_estimate: {
        note: 'Single cost centre, no deposit. Clearly labelled "Estimate only" on the client page - invoiced from actual hours and materials, not this figure.',
        photoCategory: 'general', singleStage: true, showDeposit: false, showPylon: false,
      },
    };

    function renumberEditStages() {
      document.querySelectorAll('#cc-rows .cc-row').forEach((row, i) => {
        const label = row.querySelector('.cc-number');
        if (label) label.textContent = `(stage ${i + 1})`;
      });
    }

    function lineItemTotal(li) {
      return (parseFloat(li.querySelector('.li-qty').value) || 0) * (parseFloat(li.querySelector('.li-cost').value) || 0);
    }

    function addLineItem(stageRow, { description = '', item_type = 'material', quantity = 1, unit_cost = '', rate_tier_id = '' } = {}) {
      const li = document.createElement('div');
      li.className = 'li-row';
      li.style.cssText = 'display:grid; grid-template-columns:2fr 1fr 0.6fr 1fr 1fr auto; gap:8px; margin-bottom:6px; align-items:center;';
      const isLabour = item_type === 'labour';
      const descPlaceholder = isLabour ? 'Optional - defaults to the rate tier name' : 'e.g. Solar panels';
      li.innerHTML = `
        <input class="li-desc" placeholder="${descPlaceholder}" value="${description}" style="font-size:13px;" />
        <select class="li-type" style="font-size:13px;">
          <option value="material" ${item_type === 'material' ? 'selected' : ''}>Material</option>
          <option value="labour" ${item_type === 'labour' ? 'selected' : ''}>Labour</option>
        </select>
        <input class="li-qty" type="number" step="0.01" value="${quantity}" placeholder="${isLabour ? 'Hours' : 'Qty'}" style="font-size:13px;" />
        <select class="li-tier" style="font-size:13px; display:${isLabour ? 'block' : 'none'};">
          <option value="">-- Select tier --</option>
          ${RATE_TIERS.map(t => `<option value="${t.id}" data-rate="${t.sell_rate}" ${rate_tier_id === t.id ? 'selected' : ''}>${t.name} ($${t.sell_rate}/hr)</option>`).join('')}
        </select>
        <input class="li-cost" type="number" step="0.01" value="${unit_cost}" placeholder="Unit cost $" style="font-size:13px; display:${isLabour ? 'none' : 'block'};" />
        <div class="li-total" style="font-size:13px; font-weight:600;">$0.00</div>
        <button type="button" class="secondary li-remove" style="padding:6px 10px; font-size:12px;">x</button>
      `;
      stageRow.querySelector('.li-rows').appendChild(li);
      const recalc = () => updateStageTotals(stageRow);

      li.querySelector('.li-qty').addEventListener('input', recalc);
      li.querySelector('.li-cost').addEventListener('input', recalc);
      li.querySelector('.li-tier').addEventListener('change', (e) => {
        const selected = e.target.selectedOptions[0];
        li.querySelector('.li-cost').value = selected?.dataset.rate || '';
        recalc();
      });
      li.querySelector('.li-type').addEventListener('change', (e) => {
        const nowLabour = e.target.value === 'labour';
        li.querySelector('.li-qty').placeholder = nowLabour ? 'Hours' : 'Qty';
        li.querySelector('.li-desc').placeholder = nowLabour ? 'Optional - defaults to the rate tier name' : 'e.g. Solar panels';
        li.querySelector('.li-tier').style.display = nowLabour ? 'block' : 'none';
        li.querySelector('.li-cost').style.display = nowLabour ? 'none' : 'block';
        if (nowLabour) {
          const selected = li.querySelector('.li-tier').selectedOptions[0];
          li.querySelector('.li-cost').value = selected?.dataset.rate || '';
        }
        recalc();
      });
      li.querySelector('.li-remove').addEventListener('click', () => { li.remove(); recalc(); });
      updateStageTotals(stageRow);
    }

    function updateStageTotals(stageRow) {
      const items = [...stageRow.querySelectorAll('.li-row')];
      let labour = 0, material = 0;
      items.forEach(li => {
        const total = lineItemTotal(li);
        li.querySelector('.li-total').textContent = money(total);
        if (li.querySelector('.li-type').value === 'labour') labour += total; else material += total;
      });
      // Labour is priced straight off the billable rate tier's sell rate -
      // it's already a sell price, not a cost, so markup only applies to
      // materials (cost price -> sell price). Marking labour up again on
      // top would double the margin already baked into the tier rate.
      const markup = parseFloat(stageRow.querySelector('.cc-markup').value) || 0;
      const salePrice = material * (1 + markup / 100) + labour;
      stageRow.querySelector('.cc-labour-total').textContent = money(labour);
      stageRow.querySelector('.cc-material-total').textContent = money(material);
      stageRow.querySelector('.cc-sale-price').textContent = money(salePrice);
      stageRow.dataset.labourTotal = labour.toFixed(2);
      stageRow.dataset.materialTotal = material.toFixed(2);
      stageRow.dataset.salePrice = salePrice.toFixed(2);
      updateEditTotal();
    }

    async function getPrebuilds() {
      if (_prebuildsCache) return _prebuildsCache;
      const { data, error } = await supabaseClient.from('prebuilds').select('*, prebuild_components(*)').order('category').order('name');
      _prebuildsCache = error ? [] : data;
      return _prebuildsCache;
    }

    async function openPrebuildPicker(stageRow) {
      const prebuilds = await getPrebuilds();
      if (!prebuilds.length) { alert('No prebuilds set up yet. Add some under Settings > Prebuild Categories.'); return; }
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100;';
      overlay.innerHTML = `
        <div class="card" style="max-width:480px; width:90%; max-height:80vh; overflow-y:auto;">
          <h2>Add a prebuild</h2>
          <select id="prebuild-select" style="margin-bottom:12px;">
            ${prebuilds.map(p => `<option value="${p.id}">${p.category}${p.subcategory ? ' / ' + p.subcategory : ''} - ${p.name}</option>`).join('')}
          </select>
          <label style="margin-top:0">Quantity</label>
          <input id="prebuild-qty" type="number" value="1" min="1" step="1" />
          <div style="margin-top:16px; text-align:right;">
            <button type="button" class="secondary" id="prebuild-cancel">Cancel</button>
            <button type="button" id="prebuild-confirm">Add to stage</button>
          </div>
        </div>`;
      document.body.appendChild(overlay);
      overlay.querySelector('#prebuild-cancel').addEventListener('click', () => overlay.remove());
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
      overlay.querySelector('#prebuild-confirm').addEventListener('click', () => {
        const prebuild = prebuilds.find(p => p.id === overlay.querySelector('#prebuild-select').value);
        const qty = parseFloat(overlay.querySelector('#prebuild-qty').value) || 1;
        (prebuild.prebuild_components || []).forEach(comp => {
          addLineItem(stageRow, {
            description: `${prebuild.name} - ${comp.description}`,
            item_type: comp.item_type,
            quantity: (parseFloat(comp.quantity) || 0) * qty,
            unit_cost: comp.unit_cost,
          });
        });
        overlay.remove();
      });
    }

    function addRow({ name = '', description = '', markup_percent = null, stc_total = 0, lineItems = [], photoGroups = [] } = {}) {
      const rowsEl = document.getElementById('cc-rows');
      const defaultMarkup = markup_percent !== null ? markup_percent : (parseFloat(document.getElementById('default-markup').value) || 45);
      const div = document.createElement('div');
      div.className = 'cc-row';
      div.dataset.name = name;
      div.innerHTML = `
        <div class="cc-row-top">
          <div>
            <label style="margin-top:0">Stage name <span class="cc-number" style="color:var(--muted); font-weight:400;"></span></label>
            <input class="cc-name" placeholder="e.g. Rough In" value="${name}" />
          </div>
          <div>
            <label style="margin-top:0">Description</label>
            <input class="cc-desc" placeholder="What's covered in this stage" value="${description}" />
          </div>
        </div>
        <div style="margin-top:12px;">
          <label style="margin-top:0">Line items</label>
          <div class="li-rows"></div>
          <button type="button" class="secondary li-add" style="font-size:12px; padding:6px 12px;">+ Add line item</button>
          <button type="button" class="secondary prebuild-add" style="font-size:12px; padding:6px 12px;">+ Add prebuild</button>
        </div>
        <div style="margin-top:16px;">
          <label style="margin-top:0">Photos for this stage</label>
          <div class="photo-groups"></div>
          <button type="button" class="secondary pg-add" style="font-size:12px; padding:6px 12px;">+ Add photo group</button>
        </div>
        <div class="cc-row-costs" style="grid-template-columns: 1fr 1fr 0.7fr 1fr;">
          <div><label style="margin-top:0">Labour total</label><div class="readout cc-labour-total">$0.00</div></div>
          <div><label style="margin-top:0">Materials total</label><div class="readout cc-material-total">$0.00</div></div>
          <div><label style="margin-top:0">Markup %</label><input class="cc-markup" type="number" step="1" value="${defaultMarkup}" /></div>
          <div><label style="margin-top:0">Sale price</label><div class="readout cc-sale-price">$0.00</div></div>
        </div>
        <div class="grid cols-3" style="margin-top:10px;">
          <div><label style="margin-top:0">STC entitlement (if any)</label><input class="cc-stc-total" type="number" step="0.01" value="${stc_total}" placeholder="0.00" /></div>
        </div>
        <div style="text-align:right; margin-top:10px;">
          <button type="button" class="secondary remove-row">Remove stage</button>
        </div>`;
      rowsEl.appendChild(div);
      renumberEditStages();

      div.querySelector('.cc-markup').addEventListener('input', () => updateStageTotals(div));
      div.querySelector('.cc-name').addEventListener('input', (e) => { div.dataset.name = e.target.value.trim(); });
      div.querySelector('.li-add').addEventListener('click', () => addLineItem(div));
      div.querySelector('.prebuild-add').addEventListener('click', () => openPrebuildPicker(div));
      div.querySelector('.pg-add').addEventListener('click', () => addPhotoGroup(div));
      div.querySelector('.remove-row').addEventListener('click', () => { div.remove(); updateEditTotal(); renumberEditStages(); });
      if (TEMPLATE_INFO[currentTemplate].singleStage) div.querySelector('.remove-row').style.display = 'none';

      if (lineItems.length) lineItems.forEach(li => addLineItem(div, li));
      else addLineItem(div);

      photoGroups.forEach(pg => addPhotoGroup(div, pg));
    }

    function addPhotoGroup(stageRow, { description = '', photos = [] } = {}) {
      const pg = document.createElement('div');
      pg.className = 'pg-row';
      pg.style.cssText = 'border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:10px;';
      pg.dataset.photos = JSON.stringify(photos);
      pg.innerHTML = `
        <input class="pg-desc" placeholder="e.g. Existing switchboard" value="${description}" style="margin-bottom:8px;" />
        <div class="pg-thumbs" style="margin-bottom:8px;"></div>
        <input type="file" class="pg-file" accept="image/*" multiple style="font-size:12px;" />
        <button type="button" class="secondary pg-upload" style="font-size:12px; padding:6px 12px; margin-left:6px;">Upload</button>
        <button type="button" class="secondary pg-remove" style="font-size:12px; padding:6px 12px;">Remove group</button>
      `;
      stageRow.querySelector('.photo-groups').appendChild(pg);

      const renderThumbs = () => {
        const arr = JSON.parse(pg.dataset.photos);
        renderPhotoThumbs(pg.querySelector('.pg-thumbs'), arr, () => { pg.dataset.photos = JSON.stringify(arr); });
      };
      renderThumbs();

      pg.querySelector('.pg-upload').addEventListener('click', async () => {
        const fileInput = pg.querySelector('.pg-file');
        if (!fileInput.files.length) return;
        const urls = await uploadPhotos(fileInput.files, 'stage-photos');
        const arr = JSON.parse(pg.dataset.photos);
        arr.push(...urls);
        pg.dataset.photos = JSON.stringify(arr);
        fileInput.value = '';
        renderThumbs();
      });
      pg.querySelector('.pg-remove').addEventListener('click', () => pg.remove());
    }

    function updateEditTotal() {
      const prices = [...document.querySelectorAll('#cc-rows .cc-row')].map(r => parseFloat(r.dataset.salePrice) || 0);
      const el = document.getElementById('total-display');
      if (el) el.textContent = money(prices.reduce((a, b) => a + b, 0));
    }

    function applyEditTemplate(template) {
      currentTemplate = template;
      document.querySelectorAll('.template-option').forEach(btn => btn.classList.toggle('active', btn.dataset.template === template));
      const info = TEMPLATE_INFO[template];
      document.getElementById('template-note').textContent = info.note;
      document.getElementById('add-row').style.display = info.singleStage ? 'none' : 'inline-flex';
      document.querySelectorAll('.remove-row').forEach(btn => { btn.style.display = info.singleStage ? 'none' : 'inline-flex'; });
      if (info.singleStage) [...document.querySelectorAll('.cc-row')].slice(1).forEach(row => row.remove());

      const depositCard = document.getElementById('deposit-card');
      if (depositCard) depositCard.style.display = info.showDeposit ? 'block' : 'none';
      if (!info.showDeposit) document.getElementById('p-deposit').value = 0;

      const disclaimerCard = document.getElementById('estimate-disclaimer-card');
      const disclaimerField = document.getElementById('p-estimate-disclaimer');
      disclaimerCard.style.display = template === 'quick_estimate' ? 'block' : 'none';
      if (template === 'quick_estimate' && !disclaimerField.value.trim()) {
        disclaimerField.value = companySettings.default_estimate_disclaimer
          || 'Estimate only - the final invoice is based on actual hours and materials used, not this figure. Accepting this estimate lets us schedule the work.';
      }

      document.getElementById('pylon-card').style.display = info.showPylon ? 'block' : 'none';
      if (!info.showPylon) { document.getElementById('p-pylon-link').value = ''; document.getElementById('p-pylon-id').value = ''; }
    }

    function setSelectedEditClient(client) {
      selectedClientId = client ? client.id : null;
      const note = document.getElementById('selected-client-note');
      if (client) {
        note.innerHTML = `Using existing client: <strong>${client.name}</strong>. Edits below only apply to this quote unless you also update it on the <a class="link-quiet" href="/clients.html" target="_blank">Clients page</a>.`;
        document.getElementById('p-client').value = client.name || '';
        document.getElementById('p-email').value = client.email || '';
        document.getElementById('p-phone').value = client.phone || '';
        document.getElementById('p-address').value = client.address || '';
        document.getElementById('p-payment-terms').value = client.payment_terms || 'cod';
      } else {
        note.textContent = 'No client selected - search above, or just fill in the fields below to create one when you save.';
      }
      document.getElementById('client-search-results').style.display = 'none';
    }

    const JOB_CONTACT_TYPES = [
      { key: 'project_manager_contact_id', type: 'project_manager', label: 'Project manager' },
      { key: 'site_contact_id', type: 'site', label: 'Site supervisor' },
      { key: 'job_contact_id', type: 'job', label: 'Job contact' },
      { key: 'sales_contact_id', type: 'sales', label: 'Sales contact' },
      { key: 'accounts_contact_id', type: 'accounts', label: 'Accounts contact' },
    ];

    async function loadEditJobContactPickers(clientId, preselected = {}) {
      const card = document.getElementById('job-contacts-card');
      const container = document.getElementById('job-contacts-selects');
      assignedContactIds = { ...preselected };
      if (!clientId) { card.style.display = 'none'; return; }

      const { data: contacts, error } = await supabaseClient.from('client_contacts').select('*').eq('client_id', clientId);
      if (error || !contacts || !contacts.length) { card.style.display = 'none'; return; }

      card.style.display = 'block';
      container.innerHTML = JOB_CONTACT_TYPES.map(t => {
        const options = contacts.filter(c => c.contact_type === t.type);
        if (!options.length) return '';
        return `
          <div>
            <label style="margin-top:0">${t.label}</label>
            <select class="job-contact-select" data-key="${t.key}">
              <option value="">-- Not assigned --</option>
              ${options.map(c => `<option value="${c.id}" ${preselected[t.key] === c.id ? 'selected' : ''}>${c.name || c.phone || c.email}</option>`).join('')}
            </select>
          </div>`;
      }).join('');

      if (!container.innerHTML.trim()) { card.style.display = 'none'; return; }
      container.querySelectorAll('.job-contact-select').forEach(sel => {
        sel.addEventListener('change', () => { assignedContactIds[sel.dataset.key] = sel.value || null; });
        assignedContactIds[sel.dataset.key] = sel.value || null;
      });
    }

    function renderEditSowDocList() {
      const el = document.getElementById('sow-doc-list');
      if (!sowDocs.length) { el.innerHTML = ''; return; }
      el.innerHTML = sowDocs.map((d, i) => `
        <div style="display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:6px 10px; margin:0 8px 8px 0; font-size:12px;">
          ${d.name}
          <button type="button" data-i="${i}" class="sow-doc-remove" style="padding:2px 6px; font-size:11px;">x</button>
        </div>`).join('');
      el.querySelectorAll('.sow-doc-remove').forEach(btn => {
        btn.addEventListener('click', () => { sowDocs.splice(parseInt(btn.dataset.i), 1); renderEditSowDocList(); });
      });
    }

    function loadEditAddressAutocomplete(apiKey) {
      if (!apiKey) return;
      if (window.google && window.google.maps) { initEditAddressAutocomplete(); return; }
      window._initEditAddressAutocomplete = initEditAddressAutocomplete;
      if (document.getElementById('google-places-script')) return;
      const script = document.createElement('script');
      script.id = 'google-places-script';
      script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(apiKey)}&libraries=places&callback=_initEditAddressAutocomplete`;
      script.async = true;
      document.head.appendChild(script);
    }

    function initEditAddressAutocomplete() {
      const input = document.getElementById('p-address');
      if (!input) return;
      const autocomplete = new google.maps.places.Autocomplete(input, {
        componentRestrictions: { country: 'au' }, fields: ['formatted_address'], types: ['address'],
      });
      autocomplete.addListener('place_changed', () => {
        const place = autocomplete.getPlace();
        if (place && place.formatted_address) input.value = place.formatted_address;
      });
    }

    function editorPanelHtml() {
      return `
        <div class="card">
          <h2>Proposal template</h2>
          <p class="subtitle" style="margin-bottom:10px;">Changes what this quote asks for and how it's presented to the client.</p>
          <div class="grid cols-3" id="template-picker">
            <button type="button" class="secondary template-option" data-template="new_build">New Build</button>
            <button type="button" class="secondary template-option" data-template="solar">Solar Proposal</button>
            <button type="button" class="secondary template-option" data-template="quick_estimate">Quick Estimate</button>
          </div>

          const { data, error } = await supabaseClient.from('clients').select('*')
            .or(`name.ilike.%${q}%,email.ilike.%${q}%,phone.ilike.%${q}%`).limit(8);
          if (error || !data || !data.length) {
            resultsEl.innerHTML = `<div style="padding:10px 12px; font-size:13px; color:var(--muted);">No matches</div>`;
            resultsEl.style.display = 'block';

              <div style="font-weight:600;">${c.name}</div>

            row.addEventListener('click', () => {

              loadEditJobContactPickers(client.id);

      });

        msg.innerHTML = '';
        try {
          for (const file of fileInput.files) {
            const path = await uploadPrivateFile(file, 'sow-source');
            sowDocs.push({ path, name: file.name, mime: file.type });
          }

          fileInput.value = '';

      document.getElementById('generate-scope-btn').addEventListener('click', async () => {

        const brief = document.getElementById('p-brief').value.trim();
        const projectName = document.getElementById('p-name').value.trim();
        const rows = [...document.querySelectorAll('#cc-rows .cc-row')];
        const stageNames = rows.map(r => r.dataset.name).filter(Boolean);
        if (!brief) { msg.innerHTML = `<div class="error-box">Add a few notes first.</div>`; return; }
        if (stageNames.length === 0) { msg.innerHTML = `<div class="error-box">Add at least one stage first.</div>`; return; }

        btn.disabled = true;
        msg.innerHTML = '';
        try {
          btn.textContent = 'Drafting stage names and descriptions...';
          const scopeRes = await fetch('/.netlify/functions/generate-scope', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ projectName: projectName || 'This project', brief, stageNames }),
          });
          const scopeJson = await scopeRes.json();
          if (!scopeJson.ok) throw new Error(scopeJson.error);

          rows.forEach((row, i) => {
            const stage = scopeJson.stages[i];
            if (!stage) return;
            if (stage.name) { row.querySelector('.cc-name').value = stage.name; row.dataset.name = stage.name.trim(); }
            if (stage.description) row.querySelector('.cc-desc').value = stage.description;
          });
          renumberEditStages();

          const updatedStageNames = rows.map(r => r.dataset.name).filter(Boolean);
          const updatedDescriptions = Object.fromEntries(rows.map(r => [r.dataset.name, r.querySelector('.cc-desc').value]));

          btn.textContent = 'Writing scope of works...';
          const sowRes = await fetch('/.netlify/functions/generate-sow', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              projectName: projectName || 'This project', brief, stageNames: updatedStageNames,
              stageDescriptions: updatedDescriptions, documentPaths: sowDocs.map(d => d.path),
            }),
          });
          const sowJson = await sowRes.json();
          if (!sowJson.ok) throw new Error(sowJson.error);
          document.getElementById('p-sow').value = sowJson.sow;
          msg.innerHTML = `<div class="success-box">Stage names, descriptions, and scope of works drafted. Review and edit as needed.</div>`;
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;

          btn.disabled = false;
          btn.textContent = 'Generate scope of works with AI';
        }

      document.getElementById('reference-upload-btn').addEventListener('click', async () => {

      document.getElementById('add-row').addEventListener('click', () => addRow());

      document.getElementById('cancel-edit-btn').addEventListener('click', () => { editMode = false; render(project, true); });

      applyEditTemplate(project.proposal_template || 'new_build');
      document.getElementById('p-estimate-disclaimer').value = project.estimate_disclaimer_text || '';
      document.getElementById('p-name').value = project.name || '';
      document.getElementById('p-subtitle').value = project.proposal_subtitle || '';
      document.getElementById('p-client').value = project.client_name || '';
      document.getElementById('p-email').value = project.client_email || '';
      document.getElementById('p-phone').value = project.client_phone || '';
      document.getElementById('p-address').value = project.client_address || '';
      document.getElementById('p-sow').value = project.sow_text || '';
      document.getElementById('p-terms').value = project.terms_text || '';
      document.getElementById('p-deposit').value = project.deposit_percent;
      document.getElementById('p-pylon-link').value = project.pylon_link || '';
      document.getElementById('p-pylon-id').value = project.pylon_project_id || '';

      selectedClientId = project.client_id || null;
      referencePhotos = (project.reference_photos || []).map(p => p.url || p);
