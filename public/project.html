    async function loadVariations(projectId) {
      const listEl = document.getElementById('variations-list');
      const [{ data: variations, error }, { data: staff }] = await Promise.all([
        supabaseClient.from('variations').select('*').eq('project_id', projectId).order('created_at', { ascending: false }),
        supabaseClient.from('profiles').select('id, full_name'),
      ]);
      if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }
      if (!variations.length) { listEl.innerHTML = `<p class="subtitle">No variations recorded.</p>`; return; }

      listEl.innerHTML = variations.map(v => {
        const who = (staff || []).find(s => s.id === v.created_by)?.full_name || 'Someone';
        const isSigned = v.status === 'signed';
        return `
          <div style="border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:10px;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;">
              <div>
                ${isSigned ? `<span class="badge accepted">Signed</span>` : `<span class="badge draft">Quick note</span>`}
                <span style="margin-left:6px; font-weight:600; color:${Number(v.total_delta) >= 0 ? 'var(--green)' : 'var(--red)'};">${Number(v.total_delta) >= 0 ? '+' : ''}${money(v.total_delta)}</span>
              </div>
              <p class="subtitle" style="margin:0; font-size:12px;">${who} &middot; ${new Date(v.created_at).toLocaleDateString('en-AU')}</p>
            </div>
            <p style="margin:8px 0 0;">${v.description}</p>
            <div style="margin-top:8px; font-size:13px;">
              ${(v.changes || []).map(c => `<div class="subtitle">${c.cost_centre_name}: ${money(c.old_amount)} &rarr; ${money(c.new_amount)}</div>`).join('')}
            </div>
            ${isSigned ? `<p class="subtitle" style="margin-top:8px;">Signed by ${v.signed_by_name} on ${new Date(v.signed_at).toLocaleDateString('en-AU')}</p>` : ''}
          </div>`;
      }).join('');
    }

    async function loadJobTasks(projectId) {
      const listEl = document.getElementById('job-tasks-list');
      const summaryEl = document.getElementById('summary-tasks-line');

      // Wired up unconditionally, before any early return below - otherwise
      // a load error (e.g. job_tasks not migrated yet) leaves "+ Add task"
      // silently unresponsive with no listener attached at all.
      const addBtn = document.getElementById('add-task-btn');
      if (addBtn) addBtn.onclick = () => openAddTaskPanel(projectId);

      const [{ data: tasks, error }, { data: staff }] = await Promise.all([
        supabaseClient.from('job_tasks').select('*').eq('project_id', projectId)
          .order('completed', { ascending: true }).order('required_before_scheduling', { ascending: false }),
        supabaseClient.from('profiles').select('id, full_name'),
      ]);
      if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }

      if (summaryEl) {
        const outstanding = (tasks || []).filter(t => !t.completed);
        const requiredOutstanding = outstanding.filter(t => t.required_before_scheduling);
        summaryEl.innerHTML = !outstanding.length
          ? `<p class="subtitle">No open tasks.</p>`
          : `<p class="subtitle">${outstanding.length} task${outstanding.length === 1 ? '' : 's'} outstanding${requiredOutstanding.length ? `, <span style="color:var(--red);">${requiredOutstanding.length} required before scheduling</span>` : ''}.</p>`;
      }

      if (!tasks.length) { listEl.innerHTML = `<p class="subtitle">No tasks yet.</p>`; return; }

      const staffName = (id) => (staff || []).find(s => s.id === id)?.full_name || 'Someone';
      const today = new Date(); today.setHours(0, 0, 0, 0);

      listEl.innerHTML = tasks.map(t => {
        const who = t.assigned_to_user_id ? staffName(t.assigned_to_user_id) : t.assigned_to_role ? `Anyone in ${t.assigned_to_role}` : 'Unassigned';
        const isOverdue = t.due_date && !t.completed && new Date(t.due_date) < today;
        const dueLabel = t.due_date ? `Due ${new Date(t.due_date).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })}` : '';
        return `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); ${t.completed ? 'opacity:0.5;' : ''}">
            <div>
              <span style="${t.completed ? 'text-decoration:line-through;' : ''}">${t.description}</span>
              <p class="subtitle" style="margin:2px 0 0; font-size:12px;">
                ${who}
                ${dueLabel ? ` &middot; <span style="${isOverdue ? 'color:var(--red);' : ''}">${dueLabel}</span>` : ''}
                ${t.schedule_assignment_id ? ` &middot; On calendar` : ''}
                ${t.required_before_scheduling ? ' &middot; <span style="color:var(--red);">Required before scheduling</span>' : ''}
              </p>
            </div>
            ${!t.completed ? `<button type="button" class="secondary complete-job-task-btn" data-id="${t.id}" style="font-size:12px; padding:6px 10px;">Done</button>` : ''}
          </div>`;
      }).join('');

      listEl.querySelectorAll('.complete-job-task-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const { data: { user } } = await supabaseClient.auth.getUser();
          await supabaseClient.from('job_tasks').update({
            completed: true, completed_by: user.id, completed_at: new Date().toISOString(),
          }).eq('id', btn.dataset.id);
          const task = tasks.find(t => t.id === btn.dataset.id);
          await logActivity('project', projectId, 'task_completed', `Task completed: ${task?.description || ''}`);
          await loadJobTasks(projectId);
        });
      });
    }

    async function openAddTaskPanel(projectId) {
      const [{ data: staff }, { data: project }] = await Promise.all([
        supabaseClient.from('profiles').select('id, full_name').order('full_name'),
        supabaseClient.from('projects').select('job_number').eq('id', projectId).single(),
      ]);
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:420px; width:100%;">
          <h2>Add task</h2>
          <label style="margin-top:0">Description</label>
          <input id="at-desc" placeholder="e.g. Check POs and order stock" />
          <label>Assign to</label>
          <select id="at-assign-type">
            <option value="none">Leave unassigned - anyone can pick it up</option>
            <option value="person">A specific person</option>
            <option value="role">A role</option>
          </select>
          <div id="at-person-section" style="display:none; margin-top:8px;">
            <select id="at-person">${(staff || []).map(s => `<option value="${s.id}">${s.full_name}</option>`).join('')}</select>
          </div>
          <div id="at-role-section" style="display:none; margin-top:8px;">
            <select id="at-role">
              <option value="admin">Admin</option>
              <option value="finance">Finance</option>
              <option value="sales">Sales</option>
              <option value="staff">Staff</option>
            </select>
          </div>
          <label>Due date (optional)</label>
          <input type="date" id="at-due-date" />
          <label id="at-calendar-row" style="margin-top:14px; display:none; align-items:center; gap:8px;">
            <input type="checkbox" id="at-add-to-calendar" style="width:auto;" /> Also put this on their Schedule for that date
          </label>
          <label style="margin-top:14px; display:flex; align-items:center; gap:8px;">
            <input type="checkbox" id="at-required" style="width:auto;" /> Required before this job can be scheduled
          </label>
          <div style="margin-top:14px;">
            <button id="at-save-btn">Add task</button>
            <button type="button" class="secondary" id="at-cancel-btn">Cancel</button>
          </div>
          <div id="at-msg"></div>
        </div>`;
      document.body.appendChild(overlay);

      // "Add to calendar" only makes sense with a specific person and a
      // date to schedule them on - shown as a plain label/checkbox rather
      // than disabled, so it's obvious why it's hidden rather than looking
      // broken.
      function refreshCalendarRowVisibility() {
        const assignType = overlay.querySelector('#at-assign-type').value;
        const hasDate = !!overlay.querySelector('#at-due-date').value;
        overlay.querySelector('#at-calendar-row').style.display = (assignType === 'person' && hasDate) ? 'flex' : 'none';
        if (!(assignType === 'person' && hasDate)) overlay.querySelector('#at-add-to-calendar').checked = false;
      }

      overlay.querySelector('#at-assign-type').addEventListener('change', (e) => {
        overlay.querySelector('#at-person-section').style.display = e.target.value === 'person' ? 'block' : 'none';
        overlay.querySelector('#at-role-section').style.display = e.target.value === 'role' ? 'block' : 'none';
        refreshCalendarRowVisibility();
      });
      overlay.querySelector('#at-due-date').addEventListener('change', refreshCalendarRowVisibility);

      overlay.querySelector('#at-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#at-save-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#at-msg');
        const description = overlay.querySelector('#at-desc').value.trim();
        if (!description) { msg.innerHTML = `<div class="error-box">Enter a description.</div>`; return; }
        const assignType = overlay.querySelector('#at-assign-type').value;
        const dueDate = overlay.querySelector('#at-due-date').value || null;
        const addToCalendar = overlay.querySelector('#at-add-to-calendar').checked;
        const personId = assignType === 'person' ? overlay.querySelector('#at-person').value : null;

        const saveBtn = overlay.querySelector('#at-save-btn');
        saveBtn.disabled = true;
        saveBtn.textContent = 'Adding...';
        try {
          const { data: { user } } = await supabaseClient.auth.getUser();

          let scheduleAssignmentId = null;
          if (addToCalendar && personId && dueDate) {
            const { data: assignment, error: schedErr } = await supabaseClient
              .from('schedule_assignments')
              .insert({
                staff_id: personId, project_id: projectId,
                block_type: project?.job_number ? 'job' : 'site_visit',
                assignment_date: dueDate, start_time: '07:00', end_time: '15:00',
              })
              .select('id')
              .single();
            if (schedErr) throw schedErr;
            scheduleAssignmentId = assignment.id;
          }

          const { error } = await supabaseClient.from('job_tasks').insert({
            project_id: projectId,
            description,
            assigned_to_user_id: personId,
            assigned_to_role: assignType === 'role' ? overlay.querySelector('#at-role').value : null,
            required_before_scheduling: overlay.querySelector('#at-required').checked,
            due_date: dueDate,
            schedule_assignment_id: scheduleAssignmentId,
            created_by: user.id,
          });
          if (error) throw error;
          const who = personId ? staff.find(s => s.id === personId)?.full_name : (assignType === 'role' ? overlay.querySelector('#at-role').value : null);
          await logActivity('project', projectId, 'task_added', `Task added: ${description}${who ? ` (assigned to ${who})` : ''}`);
          overlay.remove();
          await loadJobTasks(projectId);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
          saveBtn.disabled = false;
          saveBtn.textContent = 'Add task';
        }
      });
    }

    // The "Cost allocated" stat's accrued labour figure is a sum of real
    // clocked time - this lets whoever can see that stat drill into the
    // timesheet entries behind it, and (admin only) correct which stage
    // an entry's hours are attributed to, or reclassify it as office/
    // training/other time entirely.
    async function openTimesheetDrilldown(project, pricingVisible) {
      const centres = (project.cost_centres || []).slice().sort((a, b) => a.sort_order - b.sort_order);
      const myRole = await getMyRole();
      const isAdmin = myRole === 'admin';
      const colCount = 4 + (pricingVisible ? 1 : 0) + (isAdmin ? 1 : 0);

      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:720px; width:100%; max-height:85vh; overflow-y:auto;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <h2 style="margin:0;">Accrued cost on this job</h2>
            <button type="button" class="secondary" id="td-close-btn">Close</button>
          </div>
          <p class="subtitle" style="margin-bottom:14px;">${isAdmin ? 'As admin you can correct which stage an entry belongs to, or move it to office/non-job time.' : 'Read-only - admins can edit the cost centre / office time split.'}</p>
          <div id="td-msg"></div>
          <h3 style="margin-bottom:8px;">Timesheets</h3>
          <div id="td-list"><p class="subtitle">Loading...</p></div>
          <h3 style="margin:22px 0 8px;">Purchase orders received</h3>
          <div id="td-po-list"><p class="subtitle">Loading...</p></div>
        </div>`;
      document.body.appendChild(overlay);
      overlay.querySelector('#td-close-btn').addEventListener('click', () => overlay.remove());

      const centreName = (id) => centres.find(c => c.id === id)?.name || 'Unknown stage';
      const stageLabel = (entry) => {
        if (entry.time_category && entry.time_category !== 'job') {
          return entry.time_category.charAt(0).toUpperCase() + entry.time_category.slice(1);
        }
        const ids = (entry.selected_cost_centre_ids && entry.selected_cost_centre_ids.length)
          ? entry.selected_cost_centre_ids
          : (entry.cost_centre_id ? [entry.cost_centre_id] : []);
        return ids.length ? ids.map(centreName).join(', ') : 'Unassigned';
      };
      const hoursFor = (entry) => entry.clock_out
        ? Math.round(((new Date(entry.clock_out) - new Date(entry.clock_in)) / 3600000) * 100) / 100
        : null;

      async function refreshList() {
        const listEl = overlay.querySelector('#td-list');
        const { data: entries, error } = await supabaseClient
          .from('time_entries')
          .select('id, staff_id, clock_in, clock_out, cost_centre_id, selected_cost_centre_ids, time_category, profiles(full_name)')
          .eq('project_id', project.id)
          .order('clock_in', { ascending: false });
        if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }
        if (!entries.length) { listEl.innerHTML = `<p class="subtitle">No timesheet entries logged against this job yet.</p>`; return; }

        const costById = pricingVisible ? await computeEntryLabourCosts(entries.filter(e => e.clock_out)) : new Map();
        // Sum only THIS project's entries, not every value in costById - it
        // also holds cost for the same employee's entries on OTHER jobs
        // during the same pay week (computeEntryLabourCosts needs the
        // whole week to band overtime correctly), which would otherwise
        // inflate this total past what the rows above it actually show.
        const totalCost = entries.reduce((s, e) => s + (costById.get(e.id) || 0), 0);

        listEl.innerHTML = `
          <table class="responsive-stack">
            <thead><tr><th>Staff</th><th>Date</th><th class="num">Hours</th><th>Stage / category</th>${pricingVisible ? '<th class="num">Cost</th>' : ''}${isAdmin ? '<th></th>' : ''}</tr></thead>
            <tbody>
              ${entries.map(e => {
                const hrs = hoursFor(e);
                const cost = costById.get(e.id);
                return `
                <tr data-entry-id="${e.id}">
                  <td data-label="Staff">${e.profiles?.full_name || 'Unknown'}</td>
                  <td data-label="Date">${new Date(e.clock_in).toLocaleDateString()}</td>
                  <td class="num" data-label="Hours">${hrs === null ? 'In progress' : hrs.toFixed(2)}</td>
                  <td data-label="Stage / category">${stageLabel(e)}</td>
                  ${pricingVisible ? `<td class="num" data-label="Cost">${cost === undefined ? '-' : money(cost)}</td>` : ''}
                  ${isAdmin ? `<td><button type="button" class="secondary td-edit-btn" data-id="${e.id}" style="font-size:12px; padding:4px 8px;">Edit</button></td>` : ''}
                </tr>
                <tr class="td-edit-row" data-edit-for="${e.id}" style="display:none;"><td colspan="${colCount}"></td></tr>`;
              }).join('')}
            </tbody>
            ${pricingVisible ? `<tfoot><tr><td colspan="${colCount - 1 - (isAdmin ? 1 : 0)}" style="text-align:right; font-weight:600;">Total labour cost</td><td class="num" style="font-weight:600;">${money(totalCost)}</td>${isAdmin ? '<td></td>' : ''}</tr></tfoot>` : ''}
          </table>`;

        if (!isAdmin) return;
        listEl.querySelectorAll('.td-edit-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const entry = entries.find(e => e.id === btn.dataset.id);
            openEditRow(entry);
          });
        });
      }

      async function refreshPoList() {
        const listEl = overlay.querySelector('#td-po-list');
        if (!pricingVisible) { listEl.innerHTML = `<p class="subtitle">Pricing details are hidden for your role.</p>`; return; }

        const { data: pos, error } = await supabaseClient
          .from('purchase_orders')
          .select('id, po_number, cost_centre_id, suppliers(name), supplier_name, purchase_order_line_items(description, quantity, unit_cost, received)')
          .eq('project_id', project.id);
        if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }

        const receivedRows = [];
        (pos || []).forEach(po => {
          const supplierLabel = po.suppliers?.name || po.supplier_name || 'Unknown supplier';
          (po.purchase_order_line_items || []).filter(li => li.received).forEach(li => {
            receivedRows.push({ ...li, supplierLabel, poNumber: po.po_number, stage: centreName(po.cost_centre_id) });
          });
        });

        if (!receivedRows.length) { listEl.innerHTML = `<p class="subtitle">No purchase order line items received yet - only received items count as accrued cost, not just approved/ordered ones.</p>`; return; }

        const totalMaterial = receivedRows.reduce((s, li) => s + Number(li.quantity) * Number(li.unit_cost), 0);
        listEl.innerHTML = `
          <table class="responsive-stack">
            <thead><tr><th>Item</th><th>Supplier</th><th>Stage</th><th class="num">Qty</th><th class="num">Unit cost</th><th class="num">Total</th></tr></thead>
            <tbody>
              ${receivedRows.map(li => `
                <tr>
                  <td data-label="Item">${li.description}${li.poNumber ? ` <span class="subtitle" style="font-size:11px;">(${li.poNumber})</span>` : ''}</td>
                  <td data-label="Supplier">${li.supplierLabel}</td>
                  <td data-label="Stage">${li.stage}</td>
                  <td class="num" data-label="Qty">${li.quantity}</td>
                  <td class="num" data-label="Unit cost">${money(li.unit_cost)}</td>
                  <td class="num" data-label="Total">${money(Number(li.quantity) * Number(li.unit_cost))}</td>
                </tr>`).join('')}
            </tbody>
            <tfoot><tr><td colspan="5" style="text-align:right; font-weight:600;">Total received materials cost</td><td class="num" style="font-weight:600;">${money(totalMaterial)}</td></tr></tfoot>
          </table>`;
      }

      function openEditRow(entry) {
        const editCell = overlay.querySelector(`tr[data-edit-for="${entry.id}"] td`);
        const selectedIds = (entry.selected_cost_centre_ids && entry.selected_cost_centre_ids.length)
          ? entry.selected_cost_centre_ids
          : (entry.cost_centre_id ? [entry.cost_centre_id] : []);
        const category = entry.time_category && entry.time_category !== 'job' ? entry.time_category : 'job';

        editCell.innerHTML = `
          <div style="padding:10px; background:var(--surface-2); border-radius:8px;">
            <label style="margin-top:0;">Category</label>
            <select class="td-category">
              <option value="job" ${category === 'job' ? 'selected' : ''}>Job - split across stage(s) below</option>
              <option value="office" ${category === 'office' ? 'selected' : ''}>Office / admin</option>
              <option value="training" ${category === 'training' ? 'selected' : ''}>Training</option>
              <option value="other" ${category === 'other' ? 'selected' : ''}>Other</option>
            </select>
            <div class="td-stage-section" style="margin-top:8px; ${category === 'job' ? '' : 'display:none;'}">
              <label>Stage(s) - tick every stage this entry's hours count against</label>
              ${centres.map(c => `
                <label style="display:flex; align-items:center; gap:8px; font-weight:400; margin-top:6px;">
                  <input type="checkbox" class="td-stage-check" value="${c.id}" style="width:auto;" ${selectedIds.includes(c.id) ? 'checked' : ''} />
                  ${c.name}
                </label>`).join('')}
            </div>
            <div style="margin-top:12px;">
              <button type="button" class="td-save-btn">Save</button>
              <button type="button" class="secondary td-cancel-btn">Cancel</button>
            </div>
            <div class="td-edit-msg"></div>
          </div>`;
        editCell.closest('tr').style.display = 'table-row';

        editCell.querySelector('.td-category').addEventListener('change', (e) => {
          editCell.querySelector('.td-stage-section').style.display = e.target.value === 'job' ? '' : 'none';
        });
        editCell.querySelector('.td-cancel-btn').addEventListener('click', () => {
          editCell.closest('tr').style.display = 'none';
          editCell.innerHTML = '';
        });
        editCell.querySelector('.td-save-btn').addEventListener('click', async () => {
          const msg = editCell.querySelector('.td-edit-msg');
          const newCategory = editCell.querySelector('.td-category').value;
          const checkedIds = Array.from(editCell.querySelectorAll('.td-stage-check:checked')).map(el => el.value);
          if (newCategory === 'job' && !checkedIds.length) {
            msg.innerHTML = `<div class="error-box">Tick at least one stage, or choose a non-job category.</div>`;
            return;
          }
          try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const res = await fetch('/.netlify/functions/admin-update-time-entry', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
              body: JSON.stringify({
                entryId: entry.id,
                project_id: newCategory === 'job' ? project.id : null,
                cost_centre_id: newCategory === 'job' && checkedIds.length === 1 ? checkedIds[0] : null,
                selected_cost_centre_ids: newCategory === 'job' && checkedIds.length > 1 ? checkedIds : null,
                time_category: newCategory,
              }),
            });
            const data = await res.json();
            if (!res.ok || !data.ok) throw new Error(data.error || 'Update failed');

            await refreshList();
            const refreshed = await loadProject();
            if (refreshed) render(refreshed, pricingVisible);
          } catch (err) {
            msg.innerHTML = `<div class="error-box">${err.message}</div>`;
          }
        });
      }

      await Promise.all([refreshList(), refreshPoList()]);
    }

    async function loadDocuments(projectId) {
      const listEl = document.getElementById('documents-list');
      const pillsEl = document.getElementById('doc-folder-pills');
      const folderSelect = document.getElementById('doc-folder-select');

      const { data: docs, error } = await supabaseClient
        .from('project_documents')
        .select('*, profiles(full_name)')
        .eq('project_id', projectId)
        .order('created_at', { ascending: false });
      if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }

      const folders = [...new Set((docs || []).map(d => d.folder))].sort();
      const folderOptions = ['General', ...folders.filter(f => f !== 'General')];
      folderSelect.innerHTML = folderOptions.map(f => `<option value="${f}">${f}</option>`).join('');

      pillsEl.innerHTML = ['All', ...folders].map(f => `
        <button type="button" class="secondary doc-folder-pill" data-folder="${f}" style="font-size:12px; padding:6px 12px; ${f === selectedDocFolder ? 'background:var(--accent-dim); color:var(--accent);' : ''}">${f}</button>
      `).join('');
      pillsEl.querySelectorAll('.doc-folder-pill').forEach(btn => {
        btn.addEventListener('click', () => { selectedDocFolder = btn.dataset.folder; loadDocuments(projectId); });
      });

      const visible = selectedDocFolder === 'All' ? (docs || []) : (docs || []).filter(d => d.folder === selectedDocFolder);
      if (!visible.length) {
        listEl.innerHTML = `<p class="subtitle">No documents${selectedDocFolder === 'All' ? '' : ' in this folder'} yet.</p>`;
        return;
      }

      listEl.innerHTML = visible.map(d => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); gap:10px;">
          <div style="min-width:0;">
            <a href="#" class="link-quiet doc-view-link" data-path="${d.file_path}" style="font-weight:600;">${d.file_name}</a>
            <p class="subtitle" style="margin:2px 0 0; font-size:12px;">${d.folder} &middot; ${d.profiles?.full_name || 'Someone'} &middot; ${new Date(d.created_at).toLocaleDateString('en-AU')}</p>
          </div>
          <button type="button" class="secondary doc-delete-btn" data-id="${d.id}" data-path="${d.file_path}" style="font-size:12px; padding:6px 10px; flex-shrink:0;">Delete</button>
        </div>`).join('');

      listEl.querySelectorAll('.doc-view-link').forEach(a => {
        a.addEventListener('click', async (e) => {
          e.preventDefault();
          try {
            const url = await getSignedDocUrl(a.dataset.path);
            window.open(url, '_blank');
          } catch (err) { alert(err.message); }
        });
      });
      listEl.querySelectorAll('.doc-delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this document? This removes the file permanently.')) return;
          try {
            await supabaseClient.storage.from('project-documents').remove([btn.dataset.path]);
            const { error: delErr } = await supabaseClient.from('project_documents').delete().eq('id', btn.dataset.id);
            if (delErr) throw delErr;
            await logActivity('project', projectId, 'document_deleted', 'Deleted a document');
            await loadDocuments(projectId);
          } catch (err) { alert(err.message); }
        });
      });
    }

    function wireDocumentUpload(project) {
      document.getElementById('doc-upload-btn').addEventListener('click', async () => {
        const btn = document.getElementById('doc-upload-btn');
        const fileInput = document.getElementById('doc-file-input');
        const msg = document.getElementById('doc-upload-msg');
        const newFolder = document.getElementById('doc-new-folder').value.trim();
        const folder = newFolder || document.getElementById('doc-folder-select').value || 'General';
        if (!fileInput.files.length) { msg.innerHTML = `<div class="error-box">Choose one or more files first.</div>`; return; }

        msg.innerHTML = '';
        btn.disabled = true;
        btn.textContent = 'Uploading...';
        try {
          const { data: { user } } = await supabaseClient.auth.getUser();
          for (const file of fileInput.files) {
            const path = await uploadPrivateFile(file, `documents/${project.id}`);
            const { error } = await supabaseClient.from('project_documents').insert({
              project_id: project.id, folder, file_path: path, file_name: file.name, mime_type: file.type, uploaded_by: user.id,
            });
            if (error) throw error;
          }
          await logActivity('project', project.id, 'documents_uploaded', `Uploaded ${fileInput.files.length} document${fileInput.files.length === 1 ? '' : 's'} to ${folder}`);
          fileInput.value = '';
          document.getElementById('doc-new-folder').value = '';
          selectedDocFolder = folder;
          await loadDocuments(project.id);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        } finally {
          btn.disabled = false;
          btn.textContent = 'Upload';
        }
      });
    }

    function fuzzyMatchScore(a, b) {
      const norm = (s) => (s || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(w => w.length > 2);
      const wordsA = new Set(norm(a));
      const wordsB = norm(b);
      if (!wordsA.size || !wordsB.length) return 0;
      const matches = wordsB.filter(w => wordsA.has(w)).length;
      return matches / Math.max(wordsA.size, wordsB.length);
    }

    async function openSuggestPoPanel(projectId, centres) {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `<div class="card" style="max-width:400px; width:100%;"><p class="subtitle">Matching quoted materials against Stock...</p></div>`;
      document.body.appendChild(overlay);

      const { data: materials } = await supabaseClient.from('materials').select('id, name, cost_price, supplier_id, quantity_on_hand, suppliers(name)');
      const { data: existingPOItems } = await supabaseClient
        .from('purchase_order_line_items')
        .select('material_id, purchase_orders!inner(project_id)')
        .eq('purchase_orders.project_id', projectId);
      const alreadyOrderedMaterialIds = new Set((existingPOItems || []).map(x => x.material_id).filter(Boolean));

      const quotedMaterials = centres.flatMap(c => (c.cost_centre_line_items || [])
        .filter(li => li.item_type === 'material')
        .map(li => ({ ...li, stageName: c.name, costCentreId: c.id })));

      const matched = {}; // supplier_id -> { supplierName, items: [] }
      const unassigned = [];
      const fromStock = []; // covered by what's already on hand - never ordered at all

      quotedMaterials.forEach(li => {
        let bestMatch = null, bestScore = 0;
        (materials || []).forEach(m => {
          const score = fuzzyMatchScore(m.name, li.description);
          if (score > bestScore) { bestScore = score; bestMatch = m; }
        });
        const match = bestScore >= 0.3 ? bestMatch : null;
        if (match && alreadyOrderedMaterialIds.has(match.id)) return; // already on a PO for this job, skip

        const onHand = Number(match?.quantity_on_hand) || 0;
        const quotedQty = Number(li.quantity) || 0;
        const coveredByStock = match ? Math.min(quotedQty, onHand) : 0;
        const stillNeeded = quotedQty - coveredByStock;

        if (coveredByStock > 0) {
          fromStock.push({ description: li.description, quantity: coveredByStock, unit_cost: match.cost_price, materialId: match.id, costCentreId: li.costCentreId, stageName: li.stageName });
        }
        if (stillNeeded <= 0) return; // fully covered by existing stock, nothing to order

        if (match && match.supplier_id) {
          if (!matched[match.supplier_id]) matched[match.supplier_id] = { supplierName: match.suppliers?.name || 'Unknown', items: [] };
          matched[match.supplier_id].items.push({ description: li.description, quantity: stillNeeded, unit_cost: match.cost_price, materialId: match.id, stageName: li.stageName });
        } else {
          unassigned.push({ description: li.description, quantity: stillNeeded, unit_cost: li.unit_cost, materialId: match?.id || null, stageName: li.stageName });
        }
      });

      const { data: suppliers } = await supabaseClient.from('suppliers').select('id, name').order('name');

      if (!Object.keys(matched).length && !unassigned.length && !fromStock.length) {
        overlay.querySelector('.card').innerHTML = `<h2>Nothing to suggest</h2><p class="subtitle">Every quoted material is either already on a PO for this job, or there are no material line items quoted.</p><button type="button" class="secondary" id="sp-close-btn">Close</button>`;
        overlay.querySelector('#sp-close-btn').addEventListener('click', () => overlay.remove());
        return;
      }

      overlay.style.overflowY = 'auto';
      overlay.innerHTML = `
        <div class="card" style="max-width:720px; width:100%; max-height:90vh; overflow-y:auto;">
          <h2>Suggested purchase orders</h2>
          <p class="subtitle" style="margin-bottom:14px;">Nothing's created yet - review each supplier group, then confirm.</p>

          ${fromStock.length ? `
            <div style="border:1px solid var(--green); border-radius:8px; padding:12px; margin-bottom:10px;">
              <p style="margin:0 0 8px; color:var(--green); font-weight:600;">Already covered by Stock - nothing to order</p>
              ${fromStock.map(item => `<div style="font-size:13px; display:flex; justify-content:space-between; padding:4px 0;"><span>${item.description} (${item.stageName}) x${item.quantity}</span><span>${money(item.quantity * item.unit_cost)}</span></div>`).join('')}
              <p class="subtitle" style="margin-top:6px;">This will be deducted from Stock and costed directly to the job when you confirm.</p>
            </div>` : ''}

          ${Object.entries(matched).map(([supplierId, group]) => `
            <div class="sp-group" data-supplier-id="${supplierId}" style="border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px;">
              <label style="margin-top:0; display:flex; align-items:center; gap:8px;"><input type="checkbox" class="sp-include" checked style="width:auto;" /><strong>${group.supplierName}</strong></label>
              ${group.items.map(item => `<div style="font-size:13px; display:flex; justify-content:space-between; padding:4px 0;"><span>${item.description} (${item.stageName}) x${item.quantity}</span><span>${money(item.quantity * item.unit_cost)}</span></div>`).join('')}
              <p class="subtitle" style="margin-top:6px;">Total: ${money(group.items.reduce((s, i) => s + i.quantity * i.unit_cost, 0))}</p>
            </div>`).join('')}

          ${unassigned.length ? `
            <div style="border:1px solid var(--red); border-radius:8px; padding:12px; margin-bottom:10px;">
              <p style="margin:0 0 8px; color:var(--red); font-weight:600;">Needs a supplier assigned</p>
              ${unassigned.map((item, i) => `
                <div class="sp-unassigned-row" data-index="${i}" style="display:grid; grid-template-columns:2fr 1fr; gap:8px; margin-bottom:6px; align-items:center;">
                  <span style="font-size:13px;">${item.description} (${item.stageName}) x${item.quantity}</span>
                  <select class="sp-unassigned-supplier" style="font-size:12px;">
                    <option value="">-- Skip --</option>
                    ${(suppliers || []).map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
                  </select>
                </div>`).join('')}
            </div>` : ''}

          <div style="margin-top:14px;">
            <button id="sp-confirm-btn">Confirm</button>
            <button type="button" class="secondary" id="sp-cancel-btn">Cancel</button>
          </div>
          <div id="sp-msg"></div>
        </div>`;

      overlay.querySelector('#sp-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#sp-confirm-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#sp-msg');
        const confirmBtn = overlay.querySelector('#sp-confirm-btn');
        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Creating...';

        try {
          const { data: { user } } = await supabaseClient.auth.getUser();
          let created = 0;

          // Deduct what's covered by existing stock and cost it straight
          // to the job - this portion is never ordered at all.
          for (const item of fromStock) {
            await supabaseClient.from('job_material_usage').insert({
              project_id: projectId, cost_centre_id: item.costCentreId, material_id: item.materialId,
              quantity: item.quantity, unit_cost: item.unit_cost, source: 'from_stock', created_by: user.id,
            });
            await adjustWarehouseStock(item.materialId, -item.quantity);
          }

          for (const groupEl of overlay.querySelectorAll('.sp-group')) {
            if (!groupEl.querySelector('.sp-include').checked) continue;
            const supplierId = groupEl.dataset.supplierId;
            const group = matched[supplierId];
            const { data: newPo, error: poErr } = await supabaseClient.from('purchase_orders').insert({
              project_id: projectId, supplier_id: supplierId, supplier_name: group.supplierName,
              po_number: await drawNextPoNumber(),
              po_type: 'fixed', locked: true, status: 'ordered', amount: 0,
              description: 'Auto-suggested from quoted materials',
            }).select('id').single();
            if (poErr) throw poErr;
            await logActivity('purchase_order', newPo.id, 'created', `PO created for ${group.supplierName} (auto-suggested from quote)`);
            await supabaseClient.from('purchase_order_line_items').insert(
              group.items.map(item => ({ po_id: newPo.id, material_id: item.materialId, description: item.description, quantity: item.quantity, unit_cost: item.unit_cost, added_by: user.id }))
            );
            created++;
          }

          // Group manually-assigned unassigned items by the supplier picked
          const manualGroups = {};
          overlay.querySelectorAll('.sp-unassigned-row').forEach(row => {
            const supplierId = row.querySelector('.sp-unassigned-supplier').value;
            if (!supplierId) return;
            const item = unassigned[parseInt(row.dataset.index)];
            if (!manualGroups[supplierId]) manualGroups[supplierId] = [];
            manualGroups[supplierId].push(item);
          });
          for (const [supplierId, items] of Object.entries(manualGroups)) {
            const supplierName = suppliers.find(s => s.id === supplierId)?.name || 'Unknown';
            const { data: newPo, error: poErr } = await supabaseClient.from('purchase_orders').insert({
              project_id: projectId, supplier_id: supplierId, supplier_name: supplierName,
              po_number: await drawNextPoNumber(),
              po_type: 'fixed', locked: true, status: 'ordered', amount: 0,
              description: 'Auto-suggested from quoted materials (manually assigned)',
            }).select('id').single();
            if (poErr) throw poErr;
            await logActivity('purchase_order', newPo.id, 'created', `PO created for ${supplierName} (auto-suggested, manually assigned)`);
            await supabaseClient.from('purchase_order_line_items').insert(
              items.map(item => ({ po_id: newPo.id, material_id: item.materialId, description: item.description, quantity: item.quantity, unit_cost: item.unit_cost, added_by: user.id }))
            );
            created++;
          }

          overlay.remove();
          alert(`Created ${created} purchase order${created === 1 ? '' : 's'}.`);
          await loadPurchaseOrders(projectId, centres);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
          confirmBtn.disabled = false;
          confirmBtn.textContent = 'Create purchase orders';
        }
      });
    }

    function openAddPoItemPanel(poId, projectId, centres) {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `

          <label style="margin-top:0">Description</label>

          <div class="grid cols-2">

            <div><label>Unit cost</label><input id="ap-cost" type="number" step="0.01" /></div>
          </div>
          <div style="margin-top:14px;">
            <button id="ap-save-btn">Add</button>
            <button type="button" class="secondary" id="ap-cancel-btn">Cancel</button>
          </div>
          <div id="ap-msg"></div>
        </div>`;
      document.body.appendChild(overlay);

      overlay.querySelector('#ap-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#ap-save-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#ap-msg');
        const description = overlay.querySelector('#ap-desc').value.trim();
        if (!description) { msg.innerHTML = `<div class="error-box">Enter a description.</div>`; return; }
        const { data: { user } } = await supabaseClient.auth.getUser();
        const { error } = await supabaseClient.from('purchase_order_line_items').insert({
          po_id: poId,
          description,
          quantity: parseFloat(overlay.querySelector('#ap-qty').value) || 1,
          unit_cost: parseFloat(overlay.querySelector('#ap-cost').value) || 0,
          added_by: user.id,
        });
        if (error) { msg.innerHTML = `<div class="error-box">${error.message}</div>`; return; }
        overlay.remove();
        await loadPurchaseOrders(projectId, centres);
      });
    }

    function openOverridePoPanel(po, projectId, centres) {
      const items = po.purchase_order_line_items || [];
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; overflow-y:auto;';
      overlay.innerHTML = `
        <div class="card" style="max-width:520px; width:100%; max-height:85vh; overflow-y:auto;">
          <h2>Override PO ${po.po_number || ''}</h2>
          <p class="subtitle" style="margin-bottom:10px;">This PO was sent and locked - only Admin/Finance can adjust it after the fact, for when the real invoice comes in different.</p>
          <div id="ov-items">
            ${items.map(li => `
              <div class="ov-line" data-id="${li.id}" style="display:grid; grid-template-columns:2fr 1fr 1fr; gap:6px; margin-bottom:6px;">
                <input class="ov-desc" value="${li.description}" style="font-size:13px;" />
                <input class="ov-qty" type="number" step="0.01" value="${li.quantity}" style="font-size:13px;" />
                <input class="ov-cost" type="number" step="0.01" value="${li.unit_cost}" style="font-size:13px;" />
              </div>`).join('')}
          </div>
          <div style="margin-top:14px;">
            <button id="ov-save-btn">Save changes</button>
            <button type="button" class="secondary" id="ov-cancel-btn">Cancel</button>
          </div>
          <div id="ov-msg"></div>
        </div>`;
      document.body.appendChild(overlay);

      overlay.querySelector('#ov-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#ov-save-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#ov-msg');
        try {
          const rows = [...overlay.querySelectorAll('.ov-line')];
          for (const row of rows) {
            await supabaseClient.from('purchase_order_line_items').update({
              description: row.querySelector('.ov-desc').value.trim(),
              quantity: parseFloat(row.querySelector('.ov-qty').value) || 0,
              unit_cost: parseFloat(row.querySelector('.ov-cost').value) || 0,
            }).eq('id', row.dataset.id);
          }
          overlay.remove();
          await loadPurchaseOrders(projectId, centres);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        }
      });
    }

    (async function () {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();
      renderMainNav('job-pipeline');
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });
      const project = await loadProject();
      const myRole = await getMyRole();
      if (project) render(project, isPricingRole(myRole));
    })();
  </script>
</body>
</html>
