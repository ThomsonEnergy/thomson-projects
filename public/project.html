        if (due) bits.push(`<span style="${overdue ? 'color:var(--red);' : ''}">Due ${due}</span>`);
        if (subs.length) bits.push(`${subs.filter(s => s.completed).length}/${subs.length} subtasks`);
        if (t.completed && t.completed_at) bits.push(`Done${t.completed_by ? ' by ' + escapeHtml(staffName(t.completed_by)) : ''} ${new Date(t.completed_at).toLocaleDateString('en-AU')}`);
        const tPhotos = photosOf(t.id);
        if (tPhotos.length) bits.push(`${tPhotos.length} photo${tPhotos.length === 1 ? '' : 's'}`);
        if (t.notes) bits.push('Has notes');
        if (t.recurrence) bits.push(`Repeats ${t.recurrence}`);
        if (t.schedule_assignment_id) bits.push('On calendar');
        if (t.required_before_scheduling && !t.completed) bits.push('<span style="color:var(--red);">Required before scheduling</span>');
        const open = jtExpanded.has(t.id);
        return `
          <div class="jt-item ${isSub ? 'sub' : ''} ${t.completed ? 'done' : ''}" data-id="${t.id}">
            <div class="jt-row">
              <label class="jt-check-hit" title="${t.completed ? 'Mark as not done' : 'Tick off'}"><input type="checkbox" class="jt-check" data-id="${t.id}" ${t.completed ? 'checked' : ''} /></label>
              <div class="jt-main" data-toggle="${t.id}">
                <div class="jt-title">${escapeHtml(t.description)}</div>
                ${bits.length ? `<div class="jt-meta">${bits.join(' &middot; ')}</div>` : ''}
              </div>
              <button type="button" class="jt-star ${t.starred ? 'on' : ''}" data-act="star" data-id="${t.id}" title="${t.starred ? 'Remove star' : 'Star this task'}">${t.starred ? '&#9733;' : '&#9734;'}</button>
            </div>
            ${open ? `
              <div class="jt-detail">
                <div><label>Task</label><input class="jt-title-edit" data-id="${t.id}" value="${escapeHtml(t.description)}" /></div>
                <div><label>Notes</label><textarea class="jt-notes" data-id="${t.id}" placeholder="Add details...">${escapeHtml(t.notes || '')}</textarea></div>
                <div class="jt-detail-row">
                  <div><label>Assigned to</label><select class="jt-assign" data-id="${t.id}">
                    <option value="">${t.assigned_to_role && !t.assigned_to_user_id ? 'Anyone in ' + escapeHtml(t.assigned_to_role) : 'Unassigned'}</option>
                    ${staff.filter(s => s.active !== false || s.id === t.assigned_to_user_id).sort((a, b) => String(a.full_name).localeCompare(String(b.full_name))).map(s => `<option value="${s.id}" ${s.id === t.assigned_to_user_id ? 'selected' : ''}>${escapeHtml(s.full_name || 'Unnamed')}</option>`).join('')}
                  </select></div>
                  <div><label>Due date</label><input type="date" class="jt-due" data-id="${t.id}" value="${t.due_date || ''}" /></div>
                </div>
                <div><label>Photos</label>
                  ${tPhotos.length ? `<div class="jt-photos">${tPhotos.map(p => isVideoUrl(p.url)
                    ? `<a href="${escapeHtml(p.url)}" target="_blank" rel="noopener" class="jt-photo jt-video">&#9654;</a>`
                    : `<img src="${supaImageVariant(p.url, 200, 60)}" class="jt-photo" data-act="task-photo-view" data-id="${t.id}" data-url="${escapeHtml(p.url)}" alt="" />`).join('')}</div>` : ''}
                  <label class="secondary jt-photo-btn" style="display:inline-block; margin-top:4px; cursor:pointer;">&#128247; Add photo<input type="file" accept="image/*" multiple class="jt-photo-input" data-id="${t.id}" style="display:none;" /></label>
                </div>
                ${(() => {
                  // Move: a subtask to another task (or out on its own); a
                  // task with no subtasks of its own under another task.
                  if (!isSub && subs.length) return '';
                  const targets = tasks.filter(x => !x.parent_task_id && x.id !== t.id && x.id !== t.parent_task_id).sort(jtSort);
                  if (!targets.length && !isSub) return '';
                  return `<div><label>${isSub ? 'Move to another task' : 'Make it a subtask of'}</label><select class="jt-move" data-id="${t.id}">
                    <option value="">${isSub ? 'Keep where it is' : 'Choose a task...'}</option>
                    ${isSub ? '<option value="__top">Make it its own task</option>' : ''}
                    ${targets.map(x => `<option value="${x.id}">${escapeHtml(x.description)}${x.completed ? ' (done)' : ''}</option>`).join('')}
                  </select></div>`;
                })()}
                ${!isSub ? `<div><label>Subtasks</label>
                  <input class="jt-sub-add" data-parent="${t.id}" placeholder="Add a subtask and press Enter" style="margin-top:4px;" /></div>` : ''}
                <div class="jt-actions">
                  <button type="button" class="secondary" data-act="up" data-id="${t.id}">Move up</button>
                  <button type="button" class="secondary" data-act="down" data-id="${t.id}">Move down</button>
                  <button type="button" class="secondary" data-act="delete" data-id="${t.id}">Delete</button>
                </div>
              </div>` : ''}
            ${subs.map(s => itemHtml(s, true)).join('')}
          </div>`;
      }

      return JT_GROUPS.map(g => {
        const tops = tasks.filter(t => !t.parent_task_id && jtGroupOf(t) === g.key);
        const openTops = tops.filter(t => !t.completed).sort(jtSort);
        const doneTops = tops.filter(t => t.completed).sort((a, b) => String(b.completed_at || '').localeCompare(String(a.completed_at || '')));
        const showDone = jtDoneOpen.has(g.key);
        return `
          <div class="jt-group" data-group="${g.key}">
            <h3>${g.label}</h3>
            <input class="jt-quick" data-type="${g.key}" placeholder="+ Add a task and press Enter" />
            ${openTops.map(t => itemHtml(t, false)).join('') || (doneTops.length ? '<p class="subtitle" style="margin:4px 0;">All done.</p>' : '<p class="subtitle" style="margin:4px 0;">None.</p>')}
            ${doneTops.length ? `
              <button type="button" class="jt-done-toggle" data-act="toggle-done" data-group="${g.key}">${showDone ? '&#9662;' : '&#9656;'} Completed (${doneTops.length})</button>
              ${showDone ? doneTops.map(t => itemHtml(t, false)).join('') : ''}` : ''}
          </div>`;
      }).join('');
    }

    function bindJobTaskEvents(listEl) {
      if (listEl._jtBound) return;
      listEl._jtBound = true;
      const state = () => listEl._jt;
      const find = (id) => state().tasks.find(t => t.id === id);
      const reload = (focus) => loadJobTasks(state().projectId, focus);
      const save = async (id, fields) => {
        try {
          const { error } = await supabaseClient.from('job_tasks').update(fields).eq('id', id);
          return error || null;
        } catch (err) { return err; }
      };
      // Saves for one task run in order, so a quick tick then untick land in order.
      const chains = new Map();
      const queued = (id, fn) => {
        const p = (chains.get(id) || Promise.resolve()).then(fn, fn);
        chains.set(id, p);
        return p;
      };
      const patch = async (id, fields) => {
        const err = await save(id, fields);
        if (err) jtShowError(listEl, id, 'Could not save that: ' + friendlyError(err));
        return !err;
      };
      // Change on screen first, save in the background, flip back with a note if the save fails.
      async function optimistic(t, fields, failText, rowOnly) {
        const before = {};
        Object.keys(fields).forEach(k => { before[k] = t[k]; });
        Object.assign(t, fields);
        const redraw = () => (rowOnly ? jtRefreshRow(listEl, t.id) : renderJobTasks(listEl));
        redraw();
        const err = await queued(t.id, () => save(t.id, fields));
        if (err) {
          Object.assign(t, before);
          redraw();
          jtShowError(listEl, t.id, failText + ': ' + friendlyError(err));
        }
        return !err;
      }

      async function setCompleted(t, done) {
        const { projectId, tasks, userId } = state();
        const fields = done ? { completed: true, completed_by: userId, completed_at: new Date().toISOString() } : { completed: false, completed_by: null, completed_at: null };
        // A task is only done once every subtask is ticked (the database
        // enforces this too, for every other place tasks get ticked).
        const openSubs = done && !t.parent_task_id ? tasks.filter(x => x.parent_task_id === t.id && !x.completed) : [];
        if (openSubs.length) {
          jtExpanded.add(t.id);
          renderJobTasks(listEl);
          jtShowError(listEl, t.id, `Tick off its ${openSubs.length} open subtask${openSubs.length === 1 ? '' : 's'} first.`);
          return;
        }
        // Reopening a subtask reopens its ticked parent too.
        const parent = !done && t.parent_task_id ? tasks.find(p => p.id === t.parent_task_id && p.completed) : null;
        const snap = (x) => ({ completed: x.completed, completed_by: x.completed_by, completed_at: x.completed_at });
        const tBefore = snap(t), parentBefore = parent ? snap(parent) : null;
        Object.assign(t, fields);
        if (parent) Object.assign(parent, fields);
        renderJobTasks(listEl);
        const err = await queued(t.id, () => save(t.id, fields));
        if (err) {
          Object.assign(t, tBefore);
          if (parent) Object.assign(parent, parentBefore);
          renderJobTasks(listEl);
          jtShowError(listEl, t.id, (done ? 'Could not tick that off: ' : 'Could not reopen that: ') + friendlyError(err));
          return;
        }
        if (parent) {
          const err2 = await queued(parent.id, () => save(parent.id, fields));
          if (err2) {
            Object.assign(parent, parentBefore);
            renderJobTasks(listEl);
            jtShowError(listEl, parent.id, 'Could not reopen the main task: ' + friendlyError(err2));
          }
        }
        // Follow-ups (activity log, scheduling gate, handover advance) run without holding the screen.
        (async () => {
          try {
            await logActivity('project', projectId, done ? 'task_completed' : 'task_reopened', `Task ${done ? 'completed' : 'reopened'}: ${t.description || ''}`);
            const top = t.parent_task_id ? tasks.find(p => p.id === t.parent_task_id) : t;
            if (top && top.required_before_scheduling) await refreshPipelineTaskGate(projectId);
            if (done && top && top.task_type === 'handover') await checkAndAdvanceHandover(projectId);
            // The header badge follows a stage move (Awaiting Our Action to Ready to Book, handover)
            const badge = document.getElementById('pipeline-stage-badge');
            if (badge) {
              const { data: p } = await supabaseClient.from('projects').select('pipeline_stage').eq('id', projectId).maybeSingle();
              if (p && p.pipeline_stage) badge.textContent = pipelineStageLabel(p.pipeline_stage);
            }
          } catch (e) { console.error('Task follow-up failed:', e); }
        })();
      }

      async function addTask(description, groupKey, parentId) {
        const { projectId, tasks, userId } = state();
        const parent = parentId ? find(parentId) : null;
        const siblings = tasks.filter(t => (t.parent_task_id || null) === (parentId || null) && (parent || jtGroupOf(t) === groupKey));
        // Tasks made before ordering existed have no position yet - number
        // them in their current order first so a new one lands at the bottom.
        const ordered = siblings.slice().sort(jtSort);
        if (ordered.some(t => t.sort_order == null)) {
          await Promise.all(ordered.map((t, n) => supabaseClient.from('job_tasks').update({ sort_order: n + 1 }).eq('id', t.id)));
          ordered.forEach((t, n) => { t.sort_order = n + 1; });
        }
        const max = ordered.reduce((m, t) => Math.max(m, t.sort_order ?? 0), 0);
        const { error } = await supabaseClient.from('job_tasks').insert({
          project_id: projectId, description, task_type: parent ? parent.task_type : groupKey,
          parent_task_id: parentId || null, sort_order: max + 1, created_by: userId,
        });
        if (error) throw error;
        if (!parentId) await logActivity('project', projectId, 'task_added', `Task added: ${description}`);
        if (parentId) jtExpanded.add(parentId);
        await reload(parentId ? `.jt-sub-add[data-parent="${parentId}"]` : `.jt-quick[data-type="${groupKey}"]`);
        return true;
      }

      async function move(t, dir) {
        const { tasks } = state();
        const sibs = tasks.filter(x => (x.parent_task_id || null) === (t.parent_task_id || null) && !x.completed && (t.parent_task_id || jtGroupOf(x) === jtGroupOf(t))).sort(jtSort);
        const i = sibs.findIndex(x => x.id === t.id), j = i + dir;
        if (i < 0 || j < 0 || j >= sibs.length) return;
        [sibs[i], sibs[j]] = [sibs[j], sibs[i]];
        // starred tasks always float to the top, so only reorder within that tier
        await Promise.all(sibs.map((x, n) => (x.sort_order === n + 1 ? null : supabaseClient.from('job_tasks').update({ sort_order: n + 1 }).eq('id', x.id))));
        await reload();
      }

      listEl.addEventListener('click', async (e) => {
        const actEl = e.target.closest('[data-act]');
        if (actEl) {
          const act = actEl.dataset.act;
          if (act === 'task-photo-view') {
            const pics = state().photos.filter(p => p.task_id === actEl.dataset.id && !isVideoUrl(p.url)).map(p => p.url);
            openPhotoLightbox(pics, Math.max(0, pics.indexOf(actEl.dataset.url)));
            return;
          }
          if (act === 'toggle-done') {
            const g = actEl.dataset.group;
            if (jtDoneOpen.has(g)) jtDoneOpen.delete(g); else jtDoneOpen.add(g);
            renderJobTasks(listEl);
            return;
          }
          const t = find(actEl.dataset.id);
          if (!t) return;
          if (act === 'star') await optimistic(t, { starred: !t.starred }, 'Could not star that');
          else if (act === 'up') await move(t, -1);
          else if (act === 'down') await move(t, 1);
          else if (act === 'delete') {
            const subs = state().tasks.filter(x => x.parent_task_id === t.id).length;
            if (!confirm(subs ? `Delete this task and its ${subs} subtask${subs === 1 ? '' : 's'}?` : 'Delete this task?')) return;
            const { error } = await supabaseClient.from('job_tasks').delete().eq('id', t.id);
            if (error) { jtShowError(listEl, t.id, 'Could not delete that: ' + friendlyError(error)); return; }
            jtExpanded.delete(t.id);
            if (t.required_before_scheduling) await refreshPipelineTaskGate(state().projectId);
            await logActivity('project', state().projectId, 'task_deleted', `Task deleted: ${t.description || ''}`);
            await reload();
          }
          return;
        }
        const tog = e.target.closest('[data-toggle]');
        if (tog) {
          const id = tog.dataset.toggle;
          if (jtExpanded.has(id)) jtExpanded.delete(id); else jtExpanded.add(id);
          renderJobTasks(listEl);
        }
      });

      listEl.addEventListener('change', async (e) => {
        const el = e.target;
        const t = el.dataset.id ? find(el.dataset.id) : null;
        if (!t) return;
        if (el.classList.contains('jt-photo-input')) {
          // A photo taken from a task is a normal site photo (Photos tab),
          // captioned "#task <task>" and linked back to the task.
          if (!el.files.length) return;
          const label = el.closest('label');
          label.firstChild.textContent = 'Uploading... ';
          try {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const urls = await uploadPhotos(el.files, state().projectId, 'site-photos');
            const { error } = await supabaseClient.from('project_photos').insert(urls.map(url => ({
              project_id: state().projectId, staff_id: user.id, url, task_id: t.id, caption: `#task ${t.description}`.slice(0, 200),
            })));
            if (error) throw error;
            jtExpanded.add(t.id);
            await reload();
          } catch (err) {
            alert('Could not save the photo: ' + friendlyError(err));
            label.firstChild.textContent = 'Add photo ';
          }
          return;
        }
        if (el.classList.contains('jt-check')) await setCompleted(t, el.checked);
        else if (el.classList.contains('jt-assign')) {
          const ok = await optimistic(t, { assigned_to_user_id: el.value || null, assigned_to_role: el.value ? null : t.assigned_to_role }, 'Could not change who it is for', true);
          if (!ok) el.value = t.assigned_to_user_id || '';
        }
        else if (el.classList.contains('jt-due')) {
          const ok = await optimistic(t, { due_date: el.value || null }, 'Could not change the due date', true);
          if (!ok) el.value = t.due_date || '';
        }
        else if (el.classList.contains('jt-move') && el.value) {
          const parentId = el.value === '__top' ? null : el.value;
          const siblings = state().tasks.filter(x => (x.parent_task_id || null) === parentId);
          const fields = { parent_task_id: parentId, sort_order: Math.max(0, ...siblings.map(x => x.sort_order || 0)) + 1 };
          // Out on its own it lands in the old parent's group (pre-job, on site...).
          if (!parentId) { const old = find(t.parent_task_id); if (old) fields.task_type = old.task_type; }
          if (await patch(t.id, fields)) {
            if (parentId) jtExpanded.add(parentId);
            jtExpanded.delete(t.id);
            await reload();
          }
        }
      });

      listEl.addEventListener('keydown', async (e) => {
        if (e.key !== 'Enter' || e.isComposing) return;
        const el = e.target;
        if (el.classList.contains('jt-quick') || el.classList.contains('jt-sub-add')) {
          e.preventDefault();
          const text = el.value.trim();
          if (!text) return;
          if (el.disabled) return;
          el.disabled = true;
          let ok = false;
          try {
            ok = await addTask(text, el.dataset.type, el.dataset.parent || null);
          } catch (err) {
            jtShowError(listEl, el, 'Could not add that: ' + friendlyError(err));
          } finally {
            // On success the list reloads (new empty box, focused); on failure this box keeps its text.
            if (el.isConnected) { el.disabled = false; if (!ok) el.focus(); }
          }
        } else if (el.classList.contains('jt-title-edit')) { e.preventDefault(); el.blur(); }
      });

      // Notes / title save when you click away, without re-rendering (which
      // would swallow whatever you clicked on next).
      listEl.addEventListener('focusout', async (e) => {
        const el = e.target;
        const t = el.dataset && el.dataset.id ? find(el.dataset.id) : null;
        if (!t) return;
        if (el.classList.contains('jt-notes')) {
          const v = el.value.trim() || null;
          if (v !== (t.notes || null) && await patch(t.id, { notes: v })) t.notes = v;
        } else if (el.classList.contains('jt-title-edit')) {
          const v = el.value.trim();
          if (!v) { el.value = t.description; return; }
          if (v !== t.description && await patch(t.id, { description: v })) {
            t.description = v;
            const titleEl = listEl.querySelector(`.jt-item[data-id="${t.id}"] .jt-title`);
            if (titleEl) titleEl.textContent = v;
          }
        }
      });
    }

      function refreshCalendarRowVisibility() {

        const hasDate = !!overlay.querySelector('#at-due-date').value;
        overlay.querySelector('#at-calendar-row').style.display = (assignType === 'person' && hasDate) ? 'flex' : 'none';
        if (!(assignType === 'person' && hasDate)) overlay.querySelector('#at-add-to-calendar').checked = false;

        overlay.querySelector('#at-recurrence-section').style.display = checked ? 'block' : 'none';

          ? 'Set a due date above - the next occurrence is created that many days/weeks/months after it.' : '';
      }
      overlay.querySelector('#at-recurring').addEventListener('change', refreshRecurrenceHint);
      overlay.querySelector('#at-due-date').addEventListener('input', refreshRecurrenceHint);

      overlay.querySelector('#at-save-btn').addEventListener('click', async () => {

          msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;

    // The "Cost allocated" stat's accrued labour figure is a sum of real
    // clocked time - this lets whoever can see that stat drill into the
    // timesheet entries behind it, and (admin only) correct which stage
    // an entry's hours are attributed to, or reclassify it as office/
    // training/other time entirely.
    async function openTimesheetDrilldown(project, pricingVisible) {
      const centres = (project.cost_centres || []).slice().sort((a, b) => a.sort_order - b.sort_order);
      const myRole = await getMyRole();
      const isAdmin = myRole === 'admin';
      // Itemised per-entry cost is narrower than pricingVisible (Admin/
      // Finance/Sales) - dividing one entry's cost by its hours is
      // functionally the same as reading that employee's pay rate, which
      // stays Admin/Finance only, not Sales.
      const isFinanceOrAdmin = myRole === 'admin' || myRole === 'finance';
      const colCount = 4 + (isFinanceOrAdmin ? 1 : 0) + (isAdmin ? 1 : 0);

      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:720px; width:100%; max-height:85vh; overflow-y:auto;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <h2 style="margin:0;">Accrued cost on this job</h2>
            <button type="button" class="secondary" id="td-close-btn">Close</button>
          </div>
          <p class="subtitle" style="margin-bottom:14px;">${isAdmin ? 'As admin you can correct which stage an entry belongs to, or move it to office/non-job time.' : 'Read-only - admins can edit the cost centre / office time split.'}</p>
          <div id="td-msg"></div>
          <h3 style="margin-bottom:8px;">Timesheets</h3>
          <div id="td-list"><p class="subtitle">Loading...</p></div>
          <h3 style="margin:22px 0 8px;">Purchase orders received</h3>
          <div id="td-po-list"><p class="subtitle">Loading...</p></div>
        </div>`;
      document.body.appendChild(overlay);
      overlay.querySelector('#td-close-btn').addEventListener('click', () => overlay.remove());

      const centreName = (id) => centres.find(c => c.id === id)?.name || 'Unknown stage';
      const stageLabel = (entry) => {
        if (entry.time_category && entry.time_category !== 'job') {
          return timeCategoryLabel(entry.time_category);
        }
        const ids = (entry.selected_cost_centre_ids && entry.selected_cost_centre_ids.length)
          ? entry.selected_cost_centre_ids
          : (entry.cost_centre_id ? [entry.cost_centre_id] : []);
        return ids.length ? ids.map(centreName).join(', ') : 'Unassigned';
      };
      const hoursFor = (entry) => entry.clock_out
        ? Math.round(((new Date(entry.clock_out) - new Date(entry.clock_in)) / 3600000) * 100) / 100
        : null;

      async function refreshList() {
        const listEl = overlay.querySelector('#td-list');
        const { data: entries, error } = await supabaseClient
          .from('time_entries')
          .select('id, staff_id, clock_in, clock_out, cost_centre_id, selected_cost_centre_ids, time_category, sm8_activity_uuid, profiles(full_name)')
          .eq('project_id', project.id)
          .order('clock_in', { ascending: false });
        if (error) { listEl.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(error))}</div>`; return; }
        if (!entries.length) { listEl.innerHTML = `<p class="subtitle">No timesheet entries logged against this job yet.</p>`; return; }

        let costById = new Map();
        let indirectById = new Map();
        if (isFinanceOrAdmin) {
          try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const res = await fetch('/.netlify/functions/get-itemised-labour-cost', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
              body: JSON.stringify({ projectId: project.id }),
            });
            const data = await res.json();
            if (res.ok && data.ok) {
              costById = new Map(Object.entries(data.costByEntryId));
              indirectById = new Map(Object.entries(data.indirectByEntryId || {}));
            }
          } catch (err) {
            console.error('Itemised labour cost fetch failed:', err.message);
          }
        }
        // Sum only THIS project's entries, not every value in costById - it
        // also holds cost for the same employee's entries on OTHER jobs
        // during the same pay week (needed server-side to band overtime
        // correctly), which would otherwise inflate this total past what
        // the rows above it actually show.
        const totalCost = entries.reduce((s, e) => s + (costById.get(e.id) || 0), 0);
        const totalIndirect = entries.reduce((s, e) => s + (indirectById.get(e.id) || 0), 0);

        listEl.innerHTML = `
          <table class="responsive-stack">
            <thead><tr><th>Staff</th><th>Date</th><th class="num">Hours</th><th>Stage / category</th>${isFinanceOrAdmin ? '<th class="num">Cost</th>' : ''}${isAdmin ? '<th></th>' : ''}</tr></thead>
            <tbody>
              ${entries.map(e => {
                const hrs = hoursFor(e);
                const cost = costById.get(e.id);
                return `
                <tr data-entry-id="${e.id}">
                  <td data-label="Staff">${escapeHtml(e.profiles?.full_name || 'Unknown')}</td>
                  <td data-label="Date">${new Date(e.clock_in).toLocaleDateString()}</td>
                  <td class="num" data-label="Hours">${hrs === null ? 'In progress' : hrs.toFixed(2)}</td>
                  <td data-label="Stage / category">${stageLabel(e)}${e.sm8_activity_uuid ? ' <span class="subtitle">(ServiceM8, already paid)</span>' : ''}</td>
                  ${isFinanceOrAdmin ? `<td class="num" data-label="Cost">${cost === undefined ? '-' : money(cost)}</td>` : ''}
                  ${isAdmin ? `<td><button type="button" class="secondary td-edit-btn" data-id="${e.id}" style="font-size:12px; padding:4px 8px;">Edit</button></td>` : ''}
                </tr>
                <tr class="td-edit-row" data-edit-for="${e.id}" style="display:none;"><td colspan="${colCount}"></td></tr>`;
              }).join('')}
            </tbody>
            ${isFinanceOrAdmin ? `<tfoot><tr><td colspan="${colCount - 1 - (isAdmin ? 1 : 0)}" style="text-align:right; font-weight:600;">Total labour cost (wages + direct overheads)</td><td class="num" style="font-weight:600;">${money(totalCost)}</td>${isAdmin ? '<td></td>' : ''}</tr><tr><td colspan="${colCount - 1 - (isAdmin ? 1 : 0)}" class="subtitle" style="text-align:right;">incl. overheads</td><td class="num subtitle">${money(totalCost + totalIndirect)}</td>${isAdmin ? '<td></td>' : ''}</tr></tfoot>` : ''}
          </table>`;

        if (!isAdmin) return;
        listEl.querySelectorAll('.td-edit-btn').forEach(btn => {

            const entry = entries.find(e => e.id === btn.dataset.id);

      }

      async function refreshPoList() {
        const listEl = overlay.querySelector('#td-po-list');

        listEl.innerHTML = `

            <tbody>
              ${receivedRows.map(li => `
                <tr>
                  <td data-label="Item">${escapeHtml(li.description)}${li.poNumber ? ` <span class="subtitle" style="font-size:11px;">(${escapeHtml(li.poNumber)})</span>` : ''}</td>
                  <td data-label="Supplier">${escapeHtml(li.supplierLabel)}</td>
                  <td data-label="Stage">${escapeHtml(li.stage)}</td>
                  <td class="num" data-label="Qty">${li.quantity}</td>
                  <td class="num" data-label="Unit cost">${money(li.unit_cost)}</td>
                  <td class="num" data-label="Total">${money(Number(li.quantity) * Number(li.unit_cost))}</td>
                </tr>`).join('')}
            </tbody>
            <tfoot><tr><td colspan="5" style="text-align:right; font-weight:600;">Total received materials cost</td><td class="num" style="font-weight:600;">${money(totalMaterial)}</td></tr></tfoot>
          </table>`;

      function openEditRow(entry) {
        const editCell = overlay.querySelector(`tr[data-edit-for="${entry.id}"] td`);
        const selectedIds = (entry.selected_cost_centre_ids && entry.selected_cost_centre_ids.length)
          ? entry.selected_cost_centre_ids
          : (entry.cost_centre_id ? [entry.cost_centre_id] : []);
        const category = entry.time_category && entry.time_category !== 'job' ? entry.time_category : 'job';

        editCell.innerHTML = `
          <div style="padding:10px; background:var(--surface-2); border-radius:8px;">
            <label style="margin-top:0;">Category</label>
            <select class="td-category">
              <option value="job" ${category === 'job' ? 'selected' : ''}>Job - split across stage(s) below</option>
              ${timeCategoryOptionsHtml(category)}
            </select>
            <div class="td-stage-section" style="margin-top:8px; ${category === 'job' ? '' : 'display:none;'}">
              <label>Stage(s) - tick every stage this entry's hours count against</label>
              ${centres.map(c => `
                <label style="display:flex; align-items:center; gap:8px; font-weight:400; margin-top:6px;">
                  <input type="checkbox" class="td-stage-check" value="${c.id}" style="width:auto;" ${selectedIds.includes(c.id) ? 'checked' : ''} />
                  ${escapeHtml(c.name)}
                </label>`).join('')}
            </div>
            <div style="margin-top:12px;">
              <button type="button" class="td-save-btn">Save</button>
              <button type="button" class="secondary td-cancel-btn">Cancel</button>
            </div>
            <div class="td-edit-msg"></div>
          </div>`;
        editCell.closest('tr').style.display = 'table-row';

        editCell.querySelector('.td-category').addEventListener('change', (e) => {
          editCell.querySelector('.td-stage-section').style.display = e.target.value === 'job' ? '' : 'none';
        });
        editCell.querySelector('.td-cancel-btn').addEventListener('click', () => {
          editCell.closest('tr').style.display = 'none';
          editCell.innerHTML = '';
        });
        editCell.querySelector('.td-save-btn').addEventListener('click', async () => {
          const msg = editCell.querySelector('.td-edit-msg');
          const newCategory = editCell.querySelector('.td-category').value;
          const checkedIds = Array.from(editCell.querySelectorAll('.td-stage-check:checked')).map(el => el.value);
          if (newCategory === 'job' && !checkedIds.length) {
            msg.innerHTML = `<div class="error-box">Tick at least one stage, or choose a non-job category.</div>`;
            return;
          }
          try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const res = await fetch('/.netlify/functions/admin-update-time-entry', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
              body: JSON.stringify({
                entryId: entry.id,
                project_id: newCategory === 'job' ? project.id : null,
                cost_centre_id: newCategory === 'job' && checkedIds.length === 1 ? checkedIds[0] : null,
                selected_cost_centre_ids: newCategory === 'job' && checkedIds.length > 1 ? checkedIds : null,
                time_category: newCategory,
              }),
            });
            const data = await res.json();
            if (!res.ok || !data.ok) throw new Error(data.error || 'Update failed');

            await refreshList();
            const refreshed = await loadProject();
            if (refreshed) render(refreshed, pricingVisible);
          } catch (err) {
            msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
          }
        });
      }

      await Promise.all([refreshList(), refreshPoList()]);
    }

    function isPdfDoc(d) {
      return (d.mime_type || '') === 'application/pdf' || /.pdf$/i.test(d.file_name || '');
    }

    // Item 104: a list loader that is already running is never started a second time
    // alongside itself (the tab opening and a save can both ask at once). A call made
    // meanwhile waits and then runs once more, so it still sees the latest folder and files.
    function singleFlight(fn) {
      let running = null, queued = null;
      const start = (args) => {
        running = (async () => {
          try { return await fn(...args); } finally {
            running = null;
            if (queued) { const q = queued; queued = null; start(q.args).then(q.resolve, q.reject); }
          }
        })();
        return running;
      };
      return (...args) => {
        if (!running) return start(args);
        if (!queued) {
          queued = { args };
          queued.promise = new Promise((resolve, reject) => { queued.resolve = resolve; queued.reject = reject; });
        } else queued.args = args;
        return queued.promise;
      };
    }

    // Item 98: signs a whole list of private files in one request. Returns { path: url };
    // a file that could not be signed is simply missing from it.
    async function signDocUrls(paths, expiresIn = 300) {
      const map = {};
      if (!paths.length) return map;
      const { data, error } = await supabaseClient.storage.from('project-documents').createSignedUrls(paths, expiresIn);
      if (error) return map;
      (data || []).forEach(r => { if (r.signedUrl && !r.error) map[r.path] = r.signedUrl; });
      return map;
    }

    // A small resized copy of a private picture for a tile (300px box, keeps its shape).
    function signDocThumbUrl(path, expiresIn) {
      return supabaseClient.storage.from('project-documents')
        .createSignedUrl(path, expiresIn, { transform: { width: 300, height: 300, resize: 'contain', quality: 70 } })
        .then(({ data }) => data?.signedUrl || null, () => null);
    }

    function loadDocuments(projectId) {
      return (loadDocuments.flight ||= singleFlight(loadDocumentsNow))(projectId);
    }

    async function loadDocumentsNow(projectId) {
      const listEl = document.getElementById('documents-list');
      if (!listEl) return;
      const pillsEl = document.getElementById('doc-folder-pills');
      const folderSelect = document.getElementById('doc-folder-select');

      const { data: docs, error } = await supabaseClient
        .from('project_documents')
        .select('*, profiles(full_name)')
        .eq('project_id', projectId)
        .neq('folder', SM8_INVOICE_FOLDER) // shown on the Invoices tab
        .order('created_at', { ascending: false });
      if (error) { listEl.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(error))}</div>`; return; }
      // Only the uploader, or Admin and Finance, get a Delete button (files the server made have no uploader).
      const [myRole, { data: { session } }] = await Promise.all([getMyRole(), supabaseClient.auth.getSession()]);
      const myId = session?.user?.id;
      const canDeleteDoc = (d) => isFinanceRole(myRole) || (!!myId && d.uploaded_by === myId);

      // "Plans" exists on every job and quote, even before anything's been
      // uploaded to it - it's where the builder's plans go, and where the
      // electrical plan pages made from them are saved.
      const folders = [...new Set(['Plans', ...(docs || []).map(d => d.folder)])]
        .sort((a, b) => (a === 'Plans' ? -1 : b === 'Plans' ? 1 : a.localeCompare(b)));
      const folderOptions = ['Plans', 'General', ...folders.filter(f => f !== 'Plans' && f !== 'General')];
      folderSelect.innerHTML = folderOptions.map(f => `<option value="${escapeHtml(f)}">${escapeHtml(f)}</option>`).join('');
      folderSelect.value = folderOptions.includes(selectedDocFolder) ? selectedDocFolder : 'General';

      pillsEl.innerHTML = ['All', ...folders].map(f => `
        <button type="button" class="secondary doc-folder-pill" data-folder="${escapeHtml(f)}" style="font-size:12px; padding:6px 12px; ${f === selectedDocFolder ? 'background:var(--accent-dim); color:var(--accent);' : ''}">${escapeHtml(f)}</button>
      `).join('');
      pillsEl.querySelectorAll('.doc-folder-pill').forEach(btn => {
        btn.addEventListener('click', () => { selectedDocFolder = btn.dataset.folder; loadDocuments(projectId); });
      });

      const visible = selectedDocFolder === 'All' ? (docs || []) : (docs || []).filter(d => d.folder === selectedDocFolder);
      if (!visible.length) {
        listEl.innerHTML = selectedDocFolder === 'Plans'
          ? `<p class="subtitle">No plans yet. Upload the builder's plans here, then open one and use "Copy page into plan pages" to make lighting, power and cable path pages to mark up with electrical symbols.</p>`
          : `<p class="subtitle">No documents${selectedDocFolder === 'All' ? '' : ' in this folder'} yet.</p>`;
        return;
      }

      listEl.innerHTML = `<p class="subtitle">Loading previews...</p>`;

      // Grid preview instead of a bare filename list - a private bucket
      // needs a signed URL per file to actually show a thumbnail. Item 98:
      // the whole list is signed in one request, and picture tiles get a
      // small resized copy instead of the full-size original. The links last
      // an hour so tiles further down still load when scrolled to.
      const isImageDoc = (d) => (d.mime_type || '').startsWith('image/');
      const [signedByPath, thumbUrls] = await Promise.all([
        signDocUrls(visible.map(d => d.file_path), 3600),
        Promise.all(visible.map(d => isImageDoc(d) ? signDocThumbUrl(d.file_path, 3600) : null)),
      ]);
      const signedUrls = visible.map(d => signedByPath[d.file_path] || null);

      listEl.innerHTML = `
        <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:12px;">
          ${visible.map((d, i) => {
            const url = signedUrls[i];
            const isImage = isImageDoc(d);
            const isVideo = (d.mime_type || '').startsWith('video/');
            const isPdf = isPdfDoc(d);
            const preview = isImage && (thumbUrls[i] || url)
              ? `<img src="${escapeHtml(thumbUrls[i] || url)}"${url ? ` data-full="${escapeHtml(url)}"` : ''} loading="lazy" decoding="async" style="width:100%; height:110px; object-fit:cover; border-radius:8px 8px 0 0;" />`
              : isVideo && url
                ? `<video src="${escapeHtml(url)}" muted preload="metadata" style="width:100%; height:110px; object-fit:cover; border-radius:8px 8px 0 0; background:#000;"></video>`
                : isPdf
                  ? `<div class="doc-pdf-thumb" data-path="${escapeHtml(d.file_path)}"${url ? ` data-url="${escapeHtml(url)}"` : ''} style="width:100%; height:110px; border-radius:8px 8px 0 0; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:32px; overflow:hidden;">&#128196;</div>`
                  : `<div style="width:100%; height:110px; border-radius:8px 8px 0 0; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:32px;">&#128196;</div>`;
            return `
              <div class="doc-tile" style="border:1px solid var(--border); border-radius:8px; overflow:hidden;">
                <a href="#" class="doc-view-link" data-path="${escapeHtml(d.file_path)}" style="display:block;">${preview}</a>
                <div style="padding:8px;">
                  <a href="#" class="link-quiet doc-view-link" data-path="${escapeHtml(d.file_path)}" style="font-weight:600; font-size:12px; word-break:break-word;">${escapeHtml(d.file_name)}</a>
                  <p class="subtitle" style="margin:4px 0 0; font-size:11px;">${escapeHtml(d.profiles?.full_name || 'Someone')} &middot; ${new Date(d.created_at).toLocaleDateString('en-AU')}</p>
                  ${canDeleteDoc(d) ? `<div class="doc-del-wrap" data-id="${escapeHtml(d.id)}" style="margin-top:6px;"></div>` : ''}
                </div>
              </div>`;
          }).join('')}
        </div>`;
      // A picture the resizer cannot handle falls back to the full-size file.
      // A link that expired while the tab sat open (lazy tiles load late) is signed again.
      listEl.querySelectorAll('img[data-full]').forEach(img => img.addEventListener('error', () => {
        const p = img.closest('.doc-tile')?.querySelector('.doc-view-link')?.dataset.path;
        if (p) signDocThumbUrl(p, 3600).then(u => { img.src = u || img.dataset.full; }).catch(() => { img.src = img.dataset.full; });
        else if (img.src !== img.dataset.full) img.src = img.dataset.full;
      }, { once: true }));

      // PDFs show their first page like a photo, filled in after the grid
      // is up so one slow PDF never holds the rest of the tab back. They
      // reuse the link signed above (item 98).
      (async () => {
        for (const thumb of listEl.querySelectorAll('.doc-pdf-thumb')) {
          try {
            const url = thumb.dataset.url || await getSignedDocUrl(thumb.dataset.path);
            const dataUrl = await renderPdfThumbnail(url, 360);
            thumb.innerHTML = `<img src="${dataUrl}" style="width:100%; height:100%; object-fit:cover; object-position:top;" />`;
          } catch { /* keep the document icon */ }
        }
      })();

      // PDFs and images open in the in-app viewer (and can be marked up);
      // anything else (Word, Excel...) still opens in a new tab.
      async function saveDocCopy(blob, doc, ext, mime) {
        const { data: { user } } = await supabaseClient.auth.getUser();
        const path = `documents/${projectId}/${Date.now()}-marked-up.${ext}`;
        const { error: upErr } = await supabaseClient.storage.from('project-documents').upload(path, blob, { contentType: mime });
        if (upErr) throw upErr;
        const { error: insErr } = await supabaseClient.from('project_documents').insert({
          project_id: projectId, folder: doc.folder, file_path: path,
          file_name: `${doc.file_name.replace(/.[^.]+$/, '')} (marked up).${ext}`, mime_type: mime, uploaded_by: user.id,
        });
        if (insErr) throw insErr;
      }
      listEl.querySelectorAll('.doc-view-link').forEach(a => {
        a.addEventListener('click', async (e) => {
          e.preventDefault();
          try {
            const doc = visible.find(d => d.file_path === a.dataset.path);
            if (doc && isPdfDoc(doc)) {
              openPdfViewer(doc.file_path, doc.file_name, { projectId, folder: doc.folder, onSaved: () => loadDocuments(projectId) });
              return;
            }
            if (doc && (doc.mime_type || '').startsWith('image/')) {
              const images = visible.filter(isImageDoc);
              const fresh = await signDocUrls(images.map(d => d.file_path));
              // One missing file must not stop the viewer opening
              const imageUrls = await Promise.all(images.map(d => fresh[d.file_path] || getSignedDocUrl(d.file_path).catch(() => '')));
              openPhotoLightbox(imageUrls, images.indexOf(doc), {
                captions: images.map(d => d.file_name),
                onMarkup: async (i, blob) => { await saveDocCopy(blob, images[i], 'jpg', 'image/jpeg'); },
                onClose: () => loadDocuments(projectId),
              });
              return;
            }
            // Tab is opened on the tap itself (no await before it) so iPhone Safari does not block it.
            await openSignedDocInNewTab(a.dataset.path);
          } catch (err) {
            listEl.querySelectorAll('.doc-open-error').forEach(el => el.remove());
            listEl.insertAdjacentHTML('afterbegin', `<div class="error-box doc-open-error">Could not open: ${escapeHtml(friendlyError(err))}</div>`);
          }
        });
      });
      // Delete asks "Really delete? Yes / No" inside the tile instead of a phone popup.
      function showDocDelete(wrap, doc) {
        wrap.innerHTML = `<button type="button" class="secondary doc-delete-btn" style="width:100%; font-size:13px; min-height:40px;">Delete</button>`;
        wrap.querySelector('.doc-delete-btn').addEventListener('click', () => askDocDelete(wrap, doc));
      }
      function askDocDelete(wrap, doc) {
        wrap.innerHTML = `
          <p style="margin:0 0 6px; font-size:12px; font-weight:600;">Really delete?</p>
          <div style="display:flex; gap:6px;">
            <button type="button" class="danger doc-del-yes" style="flex:1; min-height:40px;">Yes</button>
            <button type="button" class="secondary doc-del-no" style="flex:1; min-height:40px;">No</button>
          </div>`;
        const yes = wrap.querySelector('.doc-del-yes'), no = wrap.querySelector('.doc-del-no');
        no.addEventListener('click', () => showDocDelete(wrap, doc));
        yes.addEventListener('click', async () => {
          yes.disabled = true; no.disabled = true; yes.textContent = 'Deleting...';
          wrap.parentElement.querySelectorAll('.doc-del-error').forEach(el => el.remove());
          try {
            // Row first, then the file, so a failure never leaves a tile pointing at a missing file.
            const { data: gone, error: delErr } = await supabaseClient.from('project_documents').delete().eq('id', doc.id).select('id');
            if (delErr) throw delErr;
            if (!gone || !gone.length) throw new Error('Could not delete it. Refresh and try again.');
            await supabaseClient.storage.from('project-documents').remove([doc.file_path]).catch(() => {}); // a leftover file is harmless
            await logActivity('project', projectId, 'document_deleted', `Deleted document ${doc.file_name}`);
            await loadDocuments(projectId);
          } catch (err) {
            wrap.insertAdjacentHTML('afterend', `<div class="error-box doc-del-error" style="font-size:12px; margin-top:6px;">${escapeHtml(friendlyError(err, 'Could not delete it.'))}</div>`);
            showDocDelete(wrap, doc);
          }
        });
      }
      listEl.querySelectorAll('.doc-del-wrap').forEach(w => showDocDelete(w, visible.find(d => d.id === w.dataset.id)));
    }

    // Pricing roles see a note under the Summary cost tiles: "incl. overheads $X". The tile itself is the
    // cash cost plus direct overhead (labour always carries direct overhead, see fetchAccruedLabourCost);
    // the note adds indirect overhead (data-oh-indirect, worked out in render()) and, for Finance and
    // Admin only, company overhead (company_pct of the job's profit, or of its price if the Overheads
    // page is set to price; get_project_overheads returns no rows for anyone else). Deliberately no
    // "net profit" figure on the job page; that lives only on the Overheads page.
    let projectOverheadsPromise = null;
    async function applyOverheadsToCosts(project) {
      const tiles = document.querySelectorAll('[data-oh-cost]');
      const role = await getMyRole();
      if (!tiles.length || !isPricingRole(role)) return;
      let pct = 0, byPrice = false;
      if (isFinanceRole(role)) {
        if (!projectOverheadsPromise) {
          projectOverheadsPromise = supabaseClient.rpc('get_project_overheads', { p_project_id: project.id })
            .then(({ data }) => (Array.isArray(data) ? data[0] : data) || null)
            .catch(() => null);
        }
        const r = await projectOverheadsPromise;
        pct = Number(r?.company_pct) || 0;
        byPrice = r?.company_basis === 'revenue';
      }
      tiles.forEach(tile => {
        const valueEl = tile.querySelector('.value');
        if (!valueEl || !tile.isConnected) return;
        const d = tile.dataset, base = Number(d.ohCost) || 0;
        const indirect = Number(d.ohIndirect) || 0;
        const coCost = (pct / 100) * Math.max(0, Number(byPrice ? d.ohPrice : d.ohProfit) || 0);
        if (!indirect && !coCost) return;
        tile.querySelector('.oh-note')?.remove();
        valueEl.insertAdjacentHTML('afterend', `<div class="subtitle oh-note" style="margin:2px 0 0; font-size:12px;" title="${money(base)} materials, wages and direct overheads + ${money(indirect)} indirect overheads${coCost ? ' + ' + money(coCost) + ' company overhead' : ''}">incl. overheads ${money(base + indirect + coCost)}</div>`);
      });
    }

    // Meetings held about this job (meetings.html), with how many of their
    // follow-up actions are still open. Hidden until there is one, but the
    // "+ Meeting" link is always reachable from the Meetings page.

    async function loadMeetingsCard(project) {
      const el = document.getElementById('meetings-card');
      if (!el) return;
      const { data: ms } = await supabaseClient.from('meetings')
        .select('id, title, meeting_date, job_tasks(id, completed, followed_up_at)')
        .or(`project_id.eq.${project.id},project_ids.cs.{${project.id}}`).order('meeting_date', { ascending: false });
      if (!(ms || []).length) {
        el.innerHTML = `<div class="card"><div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;"><h2 style="margin:0;">Meetings</h2><a href="/meetings.html?new=1&project=${project.id}"><button type="button" class="secondary" style="font-size:12px; padding:6px 10px;">+ Meeting notes</button></a></div></div>`;
        return;
      }
      el.innerHTML = `<div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px;">
          <h2 style="margin:0;">Meetings</h2>
          <a href="/meetings.html?new=1&project=${project.id}"><button type="button" class="secondary" style="font-size:12px; padding:6px 10px;">+ Meeting notes</button></a>
        </div>
        ${ms.map(m => {
          const acts = m.job_tasks || [];
          const open = acts.filter(a => !a.completed || !a.followed_up_at).length;
          return `<div style="display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--border);">
            <a href="/meetings.html?id=${m.id}" class="link-quiet">${escapeHtml(m.title)}</a>
            <span class="subtitle" style="margin:0; white-space:nowrap;">${new Date(m.meeting_date + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })}${open ? ' &middot; <span style="color:#d9a23b;">' + open + ' to follow up</span>' : (acts.length ? ' &middot; all followed up' : '')}</span>
          </div>`;
        }).join('')}
      </div>`;
    }

    // Installed equipment for this job, recorded against the customer so
    // servicing / warranty reminders can go out later. Jobs only.
    function assetPrefillsForJob(project) {
      const text = (v) => (Array.isArray(v) ? v.join('\n') : String(v || ''));
      const base = { client_id: project.client_id || null, client_name: project.client_name, site_address: project.client_address, project_id: project.id, installed_at: assetToday() };
      const pd = project.pylon_data || {};
      const out = [];
      (pd.module_types || []).forEach(m => out.push({ ...base, asset_type: 'solar', name: m.description || 'Solar panels', quantity: m.quantity || m.count || 1, serial_numbers: text(project.panel_serial_numbers) }));
      (pd.inverter_types || []).forEach(m => out.push({ ...base, asset_type: 'inverter', name: m.description || 'Inverter', quantity: m.quantity || m.count || 1, serial_numbers: text(project.inverter_serial_numbers) }));
      (pd.storage_types || []).forEach(m => out.push({ ...base, asset_type: 'battery', name: m.description || 'Battery', quantity: m.quantity || m.count || 1 }));
      if (!out.length) out.push({ ...base, asset_type: project.proposal_template === 'solar' ? 'solar' : 'other', name: project.proposal_template === 'solar' ? 'Solar system' : (project.name || ''), serial_numbers: project.proposal_template === 'solar' ? text(project.panel_serial_numbers) : '' });
      return out;
    }
    async function loadAssetsCard(project) {
      const el = document.getElementById('assets-card');
      if (!el || !project.job_number || typeof openAssetPanel !== 'function') return;
      const { data: assets } = await supabaseClient.from('customer_assets').select('*').eq('project_id', project.id).order('created_at');
      const finished = ['client_handover', 'ready_to_invoice', 'awaiting_payment', 'complete', 'archived'].includes(project.pipeline_stage);
      const refresh = (synced) => {
        if (synced) {
          Object.assign(project, synced);
          const panelEl = document.getElementById('hd-panel-serials');
          if (panelEl && synced.panel_serial_numbers !== undefined) panelEl.value = synced.panel_serial_numbers;
          const invEl = document.getElementById('hd-inverter-serials');
          if (invEl && synced.inverter_serial_numbers !== undefined) invEl.value = synced.inverter_serial_numbers;
          const hdMsg = document.getElementById('hd-save-msg');
          if (hdMsg) hdMsg.innerHTML = `<div class="success-box">Serial numbers updated from Installed equipment.</div>`;
        }
        return loadAssetsCard(project);
      };
      const addFromJob = (e) => {
        const queue = assetPrefillsForJob(project);
        const total = queue.length;
        const next = (trigger) => {
          if (!queue.length) return;
          // A panel is already open or opening (Skip tapped during a save): do not drop the next item
          if ((typeof assetPanelOpening !== 'undefined' && assetPanelOpening) || document.getElementById('asset-panel')) return;
          const prefill = queue.shift();
          openAssetPanel({
            prefill,
            trigger,
            progress: { n: total - queue.length, total },
            onCancel: queue.length ? () => next(trigger) : null,
            onSaved: (synced) => { next(trigger); return refresh(synced); },
          });
        };
        next(e.currentTarget);
      };
      el.innerHTML = `
        <div class="card" ${finished && !(assets || []).length ? 'style="border-color:var(--accent);"' : ''}>
          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px;">
            <h2 style="margin:0;">Installed equipment</h2>
            <div style="display:flex; gap:6px;">
              <button type="button" class="secondary" id="assets-add-blank" style="min-height:44px;">+ Add</button>
              <button type="button" id="assets-add-job" style="min-height:44px;">${(assets || []).length ? 'Add more from this job' : 'Add installed equipment'}</button>
            </div>
          </div>
          ${(assets || []).length ? `
            <table class="responsive-stack">
              <thead><tr><th>Asset</th><th>Warranty</th><th>Next service</th><th></th></tr></thead>
              <tbody>${assets.map(a => `
                <tr>
                  <td data-label="Asset">${escapeHtml(a.name)}${a.quantity > 1 ? ' x' + a.quantity : ''}<div class="subtitle" style="font-size:12px;">${escapeHtml(assetTypeInfo(a.asset_type).label)}${a.make || a.model ? ' &middot; ' + escapeHtml([a.make, a.model].filter(Boolean).join(' ')) : ''}</div></td>
                  <td data-label="Warranty">${assetDateBadge(a.warranty_expires, 'warranty')}</td>
                  <td data-label="Next service">${a.service_interval_months ? assetDateBadge(a.next_service_due, 'service') : '<span class="subtitle">-</span>'}</td>
                  <td data-label=""><button type="button" class="secondary job-asset-edit" data-id="${a.id}" style="font-size:12px; padding:5px 10px;">Edit</button></td>
                </tr>`).join('')}</tbody>
            </table>` : `<p class="subtitle" style="margin:0;">Nothing recorded yet. Add what was installed (with serial numbers and warranty) so we can remind ${escapeHtml(project.client_name || 'the customer')} when a service is due or the warranty is running out.</p>`}
        </div>`;
      document.getElementById('assets-add-blank').addEventListener('click', (e) => openAssetPanel({ prefill: { client_id: project.client_id || null, client_name: project.client_name, site_address: project.client_address, project_id: project.id, installed_at: assetToday() }, trigger: e.currentTarget, onSaved: refresh }));
      document.getElementById('assets-add-job').addEventListener('click', addFromJob);
      el.querySelectorAll('.job-asset-edit').forEach(b => b.addEventListener('click', (e) => openAssetPanel({ asset: assets.find(a => a.id === b.dataset.id), trigger: e.currentTarget, onSaved: refresh })));
    }

    // Per-job log of out-of-scope work (job_variation_entries), two kinds:
    //  - Do and charge: logged by anyone. It has its own stage, so the team clocks
    //    time to it on My Day; they also add Stock materials as they use them (and
    //    can log hours by hand). Pricing roles add it to an invoice - the "Invoice
    //    project" panel prices it (bill-variations.js) - or mark it No charge.
    //  - Fixed price: pricing roles quote it, email it to the client with the
    //    original quote, the client signs it online (quote.html?variation=...), and
    //    it is then added to the job as a stage (accept-variation.js).
    // Staff never see dollar amounts for a do-and-charge one: prices are only worked
    // out at billing.
    async function loadVariationEntries(project, pricingVisible) {
      const listEl = document.getElementById('variations-list');
      const { data: { user } } = await supabaseClient.auth.getUser();
      const { data: rows, error } = await supabaseClient
        .from('job_variation_entries')
        .select('*, profiles:created_by(full_name)')
        .eq('project_id', project.id)
        .order('work_date', { ascending: false }).order('created_at', { ascending: false });
      if (error) { listEl.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(error))}</div>`; return; }

      const ids = (rows || []).map(r => r.id);
      const centreIds = (rows || []).filter(r => r.variation_type !== 'fixed').map(r => r.cost_centre_id).filter(Boolean);
      const [{ data: hourRows }, { data: matRows }, { data: staffRows }, { data: clockRows }] = await Promise.all([
        ids.length ? supabaseClient.from('job_variation_hours').select('*, profiles:staff_id(full_name)').in('variation_id', ids).order('work_date').order('created_at') : Promise.resolve({ data: [] }),
        ids.length ? supabaseClient.from('job_variation_materials').select('*').in('variation_id', ids).order('created_at') : Promise.resolve({ data: [] }),
        pricingVisible ? supabaseClient.from('profiles').select('id, full_name').eq('active', true).order('full_name') : Promise.resolve({ data: [] }),
        centreIds.length ? supabaseClient.from('time_entries').select('cost_centre_id, staff_id, clock_in, clock_out, profiles(full_name)').in('cost_centre_id', centreIds).not('clock_out', 'is', null) : Promise.resolve({ data: [] }),
      ]);

      const isOpenToBill = (r) => r.status === 'to_bill' && !(r.variation_type === 'fixed' && r.approval_status !== 'approved');
      const toBill = (rows || []).filter(isOpenToBill).length;
      const tab = document.querySelector('#job-tabs .settings-tab[data-panel="variations"]');
      if (tab) tab.textContent = toBill ? `Variations (${toBill})` : 'Variations';

      const wrap = document.getElementById('var-invoice-wrap');
      if (wrap) {
        const anyDoCharge = (rows || []).some(r => r.variation_type !== 'fixed' && r.status === 'to_bill');
        wrap.innerHTML = pricingVisible && anyDoCharge ? `<button type="button" id="var-invoice-btn" class="secondary" style="font-size:13px; padding:7px 12px;">Add variations to an invoice...</button>` : '';
        const invBtn = document.getElementById('var-invoice-btn');
        if (invBtn) invBtn.addEventListener('click', () => openInvoiceProjectPanel(project, pricingVisible, { variationsOnly: true }));
      }

      const fmtDate = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
      const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Australia/Sydney' });
      const STATUS = { to_bill: ['To bill', 'draft'], billed: ['Billed', 'accepted'], no_charge: ['No charge', 'sent'] };
      const APPROVAL = { draft: ['Draft', 'draft'], sent: ['Sent to client', 'sent'], approved: ['Approved', 'accepted'], declined: ['Declined', 'declined'] };
      const qtyText = (n) => String(Math.round((Number(n) || 0) * 100) / 100);
      const btnStyle = 'font-size:12px; padding:5px 10px;';
      const linkFor = (r) => `${shareOrigin()}/quote.html?variation=${r.variation_token}`;
      const linesTotal = (r) => (r.fixed_lines || []).reduce((s, l) => s + (Number(l.amount) || 0), 0);

      listEl.innerHTML = (rows || []).length ? rows.map(r => {
        const isFixed = r.variation_type === 'fixed';
        const badge = isFixed && r.status === 'to_bill' ? APPROVAL[r.approval_status || 'draft'] : STATUS[r.status];
        const kindText = `Variation ${r.variation_number || ''} &middot; ${isFixed ? 'Fixed price' : 'Do and charge'}`;
        const hrs = (hourRows || []).filter(h => h.variation_id === r.id);
        const mats = (matRows || []).filter(m => m.variation_id === r.id);
        const clocks = (clockRows || []).filter(t => t.cost_centre_id === r.cost_centre_id);
        const clockedByStaff = {};
        clocks.forEach(t => {
          const name = (t.profiles && t.profiles.full_name) || 'Someone';
          clockedByStaff[name] = (clockedByStaff[name] || 0) + (new Date(t.clock_out) - new Date(t.clock_in)) / 3600000;
        });
        const clockedTotal = Object.values(clockedByStaff).reduce((s, n) => s + n, 0);
        const hoursTotal = hrs.reduce((s, h) => s + Number(h.hours), 0) + clockedTotal;
        const open = !isFixed && r.status === 'to_bill'; // hours / materials can still be added
        const mine = r.created_by === user.id;
        const canRemove = (h) => open && (pricingVisible || h.created_by === user.id);
        const canDelete = pricingVisible ? r.approval_status !== 'approved' : (mine && r.status === 'to_bill' && !isFixed);
        return `
        <div class="var-card" data-id="${r.id}" style="border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:12px;">
          <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:flex-start;">
            <div>
              <span class="badge ${badge[1]}">${badge[0]}</span>
              <strong style="margin-left:6px;">${escapeHtml(r.description)}</strong>
              <p class="subtitle" style="margin:4px 0 0; font-size:12px;">${kindText} &middot; ${fmtDate(r.work_date)} &middot; ${escapeHtml((r.profiles && r.profiles.full_name) || 'Someone')}${!isFixed && hoursTotal ? ' &middot; ' + qtyText(hoursTotal) + ' hrs' : (!isFixed && r.hours ? ' &middot; ' + r.hours + ' hrs' : '')}</p>
              ${r.cost_centre_id && !isFixed && r.status === 'to_bill' && pricingVisible ? '' : ''}
            </div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              ${!isFixed && pricingVisible && r.status !== 'billed' ? `<button type="button" class="secondary var-status" data-id="${r.id}" data-status="billed" style="${btnStyle}">Mark billed</button>` : ''}
              ${!isFixed && pricingVisible && r.status !== 'no_charge' ? `<button type="button" class="secondary var-status" data-id="${r.id}" data-status="no_charge" style="${btnStyle}">No charge</button>` : ''}
              ${!isFixed && pricingVisible && r.status !== 'to_bill' ? `<button type="button" class="secondary var-status" data-id="${r.id}" data-status="to_bill" style="${btnStyle}">Reopen</button>` : ''}
              ${canDelete ? `<button type="button" class="secondary var-delete" data-id="${r.id}" style="${btnStyle}">Delete</button>` : ''}
            </div>
          </div>
          ${r.materials ? `<p style="margin:8px 0 0; white-space:pre-wrap; font-size:13px;"><strong>Notes:</strong> ${escapeHtml(r.materials)}</p>` : ''}

          ${isFixed ? `
          <div style="margin-top:12px; padding-top:10px; border-top:0.5px solid var(--border);">
            ${r.reason ? `<p style="margin:0 0 8px; white-space:pre-wrap; font-size:13px;"><strong>Reason:</strong> ${escapeHtml(r.reason)}</p>` : ''}
            ${pricingVisible ? `
              ${(r.fixed_lines || []).map(l => `<div style="display:flex; justify-content:space-between; gap:8px; font-size:13px; padding:2px 0;"><span>${escapeHtml(l.description)} <span class="subtitle">(${l.item_type === 'labour' ? 'labour' : 'materials'})</span></span><span>${money(l.amount)}</span></div>`).join('')}
              <div style="display:flex; justify-content:space-between; font-weight:600; font-size:13px; padding-top:6px; margin-top:4px; border-top:0.5px solid var(--border);"><span>Total ex GST</span><span>${money(linesTotal(r))}</span></div>
              <div class="subtitle" style="display:flex; justify-content:space-between; font-size:12px;"><span>Inc GST</span><span>${money(linesTotal(r) * 1.1)}</span></div>
            ` : `<p class="subtitle" style="margin:0; font-size:12px;">Fixed-price variation, priced by the office.</p>`}
            ${r.approval_status === 'declined' ? `<p class="subtitle" style="margin:8px 0 0; font-size:12px; color:var(--red);">${approvalProofHtml(r)} It won't go on an invoice.</p>` : ''}
            ${validUntilHtml(r, r.id, pricingVisible)}
            ${r.approval_status === 'approved' && r.approval_method && r.approval_method !== 'online' ? `<p class="subtitle" style="margin:8px 0 0; font-size:12px;">${approvalProofHtml(r)} It is now a stage on the job${r.status === 'billed' ? ' and has been invoiced' : ' - invoice it from Invoice project'}.</p>` : ''}
            ${r.approval_status === 'approved' && !(r.approval_method && r.approval_method !== 'online') ? `<p class="subtitle" style="margin:8px 0 0; font-size:12px;">Signed by ${escapeHtml(r.signed_by_name || '')} on ${new Date(r.approved_at).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' })}. It is now a stage on the job${r.status === 'billed' ? ' and has been invoiced' : ' - invoice it from Invoice project'}.</p>` : ''}
            ${r.approval_status === 'sent' ? `<p class="subtitle" style="margin:8px 0 0; font-size:12px;">Sent ${new Date(r.sent_at).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })} - waiting for the client to sign.</p>` : ''}
            ${pricingVisible ? `
              <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;">
                ${r.approval_status === 'draft' || !r.approval_status ? `<button type="button" class="secondary var-fixed-edit" data-id="${r.id}" style="${btnStyle}">Edit</button>` : ''}
                ${!['approved', 'declined'].includes(r.approval_status) ? `<button type="button" class="var-fixed-send" data-id="${r.id}" style="${btnStyle}">${r.approval_status === 'sent' ? 'Resend to client...' : 'Email to client...'}</button>` : ''}
                ${r.approval_status === 'draft' || !r.approval_status ? `<button type="button" class="secondary var-fixed-marksent" data-id="${r.id}" style="${btnStyle}">I've sent it myself</button>` : ''}
                ${r.approval_status === 'sent' ? `<button type="button" class="secondary var-fixed-withdraw" data-id="${r.id}" style="${btnStyle}">Back to draft</button>` : ''}
                ${!['approved', 'declined'].includes(r.approval_status) ? `<button type="button" class="secondary var-fixed-approve" data-id="${r.id}" style="${btnStyle}">Mark approved...</button><button type="button" class="secondary var-fixed-decline" data-id="${r.id}" style="${btnStyle}">Mark declined...</button>` : ''}
                ${r.approval_status === 'declined' && !r.expired ? `<button type="button" class="secondary var-fixed-reopen" data-id="${r.id}" style="${btnStyle}">Reopen</button>` : ''}
                ${r.pdf_path ? `<button type="button" class="secondary var-fixed-pdf" data-id="${r.id}" style="${btnStyle}">View PDF</button>` : ''}
                <button type="button" class="secondary var-fixed-makepdf" data-id="${r.id}" style="${btnStyle}">${r.pdf_path ? 'Regenerate PDF' : 'Make PDF'}</button>
                <button type="button" class="secondary var-fixed-copy" data-link="${linkFor(r)}" style="${btnStyle}">Copy link</button>
                <a class="btn secondary" target="_blank" href="${linkFor(r)}" style="${btnStyle}">${r.approval_status === 'approved' ? 'View approved copy' : 'Preview as client'}</a>
              </div>` : ''}
          </div>` : `
          <div style="margin-top:12px; padding-top:10px; border-top:0.5px solid var(--border);">
            <div style="font-weight:600; font-size:13px; margin-bottom:6px;">Hours${hoursTotal ? ` <span class="subtitle" style="font-weight:400;">(${qtyText(hoursTotal)} total)</span>` : ''}</div>
            ${Object.keys(clockedByStaff).length ? Object.entries(clockedByStaff).map(([name, h]) => `<div style="font-size:13px; padding:3px 0;">Clocked: ${escapeHtml(name)} &middot; ${qtyText(h)} hrs</div>`).join('') : ''}
            ${hrs.map(h => `
              <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; padding:3px 0;">
                <span>${fmtDate(h.work_date)} &middot; ${escapeHtml((h.profiles && h.profiles.full_name) || 'Someone')} &middot; ${qtyText(h.hours)} hrs <span class="subtitle">(logged by hand)</span>${h.note ? ' &middot; ' + escapeHtml(h.note) : ''}</span>
                ${canRemove(h) ? `<button type="button" class="secondary var-hours-del" data-id="${h.id}" style="font-size:18px; line-height:1; min-width:40px; min-height:40px; padding:0 10px;" title="Remove" aria-label="Remove">&times;</button>` : ''}
              </div>`).join('')}
            ${!hrs.length && !Object.keys(clockedByStaff).length ? `<p class="subtitle" style="margin:0; font-size:12px;">${r.hours ? r.hours + ' hrs noted when this was logged. ' : ''}No time yet - clock in to "${escapeHtml('Variation ' + (r.variation_number || ''))}" on My Day, or log hours by hand below.</p>` : ''}
            ${open ? `
              <div style="display:flex; gap:6px; flex-wrap:wrap; align-items:flex-end; margin-top:8px;">
                <div><label style="margin:0; font-size:11px;">Hours (by hand)</label><input type="number" class="var-h-hours" step="0.25" min="0" placeholder="2.5" style="width:90px; margin:0;" /></div>
                <div><label style="margin:0; font-size:11px;">Date</label><input type="date" class="var-h-date" value="${today}" style="margin:0;" /></div>
                ${pricingVisible && (staffRows || []).length ? `<div><label style="margin:0; font-size:11px;">Who</label><select class="var-h-staff" style="margin:0;">${staffRows.map(s => `<option value="${s.id}" ${s.id === user.id ? 'selected' : ''}>${escapeHtml(s.full_name)}</option>`).join('')}</select></div>` : ''}
                <button type="button" class="var-hours-add" data-id="${r.id}" style="${btnStyle}">Log hours</button>
              </div>` : ''}
          </div>

          <div style="margin-top:12px; padding-top:10px; border-top:0.5px solid var(--border);">
            <div style="font-weight:600; font-size:13px; margin-bottom:6px;">Materials</div>
            ${mats.length ? mats.map(m => `
              <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; padding:3px 0;">
                <span>${qtyText(m.quantity)} &times; ${escapeHtml(m.description)}${m.kind === 'prebuild' ? ' <span class="subtitle">(prebuild)</span>' : ''}${m.kind === 'other' ? ' <span class="subtitle">(not from Stock)</span>' : ''}</span>
                ${open && (pricingVisible || m.created_by === user.id) ? `<button type="button" class="secondary var-mat-del" data-id="${m.id}" style="font-size:18px; line-height:1; min-width:40px; min-height:40px; padding:0 10px;" title="Remove" aria-label="Remove">&times;</button>` : ''}
              </div>`).join('') : `<p class="subtitle" style="margin:0; font-size:12px;">None added yet.</p>`}
            ${open ? `
              <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;">
                <button type="button" class="secondary var-mat-add" data-id="${r.id}" style="${btnStyle}">+ Material or prebuild from Stock</button>
                ${pricingVisible ? `<button type="button" class="secondary var-other-add" data-id="${r.id}" style="${btnStyle}">+ Other item (not in Stock)</button>` : ''}
              </div>` : ''}
          </div>`}
        </div>`;
      }).join('') : `<p class="subtitle">Nothing logged - no variations on this job so far.</p>`;

      const reload = () => loadVariationEntries(project, pricingVisible);
      const rowById = (id) => (rows || []).find(r => r.id === id);

      listEl.querySelectorAll('.var-status').forEach(btn => btn.addEventListener('click', async () => {
        const { error: upErr } = await supabaseClient.from('job_variation_entries')
          .update({ status: btn.dataset.status, status_changed_by: user.id, status_changed_at: new Date().toISOString() }).eq('id', btn.dataset.id);
        if (upErr) { alert(friendlyError(upErr)); return; }
        await reload();
      }));

      listEl.querySelectorAll('.var-delete').forEach(btn => btn.addEventListener('click', async () => {
        if (!confirm('Delete this variation? Any Stock materials added to it go back into stock.')) return;
        btn.disabled = true;
        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          const res = await fetch('/.netlify/functions/delete-variation', {
            method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
            body: JSON.stringify({ id: btn.dataset.id }),
          });
          const d = await res.json();
          if (!res.ok || !d.ok) throw new Error(d.error || 'Could not delete it');
        } catch (err) { alert(friendlyError(err)); }
        await reload();
      }));

      listEl.querySelectorAll('.var-hours-add').forEach(btn => btn.addEventListener('click', async () => {
        const card = btn.closest('.var-card');
        const hours = parseFloat(card.querySelector('.var-h-hours').value);
        if (!(hours > 0)) { alert('Enter the hours worked.'); return; }
        const staffSel = card.querySelector('.var-h-staff');
        btn.disabled = true;
        const { error: hErr } = await supabaseClient.from('job_variation_hours').insert({
          variation_id: btn.dataset.id, project_id: project.id, staff_id: staffSel ? staffSel.value : user.id,
          work_date: card.querySelector('.var-h-date').value || today, hours, created_by: user.id,
        });
        if (hErr) { alert(friendlyError(hErr)); btn.disabled = false; return; }
        await logActivity('project', project.id, 'variation_hours_logged', `${hours} hrs logged on variation: ${rowById(btn.dataset.id)?.description || ''}`);
        await reload();
      }));
      listEl.querySelectorAll('.var-hours-del').forEach(btn => btn.addEventListener('click', async () => {
        const h = (hourRows || []).find(x => x.id === btn.dataset.id);
        if (!confirm(h ? `Remove ${qtyText(h.hours)} hrs for ${(h.profiles && h.profiles.full_name) || 'Someone'} on ${fmtDate(h.work_date)}?` : 'Remove these hours?')) return;
        btn.disabled = true;
        const { error: dErr } = await supabaseClient.from('job_variation_hours').delete().eq('id', btn.dataset.id);
        if (dErr) { alert('Could not remove the hours: ' + friendlyError(dErr)); btn.disabled = false; return; }
        await reload();
      }));

      listEl.querySelectorAll('.var-mat-add').forEach(btn => btn.addEventListener('click', async () => {
        const picked = await openVariationStockPicker(pricingVisible);
        if (!picked) return;
        btn.disabled = true;
        try {
          // One server step: the row plus, for a Stock material, the Warehouse count (stops at 0 and
          // logs a correction when the app had fewer). A prebuild is not one Stock item, so nothing comes off.
          const { error: mErr } = await supabaseClient.rpc('variation_material_add', {
            p_variation_id: btn.dataset.id, p_kind: picked.kind,
            p_material_id: picked.kind === 'material' ? picked.id : null,
            p_prebuild_id: picked.kind === 'prebuild' ? picked.id : null,
            p_description: picked.name, p_quantity: picked.quantity,
          });
          if (mErr) throw mErr;
          await logActivity('project', project.id, 'variation_materials_added', `${picked.quantity} x ${picked.name} added to variation: ${rowById(btn.dataset.id)?.description || ''}`);
        } catch (err) {
          alert(friendlyError(err));
        }
        await reload();
      }));

      listEl.querySelectorAll('.var-mat-del').forEach(btn => btn.addEventListener('click', async () => {
        const m = (matRows || []).find(x => x.id === btn.dataset.id);
        if (!confirm(`Remove ${m ? qtyText(m.quantity) + ' x ' + m.description : 'this material'}?${m && m.stock_deducted && m.material_id ? ' It goes back into Warehouse stock.' : ''}`)) return;
        btn.disabled = true;
        // Stock goes back on the Warehouse shelf and the row is deleted in one database step, all or nothing.
        const { error: dErr } = await supabaseClient.rpc('variation_material_delete', { p_id: btn.dataset.id });
        if (dErr) { alert('Could not remove it, nothing was changed: ' + friendlyError(dErr)); btn.disabled = false; return; }
        await reload();
      }));

      listEl.querySelectorAll('.var-other-add').forEach(btn => btn.addEventListener('click', async () => {
        const item = await openVariationOtherItemPrompt();
        if (!item) return;
        const { error: oErr } = await supabaseClient.from('job_variation_materials').insert({
          variation_id: btn.dataset.id, project_id: project.id, kind: 'other',
          description: item.description, quantity: item.quantity, other_unit_cost: item.unitCost, created_by: user.id,
        });
        if (oErr) { alert(friendlyError(oErr)); return; }
        await reload();
      }));

      // ----- fixed-price variations -----
      listEl.querySelectorAll('.var-fixed-edit').forEach(btn => btn.addEventListener('click', () => openFixedVariationEditor(project, rowById(btn.dataset.id), reload)));
      listEl.querySelectorAll('.var-fixed-send').forEach(btn => btn.addEventListener('click', () => sendFixedVariationEmail(project, rowById(btn.dataset.id), reload, btn)));
