      overlay.querySelector('#at-save-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#at-msg');
        const description = overlay.querySelector('#at-desc').value.trim();
        if (!description) { msg.innerHTML = `<div class="error-box">Enter a description.</div>`; return; }
        const assignType = overlay.querySelector('#at-assign-type').value;
        const dueDate = overlay.querySelector('#at-due-date').value || null;
        const addToCalendar = overlay.querySelector('#at-add-to-calendar').checked;
        const personId = assignType === 'person' ? overlay.querySelector('#at-person').value : null;
        const isRecurring = overlay.querySelector('#at-recurring').checked;
        if (isRecurring && !dueDate) { msg.innerHTML = `<div class="error-box">A repeating task needs a due date to count forward from.</div>`; return; }

        const saveBtn = overlay.querySelector('#at-save-btn');
        saveBtn.disabled = true;
        saveBtn.textContent = 'Adding...';
        try {
          const { data: { user } } = await supabaseClient.auth.getUser();

          let scheduleAssignmentId = null;
          if (addToCalendar && personId && dueDate) {
            const blocking = await requiredTasksBlockingSchedule(projectId);
            if (blocking.length) {
              msg.innerHTML = `<div class="error-box">This job can't be scheduled yet - required task${blocking.length > 1 ? 's' : ''} not done: ${blocking.join('; ')}</div>`;
              saveBtn.disabled = false;
              saveBtn.textContent = 'Add task';
              return;
            }
            const { data: assignment, error: schedErr } = await supabaseClient
              .from('schedule_assignments')
              .insert({
                staff_id: personId, project_id: projectId,
                block_type: project?.job_number ? 'job' : 'site_visit',
                assignment_date: dueDate, start_time: '07:00', end_time: '15:00',
              })
              .select('id')
              .single();
            if (schedErr) throw schedErr;
            scheduleAssignmentId = assignment.id;
          }

          const { error } = await supabaseClient.from('job_tasks').insert({
            project_id: projectId,
            description,
            task_type: overlay.querySelector('#at-task-type').value,
            assigned_to_user_id: personId,
            assigned_to_role: assignType === 'role' ? overlay.querySelector('#at-role').value : null,
            required_before_scheduling: overlay.querySelector('#at-required').checked,
            due_date: dueDate,
            recurrence: isRecurring ? overlay.querySelector('#at-recurrence').value : null,
            schedule_assignment_id: scheduleAssignmentId,
            created_by: user.id,
          });
          if (error) throw error;
          const who = personId ? staff.find(s => s.id === personId)?.full_name : (assignType === 'role' ? overlay.querySelector('#at-role').value : null);
          await logActivity('project', projectId, 'task_added', `Task added: ${description}${who ? ` (assigned to ${who})` : ''}`);
          if (overlay.querySelector('#at-required').checked) await refreshPipelineTaskGate(projectId);
          overlay.remove();
          await loadJobTasks(projectId);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
          saveBtn.disabled = false;
          saveBtn.textContent = 'Add task';
        }
      });
    }

    // The "Cost allocated" stat's accrued labour figure is a sum of real
    // clocked time - this lets whoever can see that stat drill into the
    // timesheet entries behind it, and (admin only) correct which stage
    // an entry's hours are attributed to, or reclassify it as office/
    // training/other time entirely.
    async function openTimesheetDrilldown(project, pricingVisible) {
      const centres = (project.cost_centres || []).slice().sort((a, b) => a.sort_order - b.sort_order);
      const myRole = await getMyRole();
      const isAdmin = myRole === 'admin';
      // Itemised per-entry cost is narrower than pricingVisible (Admin/
      // Finance/Sales) - dividing one entry's cost by its hours is
      // functionally the same as reading that employee's pay rate, which
      // stays Admin/Finance only, not Sales.
      const isFinanceOrAdmin = myRole === 'admin' || myRole === 'finance';
      const colCount = 4 + (isFinanceOrAdmin ? 1 : 0) + (isAdmin ? 1 : 0);

      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:720px; width:100%; max-height:85vh; overflow-y:auto;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <h2 style="margin:0;">Accrued cost on this job</h2>
            <button type="button" class="secondary" id="td-close-btn">Close</button>
          </div>
          <p class="subtitle" style="margin-bottom:14px;">${isAdmin ? 'As admin you can correct which stage an entry belongs to, or move it to office/non-job time.' : 'Read-only - admins can edit the cost centre / office time split.'}</p>
          <div id="td-msg"></div>
          <h3 style="margin-bottom:8px;">Timesheets</h3>
          <div id="td-list"><p class="subtitle">Loading...</p></div>
          <h3 style="margin:22px 0 8px;">Purchase orders received</h3>
          <div id="td-po-list"><p class="subtitle">Loading...</p></div>
        </div>`;
      document.body.appendChild(overlay);
      overlay.querySelector('#td-close-btn').addEventListener('click', () => overlay.remove());

      const centreName = (id) => centres.find(c => c.id === id)?.name || 'Unknown stage';
      const stageLabel = (entry) => {
        if (entry.time_category && entry.time_category !== 'job') {
          return entry.time_category.charAt(0).toUpperCase() + entry.time_category.slice(1);
        }
        const ids = (entry.selected_cost_centre_ids && entry.selected_cost_centre_ids.length)
          ? entry.selected_cost_centre_ids
          : (entry.cost_centre_id ? [entry.cost_centre_id] : []);
        return ids.length ? ids.map(centreName).join(', ') : 'Unassigned';
      };
      const hoursFor = (entry) => entry.clock_out
        ? Math.round(((new Date(entry.clock_out) - new Date(entry.clock_in)) / 3600000) * 100) / 100
        : null;

      async function refreshList() {
        const listEl = overlay.querySelector('#td-list');
        const { data: entries, error } = await supabaseClient
          .from('time_entries')
          .select('id, staff_id, clock_in, clock_out, cost_centre_id, selected_cost_centre_ids, time_category, profiles(full_name)')
          .eq('project_id', project.id)
          .order('clock_in', { ascending: false });
        if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }
        if (!entries.length) { listEl.innerHTML = `<p class="subtitle">No timesheet entries logged against this job yet.</p>`; return; }

        let costById = new Map();
        if (isFinanceOrAdmin) {
          try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const res = await fetch('/.netlify/functions/get-itemised-labour-cost', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
              body: JSON.stringify({ projectId: project.id }),
            });
            const data = await res.json();
            if (res.ok && data.ok) costById = new Map(Object.entries(data.costByEntryId));
          } catch (err) {
            console.error('Itemised labour cost fetch failed:', err.message);
          }
        }
        // Sum only THIS project's entries, not every value in costById - it
        // also holds cost for the same employee's entries on OTHER jobs
        // during the same pay week (needed server-side to band overtime
        // correctly), which would otherwise inflate this total past what
        // the rows above it actually show.
        const totalCost = entries.reduce((s, e) => s + (costById.get(e.id) || 0), 0);

        listEl.innerHTML = `
          <table class="responsive-stack">
            <thead><tr><th>Staff</th><th>Date</th><th class="num">Hours</th><th>Stage / category</th>${isFinanceOrAdmin ? '<th class="num">Cost</th>' : ''}${isAdmin ? '<th></th>' : ''}</tr></thead>
            <tbody>
              ${entries.map(e => {
                const hrs = hoursFor(e);
                const cost = costById.get(e.id);
                return `
                <tr data-entry-id="${e.id}">
                  <td data-label="Staff">${e.profiles?.full_name || 'Unknown'}</td>
                  <td data-label="Date">${new Date(e.clock_in).toLocaleDateString()}</td>
                  <td class="num" data-label="Hours">${hrs === null ? 'In progress' : hrs.toFixed(2)}</td>
                  <td data-label="Stage / category">${stageLabel(e)}</td>
                  ${isFinanceOrAdmin ? `<td class="num" data-label="Cost">${cost === undefined ? '-' : money(cost)}</td>` : ''}
                  ${isAdmin ? `<td><button type="button" class="secondary td-edit-btn" data-id="${e.id}" style="font-size:12px; padding:4px 8px;">Edit</button></td>` : ''}
                </tr>
                <tr class="td-edit-row" data-edit-for="${e.id}" style="display:none;"><td colspan="${colCount}"></td></tr>`;
              }).join('')}
            </tbody>
            ${isFinanceOrAdmin ? `<tfoot><tr><td colspan="${colCount - 1 - (isAdmin ? 1 : 0)}" style="text-align:right; font-weight:600;">Total labour cost</td><td class="num" style="font-weight:600;">${money(totalCost)}</td>${isAdmin ? '<td></td>' : ''}</tr></tfoot>` : ''}
          </table>`;

        if (!isAdmin) return;
        listEl.querySelectorAll('.td-edit-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const entry = entries.find(e => e.id === btn.dataset.id);
            openEditRow(entry);
          });
        });
      }

      async function refreshPoList() {
        const listEl = overlay.querySelector('#td-po-list');
        if (!pricingVisible) { listEl.innerHTML = `<p class="subtitle">Pricing details are hidden for your role.</p>`; return; }

        const { data: pos, error } = await supabaseClient
          .from('purchase_orders')
          .select('id, po_number, cost_centre_id, suppliers(name), supplier_name, purchase_order_line_items(description, quantity, unit_cost, received)')
          .eq('project_id', project.id);
        if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }

        const receivedRows = [];
        (pos || []).forEach(po => {
          const supplierLabel = po.suppliers?.name || po.supplier_name || 'Unknown supplier';
          (po.purchase_order_line_items || []).filter(li => li.received).forEach(li => {
            receivedRows.push({ ...li, supplierLabel, poNumber: po.po_number, stage: centreName(po.cost_centre_id) });
          });
        });

        if (!receivedRows.length) { listEl.innerHTML = `<p class="subtitle">No purchase order line items received yet - only received items count as accrued cost, not just approved/ordered ones.</p>`; return; }

        const totalMaterial = receivedRows.reduce((s, li) => s + Number(li.quantity) * Number(li.unit_cost), 0);
        listEl.innerHTML = `
          <table class="responsive-stack">
            <thead><tr><th>Item</th><th>Supplier</th><th>Stage</th><th class="num">Qty</th><th class="num">Unit cost</th><th class="num">Total</th></tr></thead>
            <tbody>
              ${receivedRows.map(li => `
                <tr>
                  <td data-label="Item">${li.description}${li.poNumber ? ` <span class="subtitle" style="font-size:11px;">(${li.poNumber})</span>` : ''}</td>
                  <td data-label="Supplier">${li.supplierLabel}</td>
                  <td data-label="Stage">${li.stage}</td>
                  <td class="num" data-label="Qty">${li.quantity}</td>
                  <td class="num" data-label="Unit cost">${money(li.unit_cost)}</td>
                  <td class="num" data-label="Total">${money(Number(li.quantity) * Number(li.unit_cost))}</td>
                </tr>`).join('')}
            </tbody>
            <tfoot><tr><td colspan="5" style="text-align:right; font-weight:600;">Total received materials cost</td><td class="num" style="font-weight:600;">${money(totalMaterial)}</td></tr></tfoot>
          </table>`;
      }

      function openEditRow(entry) {
        const editCell = overlay.querySelector(`tr[data-edit-for="${entry.id}"] td`);
        const selectedIds = (entry.selected_cost_centre_ids && entry.selected_cost_centre_ids.length)
          ? entry.selected_cost_centre_ids
          : (entry.cost_centre_id ? [entry.cost_centre_id] : []);
        const category = entry.time_category && entry.time_category !== 'job' ? entry.time_category : 'job';

        editCell.innerHTML = `
          <div style="padding:10px; background:var(--surface-2); border-radius:8px;">
            <label style="margin-top:0;">Category</label>
            <select class="td-category">
              <option value="job" ${category === 'job' ? 'selected' : ''}>Job - split across stage(s) below</option>
              <option value="office" ${category === 'office' ? 'selected' : ''}>Office / admin</option>
              <option value="training" ${category === 'training' ? 'selected' : ''}>Training</option>
              <option value="other" ${category === 'other' ? 'selected' : ''}>Other</option>
            </select>
            <div class="td-stage-section" style="margin-top:8px; ${category === 'job' ? '' : 'display:none;'}">
              <label>Stage(s) - tick every stage this entry's hours count against</label>
              ${centres.map(c => `
                <label style="display:flex; align-items:center; gap:8px; font-weight:400; margin-top:6px;">
                  <input type="checkbox" class="td-stage-check" value="${c.id}" style="width:auto;" ${selectedIds.includes(c.id) ? 'checked' : ''} />
                  ${c.name}
                </label>`).join('')}
            </div>
            <div style="margin-top:12px;">
              <button type="button" class="td-save-btn">Save</button>
              <button type="button" class="secondary td-cancel-btn">Cancel</button>
            </div>
            <div class="td-edit-msg"></div>
          </div>`;
        editCell.closest('tr').style.display = 'table-row';

        editCell.querySelector('.td-category').addEventListener('change', (e) => {
          editCell.querySelector('.td-stage-section').style.display = e.target.value === 'job' ? '' : 'none';
        });
        editCell.querySelector('.td-cancel-btn').addEventListener('click', () => {
          editCell.closest('tr').style.display = 'none';
          editCell.innerHTML = '';
        });
        editCell.querySelector('.td-save-btn').addEventListener('click', async () => {
          const msg = editCell.querySelector('.td-edit-msg');
          const newCategory = editCell.querySelector('.td-category').value;
          const checkedIds = Array.from(editCell.querySelectorAll('.td-stage-check:checked')).map(el => el.value);
          if (newCategory === 'job' && !checkedIds.length) {
            msg.innerHTML = `<div class="error-box">Tick at least one stage, or choose a non-job category.</div>`;
            return;
          }
          try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const res = await fetch('/.netlify/functions/admin-update-time-entry', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
              body: JSON.stringify({
                entryId: entry.id,
                project_id: newCategory === 'job' ? project.id : null,
                cost_centre_id: newCategory === 'job' && checkedIds.length === 1 ? checkedIds[0] : null,
                selected_cost_centre_ids: newCategory === 'job' && checkedIds.length > 1 ? checkedIds : null,
                time_category: newCategory,
              }),
            });
            const data = await res.json();
            if (!res.ok || !data.ok) throw new Error(data.error || 'Update failed');

            await refreshList();
            const refreshed = await loadProject();
            if (refreshed) render(refreshed, pricingVisible);
          } catch (err) {
            msg.innerHTML = `<div class="error-box">${err.message}</div>`;
          }
        });
      }

      await Promise.all([refreshList(), refreshPoList()]);
    }

    function isPdfDoc(d) {
      return (d.mime_type || '') === 'application/pdf' || /.pdf$/i.test(d.file_name || '');
    }

    async function loadDocuments(projectId) {
      const listEl = document.getElementById('documents-list');
      const pillsEl = document.getElementById('doc-folder-pills');
      const folderSelect = document.getElementById('doc-folder-select');

      const { data: docs, error } = await supabaseClient
        .from('project_documents')
        .select('*, profiles(full_name)')
        .eq('project_id', projectId)
        .order('created_at', { ascending: false });
      if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }

      // "Plans" exists on every job and quote, even before anything's been
      // uploaded to it - it's where the builder's plans go, and where the
      // electrical plan pages made from them are saved.
      const folders = [...new Set(['Plans', ...(docs || []).map(d => d.folder)])]
        .sort((a, b) => (a === 'Plans' ? -1 : b === 'Plans' ? 1 : a.localeCompare(b)));
      const folderOptions = ['Plans', 'General', ...folders.filter(f => f !== 'Plans' && f !== 'General')];
      folderSelect.innerHTML = folderOptions.map(f => `<option value="${f}">${f}</option>`).join('');
      folderSelect.value = folderOptions.includes(selectedDocFolder) ? selectedDocFolder : 'General';

      pillsEl.innerHTML = ['All', ...folders].map(f => `
        <button type="button" class="secondary doc-folder-pill" data-folder="${f}" style="font-size:12px; padding:6px 12px; ${f === selectedDocFolder ? 'background:var(--accent-dim); color:var(--accent);' : ''}">${f}</button>
      `).join('');
      pillsEl.querySelectorAll('.doc-folder-pill').forEach(btn => {
        btn.addEventListener('click', () => { selectedDocFolder = btn.dataset.folder; loadDocuments(projectId); });
      });

      const visible = selectedDocFolder === 'All' ? (docs || []) : (docs || []).filter(d => d.folder === selectedDocFolder);
      if (!visible.length) {
        listEl.innerHTML = selectedDocFolder === 'Plans'
          ? `<p class="subtitle">No plans yet. Upload the builder's plans here, then open one and use "Copy page into plan pages" to make lighting, power and cable path pages to mark up with electrical symbols.</p>`
          : `<p class="subtitle">No documents${selectedDocFolder === 'All' ? '' : ' in this folder'} yet.</p>`;
        return;
      }

      listEl.innerHTML = `<p class="subtitle">Loading previews...</p>`;

      // Grid preview instead of a bare filename list - a private bucket
      // needs a signed URL per file to actually show a thumbnail, so
      // these are generated once up front rather than one at a time.
      const signedUrls = await Promise.all(visible.map(d => getSignedDocUrl(d.file_path).catch(() => null)));

      listEl.innerHTML = `
        <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:12px;">
          ${visible.map((d, i) => {
            const url = signedUrls[i];
            const isImage = (d.mime_type || '').startsWith('image/');
            const isVideo = (d.mime_type || '').startsWith('video/');
            const isPdf = isPdfDoc(d);
            const preview = isImage && url
              ? `<img src="${url}" style="width:100%; height:110px; object-fit:cover; border-radius:8px 8px 0 0;" />`
              : isVideo && url
                ? `<video src="${url}" muted preload="metadata" style="width:100%; height:110px; object-fit:cover; border-radius:8px 8px 0 0; background:#000;"></video>`
                : isPdf
                  ? `<div class="doc-pdf-thumb" data-path="${d.file_path}" style="width:100%; height:110px; border-radius:8px 8px 0 0; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:32px; overflow:hidden;">&#128196;</div>`
                  : `<div style="width:100%; height:110px; border-radius:8px 8px 0 0; background:var(--surface-2); display:flex; align-items:center; justify-content:center; font-size:32px;">&#128196;</div>`;
            return `
              <div class="doc-tile" style="border:1px solid var(--border); border-radius:8px; overflow:hidden;">
                <a href="#" class="doc-view-link" data-path="${d.file_path}" style="display:block;">${preview}</a>
                <div style="padding:8px;">
                  <a href="#" class="link-quiet doc-view-link" data-path="${d.file_path}" style="font-weight:600; font-size:12px; word-break:break-word;">${d.file_name}</a>
                  <p class="subtitle" style="margin:4px 0 0; font-size:11px;">${d.profiles?.full_name || 'Someone'} &middot; ${new Date(d.created_at).toLocaleDateString('en-AU')}</p>
                  <button type="button" class="secondary doc-delete-btn" data-id="${d.id}" data-path="${d.file_path}" style="font-size:11px; padding:4px 8px; margin-top:6px; width:100%;">Delete</button>
                </div>
              </div>`;
          }).join('')}
        </div>`;

      // PDFs show their first page like a photo, filled in after the grid
      // is up so one slow PDF never holds the rest of the tab back.
      (async () => {
        for (const thumb of listEl.querySelectorAll('.doc-pdf-thumb')) {
          try {
            const url = await getSignedDocUrl(thumb.dataset.path);
            const dataUrl = await renderPdfThumbnail(url, 360);
            thumb.innerHTML = `<img src="${dataUrl}" style="width:100%; height:100%; object-fit:cover; object-position:top;" />`;
          } catch { /* keep the document icon */ }
        }
      })();

      // PDFs and images open in the in-app viewer (and can be marked up);
      // anything else (Word, Excel...) still opens in a new tab.
      async function saveDocCopy(blob, doc, ext, mime) {
        const { data: { user } } = await supabaseClient.auth.getUser();
        const path = `documents/${projectId}/${Date.now()}-marked-up.${ext}`;
        const { error: upErr } = await supabaseClient.storage.from('project-documents').upload(path, blob, { contentType: mime });
        if (upErr) throw upErr;
        const { error: insErr } = await supabaseClient.from('project_documents').insert({
          project_id: projectId, folder: doc.folder, file_path: path,
          file_name: `${doc.file_name.replace(/.[^.]+$/, '')} (marked up).${ext}`, mime_type: mime, uploaded_by: user.id,
        });
        if (insErr) throw insErr;
      }
      listEl.querySelectorAll('.doc-view-link').forEach(a => {
        a.addEventListener('click', async (e) => {
          e.preventDefault();
          try {
            const doc = visible.find(d => d.file_path === a.dataset.path);
            if (doc && isPdfDoc(doc)) {
              openPdfViewer(doc.file_path, doc.file_name, { projectId, folder: doc.folder, onSaved: () => loadDocuments(projectId) });
              return;
            }
            if (doc && (doc.mime_type || '').startsWith('image/')) {
              const images = visible.filter(d => (d.mime_type || '').startsWith('image/'));
              const imageUrls = await Promise.all(images.map(d => getSignedDocUrl(d.file_path)));
              openPhotoLightbox(imageUrls, images.indexOf(doc), {
                captions: images.map(d => d.file_name),
                onMarkup: async (i, blob) => { await saveDocCopy(blob, images[i], 'jpg', 'image/jpeg'); },
                onClose: () => loadDocuments(projectId),
              });
              return;
            }
            const url = await getSignedDocUrl(a.dataset.path);
            window.open(url, '_blank');
          } catch (err) { alert(err.message); }
        });
      });
      listEl.querySelectorAll('.doc-delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this document? This removes the file permanently.')) return;
          try {
            await supabaseClient.storage.from('project-documents').remove([btn.dataset.path]);
            const { error: delErr } = await supabaseClient.from('project_documents').delete().eq('id', btn.dataset.id);
            if (delErr) throw delErr;
            await logActivity('project', projectId, 'document_deleted', 'Deleted a document');
            await loadDocuments(projectId);
          } catch (err) { alert(err.message); }
        });
      });
    }

    // Meetings held about this job (meetings.html), with how many of their
    // follow-up actions are still open. Hidden until there is one, but the
    // "+ Meeting" link is always reachable from the Meetings page.
    async function loadMeetingsCard(project) {
      const el = document.getElementById('meetings-card');
      if (!el) return;
      const { data: ms } = await supabaseClient.from('meetings')
        .select('id, title, meeting_date, job_tasks(id, completed, followed_up_at)')
        .or(`project_id.eq.${project.id},project_ids.cs.{${project.id}}`).order('meeting_date', { ascending: false });
      if (!(ms || []).length) {
        el.innerHTML = `<div class="card"><div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;"><h2 style="margin:0;">Meetings</h2><a href="/meetings.html?new=1&project=${project.id}"><button type="button" class="secondary" style="font-size:12px; padding:6px 10px;">+ Meeting notes</button></a></div></div>`;
        return;
      }
      el.innerHTML = `<div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px;">
          <h2 style="margin:0;">Meetings</h2>
          <a href="/meetings.html?new=1&project=${project.id}"><button type="button" class="secondary" style="font-size:12px; padding:6px 10px;">+ Meeting notes</button></a>
        </div>
        ${ms.map(m => {
          const acts = m.job_tasks || [];
          const open = acts.filter(a => !a.completed || !a.followed_up_at).length;
          return `<div style="display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--border);">
            <a href="/meetings.html?id=${m.id}" class="link-quiet">${escapeHtml(m.title)}</a>
            <span class="subtitle" style="margin:0; white-space:nowrap;">${new Date(m.meeting_date + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })}${open ? ' &middot; <span style="color:#d9a23b;">' + open + ' to follow up</span>' : (acts.length ? ' &middot; all followed up' : '')}</span>
          </div>`;
        }).join('')}
      </div>`;
    }

    // Installed equipment for this job, recorded against the customer so
    // servicing / warranty reminders can go out later. Jobs only.
    function assetPrefillsForJob(project) {
      const text = (v) => (Array.isArray(v) ? v.join('\n') : String(v || ''));
      const base = { client_id: project.client_id || null, client_name: project.client_name, site_address: project.client_address, project_id: project.id, installed_at: assetToday() };
      const pd = project.pylon_data || {};
      const out = [];
      (pd.module_types || []).forEach(m => out.push({ ...base, asset_type: 'solar', name: m.description || 'Solar panels', quantity: m.quantity || m.count || 1, serial_numbers: text(project.panel_serial_numbers) }));
      (pd.inverter_types || []).forEach(m => out.push({ ...base, asset_type: 'inverter', name: m.description || 'Inverter', quantity: m.quantity || m.count || 1, serial_numbers: text(project.inverter_serial_numbers) }));
      (pd.storage_types || []).forEach(m => out.push({ ...base, asset_type: 'battery', name: m.description || 'Battery', quantity: m.quantity || m.count || 1 }));
      if (!out.length) out.push({ ...base, asset_type: project.proposal_template === 'solar' ? 'solar' : 'other', name: project.proposal_template === 'solar' ? 'Solar system' : (project.name || ''), serial_numbers: project.proposal_template === 'solar' ? text(project.panel_serial_numbers) : '' });
      return out;
    }
    async function loadAssetsCard(project) {
      const el = document.getElementById('assets-card');
      if (!el || !project.job_number || typeof openAssetPanel !== 'function') return;
      const { data: assets } = await supabaseClient.from('customer_assets').select('*').eq('project_id', project.id).order('created_at');
      const finished = ['client_handover', 'ready_to_invoice', 'awaiting_payment', 'complete', 'archived'].includes(project.pipeline_stage);
      if (!(assets || []).length && !finished) { el.innerHTML = ''; return; }
      const refresh = () => loadAssetsCard(project);
      const addFromJob = () => {
        const queue = assetPrefillsForJob(project);
        const next = () => { if (queue.length) openAssetPanel({ prefill: queue.shift(), onSaved: async () => { await refresh(); next(); } }); };
        next();
      };
      el.innerHTML = `
        <div class="card" ${!(assets || []).length ? 'style="border-color:var(--accent);"' : ''}>
          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:6px;">
            <h2 style="margin:0;">Installed equipment</h2>
            <div style="display:flex; gap:6px;">
              <button type="button" class="secondary" id="assets-add-blank" style="font-size:12px; padding:6px 10px;">+ Add</button>
              <button type="button" id="assets-add-job" style="font-size:12px; padding:6px 10px;">${(assets || []).length ? 'Add more from this job' : 'Add installed equipment'}</button>
            </div>
          </div>
          ${(assets || []).length ? `
            <table class="responsive-stack">
              <thead><tr><th>Asset</th><th>Warranty</th><th>Next service</th><th></th></tr></thead>
              <tbody>${assets.map(a => `
                <tr>
                  <td data-label="Asset">${escapeHtml(a.name)}${a.quantity > 1 ? ' x' + a.quantity : ''}<div class="subtitle" style="font-size:12px;">${escapeHtml(assetTypeInfo(a.asset_type).label)}${a.make || a.model ? ' &middot; ' + escapeHtml([a.make, a.model].filter(Boolean).join(' ')) : ''}</div></td>
                  <td data-label="Warranty">${assetDateBadge(a.warranty_expires, 'warranty')}</td>
                  <td data-label="Next service">${a.service_interval_months ? assetDateBadge(a.next_service_due, 'service') : '<span class="subtitle">-</span>'}</td>
                  <td data-label=""><button type="button" class="secondary job-asset-edit" data-id="${a.id}" style="font-size:12px; padding:5px 10px;">Edit</button></td>
                </tr>`).join('')}</tbody>
            </table>` : `<p class="subtitle" style="margin:0;">Nothing recorded yet. Add what was installed (with serial numbers and warranty) so we can remind ${escapeHtml(project.client_name || 'the customer')} when a service is due or the warranty is running out.</p>`}
        </div>`;
      document.getElementById('assets-add-blank').addEventListener('click', () => openAssetPanel({ prefill: { client_id: project.client_id || null, client_name: project.client_name, site_address: project.client_address, project_id: project.id, installed_at: assetToday() }, onSaved: refresh }));
      document.getElementById('assets-add-job').addEventListener('click', addFromJob);
      el.querySelectorAll('.job-asset-edit').forEach(b => b.addEventListener('click', () => openAssetPanel({ asset: assets.find(a => a.id === b.dataset.id), onSaved: refresh })));
    }

    // Per-job log of out-of-scope work (job_variation_entries). Anyone can
    // log; pricing roles mark each one billed / no charge. The invoicing
    // panel warns about anything still "to bill".
    async function loadVariationEntries(project, pricingVisible) {
      const listEl = document.getElementById('variations-list');
      const { data: { user } } = await supabaseClient.auth.getUser();
      const { data: rows, error } = await supabaseClient
        .from('job_variation_entries')
        .select('*, profiles:created_by(full_name)')
        .eq('project_id', project.id)
        .order('work_date', { ascending: false }).order('created_at', { ascending: false });
      if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }

      const toBill = (rows || []).filter(r => r.status === 'to_bill').length;
      const tab = document.querySelector('#job-tabs .settings-tab[data-panel="variations"]');
      if (tab) tab.textContent = toBill ? `Variations (${toBill})` : 'Variations';

      const STATUS = { to_bill: ['To bill', 'draft'], billed: ['Billed', 'accepted'], no_charge: ['No charge', 'sent'] };
      listEl.innerHTML = (rows || []).length ? rows.map(r => `
        <div style="border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px;">
          <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:flex-start;">
            <div>
              <span class="badge ${STATUS[r.status][1]}">${STATUS[r.status][0]}</span>
              <strong style="margin-left:6px;">${escapeHtml(r.description)}</strong>
              <p class="subtitle" style="margin:4px 0 0; font-size:12px;">${new Date(r.work_date + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' })} &middot; ${escapeHtml((r.profiles && r.profiles.full_name) || 'Someone')}${r.hours ? ' &middot; ' + r.hours + ' hrs' : ''}</p>
            </div>
            <div style="display:flex; gap:6px; flex-wrap:wrap;">
              ${pricingVisible && r.status !== 'billed' ? `<button type="button" class="secondary var-status" data-id="${r.id}" data-status="billed" style="font-size:12px; padding:5px 10px;">Mark billed</button>` : ''}
              ${pricingVisible && r.status !== 'no_charge' ? `<button type="button" class="secondary var-status" data-id="${r.id}" data-status="no_charge" style="font-size:12px; padding:5px 10px;">No charge</button>` : ''}
              ${pricingVisible && r.status !== 'to_bill' ? `<button type="button" class="secondary var-status" data-id="${r.id}" data-status="to_bill" style="font-size:12px; padding:5px 10px;">Reopen</button>` : ''}
              ${(r.created_by === user.id && r.status === 'to_bill') || pricingVisible ? `<button type="button" class="secondary var-delete" data-id="${r.id}" style="font-size:12px; padding:5px 10px;">Delete</button>` : ''}
            </div>
          </div>
          ${r.materials ? `<p style="margin:8px 0 0; white-space:pre-wrap; font-size:13px;"><strong>Materials:</strong> ${escapeHtml(r.materials)}</p>` : ''}
        </div>`).join('') : `<p class="subtitle">Nothing logged - no variations on this job so far.</p>`;

      listEl.querySelectorAll('.var-status').forEach(btn => btn.addEventListener('click', async () => {
        const { error: upErr } = await supabaseClient.from('job_variation_entries')
          .update({ status: btn.dataset.status, status_changed_by: user.id, status_changed_at: new Date().toISOString() }).eq('id', btn.dataset.id);
        if (upErr) { alert(upErr.message); return; }
        await loadVariationEntries(project, pricingVisible);
      }));
      listEl.querySelectorAll('.var-delete').forEach(btn => btn.addEventListener('click', async () => {
        if (!confirm('Delete this logged variation?')) return;
        const { error: delErr } = await supabaseClient.from('job_variation_entries').delete().eq('id', btn.dataset.id);
        if (delErr) { alert(delErr.message); return; }
        await loadVariationEntries(project, pricingVisible);
      }));

      const addBtn = document.getElementById('var-add-btn');
      if (addBtn && !addBtn.dataset.wired) {
        addBtn.dataset.wired = '1';
        addBtn.addEventListener('click', async () => {
          const msg = document.getElementById('var-msg');
          const description = document.getElementById('var-desc').value.trim();
          if (!description) { msg.innerHTML = `<div class="error-box">Say what the extra work was.</div>`; return; }
          addBtn.disabled = true;
          const { error: insErr } = await supabaseClient.from('job_variation_entries').insert({
            project_id: project.id, description, created_by: user.id,
            hours: parseFloat(document.getElementById('var-hours').value) || null,
            work_date: document.getElementById('var-date').value || new Date().toISOString().slice(0, 10),
            materials: document.getElementById('var-materials').value.trim() || null,
          });
          addBtn.disabled = false;
          if (insErr) { msg.innerHTML = `<div class="error-box">${insErr.message}</div>`; return; }
          ['var-desc', 'var-hours', 'var-materials'].forEach(id => { document.getElementById(id).value = ''; });
          msg.innerHTML = `<div class="success-box">Logged.</div>`;
          await logActivity('project', project.id, 'variation_logged', `Variation logged: ${description}`);
          await loadVariationEntries(project, pricingVisible);
        });
      }
    }

    // Warns in the invoice panel about logged variations nobody has billed or
    // waived yet.
    async function fillInvoiceVariationsNote(overlay, project) {
      const el = overlay.querySelector('#inv-variations-note');
      if (!el) return;
      const { data: rows } = await supabaseClient.from('job_variation_entries').select('description, hours').eq('project_id', project.id).eq('status', 'to_bill');
      if (!rows || !rows.length) return;
      el.innerHTML = `
        <div class="error-box" style="margin-bottom:12px;">
          <strong>${rows.length} logged variation${rows.length === 1 ? '' : 's'} not billed yet:</strong>
          <ul style="margin:6px 0 0 18px; padding:0;">${rows.map(r => `<li>${escapeHtml(r.description)}${r.hours ? ' (' + r.hours + ' hrs)' : ''}</li>`).join('')}</ul>
          <p style="margin:6px 0 0; font-size:12px;">Add them to this claim, or mark them billed / no charge on the Variations tab.</p>
        </div>`;
    }

    // Other jobs and quotes for the same client (same-site first), so when
    // there's more than one job on a site it's one tap to jump between them -
    // or to clock into another without going back to search. If you're
    // clocked in somewhere it switches (the usual clock-out confirmation
    // still happens); if not, it opens My Day with that job selected.
    async function loadRelatedJobsCard(project) {
      const el = document.getElementById('related-jobs-card');
      if (!el) return;
      let q = supabaseClient.from('projects')
        .select('id, name, job_number, quote_number, client_address, pipeline_stage, status, created_at')
        .neq('id', project.id).neq('pipeline_stage', 'archived').order('created_at', { ascending: false }).limit(25);
      q = project.client_id ? q.eq('client_id', project.client_id) : (project.client_name ? q.eq('client_name', project.client_name) : null);
      if (!q) { el.innerHTML = ''; return; }
      const { data: related } = await q;
      if (!related || !related.length) { el.innerHTML = ''; return; }

      const sameSite = (r) => project.client_address && r.client_address && r.client_address.trim().toLowerCase() === project.client_address.trim().toLowerCase();
      const sorted = related.slice().sort((a, b) => Number(sameSite(b)) - Number(sameSite(a)) || new Date(b.created_at) - new Date(a.created_at)).slice(0, 10);
      const { data: { user } } = await supabaseClient.auth.getUser();
      const { data: active } = await supabaseClient.from('time_entries').select('*').eq('staff_id', user.id).is('clock_out', null).order('clock_in', { ascending: false }).limit(1).maybeSingle();

      el.innerHTML = `
        <div class="card">
          <h2>Other jobs for ${escapeHtml(project.client_name || 'this client')}</h2>
          <p class="subtitle" style="margin-bottom:8px;">Jump between jobs on the same site, or clock into another one.</p>
          ${sorted.map(r => `
            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 0; border-top:1px solid var(--border);">
              <div style="min-width:0;">
                <a class="link-quiet" href="/project.html?id=${r.id}" style="font-weight:600;">${escapeHtml(projectRef(r))}</a>
                ${sameSite(r) ? '<span class="badge sent" style="margin-left:6px;">Same site</span>' : ''}
                <span class="badge draft" style="margin-left:6px;">${escapeHtml((r.pipeline_stage || r.status || '').replace(/_/g, ' '))}</span>
                ${r.client_address ? `<p class="subtitle" style="margin:2px 0 0; font-size:12px;">${escapeHtml(r.client_address)}</p>` : ''}
              </div>
              <div style="display:flex; gap:6px; flex-shrink:0;">
                <a class="btn secondary" href="/project.html?id=${r.id}" style="font-size:12px; padding:6px 10px;">Open</a>
                ${r.job_number ? `<button type="button" class="secondary related-clock-btn" data-id="${r.id}" style="font-size:12px; padding:6px 10px;">${active ? 'Switch to this job' : 'Clock in'}</button>` : ''}
              </div>
            </div>`).join('')}
        </div>`;

      el.querySelectorAll('.related-clock-btn').forEach(btn => btn.addEventListener('click', () => {
        const target = sorted.find(r => r.id === btn.dataset.id);
        if (active) {
          openClockOutModal(active, () => { window.location.href = '/my-day.html'; }, { switchTo: { projectId: target.id, label: projectRef(target) } });
        } else {
          window.location.href = `/my-day.html?clockin_project=${target.id}`;
        }
      }));
    }

    // "Schedule staff" - book people onto this quote (a site visit) or job
    // (work) from right here, for a date or a run of days, without going
    // over to the Schedule page. Same rules as there: required pre-job tasks
    // must be done before a job can be booked, double-bookings are flagged
    // (not blocked), and booking a job moves it Ready to Book -> Job Booked.
    async function openScheduleStaffPanel(project) {
      const isJob = !!project.job_number;
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:150; padding:16px; overflow-y:auto;';
      overlay.innerHTML = `<div class="card" style="max-width:560px; width:100%;"><p class="subtitle">Loading...</p></div>`;
      document.body.appendChild(overlay);

      const todayIso = new Date().toISOString().slice(0, 10);
      const fmtDay = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
      const hhmm = (t) => String(t).slice(0, 5);
      const toSec = (t) => (String(t).length === 5 ? t + ':00' : String(t));

      async function render() {
        const [{ data: staff }, { data: booked }] = await Promise.all([
          supabaseClient.from('profiles').select('id, full_name').eq('active', true).order('full_name'),
          supabaseClient.from('schedule_assignments')
            .select('id, staff_id, assignment_date, start_time, end_time, note, profiles(full_name)')
            .eq('project_id', project.id).order('assignment_date').order('start_time'),
        ]);
        overlay.innerHTML = `
          <div class="card" style="max-width:560px; width:100%; max-height:92vh; overflow-y:auto;">
            <h2>${isJob ? 'Schedule staff on this job' : 'Schedule a site visit'}</h2>
            <p class="subtitle" style="margin-bottom:12px;">${escapeHtml(projectRef(project))} - ${isJob ? 'books people to work on site' : 'books people to attend site for this quote'}. They'll see it on their schedule and My Day.</p>

            ${(booked || []).length ? `
              <p class="subtitle" style="margin:0 0 4px; font-weight:600;">Already booked</p>
              <div style="margin-bottom:14px;">
                ${booked.map(b => `
                  <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--border); ${b.assignment_date < todayIso ? 'opacity:0.6;' : ''}">
                    <span style="font-size:13px;">${fmtDay(b.assignment_date)}, ${hhmm(b.start_time)}-${hhmm(b.end_time)} - <strong>${escapeHtml((b.profiles && b.profiles.full_name) || 'Someone')}</strong>${b.note ? ' (' + escapeHtml(b.note) + ')' : ''}</span>
                    <button type="button" class="secondary sched-remove" data-id="${b.id}" style="font-size:11px; padding:4px 8px; flex-shrink:0;">Remove</button>
                  </div>`).join('')}
              </div>` : ''}

            <p class="subtitle" style="margin:0 0 4px; font-weight:600;">Who</p>
            <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:4px 12px; margin-bottom:12px;">
              ${(staff || []).map(p => `<label style="display:flex; align-items:center; gap:6px; margin:0; font-weight:400;"><input type="checkbox" class="sched-staff" value="${p.id}" style="width:auto;" /> ${escapeHtml(p.full_name || 'Unnamed')}</label>`).join('')}
            </div>

            <div class="grid cols-2">
              <div><label style="margin-top:0;">Date</label><input type="date" id="sched-date" value="${todayIso}" /></div>
              <div><label style="margin-top:0;">To (optional, for several days)</label><input type="date" id="sched-end-date" /></div>
            </div>
            <div class="grid cols-2">
              <div><label>Start time</label><input type="time" id="sched-start" value="${isJob ? '07:00' : '09:00'}" /></div>
              <div><label>Finish time</label><input type="time" id="sched-end" value="${isJob ? '15:30' : '10:00'}" /></div>
            </div>
            <label style="display:flex; align-items:center; gap:8px; font-weight:400;"><input type="checkbox" id="sched-weekdays" checked style="width:auto;" /> Skip weekends when booking several days</label>
            <label>Note (optional)</label>
            <input id="sched-note" placeholder="e.g. bring the ladder, meet the builder at 7" />

            <div id="sched-msg"></div>
            <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
              <button type="button" id="sched-book-btn">Book</button>
              <button type="button" class="secondary" id="sched-close-btn">Close</button>
              <a class="link-quiet" href="/schedule.html" style="margin-left:auto; font-size:12px;">Open the full schedule &rarr;</a>
            </div>
          </div>`;

        overlay.querySelector('#sched-close-btn').addEventListener('click', () => overlay.remove());
        overlay.querySelectorAll('.sched-remove').forEach(btn => btn.addEventListener('click', async () => {
          const { error } = await supabaseClient.from('schedule_assignments').delete().eq('id', btn.dataset.id);
          if (error) { overlay.querySelector('#sched-msg').innerHTML = `<div class="error-box">${error.message}</div>`; return; }
          await render();
        }));

        overlay.querySelector('#sched-book-btn').addEventListener('click', async () => {
          const msg = overlay.querySelector('#sched-msg');
          const bookBtn = overlay.querySelector('#sched-book-btn');
          const staffIds = [...overlay.querySelectorAll('.sched-staff:checked')].map(c => c.value);
          const startDate = overlay.querySelector('#sched-date').value;
          const endDate = overlay.querySelector('#sched-end-date').value || startDate;
          const start = overlay.querySelector('#sched-start').value;
          const end = overlay.querySelector('#sched-end').value;
          const weekdaysOnly = overlay.querySelector('#sched-weekdays').checked;
          const note = overlay.querySelector('#sched-note').value.trim() || null;
          if (!staffIds.length) { msg.innerHTML = `<div class="error-box">Pick at least one person.</div>`; return; }
          if (!startDate) { msg.innerHTML = `<div class="error-box">Pick a date.</div>`; return; }
          if (endDate < startDate) { msg.innerHTML = `<div class="error-box">The "to" date can't be before the start date.</div>`; return; }
          if (!start || !end || end <= start) { msg.innerHTML = `<div class="error-box">Finish time must be after the start time.</div>`; return; }

          const dates = [];
          for (let d = new Date(startDate + 'T00:00:00'); d <= new Date(endDate + 'T00:00:00'); d.setDate(d.getDate() + 1)) {
            const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            const isWeekend = d.getDay() === 0 || d.getDay() === 6;
            if (weekdaysOnly && isWeekend && endDate !== startDate) continue;
            dates.push(iso);
          }
          if (!dates.length) { msg.innerHTML = `<div class="error-box">No days to book in that range (weekends skipped).</div>`; return; }
          if (dates.length * staffIds.length > 60) { msg.innerHTML = `<div class="error-box">That's ${dates.length * staffIds.length} bookings in one go - book a smaller range.</div>`; return; }

          bookBtn.disabled = true; bookBtn.textContent = 'Booking...'; msg.innerHTML = '';
          try {
            if (isJob) {
              const blocking = await requiredTasksBlockingSchedule(project.id);
              if (blocking.length) throw new Error(`This job can't be scheduled yet - required task${blocking.length > 1 ? 's' : ''} not done: ${blocking.join('; ')}`);
            }
            const { data: existing } = await supabaseClient.from('schedule_assignments')
              .select('staff_id, assignment_date, start_time, end_time, profiles(full_name), projects(name, job_number)')
              .in('staff_id', staffIds).gte('assignment_date', dates[0]).lte('assignment_date', dates[dates.length - 1]);
            const clashes = [];
            staffIds.forEach(sid => dates.forEach(d => {
              (existing || []).filter(e => e.staff_id === sid && e.assignment_date === d && toSec(e.start_time) < toSec(end) && toSec(start) < toSec(e.end_time))
                .forEach(e => clashes.push(`${(e.profiles && e.profiles.full_name) || 'Someone'} on ${fmtDay(d)}: already booked ${hhmm(e.start_time)}-${hhmm(e.end_time)}${e.projects ? ' (' + (e.projects.name || 'job') + ')' : ''}`));
            }));
            if (clashes.length && !confirm(`Some of these are already booked:\n\n${clashes.slice(0, 8).join('\n')}${clashes.length > 8 ? '\n...' : ''}\n\nBook anyway?`)) {
              bookBtn.disabled = false; bookBtn.textContent = 'Book';
              return;
            }
            const rows = [];
            staffIds.forEach(sid => dates.forEach(d => rows.push({
              staff_id: sid, project_id: project.id, block_type: isJob ? 'job' : 'site_visit',
              assignment_date: d, start_time: start, end_time: end, note,
            })));
            const { error } = await supabaseClient.from('schedule_assignments').insert(rows);
            if (error) throw error;
            if (isJob) await supabaseClient.from('projects').update({ pipeline_stage: 'job_booked' }).eq('id', project.id).eq('pipeline_stage', 'ready_to_book');
            await logActivity('project', project.id, 'staff_scheduled', `Scheduled ${staffIds.length} ${staffIds.length === 1 ? 'person' : 'people'} for ${dates.length} day${dates.length === 1 ? '' : 's'} from ${fmtDay(dates[0])}`);
            await render();
            overlay.querySelector('#sched-msg').innerHTML = `<div class="success-box">Booked ${rows.length} ${rows.length === 1 ? 'slot' : 'slots'}.</div>`;
          } catch (err) {
            msg.innerHTML = `<div class="error-box">${err.message}</div>`;
            bookBtn.disabled = false; bookBtn.textContent = 'Book';
          }
        });
      }
      await render();
    }

    // Electrical schedule card (Summary tab): totals from the latest
    // marked-up plan, with a button that exports them as a schedule PDF into
    // the job's Documents (Schedules folder). The numbers come from the
    // plan_summary saved when a marked-up copy of a plan is made.
    async function loadPlanScheduleCard(project) {
      const el = document.getElementById('plan-schedule-card');
      if (!el || typeof buildScheduleReportPdf !== 'function') return;
      const { data: docs } = await supabaseClient
        .from('project_documents')
        .select('id, file_name, created_at, page_names, plan_summary')
        .eq('project_id', project.id)
        .not('plan_summary', 'is', null)
        .order('created_at', { ascending: false });
      const usable = (docs || []).filter(d => !planSummaryIsEmpty(d.plan_summary));
      if (!usable.length) { el.innerHTML = ''; return; }

      const render = (doc) => {
        const t = totalPlanSummary(doc.plan_summary);
        const symbolCount = Object.values(t.symbols).reduce((a, b) => a + b, 0);
        const metres = Object.values(t.cables).reduce((a, c) => a + c.metres, 0);
        const bits = [
          symbolCount ? `${symbolCount} symbol${symbolCount === 1 ? '' : 's'}` : null,
          Object.keys(t.circuits).length ? `${Object.keys(t.circuits).length} circuit${Object.keys(t.circuits).length === 1 ? '' : 's'}` : null,
          Object.keys(t.cables).length ? `cables ${metres > 0 ? metres.toFixed(1) + ' m measured' : '(no scale set)'}` : null,
        ].filter(Boolean).join(' &middot; ');
        return bits;
      };
      el.innerHTML = `
        <div class="card">
          <h2>Electrical schedule</h2>
          <p class="subtitle" style="margin-bottom:8px;">Symbols, circuits and cable lengths marked up on the plans - export it as a PDF to send or attach to the quote.</p>
          ${usable.length > 1 ? `
            <label style="margin-top:0;">From plan</label>
            <select id="plan-schedule-source">${usable.map((d, i) => `<option value="${i}">${escapeHtml(d.file_name)} (${new Date(d.created_at).toLocaleDateString('en-AU')})</option>`).join('')}</select>` : `<p class="subtitle" style="margin:0 0 8px;">From <strong>${escapeHtml(usable[0].file_name)}</strong></p>`}
          <p id="plan-schedule-totals" style="margin:8px 0 12px;">${render(usable[0])}</p>
          <button type="button" id="plan-schedule-export">Export schedule PDF</button>
          <div id="plan-schedule-msg"></div>
        </div>`;

      const pick = () => usable[parseInt((document.getElementById('plan-schedule-source') || { value: 0 }).value, 10) || 0];
      const sourceSel = document.getElementById('plan-schedule-source');
      if (sourceSel) sourceSel.addEventListener('change', () => { document.getElementById('plan-schedule-totals').innerHTML = render(pick()); });
      document.getElementById('plan-schedule-export').addEventListener('click', async () => {
        const btn = document.getElementById('plan-schedule-export');
        const msg = document.getElementById('plan-schedule-msg');
        const doc = pick();
        btn.disabled = true; btn.textContent = 'Building...'; msg.innerHTML = '';
        try {
          const PDFLib = await loadPdfLib();
          const { data: company } = await supabaseClient.from('company_settings').select('company_name').eq('id', 1).maybeSingle();
          const bytes = await buildScheduleReportPdf(PDFLib, {
            company: company && company.company_name, projectName: project.name, clientName: project.client_name,
            ref: projectRef(project), sourceName: doc.file_name, pageNames: doc.page_names || [], summary: doc.plan_summary,
          });
          const { data: { user } } = await supabaseClient.auth.getUser();
          const path = `documents/${project.id}/${Date.now()}-schedule.pdf`;
          const { error: upErr } = await supabaseClient.storage.from('project-documents').upload(path, new Blob([bytes], { type: 'application/pdf' }), { contentType: 'application/pdf' });
          if (upErr) throw upErr;
          const fileName = `Electrical schedule - ${project.name}.pdf`;
          const { error: insErr } = await supabaseClient.from('project_documents').insert({
            project_id: project.id, folder: 'Schedules', file_path: path, file_name: fileName, mime_type: 'application/pdf', uploaded_by: user.id,
          });
          if (insErr) throw insErr;
          await logActivity('project', project.id, 'schedule_exported', 'Exported the electrical schedule PDF');
          msg.innerHTML = `<div class="success-box">Saved to Documents &gt; Schedules.</div>`;
          openPdfViewer(path, fileName, { projectId: project.id, folder: 'Schedules', onSaved: () => loadDocuments(project.id) });
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        } finally {
          btn.disabled = false; btn.textContent = 'Export schedule PDF';
        }
      });
    }

    // Site photos (project_photos) were being written at clock-out this
    // whole time but never actually shown anywhere - this is the first
    // place they're rendered, so a job with 30+ photos from the field has
    // somewhere to browse them instead of piling up unseen.
    async function loadSitePhotos(projectId) {
      const listEl = document.getElementById('site-photos-list');
      const { data: photos, error } = await supabaseClient
        .from('project_photos')
        .select('id, url, caption, staff_id, created_at, profiles(full_name)')
        .eq('project_id', projectId)
        .order('created_at', { ascending: false });
      if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }
      if (!photos.length) { listEl.innerHTML = `<p class="subtitle">No site photos yet.</p>`; return; }

      const urls = photos.map(p => p.url);
      const captions = photos.map(p => p.caption || '');
      listEl.innerHTML = `
        <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:12px;">
          ${photos.map((p, i) => `
            <div style="border:1px solid var(--border); border-radius:8px; overflow:hidden;">
              <img src="${supaImageVariant(p.url, 400, 70)}" data-i="${i}" class="site-photo-view" style="width:100%; height:110px; object-fit:cover; cursor:pointer; display:block;" />
              <div style="padding:6px 8px; font-size:11px; color:var(--muted);">
                ${p.caption ? `<strong style="color:var(--text); font-size:12px;">${escapeHtml(p.caption)}</strong><br>` : ''}${p.profiles?.full_name || 'Unknown'}<br>${new Date(p.created_at).toLocaleDateString('en-AU')}
              </div>
            </div>
          `).join('')}
        </div>`;

      listEl.querySelectorAll('.site-photo-view').forEach(img => {
        img.addEventListener('click', () => openPhotoLightbox(urls, parseInt(img.dataset.i), {
          captions,
          onRename: async (i, name) => {
            const { error: renameErr } = await supabaseClient.from('project_photos').update({ caption: name || null }).eq('id', photos[i].id);
            if (renameErr) throw renameErr;
          },
          // The marked-up picture is saved as a new photo alongside the
          // original, so nothing is ever overwritten.
          onMarkup: async (i, blob) => {
            const { data: { user } } = await supabaseClient.auth.getUser();
            const path = `${projectId}/${Date.now()}-markup.jpg`;
            const { error: upErr } = await supabaseClient.storage.from('site-photos').upload(path, blob, { contentType: 'image/jpeg' });
            if (upErr) throw upErr;
            const { data: pub } = supabaseClient.storage.from('site-photos').getPublicUrl(path);
            const base = captions[i] || 'Photo';
            const { error: insErr } = await supabaseClient.from('project_photos').insert({
              project_id: projectId, staff_id: user.id, url: pub.publicUrl, caption: `${base} (marked up)`,
            });
            if (insErr) throw insErr;
          },
          onClose: () => loadSitePhotos(projectId),
        }));
      });
    }

    function wireSitePhotoUpload(projectId) {
      document.getElementById('site-photo-file').addEventListener('change', async () => {
        const fileInput = document.getElementById('site-photo-file');
        const msg = document.getElementById('site-photo-upload-msg');
        if (!fileInput.files.length) return;
        msg.innerHTML = `<p class="subtitle">Uploading...</p>`;
        try {
          const { data: { user } } = await supabaseClient.auth.getUser();
          const urls = await uploadPhotos(fileInput.files, projectId, 'site-photos');
          const { error } = await supabaseClient.from('project_photos').insert(urls.map(url => ({ project_id: projectId, staff_id: user.id, url })));
          if (error) throw error;
          fileInput.value = '';
          msg.innerHTML = '';
          await loadSitePhotos(projectId);
