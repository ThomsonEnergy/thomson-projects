    function wireDocumentUpload(project) {
      document.getElementById('doc-file-input').addEventListener('change', async () => {
        const fileInput = document.getElementById('doc-file-input');
        const msg = document.getElementById('doc-upload-msg');
        const newFolder = document.getElementById('doc-new-folder').value.trim();
        const folder = newFolder || document.getElementById('doc-folder-select').value || 'General';
        if (!fileInput.files.length) return;

        msg.innerHTML = `<p class="subtitle">Uploading...</p>`;
        fileInput.disabled = true;
        try {
          const { data: { user } } = await supabaseClient.auth.getUser();
          for (const file of fileInput.files) {
            const path = await uploadPrivateFile(file, `documents/${project.id}`);
            const { error } = await supabaseClient.from('project_documents').insert({
              project_id: project.id, folder, file_path: path, file_name: file.name, mime_type: file.type, uploaded_by: user.id,
            });
            if (error) throw error;
          }
          await logActivity('project', project.id, 'documents_uploaded', `Uploaded ${fileInput.files.length} document${fileInput.files.length === 1 ? '' : 's'} to ${folder}`);
          const count = fileInput.files.length;
          fileInput.value = '';
          document.getElementById('doc-new-folder').value = '';
          selectedDocFolder = folder;
          await loadDocuments(project.id);
          msg.innerHTML = `<div class="success-box">${count} document${count === 1 ? '' : 's'} added.</div>`;
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        } finally {
          fileInput.disabled = false;
        }
      });
    }

    async function loadPurchaseOrders(projectId, centres) {
      const { data: pos, error } = await supabaseClient
        .from('purchase_orders')
        .select('*, purchase_order_line_items(*), suppliers(name)')
        .eq('project_id', projectId)
        .order('created_at', { ascending: false });

      // Wired up unconditionally, before any early return below - this
      // button previously only got its click handler when the project
      // already had at least one PO, so a brand new job's "Create
      // purchase order" button silently did nothing.
      document.getElementById('create-po-btn').onclick = () => openCreatePoPanel(projectId, centres);
      const suggestBtn = document.getElementById('suggest-po-btn');
      if (suggestBtn) suggestBtn.onclick = () => openSuggestPoPanel(projectId, centres);

      const listEl = document.getElementById('po-list');
      const summaryEl = document.getElementById('summary-po-line');
      if (error) {
        listEl.innerHTML = `<div class="error-box">${error.message}</div>`;
        if (summaryEl) summaryEl.innerHTML = `<div class="error-box">${error.message}</div>`;
        return;
      }
      if (!pos.length) {
        listEl.innerHTML = `<p class="subtitle">No purchase orders logged yet.</p>`;
        if (summaryEl) summaryEl.innerHTML = `<p class="subtitle">No purchase orders yet.</p>`;
        return;
      }

      if (summaryEl) {
        const receivedCount = pos.filter(po => po.received).length;
        summaryEl.innerHTML = `<p class="subtitle">${receivedCount} of ${pos.length} purchase order${pos.length === 1 ? '' : 's'} fully received.</p>`;
      }

      const stageName = (id) => (centres.find(c => c.id === id) || {}).name || 'Whole project';
      const myRole = await getMyRole();
      const canOverride = myRole === 'admin' || myRole === 'finance';

      listEl.innerHTML = pos.map(po => {
        const items = po.purchase_order_line_items || [];
        const itemsTotal = items.reduce((s, li) => s + (Number(li.quantity) * Number(li.unit_cost)), 0);
        const total = items.length ? itemsTotal : Number(po.amount) || 0;
        const supplierLabel = po.suppliers?.name || po.supplier_name || 'Unknown supplier';
        const budgetPercent = po.po_type === 'open' && po.budget_cap ? Math.round((total / Number(po.budget_cap)) * 100) : null;

        return `
          <div style="border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:12px;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px;">
              <div>
                <strong>${supplierLabel}</strong>${po.po_number ? ` (${po.po_number})` : ''}
                <span class="badge draft" style="margin-left:6px;">${po.po_type === 'open' ? 'Open-ended' : 'Fixed'}</span>
                ${po.locked ? '<span class="badge draft">Locked</span>' : ''}
              </div>
              <div>
                <span class="badge ${po.status === 'paid' || po.status === 'invoiced' ? 'accepted' : 'draft'}">${po.status}</span>
                <span style="font-weight:600; margin-left:8px;">${money(total)}</span>
              </div>
            </div>
            <p class="subtitle" style="margin:6px 0;">${stageName(po.cost_centre_id)}${po.description ? ' - ' + po.description : ''}</p>

            <div style="margin-top:8px;">${renderPoLineItemsReceivable(po, true)}</div>

            ${po.po_type === 'open' && po.budget_cap ? `
              <div style="margin-top:10px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                  <span class="subtitle">Budget used</span>
                  <span style="font-weight:600; color:${budgetPercent > 100 ? 'var(--red)' : 'var(--green)'};">${budgetPercent}%</span>
                </div>
                <div style="background:var(--surface-2); border-radius:999px; height:8px; overflow:hidden;">
                  <div style="background:${budgetPercent > 100 ? 'var(--red)' : 'var(--green)'}; width:${Math.min(100, budgetPercent)}%; height:100%;"></div>
                </div>
              </div>` : ''}

            ${po.file_path ? `<a href="#" class="link-quiet view-doc" data-path="${po.file_path}" style="display:block; margin-top:8px; font-size:13px;">${po.file_name || 'View attached document'}</a>` : ''}

            <div style="margin-top:10px; display:flex; gap:8px; flex-wrap:wrap;">
              ${po.po_type === 'open' && !po.locked ? `<button type="button" class="secondary add-po-item-btn" data-po-id="${po.id}" style="font-size:12px; padding:6px 10px;">+ Add item</button>` : ''}
              ${po.po_type === 'fixed' && po.locked && canOverride ? `<button type="button" class="secondary override-po-btn" data-po-id="${po.id}" style="font-size:12px; padding:6px 10px;">Override (Admin/Finance)</button>` : ''}
              ${po.supplier_id && !po.received ? `<button type="button" class="secondary upload-invoice-btn" data-po-id="${po.id}" style="font-size:12px; padding:6px 10px;">Upload invoice</button>` : ''}
              ${po.received ? `<span class="badge accepted" style="font-size:11px;">Fully received</span>` : ''}
            </div>
          </div>`;
      }).join('') + `<p class="subtitle" style="margin-top:6px;">Total: ${money(pos.reduce((s, p) => {
        const items = p.purchase_order_line_items || [];
        return s + (items.length ? items.reduce((s2, li) => s2 + Number(li.quantity) * Number(li.unit_cost), 0) : Number(p.amount) || 0);
      }, 0))}</p>`;

      listEl.querySelectorAll('.view-doc').forEach(a => {
        a.addEventListener('click', async (e) => {
          e.preventDefault();
          try {
            const url = await getSignedDocUrl(a.dataset.path);
            window.open(url, '_blank');
          } catch (err) {
            alert(err.message);
          }
        });
      });
      listEl.querySelectorAll('.add-po-item-btn').forEach(btn => {
        btn.addEventListener('click', () => openAddPoItemPanel(btn.dataset.poId, projectId, centres));
      });
      listEl.querySelectorAll('.override-po-btn').forEach(btn => {
        btn.addEventListener('click', () => openOverridePoPanel(pos.find(p => p.id === btn.dataset.poId), projectId, centres));
      });
      listEl.querySelectorAll('.upload-invoice-btn').forEach(btn => {
        btn.addEventListener('click', () => uploadInvoiceForPo(pos.find(p => p.id === btn.dataset.poId)));
      });
      wireReceiveLineItemButtons(
        listEl,
        pos,
        (po) => po.vehicle_id ? 'vehicle' : 'job', // POs on this page belong to this job by default
        () => loadPurchaseOrders(projectId, centres)
      );
    }

    function fuzzyMatchScore(a, b) {
      const norm = (s) => (s || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(w => w.length > 2);
      const wordsA = new Set(norm(a));
      const wordsB = norm(b);
      if (!wordsA.size || !wordsB.length) return 0;
      const matches = wordsB.filter(w => wordsA.has(w)).length;
      return matches / Math.max(wordsA.size, wordsB.length);
    }

    async function openSuggestPoPanel(projectId, centres) {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `<div class="card" style="max-width:400px; width:100%;"><p class="subtitle">Matching quoted materials against Stock...</p></div>`;
      document.body.appendChild(overlay);

      const { data: materials } = await supabaseClient.from('materials').select('id, name, cost_price, supplier_id, quantity_on_hand, suppliers(name)');
      const { data: existingPOItems } = await supabaseClient
        .from('purchase_order_line_items')
        .select('material_id, purchase_orders!inner(project_id)')
        .eq('purchase_orders.project_id', projectId);
      const alreadyOrderedMaterialIds = new Set((existingPOItems || []).map(x => x.material_id).filter(Boolean));

      const quotedMaterials = centres.flatMap(c => (c.cost_centre_line_items || [])
        .filter(li => li.item_type === 'material')
        .map(li => ({ ...li, stageName: c.name, costCentreId: c.id })));

      const matched = {}; // supplier_id -> { supplierName, items: [] }
      const unassigned = [];
      const fromStock = []; // covered by what's already on hand - never ordered at all

      quotedMaterials.forEach(li => {
        let bestMatch = null, bestScore = 0;
        (materials || []).forEach(m => {
          const score = fuzzyMatchScore(m.name, li.description);
          if (score > bestScore) { bestScore = score; bestMatch = m; }
        });
        const match = bestScore >= 0.3 ? bestMatch : null;
        if (match && alreadyOrderedMaterialIds.has(match.id)) return; // already on a PO for this job, skip

        const onHand = Number(match?.quantity_on_hand) || 0;
        const quotedQty = Number(li.quantity) || 0;
        const coveredByStock = match ? Math.min(quotedQty, onHand) : 0;
        const stillNeeded = quotedQty - coveredByStock;

        if (coveredByStock > 0) {
          fromStock.push({ description: li.description, quantity: coveredByStock, unit_cost: match.cost_price, materialId: match.id, costCentreId: li.costCentreId, stageName: li.stageName });
        }
        if (stillNeeded <= 0) return; // fully covered by existing stock, nothing to order

        if (match && match.supplier_id) {
          if (!matched[match.supplier_id]) matched[match.supplier_id] = { supplierName: match.suppliers?.name || 'Unknown', items: [] };
          matched[match.supplier_id].items.push({ description: li.description, quantity: stillNeeded, unit_cost: match.cost_price, materialId: match.id, stageName: li.stageName });
        } else {
          unassigned.push({ description: li.description, quantity: stillNeeded, unit_cost: li.unit_cost, materialId: match?.id || null, stageName: li.stageName });
        }
      });

      const { data: suppliers } = await supabaseClient.from('suppliers').select('id, name').order('name');

      if (!Object.keys(matched).length && !unassigned.length && !fromStock.length) {
        overlay.querySelector('.card').innerHTML = `<h2>Nothing to suggest</h2><p class="subtitle">Every quoted material is either already on a PO for this job, or there are no material line items quoted.</p><button type="button" class="secondary" id="sp-close-btn">Close</button>`;
        overlay.querySelector('#sp-close-btn').addEventListener('click', () => overlay.remove());
        return;
      }

      overlay.style.overflowY = 'auto';
      overlay.innerHTML = `
        <div class="card" style="max-width:720px; width:100%; max-height:90vh; overflow-y:auto;">
          <h2>Suggested purchase orders</h2>
          <p class="subtitle" style="margin-bottom:14px;">Nothing's created yet - review each supplier group, then confirm.</p>

          ${fromStock.length ? `
            <div style="border:1px solid var(--green); border-radius:8px; padding:12px; margin-bottom:10px;">
              <p style="margin:0 0 8px; color:var(--green); font-weight:600;">Already covered by Stock - nothing to order</p>
              ${fromStock.map(item => `<div style="font-size:13px; display:flex; justify-content:space-between; padding:4px 0;"><span>${item.description} (${item.stageName}) x${item.quantity}</span><span>${money(item.quantity * item.unit_cost)}</span></div>`).join('')}
              <p class="subtitle" style="margin-top:6px;">This will be deducted from Stock and costed directly to the job when you confirm.</p>
            </div>` : ''}

          ${Object.entries(matched).map(([supplierId, group]) => `
            <div class="sp-group" data-supplier-id="${supplierId}" style="border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px;">
              <label style="margin-top:0; display:flex; align-items:center; gap:8px;"><input type="checkbox" class="sp-include" checked style="width:auto;" /><strong>${group.supplierName}</strong></label>
              ${group.items.map(item => `<div style="font-size:13px; display:flex; justify-content:space-between; padding:4px 0;"><span>${item.description} (${item.stageName}) x${item.quantity}</span><span>${money(item.quantity * item.unit_cost)}</span></div>`).join('')}
              <p class="subtitle" style="margin-top:6px;">Total: ${money(group.items.reduce((s, i) => s + i.quantity * i.unit_cost, 0))}</p>
            </div>`).join('')}

          ${unassigned.length ? `
            <div style="border:1px solid var(--red); border-radius:8px; padding:12px; margin-bottom:10px;">
              <p style="margin:0 0 8px; color:var(--red); font-weight:600;">Needs a supplier assigned</p>
              ${unassigned.map((item, i) => `
                <div class="sp-unassigned-row" data-index="${i}" style="margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--border);">
                  <span style="font-size:13px;">${item.description} (${item.stageName}) x${item.quantity}</span>
                  <p class="subtitle" style="margin:2px 0 4px;">Leave blank to skip ordering this item for now.</p>
                  ${supplierPickerHtml({ search: `sp-unassigned-search-${i}`, results: `sp-unassigned-results-${i}`, selected: `sp-unassigned-selected-${i}`, newSection: `sp-unassigned-new-section-${i}`, newEmail: `sp-unassigned-new-email-${i}`, newPhone: `sp-unassigned-new-phone-${i}` })}
                </div>`).join('')}
            </div>` : ''}

          <div style="margin-top:14px;">
            <button id="sp-confirm-btn">Confirm</button>
            <button type="button" class="secondary" id="sp-cancel-btn">Cancel</button>
          </div>
          <div id="sp-msg"></div>
        </div>`;

      const unassignedResolvers = unassigned.map((item, i) => wireSupplierPicker(overlay, suppliers, {
        search: `sp-unassigned-search-${i}`, results: `sp-unassigned-results-${i}`, selected: `sp-unassigned-selected-${i}`,
        newSection: `sp-unassigned-new-section-${i}`, newEmail: `sp-unassigned-new-email-${i}`, newPhone: `sp-unassigned-new-phone-${i}`,
      }));

      overlay.querySelector('#sp-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#sp-confirm-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#sp-msg');
        const confirmBtn = overlay.querySelector('#sp-confirm-btn');
        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Creating...';

        try {
          const { data: { user } } = await supabaseClient.auth.getUser();
          let created = 0;

          // Deduct what's covered by existing stock and cost it straight
          // to the job - this portion is never ordered at all.
          for (const item of fromStock) {
            await supabaseClient.from('job_material_usage').insert({
              project_id: projectId, cost_centre_id: item.costCentreId, material_id: item.materialId,
              quantity: item.quantity, unit_cost: item.unit_cost, source: 'from_stock', created_by: user.id,
            });
            await adjustWarehouseStock(item.materialId, -item.quantity);
          }

          for (const groupEl of overlay.querySelectorAll('.sp-group')) {
            if (!groupEl.querySelector('.sp-include').checked) continue;
            const supplierId = groupEl.dataset.supplierId;
            const group = matched[supplierId];
            const poNumber = await drawNextPoNumber();
            const { data: newPo, error: poErr } = await supabaseClient.from('purchase_orders').insert({
              project_id: projectId, supplier_id: supplierId, supplier_name: group.supplierName,
              po_number: poNumber,
              po_type: 'fixed', locked: true, status: 'ordered', amount: 0,
              description: 'Auto-suggested from quoted materials',
            }).select('id').single();
            if (poErr) throw poErr;
            await logActivity('purchase_order', newPo.id, 'created', `PO created for ${group.supplierName} (auto-suggested from quote)`);
            await createPoFollowUpTask(projectId, poNumber, group.supplierName);
            await supabaseClient.from('purchase_order_line_items').insert(
              group.items.map(item => ({ po_id: newPo.id, material_id: item.materialId, description: item.description, quantity: item.quantity, unit_cost: item.unit_cost, added_by: user.id }))
            );
            created++;
          }

          // Group manually-assigned unassigned items by the supplier picked
          // (typing a new name creates that supplier here, same as any
          // other "create a PO" panel) - blank means skip.
          const manualGroups = {}; // supplierId -> { supplierName, items }
          for (const row of overlay.querySelectorAll('.sp-unassigned-row')) {
            const { supplierId, supplierName } = await unassignedResolvers[parseInt(row.dataset.index)]();
            if (!supplierId) continue;
            const item = unassigned[parseInt(row.dataset.index)];
            if (!manualGroups[supplierId]) manualGroups[supplierId] = { supplierName, items: [] };
            manualGroups[supplierId].items.push(item);
          }
          for (const [supplierId, group] of Object.entries(manualGroups)) {
            const { supplierName, items } = group;
            const poNumber = await drawNextPoNumber();
            const { data: newPo, error: poErr } = await supabaseClient.from('purchase_orders').insert({
              project_id: projectId, supplier_id: supplierId, supplier_name: supplierName,
              po_number: poNumber,
              po_type: 'fixed', locked: true, status: 'ordered', amount: 0,
              description: 'Auto-suggested from quoted materials (manually assigned)',
            }).select('id').single();
            if (poErr) throw poErr;
            await logActivity('purchase_order', newPo.id, 'created', `PO created for ${supplierName} (auto-suggested, manually assigned)`);
            await createPoFollowUpTask(projectId, poNumber, supplierName);
            await supabaseClient.from('purchase_order_line_items').insert(
              items.map(item => ({ po_id: newPo.id, material_id: item.materialId, description: item.description, quantity: item.quantity, unit_cost: item.unit_cost, added_by: user.id }))
            );
            created++;
          }

          overlay.remove();
          alert(`Created ${created} purchase order${created === 1 ? '' : 's'}.`);
          await loadPurchaseOrders(projectId, centres);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
          confirmBtn.disabled = false;
          confirmBtn.textContent = 'Create purchase orders';
        }
      });
    }

    async function openCreatePoPanel(projectId, centres) {
      const { data: suppliers } = await supabaseClient.from('suppliers').select('id, name').order('name');
      const { data: materials } = await supabaseClient.from('materials').select('id, name, cost_price').order('name');
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:560px; width:100%; max-height:90vh; overflow-y:auto;">
          <h2>Create purchase order</h2>
          <label style="margin-top:0">Supplier</label>
          ${supplierPickerHtml({ search: 'cp-supplier-search', results: 'cp-supplier-results', selected: 'cp-supplier-selected', newSection: 'cp-supplier-new-section', newEmail: 'cp-supplier-new-email', newPhone: 'cp-supplier-new-phone' })}
          <button type="button" class="secondary" id="cp-upload-invoice-btn" style="margin-top:8px; font-size:12px; padding:6px 10px;">Or upload the supplier's invoice instead</button>
          <label style="margin-top:14px;">Stage (optional)</label>
          <select id="cp-stage"><option value="">Whole project</option>${centres.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select>
          <label>Description</label>
          <input id="cp-description" />

          <label style="margin-top:14px;">Type</label>
          <div style="display:flex; gap:16px; margin-bottom:10px;">
            <label style="display:flex; align-items:center; gap:6px; margin-top:0;"><input type="radio" name="cp-type" value="fixed" checked style="width:auto;" /> Fixed - items decided now, locked once sent</label>
          </div>
          <div style="display:flex; gap:16px; margin-bottom:10px;">
            <label style="display:flex; align-items:center; gap:6px; margin-top:0;"><input type="radio" name="cp-type" value="open" style="width:auto;" /> Open-ended - starts empty, anyone can add items as the job goes</label>
          </div>

          <div id="cp-fixed-section">
            <label>Line items</label>
            <div id="cp-fixed-items-container"></div>
            <button type="button" class="secondary" id="cp-add-line-btn" style="font-size:12px; padding:6px 10px;">+ Add line</button>
          </div>
          <div id="cp-open-section" style="display:none;">
            <label>Budget cap (optional)</label>
            <input id="cp-budget-cap" type="number" step="0.01" placeholder="Flag when spending gets close to this" />
          </div>

          <label style="margin-top:14px;">Attach document (optional)</label>
          <input type="file" id="cp-file" />

          <div style="margin-top:14px;">
            <button id="cp-save-btn">Create PO</button>
            <button type="button" class="secondary" id="cp-cancel-btn">Cancel</button>
          </div>
          <div id="cp-msg"></div>
        </div>`;
      document.body.appendChild(overlay);

      const resolveSupplier = wireSupplierPicker(overlay, suppliers, { search: 'cp-supplier-search', results: 'cp-supplier-results', selected: 'cp-supplier-selected', newSection: 'cp-supplier-new-section', newEmail: 'cp-supplier-new-email', newPhone: 'cp-supplier-new-phone' });
      wireUploadInvoiceButton(overlay.querySelector('#cp-upload-invoice-btn'), overlay.querySelector('#cp-msg'));

      buildMaterialSearchRow(materials || [], 'cp-fixed-items-container');
      overlay.querySelector('#cp-add-line-btn').addEventListener('click', () => buildMaterialSearchRow(materials || [], 'cp-fixed-items-container'));

      overlay.querySelectorAll('input[name="cp-type"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
          overlay.querySelector('#cp-fixed-section').style.display = e.target.value === 'fixed' ? 'block' : 'none';
          overlay.querySelector('#cp-open-section').style.display = e.target.value === 'open' ? 'block' : 'none';
        });
      });

      overlay.querySelector('#cp-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#cp-save-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#cp-msg');
        const poType = overlay.querySelector('input[name="cp-type"]:checked').value;

        try {
          const { supplierId, supplierName } = await resolveSupplier();
          if (!supplierId) { msg.innerHTML = `<div class="error-box">Search for an existing supplier or type a new one.</div>`; return; }

          const { data: { user } } = await supabaseClient.auth.getUser();
          const fileInput = overlay.querySelector('#cp-file');
          let file_path = null, file_name = null;
          if (fileInput.files.length) {
            file_path = await uploadPrivateFile(fileInput.files[0], projectId);
            file_name = fileInput.files[0].name;
          }

          const { data: newPo, error: poErr } = await supabaseClient.from('purchase_orders').insert({
            project_id: projectId,
            cost_centre_id: overlay.querySelector('#cp-stage').value || null,
            supplier_id: supplierId,
            supplier_name: supplierName,
            po_number: await drawNextPoNumber(),
            description: overlay.querySelector('#cp-description').value.trim() || null,
            po_type: poType,
            locked: poType === 'fixed',
            budget_cap: poType === 'open' ? (parseFloat(overlay.querySelector('#cp-budget-cap').value) || null) : null,
            status: 'ordered',
            amount: 0,
            file_path, file_name,
          }).select('id, po_number').single();
          if (poErr) throw poErr;
          await logActivity('purchase_order', newPo.id, 'created', `PO ${newPo.po_number || ''} created for ${supplierName}`);
          await logActivity('project', projectId, 'po_created', `PO ${newPo.po_number || ''} created for ${supplierName}`);
          await createPoFollowUpTask(projectId, newPo.po_number, supplierName);

          if (poType === 'fixed') {
            const lines = readMaterialLineRows('cp-fixed-items-container').map(l => ({
              po_id: newPo.id, material_id: l.materialId, description: l.description,
              quantity: l.quantity, unit_cost: l.unit_cost, added_by: user.id,
            }));
            if (lines.length) {
              const { error: liErr } = await supabaseClient.from('purchase_order_line_items').insert(lines);
              if (liErr) throw liErr;
            }
          }

          overlay.remove();
          await loadPurchaseOrders(projectId, centres);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        }
      });
    }

    function openAddPoItemPanel(poId, projectId, centres) {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:400px; width:100%;">
          <h2>Add item</h2>
          <label style="margin-top:0">Description</label>
          <input id="ap-desc" />
          <div class="grid cols-2">
            <div><label>Quantity</label><input id="ap-qty" type="number" step="0.01" value="1" /></div>
            <div><label>Unit cost</label><input id="ap-cost" type="number" step="0.01" /></div>
          </div>
          <div style="margin-top:14px;">
            <button id="ap-save-btn">Add</button>
            <button type="button" class="secondary" id="ap-cancel-btn">Cancel</button>
          </div>
          <div id="ap-msg"></div>
        </div>`;
      document.body.appendChild(overlay);

      overlay.querySelector('#ap-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#ap-save-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#ap-msg');
        const description = overlay.querySelector('#ap-desc').value.trim();
        if (!description) { msg.innerHTML = `<div class="error-box">Enter a description.</div>`; return; }
        const { data: { user } } = await supabaseClient.auth.getUser();
        const { error } = await supabaseClient.from('purchase_order_line_items').insert({
          po_id: poId,
          description,
          quantity: parseFloat(overlay.querySelector('#ap-qty').value) || 1,
          unit_cost: parseFloat(overlay.querySelector('#ap-cost').value) || 0,
          added_by: user.id,
        });
        if (error) { msg.innerHTML = `<div class="error-box">${error.message}</div>`; return; }
        overlay.remove();
        await loadPurchaseOrders(projectId, centres);
      });
    }

    function openOverridePoPanel(po, projectId, centres) {
      const items = po.purchase_order_line_items || [];
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; overflow-y:auto;';
      overlay.innerHTML = `
        <div class="card" style="max-width:520px; width:100%; max-height:85vh; overflow-y:auto;">
          <h2>Override PO ${po.po_number || ''}</h2>
          <p class="subtitle" style="margin-bottom:10px;">This PO was sent and locked - only Admin/Finance can adjust it after the fact, for when the real invoice comes in different.</p>
          <div id="ov-items">
            ${items.map(li => `
              <div class="ov-line" data-id="${li.id}" style="display:grid; grid-template-columns:2fr 1fr 1fr; gap:6px; margin-bottom:6px;">
                <input class="ov-desc" value="${li.description}" style="font-size:13px;" />
                <input class="ov-qty" type="number" step="0.01" value="${li.quantity}" style="font-size:13px;" />
                <input class="ov-cost" type="number" step="0.01" value="${li.unit_cost}" style="font-size:13px;" />
              </div>`).join('')}
          </div>
          <div style="margin-top:14px;">
            <button id="ov-save-btn">Save changes</button>
            <button type="button" class="secondary" id="ov-cancel-btn">Cancel</button>
          </div>
          <div id="ov-msg"></div>
        </div>`;
      document.body.appendChild(overlay);

      overlay.querySelector('#ov-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#ov-save-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#ov-msg');
        try {
          const rows = [...overlay.querySelectorAll('.ov-line')];
          for (const row of rows) {
            await supabaseClient.from('purchase_order_line_items').update({
              description: row.querySelector('.ov-desc').value.trim(),
              quantity: parseFloat(row.querySelector('.ov-qty').value) || 0,
              unit_cost: parseFloat(row.querySelector('.ov-cost').value) || 0,
            }).eq('id', row.dataset.id);
          }
          overlay.remove();
          await loadPurchaseOrders(projectId, centres);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        }
      });
    }

    (async function () {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();
      renderMainNav('job-pipeline');
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });
      const project = await loadProject();
      const myRole = await getMyRole();
      if (project) render(project, isPricingRole(myRole));
    })();
  </script>
