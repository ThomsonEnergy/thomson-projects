          if (client) {
            document.getElementById('client-search-input').value = client.name;
            document.getElementById('p-payment-terms').value = client.payment_terms || 'cod';
            document.getElementById('selected-client-note').innerHTML = `Linked to existing client: <strong>${escapeHtml(client.name)}</strong>. <a class="link-quiet" href="/clients.html" target="_blank">View on Clients page</a>.`;
            await sitePicker.setClient(client);
          }
          await loadEditJobContactPickers(project.client_id, {
            project_manager_contact_id: project.project_manager_contact_id,
            site_contact_id: project.site_contact_id,
            job_contact_id: project.job_contact_id,
            sales_contact_id: project.sales_contact_id,
            accounts_contact_id: project.accounts_contact_id,
          });
        }
      } else {
        // addRow()'s singleStage check still needs a real template - jobs
        // don't show the picker, so just carry the job's own template
        // through without touching any Details-tab DOM.
        currentTemplate = project.proposal_template || 'new_build';
      }

      pylonKw = project.pylon_data?.summary?.dc_output_kw || null;
      lastPylonData = project.pylon_data || null;
      const stages = (project.cost_centres || []).slice().sort((a, b) => a.sort_order - b.sort_order);
      stages.forEach(stage => {
        addRow({
          id: stage.id,
          name: stage.name, description: stage.description, markup_percent: stage.markup_percent, stc_total: stage.stc_total || 0,
          stc_quantity: stage.stc_quantity, stc_system_kw: stage.stc_system_kw, stc_zone_rating: stage.stc_zone_rating,
          stc_install_year: stage.stc_install_year, stc_price_per_certificate: stage.stc_price_per_certificate,
          lineItems: (stage.cost_centre_line_items || []).slice().sort((a, b) => a.sort_order - b.sort_order)
            .map(li => ({
              id: li.id, description: li.description, item_type: li.item_type, quantity: li.quantity, unit_cost: li.unit_cost, rate_tier_id: li.rate_tier_id,
              prebuild_group_id: li.prebuild_group_id, prebuild_client_description: li.prebuild_client_description, prebuild_base_quantity: li.prebuild_base_quantity,
              ai_suggested: li.ai_suggested,
            })),
          photoGroups: (stage.cost_centre_photo_groups || []).slice().sort((a, b) => a.sort_order - b.sort_order)
            .map(pg => ({ description: pg.description, photos: (pg.photos || []).map(p => p.url || p) })),
        });
      });
      if (!stages.length) addRow({ name: 'Stage 1' });
      updateEditTotal();
      renderCustomerGets();
      if (isQuoteEdit) loadEditAddressAutocomplete(companySettings.google_maps_api_key);
      } catch (err) {
        // wireEditForm runs un-awaited from render() (it's called without
        // `await` since render() itself isn't async), so a throw in here
        // used to just become a silent unhandled rejection - the edit form
        // would appear (from render()'s own innerHTML swap) but stay
        // completely unpopulated/unwired, which looks exactly like
        // "nothing happens" if the swap itself was subtle. Surface it.
        console.error('wireEditForm failed:', err);
        alert('The editor loaded but hit an error setting up: ' + friendlyError(err));
      }
    }

    // A completed (or booked) site inspection for this quote or its lead: its answers are the
    // best source for the pre-quote questions, so link it from the card.
    async function showSiteInspectionNote(project) {
      const el = document.getElementById('site-inspection-note');
      if (!el) return;
      let q = supabaseClient.from('site_inspections').select('id, status, completed_at').order('created_at', { ascending: false }).limit(1);
      q = project.lead_id ? q.or(`project_id.eq.${project.id},lead_id.eq.${project.lead_id}`) : q.eq('project_id', project.id);
      const { data } = await q;
      const insp = data && data[0];

      const done = insp.status === 'completed';
      el.innerHTML = `<p class="subtitle" style="margin:0 0 8px;">Site inspection: <span class="badge ${done ? 'accepted' : 'sent'}">${escapeHtml(insp.status.replace('_', ' '))}</span>${done && insp.completed_at ? ' on ' + new Date(insp.completed_at).toLocaleDateString('en-AU') : ''} &middot; <a class="link-quiet" href="/site-inspection.html?id=${insp.id}" target="_blank">open the checklist &rarr;</a>${done ? ' and copy what it found into the answers below.' : ''}</p>`;
    }

    // Presents the choice - quick note vs full signed Variation - for a set
    // of stage $ changes on an already-approved job. Resolves to a
    // ready-to-insert variations row, or undefined if the user backs out
    // of the whole save (not just this dialog).
    function openVariationChoiceModal(changes) {
      return new Promise((resolve) => {
        const totalDelta = changes.reduce((s, c) => s + (c.new_amount - c.old_amount), 0);
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
        overlay.innerHTML = `
          <div class="card" style="max-width:520px; width:100%; max-height:90vh; overflow-y:auto;">
            <h2>This changes the job's quoted total</h2>
            <p class="subtitle" style="margin-bottom:10px;">This job's quote was already approved - record why this changed.</p>
            <table class="responsive-stack" style="margin-bottom:10px;">
              <thead><tr><th>Stage</th><th class="num">Was</th><th class="num">Now</th><th class="num">Change</th></tr></thead>
              <tbody>
                ${changes.map(c => `
                  <tr>
                    <td data-label="Stage">${c.cost_centre_name}</td>
                    <td class="num" data-label="Was">${money(c.old_amount)}</td>
                    <td class="num" data-label="Now">${money(c.new_amount)}</td>
                    <td class="num" data-label="Change" style="color:${c.new_amount >= c.old_amount ? 'var(--green)' : 'var(--red)'};">${c.new_amount >= c.old_amount ? '+' : ''}${money(c.new_amount - c.old_amount)}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
            <p style="margin:0 0 14px; font-weight:600;">Total change: <span style="color:${totalDelta >= 0 ? 'var(--green)' : 'var(--red)'};">${totalDelta >= 0 ? '+' : ''}${money(totalDelta)}</span></p>

            <label style="margin-top:0">Reason for this change</label>
            <textarea id="var-description" placeholder="e.g. Client requested an extra 4 downlights in the living room" style="min-height:70px;"></textarea>

            <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;">
              <button id="var-quick-btn">Record as quick note</button>
              <button type="button" class="secondary" id="var-full-btn">Open full Variation Form to sign</button>
              <button type="button" class="secondary" id="var-cancel-btn">Cancel save</button>
            </div>
            <div id="var-msg"></div>
          </div>`;
        document.body.appendChild(overlay);

        overlay.querySelector('#var-cancel-btn').addEventListener('click', () => { overlay.remove(); resolve(undefined); });

        overlay.querySelector('#var-quick-btn').addEventListener('click', () => {
          const description = overlay.querySelector('#var-description').value.trim();
          if (!description) { overlay.querySelector('#var-msg').innerHTML = `<div class="error-box">Enter a reason first.</div>`; return; }
          overlay.remove();
          resolve({ description, changes, total_delta: totalDelta, variation_type: 'quick_note', status: 'recorded' });
        });

        overlay.querySelector('#var-full-btn').addEventListener('click', () => {
          const description = overlay.querySelector('#var-description').value.trim();
          if (!description) { overlay.querySelector('#var-msg').innerHTML = `<div class="error-box">Enter a reason first.</div>`; return; }
          overlay.remove();
          openFullVariationSignPanel(changes, totalDelta, description, resolve);
        });
      });
    }

    // On-screen signing only for now - a client-link remote-sign entry
    // point (same underlying record, a second way to reach this) is a
    // planned follow-up, not built yet.
    function openFullVariationSignPanel(changes, totalDelta, description, resolve) {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:520px; width:100%; max-height:90vh; overflow-y:auto;">
          <h2>Sign this variation</h2>
          <p class="subtitle" style="margin-bottom:10px;">Total change: <strong style="color:${totalDelta >= 0 ? 'var(--green)' : 'var(--red)'};">${totalDelta >= 0 ? '+' : ''}${money(totalDelta)}</strong></p>
          <p style="margin:0 0 14px;">${escapeHtml(description)}</p>

          <label style="margin-top:0">Signed by (name)</label>
          <input id="var-signed-name" placeholder="Full name" />

          <label>Signature</label>
          <canvas id="var-sig-canvas" width="460" height="150" style="border:1px solid var(--border); border-radius:8px; background:#fff; touch-action:none; width:100%; max-width:460px; height:150px; display:block;"></canvas>
          <button type="button" class="secondary" id="var-sig-clear-btn" style="margin-top:8px; font-size:12px; padding:6px 10px;">Clear signature</button>

          <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;">
            <button id="var-sign-btn">Sign &amp; lock</button>
            <button type="button" class="secondary" id="var-sign-cancel-btn">Cancel save</button>
          </div>
          <div id="var-sign-msg"></div>
        </div>`;
      document.body.appendChild(overlay);

      const canvas = overlay.querySelector('#var-sig-canvas');
      const ctx = canvas.getContext('2d');
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      let drawing = false, hasSignature = false;
      const pointerPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        return { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height) };
      };
      canvas.addEventListener('pointerdown', (e) => { drawing = true; hasSignature = true; const p = pointerPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); });
      canvas.addEventListener('pointermove', (e) => { if (!drawing) return; const p = pointerPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
      const stopDrawing = () => { drawing = false; };
      canvas.addEventListener('pointerup', stopDrawing);
      canvas.addEventListener('pointerleave', stopDrawing);
      overlay.querySelector('#var-sig-clear-btn').addEventListener('click', () => { ctx.clearRect(0, 0, canvas.width, canvas.height); hasSignature = false; });

      overlay.querySelector('#var-sign-cancel-btn').addEventListener('click', () => { overlay.remove(); resolve(undefined); });

      overlay.querySelector('#var-sign-btn').addEventListener('click', () => {
        const signedMsg = overlay.querySelector('#var-sign-msg');
        const signed_by_name = overlay.querySelector('#var-signed-name').value.trim();
        if (!signed_by_name) { signedMsg.innerHTML = `<div class="error-box">Enter the signer's name.</div>`; return; }
        if (!hasSignature) { signedMsg.innerHTML = `<div class="error-box">Draw a signature.</div>`; return; }
        const signature_data_url = canvas.toDataURL('image/png');
        overlay.remove();
        resolve({
          description, changes, total_delta: totalDelta, variation_type: 'full', status: 'signed',
          signature_data_url, signed_by_name, signed_at: new Date().toISOString(),
        });
      });
    }

    // The stages as typed in the editor (#cc-rows), with their line items and photo groups.
    function readStagesPayload() {
      const stageRows = [...document.querySelectorAll('#cc-rows .cc-row')];
      const stagesPayload = stageRows.map((row, i) => ({
        id: row.dataset.id || null,
        name: row.querySelector('.cc-name').value.trim(),
        description: row.querySelector('.cc-desc').value.trim(),
        markup_percent: parseFloat(row.querySelector('.cc-markup').value) || 0,
        stc_total: parseFloat(row.querySelector('.cc-stc-total').value) || 0,
        stc_quantity: parseFloat(row.querySelector('.cc-stc-qty').value) || null,
        stc_system_kw: parseFloat(row.querySelector('.cc-stc-kw').value) || null,
        stc_zone_rating: parseFloat(row.querySelector('.cc-stc-zone').value) || 1.382,
        stc_install_year: parseInt(row.querySelector('.cc-stc-year').value, 10) || null,
        stc_price_per_certificate: parseFloat(row.querySelector('.cc-stc-price').value) || null,
        estimated_labour_cost: parseFloat(row.dataset.labourTotal) || 0,
        estimated_material_cost: parseFloat(row.dataset.materialTotal) || 0,
        quoted_amount: parseFloat(row.dataset.salePrice) || 0,
        sort_order: i,
        lineItems: [...row.querySelectorAll('.li-row')].map((li, j) => {
          const item_type = li.querySelector('.li-type').value;
          const rate_tier_id = li.querySelector('.li-tier').value || null;
          let description = li.querySelector('.li-desc').value.trim();
          // Labour description is optional - if left blank, fall back to
          // the rate tier's own name (e.g. "Principal Electrician") rather
          // than dropping the line entirely.
          if (!description && item_type === 'labour' && rate_tier_id) {
            description = RATE_TIERS.find(t => t.id === rate_tier_id)?.name || '';
          }
          return {
            description, item_type,
            quantity: parseFloat(li.querySelector('.li-qty').value) || 0,
            unit_cost: parseFloat(li.querySelector('.li-cost').value) || 0,
            rate_tier_id,
            sort_order: j,
            prebuild_group_id: li.dataset.prebuildGroupId || null,
            prebuild_client_description: li.dataset.prebuildClientDescription || null,
            prebuild_base_quantity: li.dataset.prebuildBaseQuantity ? parseFloat(li.dataset.prebuildBaseQuantity) : null,
            ai_suggested: !!(li.closest('.li-prebuild-group') && li.closest('.li-prebuild-group').dataset.aiSuggested === '1'),
          };
        }).filter(li => li.description),
        photoGroups: [...row.querySelectorAll('.pg-row')].map((pg, j) => ({
          description: pg.querySelector('.pg-desc').value.trim(),
          photos: JSON.parse(pg.dataset.photos || '[]').map(url => ({ url })),
          sort_order: j,
        })).filter(pg => pg.description || pg.photos.length),
      })).filter(s => s.name);
      return stagesPayload;
    }

    // Writes the stages non-destructively: existing stages are updated in place (their ids stay for
    // invoices, POs and time), new ones inserted, line items and photo groups replaced, removed
    // stages deleted. The caller has already checked removed stages carry nothing.
    async function applyStagesPayload(project, stagesPayload, removedCentres) {
      for (const s of stagesPayload) {
        const { id, lineItems, photoGroups, ...fields } = s;
        let centreId = id;
        if (centreId) {
          const { error } = await supabaseClient.from('cost_centres').update(fields).eq('id', centreId);
          if (error) throw error;
        } else {
          const { data: newCentre, error } = await supabaseClient.from('cost_centres').insert({ ...fields, project_id: project.id }).select().single();
          if (error) throw error;
          centreId = newCentre.id;
        }

        const { error: delLiErr } = await supabaseClient.from('cost_centre_line_items').delete().eq('cost_centre_id', centreId);
        if (delLiErr) throw delLiErr;
        if (lineItems.length) {
          const { error: liErr } = await supabaseClient.from('cost_centre_line_items').insert(lineItems.map(li => ({ ...li, cost_centre_id: centreId })));
          if (liErr) throw liErr;
        }

        const { error: delPgErr } = await supabaseClient.from('cost_centre_photo_groups').delete().eq('cost_centre_id', centreId);
        if (delPgErr) throw delPgErr;
        if (photoGroups.length) {
          const { error: pgErr } = await supabaseClient.from('cost_centre_photo_groups').insert(photoGroups.map(pg => ({ ...pg, cost_centre_id: centreId })));
          if (pgErr) throw pgErr;
        }
      }

      if (removedCentres.length) {
        const { error: delCentreErr } = await supabaseClient.from('cost_centres').delete().in('id', removedCentres.map(c => c.id));
        if (delCentreErr) throw delCentreErr;
      }

    }

    async function saveEdits(project) {
      const msg = document.getElementById('edit-msg');
      const saveBtn = document.getElementById('save-edit-btn');
      msg.innerHTML = '';

      const isJob = !!project.job_number;

      const stagesPayload = readStagesPayload();

      // A job always has a stage; a quote can save without one until it is sent.
      if (stagesPayload.length === 0 && isJob) {
        msg.innerHTML = `<div class="error-box">Add at least one stage.</div>`;
        return;
      }

      if (!isJob) {
        // ---------- Quote path: saves the project fields + milestones
        // here, then falls through to the same non-destructive stage save
        // a job uses below (stages updated in place), so prices stay
        // editable at any time - even once time is logged/allocated. ----------
        const name = document.getElementById('p-name').value.trim();
        const client_name = document.getElementById('p-client').value.trim();
        const client_email = document.getElementById('p-email').value.trim();
        const client_phone = document.getElementById('p-phone').value.trim();
        const client_address = document.getElementById('p-address').value.trim();
        const notes = document.getElementById('p-notes').value.trim() || null;
        const payment_terms = document.getElementById('p-payment-terms').value;
        const sow_text = document.getElementById('p-sow').value;
        const proposal_subtitle = document.getElementById('p-subtitle').value.trim();
        const terms_text = document.getElementById('p-terms').value;
        const deposit_percent = parseFloat(document.getElementById('p-deposit').value) || 0;
        const show_investment_breakdown = document.getElementById('p-breakdown').checked;
        const pylon_link = document.getElementById('p-pylon-link').value.trim();
        const pylon_project_id = document.getElementById('p-pylon-id').value.trim();

        if (!name || !client_name) {
          msg.innerHTML = `<div class="error-box">Please fill in the project name and client name.</div>`;
          return;
        }

        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving...';
        try {
          // The job's site address never overwrites the client's office address; a new client's
          // first site is the best guess for their office address until it is set on the Clients page.
          let clientId = selectedClientId;
          const clientFields = { name: client_name, email: client_email || null, phone: client_phone || null, payment_terms };
          if (clientId) {
            await supabaseClient.from('clients').update(clientFields).eq('id', clientId);
          } else {
            const { data: newClient, error: clientErr } = await supabaseClient.from('clients').insert({ ...clientFields, address: client_address || null }).select().single();
            if (clientErr) throw clientErr;
            clientId = newClient.id;
          }
          const client_site_id = await resolveClientSite(clientId, client_address, selectedClientId ? (sitePicker.client() || {}).address : client_address);

          const { data: settings } = await supabaseClient.from('company_settings').select('portfolio_photos').eq('id', 1).single();
          const allPhotos = (settings && settings.portfolio_photos) || [];
          const wantCategory = TEMPLATE_INFO[currentTemplate].photoCategory;
          const coverPhotos = allPhotos.filter(p => (p.category || 'general') === wantCategory);

          const projectFields = {
            name, client_id: clientId, client_name, client_email, client_phone, client_address, client_site_id, notes,
            sow_text, proposal_subtitle, terms_text, deposit_percent, show_investment_breakdown, pylon_link, pylon_project_id,
            sow_brief: document.getElementById('p-brief').value.trim(),
            reference_photos: referencePhotos.map(url => ({ url })),
            sow_documents: sowDocs,
            cover_photos: coverPhotos,
            proposal_template: currentTemplate,
            template_answers: readTemplateAnswers(document.getElementById('template-questions')),
            estimate_disclaimer_text: document.getElementById('p-estimate-disclaimer').value,
            project_manager_contact_id: assignedContactIds.project_manager_contact_id || null,
            site_contact_id: assignedContactIds.site_contact_id || null,
            job_contact_id: assignedContactIds.job_contact_id || null,
            sales_contact_id: assignedContactIds.sales_contact_id || null,
            accounts_contact_id: assignedContactIds.accounts_contact_id || null,
          };

          const { error: updateErr } = await supabaseClient.from('projects').update(projectFields).eq('id', project.id);
          if (updateErr) throw updateErr;

          await supabaseClient.from('payment_milestones').delete().eq('project_id', project.id);
          const milestonesPayload = readMilestones();
          if (milestonesPayload.length) {
            const { error: msErr } = await supabaseClient.from('payment_milestones').insert(milestonesPayload.map(m => ({ ...m, project_id: project.id })));
            if (msErr) throw msErr;
          }

        } catch (err) {
          msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save changes';
          return;
        }
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save changes';
      }

      // ---------- Stage save (quotes and jobs): non-destructive. Existing
      // stages are UPDATEd in place (preserving the id every invoice/PO/
      // timesheet entry downstream might reference), only genuinely new
      // stages get inserted, and a stage can only be removed if nothing real
      // is attached to it specifically. Line items/photo groups within a
      // surviving stage are still delete-and-reinsert - nothing else
      // references their ids directly, so that stays simple. ----------
      const existingCentres = project.cost_centres || [];
      const keptIds = stagesPayload.map(s => s.id).filter(Boolean);
      const removedCentres = existingCentres.filter(c => !keptIds.includes(c.id));

      for (const centre of removedCentres) {
        const reasons = await checkCostCentreHasActivity(centre);
        if (reasons.length) {
          msg.innerHTML = `<div class="error-box">Can't remove "${escapeHtml(centre.name)}" - it ${reasons.join(', ')}. Adjust its line items instead of deleting the stage, or add it back.</div>`;
          return;
        }
      }

      const changes = [];
      stagesPayload.forEach(s => {
        if (!s.id) {
          changes.push({ cost_centre_id: null, cost_centre_name: s.name, old_amount: 0, new_amount: s.quoted_amount });
          return;
        }
        const original = existingCentres.find(c => c.id === s.id);
        if (!original) return;
        const oldAmount = Number(original.quoted_amount) || 0;
        if (Math.abs(s.quoted_amount - oldAmount) >= 0.01) {
          changes.push({ cost_centre_id: s.id, cost_centre_name: s.name, old_amount: oldAmount, new_amount: s.quoted_amount });
        }
      });
      removedCentres.forEach(c => {
        changes.push({ cost_centre_id: c.id, cost_centre_name: c.name, old_amount: Number(c.quoted_amount) || 0, new_amount: 0 });
      });

      // A variation (signed price-change record) only applies once a quote
      // has become a job - a quote's prices just change.
      let pendingVariation = null;
      if (isJob && changes.length) {
        pendingVariation = await openVariationChoiceModal(changes);
        if (pendingVariation === undefined) return; // backed out of the whole save
      }

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';
      try {
        await applyStagesPayload(project, stagesPayload, removedCentres);

        await logStageChanges(project.id, existingCentres, stagesPayload);

        if (pendingVariation) {
          const { data: { user } } = await supabaseClient.auth.getUser();
          const { error: varErr } = await supabaseClient.from('variations').insert({ ...pendingVariation, project_id: project.id, created_by: user.id });
          if (varErr) throw varErr;
          await logActivity('project', project.id, 'variation_recorded', pendingVariation.description);
        }

        const sowNow = document.getElementById('p-sow');
        if (sowNow && sowNow.value.trim()) { try { await requestInstallerSummary(project.id, { onlyIfStale: true }); } catch (e) { console.error('Installer summary refresh failed:', e); } }

        // No PDF until there is something priced to show.
        if (isJob || stagesPayload.some(st => st.quoted_amount > 0)) autoGenerateQuotePdf(project);
        editMode = false;
        endEditSession();
        const refreshed = await loadProject();
        const myRole = await getMyRole();
        if (refreshed) render(refreshed, isPricingRole(myRole));
      } catch (err) {
        msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save changes';
      }
    }

    // Merges legacy single-stage invoices (linked via invoices.cost_centre_id
    // directly) with new multi-stage claims (linked via invoice_claims,
    // invoice.cost_centre_id left null) into one list per cost centre - the
    // two never overlap for the same invoice, since a new invoice always
    // uses invoice_claims. Shared by the per-stage claims card and the
    // "Invoice project" modal so remaining-to-claim can never drift between
    // the two.
    //
    // Sorted by created_at, not sent_at - sent_at is a user-editable display
    // date (often backdated, or just left at "today" when the invoice is
    // actually raised), so two invoices made minutes apart on the same day
    // can have sent_at values that land in the wrong order relative to each
    // other (e.g. a deposit auto-raised at 3:35am vs a progress claim made
    // that afternoon but dated to midnight). created_at is set once at
    // insert and never edited, so it's the one field that reliably reflects
    // which invoice actually came first.
    function stageClaimSummary(c) {
      const legacyInvoices = (c.invoices || []).map(inv => ({
        invoice_number: inv.invoice_number, invoice_token: inv.invoice_token, sent_at: inv.sent_at, created_at: inv.created_at,
        paid_at: inv.paid_at, xero_invoice_id: inv.xero_invoice_id, id: inv.id,
        labour_amount: inv.labour_amount, material_amount: inv.material_amount, stc_amount: inv.stc_amount, bstc_amount: inv.bstc_amount,
      }));
      const claimInvoices = (c.invoice_claims || []).map(ic => ({
        invoice_number: ic.invoices?.invoice_number, invoice_token: ic.invoices?.invoice_token, sent_at: ic.invoices?.sent_at, created_at: ic.invoices?.created_at,
        paid_at: ic.invoices?.paid_at, xero_invoice_id: ic.invoices?.xero_invoice_id, id: ic.invoices?.id,
        labour_amount: ic.labour_amount, material_amount: ic.material_amount, stc_amount: ic.stc_amount, bstc_amount: ic.bstc_amount,
      }));
      // Credit notes count as negative claims in the same timeline, so a
      // stage's remaining-to-claim balance correctly goes back up once one
      // is issued - see migration_100_credit_notes.sql for the matching
      // server-side version of this same subtraction (get_invoice_by_token_v3,
      // for the client-facing invoice page).
      const creditLines = (c.credit_note_claims || []).map(cn => ({
        invoice_number: null, invoice_token: null, sent_at: cn.created_at, created_at: cn.created_at,
        paid_at: null, xero_invoice_id: null, id: cn.id, isCredit: true,
        labour_amount: -(Number(cn.labour_amount) || 0), material_amount: -(Number(cn.material_amount) || 0), stc_amount: -(Number(cn.stc_amount) || 0), bstc_amount: -(Number(cn.bstc_amount) || 0),
      }));
      const stageInvoices = [...legacyInvoices, ...claimInvoices, ...creditLines].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      const claimedTotal = stageInvoices.reduce((s, inv) => s + Number(inv.labour_amount) + Number(inv.material_amount), 0);
      const quotedAmt = Number(c.quoted_amount) || 0;
      const remaining = Math.max(0, quotedAmt - claimedTotal);
      const stcApplied = stageInvoices.reduce((s, inv) => s + Number(inv.stc_amount || 0), 0);
      const bstcApplied = stageInvoices.reduce((s, inv) => s + Number(inv.bstc_amount || 0), 0);
      // Per-stage remaining is legacy (credits now sit on the quote, see quoteCreditSummary).
      const stcRemaining = Math.max(0, Number(c.stc_total || 0) - stcApplied);
      return { stageInvoices, claimedTotal, quotedAmt, remaining, stcApplied, bstcApplied, stcRemaining };
    }

    // The quote's STC and BSTC credits (item 27): what is left of each after every claim and credit
    // note on the job, and which stage each is claimed with (its chosen stage, else the last stage).
    function quoteCreditSummary(project) {
      const centres = (project.cost_centres || []).slice().sort((a, b) => a.sort_order - b.sort_order);
      let stcApplied = 0, bstcApplied = 0;
      centres.forEach(c => { const s = stageClaimSummary(c); stcApplied += s.stcApplied; bstcApplied += s.bstcApplied; });
      const last = centres[centres.length - 1];
      // the chosen stage is a plain id (no foreign key, see migration 20261117000000): a stage that
      // has since been removed falls back to the last stage
      const stageOrLast = (id) => (id && centres.some(c => c.id === id)) ? id : ((last && last.id) || null);
      return {
        stcRemaining: Math.max(0, Number(project.stc_total || 0) - stcApplied),
        bstcRemaining: Math.max(0, Number(project.bstc_total || 0) - bstcApplied),
        stcStageId: stageOrLast(project.stc_cost_centre_id),
        bstcStageId: stageOrLast(project.bstc_cost_centre_id),
        stcApplied, bstcApplied,
      };
    }

    // Splits a stage's claimed $ into labour/materials (the two income lines
    // it posts to Xero) in proportion to what each sells for in the stage's
    // price. estimated_labour_cost is already a sell total (hours x the
    // tier's sell rate); estimated_material_cost is a cost, so it is marked
    // up by the stage's markup% first - the same sell = material x (1 +
    // markup%) + labour that updateStageTotals prices the stage with.
    // Comparing labour sell against material cost would over-code labour.
    function splitLabourMaterial(centre, amount) {
      const labourSell = Number(centre.estimated_labour_cost) || 0;
      const materialSell = (Number(centre.estimated_material_cost) || 0) * (1 + (Number(centre.markup_percent) || 0) / 100);
      const sellTotal = labourSell + materialSell;
      const labourShare = sellTotal > 0 ? labourSell / sellTotal : 1;
      const labourAmount = Math.round(amount * labourShare * 100) / 100;
      const materialAmount = Math.round((amount - labourAmount) * 100) / 100;
      return { labourAmount, materialAmount };
    }

    // For a no-quote (do-and-charge) job (dashboard.html's "+ New job (no
    // quote)") - there's no quoted amount to claim a % of, so this invoices
    // whatever has actually accrued instead, per cost centre: labour at
    // each person's own charge-out rate for every hour logged to it
    // (server-side, same reason pay rates never reach the browser directly -
    // see get-invoiceable-actuals.js), and materials at cost marked up by the
    // cost centre's own markup%. Pre-fills editable amounts covering
    // whatever's accrued but not yet invoiced on each cost centre.
    // Tick the cost centres to invoice, then either raise ONE invoice
    // covering all of them (one Xero invoice, a Labour / Materials line per
    // cost centre) or a separate invoice for each. Stock materials and
    // prebuilds can be added straight onto any cost centre while building
    // it: create-invoice.js prices them, takes Stock out of the warehouse
    // and records them in invoice_line_items.
    // Due date from the client's payment terms: the same rule as netlify/functions/_shared/compute-due-date.js.
    const INVOICE_TERM_DAYS = { cod: 0, net_7: 7, net_14: 14, net_30: 30 };
    function invoiceDueKey(terms, invoiceDateKey) {
      const d = new Date(`${invoiceDateKey}T12:00:00Z`);
      d.setUTCDate(d.getUTCDate() + (INVOICE_TERM_DAYS[terms] || 0));
      return sydneyDateKey(d);
    }
    // Fills the due date from the client's terms as soon as the panel opens, moves it when the invoice
    // date changes, and leaves it alone once someone types their own (clearing the box hands it back).
    async function wireInvoiceDueDate(overlay, { dateSel, dueSel, noteSel, clientId }) {
      const dateEl = overlay.querySelector(dateSel), dueEl = overlay.querySelector(dueSel), noteEl = overlay.querySelector(noteSel);
      let terms = 'cod', touched = false;
      const fill = () => { if (!touched && dateEl.value) dueEl.value = invoiceDueKey(terms, dateEl.value); };
      dueEl.addEventListener('input', () => { touched = !!dueEl.value; if (!touched) fill(); });
      dateEl.addEventListener('change', fill);
      if (!clientId) {
        noteEl.textContent = 'No client on this job: due on the invoice date.';
      } else {
        let row = null;
        try {
          const { data, error } = await supabaseClient.from('clients').select('payment_terms').eq('id', clientId).maybeSingle();
          if (error) throw error;
          row = data;
        } catch (err) {
          noteEl.textContent = 'Could not read the client\'s terms. Leave it blank and it is worked out when the invoice is made.';
          return;
        }
        terms = row?.payment_terms || 'cod';
        const days = INVOICE_TERM_DAYS[terms] || 0;
        noteEl.textContent = days ? `Client terms: ${days} days` : 'Client terms: COD (due on the invoice date)';
      }
      fill(); // once, so a date typed while the terms were loading is kept
    }

    async function openInvoiceActualCostsPanel(project) {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `<div class="card" style="max-width:440px; width:100%;"><p class="subtitle">Working out what's accrued...</p></div>`;
      document.body.appendChild(overlay);

      let actuals, prebuilds, materials;
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        const [res, pbs, { data: mats }] = await Promise.all([
          fetch('/.netlify/functions/get-invoiceable-actuals', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
            body: JSON.stringify({ projectId: project.id }),
          }),
          getPrebuilds(),
          supabaseClient.from('materials').select('id, name, cost_price'),
        ]);
        actuals = await res.json();
        if (!res.ok || !actuals.ok) throw new Error(actuals.error || 'Could not work out accrued costs');
        prebuilds = pbs || [];
        materials = mats || [];
      } catch (err) {
        overlay.innerHTML = `<div class="card" style="max-width:440px; width:100%;"><div class="error-box">${escapeHtml(friendlyError(err))}</div><button type="button" class="secondary" id="ia-close-btn" style="margin-top:10px; width:100%;">Close</button></div>`;
        overlay.querySelector('#ia-close-btn').addEventListener('click', () => overlay.remove());
        return;
      }

      const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
      // Same pricing create-invoice.js uses (_shared/invoice-items.js), so
      // what's shown here is what gets charged unless it's typed over.
      const prebuildUnitPrice = (p, markup) => {
        const factor = 1 + (Number(markup) || 0) / 100;
        return r2((p.prebuild_components || []).reduce((s, c) => {
          const line = (Number(c.quantity) || 0) * (Number(c.unit_cost) || 0);
          return s + (c.item_type === 'labour' ? line : line * factor);
        }, 0));
      };

      const centres = actuals.centres.map((c) => {
        const accrued = c.actualLabourSell + c.materialSell;
        const remaining = Math.max(0, accrued - c.invoicedAmount);
        const labourShare = accrued > 0 ? c.actualLabourSell / accrued : 0;
        const labour = r2(remaining * labourShare);
        return { ...c, labour, material: r2(remaining - labour), items: [], include: remaining > 0.004 };
      });
      // Nothing accrued anywhere yet (e.g. invoicing straight from a prebuild): start with every cost centre ticked.
      if (!centres.some(c => c.include)) centres.forEach(c => { c.include = true; });
      let mode = 'combined';

      const centreTotal = (c) => r2((Number(c.labour) || 0) + (Number(c.material) || 0) + c.items.reduce((s, it) => s + r2(it.quantity * it.unitPrice), 0));

      overlay.innerHTML = `
        <div class="card" style="max-width:720px; width:100%; max-height:90vh; overflow-y:auto;">
          <h2>Invoice actual costs</h2>
          <p class="subtitle" style="margin-bottom:12px;">Tick the cost centres to invoice. Amounts are what's accrued but not yet invoiced on each; change them, and add Stock materials or prebuilds straight onto the invoice (Stock comes out of the warehouse when the invoice is created).</p>
          <div id="ia-centres"></div>
          <div id="ia-mode-wrap" style="margin-top:12px;"></div>
          <div class="grid cols-2">
            <div><label>Invoice date</label><input type="date" id="ia-date" value="${new Date().toLocaleDateString('en-CA', { timeZone: 'Australia/Sydney' })}" /></div>
            <div><label>Due date</label><input type="date" id="ia-due-date" /><p class="subtitle" id="ia-due-note" style="font-size:12px; margin:4px 0 0;"></p></div>
          </div>
          <p id="ia-total" style="margin:14px 0 0; font-weight:600;"></p>
          <div style="margin-top:14px;">
            <button id="ia-confirm-btn">Create invoice</button>
            <button type="button" class="secondary" id="ia-cancel-btn">Cancel</button>
          </div>
          <div id="ia-msg"></div>
        </div>`;

      wireInvoiceDueDate(overlay, { dateSel: '#ia-date', dueSel: '#ia-due-date', noteSel: '#ia-due-note', clientId: project.client_id });
      const centresEl = overlay.querySelector('#ia-centres');
      const modeWrap = overlay.querySelector('#ia-mode-wrap');

      function refreshTotals() {
        const picked = centres.filter(c => c.include);
        const total = picked.reduce((s, c) => s + centreTotal(c), 0);
        overlay.querySelector('#ia-total').textContent = picked.length
          ? `${mode === 'separate' && picked.length > 1 ? `${picked.length} invoices, ` : ''}${money(total)} ex GST`
          : 'Tick at least one cost centre.';
        centres.forEach((c, i) => {
          const el = centresEl.querySelector(`[data-ci="${i}"] .ia-centre-total`);
          if (el) el.textContent = money(centreTotal(c));
        });
        modeWrap.innerHTML = picked.length > 1 ? `
          <label style="margin-top:0;">How to invoice the ${picked.length} cost centres</label>
          <label style="display:flex; align-items:center; gap:8px; margin-top:4px; font-weight:400;"><input type="radio" name="ia-mode" value="combined" ${mode === 'combined' ? 'checked' : ''} style="width:auto;" /> One invoice covering all of them</label>
          <label style="display:flex; align-items:center; gap:8px; margin-top:4px; font-weight:400;"><input type="radio" name="ia-mode" value="separate" ${mode === 'separate' ? 'checked' : ''} style="width:auto;" /> A separate invoice for each</label>` : '';
        modeWrap.querySelectorAll('input[name="ia-mode"]').forEach(r => r.addEventListener('change', () => { mode = r.value; refreshTotals(); }));
      }

      function renderCentres() {
        centresEl.innerHTML = centres.map((c, i) => `
          <div data-ci="${i}" style="border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px; ${c.include ? '' : 'opacity:0.6;'}">
            <label style="margin-top:0; display:flex; align-items:center; gap:8px; justify-content:space-between;">
              <span style="display:flex; align-items:center; gap:8px;"><input type="checkbox" class="ia-include" ${c.include ? 'checked' : ''} style="width:auto;" /><strong>${escapeHtml(c.name)}</strong></span>
              <span class="ia-centre-total" style="font-weight:600;"></span>
            </label>
            <p class="subtitle" style="margin:4px 0 0; font-size:12px;">${c.actualHours} hrs logged &middot; ${money(c.materialCost)} materials at cost (${money(c.materialSell)} with ${c.markupPercent}% markup) &middot; ${money(c.invoicedAmount)} already invoiced</p>
            ${c.include ? `
              <div class="grid cols-2">
                <div><label>Labour</label><input type="number" step="0.01" class="ia-labour" value="${c.labour}" /></div>
                <div><label>Materials</label><input type="number" step="0.01" class="ia-material" value="${c.material}" /></div>
              </div>
              ${c.items.length ? `
                <table style="margin-top:10px; font-size:13px;">
                  <thead><tr><th>Added item</th><th class="num" style="width:70px;">Qty</th><th class="num" style="width:110px;">Price each</th><th class="num">Total</th><th></th></tr></thead>
                  <tbody>
                    ${c.items.map((it, j) => `
                      <tr data-ii="${j}">
                        <td>${escapeHtml(it.name)} <span class="subtitle" style="font-size:11px;">${it.kind === 'prebuild' ? 'Prebuild' : 'Stock'}</span></td>
                        <td class="num"><input type="number" step="0.01" min="0.01" class="ia-item-qty" value="${it.quantity}" style="padding:4px 6px;" /></td>
                        <td class="num"><input type="number" step="0.01" min="0" class="ia-item-price" value="${it.unitPrice}" style="padding:4px 6px;" /></td>
                        <td class="num ia-item-total">${money(it.quantity * it.unitPrice)}</td>
                        <td><button type="button" class="secondary ia-item-remove" style="font-size:12px; padding:4px 8px;">Remove</button></td>
                      </tr>`).join('')}
                  </tbody>
                </table>` : ''}
              <button type="button" class="secondary ia-add-item" style="margin-top:10px; font-size:13px;">+ Add from Stock / prebuild</button>
            ` : ''}
          </div>`).join('');

        centresEl.querySelectorAll('[data-ci]').forEach((box) => {
          const c = centres[Number(box.dataset.ci)];
          box.querySelector('.ia-include').addEventListener('change', (e) => { c.include = e.target.checked; renderCentres(); });
          if (!c.include) return;
          box.querySelector('.ia-labour').addEventListener('input', (e) => { c.labour = parseFloat(e.target.value) || 0; refreshTotals(); });
          box.querySelector('.ia-material').addEventListener('input', (e) => { c.material = parseFloat(e.target.value) || 0; refreshTotals(); });
          box.querySelectorAll('[data-ii]').forEach((row) => {
            const it = c.items[Number(row.dataset.ii)];
            const sync = () => { row.querySelector('.ia-item-total').textContent = money(it.quantity * it.unitPrice); refreshTotals(); };
            row.querySelector('.ia-item-qty').addEventListener('input', (e) => { it.quantity = parseFloat(e.target.value) || 0; sync(); });
            row.querySelector('.ia-item-price').addEventListener('input', (e) => { it.unitPrice = parseFloat(e.target.value) || 0; sync(); });
            row.querySelector('.ia-item-remove').addEventListener('click', () => { c.items.splice(Number(row.dataset.ii), 1); renderCentres(); });
          });
          box.querySelector('.ia-add-item').addEventListener('click', async () => {
            const picked = await openVariationStockPicker(true);
            if (!picked) return;
            if (picked.kind === 'material') {
              const m = materials.find(x => x.id === picked.id);
              c.items.push({ kind: 'material', materialId: picked.id, name: picked.name, quantity: picked.quantity, unitPrice: r2((Number(m?.cost_price) || 0) * (1 + c.markupPercent / 100)) });
            } else {
              const p = prebuilds.find(x => x.id === picked.id);
              c.items.push({ kind: 'prebuild', prebuildId: picked.id, name: picked.name, quantity: picked.quantity, unitPrice: p ? prebuildUnitPrice(p, c.markupPercent) : 0 });
            }
            renderCentres();
          });
        });
        refreshTotals();
      }
      renderCentres();

      overlay.querySelector('#ia-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#ia-confirm-btn').addEventListener('click', async () => {
        const confirmBtn = overlay.querySelector('#ia-confirm-btn');
        const msg = overlay.querySelector('#ia-msg');
        const picked = centres.filter(c => c.include);
        if (!picked.length) { msg.innerHTML = `<div class="error-box">Tick at least one cost centre.</div>`; return; }
        const empty = picked.find(c => centreTotal(c) <= 0);
        if (empty) { msg.innerHTML = `<div class="error-box">${escapeHtml(empty.name)} has nothing to invoice. Enter an amount, add an item, or untick it.</div>`; return; }
        if (picked.some(c => c.items.some(it => !(it.quantity > 0)))) { msg.innerHTML = `<div class="error-box">Every added item needs a quantity.</div>`; return; }

        const toClaim = (c) => ({
          costCentreId: c.costCentreId, labourAmount: Number(c.labour) || 0, materialAmount: Number(c.material) || 0, claimPercent: null,
          items: c.items.map(it => ({ kind: it.kind, materialId: it.materialId || null, prebuildId: it.prebuildId || null, quantity: it.quantity, unitPrice: it.unitPrice })),
        });
        const batches = mode === 'separate' ? picked.map(c => [toClaim(c)]) : [picked.map(toClaim)];

        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Creating...';
        const created = [];
        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          for (const claims of batches) {
            const res = await fetch('/.netlify/functions/create-invoice', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
              body: JSON.stringify({
                projectId: project.id,
                claims,
                sentAt: overlay.querySelector('#ia-date').value || null,
                dueDate: overlay.querySelector('#ia-due-date').value || null,
              }),
            });
            const data = await res.json();
            if (!res.ok || !data.ok) throw new Error(data.error || 'Could not create the invoice');
            created.push(data);
            await logActivity('project', project.id, 'invoice_created', `Invoice ${data.invoiceNumber} created (actual costs)`);
            autoGenerateInvoicePdf(data.invoiceId);
          }
        } catch (err) {
          msg.innerHTML = `${created.length ? `<div class="success-box">Created ${created.map(d => d.invoiceNumber).join(', ')} before this failed.</div>` : ''}<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
          if (created.length) {
            confirmBtn.style.display = 'none';
            overlay.querySelector('#ia-cancel-btn').textContent = 'Close';
            overlay.querySelector('#ia-cancel-btn').addEventListener('click', () => window.location.reload());
          } else {
            confirmBtn.disabled = false;
            confirmBtn.textContent = 'Create invoice';
          }
          return;
        }

        msg.innerHTML = `
          <div class="success-box">Created ${escapeHtml(created.map(d => d.invoiceNumber).join(', '))}.</div>
          ${created.map(d => `
            <label>${escapeHtml(d.invoiceNumber)} link</label><input readonly value="${escapeHtml(`${shareOrigin()}/invoice.html?token=${d.invoiceToken}`)}" onclick="this.select()" />
            <button type="button" class="ia-email-btn" data-id="${escapeHtml(d.invoiceId)}" style="margin-top:8px;">Email ${escapeHtml(d.invoiceNumber)} to client</button>
            <div class="ia-email-msg"></div>`).join('')}`;
        msg.querySelectorAll('.ia-email-btn').forEach(b => b.addEventListener('click', () => emailInvoiceToClient(b.dataset.id, project, { btn: b, msgEl: b.nextElementSibling })));
        confirmBtn.style.display = 'none';
        overlay.querySelector('#ia-cancel-btn').textContent = 'Close';
        overlay.querySelector('#ia-cancel-btn').addEventListener('click', () => window.location.reload());
      });
    }

    // Closing out a warranty job: pick one of the three outcomes Jasper
    // described - absorbed entirely (no invoice, the full accrued cost
    // stays as a net cost against the original job), billed to the
    // equipment manufacturer (a real invoice, to a manufacturer contact
    // rather than the property owner - see bill_to_client_id), or partly
    // billed to the client because not everything logged against it
    // turned out to be genuine warranty work (a real invoice to the
    // job's own client, same as any job). Whatever isn't invoiced stays
    // as net warranty cost against the original (see loadProject()).
    async function openCloseWarrantyJobPanel(warrantyJobId, originalProject) {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:150; padding:16px;';
      overlay.innerHTML = `<div class="card" style="max-width:480px; width:100%;"><p class="subtitle">Working out what's accrued...</p></div>`;
      document.body.appendChild(overlay);

      let actuals;
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        const res = await fetch('/.netlify/functions/get-invoiceable-actuals', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify({ projectId: warrantyJobId }),
        });
        actuals = await res.json();
        if (!res.ok || !actuals.ok) throw new Error(actuals.error || 'Could not work out accrued costs');
      } catch (err) {
        overlay.innerHTML = `<div class="card" style="max-width:480px; width:100%;"><div class="error-box">${escapeHtml(friendlyError(err))}</div><button type="button" class="secondary" id="cw-close-btn" style="margin-top:10px; width:100%;">Close</button></div>`;
        overlay.querySelector('#cw-close-btn').addEventListener('click', () => overlay.remove());
        return;
      }

      const remaining = Math.max(0, actuals.actualLabourSell + actuals.materialSell - actuals.invoicedAmount);
      const labourShare = remaining > 0 ? actuals.actualLabourSell / (actuals.actualLabourSell + actuals.materialSell || 1) : 0;
      const defaultLabour = Math.round(remaining * labourShare * 100) / 100;
      const defaultMaterial = Math.round((remaining - defaultLabour) * 100) / 100;

      overlay.innerHTML = `
        <div class="card" style="max-width:480px; width:100%; max-height:85vh; overflow-y:auto;">
          <h2>Close out warranty job</h2>
          <p class="subtitle" style="margin-bottom:12px;">${actuals.actualHours} hours logged &middot; ${money(actuals.materialCost)} in received materials (marked up to ${money(actuals.materialSell)}). ${money(remaining)} not yet invoiced.</p>

          <label style="margin-top:0">Outcome</label>
          <select id="cw-outcome">
            <option value="no_bill">Absorbed - no bill (full cost stays against the original job)</option>
            <option value="manufacturer">Bill the manufacturer</option>
            <option value="client">Bill the client (not all of it was covered under warranty)</option>
          </select>

          <div id="cw-manufacturer-row" style="display:none;">
            <label>Manufacturer - search existing, or type a new one below</label>
            <input id="cw-mfr-search" placeholder="Search existing clients..." autocomplete="off" />
            <div id="cw-mfr-results"></div>
            <div class="grid cols-2" style="margin-top:8px;">
              <div><label style="margin-top:0">Name</label><input id="cw-mfr-name" /></div>
              <div><label style="margin-top:0">Email</label><input id="cw-mfr-email" type="email" /></div>
            </div>
          </div>

          <div id="cw-amount-row" style="display:none;">
            <label>Labour</label>
            <input type="number" step="0.01" id="cw-labour" value="${defaultLabour}" />
            <label>Materials</label>
            <input type="number" step="0.01" id="cw-material" value="${defaultMaterial}" />
            <label>Invoice date</label>
            <input type="date" id="cw-date" value="${new Date().toLocaleDateString('en-CA', { timeZone: 'Australia/Sydney' })}" />
          </div>

          <div style="margin-top:14px;">
            <button id="cw-confirm-btn">Close out</button>
            <button type="button" class="secondary" id="cw-cancel-btn">Cancel</button>
          </div>
          <div id="cw-msg"></div>
        </div>`;

      let selectedMfrId = null;
      const outcomeSelect = overlay.querySelector('#cw-outcome');
      function refreshOutcomeUI() {
        const val = outcomeSelect.value;
        overlay.querySelector('#cw-manufacturer-row').style.display = val === 'manufacturer' ? 'block' : 'none';
        overlay.querySelector('#cw-amount-row').style.display = val === 'no_bill' ? 'none' : 'block';
      }
      outcomeSelect.addEventListener('change', refreshOutcomeUI);
      refreshOutcomeUI();

      let mfrSearchTimeout;
      overlay.querySelector('#cw-mfr-search').addEventListener('input', (e) => {
        clearTimeout(mfrSearchTimeout);
        const q = e.target.value.trim();
        selectedMfrId = null;
        if (q.length < 2) { overlay.querySelector('#cw-mfr-results').innerHTML = ''; return; }
        mfrSearchTimeout = setTimeout(async () => {
          const { data } = await supabaseClient.from('clients').select('id, name, email').or(`name.ilike.%${q}%,email.ilike.%${q}%`).limit(8);
          const resultsEl = overlay.querySelector('#cw-mfr-results');
          if (!data || !data.length) { resultsEl.innerHTML = `<p class="subtitle" style="margin-top:4px;">No matches - fill in the fields below to add them as a new client.</p>`; return; }
          resultsEl.innerHTML = `<div style="border:1px solid var(--border); border-radius:8px; margin-top:6px;">
            ${data.map(c => `<div class="mfr-pick-row" data-id="${c.id}" data-name="${escapeHtml(c.name)}" data-email="${escapeHtml(c.email || '')}" style="padding:8px 12px; cursor:pointer; border-bottom:1px solid var(--border);">${escapeHtml(c.name)} <span class="subtitle">${escapeHtml(c.email || '')}</span></div>`).join('')}
          </div>`;
          resultsEl.querySelectorAll('.mfr-pick-row').forEach(row => {
            row.addEventListener('click', () => {
              selectedMfrId = row.dataset.id;
              overlay.querySelector('#cw-mfr-search').value = row.dataset.name;
              overlay.querySelector('#cw-mfr-name').value = row.dataset.name;
              overlay.querySelector('#cw-mfr-email').value = row.dataset.email;
              resultsEl.innerHTML = '';
            });
          });
        }, 250);
      });

      overlay.querySelector('#cw-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#cw-confirm-btn').addEventListener('click', async () => {
        const confirmBtn = overlay.querySelector('#cw-confirm-btn');
        const msg = overlay.querySelector('#cw-msg');
        const outcome = outcomeSelect.value;
        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Closing out...';
        try {
          let billToClientId = null;
          if (outcome === 'manufacturer') {
            billToClientId = selectedMfrId;
            if (!billToClientId) {
              const mfrName = overlay.querySelector('#cw-mfr-name').value.trim();
              if (!mfrName) throw new Error('Search for the manufacturer, or type their name to add them as a new client.');
              const { data: newClient, error: clientErr } = await supabaseClient
                .from('clients')
                .insert({ name: mfrName, email: overlay.querySelector('#cw-mfr-email').value.trim() || null })
                .select('id').single();
              if (clientErr) throw clientErr;
              billToClientId = newClient.id;
            }
          }

          if (outcome !== 'no_bill') {
            const labourAmount = parseFloat(overlay.querySelector('#cw-labour').value) || 0;
            const materialAmount = parseFloat(overlay.querySelector('#cw-material').value) || 0;
            if (labourAmount + materialAmount <= 0) throw new Error('Enter a labour or material amount to bill.');

            const { data: { session } } = await supabaseClient.auth.getSession();
            const res = await fetch('/.netlify/functions/create-invoice', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
              body: JSON.stringify({
                projectId: warrantyJobId,
                claims: [{ costCentreId: actuals.costCentreId, labourAmount, materialAmount, claimPercent: null }],
                sentAt: overlay.querySelector('#cw-date').value || null,
                billToClientId,
              }),
            });
            const data = await res.json();
            if (!res.ok || !data.ok) throw new Error(data.error || 'Could not create the invoice');
          }

          const { error: updErr } = await supabaseClient.from('projects').update({
            warranty_outcome: outcome, warranty_closed_at: new Date().toISOString(),
          }).eq('id', warrantyJobId);
          if (updErr) throw updErr;

          await logActivity('project', originalProject.id, 'warranty_job_closed', `Warranty job closed out (${outcome})`);
          overlay.remove();
          location.reload();
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
          confirmBtn.disabled = false;
          confirmBtn.textContent = 'Close out';
        }
      });
    }

    // One "Email invoice to client" for every place an invoice is made or listed: makes sure the PDF
    // exists (the one made on create is reused), then opens the in-app email window with it attached
    // and a View and pay button. Same shape as emailPurchaseOrder in supabase-client.js.
    async function emailInvoiceToClient(invoiceId, project, { btn, msgEl } = {}) {
      const label = btn ? btn.textContent : '';
      if (btn) { btn.disabled = true; btn.textContent = 'Making the PDF...'; }
      if (msgEl) msgEl.innerHTML = '';
      try {
        const readInvoice = async () => {
          const { data, error } = await supabaseClient.from('invoices').select('invoice_number, invoice_token, pdf_path, bill_to_client_id').eq('id', invoiceId).single();
          if (error) throw error;
          return data;
        };
        let inv = await readInvoice();
        if (!inv.pdf_path) {
          await generateClientPdf('invoice', invoiceId); // copes with autoGenerateInvoicePdf running at the same time
          inv = await readInvoice();
          if (!inv.pdf_path) throw new Error('The PDF is not ready yet. Try again in a moment.');
        }
        const n = inv.invoice_number;
        let to = project.client_email || '', name = project.client_name || '';
        if (inv.bill_to_client_id) { // a warranty job billed to the manufacturer
          const { data: billTo } = await supabaseClient.from('clients').select('name, email').eq('id', inv.bill_to_client_id).maybeSingle();
          if (billTo) { to = billTo.email || ''; name = billTo.name || ''; }
        }
        const first = name.trim().split(/\s+/)[0] || 'there';
        const fileName = `${projectRef(project)} - Invoice ${n}.pdf`;
        openEmailComposer({
          title: `Email invoice ${n}`,
          to,
          subject: `Invoice ${n} - ${projectRef(project)}`,
          body: `Hi ${first},\n\nPlease find invoice ${n} for ${project.name} attached. You can also view and pay it online with the button below.\n\nThanks,`,
          projectId: project.id, tagKind: 'client',
          quoteLink: { url: `${shareOrigin()}/invoice.html?token=${inv.invoice_token}`, label: 'Include a button to view and pay the invoice online', buttonText: 'View and pay your invoice', checked: true },
          attachOptions: [{ group: 'Invoice', label: fileName, bucket: 'project-documents', path: inv.pdf_path, name: fileName, checked: true }],
          onSent: async () => {
            await logActivity('project', project.id, 'invoice_emailed', `Invoice ${n} emailed to ${name || 'the client'}`);
            if (btn) { btn.textContent = 'Emailed'; btn.disabled = true; }
          },
        });
      } catch (err) {
        const text = friendlyError(err, 'Could not set up the email.');
        if (msgEl) msgEl.innerHTML = `<div class="error-box">${escapeHtml(text)}</div>`; else alert(text);
      } finally {
        if (btn && btn.textContent === 'Making the PDF...') { btn.disabled = false; btn.textContent = label; }
      }
    }

    // One invoice, multiple stage-claim lines: either a single % of the
    // whole project's contract value (distributed across every stage in
    // proportion to its quoted amount, capped at each stage's own
    // remaining balance and waterfalled to other stages if capped), or a
    // hand-picked amount per stage. opts.preselectCentreId starts the
    // panel in per-stage mode with just that one stage checked - the entry
    // point from a single stage's own "Create & send next claim" button.
    function openInvoiceProjectPanel(project, pricingVisible, opts = {}) {
      const credit = quoteCreditSummary(project);
      const centres = (project.cost_centres || []).map(c => ({
        centre: c, ...stageClaimSummary(c),
        // the quote's credits are offered on the stage each is claimed with, once that stage is fully claimed
        stcRemaining: c.id === credit.stcStageId ? credit.stcRemaining : 0,
        bstcRemaining: c.id === credit.bstcStageId ? credit.bstcRemaining : 0,
      })).filter(x => x.remaining > 0.004 || x.stcRemaining > 0 || x.bstcRemaining > 0);
      // opts.variationsOnly (from the Variations tab) opens the panel even when no stage
      // has anything left to claim, and starts it claiming 0% of the quote so only
      // the logged variations go on the invoice unless you change that.
      if (!centres.length && !opts.variationsOnly) return;
      const projectRemaining = centres.reduce((s, x) => s + x.remaining, 0);
      const mode = opts.preselectCentreId ? 'stage' : 'project';

      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:640px; width:100%; max-height:88vh; overflow-y:auto;">
          <h2>Invoice project</h2>
          <p class="subtitle" style="margin-bottom:12px;">${centres.length ? `${money(projectRemaining)} remaining to claim across ${centres.length} stage${centres.length === 1 ? '' : 's'}.` : 'No quoted stages left to claim.'}</p>

          <div id="inv-stage-part" style="${centres.length ? '' : 'display:none;'}">
          <div style="display:flex; gap:16px; margin-bottom:14px;">
            <label style="display:flex; align-items:center; gap:6px; margin-top:0;"><input type="radio" name="inv-mode" value="project" ${mode === 'project' ? 'checked' : ''} style="width:auto;" /> Whole project %</label>
            <label style="display:flex; align-items:center; gap:6px; margin-top:0;"><input type="radio" name="inv-mode" value="stage" ${mode === 'stage' ? 'checked' : ''} style="width:auto;" /> Choose per stage</label>
          </div>

          <div id="inv-mode-project" style="${mode === 'project' ? '' : 'display:none;'}">
            <label style="margin-top:0">Claim this % of the total contract value</label>
            <input type="number" id="inv-project-pct" min="0" max="100" step="1" value="${opts.variationsOnly ? 0 : 100}" />
            <p class="subtitle" id="inv-project-preview" style="margin-top:8px;"></p>
          </div>

          <div id="inv-mode-stage" style="${mode === 'stage' ? '' : 'display:none;'}">
            <table class="responsive-stack">
              <thead><tr><th></th><th>Stage</th><th class="num">Remaining</th><th class="num">Claim %</th><th class="num">Claim $</th></tr></thead>
              <tbody>
                ${centres.map(x => `
                  <tr>
                    <td data-label=""><input type="checkbox" class="inv-stage-check" data-id="${x.centre.id}" style="width:auto;" ${opts.preselectCentreId ? (opts.preselectCentreId === x.centre.id ? 'checked' : '') : 'checked'} /></td>
                    <td data-label="Stage">${escapeHtml(x.centre.name)}${x.stcRemaining > 0 ? `<br><span class="subtitle" style="font-size:11px;">${money(x.stcRemaining)} STC credit outstanding</span>` : ''}${x.bstcRemaining > 0 ? `<br><span class="subtitle" style="font-size:11px;">${money(x.bstcRemaining)} BSTC credit outstanding</span>` : ''}</td>
                    <td class="num" data-label="Remaining">${money(x.remaining)}</td>
                    <td class="num" data-label="Claim %"><input type="number" inputmode="numeric" class="inv-stage-pct" data-id="${x.centre.id}" min="0" max="100" step="1" value="${!opts.preselectCentreId || opts.preselectCentreId === x.centre.id ? 100 : 0}" style="width:70px;" /></td>
                    <td class="num" data-label="Claim $"><input type="number" inputmode="decimal" class="inv-stage-amt" data-id="${x.centre.id}" step="0.01" style="width:100px;" /></td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
          </div>

          <div id="inv-variations-section"></div>

          <div class="grid cols-2" style="margin-top:14px;">
            <div>
              <label style="margin-top:0">Invoice date</label>
              <input type="date" id="inv-date" value="${new Date().toLocaleDateString('en-CA', { timeZone: 'Australia/Sydney' })}" />
            </div>
            <div>
              <label style="margin-top:0">Due date</label>
              <input type="date" id="inv-due-date" />
              <p class="subtitle" id="inv-due-note" style="font-size:12px; margin:4px 0 0;"></p>
            </div>
          </div>

          <p style="margin-top:14px; font-size:16px;">Total this claim: <strong id="inv-total-display">$0.00</strong></p>

          <div style="margin-top:8px;">
            <button id="inv-confirm-btn">Create invoice</button>
            <button type="button" class="secondary" id="inv-cancel-btn">Cancel</button>
          </div>
          <div id="inv-panel-msg"></div>
        </div>`;

      // Returns the current claim per stage, as {costCentreId, labourAmount,
      // materialAmount, stcAmount, claimPercent}[] - the single source both
      // the live preview and the submit handler read from, so what's shown
      // is always exactly what gets sent.
      function computeClaims() {
        const selectedMode = overlay.querySelector('input[name="inv-mode"]:checked').value;
        if (selectedMode === 'project') {
          const pct = Math.max(0, Math.min(100, parseFloat(overlay.querySelector('#inv-project-pct').value) || 0));
          const allocated = {};
          if (pct >= 100) {
            // Exactly 100% - claim each stage's remaining balance verbatim,
            // no proportional split or rounding involved. Matters because
            // the STC pickup below needs amt to land EXACTLY on x.remaining
            // (not a cent or two short from waterfall rounding), otherwise
            // a "final claim" can silently leave the STC credit unclaimed.
            centres.forEach(x => { allocated[x.centre.id] = x.remaining; });
          } else {
            let targetTotal = projectRemaining * (pct / 100);
            // Proportional-to-remaining, capped per stage, waterfalled: any
            // amount a stage can't absorb (because pct x its remaining alone
            // would be fine, but rounding/edge cases could push it over) is
            // redistributed across stages that still have headroom.
            let pool = centres.map(x => ({ id: x.centre.id, cap: x.remaining, given: 0 }));
            let toDistribute = targetTotal;
            for (let pass = 0; pass < 3 && toDistribute > 0.004 && pool.some(p => p.given < p.cap); pass++) {
              const headroomTotal = pool.reduce((s, p) => s + (p.cap - p.given), 0);
              if (headroomTotal <= 0) break;
              pool.forEach(p => {
                const share = (p.cap - p.given) / headroomTotal * toDistribute;
                const give = Math.min(share, p.cap - p.given);
                p.given += give;
              });
              const given = pool.reduce((s, p) => s + p.given, 0);
              toDistribute = targetTotal - given;
            }
            pool.forEach(p => { allocated[p.id] = Math.round(p.given * 100) / 100; });
          }
          return centres.map(x => {
            const amt = allocated[x.centre.id] || 0;
            const { labourAmount, materialAmount } = splitLabourMaterial(x.centre, amt);
            const stcAmount = amt >= x.remaining - 0.01 ? x.stcRemaining : 0; // full stage claimed -> pick up its STC credit too
            const bstcAmount = amt >= x.remaining - 0.01 ? x.bstcRemaining : 0;
            return { costCentreId: x.centre.id, labourAmount, materialAmount, stcAmount, bstcAmount, claimPercent: x.quotedAmt > 0 ? Math.round(((x.claimedTotal + amt) / x.quotedAmt) * 10000) / 100 : null };
          }).filter(c => c.labourAmount + c.materialAmount + c.stcAmount + c.bstcAmount > 0);
        }

        return centres
          .filter(x => overlay.querySelector(`.inv-stage-check[data-id="${x.centre.id}"]`)?.checked)
          .map(x => {
            const amtInput = overlay.querySelector(`.inv-stage-amt[data-id="${x.centre.id}"]`);
            const amt = Math.max(0, Math.min(x.remaining, parseFloat(amtInput.value) || 0));
            const { labourAmount, materialAmount } = splitLabourMaterial(x.centre, amt);
            const stcAmount = amt >= x.remaining - 0.01 ? x.stcRemaining : 0;
            const bstcAmount = amt >= x.remaining - 0.01 ? x.bstcRemaining : 0;
            return { costCentreId: x.centre.id, labourAmount, materialAmount, stcAmount, bstcAmount, claimPercent: x.quotedAmt > 0 ? Math.round(((x.claimedTotal + amt) / x.quotedAmt) * 10000) / 100 : null };
          })
          .filter(c => c.labourAmount + c.materialAmount + c.stcAmount + c.bstcAmount > 0);
      }

      function refreshStagePctFromDollar(centreId) {
        const x = centres.find(c => c.centre.id === centreId);
        const amtInput = overlay.querySelector(`.inv-stage-amt[data-id="${centreId}"]`);
        const pctInput = overlay.querySelector(`.inv-stage-pct[data-id="${centreId}"]`);
        const amt = Math.max(0, Math.min(x.remaining, parseFloat(amtInput.value) || 0));
        pctInput.value = x.remaining > 0 ? Math.round((amt / x.remaining) * 100) : 0;
      }
      function refreshStageDollarFromPct(centreId) {
        const x = centres.find(c => c.centre.id === centreId);
        const pctInput = overlay.querySelector(`.inv-stage-pct[data-id="${centreId}"]`);
        const amtInput = overlay.querySelector(`.inv-stage-amt[data-id="${centreId}"]`);
        const pct = Math.max(0, Math.min(100, parseFloat(pctInput.value) || 0));
        amtInput.value = Math.round(x.remaining * (pct / 100) * 100) / 100;
      }
      centres.forEach(x => refreshStageDollarFromPct(x.centre.id));

      // Logged variations still to bill (hours + Stock materials), priced by
      // price-variations.js. Ticked ones are turned into their own stages and
      // claimed on this invoice by bill-variations.js when you confirm.
      let varItems = [];
      let invClientType = 'individual';
      const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
      function varTotals(item) {
        const f = 1 + (Number(item.markup) || 0) / 100;
        let labour = 0, material = 0, missing = 0;
        item.lines.forEach((l) => {
          if (l.input === '' || l.input == null || Number.isNaN(Number(l.input))) { missing++; return; }
          if (l.itemType === 'labour') labour += r2(l.quantity * Number(l.input));
          else material += r2(l.quantity * Number(l.input) * f);
        });
        return { labour: r2(labour), material: r2(material), total: r2(labour + material), missing };
      }
      function renderVarSection() {
        const sec = overlay.querySelector('#inv-variations-section');
        if (!varItems.length) {
          sec.innerHTML = opts.variationsOnly ? `<p class="subtitle" style="margin-top:14px;">No logged variations waiting to be billed.</p>` : '';
          return;
        }
        sec.innerHTML = `
          <div style="margin-top:16px;">
            <p style="margin:0 0 4px; font-weight:600;">Logged variations</p>
            <p class="subtitle" style="margin:0 0 6px; font-size:12px;">Tick the ones to add to this invoice. Each becomes its own line on it, priced from the hours and materials logged.</p>
            ${varItems.map((it) => `
              <div class="inv-var" data-id="${it.id}" style="border:1px solid var(--border); border-radius:8px; padding:10px; margin-top:8px;">
                <label style="display:flex; gap:8px; align-items:center; margin:0;">
                  <input type="checkbox" class="inv-var-check" ${it.checked ? 'checked' : ''} ${it.lines.length ? '' : 'disabled'} style="width:auto;" />
                  <strong style="flex:1;">${escapeHtml(it.description)}</strong>
                  <span class="inv-var-total" style="font-weight:600;"></span>
                </label>
                <div class="subtitle" style="font-size:12px; margin:2px 0 6px;">${new Date(it.workDate + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' })}</div>
                ${it.lines.length ? it.lines.map((l) => `
                  <div style="display:flex; gap:8px; align-items:center; font-size:13px; margin-top:4px;">
                    <span style="flex:1;">${r2(l.quantity)}${l.itemType === 'labour' ? ' hrs' : ' &times;'} ${escapeHtml(l.description)}</span>
                    <span class="subtitle" style="font-size:11px;">${l.itemType === 'labour' ? '$/hr' : 'cost $'}</span>
                    <input type="number" class="inv-var-line" data-key="${escapeHtml(l.key)}" step="0.01" min="0" value="${escapeHtml(l.input)}" placeholder="set" style="width:90px; margin:0;" />
                  </div>`).join('') + `
                  <div style="display:flex; gap:8px; align-items:center; font-size:12px; margin-top:6px;">
                    <span class="subtitle" style="flex:1;">Markup on materials</span>
                    <input type="number" class="inv-var-markup" min="0" step="1" value="${it.markup}" style="width:70px; margin:0;" /> <span class="subtitle">%</span>
                  </div>` : `<p class="subtitle" style="margin:0; font-size:12px;">Nothing logged on this yet - add hours or materials to it on the Variations tab, or mark it No charge.</p>`}
              </div>`).join('')}
          </div>`;
        sec.querySelectorAll('.inv-var').forEach((el) => {
          const it = varItems.find(v => v.id === el.dataset.id);
          el.querySelector('.inv-var-check').addEventListener('change', (e) => { it.checked = e.target.checked; refresh(); });
          el.querySelectorAll('.inv-var-line').forEach(inp => inp.addEventListener('input', () => { it.lines.find(l => l.key === inp.dataset.key).input = inp.value; refresh(); }));
          const mk = el.querySelector('.inv-var-markup');
          if (mk) mk.addEventListener('input', () => { it.markup = mk.value; refresh(); });
        });
      }

      function refresh() {
        const claims = computeClaims();
        // Same sum as the invoice's Balance due (calculate_balance_due): labour + materials,
        // plus 10% GST, less the STC credit (plus GST on it for a company client).
        let subtotal = claims.reduce((s, c) => s + c.labourAmount + c.materialAmount, 0);
        const stc = claims.reduce((s, c) => s + c.stcAmount + (c.bstcAmount || 0), 0);
        varItems.forEach((it) => {
          const t = varTotals(it);
          const el = overlay.querySelector(`.inv-var[data-id="${it.id}"] .inv-var-total`);
          if (el) el.textContent = t.missing ? 'set a price' : money(t.total);
          if (it.checked && !t.missing) subtotal += t.total;
        });
        subtotal = r2(subtotal);
        const stcIncGst = invClientType === 'company' ? r2(stc * 1.10) : r2(stc);
        const total = r2(subtotal + r2(subtotal * 0.10) - stcIncGst);
        overlay.querySelector('#inv-total-display').textContent = `${money(total)} inc GST`;
        const pctPreview = overlay.querySelector('#inv-project-preview');
        if (pctPreview) {
          const pct = Math.max(0, Math.min(100, parseFloat(overlay.querySelector('#inv-project-pct').value) || 0));
          pctPreview.textContent = `${money(projectRemaining * (pct / 100))} across ${claims.length} stage${claims.length === 1 ? '' : 's'}.`;
        }
      }

      overlay.querySelectorAll('input[name="inv-mode"]').forEach(r => r.addEventListener('change', () => {
        const selectedMode = overlay.querySelector('input[name="inv-mode"]:checked').value;
        overlay.querySelector('#inv-mode-project').style.display = selectedMode === 'project' ? '' : 'none';
        overlay.querySelector('#inv-mode-stage').style.display = selectedMode === 'stage' ? '' : 'none';
        refresh();
      }));
