      overlay.querySelector('#inv-project-pct').addEventListener('input', refresh);
      overlay.querySelectorAll('.inv-stage-check').forEach(cb => cb.addEventListener('change', refresh));
      overlay.querySelectorAll('.inv-stage-pct').forEach(inp => inp.addEventListener('input', () => { refreshStageDollarFromPct(inp.dataset.id); refresh(); }));
      overlay.querySelectorAll('.inv-stage-amt').forEach(inp => inp.addEventListener('input', () => { refreshStagePctFromDollar(inp.dataset.id); refresh(); }));

      overlay.querySelector('#inv-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#inv-confirm-btn').addEventListener('click', async () => {
        const confirmBtn = overlay.querySelector('#inv-confirm-btn');
        const panelMsg = overlay.querySelector('#inv-panel-msg');
        const claims = computeClaims();
        const chosenVars = varItems.filter(i => i.checked);
        if (!claims.length && !chosenVars.length) { panelMsg.innerHTML = `<div class="error-box">Select at least one stage with a non-zero claim, or tick a logged variation.</div>`; return; }
        const unpriced = chosenVars.find(i => varTotals(i).missing);
        if (unpriced) { panelMsg.innerHTML = `<div class="error-box">Set a price for every line of "${escapeHtml(unpriced.description)}", or untick it.</div>`; return; }

        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Creating...';
        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          const authHeaders = { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` };

          // A variation stage that was set up earlier but never invoiced shows as a
          // normal stage above; claiming the lot of it also marks that variation billed.
          const variationEntryIds = [];
          claims.forEach((c) => {
            const x = centres.find(k => k.centre.id === c.costCentreId);
            if (x && x.centre.variation_entry_id && c.labourAmount + c.materialAmount >= x.remaining - 0.01) variationEntryIds.push(x.centre.variation_entry_id);
          });

          if (chosenVars.length) {
            const bres = await fetch('/.netlify/functions/bill-variations', {
              method: 'POST', headers: authHeaders,
              body: JSON.stringify({
                projectId: project.id,
                items: chosenVars.map(i => ({ id: i.id, markupPercent: i.markup, overrides: Object.fromEntries(i.lines.map(l => [l.key, l.input])) })),
              }),
            });
            const bdata = await bres.json();
            if (!bres.ok || !bdata.ok) throw new Error(bdata.error || 'Could not price the variations');
            bdata.claims.forEach((c) => {
              claims.push({ costCentreId: c.costCentreId, labourAmount: c.labourAmount, materialAmount: c.materialAmount, stcAmount: 0, bstcAmount: 0, claimPercent: c.claimPercent });
              variationEntryIds.push(c.variationId);
            });
          }

          const res = await fetch('/.netlify/functions/create-invoice', {
            method: 'POST',
            headers: authHeaders,
            body: JSON.stringify({
              projectId: project.id,
              claims,
              variationEntryIds,
              sentAt: overlay.querySelector('#inv-date').value || null,
              dueDate: overlay.querySelector('#inv-due-date').value || null,
            }),
          });
          const data = await res.json();
          if (!res.ok || !data.ok) throw new Error(data.error || 'Could not create the invoice');
          await logActivity('project', project.id, 'invoice_created', `Invoice ${data.invoiceNumber} created (${claims.length} stage${claims.length === 1 ? '' : 's'} claimed${chosenVars.length ? `, ${chosenVars.length} variation${chosenVars.length === 1 ? '' : 's'} included` : ''})`);
          autoGenerateInvoicePdf(data.invoiceId);

          const invoiceUrl = `${shareOrigin()}/invoice.html?token=${data.invoiceToken}`;
          panelMsg.innerHTML = `
            <div class="success-box">Created as ${escapeHtml(data.invoiceNumber)}.</div>
            <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
              <button type="button" id="inv-email-btn">Email invoice to client</button>
              <a class="btn secondary" target="_blank" href="/invoice.html?token=${encodeURIComponent(data.invoiceToken)}&print=1">Download PDF</a>
            </div>
            <label>Invoice link (for pasting into a text)</label>
            <input readonly value="${escapeHtml(invoiceUrl)}" onclick="this.select()" />
            <div id="inv-email-msg"></div>`;
          overlay.querySelector('#inv-email-btn').addEventListener('click', (e) => emailInvoiceToClient(data.invoiceId, project, { btn: e.currentTarget, msgEl: overlay.querySelector('#inv-email-msg') }));
          confirmBtn.style.display = 'none';
          overlay.querySelector('#inv-cancel-btn').textContent = 'Close';

          const refreshed = await loadProject();
          if (refreshed) render(refreshed, pricingVisible);
        } catch (err) {
          panelMsg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
          confirmBtn.disabled = false;
          confirmBtn.textContent = 'Create invoice';
        }
      });

      document.body.appendChild(overlay);
      refresh();
      wireInvoiceDueDate(overlay, { dateSel: '#inv-date', dueSel: '#inv-due-date', noteSel: '#inv-due-note', clientId: project.client_id });

      // The bill-to client's type decides whether the STC credit carries GST (as invoice_client_type does).
      if (project.client_id) {
        supabaseClient.from('clients').select('client_type').eq('id', project.client_id).maybeSingle()
          .then(({ data }) => { invClientType = data?.client_type || 'individual'; refresh(); });
      }

      // Price the logged variations (server side - it needs each person's sell rate).
      (async () => {
        const sec = overlay.querySelector('#inv-variations-section');
        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          const res = await fetch('/.netlify/functions/price-variations', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
            body: JSON.stringify({ projectId: project.id }),
          });
          const d = await res.json();
          if (!res.ok || !d.ok) throw new Error(d.error || 'Could not price them');
          varItems = (d.variations || []).map(v => ({
            id: v.id, description: v.description, workDate: v.workDate, markup: d.defaultMarkup,
            checked: v.lines.length > 0,
            lines: v.lines.map(l => ({ ...l, input: l.unitCost == null ? '' : String(l.unitCost) })),
          }));
          renderVarSection();
        } catch (err) {
          sec.innerHTML = `<div class="error-box" style="margin-top:12px;">Couldn't price the logged variations: ${escapeHtml(friendlyError(err))}</div>`;
        }
        refresh();
      })();
    }

    async function pushExistingInvoiceToXero(btn, msgElId = 'push-xero-msg') {
      const msg = document.getElementById(msgElId);
      btn.disabled = true;
      btn.textContent = 'Pushing...';
      msg.innerHTML = '';
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        const res = await fetch('/.netlify/functions/push-invoice-to-xero', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify({ invoiceId: btn.dataset.invoiceId }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Push failed');
        msg.innerHTML = `<div class="success-box">Pushed ${data.invoiceNumber} to Xero.</div>`;
        location.reload();
      } catch (err) {
        msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
        btn.disabled = false;
        btn.textContent = 'Push to Xero';
      }
    }

    // Internal view of every invoice raised for this job - shown as its own
    // tab rather than only a link out to the client-facing page, and
    // specifically showing how each one will actually post to Xero: split
    // into Labour/Materials/STC groups (not by stage - that's how Xero
    // actually codes them), using the accounts set in Settings > Xero
    // Mapping. Same xeroBreakdownHtml() the standalone Invoices list uses,
    // so the two can never disagree. Each invoice pushes to Xero on its
    // own; never bundled together by project.
    // Invoice PDFs brought across from ServiceM8 (sm8-copy-attachments,
    // folder "ServiceM8 invoices"). Copies of what ServiceM8 already sent,
    // for reference: not invoices in the app, so they never touch Xero or
    // invoiced to date. Kept out of the Documents tab.
    const SM8_INVOICE_FOLDER = 'ServiceM8 invoices';
    async function loadSm8Invoices(projectId) {
      const el = document.getElementById('sm8-invoices-list');
      if (!el) return;
      const { data: docs } = await supabaseClient.from('project_documents')
        .select('id, file_path, file_name, created_at').eq('project_id', projectId).eq('folder', SM8_INVOICE_FOLDER).order('created_at');
      if (!docs || !docs.length) { el.innerHTML = ''; return; }
      el.innerHTML = `
        <h3 style="font-size:14px; margin:18px 0 6px;">From ServiceM8</h3>
        <p class="subtitle" style="margin:0 0 8px;">Invoices already sent from ServiceM8, for reference. They are counted in invoiced to date from the import, not here. Deleting one only removes this copy.</p>
        <table class="responsive-stack">
          <thead><tr><th>Invoice</th><th>Date</th><th></th></tr></thead>
          <tbody>${docs.map(d => `
            <tr><td data-label="Invoice"><a href="#" class="sm8-inv-link" data-path="${escapeHtml(d.file_path)}" style="color:var(--text); text-decoration:underline; font-weight:600;">${escapeHtml(d.file_name.replace(/\.pdf$/i, ''))}</a></td>
            <td data-label="Date">${new Date(d.created_at).toLocaleDateString('en-AU')}</td>
            <td><button type="button" class="secondary sm8-inv-delete" data-id="${d.id}" style="font-size:12px; padding:4px 10px;">Delete</button></td></tr>`).join('')}
          </tbody>
        </table>`;
      el.querySelectorAll('.sm8-inv-link').forEach(a => a.addEventListener('click', (e) => {
        e.preventDefault();
        const d = docs.find(x => x.file_path === a.dataset.path);
        openPdfViewer(d.file_path, d.file_name);
      }));
      el.querySelectorAll('.sm8-inv-delete').forEach(btn => btn.addEventListener('click', async () => {
        const d = docs.find(x => x.id === btn.dataset.id);
        if (!confirm(`Delete "${d.file_name}"? This only removes the copy here, nothing in ServiceM8 or Xero.`)) return;
        try {
          await supabaseClient.storage.from('project-documents').remove([d.file_path]);
          const { error: delErr } = await supabaseClient.from('project_documents').delete().eq('id', d.id);
          if (delErr) throw delErr;
          await logActivity('project', projectId, 'sm8_invoice_deleted', `Deleted ServiceM8 invoice copy ${d.file_name}`);
          await loadSm8Invoices(projectId);
        } catch (err) { alert(friendlyError(err)); }
      }));
    }

    async function loadJobInvoices(project) {
      const listEl = document.getElementById('job-invoices-list');
      const myRole = await getMyRole();
      const canIssueCreditNote = myRole === 'admin' || myRole === 'finance';
      const [{ data: invoices, error }, { data: mappings }, { data: client }] = await Promise.all([
        supabaseClient.from('invoices').select('*, cost_centres(name), invoice_claims(*, cost_centres(name, sort_order)), credit_notes(*)').eq('project_id', project.id).order('sent_at', { ascending: false }),
        supabaseClient.from('xero_account_mapping').select('*'),
        project.client_id ? supabaseClient.from('clients').select('client_type').eq('id', project.client_id).maybeSingle() : Promise.resolve({ data: null }),
      ]);
      if (error) { listEl.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(error))}</div>`; return; }
      if (!invoices.length) { listEl.innerHTML = `<p class="subtitle">No invoices raised yet.</p>`; return; }

      const clientType = client?.client_type || 'individual';

      listEl.innerHTML = invoices.map(inv => `
        <div style="border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:14px;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:8px;">
            <div>
              <strong>${escapeHtml(inv.invoice_number)}</strong>${inv.description ? ` - ${escapeHtml(inv.description)}` : ''}
              <span class="badge ${inv.paid_at ? 'accepted' : 'sent'}" style="margin-left:6px;">${inv.paid_at ? 'Paid' : 'Awaiting payment'}</span>
              <p class="subtitle" style="margin:4px 0 0; font-size:12px;">${new Date(inv.sent_at).toLocaleDateString('en-AU')}${inv.due_date ? ` &middot; Due ${new Date(inv.due_date + 'T00:00:00').toLocaleDateString('en-AU')}` : ''}</p>
            </div>
            <div>
              <a class="link-quiet" href="/invoice.html?token=${inv.invoice_token}" target="_blank" style="font-size:12px; margin-right:10px;">View client-facing invoice</a>
              <button type="button" class="secondary email-invoice-btn" data-invoice-id="${inv.id}" style="font-size:12px; padding:6px 10px; margin-right:8px;">Email</button>
              ${inv.pdf_path ? `<button type="button" class="secondary view-invoice-pdf-btn" data-invoice-id="${inv.id}" style="font-size:12px; padding:6px 10px; margin-right:8px;">View PDF</button>` : ''}
              <button type="button" class="secondary generate-invoice-pdf-btn" data-invoice-id="${inv.id}" style="font-size:12px; padding:6px 10px; margin-right:8px;">${inv.pdf_path ? 'Regenerate PDF' : 'Generate PDF'}</button>
              ${!inv.xero_invoice_id && !inv.paid_at
                ? `<button type="button" class="secondary edit-invoice-btn" data-invoice-id="${inv.id}" style="font-size:12px; padding:6px 10px; margin-right:8px;">Edit</button>`
                : (canIssueCreditNote ? `<button type="button" class="secondary issue-credit-note-btn" data-invoice-id="${inv.id}" style="font-size:12px; padding:6px 10px; margin-right:8px;">Issue credit note</button>` : '')}
              ${inv.xero_invoice_id ? '<span class="subtitle" style="font-size:12px;">In Xero</span>' : `<button type="button" class="secondary push-xero-tab-btn" data-invoice-id="${inv.id}" style="font-size:12px; padding:6px 10px;">Push to Xero</button>`}
            </div>
            ${(inv.credit_notes || []).length ? `
              <div style="width:100%; margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);">
                ${inv.credit_notes.map(cn => `
                  <p class="subtitle" style="font-size:12px; margin:4px 0;">
                    Credit note${cn.reason ? ` - ${escapeHtml(cn.reason)}` : ''} (${new Date(cn.created_at).toLocaleDateString('en-AU')})
                    ${cn.refund ? `<span class="badge info" style="margin-left:4px;">Refunded${cn.refund_reference ? ` - ${escapeHtml(cn.refund_reference)}` : ''}</span>` : `<span class="badge accepted" style="margin-left:4px;">Account credit</span>`}
                    ${cn.xero_credit_note_id ? '<span style="margin-left:6px;">In Xero</span>' : (canIssueCreditNote ? `<button type="button" class="secondary push-credit-note-btn" data-credit-note-id="${cn.id}" style="font-size:11px; padding:4px 8px; margin-left:6px;">Push to Xero</button>` : '')}
                    ${cn.xero_credit_note_error ? `<span class="error-box" style="display:block; margin-top:4px;">${escapeHtml(cn.xero_credit_note_error)}</span>` : ''}
                  </p>`).join('')}
              </div>` : ''}
          </div>
          <div style="margin-top:12px;">${xeroBreakdownHtml(inv, mappings, clientType)}</div>
          <div id="invoice-pdf-msg-${inv.id}">${inv.pdf_error ? `<div class="error-box" style="margin-top:8px; font-size:12px;">${escapeHtml(inv.pdf_error)}</div>` : ''}</div>
        </div>`).join('') + `<div id="job-invoices-msg"></div>`;

      listEl.querySelectorAll('.push-xero-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => pushExistingInvoiceToXero(btn, 'job-invoices-msg'));
      });
      listEl.querySelectorAll('.edit-invoice-btn').forEach(btn => {
        btn.addEventListener('click', () => openEditInvoicePanel(invoices.find(i => i.id === btn.dataset.invoiceId), project));
      });
      listEl.querySelectorAll('.issue-credit-note-btn').forEach(btn => {
        btn.addEventListener('click', () => openIssueCreditNotePanel(invoices.find(i => i.id === btn.dataset.invoiceId), project));
      });
      listEl.querySelectorAll('.push-credit-note-btn').forEach(btn => {
        btn.addEventListener('click', () => pushCreditNoteToXero(btn));
      });
      listEl.querySelectorAll('.email-invoice-btn').forEach(btn => {
        btn.addEventListener('click', () => emailInvoiceToClient(btn.dataset.invoiceId, project, { btn, msgEl: document.getElementById(`invoice-pdf-msg-${btn.dataset.invoiceId}`) }));
      });
      listEl.querySelectorAll('.view-invoice-pdf-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const inv = invoices.find(i => i.id === btn.dataset.invoiceId);
          openPdfViewer(inv.pdf_path, `Invoice ${inv.invoice_number}`, { projectId: project.id, folder: 'Marked up' });
        });
      });
      listEl.querySelectorAll('.generate-invoice-pdf-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const inv = invoices.find(i => i.id === btn.dataset.invoiceId);
          const msgEl = document.getElementById(`invoice-pdf-msg-${inv.id}`);
          btn.disabled = true;
          btn.textContent = 'Generating...';
          msgEl.innerHTML = '';
          try {
            await generateClientPdf('invoice', inv.id);
            loadJobInvoices(project);
          } catch (err) {
            msgEl.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
            btn.disabled = false;
            btn.textContent = inv.pdf_path ? 'Regenerate PDF' : 'Generate PDF';
          }
        });
      });
    }

    // Lets an invoice's claim amounts be corrected before it's ever been
    // pushed to Xero - per stage, split into Labour/Materials/STC (the
    // actual invoice_claims granularity; a legacy single-stage invoice
    // just gets one row here). Adjusts each touched cost centre's
    // invoiced_amount by the delta between old and new (never overwrites
    // it outright, since that figure aggregates every invoice on that
    // stage, not just this one). Only ever called for an unpushed,
    // unpaid invoice (see loadJobInvoices' button gating) - once pushed,
    // Xero itself rejects line-item edits on an AUTHORISED invoice via
    // the API, so correcting it from that point on goes through a credit
    // note instead (openIssueCreditNotePanel), not this panel.
    function openEditInvoicePanel(invoice, project) {
      const isMultiStage = invoice.invoice_claims && invoice.invoice_claims.length > 0;
      const rows = isMultiStage
        ? invoice.invoice_claims.slice().sort((a, b) => (a.cost_centres?.sort_order || 0) - (b.cost_centres?.sort_order || 0))
            .map(ic => ({ id: ic.id, cost_centre_id: ic.cost_centre_id, stageName: ic.cost_centres?.name || 'Stage', labour: Number(ic.labour_amount) || 0, material: Number(ic.material_amount) || 0, stc: Number(ic.stc_amount) || 0, bstc: Number(ic.bstc_amount) || 0 }))
        : [{
            id: null,
            cost_centre_id: invoice.cost_centre_id || null,
            stageName: invoice.cost_centre_id ? (invoice.cost_centres?.name || 'Stage') : (invoice.description || 'Invoice'),
            labour: Number(invoice.labour_amount) || 0, material: Number(invoice.material_amount) || 0, stc: Number(invoice.stc_amount) || 0, bstc: Number(invoice.bstc_amount) || 0,
          }];

      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:560px; width:100%; max-height:85vh; overflow-y:auto;">
          <h2>Edit ${invoice.invoice_number}</h2>
          <p class="subtitle" style="margin-bottom:12px;">Not yet pushed to Xero - saving just updates the amounts here.</p>
          <div class="grid cols-2" style="margin-bottom:12px;">
            <div>
              <label style="margin-top:0">Invoice date</label>
              <input type="date" id="ei-date" value="${invoice.sent_at ? new Date(invoice.sent_at).toLocaleDateString('en-CA', { timeZone: 'Australia/Sydney' }) : ''}" />
            </div>
            <div>
              <label style="margin-top:0">Due date</label>
              <input type="date" id="ei-due-date" value="${invoice.due_date || ''}" />
            </div>
          </div>
          <table>
            <thead><tr><th>Stage</th><th class="num">Labour</th><th class="num">Materials</th><th class="num">STC credit</th><th class="num">BSTC credit</th></tr></thead>
            <tbody>
              ${rows.map((r, i) => `
                <tr>
                  <td>${r.stageName}</td>
                  <td class="num"><input type="number" step="0.01" class="ei-labour" data-i="${i}" value="${r.labour}" style="width:100px;" /></td>
                  <td class="num"><input type="number" step="0.01" class="ei-material" data-i="${i}" value="${r.material}" style="width:100px;" /></td>
                  <td class="num"><input type="number" step="0.01" class="ei-stc" data-i="${i}" value="${r.stc}" style="width:100px;" /></td>
                  <td class="num"><input type="number" step="0.01" class="ei-bstc" data-i="${i}" value="${r.bstc}" style="width:100px;" /></td>
                </tr>`).join('')}
            </tbody>
          </table>
          <p style="margin-top:12px;">Total: <strong id="ei-total"></strong></p>
          <div style="margin-top:10px;">
            <button id="ei-save-btn">Save${invoice.xero_invoice_id ? ' &amp; push to Xero' : ''}</button>
            <button type="button" class="secondary" id="ei-cancel-btn">Cancel</button>
          </div>
          <div id="ei-msg"></div>
        </div>`;
      document.body.appendChild(overlay);

      function readValues() {
        return rows.map((r, i) => ({
          ...r,
          labour: parseFloat(overlay.querySelector(`.ei-labour[data-i="${i}"]`).value) || 0,
          material: parseFloat(overlay.querySelector(`.ei-material[data-i="${i}"]`).value) || 0,
          stc: parseFloat(overlay.querySelector(`.ei-stc[data-i="${i}"]`).value) || 0,
          bstc: parseFloat(overlay.querySelector(`.ei-bstc[data-i="${i}"]`).value) || 0,
        }));
      }
      function updateTotal() {
        const vals = readValues();
        const total = vals.reduce((s, r) => s + r.labour + r.material - r.stc - r.bstc, 0);
        overlay.querySelector('#ei-total').textContent = money(total);
      }
      overlay.querySelectorAll('input').forEach(inp => inp.addEventListener('input', updateTotal));

      overlay.querySelector('#ei-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#ei-save-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#ei-msg');
        const saveBtn = overlay.querySelector('#ei-save-btn');
        const saveBtnLabel = saveBtn.textContent;
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving...';
        try {
          const newRows = readValues();
          // Every write is checked. Order: claims, then the invoice, then each stage's
          // invoiced_amount. If one fails, what was already written is put back (best
          // effort) so the stage and the invoice never disagree.
          const undo = [];
          const mustUpdate = async (table, values, id, what) => {
            const { data, error } = await supabaseClient.from(table).update(values).eq('id', id).select('id');
            if (error) throw new Error(`Could not save ${what}: ${error.message}`);
            if (!data || !data.length) throw new Error(`Could not save ${what}: no permission or it no longer exists.`);
          };
          try {
            if (isMultiStage) {
              for (let i = 0; i < rows.length; i++) {
                const o = rows[i], r = newRows[i];
                await mustUpdate('invoice_claims', { labour_amount: r.labour, material_amount: r.material, stc_amount: r.stc, bstc_amount: r.bstc }, r.id, `the ${r.stageName} claim`);
                undo.push(() => supabaseClient.from('invoice_claims').update({ labour_amount: o.labour, material_amount: o.material, stc_amount: o.stc, bstc_amount: o.bstc }).eq('id', o.id));
              }
            }

            const totalLabour = newRows.reduce((s, r) => s + r.labour, 0);
            const totalMaterial = newRows.reduce((s, r) => s + r.material, 0);
            const totalStc = newRows.reduce((s, r) => s + r.stc, 0);
            const totalBstc = newRows.reduce((s, r) => s + r.bstc, 0);
            const newDate = overlay.querySelector('#ei-date').value;
            const newDueDate = overlay.querySelector('#ei-due-date').value || null;
            await mustUpdate('invoices', {
              labour_amount: totalLabour, material_amount: totalMaterial, stc_amount: totalStc, bstc_amount: totalBstc,
              sent_at: newDate ? new Date(newDate).toISOString() : invoice.sent_at,
              due_date: newDueDate,
            }, invoice.id, `invoice ${invoice.invoice_number}`);
            undo.push(() => supabaseClient.from('invoices').update({
              labour_amount: invoice.labour_amount, material_amount: invoice.material_amount, stc_amount: invoice.stc_amount, bstc_amount: invoice.bstc_amount,
              sent_at: invoice.sent_at, due_date: invoice.due_date,
            }).eq('id', invoice.id));

            for (let i = 0; i < rows.length; i++) {
              const oldRow = rows[i], newRow = newRows[i];
              if (!newRow.cost_centre_id) continue;
              const delta = (newRow.labour + newRow.material) - (oldRow.labour + oldRow.material);
              if (Math.abs(delta) < 0.001) continue;
              const { data: centre, error: ccErr } = await supabaseClient.from('cost_centres').select('invoiced_amount').eq('id', newRow.cost_centre_id).single();
              if (ccErr) throw new Error(`Could not read the ${newRow.stageName} stage: ${ccErr.message}`);
              const before = Number(centre?.invoiced_amount) || 0;
              await mustUpdate('cost_centres', { invoiced_amount: before + delta }, newRow.cost_centre_id, `the ${newRow.stageName} stage's invoiced amount`);
              undo.push(() => supabaseClient.from('cost_centres').update({ invoiced_amount: before }).eq('id', newRow.cost_centre_id));
            }
          } catch (saveErr) {
            let undoFailed = false;
            for (const fn of undo.reverse()) {
              try { const { error } = await fn(); if (error) undoFailed = true; } catch (e) { undoFailed = true; }
            }
            throw new Error(`${saveErr.message} ${undoFailed
              ? 'Some changes could not be put back: reload and check this invoice and its stages before trying again.'
              : 'Nothing was changed.'}`);
          }

          await logActivity('project', project.id, 'invoice_edited', `Edited invoice ${invoice.invoice_number}`);

          overlay.remove();
          location.reload();
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
          saveBtn.disabled = false;
          saveBtn.textContent = saveBtnLabel;
        }
      });

      updateTotal();
    }

    // The correction path for an invoice that's already been pushed to
    // Xero (see openEditInvoicePanel's comment for why a raw edit no
    // longer works past that point). Pre-fills each stage's still-
    // creditable amount (this invoice's original claim, minus whatever's
    // already been credited against it before), staff can reduce any of
    // them for a partial credit. Finance/Admin only (button gated in
    // loadJobInvoices) - server-side enforced too, see require-finance-role.js.
    async function openIssueCreditNotePanel(invoice, project) {
      const isMultiStage = invoice.invoice_claims && invoice.invoice_claims.length > 0;
      const originalRows = isMultiStage
        ? invoice.invoice_claims.slice().sort((a, b) => (a.cost_centres?.sort_order || 0) - (b.cost_centres?.sort_order || 0))
            .map(ic => ({ cost_centre_id: ic.cost_centre_id, stageName: ic.cost_centres?.name || 'Stage', labour: Number(ic.labour_amount) || 0, material: Number(ic.material_amount) || 0, stc: Number(ic.stc_amount) || 0, bstc: Number(ic.bstc_amount) || 0 }))
        : [{
            cost_centre_id: invoice.cost_centre_id || null,
            stageName: invoice.cost_centre_id ? (invoice.cost_centres?.name || 'Stage') : (invoice.description || 'Invoice'),
            labour: Number(invoice.labour_amount) || 0, material: Number(invoice.material_amount) || 0, stc: Number(invoice.stc_amount) || 0, bstc: Number(invoice.bstc_amount) || 0,
          }];

      const { data: priorCredits } = await supabaseClient
        .from('credit_note_claims')
        .select('cost_centre_id, labour_amount, material_amount, stc_amount, bstc_amount, credit_notes!inner(invoice_id)')
        .eq('credit_notes.invoice_id', invoice.id);
      const alreadyCreditedByCentre = {};
      (priorCredits || []).forEach(pc => {
        const cur = alreadyCreditedByCentre[pc.cost_centre_id] || { labour: 0, material: 0, stc: 0, bstc: 0 };
        cur.labour += Number(pc.labour_amount) || 0;
        cur.material += Number(pc.material_amount) || 0;
        cur.stc += Number(pc.stc_amount) || 0;
        cur.bstc += Number(pc.bstc_amount) || 0;
        alreadyCreditedByCentre[pc.cost_centre_id] = cur;
      });

      const rows = originalRows.map(r => {
        const already = alreadyCreditedByCentre[r.cost_centre_id] || { labour: 0, material: 0, stc: 0, bstc: 0 };
        return {
          cost_centre_id: r.cost_centre_id, stageName: r.stageName,
          maxLabour: Math.max(0, r.labour - already.labour), maxMaterial: Math.max(0, r.material - already.material), maxStc: Math.max(0, r.stc - already.stc), maxBstc: Math.max(0, r.bstc - already.bstc),
        };
      }).filter(r => r.maxLabour + r.maxMaterial + r.maxStc + r.maxBstc > 0.004);

      if (!rows.length) {
        alert('This invoice has already been fully credited - there\'s nothing left to credit.');
        return;
      }

      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:600px; width:100%; max-height:85vh; overflow-y:auto;">
          <h2>Issue credit note - ${invoice.invoice_number}</h2>
          <p class="subtitle" style="margin-bottom:12px;">Defaults to a full credit of what's left claimable on this invoice - reduce any amount for a partial credit. This creates the credit note here; push it to Xero separately once you're happy with it.</p>
          <table>
            <thead><tr><th>Stage</th><th class="num">Labour</th><th class="num">Materials</th><th class="num">STC</th><th class="num">BSTC</th></tr></thead>
            <tbody>
              ${rows.map((r, i) => `
                <tr>
                  <td>${r.stageName}</td>
                  <td class="num"><input type="number" step="0.01" min="0" max="${r.maxLabour}" class="cn-labour" data-i="${i}" value="${r.maxLabour.toFixed(2)}" style="width:100px;" /></td>
                  <td class="num"><input type="number" step="0.01" min="0" max="${r.maxMaterial}" class="cn-material" data-i="${i}" value="${r.maxMaterial.toFixed(2)}" style="width:100px;" /></td>
                  <td class="num"><input type="number" step="0.01" min="0" max="${r.maxStc}" class="cn-stc" data-i="${i}" value="${r.maxStc.toFixed(2)}" style="width:90px;" /></td>
                  <td class="num"><input type="number" step="0.01" min="0" max="${r.maxBstc}" class="cn-bstc" data-i="${i}" value="${r.maxBstc.toFixed(2)}" style="width:90px;" /></td>
                </tr>`).join('')}
            </tbody>
          </table>
          <p class="subtitle" style="margin-top:8px;">Total credit: <strong id="cn-total" style="color:var(--text);"></strong></p>
          <label style="margin-top:10px;">Reason</label>
          <input id="cn-reason" placeholder="e.g. Client disputed the materials line, agreed to reduce it" />
          <label style="display:flex; align-items:center; gap:6px; margin-top:12px;">
            <input type="checkbox" id="cn-refund" style="width:auto;" ${invoice.paid_at ? 'checked' : ''} />
            This has already been paid - refund the money back to the client (rather than leave it as account credit)
          </label>
          <div id="cn-refund-ref-row" style="display:${invoice.paid_at ? 'block' : 'none'};">
            <label>How was it refunded</label>
            <input id="cn-refund-ref" placeholder="e.g. Bank transfer 12 Sep, or Airwallex refund ID" />
          </div>
          <div style="margin-top:14px;">
            <button id="cn-save-btn">Create credit note</button>
            <button type="button" class="secondary" id="cn-cancel-btn">Cancel</button>
          </div>
          <div id="cn-msg"></div>
        </div>`;
      document.body.appendChild(overlay);

      function readValues() {
        return rows.map((r, i) => ({
          cost_centre_id: r.cost_centre_id,
          labour: Math.min(r.maxLabour, Math.max(0, parseFloat(overlay.querySelector(`.cn-labour[data-i="${i}"]`).value) || 0)),
          material: Math.min(r.maxMaterial, Math.max(0, parseFloat(overlay.querySelector(`.cn-material[data-i="${i}"]`).value) || 0)),
          stc: Math.min(r.maxStc, Math.max(0, parseFloat(overlay.querySelector(`.cn-stc[data-i="${i}"]`).value) || 0)),
          bstc: Math.min(r.maxBstc, Math.max(0, parseFloat(overlay.querySelector(`.cn-bstc[data-i="${i}"]`).value) || 0)),
        }));
      }
      function updateTotal() {
        const total = readValues().reduce((s, r) => s + r.labour + r.material, 0);
        overlay.querySelector('#cn-total').textContent = money(total);
      }
      overlay.querySelectorAll('input[type="number"]').forEach(inp => inp.addEventListener('input', updateTotal));
      overlay.querySelector('#cn-refund').addEventListener('change', (e) => {
        overlay.querySelector('#cn-refund-ref-row').style.display = e.target.checked ? 'block' : 'none';
      });

      overlay.querySelector('#cn-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#cn-save-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#cn-msg');
        const saveBtn = overlay.querySelector('#cn-save-btn');
        saveBtn.disabled = true;
        saveBtn.textContent = 'Creating...';
        try {
          const claims = readValues().filter(r => r.labour + r.material + r.stc + r.bstc > 0.004);
          if (!claims.length) throw new Error('Enter at least one non-zero credit amount');

          const { data: { session } } = await supabaseClient.auth.getSession();
          const res = await fetch('/.netlify/functions/create-credit-note', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
            body: JSON.stringify({
              invoiceId: invoice.id,
              reason: overlay.querySelector('#cn-reason').value.trim() || null,
              refund: overlay.querySelector('#cn-refund').checked,
              refundReference: overlay.querySelector('#cn-refund-ref').value.trim() || null,
              claims: claims.map(c => ({ costCentreId: c.cost_centre_id, labourAmount: c.labour, materialAmount: c.material, stcAmount: c.stc, bstcAmount: c.bstc })),
            }),
          });
          const data = await res.json();
          if (!res.ok || !data.ok) throw new Error(data.error || 'Could not create the credit note');

          await logActivity('project', project.id, 'credit_note_created', `Credit note created against invoice ${invoice.invoice_number}`);
          overlay.remove();
          location.reload();
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
          saveBtn.disabled = false;
          saveBtn.textContent = 'Create credit note';
        }
      });

      updateTotal();
    }

    async function pushCreditNoteToXero(btn) {
      const msg = document.getElementById('job-invoices-msg');
      btn.disabled = true;
      btn.textContent = 'Pushing...';
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        const res = await fetch('/.netlify/functions/push-credit-note-to-xero', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify({ creditNoteId: btn.dataset.creditNoteId }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Push failed');
        location.reload();
      } catch (err) {
        if (msg) msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
        btn.disabled = false;
        btn.textContent = 'Push to Xero';
      }
    }

    // Needs attention line on the Summary tab: shown until a certificate is
    // uploaded or a not-required reason is saved (both re-run initCcewSection).
    function renderCcewNudge(project) {
      const line = document.getElementById('summary-ccew-line');
      if (!line) return;
      line.innerHTML = project.job_number && !project.ccew_file_path && !project.ccew_not_required_reason
        ? '<p class="subtitle" style="margin-bottom:6px;">No CCEW uploaded yet. Add it under Compliance - CCEW on this tab.</p>'
        : '';
    }

    async function initCcewSection(project) {
      renderCcewNudge(project);
      const el = document.getElementById('ccew-section');
      if (!el) return;

      if (project.ccew_file_path) {
        el.innerHTML = `
          <div class="success-box" style="margin-bottom:10px;">CCEW uploaded.</div>
          <button type="button" class="secondary" id="ccew-view-btn">View certificate</button>
          <button type="button" class="secondary" id="ccew-replace-btn" style="margin-left:8px;">Replace</button>
          <div id="ccew-view-msg"></div>`;
        el.querySelector('#ccew-replace-btn').addEventListener('click', () => renderCcewUploadForm(project));
        el.querySelector('#ccew-view-btn').addEventListener('click', async () => {
          const msg = el.querySelector('#ccew-view-msg');
          msg.innerHTML = '';
          try {
            // Tab is opened on the tap itself (no await before it) so iPhone Safari does not block it.
            await openSignedDocInNewTab(project.ccew_file_path);
          } catch (err) {
            msg.innerHTML = `<div class="error-box" style="margin-top:10px;">Could not open: ${escapeHtml(friendlyError(err))}</div>`;
          }
        });
      } else if (project.ccew_not_required_reason) {
        el.innerHTML = `
          <div class="badge draft" style="margin-bottom:10px; display:inline-block;">Not required</div>
          <p class="subtitle" style="margin-bottom:10px;">${escapeHtml(project.ccew_not_required_reason)}</p>
          <button type="button" class="secondary" id="ccew-change-btn">Upload one instead / change reason</button>`;
        el.querySelector('#ccew-change-btn').addEventListener('click', () => renderCcewUploadForm(project));
      } else {
        renderCcewUploadForm(project);
      }
    }

    function renderCcewUploadForm(project) {
      const el = document.getElementById('ccew-section');
      el.innerHTML = `
        <label class="btn" id="ccew-upload-btn" style="margin:0; cursor:pointer;">Upload the CCEW (photo or PDF)<input type="file" id="ccew-file-input" accept="image/*,.pdf,application/pdf" style="display:none;" /></label>
        <p class="subtitle" style="margin:10px 0 4px;">Or, if this job isn't electrical work and no CCEW applies:</p>
        <input id="ccew-reason-input" placeholder="e.g. Not electrical work" />
        <button type="button" class="secondary" id="ccew-save-reason-btn" style="margin-top:8px;">Save reason</button>
        <div id="ccew-msg"></div>`;

      el.querySelector('#ccew-file-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const msg = el.querySelector('#ccew-msg');
        const input = e.target;
        const labelBtn = el.querySelector('#ccew-upload-btn');
        const saveBtn = el.querySelector('#ccew-save-reason-btn');
        input.disabled = true;
        labelBtn.firstChild.textContent = 'Uploading...';
        labelBtn.style.opacity = '0.5';
        labelBtn.style.pointerEvents = 'none';
        saveBtn.disabled = true;
        msg.innerHTML = '';
        try {
          const path = await uploadPrivateFile(file, `ccew/${project.id}`);
          const { error } = await supabaseClient.from('projects').update({ ccew_file_path: path, ccew_not_required_reason: null }).eq('id', project.id);
          if (error) throw error;
          project.ccew_file_path = path;
          project.ccew_not_required_reason = null;
          await initCcewSection(project);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
          input.disabled = false;
          input.value = '';
          labelBtn.firstChild.textContent = 'Upload the CCEW (photo or PDF)';
          labelBtn.style.opacity = '';
          labelBtn.style.pointerEvents = '';
          saveBtn.disabled = false;
        }
      });

      el.querySelector('#ccew-save-reason-btn').addEventListener('click', async () => {
        const reason = el.querySelector('#ccew-reason-input').value.trim();
        const msg = el.querySelector('#ccew-msg');
        if (!reason) { msg.innerHTML = `<div class="error-box">Enter a reason.</div>`; return; }
        const btn = el.querySelector('#ccew-save-reason-btn');
        const label = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Saving...';
        try {
          const { error } = await supabaseClient.from('projects').update({ ccew_not_required_reason: reason, ccew_file_path: null }).eq('id', project.id);
          if (error) { msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(error))}</div>`; return; }
          project.ccew_not_required_reason = reason;
          project.ccew_file_path = null;
          await initCcewSection(project);
        } finally {
          // initCcewSection replaces the card on success, so only restore a button still on the page.
          if (el.contains(btn)) { btn.disabled = false; btn.textContent = label; }
        }
      });
    }

    // ---------- the quote in steps (item 27) ----------

    function quoteStepTicks(project, centres) {
      const answers = project.template_answers || {};
      const quoted = (centres || []).reduce((s, c) => s + Number(c.quoted_amount || 0), 0);
      return {
        1: !!answers.info_source && missingRequiredAnswers(project.proposal_template, answers).length === 0,
        2: project.site_visit_decision === 'not_needed' || (project.site_visit_decision === 'needed' && !!project.site_visit_done),
        3: quoted > 0,
        4: !!(project.sow_text || '').trim(),
        5: ['sent', 'accepted', 'approved'].includes(project.status),
      };
    }

    function quoteStepsBarHtml(project, centres) {
      const ticks = quoteStepTicks(project, centres);
      const steps = [[1, 'Pre-quote info'], [2, 'Site visit'], [3, 'Pricing'], [4, 'Scope of works'], [5, 'Send']];
      return steps.map(([n, label]) => `<a class="btn secondary qstep-link" href="#qstep-${n}" data-step="${n}" style="font-size:13px; padding:8px 12px; ${ticks[n] ? 'border-color:var(--green);' : ''}">${ticks[n] ? '<span style="color:var(--green);">&#10003;</span> ' : ''}${n}. ${label}</a>`).join('');
    }

                <div id="bill-card" style="margin-top:14px; padding:12px; background:var(--surface-2); border-radius:8px; ${['solar', 'battery'].includes(template) ? '' : 'display:none;'}">
                  <label style="margin-top:0; font-weight:600;">Electricity bill</label>
                  <p class="subtitle" style="margin:2px 0 8px;">Add every page (photos from the phone, or the retailer's PDF), then Read bill with AI. It fills the NMI, daily use, supply and network above when they are blank, suggests the solar and battery size, and works out the savings estimate shown on the proposal.</p>

                      <div><label style="margin-top:0; font-size:12px;">BSTC total ($)</label><input id="q-bstc-total" type="number" step="0.01" value="${project.bstc_total || ''}" placeholder="0.00" /></div>

                <label style="margin-top:14px;">Proposal subtitle (optional)</label>

                ${stepHead(5, 'Send', 'The ready-to-send check runs here and again when you email the quote or move it to Quote Sent. Admin and Finance can send anyway with a reason.')}

                    <button type="button" id="email-quote-btn">Email quote to client</button>
                    ${project.quote_pdf_path ? `<button type="button" class="secondary" id="view-quote-pdf-btn">View PDF</button>` : ''}
                    <button type="button" class="secondary" id="generate-quote-pdf-btn" style="${project.quote_pdf_path ? 'font-size:12px; padding:6px 10px;' : ''}">${project.quote_pdf_path ? 'Regenerate PDF' : 'Generate PDF'}</button>
                    ${project.quote_pdf_generated_at ? `<span class="subtitle" style="font-size:11px;">Generated ${new Date(project.quote_pdf_generated_at).toLocaleString('en-AU')}</span>` : ''}
                  </div>
                  <div id="quote-pdf-msg">${project.quote_pdf_error ? `<div class="error-box" style="margin-top:8px; font-size:12px;">${escapeHtml(project.quote_pdf_error)}</div>` : ''}</div>
                  ${project.status === 'sent' ? `<p class="subtitle" style="margin-top:10px;">Sent${project.sent_at ? ' ' + new Date(project.sent_at).toLocaleDateString('en-AU') : ''}${project.valid_until ? ', valid until ' + new Date(project.valid_until + 'T00:00:00').toLocaleDateString('en-AU') : ''}.</p>` : ''}

    }

    async function wireQuoteSteps(project) {
      try {
        if (!RATE_TIERS.length) {
          const { data: tiersData } = await supabaseClient.from('billable_rate_tiers').select('*').order('sort_order');
          RATE_TIERS = tiersData || [];
        }
        if (!Object.keys(companySettings).length) {
          const { data: settingsRow } = await supabaseClient.from('company_settings')
            .select('default_terms, default_estimate_disclaimer, google_maps_api_key').eq('id', 1).single();
          companySettings = settingsRow || {};
        }
        currentTemplate = project.proposal_template || 'new_build';
        templateAnswers = project.template_answers || {};
        lastPylonData = project.pylon_data || null;
        pylonKw = project.pylon_data?.summary?.dc_output_kw || null;
        sowDocs = (project.sow_documents || []).slice();
        referencePhotos = (project.reference_photos || []).map(p => p.url || p);
        const centres = (project.cost_centres || []).slice().sort((a, b) => a.sort_order - b.sort_order);
        const refreshBar = () => { const bar = document.getElementById('quote-steps-bar'); if (bar) bar.innerHTML = quoteStepsBarHtml(project, project.cost_centres || []); };
        const say = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };
        const busy = (btn, on, label) => { btn.disabled = on; btn.textContent = on ? 'Saving...' : label; };

        // ----- step 1: pre-quote information -----
        const qEl = document.getElementById('template-questions');
        renderTemplateQuestions(qEl, currentTemplate, templateAnswers);
        const showMissing = () => {
          const miss = missingRequiredAnswers(currentTemplate, Object.assign({}, templateAnswers, readTemplateAnswers(qEl)));
          say('qs1-missing', miss.length ? `${miss.length} required answer${miss.length === 1 ? '' : 's'} still blank` : 'All required answers in.');
        };
        showMissing();
        qEl.addEventListener('change', (e) => {
          const el = e.target.closest('.tq-input');
          if (!el) return;
          Object.assign(templateAnswers, readTemplateAnswers(qEl));
          if (el.dataset.qid === 'with_battery') {
            if (!templateAnswers.with_battery) delete templateAnswers.with_battery;
            renderTemplateQuestions(qEl, currentTemplate, templateAnswers);
          }
          showMissing();
          renderCustomerGets();
        });
        document.getElementById('qs1-template').addEventListener('change', (e) => {
          currentTemplate = e.target.value;
          Object.assign(templateAnswers, readTemplateAnswers(qEl));
          renderTemplateQuestions(qEl, currentTemplate, templateAnswers);
          showMissing();
          const billCard = document.getElementById('bill-card');
          if (billCard) billCard.style.display = ['solar', 'battery'].includes(currentTemplate) ? '' : 'none';
        });
        showSiteInspectionNote(project);
        wireBillCard(project, qEl, showMissing, refreshBar);
        document.getElementById('qs1-save').addEventListener('click', async () => {
          const btn = document.getElementById('qs1-save');
          busy(btn, true, 'Save answers');
          try {
            const answers = Object.assign({}, templateAnswers, readTemplateAnswers(qEl));
            // blanked answers drop out
            Object.keys(answers).forEach(k => { if (!String(answers[k] ?? '').trim()) delete answers[k]; });
            const changedTemplate = currentTemplate !== (project.proposal_template || 'new_build');
            const { error } = await supabaseClient.from('projects').update({ template_answers: answers, proposal_template: currentTemplate }).eq('id', project.id);
            if (error) throw error;
            project.template_answers = answers;
            templateAnswers = answers;
            showToast('Answers saved.');
            if (changedTemplate) { project.proposal_template = currentTemplate; const refreshed = await loadProject(); if (refreshed) render(refreshed, true); return; }
            const h = document.getElementById('qstep-1-head');
            if (h) h.innerHTML = `${quoteStepTicks(project, centres)[1] ? '<span style="color:var(--green);">&#10003;</span> ' : ''}1. Pre-quote information`;
            refreshBar();
          } catch (err) {
            say('qs1-msg', `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`);
          } finally { busy(btn, false, 'Save answers'); }
        });

        // ----- step 2: site visit -----
        const inspArea = document.getElementById('qs2-inspection-area');
        async function refreshInspectionArea() {
          const insp = await findLinkedSiteInspection(project);
          project.site_visit_done = !!(insp && insp.status === 'completed');
          const decision = (document.querySelector('input[name="qs2-decision"]:checked') || {}).value || project.site_visit_decision;
          if (insp) {
            inspArea.innerHTML = `<a class="link-quiet" href="/site-inspection.html?id=${insp.id}">Site inspection - <span class="badge ${insp.status === 'completed' ? 'accepted' : 'sent'}">${insp.status.replace('_', ' ')}</span> &rarr;</a>${insp.status === 'completed' ? ' <span class="subtitle">Copy what it found into the pre-quote answers above.</span>' : ''}`;
          } else if (decision === 'needed') {
            inspArea.innerHTML = `<button type="button" class="secondary" id="qs2-schedule-btn" style="font-size:12px; padding:6px 10px;">Schedule inspection</button>`;
            inspArea.querySelector('#qs2-schedule-btn').addEventListener('click', () => openScheduleInspectionPanel(project, 'project', () => { refreshInspectionArea(); refreshBar(); }));
          } else {
            inspArea.innerHTML = '';
          }
          refreshBar();
        }
        document.querySelectorAll('input[name="qs2-decision"]').forEach(r => r.addEventListener('change', () => {
          document.getElementById('qs2-reason-wrap').style.display = r.value === 'not_needed' && r.checked ? '' : 'none';
          refreshInspectionArea();
        }));
        refreshInspectionArea();
        document.getElementById('qs2-save').addEventListener('click', async () => {
          const btn = document.getElementById('qs2-save');
          const decision = (document.querySelector('input[name="qs2-decision"]:checked') || {}).value || null;
          if (!decision) { say('qs2-msg', `<div class="error-box">Pick one: needs a site visit, or not needed.</div>`); return; }
          busy(btn, true, 'Save site visit');
          try {
            const reason = decision === 'not_needed' ? (document.getElementById('qs2-reason').value.trim() || null) : null;
            const { error } = await supabaseClient.from('projects').update({ site_visit_decision: decision, site_visit_reason: reason, needs_site_visit: decision === 'needed' }).eq('id', project.id);
            if (error) throw error;
            project.site_visit_decision = decision; project.site_visit_reason = reason; project.needs_site_visit = decision === 'needed';
            showToast('Saved.');
            say('qs2-msg', '');
            await refreshInspectionArea();
          } catch (err) {
            say('qs2-msg', `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`);
          } finally { busy(btn, false, 'Save site visit'); }
        });

        // ----- step 3: pricing -----
        centres.forEach(stage => {
          addRow({
            id: stage.id,
            name: stage.name, description: stage.description, markup_percent: stage.markup_percent, stc_total: stage.stc_total || 0,
            stc_quantity: stage.stc_quantity, stc_system_kw: stage.stc_system_kw, stc_zone_rating: stage.stc_zone_rating,
            stc_install_year: stage.stc_install_year, stc_price_per_certificate: stage.stc_price_per_certificate,
            lineItems: (stage.cost_centre_line_items || []).slice().sort((a, b) => a.sort_order - b.sort_order)
              .map(li => ({
                id: li.id, description: li.description, item_type: li.item_type, quantity: li.quantity, unit_cost: li.unit_cost, rate_tier_id: li.rate_tier_id,
                prebuild_group_id: li.prebuild_group_id, prebuild_client_description: li.prebuild_client_description, prebuild_base_quantity: li.prebuild_base_quantity,
                ai_suggested: li.ai_suggested,
              })),
            photoGroups: (stage.cost_centre_photo_groups || []).slice().sort((a, b) => a.sort_order - b.sort_order)
              .map(pg => ({ description: pg.description, photos: (pg.photos || []).map(p => p.url || p) })),
          });
        });
        if (!centres.length) addRow({ name: { solar: 'Solar system', battery: 'Battery system' }[currentTemplate] || 'Stage 1' });
        updateEditTotal();
        document.getElementById('add-row').addEventListener('click', () => addRow());
        document.getElementById('suggest-prebuilds-btn').addEventListener('click', () => {
          Object.assign(templateAnswers, readTemplateAnswers(qEl));
          suggestStagePrebuilds({
            projectId: project.id, template: currentTemplate,
            sow: document.getElementById('p-sow').value, answersText: templateAnswersText(currentTemplate, templateAnswers),
            btnEl: document.getElementById('suggest-prebuilds-btn'), msgEl: document.getElementById('suggest-prebuilds-msg'),
          });
        });
        wirePylonCard(project);
        wireMilestoneEditor(project);

        // credits: STC count from the size calculator unless typed; totals = count x price
        const stcCalc = (fromSize) => {
          const qtyEl = document.getElementById('q-stc-qty');
          const kw = parseFloat(document.getElementById('q-stc-kw').value) || 0;
          const zone = parseFloat(document.getElementById('q-stc-zone').value) || 0;
          const year = parseInt(document.getElementById('q-stc-year').value, 10) || new Date().getFullYear();
          const price = parseFloat(document.getElementById('q-stc-price').value) || 0;
          if (fromSize || !qtyEl.value) { const calc = calculateStcQuantity({ kw, zoneRating: zone, installYear: year }); if (calc) qtyEl.value = calc; }
          const qty = parseFloat(qtyEl.value) || 0;
          document.getElementById('q-stc-calc').textContent = qty ? `= ${qty} STCs x ${money(price)} = ${money(qty * price)}` : '';
          if (qty) document.getElementById('q-stc-total').value = (qty * price).toFixed(2);
        };
        ['q-stc-kw', 'q-stc-zone', 'q-stc-year'].forEach(id => document.getElementById(id).addEventListener('input', () => stcCalc(true)));
        ['q-stc-qty', 'q-stc-price'].forEach(id => document.getElementById(id).addEventListener('input', () => stcCalc(false)));
        if (!project.stc_quantity && document.getElementById('q-stc-kw').value) stcCalc(true); else stcCalc(false);
        const bstcCalc = () => {
          const qty = parseFloat(document.getElementById('q-bstc-qty').value) || 0;
          const price = parseFloat(document.getElementById('q-bstc-price').value) || 0;
          if (qty) document.getElementById('q-bstc-total').value = (qty * price).toFixed(2);
        };
        ['q-bstc-qty', 'q-bstc-price'].forEach(id => document.getElementById(id).addEventListener('input', bstcCalc));

        document.getElementById('qs3-save').addEventListener('click', async () => {
          const btn = document.getElementById('qs3-save');
          const msg = document.getElementById('qs3-msg');
          msg.innerHTML = '';
          busy(btn, true, 'Save pricing');
          try {
            const stagesPayload = readStagesPayload();
            const existingCentres = project.cost_centres || [];
            const keptIds = stagesPayload.map(st => st.id).filter(Boolean);
            const removedCentres = existingCentres.filter(c => !keptIds.includes(c.id));
            for (const centre of removedCentres) {
              const reasons = await checkCostCentreHasActivity(centre);
              if (reasons.length) throw new Error(`Can't remove "${centre.name}" - it ${reasons.join(', ')}. Adjust its line items instead of deleting the stage, or add it back.`);
            }
            await applyStagesPayload(project, stagesPayload, removedCentres);
            await logStageChanges(project.id, existingCentres, stagesPayload);

            const num = (id) => { const v = parseFloat(document.getElementById(id).value); return Number.isFinite(v) ? v : null; };
            const fields = {
              deposit_percent: parseFloat(document.getElementById('p-deposit').value) || 0,
              show_investment_breakdown: document.getElementById('p-breakdown').checked,
              show_roi: document.getElementById('p-show-roi').checked,
              pylon_link: document.getElementById('p-pylon-link').value.trim(),
              pylon_project_id: document.getElementById('p-pylon-id').value.trim(),
              estimate_disclaimer_text: document.getElementById('p-estimate-disclaimer').value,
              stc_quantity: num('q-stc-qty'), stc_system_kw: num('q-stc-kw'), stc_zone_rating: num('q-stc-zone') || 1.382,
              stc_install_year: parseInt(document.getElementById('q-stc-year').value, 10) || null,
              stc_price_per_certificate: num('q-stc-price'), stc_total: num('q-stc-total') || 0,
              stc_cost_centre_id: document.getElementById('q-stc-stage').value || null,
              bstc_quantity: num('q-bstc-qty'), bstc_price_per_certificate: num('q-bstc-price'), bstc_total: num('q-bstc-total') || 0,
              bstc_cost_centre_id: document.getElementById('q-bstc-stage').value || null,
              bstc_not_claimed: document.getElementById('q-bstc-none').checked,
            };
            const { error } = await supabaseClient.from('projects').update(fields).eq('id', project.id);
            if (error) throw error;

            await supabaseClient.from('payment_milestones').delete().eq('project_id', project.id);
            const milestonesPayload = readMilestones();
            if (milestonesPayload.length) {
              const { error: msErr } = await supabaseClient.from('payment_milestones').insert(milestonesPayload.map(m => ({ ...m, project_id: project.id })));
              if (msErr) throw msErr;
            }
            await logActivity('project', project.id, 'stage_updated', 'Quote pricing updated');
            showToast('Pricing saved.');
            if (stagesPayload.some(st => st.quoted_amount > 0)) autoGenerateQuotePdf(project);
            const refreshed = await loadProject();
            if (refreshed) { render(refreshed, true); const t = document.querySelector('#job-tabs .settings-tab[data-panel="quote"]'); if (t) t.click(); const el = document.getElementById('qstep-3'); if (el) el.scrollIntoView({ block: 'start' }); }
          } catch (err) {
            msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
            busy(btn, false, 'Save pricing');
          }
        });

        // ----- step 4: scope of works -----
        renderEditSowDocList();
        renderPhotoThumbs(document.getElementById('reference-thumbs'), referencePhotos);
        wireScopeTools(project);
        renderCustomerGets();
        document.getElementById('qs4-save').addEventListener('click', async () => {
          const btn = document.getElementById('qs4-save');
          busy(btn, true, 'Save scope of works');
          try {
            const fields = {
              sow_text: document.getElementById('p-sow').value,
              sow_brief: document.getElementById('p-brief').value.trim(),
              proposal_subtitle: document.getElementById('p-subtitle').value.trim(),
              terms_text: document.getElementById('p-terms').value,
              reference_photos: referencePhotos.map(url => ({ url })),
              sow_documents: sowDocs,
            };
            const { error } = await supabaseClient.from('projects').update(fields).eq('id', project.id);
            if (error) throw error;
            Object.assign(project, fields);

            if (fields.sow_text.trim()) { try { await requestInstallerSummary(project.id, { onlyIfStale: true }); } catch (e) { console.error('Installer summary refresh failed:', e); } }
            if ((project.cost_centres || []).some(c => Number(c.quoted_amount) > 0)) autoGenerateQuotePdf(project);
            const h = document.getElementById('qstep-4-head');
            if (h) h.innerHTML = `${fields.sow_text.trim() ? '<span style="color:var(--green);">&#10003;</span> ' : ''}4. Scope of works`;
            refreshBar();
            say('qs4-msg', '');
          } catch (err) {
            say('qs4-msg', `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`);
          } finally { busy(btn, false, 'Save scope of works'); }
        });

        // ----- step 5: send ----- (the email and PDF buttons are wired with the rest of the page)
        wireComplianceCard(project);

        // step links scroll to their card
        document.querySelectorAll('.qstep-link').forEach(a => a.addEventListener('click', (e) => {
          e.preventDefault();
          const el = document.getElementById(`qstep-${a.dataset.step}`);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }));
      } catch (err) {
        console.error('wireQuoteSteps failed:', err);
        const bar = document.getElementById('quote-steps-bar');
        if (bar) bar.insertAdjacentHTML('afterend', `<div class="error-box">The quote steps hit an error setting up: ${escapeHtml(friendlyError(err))}</div>`);
      }
    }

    function render(project, pricingVisible) {
      const centres = project.cost_centres.sort((a, b) => a.sort_order - b.sort_order);
      const quoted = centres.reduce((s, c) => s + Number(c.quoted_amount || 0), 0);
      // estimated_labour_cost is a SELL total (hours x the rate tier's sell
      // rate - there's no separate cost rate in this app), not a cost. For
      // the cost/profit breakdown below we need an actual cost, so it's
      // backed out using the same cost->sell relationship materials use
      // (sell = cost x (1 + markup%)), per stage since markup% varies.
      // Labour cost always includes direct overhead (average direct rate x
      // quoted hours here; each person's own rate on the actual side), and
      // indirect overhead only ever shows underneath as "incl. overheads".
      const directRate = Number(overheadRates?.directRate) || 0;
      const indirectRate = Number(overheadRates?.indirectRate) || 0;
      const labourSellTotal = centres.reduce((s, c) => s + Number(c.estimated_labour_cost || 0), 0);
      const labourCostTotal = centres.reduce((s, c) => {
        const markupFactor = 1 + markupOr45(c.markup_percent) / 100;
        return s + (Number(c.estimated_labour_cost) || 0) / markupFactor + (Number(c.quoted_hours) || 0) * directRate;
      }, 0);
      const materialCostTotal = centres.reduce((s, c) => s + Number(c.estimated_material_cost || 0), 0);
      const cost = labourCostTotal + materialCostTotal;

      const tabLoaders = {};

          const url = new URL(location.href);
          if (panel === 'summary') url.searchParams.delete('tab'); else url.searchParams.set('tab', panel);
          history.replaceState(history.state, '', url);
        } catch (e) {}
        // Scroll the strip sideways only, never the page.
        const r = btn.getBoundingClientRect(), s = tabStrip.getBoundingClientRect();
        if (r.left < s.left || r.right > s.right) tabStrip.scrollLeft += (r.left - s.left) - (s.width - r.width) / 2;
        jobActivityLog.then(log => log.setTab(panel));
        const load = tabLoaders[panel];
        if (load) { delete tabLoaders[panel]; load(); }

          const { error } = await supabaseClient.from('projects').update({ laha_approved: checked }).eq('id', project.id);
          if (error) throw error;
          project.laha_approved = checked;
          msgEl.innerHTML = '<div class="success-box" style="margin-top:6px; font-size:12px;">Saved.</div>';
        } catch (err) {
          e.target.checked = !checked;
          msgEl.innerHTML = `<div class="error-box" style="margin-top:6px; font-size:12px;">${escapeHtml(friendlyError(err))}</div>`;
        } finally {
          lahaToggle.disabled = false;
        }
      });
      document.querySelectorAll('.push-xero-btn').forEach(btn => {
        btn.addEventListener('click', () => pushExistingInvoiceToXero(btn));
      });

      const editToggleBtn = document.getElementById('edit-toggle-btn');
      if (editToggleBtn) editToggleBtn.addEventListener('click', () => enterEditMode(project));
      if (document.getElementById('panel-quote')) wireQuoteSteps(project);

      document.getElementById('toggle-line-items-btn').addEventListener('click', (e) => {
        // Show or hide the rows in place: no re-render, so search text, scroll and unsaved notes stay.
        showLineItems = !showLineItems;
        document.querySelectorAll('#panel-costcentres .li-detail-row').forEach(r => { r.style.display = showLineItems ? '' : 'none'; });
        e.currentTarget.textContent = showLineItems ? 'Hide line items' : 'Show line items';
      });

      const scheduleStaffBtn = document.getElementById('schedule-staff-btn');
      if (scheduleStaffBtn) scheduleStaffBtn.addEventListener('click', () => openScheduleStaffPanel(project));

      const markApprovedBtn = document.getElementById('mark-approved-btn');
      if (markApprovedBtn) markApprovedBtn.addEventListener('click', () => openApprovalPanel({ kind: 'quote', mode: 'approve', project, onDone: async () => location.reload() }));
      const markDeclinedBtn = document.getElementById('mark-declined-btn');
      if (markDeclinedBtn) markDeclinedBtn.addEventListener('click', () => openApprovalPanel({ kind: 'quote', mode: 'decline', project, onDone: async () => location.reload() }));
      if (!project.job_number) {
        wireValidUntil(content, project, () => ({ kind: 'quote', row: project }), async () => location.reload(), 'quote');
        if (pricingVisible && new URLSearchParams(window.location.search).get('extend') === 'quote' && ['sent', 'declined'].includes(project.status) && (project.status === 'sent' || project.expired)) openExtendPanel('quote', project, project, async () => location.reload());
      }
      const quoteReopenBtn = document.getElementById('quote-reopen-btn');
      if (quoteReopenBtn) quoteReopenBtn.addEventListener('click', () => reopenDeclined('quote', project.id, async () => location.reload()));

      const duplicateBtn = document.getElementById('duplicate-btn');
      if (duplicateBtn) duplicateBtn.addEventListener('click', async () => {
        const btn = document.getElementById('duplicate-btn');
        btn.disabled = true;
        btn.textContent = 'Duplicating...';
        try {
          const { data: fullProject, error: loadErr } = await supabaseClient
            .from('projects')
            .select('*, cost_centres(*, cost_centre_line_items(*), cost_centre_photo_groups(*)), payment_milestones(*)')
            .eq('id', project.id)
            .single();
          if (loadErr) throw loadErr;

          // Same draw new-project.html uses for a brand-new quote - a
          // duplicate is a new draft quote too (its own quote_number, no
          // job_number - that gets assigned automatically once it's
          // actually accepted, same as any other quote), not a clone of
          // whatever numbering the source project already had.
          const { data: quoteNum, error: qErr } = await supabaseClient.rpc('get_next_number', { counter_name: 'quote' });
          if (qErr) throw qErr;

          const { data: newProject, error: insErr } = await supabaseClient
            .from('projects')
            .insert({
              name: `${fullProject.name} (copy)`,
              quote_number: quoteNum,
              // A fresh draft quote: status, quote_token, valid_until and the
              // approval / decline fields are left to their defaults.
              pipeline_stage: 'draft_quote',
              // Keep the client link, so the next save in new-project.html
              // updates the same client record instead of creating another.
              client_id: fullProject.client_id,
              client_name: fullProject.client_name,
              client_email: fullProject.client_email,
              client_phone: fullProject.client_phone,
              client_address: fullProject.client_address,
              project_manager_contact_id: fullProject.project_manager_contact_id,
              site_contact_id: fullProject.site_contact_id,
              job_contact_id: fullProject.job_contact_id,
              sales_contact_id: fullProject.sales_contact_id,
              accounts_contact_id: fullProject.accounts_contact_id,
              sow_text: fullProject.sow_text,
              proposal_subtitle: fullProject.proposal_subtitle,
              terms_text: fullProject.terms_text,
              estimate_disclaimer_text: fullProject.estimate_disclaimer_text,
              deposit_percent: fullProject.deposit_percent,
              pylon_link: fullProject.pylon_link,
              pylon_project_id: fullProject.pylon_project_id,
              reference_photos: fullProject.reference_photos,
              cover_photos: fullProject.cover_photos,
              proposal_template: fullProject.proposal_template,
              template_answers: fullProject.template_answers,
            })
            .select()
            .single();
          if (insErr) throw insErr;

          const stages = fullProject.cost_centres.sort((a, b) => a.sort_order - b.sort_order);
          const { data: newStages, error: stagesErr } = await supabaseClient
            .from('cost_centres')
            .insert(stages.map(s => ({
              project_id: newProject.id,
              name: s.name,
              description: s.description,
              sort_order: s.sort_order,
              markup_percent: s.markup_percent,
              estimated_labour_cost: s.estimated_labour_cost,
              estimated_material_cost: s.estimated_material_cost,
              quoted_amount: s.quoted_amount,
              stc_total: s.stc_total,
              stc_system_kw: s.stc_system_kw,
              stc_zone_rating: s.stc_zone_rating,
              stc_install_year: s.stc_install_year,
              stc_price_per_certificate: s.stc_price_per_certificate,
            })))
            .select();
          if (stagesErr) throw stagesErr;

          const allLineItems = [];
          const allPhotoGroups = [];
          stages.forEach((s, i) => {
            // A duplicated prebuild group keeps its grouping (still shows as
            // one line to the client on the new quote) but gets its own
            // fresh group id per distinct source group, rather than literally
            // reusing the original's - that id would otherwise collide
            // across two now-separate quotes.
            const groupIdMap = {};
            (s.cost_centre_line_items || []).forEach(li => {
              let newGroupId = null;
              if (li.prebuild_group_id) {
                if (!groupIdMap[li.prebuild_group_id]) groupIdMap[li.prebuild_group_id] = crypto.randomUUID();
                newGroupId = groupIdMap[li.prebuild_group_id];
              }
              allLineItems.push({
                cost_centre_id: newStages[i].id,
                description: li.description,
                item_type: li.item_type,
                quantity: li.quantity,
                unit_cost: li.unit_cost,
                sort_order: li.sort_order,
                rate_tier_id: li.rate_tier_id,
                prebuild_group_id: newGroupId,
                prebuild_client_description: li.prebuild_client_description,
                prebuild_base_quantity: li.prebuild_base_quantity,
              });
            });
            (s.cost_centre_photo_groups || []).forEach(pg => {
              allPhotoGroups.push({
                cost_centre_id: newStages[i].id,
                description: pg.description,
                photos: pg.photos,
                sort_order: pg.sort_order,
              });
            });
          });
          if (allLineItems.length) {
            const { error: liErr } = await supabaseClient.from('cost_centre_line_items').insert(allLineItems);
            if (liErr) throw liErr;
          }
          if (allPhotoGroups.length) {
            const { error: pgErr } = await supabaseClient.from('cost_centre_photo_groups').insert(allPhotoGroups);
            if (pgErr) throw pgErr;
          }
          const milestones = (fullProject.payment_milestones || []).map(m => ({
            project_id: newProject.id,
            label: m.label,
            percent: m.percent,
            sort_order: m.sort_order,
          }));
          if (milestones.length) {
            const { error: msErr } = await supabaseClient.from('payment_milestones').insert(milestones);
            if (msErr) throw msErr;
          }

          window.location.href = `/project.html?id=${newProject.id}&tab=quote`;
        } catch (err) {
          document.getElementById('action-msg').innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
          btn.disabled = false;
          btn.textContent = 'Duplicate as new quote';
        }
      });

      // Last, after every tab-specific click listener is attached: open the tab named in the URL.
      openTabFromUrl();
    }

    // Records what the client said outside the app, for a quote or a fixed-price variation:
    //   approve  by email (pick the client's email tagged to the job / quote, linked as proof),
    //            phone call or in person (note required). A quote is approved through
    //            manually-approve-quote.js (makes the job); a variation through approval-actions.js
    //            (made a stage on the job, same as signing).
    //   decline  the reason is required; an email can be linked as proof.
    // opts: { kind: 'quote' | 'variation', mode: 'approve' | 'decline', project, entry?, onDone }
    async function openApprovalPanel(opts) {
      const { kind, mode, project, entry } = opts;
      const isApprove = mode === 'approve';
      const what = kind === 'quote' ? (project.quote_number ? `quote Q${project.quote_number}` : 'this quote') : `Variation ${entry.variation_number || ''}`.trim();
      const projectIds = [project.id, project.source_quote_id].filter(Boolean);
      const { data: links } = await supabaseClient.from('email_job_links')
        .select('thread_id, kind, email_threads(id, subject, last_message_at)').in('project_id', projectIds);
      const threads = [...new Map((links || []).filter(l => l.email_threads).map(l => [l.thread_id, { ...l.email_threads, kind: l.kind }])).values()]
        .sort((x, y) => (x.kind === 'client' ? 0 : 1) - (y.kind === 'client' ? 0 : 1) || String(y.last_message_at || '').localeCompare(String(x.last_message_at || '')));
      const fmt = (d) => d ? new Date(d).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }) : '';
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:110; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:520px; width:100%; max-height:90vh; overflow-y:auto;">
          <h2>${isApprove ? 'Mark' : 'Mark'} ${escapeHtml(what)} ${isApprove ? 'approved' : 'declined'}</h2>
          <p class="subtitle" style="margin-bottom:12px;">${isApprove
            ? (kind === 'quote' ? 'For when the client agreed outside the quote page. The quote is frozen as approved and the job is created, the same as signing online.' : 'For when the client agreed outside the variation page. It is added to the job as a stage at this price, the same as signing online.')
            : 'For when the client has said no. You can reopen it later.'}</p>
          <label style="margin-top:0;">${isApprove ? 'How did they approve it?' : 'How did they tell you?'}</label>
          <div style="display:flex; gap:14px; flex-wrap:wrap; margin-bottom:10px;">
