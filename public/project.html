      listEl.querySelectorAll('.var-fixed-approve').forEach(btn => btn.addEventListener('click', () => openApprovalPanel({ kind: 'variation', mode: 'approve', project, entry: rowById(btn.dataset.id), onDone: reload })));
      listEl.querySelectorAll('.var-fixed-decline').forEach(btn => btn.addEventListener('click', () => openApprovalPanel({ kind: 'variation', mode: 'decline', project, entry: rowById(btn.dataset.id), onDone: reload })));
      wireValidUntil(listEl, project, (key) => ({ kind: 'variation', row: rowById(key) }), reload);
      const extendParam = new URLSearchParams(window.location.search).get('extend');
      if (pricingVisible && extendParam && extendParam !== 'quote' && !loadVariationEntries.extendOpened) {
        const er = rowById(extendParam);
        if (er && (er.approval_status === 'sent' || (er.approval_status === 'declined' && er.expired))) {
          loadVariationEntries.extendOpened = true;
          const vt = document.querySelector('#job-tabs .settings-tab[data-panel="variations"]');
          if (vt) vt.click();
          openExtendPanel('variation', project, er, reload);
        }
      }
      listEl.querySelectorAll('.var-fixed-reopen').forEach(btn => btn.addEventListener('click', () => reopenDeclined('variation', btn.dataset.id, reload)));
      listEl.querySelectorAll('.var-fixed-pdf').forEach(btn => btn.addEventListener('click', () => {
        const r = rowById(btn.dataset.id);
        openPdfViewer(r.pdf_path, `${projectRef(project)} - Variation ${r.variation_number || ''}`, { projectId: project.id, folder: 'Variations' });
      }));
      listEl.querySelectorAll('.var-fixed-makepdf').forEach(btn => btn.addEventListener('click', async () => {
        const label = btn.textContent;
        btn.disabled = true; btn.textContent = 'Making the PDF...';
        try { await makeVariationPdf(btn.dataset.id); await reload(); }
        catch (err) { alert(friendlyError(err)); btn.disabled = false; btn.textContent = label; }
      }));
      listEl.querySelectorAll('.var-fixed-marksent').forEach(btn => btn.addEventListener('click', async () => {
        const { error: sErr } = await supabaseClient.from('job_variation_entries').update({ approval_status: 'sent', sent_at: new Date().toISOString() }).eq('id', btn.dataset.id);
        if (sErr) { alert(friendlyError(sErr)); return; }
        await logActivity('project', project.id, 'variation_sent', `Variation sent to the client: ${rowById(btn.dataset.id)?.description || ''}`);
        await reload();
      }));
      listEl.querySelectorAll('.var-fixed-withdraw').forEach(btn => btn.addEventListener('click', async () => {
        if (!confirm('Take this back to a draft? The client cannot sign it until you send it again.')) return;
        const { error: wErr } = await supabaseClient.from('job_variation_entries').update({ approval_status: 'draft' }).eq('id', btn.dataset.id);
        if (wErr) { alert(friendlyError(wErr)); return; }
        await reload();
      }));
      listEl.querySelectorAll('.var-fixed-copy').forEach(btn => btn.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(btn.dataset.link); btn.textContent = 'Copied'; } catch (e) { prompt('Copy this link:', btn.dataset.link); }
      }));

      const fixedNewBtn = document.getElementById('var-fixed-new-btn');
      if (fixedNewBtn && !fixedNewBtn.dataset.wired) {
        fixedNewBtn.dataset.wired = '1';
        fixedNewBtn.addEventListener('click', () => openFixedVariationEditor(project, null, reload));
      }

      const addBtn = document.getElementById('var-add-btn');
      if (addBtn && !addBtn.dataset.wired) {
        addBtn.dataset.wired = '1';
        addBtn.addEventListener('click', async () => {
          const msg = document.getElementById('var-msg');
          const description = document.getElementById('var-desc').value.trim();
          if (!description) { msg.innerHTML = `<div class="error-box">Say what the extra work was.</div>`; return; }
          addBtn.disabled = true;
          try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const res = await fetch('/.netlify/functions/create-variation', {
              method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
              body: JSON.stringify({
                projectId: project.id, type: 'do_and_charge', description,
                workDate: document.getElementById('var-date').value || undefined,
                notes: document.getElementById('var-materials').value.trim() || undefined,
                startHours: parseFloat(document.getElementById('var-hours').value) || undefined,
              }),
            });
            const d = await res.json();
            if (!res.ok || !d.ok) throw new Error(d.error || 'Could not log it');
            ['var-desc', 'var-hours', 'var-materials'].forEach(id => { document.getElementById(id).value = ''; });
            msg.innerHTML = `<div class="success-box">Logged as Variation ${d.number}. You can now clock in to it on My Day, and add materials from Stock below.</div>`;
            await logActivity('project', project.id, 'variation_logged', `Variation ${d.number} logged: ${description}`);
            await reload();
          } catch (err) {
            msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
          }
          addBtn.disabled = false;
        });
      }
    }

    // Pricing roles: set up (or edit the draft of) a fixed-price variation - the
    // reason the client will read and the priced lines. Saving keeps it as a draft;
    // "Email to client..." on its card sends it for signing.
    function openFixedVariationEditor(project, entry, onSaved) {
      const lines = (entry && entry.fixed_lines && entry.fixed_lines.length ? entry.fixed_lines : [{ description: '', item_type: 'material', amount: '' }]).map(l => ({ ...l }));
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:110; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:600px; width:100%; max-height:90vh; overflow-y:auto;">
          <h2>${entry ? 'Edit fixed-price variation' : 'New fixed-price variation'}</h2>
          <p class="subtitle" style="margin-bottom:10px;">The client gets this as its own variation document (referencing their original quote), then signs to approve it. Once signed it's added to the job as a stage at this price.</p>
          <label style="margin-top:0;">What is the extra work?</label>
          <input id="fv-desc" value="${escapeHtml(entry ? entry.description : '')}" placeholder="e.g. Move meter box and run new sub-main" />
          <label>Reason for the variation (the client reads this)</label>
          <textarea id="fv-reason" style="min-height:80px;" placeholder="e.g. The builder moved the meter location after the quote was accepted, which needs a longer cable run.">${escapeHtml(entry ? entry.reason || '' : '')}</textarea>
          <label>Priced lines (ex GST)</label>
          <div id="fv-lines"></div>
          <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:6px;">
            <button type="button" class="secondary" id="fv-add-line" style="font-size:12px; padding:6px 10px;">+ Add a line</button>
            <button type="button" class="secondary" id="fv-add-stock" style="font-size:12px; padding:6px 10px;">+ From Stock or prebuild</button>
          </div>
          <p style="margin:12px 0 0; font-size:14px;">Total: <strong id="fv-total">$0.00</strong> ex GST <span class="subtitle" id="fv-total-gst"></span></p>
          <div id="fv-msg"></div>
          <div style="margin-top:12px;"><button type="button" id="fv-save">Save draft</button> <button type="button" class="secondary" id="fv-cancel">Cancel</button></div>
        </div>`;
      document.body.appendChild(overlay);
      const linesEl = overlay.querySelector('#fv-lines');
      const sum = () => lines.reduce((s, l) => s + (parseFloat(l.amount) || 0), 0);
      const refreshTotal = () => {
        overlay.querySelector('#fv-total').textContent = money(sum());
        overlay.querySelector('#fv-total-gst').textContent = `(${money(sum() * 1.1)} inc GST)`;
      };
      const renderLines = () => {
        linesEl.innerHTML = lines.map((l, i) => `
          <div style="display:grid; grid-template-columns:1fr 110px 100px auto; gap:6px; margin-bottom:6px; align-items:center;">
            <input class="fv-l-desc" data-i="${i}" value="${escapeHtml(l.description)}" placeholder="Description" style="margin:0;" />
            <select class="fv-l-type" data-i="${i}" style="margin:0;"><option value="material" ${l.item_type !== 'labour' ? 'selected' : ''}>Materials</option><option value="labour" ${l.item_type === 'labour' ? 'selected' : ''}>Labour</option></select>
            <input class="fv-l-amt" data-i="${i}" type="number" min="0" step="0.01" value="${l.amount === '' ? '' : l.amount}" placeholder="$" style="margin:0;" />
            <button type="button" class="secondary fv-l-del" data-i="${i}" style="font-size:12px; padding:4px 9px;">&times;</button>
          </div>`).join('');
        linesEl.querySelectorAll('.fv-l-desc').forEach(el => el.addEventListener('input', () => { lines[el.dataset.i].description = el.value; }));
        linesEl.querySelectorAll('.fv-l-type').forEach(el => el.addEventListener('change', () => { lines[el.dataset.i].item_type = el.value; }));
        linesEl.querySelectorAll('.fv-l-amt').forEach(el => el.addEventListener('input', () => { lines[el.dataset.i].amount = el.value; refreshTotal(); }));
        linesEl.querySelectorAll('.fv-l-del').forEach(el => el.addEventListener('click', () => { lines.splice(Number(el.dataset.i), 1); if (!lines.length) lines.push({ description: '', item_type: 'material', amount: '' }); renderLines(); refreshTotal(); }));
      };
      renderLines(); refreshTotal();
      overlay.querySelector('#fv-add-line').addEventListener('click', () => { lines.push({ description: '', item_type: 'material', amount: '' }); renderLines(); });
      // Priced like a quote: Stock at cost plus the default markup; a prebuild's labour at its
      // own (sell) rates and its materials marked up. Price only, nothing leaves Stock.
      overlay.querySelector('#fv-add-stock').addEventListener('click', async () => {
        const pick = await openVariationStockPicker(true, true); // price only: no low-stock warning
        if (!pick) return;
        const { data: cs } = await supabaseClient.from('company_settings').select('default_markup_percent').eq('id', 1).maybeSingle();
        const factor = 1 + markupOr45(cs?.default_markup_percent) / 100;
        const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
        const qty = Number(pick.quantity) || 1;
        const name = `${pick.name} x ${r2(qty)}`;
        let added = [];
        if (pick.kind === 'material') {
          const { data: m } = await supabaseClient.from('materials').select('cost_price').eq('id', pick.id).maybeSingle();
          added.push({ description: name, item_type: 'material', amount: r2((Number(m?.cost_price) || 0) * factor * qty) });
        } else {
          const pb = (await getPrebuilds()).find(p => p.id === pick.id);
          const comps = (pb && pb.prebuild_components) || [];
          const part = (type) => comps.filter(c => (c.item_type === 'labour') === (type === 'labour'))
            .reduce((t, c) => t + (Number(c.quantity) || 0) * (Number(c.unit_cost) || 0), 0) * qty;
          const lab = r2(part('labour')), mat = r2(part('material') * factor);
          if (lab > 0) added.push({ description: `${name} (labour)`, item_type: 'labour', amount: lab });
          if (mat > 0) added.push({ description: `${name} (materials)`, item_type: 'material', amount: mat });
          if (!added.length) added.push({ description: name, item_type: 'material', amount: '' });
        }
        // fill the blank starting line rather than leaving it empty above
        if (lines.length === 1 && !lines[0].description && !(parseFloat(lines[0].amount) > 0)) lines.splice(0, 1);
        lines.push(...added);
        renderLines(); refreshTotal();
      });
      overlay.querySelector('#fv-cancel').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#fv-save').addEventListener('click', async () => {
        const msg = overlay.querySelector('#fv-msg');
        const description = overlay.querySelector('#fv-desc').value.trim();
        const reason = overlay.querySelector('#fv-reason').value.trim();
        const clean = lines.map(l => ({ description: String(l.description || '').trim(), item_type: l.item_type === 'labour' ? 'labour' : 'material', amount: Math.round((parseFloat(l.amount) || 0) * 100) / 100 })).filter(l => l.description && l.amount > 0);
        if (!description) { msg.innerHTML = `<div class="error-box">Say what the extra work is.</div>`; return; }
        if (!reason) { msg.innerHTML = `<div class="error-box">Add the reason, so the client knows why.</div>`; return; }
        if (!clean.length) { msg.innerHTML = `<div class="error-box">Add at least one priced line.</div>`; return; }
        const saveBtn = overlay.querySelector('#fv-save');
        saveBtn.disabled = true;
        try {
          if (entry) {
            const { error: uErr } = await supabaseClient.from('job_variation_entries').update({ description, reason, fixed_lines: clean }).eq('id', entry.id);
            if (uErr) throw uErr;
          } else {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const res = await fetch('/.netlify/functions/create-variation', {
              method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
              body: JSON.stringify({ projectId: project.id, type: 'fixed', description, reason, lines: clean }),
            });
            const d = await res.json();
            if (!res.ok || !d.ok) throw new Error(d.error || 'Could not save it');
            await logActivity('project', project.id, 'variation_logged', `Fixed-price variation ${d.number} drafted: ${description}`);
          }
          overlay.remove();
          await onSaved();
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
          saveBtn.disabled = false;
        }
      });
    }

    // Makes (or remakes) a fixed-price variation's PDF: the variation document from
    // quote.html?variation=... Resolves to its storage path.
    async function makeVariationPdf(entryId) {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const res = await fetch('/.netlify/functions/generate-client-document-pdf', {
        method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ doc_type: 'variation', record_id: entryId }),
      });
      const out = await res.json().catch(() => ({ ok: false, error: 'Unexpected reply from the server' }));
      if (!res.ok || !out.ok) throw new Error(out.error || 'Could not make the variation PDF');
      return out.path;
    }

    // Emails the client the variation: its PDF attached, plus a button to the variation page
    // to view and sign it online. It only becomes "Sent" once the email has actually gone.
    async function sendFixedVariationEmail(project, entry, onDone, btn) {
      const label = btn ? btn.textContent : '';
      if (btn) { btn.disabled = true; btn.textContent = 'Making the PDF...'; }
      let pdfPath;
      try { pdfPath = await makeVariationPdf(entry.id); }
      catch (err) { alert(friendlyError(err)); return; }
      finally { if (btn) { btn.disabled = false; btn.textContent = label; } }
      const first = String(project.client_name || '').trim().split(/\s+/)[0] || 'there';
      const total = (entry.fixed_lines || []).reduce((s, l) => s + (Number(l.amount) || 0), 0);
      const vName = `Variation ${entry.variation_number || ''}`.trim();
      const qRef = project.quote_number ? ` to quote Q${project.quote_number}` : '';
      const fileName = `${projectRef(project)} - ${vName}.pdf`;
      openEmailComposer({
        title: `Email ${vName} to the client`,
        to: project.client_email || '',
        subject: `${vName}${qRef} for approval - ${projectRef(project)}: ${entry.description}`,
        body: `Hi ${first},\n\nWhile working on ${project.name} some extra work has come up that wasn't in the original quote: ${entry.description}.\n\n${entry.reason ? entry.reason + '\n\n' : ''}The price for this is ${money(total)} ex GST (${money(total * 1.1)} inc GST). ${vName}${qRef} is attached.\n\nYou can approve it by signing online at the link below.\n\nLet me know if you have any questions.`,
        projectId: project.id, tagKind: 'client',
        quoteLink: { url: `${shareOrigin()}/quote.html?variation=${entry.variation_token}`, label: 'Include a button to view and sign the variation online', buttonText: 'Click to view and sign your variation', checked: true },
        attachOptions: [{ group: 'Variation', label: fileName, bucket: 'project-documents', path: pdfPath, name: fileName, checked: true }],
        onSent: async () => {
          await supabaseClient.from('job_variation_entries').update({ approval_status: 'sent', sent_at: new Date().toISOString() }).eq('id', entry.id).neq('approval_status', 'approved');
          await logActivity('project', project.id, 'variation_sent', `${vName} emailed to the client: ${entry.description}`);
          await onDone();
        },
      });
      // the PDF now exists: show its buttons on the card even if the email is cancelled
      if (!entry.pdf_path) onDone();
    }

    // Picks a Stock material or a prebuild for a variation. Resolves to
    // { kind: 'material' | 'prebuild', id, name, quantity }, or null if cancelled.
    // Costs only show to pricing roles.
    async function openVariationStockPicker(pricingVisible, priceOnly) {
      const [{ data: materialsData }, prebuilds] = await Promise.all([
        supabaseClient.from('materials').select('id, name, category, cost_price, quantity_on_hand').order('name'),
        getPrebuilds(),
      ]);
      const materials = materialsData || [];
      if (!materials.length && !prebuilds.length) { alert('No materials or prebuilds set up yet. Add stock under the Stock tab.'); return null; }
      return new Promise((resolve) => {
        const overlay = document.createElement('div');
        overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:110; padding:16px;';
        overlay.innerHTML = `
          <div class="card" style="max-width:480px; width:100%; max-height:80vh; overflow-y:auto;">
            <h2>Add from Stock</h2>
            <label style="margin-top:0">Quantity</label>
            <input id="vsp-qty" type="number" value="1" min="0.01" step="0.01" style="margin-bottom:12px;" />
            <label>Search</label>
            <input id="vsp-search" placeholder="Name, category..." autocomplete="off" />
            <div id="vsp-results" style="margin-top:8px;"></div>
            <div style="margin-top:16px; text-align:right;"><button type="button" class="secondary" id="vsp-cancel">Cancel</button></div>
          </div>`;
        document.body.appendChild(overlay);
        const done = (val) => { overlay.remove(); resolve(val); };
        overlay.querySelector('#vsp-cancel').addEventListener('click', () => done(null));
        overlay.addEventListener('click', (e) => { if (e.target === overlay) done(null); });
        const resultsEl = overlay.querySelector('#vsp-results');
        const render = () => {
          const q = overlay.querySelector('#vsp-search').value.trim();
          const pbs = (q ? prebuilds.filter(p => matchesAllWords(`${p.name} ${p.category} ${p.subcategory || ''}`, q)) : prebuilds).slice(0, 25);
          const mts = (q ? materials.filter(m => matchesAllWords(`${m.name} ${m.category || ''}`, q)) : materials).slice(0, 25);
          if (!pbs.length && !mts.length) { resultsEl.innerHTML = `<p class="subtitle">No matches.</p>`; return; }
          resultsEl.innerHTML = [
            ...pbs.map(p => `<div class="vsp-row" data-kind="prebuild" data-id="${p.id}" style="padding:10px; cursor:pointer; border-bottom:0.5px solid var(--border);">
              <div style="font-weight:600;">${escapeHtml(p.name)} <span class="subtitle" style="font-weight:400;">Prebuild</span></div>
              <div class="subtitle" style="font-size:12px;">${escapeHtml(p.category || '')}${p.subcategory ? ' / ' + escapeHtml(p.subcategory) : ''}</div></div>`),
            ...mts.map(m => `<div class="vsp-row" data-kind="material" data-id="${m.id}" style="padding:10px; cursor:pointer; border-bottom:0.5px solid var(--border);">
              <div style="font-weight:600;">${escapeHtml(m.name)} <span class="subtitle" style="font-weight:400;">${pricingVisible ? money(m.cost_price) + ' - ' : ''}${qtyOnHand(m)} in stock</span></div>
              <div class="subtitle" style="font-size:12px;">${escapeHtml(m.category || '')}</div></div>`),
          ].join('');
          resultsEl.querySelectorAll('.vsp-row').forEach(row => row.addEventListener('click', () => {
            const qty = parseFloat(overlay.querySelector('#vsp-qty').value) || 0;
            if (!(qty > 0)) { alert('Enter a quantity first.'); return; }
            if (row.dataset.kind === 'material') {
              const m = materials.find(x => x.id === row.dataset.id);
              if (!priceOnly && Number(m.quantity_on_hand) < qty && !confirm(`Only ${qtyOnHand(m)} of ${m.name} in stock. Add ${qty} anyway? Stock will go to zero.`)) return;
              done({ kind: 'material', id: m.id, name: m.name, quantity: qty });
            } else {
              const p = prebuilds.find(x => x.id === row.dataset.id);
              done({ kind: 'prebuild', id: p.id, name: p.name, quantity: qty });
            }
          }));
        };
        const qtyOnHand = (m) => Math.round((Number(m.quantity_on_hand) || 0) * 100) / 100;
        overlay.querySelector('#vsp-search').addEventListener('input', render);
        render();
      });
    }

    // Pricing roles only: an item that isn't in Stock (bought in for the job), with
    // its cost. Resolves to { description, quantity, unitCost } or null.
    function openVariationOtherItemPrompt() {
      return new Promise((resolve) => {
        const overlay = openModal(`
            <h2>Other item</h2>
            <p class="subtitle" style="margin-bottom:10px;">Something bought in for this variation that isn't in Stock. Enter what it cost you; the markup is added when it's billed.</p>
            <label style="margin-top:0;">Description</label><input id="voi-desc" placeholder="e.g. 2m galvanised cable tray" />
            <div class="grid cols-2"><div><label>Quantity</label><input id="voi-qty" type="number" value="1" min="0.01" step="0.01" /></div>
            <div><label>Cost each (ex GST)</label><input id="voi-cost" type="number" min="0" step="0.01" /></div></div>
            <div id="voi-msg"></div>
            <div style="margin-top:12px;"><button type="button" id="voi-ok">Add</button> <button type="button" class="secondary" id="voi-cancel">Cancel</button></div>`, { maxWidth: 420, zIndex: 110 });
        const done = (val) => { overlay.remove(); resolve(val); };
        overlay.querySelector('#voi-cancel').addEventListener('click', () => done(null));
        overlay.querySelector('#voi-ok').addEventListener('click', () => {
          const description = overlay.querySelector('#voi-desc').value.trim();
          const quantity = parseFloat(overlay.querySelector('#voi-qty').value);
          const unitCost = parseFloat(overlay.querySelector('#voi-cost').value);
          if (!description || !(quantity > 0) || !(unitCost >= 0)) { overlay.querySelector('#voi-msg').innerHTML = `<div class="error-box">Fill in the description, quantity and cost.</div>`; return; }
          done({ description, quantity, unitCost });
        });
      });
    }

    // Other jobs and quotes for the same client (same-site first), so when
    // there's more than one job on a site it's one tap to jump between them -
    // or to clock into another without going back to search. If you're
    // clocked in somewhere it switches (the usual clock-out confirmation
    // still happens); if not, it opens My Day with that job selected.
    async function loadRelatedJobsCard(project) {
      const el = document.getElementById('related-jobs-card');
      if (!el) return;
      let q = supabaseClient.from('projects')
        .select('id, name, job_number, quote_number, client_address, pipeline_stage, status, created_at')
        .neq('id', project.id).neq('pipeline_stage', 'archived').order('created_at', { ascending: false }).limit(25);
      q = project.client_id ? q.eq('client_id', project.client_id) : (project.client_name ? q.eq('client_name', project.client_name) : null);
      if (!q) { el.innerHTML = ''; return; }
      const { data: related } = await q;
      if (!related || !related.length) { el.innerHTML = ''; return; }

      const sameSite = (r) => project.client_address && r.client_address && r.client_address.trim().toLowerCase() === project.client_address.trim().toLowerCase();
      const sorted = related.slice().sort((a, b) => Number(sameSite(b)) - Number(sameSite(a)) || new Date(b.created_at) - new Date(a.created_at)).slice(0, 10);
      const { data: { user } } = await supabaseClient.auth.getUser();
      const { data: active } = await supabaseClient.from('time_entries').select('*').eq('staff_id', user.id).is('clock_out', null).order('clock_in', { ascending: false }).limit(1).maybeSingle();

      el.innerHTML = `
        <div class="card">
          <h2>Other jobs for ${escapeHtml(project.client_name || 'this client')}</h2>
          <p class="subtitle" style="margin-bottom:8px;">Jump between jobs on the same site, or clock into another one.</p>
          ${sorted.map(r => `
            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 0; border-top:1px solid var(--border);">
              <div style="min-width:0;">
                <a class="link-quiet" href="/project.html?id=${r.id}" style="font-weight:600;">${escapeHtml(projectRef(r))}</a>
                ${sameSite(r) ? '<span class="badge info" style="margin-left:6px;">Same site</span>' : ''}
                <span class="badge draft" style="margin-left:6px;">${escapeHtml((r.pipeline_stage || r.status || '').replace(/_/g, ' '))}</span>
                ${r.client_address ? `<p class="subtitle" style="margin:2px 0 0; font-size:12px;">${escapeHtml(r.client_address)}</p>` : ''}
              </div>
              <div style="display:flex; gap:6px; flex-shrink:0;">
                <a class="btn secondary" href="/project.html?id=${r.id}">Open</a>
                ${r.job_number ? `<button type="button" class="secondary related-clock-btn" data-id="${r.id}">${active ? 'Switch to this job' : 'Clock in'}</button>` : ''}
              </div>
            </div>`).join('')}
        </div>`;

      el.querySelectorAll('.related-clock-btn').forEach(btn => btn.addEventListener('click', () => {
        const target = sorted.find(r => r.id === btn.dataset.id);
        if (active) {
          openClockOutModal(active, () => { window.location.href = '/my-day.html'; }, { switchTo: { projectId: target.id, label: projectRef(target) } });
        } else {
          window.location.href = `/my-day.html?clockin_project=${target.id}`;
        }
      }));
    }

    // Top of Summary: who's clocked into this job right now, and your own
    // clock in / clock out for it without going to My Day. Clocked in on
    // another job already? The button switches you over (the usual
    // clock-out wizard runs first). Only jobs take a clock-in here; a quote
    // still shows anyone who happens to be clocked to it.
    async function loadClockHereCard(project) {
      const el = document.getElementById('clock-here-card');
      if (!el) return;
      const { data: { user } } = await supabaseClient.auth.getUser();
      const [here, { data: mine }] = await Promise.all([
        fetchActiveClockIns(project.id),
        supabaseClient.from('time_entries').select('*, projects(name, job_number, quote_number)').eq('staff_id', user.id).is('clock_out', null).order('clock_in', { ascending: false }).limit(1).maybeSingle(),
      ]);
      const refresh = () => loadClockHereCard(project);
      const mineHere = mine && mine.project_id === project.id;
      if (!project.job_number && !here.length) { el.innerHTML = ''; return; }

      let btnHtml = '';
      if (mineHere) btnHtml = `<button type="button" class="danger" id="clock-here-btn">Clock out</button>`;
      else if (project.job_number) btnHtml = `<button type="button" id="clock-here-btn">${mine ? 'Switch to this job' : 'Clock in'}</button>`;
      const elsewhere = mine && !mineHere
        ? `<p class="subtitle" style="margin:6px 0 0; font-size:12px;">You're clocked in to ${mine.projects ? escapeHtml(projectRef(mine.projects)) : escapeHtml(timeCategoryLabel(mine.time_category) || 'General')} since ${clockSinceText(mine.clock_in)}.</p>`
        : '';

      el.innerHTML = `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;">
            <h2 style="margin:0;">${here.length ? 'On this job now' : 'Nobody clocked in here'}</h2>
            ${btnHtml}
          </div>
          ${here.map(r => `
            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 0; border-top:1px solid var(--border); margin-top:8px;">
              <div style="min-width:0;">
                <strong>${escapeHtml(r.staff_id === user.id ? 'You' : (r.full_name || 'Someone'))}</strong>
                ${r.stage_names && r.stage_names.length ? `<span class="subtitle" style="font-size:12px;"> &middot; ${r.stage_names.map(escapeHtml).join(', ')}</span>` : ''}
              </div>
              <span class="subtitle" style="font-size:12px;">since ${clockSinceText(r.clock_in)} &middot; ${clockElapsedText(r.clock_in)}</span>
            </div>`).join('')}
          ${elsewhere}
        </div>`;

      const btn = document.getElementById('clock-here-btn');
      if (!btn) return;
      btn.addEventListener('click', () => {
        if (mineHere) openClockOutModal(mine, refresh);
        else if (mine) openClockOutModal(mine, refresh, { switchTo: { projectId: project.id, label: projectRef(project) } });
        else openJobClockInModal(project, refresh);
      });
    }

    // "Schedule staff" - book people onto this quote (a site visit) or job
    // (work) from right here, for a date or a run of days, without going
    // over to the Schedule page. Same rules as there: required pre-job tasks
    // must be done before a job can be booked, double-bookings are flagged
    // (not blocked), and booking a job moves it Ready to Book -> Job Booked.
    async function openScheduleStaffPanel(project) {
      const isJob = !!project.job_number;
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:150; padding:16px; overflow-y:auto;';
      overlay.innerHTML = `<div class="card" style="max-width:560px; width:100%;"><p class="subtitle">Loading...</p></div>`;
      document.body.appendChild(overlay);

      const todayIso = new Date().toLocaleDateString('en-CA', { timeZone: 'Australia/Sydney' });
      const fmtDay = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
      const hhmm = (t) => String(t).slice(0, 5);
      const toSec = (t) => (String(t).length === 5 ? t + ':00' : String(t));

      async function render() {
        const [{ data: staff }, { data: booked }] = await Promise.all([
          supabaseClient.from('profiles').select('id, full_name').eq('active', true).order('full_name'),
          supabaseClient.from('schedule_assignments')
            .select('id, staff_id, assignment_date, start_time, end_time, note, profiles(full_name)')
            .eq('project_id', project.id).order('assignment_date').order('start_time'),
        ]);
        overlay.innerHTML = `
          <div class="card" style="max-width:560px; width:100%; max-height:92vh; overflow-y:auto;">
            <h2>${isJob ? 'Schedule staff on this job' : 'Schedule a site visit'}</h2>
            <p class="subtitle" style="margin-bottom:12px;">${escapeHtml(projectRef(project))} - ${isJob ? 'books people to work on site' : 'books people to attend site for this quote'}. They'll see it on their schedule and My Day.</p>

            ${(booked || []).length ? `
              <p class="subtitle" style="margin:0 0 4px; font-weight:600;">Already booked</p>
              <div style="margin-bottom:14px;">
                ${booked.map(b => `
                  <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:5px 0; border-bottom:1px solid var(--border); ${b.assignment_date < todayIso ? 'opacity:0.6;' : ''}">
                    <span style="font-size:13px;">${fmtDay(b.assignment_date)}, ${hhmm(b.start_time)}-${hhmm(b.end_time)} - <strong>${escapeHtml((b.profiles && b.profiles.full_name) || 'Someone')}</strong>${b.note ? ' (' + escapeHtml(b.note) + ')' : ''}</span>
                    <button type="button" class="secondary sched-remove" data-id="${b.id}" style="font-size:13px; min-height:40px; padding:0 12px; flex-shrink:0;">Remove</button>
                  </div>`).join('')}
              </div>` : ''}

            <p class="subtitle" style="margin:0 0 4px; font-weight:600;">Who</p>
            <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:4px 12px; margin-bottom:12px;">
              ${(staff || []).map(p => `<label style="display:flex; align-items:center; gap:6px; margin:0; font-weight:400;"><input type="checkbox" class="sched-staff" value="${p.id}" style="width:auto;" /> ${escapeHtml(p.full_name || 'Unnamed')}</label>`).join('')}
            </div>

            <div class="grid cols-2">
              <div><label style="margin-top:0;">Date</label><input type="date" id="sched-date" value="${todayIso}" /></div>
              <div><label style="margin-top:0;">To (optional, for several days)</label><input type="date" id="sched-end-date" /></div>
            </div>
            <div class="grid cols-2">
              <div><label>Start time</label><input type="time" id="sched-start" value="${isJob ? '07:00' : '09:00'}" /></div>
              <div><label>Finish time</label><input type="time" id="sched-end" value="${isJob ? '15:30' : '10:00'}" /></div>
            </div>
            <label style="display:flex; align-items:center; gap:8px; font-weight:400;"><input type="checkbox" id="sched-weekdays" checked style="width:auto;" /> Skip weekends when booking several days</label>
            <label>Note (optional)</label>
            <input id="sched-note" placeholder="e.g. bring the ladder, meet the builder at 7" />
            ${isJob ? `<label style="display:flex; align-items:center; gap:8px; font-weight:400; margin-top:10px;"><input type="checkbox" id="sched-email-client" style="width:auto;" /> Email the client this booking (you check the email before it sends)</label>` : ''}

            <div id="sched-msg"></div>
            <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
              <button type="button" id="sched-book-btn">Book</button>
              <button type="button" class="secondary" id="sched-close-btn">Close</button>
              <a class="link-quiet" href="/schedule.html" style="margin-left:auto; font-size:12px;">Open the full schedule &rarr;</a>
            </div>
          </div>`;

        overlay.querySelector('#sched-close-btn').addEventListener('click', () => { overlay.remove(); if (window.loadJobSchedule) loadJobSchedule(project); });
        overlay.querySelectorAll('.sched-remove').forEach(btn => btn.addEventListener('click', async () => {
          const b = (booked || []).find(x => x.id === btn.dataset.id);
          if (!confirm(b ? `Remove ${(b.profiles && b.profiles.full_name) || 'this person'}'s booking on ${fmtDay(b.assignment_date)}, ${hhmm(b.start_time)}-${hhmm(b.end_time)}?` : 'Remove this booking?')) return;
          btn.disabled = true;
          const { error } = await supabaseClient.from('schedule_assignments').delete().eq('id', btn.dataset.id);
          if (error) { overlay.querySelector('#sched-msg').innerHTML = `<div class="error-box">${escapeHtml(friendlyError(error))}</div>`; btn.disabled = false; return; }
          await render();
        }));

        overlay.querySelector('#sched-book-btn').addEventListener('click', async () => {
          const msg = overlay.querySelector('#sched-msg');
          const bookBtn = overlay.querySelector('#sched-book-btn');
          const staffIds = [...overlay.querySelectorAll('.sched-staff:checked')].map(c => c.value);
          const startDate = overlay.querySelector('#sched-date').value;
          const endDate = overlay.querySelector('#sched-end-date').value || startDate;
          const start = overlay.querySelector('#sched-start').value;
          const end = overlay.querySelector('#sched-end').value;
          const weekdaysOnly = overlay.querySelector('#sched-weekdays').checked;
          const note = overlay.querySelector('#sched-note').value.trim() || null;
          if (!staffIds.length) { msg.innerHTML = `<div class="error-box">Pick at least one person.</div>`; return; }
          if (!startDate) { msg.innerHTML = `<div class="error-box">Pick a date.</div>`; return; }
          if (endDate < startDate) { msg.innerHTML = `<div class="error-box">The "to" date can't be before the start date.</div>`; return; }
          if (!start || !end || end <= start) { msg.innerHTML = `<div class="error-box">Finish time must be after the start time.</div>`; return; }

          const dates = [];
          for (let d = new Date(startDate + 'T00:00:00'); d <= new Date(endDate + 'T00:00:00'); d.setDate(d.getDate() + 1)) {
            const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            const isWeekend = d.getDay() === 0 || d.getDay() === 6;
            if (weekdaysOnly && isWeekend && endDate !== startDate) continue;
            dates.push(iso);
          }
          if (!dates.length) { msg.innerHTML = `<div class="error-box">No days to book in that range (weekends skipped).</div>`; return; }
          if (dates.length * staffIds.length > 60) { msg.innerHTML = `<div class="error-box">That's ${dates.length * staffIds.length} bookings in one go - book a smaller range.</div>`; return; }

          bookBtn.disabled = true; bookBtn.textContent = 'Booking...'; msg.innerHTML = '';
          try {
            if (isJob) {
              const blocking = await requiredTasksBlockingSchedule(project.id);
              if (blocking.length) throw new Error(`This job can't be scheduled yet - required task${blocking.length > 1 ? 's' : ''} not done: ${blocking.join('; ')}`);
            }
            const { data: existing } = await supabaseClient.from('schedule_assignments')
              .select('staff_id, assignment_date, start_time, end_time, profiles(full_name), projects(name, job_number)')
              .in('staff_id', staffIds).gte('assignment_date', dates[0]).lte('assignment_date', dates[dates.length - 1]);
            const clashes = [];
            staffIds.forEach(sid => dates.forEach(d => {
              (existing || []).filter(e => e.staff_id === sid && e.assignment_date === d && toSec(e.start_time) < toSec(end) && toSec(start) < toSec(e.end_time))
                .forEach(e => clashes.push(`${(e.profiles && e.profiles.full_name) || 'Someone'} on ${fmtDay(d)}: already booked ${hhmm(e.start_time)}-${hhmm(e.end_time)}${e.projects ? ' (' + (e.projects.name || 'job') + ')' : ''}`));
            }));
            if (clashes.length && !confirm(`Some of these are already booked:\n\n${clashes.slice(0, 8).join('\n')}${clashes.length > 8 ? '\n...' : ''}\n\nBook anyway?`)) {
              bookBtn.disabled = false; bookBtn.textContent = 'Book';
              return;
            }
            const rows = [];
            staffIds.forEach(sid => dates.forEach(d => rows.push({
              staff_id: sid, project_id: project.id, block_type: isJob ? 'job' : 'site_visit',
              assignment_date: d, start_time: start, end_time: end, note,
            })));
            const { data: made, error } = await supabaseClient.from('schedule_assignments').insert(rows).select('id');
            if (error) throw error;
            // The database moves Ready to Book to Job Booked on this booking (migration 20261023000000).
            await logActivity('project', project.id, 'staff_scheduled', `Scheduled ${staffIds.length} ${staffIds.length === 1 ? 'person' : 'people'} for ${dates.length} day${dates.length === 1 ? '' : 's'} from ${fmtDay(dates[0])}`);
            const emailTick = overlay.querySelector('#sched-email-client');
            if (emailTick && emailTick.checked && window.openEmailBookingOverlay) {
              overlay.remove();
              if (window.loadJobSchedule) loadJobSchedule(project);
              openEmailBookingOverlay(project, (made || []).map(r => r.id));
              return;
            }
            await render();
            overlay.querySelector('#sched-msg').innerHTML = `<div class="success-box">Booked ${rows.length} ${rows.length === 1 ? 'slot' : 'slots'}.</div>`;
          } catch (err) {
            msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
            bookBtn.disabled = false; bookBtn.textContent = 'Book';
          }
        });
      }
      await render();
    }

    // Electrical schedule card (Summary tab): totals from the latest
    // marked-up plan, with a button that exports them as a schedule PDF into
    // the job's Documents (Schedules folder). The numbers come from the
    // plan_summary saved when a marked-up copy of a plan is made.
    async function loadPlanScheduleCard(project) {
      const el = document.getElementById('plan-schedule-card');
      if (!el || typeof buildScheduleReportPdf !== 'function') return;
      const { data: docs } = await supabaseClient
        .from('project_documents')
        .select('id, file_name, created_at, page_names, plan_summary')
        .eq('project_id', project.id)
        .not('plan_summary', 'is', null)
        .order('created_at', { ascending: false });
      const usable = (docs || []).filter(d => !planSummaryIsEmpty(d.plan_summary));
      if (!usable.length) { el.innerHTML = ''; return; }

      const render = (doc) => {
        const t = totalPlanSummary(doc.plan_summary);
        const symbolCount = Object.values(t.symbols).reduce((a, b) => a + b, 0);
        const metres = Object.values(t.cables).reduce((a, c) => a + c.metres, 0);
        const bits = [
          symbolCount ? `${symbolCount} symbol${symbolCount === 1 ? '' : 's'}` : null,
          Object.keys(t.circuits).length ? `${Object.keys(t.circuits).length} circuit${Object.keys(t.circuits).length === 1 ? '' : 's'}` : null,
          Object.keys(t.cables).length ? `cables ${metres > 0 ? metres.toFixed(1) + ' m measured' : '(no scale set)'}` : null,
        ].filter(Boolean).join(' &middot; ');
        return bits;
      };
      el.innerHTML = `
        <div class="card">
          <h2>Electrical schedule</h2>
          <p class="subtitle" style="margin-bottom:8px;">Symbols, circuits and cable lengths marked up on the plans - export it as a PDF to send or attach to the quote.</p>
          ${usable.length > 1 ? `
            <label style="margin-top:0;">From plan</label>
            <select id="plan-schedule-source">${usable.map((d, i) => `<option value="${i}">${escapeHtml(d.file_name)} (${new Date(d.created_at).toLocaleDateString('en-AU')})</option>`).join('')}</select>` : `<p class="subtitle" style="margin:0 0 8px;">From <strong>${escapeHtml(usable[0].file_name)}</strong></p>`}
          <p id="plan-schedule-totals" style="margin:8px 0 12px;">${render(usable[0])}</p>
          <button type="button" id="plan-schedule-export">Export schedule PDF</button>
          <div id="plan-schedule-msg"></div>
        </div>`;

      const pick = () => usable[parseInt((document.getElementById('plan-schedule-source') || { value: 0 }).value, 10) || 0];
      const sourceSel = document.getElementById('plan-schedule-source');
      if (sourceSel) sourceSel.addEventListener('change', () => { document.getElementById('plan-schedule-totals').innerHTML = render(pick()); });
      document.getElementById('plan-schedule-export').addEventListener('click', async () => {
        const btn = document.getElementById('plan-schedule-export');
        const msg = document.getElementById('plan-schedule-msg');
        const doc = pick();
        btn.disabled = true; btn.textContent = 'Building...'; msg.innerHTML = '';
        try {
          const PDFLib = await loadPdfLib();
          const { data: company } = await supabaseClient.from('company_settings').select('company_name').eq('id', 1).maybeSingle();
          const bytes = await buildScheduleReportPdf(PDFLib, {
            company: company && company.company_name, projectName: project.name, clientName: project.client_name,
            ref: projectRef(project), sourceName: doc.file_name, pageNames: doc.page_names || [], summary: doc.plan_summary,
          });
          const { data: { user } } = await supabaseClient.auth.getUser();
          const path = `documents/${project.id}/${Date.now()}-schedule.pdf`;
          const { error: upErr } = await supabaseClient.storage.from('project-documents').upload(path, new Blob([bytes], { type: 'application/pdf' }), { contentType: 'application/pdf' });
          if (upErr) throw upErr;
          const fileName = `Electrical schedule - ${project.name}.pdf`;
          const { error: insErr } = await supabaseClient.from('project_documents').insert({
            project_id: project.id, folder: 'Schedules', file_path: path, file_name: fileName, mime_type: 'application/pdf', uploaded_by: user.id,
          });
          if (insErr) throw insErr;
          await logActivity('project', project.id, 'schedule_exported', 'Exported the electrical schedule PDF');
          msg.innerHTML = `<div class="success-box">Saved to Documents &gt; Schedules.</div>`;
          openPdfViewer(path, fileName, { projectId: project.id, folder: 'Schedules', onSaved: () => loadDocuments(project.id) });
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
        } finally {
          btn.disabled = false; btn.textContent = 'Export schedule PDF';
        }
      });
    }

    // Site photos (project_photos) were being written at clock-out this
    // whole time but never actually shown anywhere - this is the first
    // place they're rendered, so a job with 30+ photos from the field has
    // somewhere to browse them instead of piling up unseen.
    function loadSitePhotos(projectId) {
      return (loadSitePhotos.flight ||= singleFlight(loadSitePhotosNow))(projectId);
    }

    async function loadSitePhotosNow(projectId) {
      const listEl = document.getElementById('site-photos-list');
      if (!listEl) return;
      let [{ data: photos, error }, myRole, { data: { session } }] = await Promise.all([
        supabaseClient
          .from('project_photos')
          .select('id, url, caption, staff_id, created_at, task_id, profiles(full_name)')
          .eq('project_id', projectId)
          .order('created_at', { ascending: false }),
        getMyRole(),
        supabaseClient.auth.getSession(),
      ]);
      const myId = session?.user?.id;
      if (error) { listEl.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(error))}</div>`; return; }
      if (!photos.length) { listEl.innerHTML = `<p class="subtitle">No site photos yet.</p>`; return; }

      // Videos (ServiceM8 brought some across) play in place; only pictures
      // go to the lightbox, so photos below means pictures only.
      const allPhotos = photos;
      photos = allPhotos.filter(p => !isVideoUrl(p.url));
      const urls = photos.map(p => p.url);
      const captions = photos.map(p => p.caption || '');

      // Grouped under Today, Yesterday, then 'Tue 14 Oct' (rows come newest first, so consecutive
      // grouping is enough), with small thumbnails that load only as they scroll into view.
      const todayKey = sydneyDateKey(new Date());
      const yd = new Date(`${todayKey}T12:00:00Z`);
      yd.setUTCDate(yd.getUTCDate() - 1);
      const yesterdayKey = sydneyDateKey(yd);
      const dayHeading = (key) => key === todayKey ? 'Today' : key === yesterdayKey ? 'Yesterday' : dayKeyLabel(key) + (key.slice(0, 4) === todayKey.slice(0, 4) ? '' : ' ' + key.slice(0, 4));
      const groups = [];
      allPhotos.forEach(p => {
        const key = sydneyDateKey(new Date(p.created_at));
        if (!groups.length || groups[groups.length - 1].key !== key) groups.push({ key, items: [] });
        groups[groups.length - 1].items.push(p);
      });
      const tileHtml = (p) => `
            <div style="border:1px solid var(--border); border-radius:8px; overflow:hidden;">
              ${isVideoUrl(p.url)

    async function wireCompanyDocs(project) {
      const pickEl = document.getElementById('company-docs-pick');
      const btn = document.getElementById('company-docs-add-btn');
      const msg = document.getElementById('company-docs-msg');
      const { data: docs, error } = await supabaseClient.from('company_documents').select('*').order('sort_order').order('title');
      if (error) { pickEl.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(error))}</div>`; btn.style.display = 'none'; return; }
      if (!docs.length) { pickEl.innerHTML = `<p class="subtitle">No company documents yet. Add them on the <a href="/documents.html">Documents</a> page.</p>`; btn.style.display = 'none'; return; }
      pickEl.innerHTML = docs.map(d => `
        <label style="display:flex; gap:8px; align-items:center; margin:6px 0; font-weight:normal;">
          <input type="checkbox" class="company-doc-cb" value="${d.id}" style="width:auto;" /> ${escapeHtml(d.title)}
        </label>`).join('');
      const byId = Object.fromEntries(docs.map(d => [d.id, d]));
      btn.addEventListener('click', async () => {
        const picked = [...pickEl.querySelectorAll('.company-doc-cb:checked')].map(cb => byId[cb.value]);
        if (!picked.length) { msg.innerHTML = `<div class="error-box">Tick at least one document.</div>`; return; }
        btn.disabled = true; btn.textContent = 'Adding...'; msg.innerHTML = '';
        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          for (const doc of picked) {
            if (doc.kind === 'schedule_of_rates') {
              const res = await fetch('/.netlify/functions/generate-client-document-pdf', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
                body: JSON.stringify({ doc_type: 'schedule_of_rates', record_id: project.id }),
              });
              const d = await res.json().catch(() => ({}));
              if (!res.ok || !d.ok) throw new Error(d.error || 'Could not make the Schedule of Rates PDF');
            } else {
              const ext = (doc.file_name || '').match(/\.[^.]+$/)?.[0] || '';
              const fileName = doc.title + (doc.title.toLowerCase().endsWith(ext.toLowerCase()) ? '' : ext);
              const path = `documents/${project.id}/${Date.now()}-${fileName.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
              const { error: cpErr } = await supabaseClient.storage.from('project-documents').copy(doc.file_path, path);
              if (cpErr) throw cpErr;
              const { error: insErr } = await supabaseClient.from('project_documents').insert({
                project_id: project.id, folder: 'Company docs', file_path: path, file_name: fileName, mime_type: doc.mime_type, uploaded_by: session.user.id,
              });
              if (insErr) throw insErr;
            }
          }
          await logActivity('project', project.id, 'documents_uploaded', `Added ${picked.map(d => d.title).join(', ')} from Documents`);
          pickEl.querySelectorAll('.company-doc-cb').forEach(cb => { cb.checked = false; });
          selectedDocFolder = 'Company docs';
          await loadDocuments(project.id);
          msg.innerHTML = `<div class="success-box">Added to Company docs. Attach ${picked.length === 1 ? 'it' : 'them'} from the Emails tab.</div>`;
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
        } finally {
          btn.disabled = false; btn.textContent = 'Add to job';
        }
      });
    }

    function fuzzyMatchScore(a, b) {
      const norm = (s) => (s || '').toLowerCase().replace(/[^a-z0-9 ]/g, ' ').split(/\s+/).filter(w => w.length > 2);
      const wordsA = new Set(norm(a));
      const wordsB = norm(b);
      if (!wordsA.size || !wordsB.length) return 0;
      const matches = wordsB.filter(w => wordsA.has(w)).length;
      return matches / Math.max(wordsA.size, wordsB.length);
    }

    async function openSuggestPoPanel(projectId, centres) {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `<div class="card" style="max-width:400px; width:100%;"><p class="subtitle">Matching quoted materials against Stock...</p></div>`;
      document.body.appendChild(overlay);

      const { data: materials } = await supabaseClient.from('materials').select('id, name, cost_price, supplier_id, quantity_on_hand, suppliers(name)');
      const { data: existingPOItems } = await supabaseClient
        .from('purchase_order_line_items')
        .select('material_id, purchase_orders!inner(project_id, stock_source)')
        .eq('purchase_orders.project_id', projectId);
      // Stock POs are left out: what they took is already counted through job_material_usage below,
      // so a re-run still suggests any shortfall instead of skipping the whole quoted line.
      const alreadyOrderedMaterialIds = new Set((existingPOItems || []).filter(x => !x.purchase_orders?.stock_source).map(x => x.material_id).filter(Boolean));
      // already costed to this job (an earlier run, a stock PO, a manual entry): covered, never deducted again
      const { data: usedRows } = await supabaseClient.from('job_material_usage').select('material_id, quantity').eq('project_id', projectId);
      const usedLeft = {};
      (usedRows || []).forEach(r => { if (r.material_id) usedLeft[r.material_id] = (usedLeft[r.material_id] || 0) + (Number(r.quantity) || 0); });
      // only the Warehouse count, as that is what confirming takes stock out of
      const { data: whRows } = await supabaseClient.from('material_stock_by_location').select('material_id, quantity').eq('location_type', 'warehouse');
      const warehouseLeft = {};
      (whRows || []).forEach(r => { warehouseLeft[r.material_id] = (warehouseLeft[r.material_id] || 0) + (Number(r.quantity) || 0); });

      const quotedMaterials = centres.flatMap(c => (c.cost_centre_line_items || [])
        .filter(li => li.item_type === 'material')
        .map(li => ({ ...li, stageName: c.name, costCentreId: c.id })));

      const matched = {}; // supplier_id -> { supplierName, items: [] }
      const unassigned = [];
      const fromStock = []; // covered by what's already on hand - never ordered at all
      const warehouseStart = { ...warehouseLeft };

      quotedMaterials.forEach(li => {
        let bestMatch = null, bestScore = 0;
        (materials || []).forEach(m => {
          const score = fuzzyMatchScore(m.name, li.description);
          if (score > bestScore) { bestScore = score; bestMatch = m; }
        });
        const match = bestScore >= 0.3 ? bestMatch : null;
        if (match && alreadyOrderedMaterialIds.has(match.id)) return; // already on a PO for this job, skip

        const quotedQty = Number(li.quantity) || 0;
        const alreadyOnJob = match ? Math.min(quotedQty, usedLeft[match.id] || 0) : 0;
        if (match) usedLeft[match.id] = (usedLeft[match.id] || 0) - alreadyOnJob;
        const onHand = match ? (warehouseLeft[match.id] || 0) : 0;
        const coveredByStock = match ? Math.min(quotedQty - alreadyOnJob, onHand) : 0;
        if (match) warehouseLeft[match.id] = onHand - coveredByStock;
        const stillNeeded = quotedQty - alreadyOnJob - coveredByStock;

        if (coveredByStock > 0) {
          fromStock.push({ description: li.description, quantity: coveredByStock, unit_cost: match.cost_price, materialId: match.id, costCentreId: li.costCentreId, stageName: li.stageName, stockName: match.name, onHand: warehouseStart[match.id] || 0 });
        }
        if (stillNeeded <= 0) return; // fully covered by existing stock, nothing to order

        if (match && match.supplier_id) {
          if (!matched[match.supplier_id]) matched[match.supplier_id] = { supplierName: match.suppliers?.name || 'Unknown', items: [] };
          matched[match.supplier_id].items.push({ description: li.description, quantity: stillNeeded, unit_cost: match.cost_price, materialId: match.id, stageName: li.stageName });
        } else {
          unassigned.push({ description: li.description, quantity: stillNeeded, unit_cost: Number(li.unit_cost) || 0, materialId: match?.id || null, stageName: li.stageName });
        }
      });

      const { data: suppliers } = await supabaseClient.from('suppliers').select('id, name').order('name');

      if (!Object.keys(matched).length && !unassigned.length && !fromStock.length) {
        overlay.querySelector('.card').innerHTML = `<h2>Nothing to suggest</h2><p class="subtitle">Every quoted material is either already on a PO for this job, or there are no material line items quoted.</p><button type="button" class="secondary" id="sp-close-btn">Close</button>`;
        overlay.querySelector('#sp-close-btn').addEventListener('click', () => overlay.remove());
        return;
      }

      overlay.style.overflowY = 'auto';
      overlay.innerHTML = `
        <div class="card" style="max-width:720px; width:100%; max-height:90vh; overflow-y:auto;">
          <h2>Suggested purchase orders</h2>
          <p class="subtitle" style="margin-bottom:14px;">Nothing's created yet - review each supplier group, then confirm.</p>

          ${fromStock.length ? `
            <div style="border:1px solid var(--green); border-radius:8px; padding:12px; margin-bottom:10px;">
              <p style="margin:0 0 4px; color:var(--green); font-weight:600;">Take from Warehouse stock</p>
              <p class="subtitle" style="margin:0 0 8px;">Ticked lines come out of the Warehouse count and are costed to the job when you confirm. Untick any that matched the wrong Stock item: unticked lines are not taken or ordered, add them to a PO by hand.</p>
              ${fromStock.map((item, i) => `
                <label style="display:flex; gap:10px; align-items:center; min-height:44px; margin:0; font-weight:400; font-size:13px; cursor:pointer;">
                  <input type="checkbox" class="sp-stock-include" data-i="${i}" checked style="width:auto;" />
                  <span style="flex:1; min-width:0;">${escapeHtml(item.description)} (${escapeHtml(item.stageName)}) x${item.quantity}<br><span class="subtitle" style="font-size:12px;">Stock: ${escapeHtml(item.stockName)}, ${poQty(item.onHand)} on hand in the Warehouse</span></span>
                  <span>${money(item.quantity * item.unit_cost)}</span>
                </label>`).join('')}
            </div>` : ''}

          ${Object.entries(matched).map(([supplierId, group]) => `
            <div class="sp-group" data-supplier-id="${supplierId}" style="border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px;">
              <label style="margin-top:0; display:flex; align-items:center; gap:8px;"><input type="checkbox" class="sp-include" checked style="width:auto;" /><strong>${escapeHtml(group.supplierName)}</strong></label>
              ${group.items.map(item => `<div style="font-size:13px; display:flex; justify-content:space-between; padding:4px 0;"><span>${escapeHtml(item.description)} (${escapeHtml(item.stageName)}) x${item.quantity}</span><span>${money(item.quantity * item.unit_cost)}</span></div>`).join('')}
              <p class="subtitle" style="margin-top:6px;">Total: ${money(group.items.reduce((s, i) => s + i.quantity * i.unit_cost, 0))}</p>
            </div>`).join('')}

          ${unassigned.length ? `
            <div style="border:1px solid var(--red); border-radius:8px; padding:12px; margin-bottom:10px;">
              <p style="margin:0 0 8px; color:var(--red); font-weight:600;">Needs a supplier assigned</p>
              ${unassigned.map((item, i) => `
                <div class="sp-unassigned-row" data-index="${i}" style="margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--border);">
                  <span style="font-size:13px;">${escapeHtml(item.description)} (${escapeHtml(item.stageName)}) x${item.quantity}</span>
                  <p class="subtitle" style="margin:2px 0 4px;">Leave blank to skip ordering this item for now.</p>
                  ${supplierPickerHtml({ search: `sp-unassigned-search-${i}`, results: `sp-unassigned-results-${i}`, selected: `sp-unassigned-selected-${i}`, newSection: `sp-unassigned-new-section-${i}`, newEmail: `sp-unassigned-new-email-${i}`, newPhone: `sp-unassigned-new-phone-${i}` })}
                </div>`).join('')}
            </div>` : ''}

          <div style="margin-top:14px;">
            <button id="sp-confirm-btn">Confirm</button>
            <button type="button" class="secondary" id="sp-cancel-btn">Cancel</button>
          </div>
          <div id="sp-msg"></div>
        </div>`;

      const unassignedResolvers = unassigned.map((item, i) => wireSupplierPicker(overlay, suppliers, {
        search: `sp-unassigned-search-${i}`, results: `sp-unassigned-results-${i}`, selected: `sp-unassigned-selected-${i}`,
        newSection: `sp-unassigned-new-section-${i}`, newEmail: `sp-unassigned-new-email-${i}`, newPhone: `sp-unassigned-new-phone-${i}`,
      }));

      // Once per panel: what Confirm already did, so pressing it again after a failure never takes
      // stock twice or makes a second PO for the same group.
      const doneStages = new Map(); // cost centre id ('' for whole job) -> Stock PO number
      const doneGroups = new Map(); // supplier group key -> PO number
      overlay.querySelector('#sp-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#sp-confirm-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#sp-msg');
        const confirmBtn = overlay.querySelector('#sp-confirm-btn');
        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Creating...';
        const pickedStock = fromStock.filter((_, i) => overlay.querySelector(`.sp-stock-include[data-i="${i}"]`).checked);

        try {
          const { data: { user } } = await supabaseClient.auth.getUser();

          // Ticked Stock lines come off the Warehouse through po_create_stock_pull, one closed Stock
          // PO per stage: it locks the count, refuses to go below it, costs the lines to the stage
          // and logs it, all or nothing. Nothing is deducted from the browser.
          const byStage = {};
          pickedStock.forEach(item => {
            const key = item.costCentreId || '';
            if (!byStage[key]) byStage[key] = {};
            byStage[key][item.materialId] = (byStage[key][item.materialId] || 0) + item.quantity;
          });
          for (const [stageKey, mats] of Object.entries(byStage)) {
            if (doneStages.has(stageKey)) continue;
            const { data: pull, error: pullErr } = await supabaseClient.rpc('po_create_stock_pull', {
              p_project_id: projectId, p_cost_centre_id: stageKey || null, p_source: 'warehouse', p_vehicle_id: null,
              p_lines: Object.entries(mats).map(([materialId, quantity]) => ({ material_id: materialId, quantity, left_after: null })),
              p_description: 'Stock covering quoted materials (PO suggestions)',
            });
            if (pullErr) {
              if (/how many are left/i.test(pullErr.message || '')) throw new Error('Stock changed since this opened. Close and open PO suggestions again.');
              throw pullErr;
            }
            doneStages.set(stageKey, pull?.po_number || '');
          }

          for (const groupEl of overlay.querySelectorAll('.sp-group')) {
            if (!groupEl.querySelector('.sp-include').checked) continue;
            const supplierId = groupEl.dataset.supplierId;
            if (doneGroups.has(supplierId)) continue;
            const group = matched[supplierId];
            const { data: newPo, error: poErr } = await supabaseClient.from('purchase_orders').insert({
              project_id: projectId, supplier_id: supplierId, supplier_name: group.supplierName,
              po_type: 'fixed', locked: false, status: 'ordered', amount: 0,
              description: 'Auto-suggested from quoted materials',
            }).select('id, po_number').single(); // the number is filled in by the database
            if (poErr) throw poErr;
            const poNumber = newPo.po_number;
            await logActivity('purchase_order', newPo.id, 'created', `PO created for ${group.supplierName} (auto-suggested from quote)`);
            await logActivity('project', projectId, 'po_created', `PO ${poNumber || ''} created for ${group.supplierName} (auto-suggested from quote)`);
            await createPoFollowUpTask(projectId, poNumber, group.supplierName);
            const { error: liErr } = await supabaseClient.from('purchase_order_line_items').insert(
              group.items.map(item => ({ po_id: newPo.id, material_id: item.materialId, description: item.description, quantity: item.quantity, unit_cost: item.unit_cost, added_by: user.id }))
            );
            doneGroups.set(supplierId, poNumber || '');
            if (liErr) throw new Error(`PO ${poNumber || ''} was made but its lines failed: ${liErr.message}. Add them on the PO.`);
          }

          // Group manually-assigned unassigned items by the supplier picked
          // (typing a new name creates that supplier here, same as any
          // other "create a PO" panel) - blank means skip.
          const manualGroups = {}; // supplierId -> { supplierName, items }
          for (const row of overlay.querySelectorAll('.sp-unassigned-row')) {
            const { supplierId, supplierName } = await unassignedResolvers[parseInt(row.dataset.index)]();
            if (!supplierId) continue;
            const item = unassigned[parseInt(row.dataset.index)];
            if (!manualGroups[supplierId]) manualGroups[supplierId] = { supplierName, items: [] };
            manualGroups[supplierId].items.push(item);
          }
          for (const [supplierId, group] of Object.entries(manualGroups)) {
            if (doneGroups.has(`manual:${supplierId}`)) continue;
            const { supplierName, items } = group;
            const { data: newPo, error: poErr } = await supabaseClient.from('purchase_orders').insert({
              project_id: projectId, supplier_id: supplierId, supplier_name: supplierName,
              po_type: 'fixed', locked: false, status: 'ordered', amount: 0,
              description: 'Auto-suggested from quoted materials (manually assigned)',
            }).select('id, po_number').single(); // the number is filled in by the database
            if (poErr) throw poErr;
            const poNumber = newPo.po_number;
            await logActivity('purchase_order', newPo.id, 'created', `PO created for ${supplierName} (auto-suggested, manually assigned)`);
            await logActivity('project', projectId, 'po_created', `PO ${poNumber || ''} created for ${supplierName} (auto-suggested, manually assigned)`);
            await createPoFollowUpTask(projectId, poNumber, supplierName);
            const { error: liErr } = await supabaseClient.from('purchase_order_line_items').insert(
              items.map(item => ({ po_id: newPo.id, material_id: item.materialId, description: item.description, quantity: item.quantity, unit_cost: item.unit_cost, added_by: user.id }))
            );
            doneGroups.set(`manual:${supplierId}`, poNumber || '');
            if (liErr) throw new Error(`PO ${poNumber || ''} was made but its lines failed: ${liErr.message}. Add them on the PO.`);
          }

          const created = doneGroups.size;
          const stockPos = [...doneStages.values()].filter(Boolean);
          overlay.remove();
          showToast(`Created ${created} purchase order${created === 1 ? '' : 's'}${stockPos.length ? `, took ${pickedStock.length} line${pickedStock.length === 1 ? '' : 's'} from Warehouse stock (${stockPos.join(', ')})` : ''}.`);
          await loadPurchaseOrders(projectId, centres);
        } catch (err) {
          const done = [...doneStages.values(), ...doneGroups.values()].filter(Boolean);
          // A lost reply may have gone through on the server, so a blind retry could take stock twice
          const lost = isNetworkError(err);
          const next = lost ? ' Close this panel and open PO suggestions again: what went through is not suggested twice.' : (done.length ? ' Press Confirm again to finish the rest, nothing is repeated.' : '');
          msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}${done.length ? ` Already done: ${escapeHtml(done.join(', '))}.` : ''}${next}</div>`;
          confirmBtn.disabled = lost;
          confirmBtn.textContent = 'Confirm';
        }
      });
    }

    async function openCreatePoPanel(projectId, centres) {
      const { data: suppliers } = await supabaseClient.from('suppliers').select('id, name').order('name');
      const { data: materials } = await supabaseClient.from('materials').select('id, name, cost_price').order('name');
      const vehicles = await stockVehicles();
      const jobLabel = await poJobLabel(projectId);
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:560px; width:100%; max-height:90vh; overflow-y:auto;">
          <h2>Create purchase order</h2>
          <label style="margin-top:0">Where from</label>
          <select id="cp-source">${poSourceOptionsHtml(vehicles)}</select>
          <p class="subtitle" style="font-size:12px; margin:4px 0 0;">Warehouse or vehicle stock makes a stock PO: the gear comes off that count and onto this job straight away.</p>
          <label>Supplier</label>
          ${supplierPickerHtml({ search: 'cp-supplier-search', results: 'cp-supplier-results', selected: 'cp-supplier-selected', newSection: 'cp-supplier-new-section', newEmail: 'cp-supplier-new-email', newPhone: 'cp-supplier-new-phone' })}
          <button type="button" class="secondary" id="cp-upload-invoice-btn" style="margin-top:8px; font-size:12px; padding:6px 10px;">Or upload the supplier's invoice instead</button>
          <label style="margin-top:14px;">Stage (optional)</label>
          <select id="cp-stage"><option value="">Whole project</option>${centres.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')}</select>
          <label>Description</label>
          <input id="cp-description" placeholder="e.g. Switchboard gear for stage 2" />

          ${poTypeChoiceHtml('cp')}
          <p class="subtitle" style="font-size:12px; margin:0 0 6px;">Anyone can add more lines as the job goes. Close the PO once it's all in: that approves its bills.</p>
          <div id="cp-fixed-items-container"></div>
          <button type="button" class="secondary" id="cp-add-line-btn" style="font-size:12px; padding:6px 10px;">+ Add line</button>
          <label>Budget cap (optional)</label>
          <input id="cp-budget-cap" type="number" step="0.01" inputmode="decimal" placeholder="Flag when spending gets close to this" />
          ${poNotesFieldsHtml('cp')}
          ${poShowPricesHtml('cp')}

          <label style="margin-top:14px;">Attach document (optional)</label>
          <input type="file" id="cp-file" />

          <div style="margin-top:14px;">
            <button id="cp-save-btn">Create PO</button>
            <button type="button" class="secondary" id="cp-cancel-btn">Cancel</button>
          </div>
          <div id="cp-msg"></div>
        </div>`;
      document.body.appendChild(overlay);

      const resolveSupplier = wireSupplierPicker(overlay, suppliers, { search: 'cp-supplier-search', results: 'cp-supplier-results', selected: 'cp-supplier-selected', newSection: 'cp-supplier-new-section', newEmail: 'cp-supplier-new-email', newPhone: 'cp-supplier-new-phone' });
      wireUploadInvoiceButton(overlay.querySelector('#cp-upload-invoice-btn'), overlay.querySelector('#cp-msg'));

      buildMaterialSearchRow(materials || [], 'cp-fixed-items-container');
      overlay.querySelector('#cp-add-line-btn').addEventListener('click', () => buildMaterialSearchRow(materials || [], 'cp-fixed-items-container'));

      overlay.querySelector('#cp-source').addEventListener('change', (e) => {
        if (e.target.value === 'supplier') return;
        const vehicleId = e.target.value.startsWith('vehicle:') ? e.target.value.slice(8) : null;
        const v = vehicles.find(x => x.id === vehicleId);
        const typed = overlay.querySelector('#cp-supplier-search').value.trim()
          || [...overlay.querySelectorAll('#cp-fixed-items-container .po-line-search')].some(i => i.value.trim())
          || ['#cp-description', '#cp-supplier-notes', '#cp-internal-notes', '#cp-budget-cap'].some(s => overlay.querySelector(s).value.trim())
          || overlay.querySelector('#cp-file').files.length;
        if (typed && !confirm(`Switch to taking stock from ${v ? (v.vehicle_name || v.rego) : 'the Warehouse'}? The supplier, lines and notes typed here will be cleared.`)) { e.target.value = 'supplier'; return; }
        overlay.remove();
        openStockPullPanel({
          projectId, jobLabel, centres, source: vehicleId ? 'vehicle' : 'warehouse', vehicleId, vehicleLabel: v ? (v.vehicle_name || v.rego) : null,
          onDone: () => loadPurchaseOrders(projectId, centres),
        });
      });

      overlay.querySelector('#cp-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#cp-save-btn').addEventListener('click', async () => {
        const btn = overlay.querySelector('#cp-save-btn');
        const label = btn.textContent;
        const lineProblem = materialLineRowsProblem('cp-fixed-items-container');
        if (lineProblem) { overlay.querySelector('#cp-msg').innerHTML = `<div class="error-box">${escapeHtml(lineProblem)}</div>`; return; }
        btn.disabled = true;
        btn.textContent = 'Creating...';
        const msg = overlay.querySelector('#cp-msg');
        const budgetCap = parseFloat(overlay.querySelector('#cp-budget-cap').value) || null;

        try {
          const { supplierId, supplierName } = await resolveSupplier();
          if (!supplierId) { msg.innerHTML = `<div class="error-box">Search for an existing supplier or type a new one.</div>`; return; }

          const { data: { user } } = await supabaseClient.auth.getUser();
          const fileInput = overlay.querySelector('#cp-file');
          let file_path = null, file_name = null;
          if (fileInput.files.length) {
            file_path = await uploadPrivateFile(fileInput.files[0], projectId);
            file_name = fileInput.files[0].name;
          }

          const { data: newPo, error: poErr } = await supabaseClient.from('purchase_orders').insert({
            project_id: projectId,
            cost_centre_id: overlay.querySelector('#cp-stage').value || null,
            supplier_id: supplierId,
            supplier_name: supplierName,
            description: overlay.querySelector('#cp-description').value.trim() || null,
            po_type: readPoTypeChoice(overlay, 'cp'), // open: the bill fills in the lines; bill checks use the cap when there is one
            locked: false,
            budget_cap: budgetCap,
            ...readPoNotesFields(overlay, 'cp'),
            show_prices: overlay.querySelector('#cp-show-prices').checked,
            status: 'ordered',
            amount: 0,
            file_path, file_name,
          }).select('id, po_number').single();
          if (poErr) throw poErr;
          await logActivity('purchase_order', newPo.id, 'created', `PO ${newPo.po_number || ''} created for ${supplierName}`);
          await logActivity('project', projectId, 'po_created', `PO ${newPo.po_number || ''} created for ${supplierName}`);
          await createPoFollowUpTask(projectId, newPo.po_number, supplierName);

          const lines = readMaterialLineRows('cp-fixed-items-container').map(l => ({
            po_id: newPo.id, material_id: l.materialId, description: l.description,
            quantity: l.quantity, unit_cost: l.unit_cost, added_by: user.id,
          }));
          if (lines.length) {
            const { error: liErr } = await supabaseClient.from('purchase_order_line_items').insert(lines);
            if (liErr) throw liErr;
          }

          overlay.remove();
          await loadPurchaseOrders(projectId, centres);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
        } finally {
          btn.disabled = false;
          btn.textContent = label;
        }
      });
    }

    (async function () {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();
      renderMainNav('projects');
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });
      const project = await loadProject();
      const myRole = await getMyRole();
      if (project) render(project, isPricingRole(myRole));
    })();
  </script>
</body>
