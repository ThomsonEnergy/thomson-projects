            ${[['email', 'Email'], ['phone', 'Phone call'], ['in_person', 'In person']].map(([v, l], i) => `<label style="display:flex; align-items:center; gap:6px; margin:0; font-weight:400;"><input type="radio" name="ap-method" value="${v}" ${i === 0 ? 'checked' : ''} style="width:auto;" /> ${l}</label>`).join('')}
          </div>
          <div id="ap-email-wrap">
            <label style="margin-top:0;">The client's email${isApprove ? '' : ' (optional)'}</label>
            ${threads.length ? `<select id="ap-thread">${isApprove ? '' : '<option value="">No email</option>'}${threads.map(t => `<option value="${t.id}">${escapeHtml(t.subject || '(no subject)')}${t.last_message_at ? ' - ' + fmt(t.last_message_at) : ''}</option>`).join('')}</select>
              <p class="subtitle" style="margin:4px 0 0; font-size:12px;">Emails tagged to this ${project.job_number ? 'job or its quote' : 'quote'}. Not there? Tag it from the Inbox first.</p>`
            : `<p class="subtitle" style="margin:0;">No emails are tagged to this ${project.job_number ? 'job' : 'quote'} yet. Open the client's email in the Inbox, tag it to ${escapeHtml(projectRef(project))}, then come back.</p>`}
          </div>
          <label id="ap-note-label">${isApprove ? 'Note (who and when)' : 'Reason the client gave'}</label>
          <textarea id="ap-note" style="min-height:70px;" placeholder="${isApprove ? 'e.g. Jane Smith approved by phone, 19 Oct' : 'e.g. Went with another quote, price too high'}"></textarea>
          <div style="margin-top:14px;">
            <button type="button" id="ap-confirm" ${isApprove ? '' : 'class="danger"'}>${isApprove ? 'Mark approved' : 'Mark declined'}</button>
            <button type="button" class="secondary" id="ap-cancel">Cancel</button>
          </div>
          <div id="ap-msg"></div>
        </div>`;
      document.body.appendChild(overlay);
      const method = () => overlay.querySelector('input[name="ap-method"]:checked').value;
      const refresh = () => {
        const isEmail = method() === 'email';
        overlay.querySelector('#ap-email-wrap').style.display = isEmail || !isApprove ? '' : 'none';
        if (isApprove) overlay.querySelector('#ap-note-label').textContent = isEmail ? 'Note (optional)' : 'Note (who and when)';
      };
      overlay.querySelectorAll('input[name="ap-method"]').forEach(r => r.addEventListener('change', refresh));
      refresh();
      overlay.querySelector('#ap-cancel').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#ap-confirm').addEventListener('click', async () => {
        const msg = overlay.querySelector('#ap-msg');
        const m = method();
        const threadEl = overlay.querySelector('#ap-thread');
        const emailThreadId = (m === 'email' || !isApprove) && threadEl ? (threadEl.value || null) : null;
        const note = overlay.querySelector('#ap-note').value.trim();
        if (isApprove && m === 'email' && !emailThreadId) { msg.innerHTML = '<div class="error-box">Pick the client\'s email (tag it to this job from the Inbox first).</div>'; return; }
        if (isApprove && m !== 'email' && !note) { msg.innerHTML = '<div class="error-box">Add a note: who approved it and when.</div>'; return; }
        if (!isApprove && !note) { msg.innerHTML = '<div class="error-box">Add the reason the client gave.</div>'; return; }
        const btn = overlay.querySelector('#ap-confirm');
        btn.disabled = true; btn.textContent = 'Saving...';
        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          const isQuoteApprove = kind === 'quote' && isApprove;
          const res = await fetch(isQuoteApprove ? '/.netlify/functions/manually-approve-quote' : '/.netlify/functions/approval-actions', {
            method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
            body: JSON.stringify(isQuoteApprove
              ? { quoteId: project.id, method: m, note, emailThreadId }
              : { kind, id: kind === 'quote' ? project.id : entry.id, action: mode, method: m, note, reason: note, emailThreadId }),
          });
          const d = await res.json().catch(() => ({}));
          if (!res.ok || !d.ok) throw new Error(d.error || 'Could not save it');
          overlay.remove();
          await opts.onDone();
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
          btn.disabled = false; btn.textContent = isApprove ? 'Mark approved' : 'Mark declined';
        }
      });
    }

    // ---------- Valid until / Extend (migration 20261030000000) ----------
    const validUntilText = (d) => new Date(d + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
    const ymdPlus = (ymd, n) => { const d = new Date(ymd + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
    const sydneyYmd = () => new Date().toLocaleDateString('en-CA', { timeZone: 'Australia/Sydney' });

    // "Valid until 18 Nov 2026 · Extend... · [ ] Don't auto decline this one" for a quote or variation.
    // row: the quote or variation; key: 'quote' or the variation's id.
    function validUntilHtml(row, key, canEdit) {
      const open = row.status === 'sent' || row.approval_status === 'sent';
      const expired = row.expired && (row.status === 'declined' || row.approval_status === 'declined');
      if (!open && !expired) return '';
      const past = row.valid_until && row.valid_until < sydneyYmd();
      return `<div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-size:12px; margin:6px 0 0;">
        <span class="subtitle" style="font-size:12px;${expired || past ? ' color:var(--red);' : ''}">${row.valid_until ? (expired ? 'Expired ' : 'Valid until ') + validUntilText(row.valid_until) : 'No valid until date'}</span>
        ${canEdit ? `<button type="button" class="secondary vu-extend" data-key="${key}" style="font-size:11px; padding:3px 9px;">Extend...</button>` : ''}
        ${canEdit && open ? `<label style="display:flex; align-items:center; gap:5px; margin:0; font-weight:400; font-size:12px;"><input type="checkbox" class="vu-noauto" data-key="${key}" ${row.no_auto_decline ? 'checked' : ''} style="width:auto; margin:0;" /> Don't auto decline this one</label>` : ''}
      </div>`;
    }

    // Wires the Extend buttons and "Don't auto decline" boxes inside el. find(key) -> { kind, row }.
    function wireValidUntil(el, project, find, onDone, onlyKey) {
      const sel = (c) => onlyKey ? `${c}[data-key="${onlyKey}"]` : c;
      el.querySelectorAll(sel('.vu-extend')).forEach(b => b.addEventListener('click', () => { const f = find(b.dataset.key); openExtendPanel(f.kind, project, f.row, onDone); }));
      el.querySelectorAll(sel('.vu-noauto')).forEach(cb => cb.addEventListener('change', async () => {
        const f = find(cb.dataset.key);
        const { error } = await supabaseClient.from(f.kind === 'quote' ? 'projects' : 'job_variation_entries').update({ no_auto_decline: cb.checked }).eq('id', f.row.id);
        if (error) { alert(friendlyError(error)); cb.checked = !cb.checked; return; }
        f.row.no_auto_decline = cb.checked;
        await logActivity('project', project.id, 'auto_decline_changed', `${f.kind === 'quote' ? 'Quote' : 'Variation ' + (f.row.variation_number || '')}: auto decline turned ${cb.checked ? 'off' : 'on'}`);
      }));
    }

    // Extend a quote's or variation's valid until date (Sales, Admin, Finance). One that expired is
    // reopened. Optionally emails the client the new date with a fresh PDF.
    function openExtendPanel(kind, project, row, onDone) {
      const today = sydneyYmd();
      const from = row.valid_until && row.valid_until >= today ? row.valid_until : today;
      const what = kind === 'quote' ? (project.quote_number ? `quote Q${project.quote_number}` : 'this quote') : `Variation ${row.variation_number || ''}`.trim();
      const overlay = openModal(`
          <h2>Extend ${escapeHtml(what)}</h2>
          <p class="subtitle" style="margin-bottom:10px;">${row.valid_until ? (row.expired ? 'Expired ' : 'Valid until ') + validUntilText(row.valid_until) : 'No valid until date yet'}.${row.expired ? ' Extending it reopens it, so the client can accept it again.' : ''}</p>
          <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;">
            ${[7, 14, 30].map(n => `<button type="button" class="secondary ex-plus" data-n="${n}" style="font-size:12px; padding:5px 10px;">+${n} days</button>`).join('')}
          </div>
          <label style="margin-top:0;">New valid until date</label>
          <input type="date" id="ex-date" min="${today}" value="${ymdPlus(from, 14)}" />
          <label style="display:flex; align-items:center; gap:8px; margin-top:12px; font-weight:400;"><input type="checkbox" id="ex-email" style="width:auto;" /> Email the client the new date</label>
          <div style="margin-top:14px;"><button type="button" id="ex-save">Extend</button> <button type="button" class="secondary" id="ex-cancel">Cancel</button></div>
          <div id="ex-msg"></div>`, { maxWidth: 440, zIndex: 110 });
      overlay.querySelectorAll('.ex-plus').forEach(b => b.addEventListener('click', () => { overlay.querySelector('#ex-date').value = ymdPlus(from, Number(b.dataset.n)); }));
      overlay.querySelector('#ex-cancel').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#ex-save').addEventListener('click', async () => {
        const msg = overlay.querySelector('#ex-msg');
        const validUntil = overlay.querySelector('#ex-date').value;
        if (!validUntil || validUntil < today) { msg.innerHTML = '<div class="error-box">Pick a date from today on.</div>'; return; }
        const btn = overlay.querySelector('#ex-save');
        btn.disabled = true; btn.textContent = 'Saving...';
        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          const res = await fetch('/.netlify/functions/approval-actions', {
            method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
            body: JSON.stringify({ kind, id: row.id, action: 'extend', validUntil }),
          });
          const d = await res.json().catch(() => ({}));
          if (!res.ok || !d.ok) throw new Error(d.error || 'Could not extend it');
          const wantEmail = overlay.querySelector('#ex-email').checked;
          overlay.remove();
          if (wantEmail) await emailExtension(kind, project, { ...row, valid_until: validUntil });
          await onDone();
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
          btn.disabled = false; btn.textContent = 'Extend';
        }
      });
    }

    // Tells the client the new valid until date: a fresh PDF attached and the accept / sign button.
    async function emailExtension(kind, project, row) {
      const first = String(project.client_name || '').trim().split(/\s+/)[0] || 'there';
      const dateText = new Date(row.valid_until + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });
      try {
        if (kind === 'quote') {
          await generateClientPdf('quote', project.id);
          const { data: fresh } = await supabaseClient.from('projects').select('quote_pdf_path').eq('id', project.id).single();
          const qLabel = project.quote_number ? `Q${project.quote_number}` : '';
          openEmailComposer({
            title: `Email the new date for ${qLabel || 'the quote'}`, to: project.client_email || '',
            subject: `Quote ${qLabel}: ${project.name} - now valid until ${dateText}`.replace('Quote :', 'Quote:'),
            body: `Hi ${first},\n\nJust letting you know we've extended your quote for ${project.name}. It is now valid until ${dateText}.\n\nThe updated quote is attached, and you can accept it online with the button below.\n\nLet me know if you have any questions.`,
            projectId: project.id, tagKind: 'client',
            quoteLink: project.quote_token ? { url: `${shareOrigin()}/quote.html?token=${project.quote_token}`, label: 'Include a button to view and accept the quote online', checked: true } : undefined,
            attachOptions: fresh?.quote_pdf_path ? [{ group: 'Quote', label: 'Quote PDF', bucket: 'project-documents', path: fresh.quote_pdf_path, name: `${projectRef(project)} - Quote.pdf`, checked: true }] : [],
            onSent: async () => { await logActivity('project', project.id, 'quote_emailed', `New valid until date (${dateText}) emailed to the client`); },
          });
        } else {
          const pdfPath = await makeVariationPdf(row.id);
          const vName = `Variation ${row.variation_number || ''}`.trim();
          const fileName = `${projectRef(project)} - ${vName}.pdf`;
          openEmailComposer({
            title: `Email the new date for ${vName}`, to: project.client_email || '',
            subject: `${vName} for approval - ${projectRef(project)}: now valid until ${dateText}`,
            body: `Hi ${first},\n\nJust letting you know we've extended ${vName} (${row.description}). It is now valid until ${dateText}.\n\nIt is attached, and you can approve it by signing online at the link below.\n\nLet me know if you have any questions.`,
            projectId: project.id, tagKind: 'client',
            quoteLink: { url: `${shareOrigin()}/quote.html?variation=${row.variation_token}`, label: 'Include a button to view and sign the variation online', buttonText: 'Click to view and sign your variation', checked: true },
            attachOptions: [{ group: 'Variation', label: fileName, bucket: 'project-documents', path: pdfPath, name: fileName, checked: true }],
            onSent: async () => { await logActivity('project', project.id, 'variation_sent', `${vName}: new valid until date (${dateText}) emailed to the client`); },
          });
        }
      } catch (err) {
        alert('Extended, but the email could not be set up: ' + friendlyError(err));
      }
    }

    // Reopens a declined quote (back to Sent) or variation (back to Draft).
    async function reopenDeclined(kind, id, onDone) {
      if (!confirm(kind === 'quote' ? 'Reopen this quote? It goes back to Sent and the client can accept it again.' : 'Reopen this variation? It goes back to Draft so you can edit and resend it.')) return;
      const { data: { session } } = await supabaseClient.auth.getSession();
      const res = await fetch('/.netlify/functions/approval-actions', {
        method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ kind, id, action: 'reopen' }),
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok || !d.ok) { alert(d.error || 'Could not reopen it'); return; }
      await onDone();
    }

    // How a quote or variation was approved / declined, for the job page. row: the quote or variation.
    function approvalProofHtml(row) {
      const METHOD = { email: 'by email', phone: 'by phone call', in_person: 'in person', online: 'online' };
      const dt = (d) => new Date(d).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });
      const emailLink = row.approval_email_thread_id ? ` <a class="link-quiet" href="/inbox.html?thread=${row.approval_email_thread_id}">View the email</a>` : '';
      if (row.declined_at && row.expired) return `Expired: not accepted by ${row.valid_until ? validUntilText(row.valid_until) : 'its valid until date'}. Extend it to reopen it.`;
      if (row.declined_at) return `Declined ${row.declined_by ? '(marked by us)' : 'by the client online'} on ${dt(row.declined_at)}${row.decline_reason ? ': ' + escapeHtml(row.decline_reason) : ''}.${emailLink}`;
      if (row.approval_method && row.approval_method !== 'online') return `Approved ${METHOD[row.approval_method] || ''}${row.approved_at ? ' on ' + dt(row.approved_at) : ''}${row.approval_note ? ' - ' + escapeHtml(row.approval_note) : ''}.${emailLink}`;
      return '';
    }

    async function loadVariations(projectId) {
      const listEl = document.getElementById('variation-records-list');
      const [{ data: variations, error }, { data: staff }] = await Promise.all([
        supabaseClient.from('variations').select('*').eq('project_id', projectId).order('created_at', { ascending: false }),
        supabaseClient.from('profiles').select('id, full_name'),
      ]);
      if (error) { listEl.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(error))}</div>`; return; }
      if (!variations.length) { listEl.innerHTML = `<p class="subtitle">No variations recorded.</p>`; return; }

      listEl.innerHTML = variations.map(v => {
        const who = (staff || []).find(s => s.id === v.created_by)?.full_name || 'Someone';
        const isSigned = v.status === 'signed';
        return `
          <div style="border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin-bottom:10px;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;">
              <div>
                ${isSigned ? `<span class="badge accepted">Signed</span>` : `<span class="badge draft">Quick note</span>`}
                <span style="margin-left:6px; font-weight:600; color:${Number(v.total_delta) >= 0 ? 'var(--green)' : 'var(--red)'};">${Number(v.total_delta) >= 0 ? '+' : ''}${money(v.total_delta)}</span>
              </div>
              <p class="subtitle" style="margin:0; font-size:12px;">${escapeHtml(who)} &middot; ${new Date(v.created_at).toLocaleDateString('en-AU')}</p>
            </div>
            <p style="margin:8px 0 0;">${escapeHtml(v.description)}</p>
            <div style="margin-top:8px; font-size:13px;">
              ${(v.changes || []).map(c => `<div class="subtitle">${escapeHtml(c.cost_centre_name)}: ${money(c.old_amount)} &rarr; ${money(c.new_amount)}</div>`).join('')}
            </div>
            ${isSigned ? `<p class="subtitle" style="margin-top:8px;">Signed by ${v.signed_by_name} on ${new Date(v.signed_at).toLocaleDateString('en-AU')}</p>` : ''}
          </div>`;
      }).join('');
    }

    // Shared by the quote-stage and job-handover compliance panels - runs
    // check-solar-compliance.js for the given phase, shows what's missing,
    // and offers to turn the gaps into job_tasks via generate-solar-tasks.js
    // (see those functions for what's actually deterministic vs AI-worded).
    // runComplianceCheck(projectId, phase, taskType, btnEl, resultEl) is shared: js/supabase-client.js

    // Sales-facing "documents to gather from the customer" checklist -
    // separate from the automatic Pylon/system checks above. Same
    // yes/no + conditional-photo item shape as the site inspection
    // checklists (see site-inspection.html), just scoped to
    // checklist_type 'quote_compliance' and answered here inline rather
    // than via a scheduled site visit - it's a conversation with the
    // customer, not a trip.
    async function loadQuoteComplianceChecklist(project) {
      const containerEl = document.getElementById('quote-doc-checklist');
      if (!containerEl) return;

      const { data: template } = await supabaseClient.from('inspection_checklist_templates')
        .select('id, name').eq('checklist_type', 'quote_compliance').eq('active', true).order('sort_order').limit(1).maybeSingle();
      if (!template) {
        containerEl.innerHTML = `<p class="subtitle">No document checklist set up yet - add one under Settings &gt; Inspection Checklists.</p>`;
        return;
      }

      const [{ data: itemsData }, { data: answersData }] = await Promise.all([
        supabaseClient.from('inspection_checklist_items').select('*').eq('template_id', template.id).order('sort_order'),
        supabaseClient.from('quote_compliance_answers').select('*').eq('project_id', project.id),
      ]);
      const items = itemsData || [];
      const answers = {};
      (answersData || []).forEach(a => { answers[a.item_id] = a; });
      // An item holds several files (a multi-page bill, a consent form): photo_paths, with
      // photo_path kept as the first for older rows and readers.
      const filesOf = (a) => Array.isArray(a?.photo_paths) && a.photo_paths.length ? a.photo_paths : (a?.photo_path ? [a.photo_path] : []);
      const isPdfUrl = (u) => /\.pdf(\?|$)/i.test(u);
      const isBillItem = (it) => it.item_type === 'photo' && /electricity bill/i.test(it.label || '');
      if (['solar', 'battery'].includes(project.proposal_template)) await loadBillDocs(project.id);

      function itemsVisible() {
        return items.filter(it => {
          if (!it.parent_item_id) return true;
          const parentAnswer = answers[it.parent_item_id];
          if (!parentAnswer || parentAnswer.answer_yes_no === null || parentAnswer.answer_yes_no === undefined) return false;
          return parentAnswer.answer_yes_no === it.show_when_parent_answer;
        });
      }

      async function saveAnswer(itemId, fields) {
        const { data: { user } } = await supabaseClient.auth.getUser();
        const row = { project_id: project.id, item_id: itemId, answered_by: user?.id || null, answered_at: new Date().toISOString(), ...fields };
        const { data, error } = await supabaseClient.from('quote_compliance_answers').upsert(row, { onConflict: 'project_id,item_id' }).select().single();
        if (error) throw error;
        answers[itemId] = data;
      }

      function renderChecklist() {
        const visible = itemsVisible();
        containerEl.innerHTML = visible.map(it => {
          const a = answers[it.id];
          const isChild = !!it.parent_item_id;
          const files = filesOf(a);
          const billPages = isBillItem(it) ? billDocs.length : 0;
          const answered = it.item_type === 'photo' ? (files.length > 0 || billPages > 0) : (a?.answer_yes_no !== null && a?.answer_yes_no !== undefined);
          return `
          <div class="${isChild ? 'insp-child' : ''}">
            <div class="insp-item ${answered ? 'answered' : ''}" data-item-id="${it.id}">
              <div class="insp-label">${escapeHtml(it.label)}${it.required ? '' : ' <span class="subtitle">(optional)</span>'}</div>
              ${it.description ? `<div class="insp-desc">${escapeHtml(it.description)}</div>` : ''}
              ${it.item_type === 'yes_no' ? `
                <button type="button" class="insp-yn-btn yn-yes ${a?.answer_yes_no === true ? 'selected' : ''}">Yes</button>
                <button type="button" class="insp-yn-btn secondary yn-no ${a?.answer_yes_no === false ? 'selected' : ''}">No</button>
              ` : `
                ${files.map((u, i) => isPdfUrl(u) ? `<a class="link-quiet" href="${escapeHtml(u)}" target="_blank" rel="noopener" style="display:inline-block; margin:0 8px 6px 0; font-size:12px;">PDF ${i + 1} &rarr;</a>` : `<img class="insp-photo-thumb insp-photo-view" data-i="${i}" src="${escapeHtml(u)}" style="cursor:pointer;" />`).join('')}
                ${billPages ? `<p class="subtitle" style="font-size:12px; margin:0 0 6px;">&#10003; ${billPages} page${billPages === 1 ? '' : 's'} filed on step 1 (Pre-quote information)${project.bill_reading ? ', read by AI' : ', not read by AI yet'}.</p>` : ''}
                <label class="btn ${files.length ? 'secondary' : ''} insp-photo-btn">&#128247; ${files.length ? 'Add more pages or files' : 'Add photos or PDF (every page)'}<input type="file" class="insp-photo-file" accept="image/*,.pdf" multiple style="display:none;" /></label>
                ${files.length ? `<button type="button" class="secondary insp-photo-clear" style="font-size:11px; padding:3px 8px; margin-left:6px;">Clear files</button>` : ''}
              `}
              <div class="insp-item-msg"></div>
            </div>
          </div>`;
        }).join('');

        containerEl.querySelectorAll('.insp-item').forEach(el => {
          const itemId = el.dataset.itemId;
          const msgEl = el.querySelector('.insp-item-msg');

          el.querySelectorAll('.yn-yes, .yn-no').forEach(btn => {
            btn.addEventListener('click', async () => {
              try { await saveAnswer(itemId, { answer_yes_no: btn.classList.contains('yn-yes') }); renderChecklist(); }
              catch (err) { msgEl.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`; }
            });
          });

          const imgs = [...el.querySelectorAll('.insp-photo-view')];
          imgs.forEach((img, i) => img.addEventListener('click', () => openPhotoLightbox(imgs.map(x => x.src), i)));
          const clearBtn = el.querySelector('.insp-photo-clear');
          if (clearBtn) clearBtn.addEventListener('click', async () => {
            if (!confirm('Remove every file on this item?')) return;
            try { await saveAnswer(itemId, { photo_path: null, photo_paths: [] }); renderChecklist(); }
            catch (err) { msgEl.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`; }
          });

          const fileInput = el.querySelector('.insp-photo-file');
          const photoBtn = el.querySelector('.insp-photo-btn');
          if (fileInput) {
            fileInput.addEventListener('change', async () => {
              if (!fileInput.files.length) return;
              fileInput.disabled = true;
              photoBtn.classList.add('is-loading');
              msgEl.innerHTML = `<p class="subtitle">Uploading...</p>`;
              try {
                const urls = await uploadPhotos(fileInput.files, `quote-compliance/${project.id}`, 'site-photos');
                const all = [...filesOf(answers[itemId]), ...urls];
                await saveAnswer(itemId, { photo_path: all[0] || null, photo_paths: all });
                renderChecklist();
              } catch (err) {
                msgEl.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
                fileInput.disabled = false;
                photoBtn.classList.remove('is-loading');
              }
            });
          }
        });
      }

      renderChecklist();
    }

    // ---------- Emails tab: conversations tagged to this job, and emailing from the job ----------
    async function jobEmailAttachOptions(project, withQuote) {
      const opts = [];
      if (project.quote_pdf_path) opts.push({ group: 'Quote', label: 'Quote PDF', bucket: 'project-documents', path: project.quote_pdf_path, name: `${projectRef(project)} - Quote.pdf`, checked: !project.job_number || !!withQuote });
      const { data: docs } = await supabaseClient.from('project_documents').select('folder, file_path, file_name').eq('project_id', project.id).order('created_at', { ascending: false });
      (docs || []).forEach(d => opts.push({ group: 'Job documents - ' + d.folder, label: d.file_name, bucket: 'project-documents', path: d.file_path, name: d.file_name }));
      return opts;
    }

    async function openJobEmailComposer(project, reply, opts) {
      const first = String(project.client_name || '').trim().split(/\s+/)[0] || 'there';
      const withQuote = !!(opts && opts.withQuote);
      const isQuote = !project.job_number || withQuote;
      const qNumber = project.quote_number || (project.source_quote && project.source_quote.quote_number) || '';
      openEmailComposer({
        title: reply ? 'Reply' : 'Email about ' + projectRef(project),
        to: reply ? reply.to : (project.client_email || ''),
        subject: reply ? reply.subject : (isQuote ? `Quote${qNumber ? ' Q' + qNumber : ''}: ${project.name}` : projectRef(project)),
        body: reply ? '' : (isQuote ? `Hi ${first},\n\nPlease find the quote for ${project.name} attached.\n\nLet me know if you have any questions.` : `Hi ${first},\n\n`),
        replyToThreadId: reply ? reply.threadId : undefined,
        projectId: project.id, tagKind: 'client',
        reviewRequest: (!isQuote && !reply) ? { projectId: project.id, clientName: project.client_name, clientEmail: project.client_email } : undefined,
        quoteLink: (isQuote && project.quote_token) ? { url: `${shareOrigin()}/quote.html?token=${project.quote_token}`, label: 'Include a button to view and accept the quote online' } : undefined,
        attachOptions: await jobEmailAttachOptions(project, withQuote),
        onSent: async () => {
          // Only moves a quote still at draft_quote, so re-sending can't push it backwards.
          if (isQuote && !reply && !project.job_number) {
            await supabaseClient.from('projects').update({ pipeline_stage: 'quote_sent' }).eq('id', project.id).eq('pipeline_stage', 'draft_quote');
            await logActivity('project', project.id, 'quote_emailed', `Quote${project.quote_number ? ' Q' + project.quote_number : ''} emailed to the client`);
          }
          await loadJobEmails(project);
        },
      });
    }

    // Who replied or who is handling a tagged conversation (email_threads.assigned_to), same
    // wording as the Inbox. Null when there is nothing to say.
    let jobEmailStaff = null, jobEmailMe = null;
    function jobThreadStatus(t, last) {
      const name = (id) => (id === jobEmailMe ? 'You' : ((jobEmailStaff || []).find(s => s.id === id) || {}).full_name || 'A team member');
      if (t.is_done) return { colour: 'var(--muted)', text: 'Done' };
      const claimed = t.assigned_to ? `${name(t.assigned_to)} ${t.assigned_to === jobEmailMe ? 'are' : 'is'} on it` : '';
      if (last && last.direction === 'outbound') {
        const by = last.created_by ? `${name(last.created_by)} replied` : 'Replied from Gmail';
        return { colour: 'var(--green)', text: `${by} ${jobEmailAgo(last.sent_at)}${t.section === 'priority' ? ', waiting on them' : ''}${t.assigned_to && t.assigned_to !== last.created_by ? ', ' + claimed.replace('You are', 'you are') : ''}` };
      }
      if (t.assigned_to) return { colour: '#e0a526', text: `${claimed.replace('You are', "You're")}${t.assigned_at ? ' (claimed ' + jobEmailAgo(t.assigned_at) + ')' : ''}` };
      if (t.section === 'priority' && t.last_direction === 'inbound') return { colour: 'var(--red)', text: 'Nobody has replied yet' };
      return null;
    }
    function jobEmailAgo(d) {
      const mins = Math.floor((Date.now() - new Date(d).getTime()) / 60000);
      if (mins < 60) return `${Math.max(mins, 0)}m ago`;
      if (mins < 1440) return `${Math.floor(mins / 60)}h ago`;
      return `${Math.floor(mins / 1440)}d ago`;
    }

    async function loadJobEmails(project) {
      const el = document.getElementById('job-emails-list');
      if (!el) return;
      const { data: links, error } = await supabaseClient.from('email_job_links')
        .select('id, kind, note, thread_id, email_threads(id, subject, last_message_at, last_direction, section, is_done, assigned_to, assigned_at)').eq('project_id', project.id);
      if (error) { el.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(error))}</div>`; return; }
      if (!jobEmailStaff) {
        const [{ data: staff }, { data: { user } }] = await Promise.all([supabaseClient.from('profiles').select('id, full_name, active').order('full_name'), supabaseClient.auth.getUser()]);
        jobEmailStaff = staff || []; jobEmailMe = user ? user.id : null;
      }
      const ids = (links || []).map(l => l.thread_id);
      let msgs = [];
      if (ids.length) ({ data: msgs } = await supabaseClient.from('emails').select('id, thread_id, direction, from_address, to_addresses, attachments, sent_at, created_by').in('thread_id', ids).order('sent_at', { ascending: false }));
      const byThread = {}; (msgs || []).forEach(m => { (byThread[m.thread_id] ||= []).push(m); });
      // Item 104: only the newest message per thread shows a snippet, so only its body is fetched.
      const newestIds = Object.values(byThread).map(list => list[0].id);
      if (newestIds.length) {
        const { data: bodies } = await supabaseClient.from('emails').select('id, body_text').in('id', newestIds);
        const bodyById = Object.fromEntries((bodies || []).map(b => [b.id, b.body_text]));
        Object.values(byThread).forEach(list => { list[0].body_text = bodyById[list[0].id] || ''; });
      }
      const sorted = (links || []).slice().sort((a, b) => String(b.email_threads?.last_message_at).localeCompare(String(a.email_threads?.last_message_at)));
      // review requests sent from this job, and what came back
      const { data: reviews } = await supabaseClient.from('review_requests').select('id, client_name, rating, comment, submitted_at, google_clicked_at, created_at').eq('project_id', project.id).order('created_at', { ascending: false });
      const reviewsHtml = (reviews || []).map(r => `<div class="card" style="margin:0 0 10px; border-color:${r.submitted_at ? '#f5b301' : 'var(--border)'};">
          <strong>Review request</strong> <span class="subtitle" style="font-size:12px;">sent ${new Date(r.created_at).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })}</span>
          ${r.submitted_at
            ? `<div style="font-size:20px; color:#f5b301; margin-top:4px;">${'&#9733;'.repeat(r.rating)}<span style="color:var(--muted);">${'&#9733;'.repeat(5 - r.rating)}</span></div>
               ${r.comment ? `<p style="margin:4px 0 0; white-space:pre-wrap;">${escapeHtml(r.comment)}</p>` : ''}
               <p class="subtitle" style="margin:4px 0 0; font-size:12px;">Answered ${new Date(r.submitted_at).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })}${r.google_clicked_at ? ' - went on to the Google review page' : ''}</p>`
            : '<p class="subtitle" style="margin:4px 0 0;">Waiting for their answer.</p>'}
        </div>`).join('');
      if (!sorted.length) { el.innerHTML = reviewsHtml + '<p class="subtitle">No emails on this job yet. Use "Email the client" or tag one from the Inbox.</p>'; return; }
      const ctx = { fetchAttachment: fetchEmailAttachment, fetchStored: fetchStoredAttachment };
      el.innerHTML = reviewsHtml + sorted.map(l => {
        const thread = l.email_threads || {}; const list = byThread[l.thread_id] || [];
        const last = list[0];
        const atts = list.flatMap(m => (m.attachments || []).filter(a => !(a.inline && a.cid)).map(a => ({ m, a })));
        const snippet = last ? String(last.body_text || '').replace(/\s+/g, ' ').trim().slice(0, 180) : '';
        const out = last && last.direction === 'outbound';
        const st = jobThreadStatus(thread, last);
        const others = (jobEmailStaff || []).filter(s => s.active && s.id !== thread.assigned_to);
        return `<div class="card" style="margin:0 0 10px;" data-link="${l.id}">
          <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;">
            <div style="min-width:0;"><strong>${escapeHtml(thread.subject || '(no subject)')}</strong>
              <span style="font-size:11px; padding:2px 8px; border:1px solid var(--accent); border-radius:20px; margin-left:6px;">${EMAIL_KINDS[l.kind] || 'Other'}</span></div>
            <span class="subtitle" style="margin:0; font-size:12px;">${thread.last_message_at ? new Date(thread.last_message_at).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }) : ''}</span>
          </div>
          <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:6px; font-size:12px;">
            ${st ? `<span style="color:${st.colour}; font-weight:700;">${escapeHtml(st.text)}</span>` : ''}
            <select class="job-email-assign" data-t="${thread.id}" style="width:auto; font-size:12px; padding:3px 8px;" title="Who is handling this conversation">
              <option value="">${thread.assigned_to ? 'Nobody (unassign)' : 'Assign to...'}</option>
              ${others.map(s => `<option value="${s.id}">${s.id === jobEmailMe ? 'Me' : escapeHtml(s.full_name || '')}</option>`).join('')}
            </select>
          </div>
          ${l.note ? `<p class="subtitle" style="margin:4px 0 0;">Note: ${escapeHtml(l.note)}</p>` : ''}
          ${last ? `<p class="subtitle" style="margin:6px 0 0; font-size:12px;">${out ? 'Last sent to ' + escapeHtml((last.to_addresses || [])[0] || 'unknown') : 'Last received from ' + escapeHtml(String(last.from_address || '').replace(/<.*>/, '').trim() || 'unknown')}: ${escapeHtml(snippet)}${snippet.length >= 180 ? '...' : ''}</p>` : ''}
          ${atts.length ? `<div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;">${atts.map((x, i) => `<button type="button" class="secondary job-email-att" data-t="${l.thread_id}" data-i="${i}" style="font-size:12px; padding:4px 10px;">&#128206; ${escapeHtml(x.a.name)}</button>`).join('')}</div>` : ''}
          <div style="display:flex; gap:6px; flex-wrap:wrap; margin-top:10px;">
            <a class="btn secondary" href="/inbox.html?thread=${l.thread_id}" style="font-size:12px; padding:5px 10px;">Open conversation</a>
            <button type="button" class="secondary job-email-reply" data-link="${l.id}" style="font-size:12px; padding:5px 10px;">Reply</button>
            <button type="button" class="secondary job-email-untag" data-link="${l.id}" style="font-size:12px; padding:5px 10px;">Remove from job</button>
          </div></div>`;
      }).join('');
      sorted.forEach(l => { l._atts = (byThread[l.thread_id] || []).flatMap(m => (m.attachments || []).filter(a => !(a.inline && a.cid)).map(a => ({ m, a }))); });
      el.querySelectorAll('.job-email-att').forEach(btn => btn.addEventListener('click', async () => {
        const l = sorted.find(x => x.thread_id === btn.dataset.t); const x = l._atts[Number(btn.dataset.i)];
        const original = btn.innerHTML; btn.disabled = true; btn.textContent = 'Opening...';
        await emailOpenAttachment(x.m.id, x.a, ctx);
        btn.disabled = false; btn.innerHTML = original;
      }));
      el.querySelectorAll('.job-email-reply').forEach(btn => btn.addEventListener('click', () => {
        const l = sorted.find(x => x.id === btn.dataset.link); const list = byThread[l.thread_id] || [];
        const inbound = list.find(m => m.direction === 'inbound') || list[0];
        openJobEmailComposer(project, { threadId: l.thread_id, subject: (l.email_threads && l.email_threads.subject) || '', to: emailAddressOnly(inbound && inbound.direction === 'inbound' ? inbound.from_address : ((inbound && inbound.to_addresses) || [])[0]) });
      }));
      el.querySelectorAll('.job-email-untag').forEach(btn => btn.addEventListener('click', async () => {
        if (!confirm('Take this email off the job? The email itself is not deleted.')) return;
        await supabaseClient.from('email_job_links').delete().eq('id', btn.dataset.link);
        loadJobEmails(project);
      }));
      el.querySelectorAll('.job-email-assign').forEach(sel => sel.addEventListener('change', async () => {
        try { await emailAction('assign', { thread_id: sel.dataset.t, user_id: sel.value || null }); } catch (err) { alert(friendlyError(err)); }
        loadJobEmails(project);
      }));
    }

    function initJobEmails(project) {
      const tab = document.querySelector('#job-tabs .settings-tab[data-panel="emails"]');
      if (!tab) return;
      let loaded = false;
      const load = () => { if (!loaded) { loaded = true; loadJobEmails(project); } };
      tab.addEventListener('click', load);
      document.getElementById('job-email-new-btn').addEventListener('click', () => openJobEmailComposer(project));
      document.getElementById('job-email-tag-btn').addEventListener('click', () => openTagEmailModal({ projectId: project.id, onSaved: () => loadJobEmails(project) }));
    }

    // ---------- STCs (job_stcs, migration 147) ----------
    // One row per Formbay job. Sale details come from an imported Formbay payment advice (STCs page) or
    // are typed in here. The quote's STC count (stage calculator) is offered when adding the first row.
    function initJobStcs(project, centres) {
      const tab = document.querySelector('#job-tabs .settings-tab[data-panel="stcs"]');
      if (!tab) return;
      let loaded = false;
      const load = () => { if (!loaded) { loaded = true; loadJobStcs(project, centres); } };
      tab.addEventListener('click', load);
      document.getElementById('job-stc-add-btn').addEventListener('click', async () => {
        if (!loaded) { loaded = true; await loadJobStcs(project, centres); }
        openJobStcForm(project, centres, null);
      });
    }

    let jobStcSettings = null;
    let jobStcRows = [];

    async function loadJobStcs(project, centres) {
      const el = document.getElementById('job-stcs-list');
      const [r, s] = await Promise.all([
        supabaseClient.from('job_stcs').select('*, formbay_payment_advice_lines(*, formbay_payment_advices(reference_no, advice_date, units, fee_ex_gst))').eq('project_id', project.id).order('created_at'),
        jobStcSettings ? Promise.resolve({ data: jobStcSettings }) : supabaseClient.from('company_settings').select('stc_expected_sale_price, stc_fee_per_certificate').limit(1).maybeSingle(),
      ]);
      if (r.error) { el.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(r.error))}</div>`; return; }
      jobStcSettings = s.data || { stc_expected_sale_price: 39.25, stc_fee_per_certificate: 1 };
      jobStcRows = r.data || [];
      // The quote's own counts (item 27), else worked back from the stages for older jobs.
      const quoteCount = Number(project.stc_quantity) > 0 ? Math.round(Number(project.stc_quantity)) : centres.reduce((n, c) => n + stcCountForStage(c), 0);
      const quoteBstcCount = Number(project.bstc_quantity) > 0 ? Math.round(Number(project.bstc_quantity)) : 0;
      const quoteLine = [quoteCount ? `${quoteCount} STCs` : '', quoteBstcCount ? `${quoteBstcCount} BSTCs` : ''].filter(Boolean).join(' and ');
      const sm8Box = sm8StcsBox(project, centres);
      const wireSm8 = () => el.querySelectorAll('.job-stc-sm8-add').forEach(b => b.addEventListener('click', () => {
        const x = project.sm8_stcs[Number(b.dataset.i)];
        openJobStcForm(project, centres, null, { stc_type: x.type, stc_count: x.count, booked_price: x.price, notes: `From ServiceM8 job #${project.sm8_job_number || ''}: ${x.label || ''}`.trim() });
      }));
      if (!jobStcRows.length) {
        el.innerHTML = `${sm8Box}<p class="subtitle">No STCs recorded on this job yet.${quoteLine ? ` The quote credited ${quoteLine}; press + Add STCs to start tracking them (one row for the solar STCs, one for the battery BSTCs).` : ''}</p><div id="job-stc-form"></div>`;
        wireSm8();
        return;
      }
      const tot = { count: 0, booked: 0, net: 0, gain: 0 };
      const body = jobStcRows.map(row => {
        const f = stcFigures(row, row.formbay_payment_advice_lines, jobStcSettings);
        tot.count += f.count; tot.booked += f.booked; tot.net += f.net; tot.gain += f.gain;
        const paidFrom = (row.formbay_payment_advice_lines || []).map(l => l.formbay_payment_advices?.reference_no).filter(Boolean);
        const basis = f.basis === 'paid' ? `paid, advice ${paidFrom.map(escapeHtml).join(', ')}` : f.basis === 'entered' ? 'sale price entered' : `expected at ${money(jobStcSettings.stc_expected_sale_price)}`;
        return `<tr>
          <td data-label="Type">${STC_TYPES[row.stc_type] || row.stc_type}${row.commercial ? ' <span class="subtitle" style="font-size:11px;">commercial</span>' : ''}</td>
          <td data-label="Formbay ID">${escapeHtml(row.formbay_job_id || '-')}</td>
          <td class="num" data-label="STCs">${f.count}${f.basis === 'paid' && f.units !== f.count ? `<div class="subtitle" style="font-size:11px; color:var(--red);">${f.units} paid</div>` : ''}</td>
          <td class="num" data-label="Credited">${money(f.booked)}<div class="subtitle" style="font-size:11px;">at ${money(row.booked_price)}</div></td>
          <td data-label="Status"><span class="badge ${row.status === 'paid' ? 'accepted' : row.status === 'sold' ? 'sent' : 'draft'}">${stcStatusLabel(row.status)}</span></td>
          <td class="num" data-label="Sale">${money(f.sale)}<div class="subtitle" style="font-size:11px;">${money(f.pricePer)}/STC, ${basis}</div></td>
          <td class="num" data-label="Fee">${money(f.fee)}</td>
          <td class="num" data-label="Net">${money(f.net)}</td>
          <td class="num" data-label="Gain"><span style="color:var(${f.gain >= 0 ? '--green' : '--red'});">${money(f.gain)}</span>${f.basis !== 'expected' && Math.abs(f.variance) >= 0.01 ? `<div class="subtitle" style="font-size:11px;">${f.variance >= 0 ? '+' : ''}${money(f.variance)} vs expected</div>` : ''}</td>
          <td data-label=""><button type="button" class="secondary job-stc-edit" data-id="${row.id}" style="font-size:12px; padding:4px 8px;">Edit</button></td>
        </tr>`;
      }).join('');
      el.innerHTML = `${sm8Box}
        <table class="responsive-stack">
          <thead><tr><th>Type</th><th>Formbay ID</th><th class="num">STCs</th><th class="num">Credited</th><th>Status</th><th class="num">Sale</th><th class="num">Fee</th><th class="num">Net</th><th class="num">Gain</th><th></th></tr></thead>
          <tbody>${body}</tbody>
          ${jobStcRows.length > 1 ? `<tfoot><tr><td colspan="2"><strong>Total</strong></td><td class="num">${tot.count}</td><td class="num">${money(tot.booked)}</td><td colspan="3"></td><td class="num">${money(tot.net)}</td><td class="num">${money(tot.gain)}</td><td></td></tr></tfoot>` : ''}
        </table>
        ${quoteLine && (quoteCount + quoteBstcCount) !== tot.count ? `<p class="subtitle" style="margin-top:8px;">The quote credited ${quoteLine}; ${tot.count} are recorded here.</p>` : ''}
        <div id="job-stc-form"></div>`;
      el.querySelectorAll('.job-stc-edit').forEach(b => b.addEventListener('click', () => openJobStcForm(project, centres, jobStcRows.find(x => x.id === b.dataset.id))));
      wireSm8();
    }

    // Jobs brought across from ServiceM8 (sm8-import-jobs.js) arrive with
    // their STCs listed but not applied (projects.sm8_stcs). This lists them
    // with an Add button that opens the normal STC form prefilled, and shows
    // how much of their value is on the stages' STC credit so far (set in
    // Edit stages). It drops away once every type has been recorded here.
    function sm8StcsBox(project, centres) {
      const list = Array.isArray(project.sm8_stcs) ? project.sm8_stcs : [];
      if (!list.length) return '';
      const labels = { pv: 'solar STCs', bstc: 'battery STCs', swh: 'hot water STCs' };
      const pending = list.map((x, i) => ({ ...x, i, recorded: jobStcRows.some(r => r.stc_type === x.type) })).filter(x => !x.recorded);
      const sm8Total = list.reduce((s, x) => s + (Number(x.total) || 0), 0);
      const stageCredit = (Number(project.stc_total) || 0) + (Number(project.bstc_total) || 0) || centres.reduce((s, c) => s + (Number(c.stc_total) || 0), 0);
      const creditDone = stageCredit >= sm8Total - 0.01;
      if (!pending.length && creditDone) return '';
      return `
        <div style="margin-bottom:12px; padding:12px 14px; border:1px solid var(--accent); border-radius:8px; background:var(--accent-dim);">
          <strong>STCs from ServiceM8 to enter</strong>
          <p class="subtitle" style="margin:4px 0 8px;">This job came across from ServiceM8 #${escapeHtml(project.sm8_job_number || '')} without its STCs applied. Add each one here, and set the stage's STC credit in Edit stages.</p>
          ${pending.map(x => `<div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:6px;">
            <span>${x.count} ${labels[x.type] || 'STCs'} at ${money(x.price)} = ${money(x.total)}</span>
            <button type="button" class="secondary job-stc-sm8-add" data-i="${x.i}" style="font-size:12px; padding:4px 10px;">Add</button>
          </div>`).join('')}
          <p class="subtitle" style="margin:8px 0 0;">Stage STC credit: ${money(stageCredit)} of ${money(sm8Total)}${creditDone ? ' - done' : ''}.</p>
        </div>`;
    }

    function openJobStcForm(project, centres, row, prefill = null) {
      const holder = document.getElementById('job-stc-form');
      if (!holder) return;
      const quoteCount = Number(project.stc_quantity) > 0 ? Math.round(Number(project.stc_quantity)) : centres.reduce((n, c) => n + stcCountForStage(c), 0);
      const quotePrice = Number(project.stc_price_per_certificate) > 0 ? Number(project.stc_price_per_certificate) : ((centres.find(c => Number(c.stc_price_per_certificate) > 0) || {}).stc_price_per_certificate || 35);
      const paid = !!(row && (row.formbay_payment_advice_lines || []).length);
      const bstcOffered = Number(project.bstc_quantity) > 0 && jobStcRows.some(r => r.stc_type === 'pv') && !jobStcRows.some(r => r.stc_type === 'battery');
      const v = row || { stc_type: bstcOffered ? 'battery' : 'pv', stc_count: bstcOffered ? Math.round(Number(project.bstc_quantity)) : (jobStcRows.length ? '' : (quoteCount || '')), booked_price: bstcOffered ? (Number(project.bstc_price_per_certificate) || quotePrice) : quotePrice, status: project.formbay_lodgement_status || 'not_lodged', formbay_job_id: project.formbay_lodgement_id || '', ...(prefill || {}) };
      holder.innerHTML = `
        <div style="margin-top:14px; padding:14px; background:var(--surface-2); border-radius:8px;">
          <h3 style="margin:0 0 8px;">${row ? 'Edit STCs' : 'Add STCs'}</h3>
          <div class="grid cols-4">
            <div><label style="margin-top:0;">Type</label><select id="js-type">${Object.entries(STC_TYPES).map(([k, l]) => `<option value="${k}" ${v.stc_type === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
            <div><label style="margin-top:0;">Number of STCs</label><input id="js-count" type="number" inputmode="numeric" step="1" min="0" value="${v.stc_count ?? ''}" /></div>
            <div><label style="margin-top:0;">Credited per STC ($)</label><input id="js-booked" type="number" inputmode="decimal" step="0.01" value="${v.booked_price ?? 35}" /></div>
            <div><label style="margin-top:0;">Formbay job ID</label><input id="js-formbay" value="${escapeHtml(v.formbay_job_id || '')}" placeholder="e.g. 1269150" /></div>
            <div><label style="margin-top:0;">Status</label><select id="js-status" ${paid ? 'disabled' : ''}>${STC_STATUSES.map(s => `<option value="${s.value}" ${v.status === s.value ? 'selected' : ''}>${s.label}</option>`).join('')}</select></div>
            <div><label style="margin-top:0;">Sale price per STC ($)</label><input id="js-sale" type="number" inputmode="decimal" step="0.01" value="${v.sale_price ?? ''}" placeholder="When sold" ${paid ? 'disabled' : ''} /></div>
            <div><label style="margin-top:0;">Sold on</label><input id="js-sold-on" type="date" value="${v.sold_on || ''}" ${paid ? 'disabled' : ''} /></div>
            <div><label style="margin-top:0;">&nbsp;</label><label style="margin:6px 0 0; font-weight:400;"><input id="js-commercial" type="checkbox" ${v.commercial ? 'checked' : ''} style="width:auto;" /> Commercial (GST on sale)</label></div>
          </div>
          <label>Notes</label>
          <input id="js-notes" value="${escapeHtml(v.notes || '')}" />
          ${paid ? '<p class="subtitle" style="margin:6px 0 0;">Paid through an imported Formbay payment advice, so the status and sale come from that.</p>' : ''}
          <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
            <button type="button" id="js-save">Save</button>
            <button type="button" class="secondary" id="js-cancel">Cancel</button>
            ${row && !paid ? '<button type="button" class="secondary" id="js-delete" style="margin-left:auto; color:var(--red);">Delete</button>' : ''}
          </div>
          <div id="js-msg"></div>
        </div>`;
      holder.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      document.getElementById('js-cancel').addEventListener('click', () => { holder.innerHTML = ''; });
      document.getElementById('js-save').addEventListener('click', async () => {
        const btn = document.getElementById('js-save');
        const label = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Saving...';
        try {
          const msg = document.getElementById('js-msg');
          const count = parseInt(document.getElementById('js-count').value, 10);
          if (!(count >= 0)) { msg.innerHTML = '<div class="error-box">Enter the number of STCs.</div>'; return; }
          const sale = document.getElementById('js-sale').value;
          const data = {
            stc_type: document.getElementById('js-type').value,
            stc_count: count,
            booked_price: parseFloat(document.getElementById('js-booked').value) || 0,
            formbay_job_id: document.getElementById('js-formbay').value.trim() || null,
            commercial: document.getElementById('js-commercial').checked,
            notes: document.getElementById('js-notes').value.trim() || null,
            updated_at: new Date().toISOString(),
          };
          if (!paid) {
            data.status = document.getElementById('js-status').value;
            data.sale_price = sale === '' ? null : parseFloat(sale);
            data.sold_on = document.getElementById('js-sold-on').value || null;
          }
          const { data: { session } } = await supabaseClient.auth.getSession();
          const { error } = row
            ? await supabaseClient.from('job_stcs').update(data).eq('id', row.id)
            : await supabaseClient.from('job_stcs').insert({ ...data, project_id: project.id, created_by: session.user.id });
          if (error) { msg.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(error))}</div>`; return; }
          await syncProjectStcStatus(project);
          loadJobStcs(project, centres);
        } finally {
          btn.disabled = false;
          btn.textContent = label;
        }
      });
      const del = document.getElementById('js-delete');
      if (del) del.addEventListener('click', async () => {
        if (!confirm('Delete this STC line?')) return;
        const { error } = await supabaseClient.from('job_stcs').delete().eq('id', row.id);
        if (error) { document.getElementById('js-msg').innerHTML = `<div class="error-box">${escapeHtml(friendlyError(error))}</div>`; return; }
        await syncProjectStcStatus(project);
        loadJobStcs(project, centres);
      });
    }

    // Keeps the Handover card's Formbay status (projects.formbay_lodgement_status, used by the handover
    // checklist) in step with the STC lines: the least advanced line wins; paid counts as sold.
    async function syncProjectStcStatus(project) {
      const { data } = await supabaseClient.from('job_stcs').select('status, formbay_job_id').eq('project_id', project.id);
      if (!data || !data.length) return;
      const order = STC_STATUSES.map(s => s.value);
      const least = data.map(d => d.status).sort((a, b) => order.indexOf(a) - order.indexOf(b))[0];
      const status = least === 'not_lodged' ? null : least === 'paid' ? 'sold' : least;
      const patch = { formbay_lodgement_status: status };
      const firstId = data.find(d => d.formbay_job_id)?.formbay_job_id;
      if (firstId && !project.formbay_lodgement_id) patch.formbay_lodgement_id = firstId;
      await supabaseClient.from('projects').update(patch).eq('id', project.id);
      Object.assign(project, patch);
      const sel = document.getElementById('hd-formbay-status');
      if (sel) sel.value = status || '';
    }

    // ---------- Search within a job ----------
    // One search box above the job's tabs. It looks through everything on the
    // job (documents and plan pages, photos, tasks, feed, meetings, notes,
    // equipment, and - for pricing roles - line items, POs, invoices and
    // variations) and jumps straight to whatever you pick. Everything is
    // fetched once when you first type, then filtered in the browser.
    function ensureJobSearchStyles() {
      if (document.getElementById('js-styles')) return;
      const st = document.createElement('style');
      st.id = 'js-styles';
      st.textContent = `
        #job-search-wrap { position:relative; margin-bottom:14px; }
        #job-search-input { padding-right:36px; }
        #job-search-clear { position:absolute; right:6px; top:6px; background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; display:none; padding:0 6px; line-height:1.4; }
        #job-search-results { margin-top:8px; border:1px solid var(--border); border-radius:10px; background:var(--surface); max-height:70vh; overflow-y:auto; display:none; }
        .js-group-title { font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); padding:10px 14px 4px; }
        .js-result { padding:8px 14px; cursor:pointer; border-top:1px solid var(--border); }
        .js-result:hover, .js-result:focus { background:var(--surface-2); outline:none; }
        .js-result-title { font-size:14px; color:var(--text); word-break:break-word; }
        .js-result-snippet { font-size:12px; color:var(--muted); margin-top:2px; word-break:break-word; }
        #job-search-results mark { background:rgba(224,160,48,.35); color:inherit; border-radius:2px; padding:0 1px; }
        .js-more { display:block; padding:6px 14px 10px; font-size:12px; color:var(--accent); cursor:pointer; background:none; border:none; }
        .js-flash { animation: js-flash 1.6s ease-out; }
        @keyframes js-flash { 0% { box-shadow:0 0 0 3px var(--accent); } 100% { box-shadow:0 0 0 3px transparent; } }
      `;
      document.head.appendChild(st);
    }

    function jsCollectStrings(v, out = []) {
      if (v == null) return out;
      if (typeof v === 'string') out.push(v);
      else if (typeof v === 'number') out.push(String(v));
      else if (Array.isArray(v)) v.forEach(x => jsCollectStrings(x, out));
      else if (typeof v === 'object') Object.values(v).forEach(x => jsCollectStrings(x, out));
      return out;
    }

    function initJobSearch(project, pricingVisible) {
      const wrap = document.getElementById('job-search-wrap');
      if (!wrap) return;
      ensureJobSearchStyles();
      const input = document.getElementById('job-search-input');
      const clearBtn = document.getElementById('job-search-clear');
      const resultsEl = document.getElementById('job-search-results');
      const pid = project.id;
      let cache = null;      // { at, items }
      let loading = null;
      let expanded = new Set();

      const goTab = (panel) => { const t = document.querySelector(`#job-tabs .settings-tab[data-panel="${panel}"]`); if (t) t.click(); };
      const flash = (el) => { if (!el) return; el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.remove('js-flash'); void el.offsetWidth; el.classList.add('js-flash'); };
      const textModal = (title, text) => {
        const o = document.createElement('div');
        o.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
        o.innerHTML = `<div class="card" style="max-width:560px; width:100%; max-height:85vh; overflow-y:auto;"><h2 style="margin-top:0;">${escapeHtml(title)}</h2><p style="white-space:pre-wrap;">${escapeHtml(text)}</p><button type="button" class="secondary">Close</button></div>`;
        o.addEventListener('click', (e) => { if (e.target === o || e.target.tagName === 'BUTTON') o.remove(); });
        document.body.appendChild(o);
      };

      async function build() {
        const q = (p) => Promise.resolve(p).then(r => r.data || []).catch(() => []);
        const sb = supabaseClient;
        const [docs, photos, tasks, posts, comments, meetings, fieldNotes, assets, pos, varEntries, emailLinks] = await Promise.all([
          q(sb.from('project_documents').select('id, folder, file_path, file_name, mime_type, page_names, plan_summary').eq('project_id', pid).neq('folder', SM8_INVOICE_FOLDER)),
          q(sb.from('project_photos').select('id, url, caption, created_at').eq('project_id', pid).order('created_at', { ascending: false })),
          q(sb.from('job_tasks').select('id, description, notes, parent_task_id, completed').eq('project_id', pid)),
          q(sb.from('feed_posts').select('id, message').eq('project_id', pid)),
          q(sb.from('feed_comments').select('id, post_id, message, feed_posts!inner(project_id)').eq('feed_posts.project_id', pid)),
          q(sb.from('meetings').select('id, title, notes, location').eq('project_id', pid)),
          q(sb.from('project_field_notes').select('id, note, signed_by_name, created_at').eq('project_id', pid)),
          q(sb.from('customer_assets').select('id, name, make, model, serial_numbers, notes').eq('project_id', pid)),
          q(sb.from('purchase_orders').select('id, supplier_name, po_number, description, file_name').eq('project_id', pid)),
          q(sb.from('job_variation_entries').select('id, description, materials').eq('project_id', pid)),
          q(sb.from('email_job_links').select('id, note, email_threads(subject)').eq('project_id', pid)),
        ]);
        let centres = [], lines = [], invoices = [], variations = [];
        if (pricingVisible) {
          [centres, invoices, variations] = await Promise.all([
            q(sb.from('cost_centres').select('id, name, description').eq('project_id', pid)),
            q(sb.from('invoices').select('id, invoice_number, description').eq('project_id', pid)),
            q(sb.from('variations').select('id, description').eq('project_id', pid)),
          ]);
          if (centres.length) lines = await q(sb.from('cost_centre_line_items').select('id, cost_centre_id, description').in('cost_centre_id', centres.map(c => c.id)));
        }

        const items = [];
        const add = (group, title, fields, open) => items.push({ group, title, fields: fields.filter(Boolean).map(String), open });

        docs.forEach(d => add('Documents', d.file_name, [d.file_name, d.folder, ...jsCollectStrings(d.page_names), ...jsCollectStrings(d.plan_summary)], async () => {
          goTab('documents'); selectedDocFolder = d.folder; await loadDocuments(pid);
          const link = [...document.querySelectorAll('#documents-list .doc-view-link')].find(a => a.dataset.path === d.file_path);
          if (link) { flash(link.closest('.doc-tile')); link.click(); }
        }));
        photos.forEach((p) => {
          const fileName = decodeURIComponent((p.url || '').split('?')[0].split('/').pop() || '');
          add('Photos', p.caption || fileName || 'Site photo', [p.caption, fileName.replace(/[-_.]+/g, ' ')], async () => {
            goTab('photos');
            await loadSitePhotos(pid);
            const img = document.querySelector(`#site-photos-list [data-photo-id="${p.id}"]`);
            if (img) { flash(img); if (img.classList.contains('site-photo-view')) img.click(); }
          });
        });
        const taskById = Object.fromEntries(tasks.map(t => [t.id, t]));
        tasks.forEach(t => add('Tasks', t.description, [t.description, t.notes], () => {
          goTab('summary');
          const topId = t.parent_task_id && taskById[t.parent_task_id] ? t.parent_task_id : t.id;
          jtExpanded.add(topId); if (t.parent_task_id) jtExpanded.add(t.id);
          const listEl = document.getElementById('job-tasks-list');
          if (listEl && listEl._jt) renderJobTasks(listEl);
          flash(document.querySelector(`#job-tasks-list .jt-item[data-id="${t.id}"]`) || document.getElementById('job-tasks-list'));
        }));
        posts.forEach(p => add('Feed', p.message.length > 70 ? p.message.slice(0, 70) + '...' : p.message, [p.message], () => goTab('feed')));
        comments.forEach(c => add('Feed', 'Comment: ' + (c.message.length > 60 ? c.message.slice(0, 60) + '...' : c.message), [c.message], () => goTab('feed')));
        meetings.forEach(m => add('Meetings', m.title, [m.title, m.notes, m.location], () => { window.location.href = `/meetings.html?id=${m.id}`; }));

        if (project.notes) add('Notes', 'Job notes', [project.notes], () => { goTab('summary'); flash(document.querySelector('#panel-summary .card')); });
        if (project.template_answers) { const t = jsCollectStrings(project.template_answers); if (t.length) add('Notes', 'Job questions and answers', t, () => { goTab('summary'); flash(document.querySelector('#panel-summary .card')); }); }
        if (project.installer_summary) add('Notes', 'Installer summary', [project.installer_summary], () => { goTab('summary'); flash(document.getElementById('installer-summary-text')); });
        if (project.sow_text) add('Notes', 'Scope of work', [project.sow_text], () => textModal('Scope of work', project.sow_text));
        add('Notes', 'Job details', [project.name, project.client_name, project.client_address, project.client_email, project.client_phone, project.nmi, project.panel_serial_numbers, project.inverter_serial_numbers], () => goTab('details'));
        fieldNotes.forEach(n => add('Notes', 'Site visit note ' + new Date(n.created_at).toLocaleDateString('en-AU'), [n.note, n.signed_by_name], () => textModal('Site visit note ' + new Date(n.created_at).toLocaleDateString('en-AU'), n.note)));

        assets.forEach(a => add('Equipment', a.name, [a.name, a.make, a.model, a.serial_numbers, a.notes], () => { goTab('summary'); flash(document.getElementById('assets-card')); }));
        pos.forEach(p => add('Purchase orders', [p.po_number, p.supplier_name].filter(Boolean).join(' - ') || 'Purchase order', [p.po_number, p.supplier_name, p.description, p.file_name], () => goTab('pos')));
        const centreById = Object.fromEntries(centres.map(c => [c.id, c]));
        centres.forEach(c => add('Quote items', c.name, [c.name, c.description], () => goTab('costcentres')));
        lines.forEach(l => add('Quote items', l.description, [l.description, centreById[l.cost_centre_id] && centreById[l.cost_centre_id].name], () => goTab('costcentres')));
        invoices.forEach(i => add('Invoices', i.invoice_number || 'Invoice', [i.invoice_number, i.description], () => goTab('invoices')));
        variations.forEach(v => add('Variations', v.description || 'Variation', [v.description], () => goTab('variations')));
        varEntries.forEach(v => add('Variations', v.description, [v.description, v.materials], () => goTab('variations')));
        emailLinks.forEach(e => add('Emails', (e.email_threads && e.email_threads.subject) || 'Email', [e.email_threads && e.email_threads.subject, e.note], () => goTab('emails')));
        return items;
      }

      async function getItems() {
        if (cache && Date.now() - cache.at < 60000) return cache.items;
        if (!loading) loading = build().then(items => { cache = { at: Date.now(), items }; loading = null; return items; }).catch(err => { loading = null; throw err; });
        return loading;
      }

      const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      function highlight(raw, re) {
        return String(raw).split(re).map((part, i) => i % 2 ? `<mark>${escapeHtml(part)}</mark>` : escapeHtml(part)).join('');
      }

      const GROUP_ORDER = ['Documents', 'Photos', 'Tasks', 'Feed', 'Emails', 'Meetings', 'Notes', 'Equipment', 'Quote items', 'Purchase orders', 'Invoices', 'Variations'];
      const GROUP_LIMIT = 5;
      let shown = [];

      async function run() {
        const raw = input.value.trim();
        clearBtn.style.display = input.value ? 'block' : 'none';
        if (raw.length < 2) { resultsEl.style.display = 'none'; resultsEl.innerHTML = ''; return; }
        resultsEl.style.display = 'block';
        if (!cache) resultsEl.innerHTML = '<p class="subtitle" style="padding:12px 14px; margin:0;">Searching this job...</p>';
        let items;
        try { items = await getItems(); } catch (err) { resultsEl.innerHTML = `<div class="error-box" style="margin:10px;">${escapeHtml(friendlyError(err))}</div>`; return; }
        if (input.value.trim() !== raw) return; // typed on while loading
        const tokens = raw.toLowerCase().split(/\s+/).filter(Boolean);
        const re = new RegExp('(' + tokens.map(reEsc).join('|') + ')', 'i');
        shown = [];
        const matches = items.map(it => {
          const hay = it.fields.join(' \n ').toLowerCase();
          if (!tokens.every(t => hay.includes(t))) return null;
          // snippet: the first field that contains any of the words
          const field = it.fields.find(f => tokens.some(t => f.toLowerCase().includes(t))) || '';
          const at = field.toLowerCase().indexOf(tokens.find(t => field.toLowerCase().includes(t)) || '');
          let snippet = field.replace(/\s+/g, ' ');
          if (snippet.length > 110) { const from = Math.max(0, at - 40); snippet = (from ? '...' : '') + snippet.slice(from, from + 110) + '...'; }
          return { ...it, snippet };
        }).filter(Boolean);
        if (!matches.length) { resultsEl.innerHTML = `<p class="subtitle" style="padding:12px 14px; margin:0;">Nothing on this job matches "${escapeHtml(raw)}".</p>`; return; }
        resultsEl.innerHTML = GROUP_ORDER.map(g => {
          const rows = matches.filter(m => m.group === g);
          if (!rows.length) return '';
          const open = expanded.has(g);
          const visible = open ? rows : rows.slice(0, GROUP_LIMIT);
          return `<div class="js-group-title">${g} (${rows.length})</div>` + visible.map(m => {
            shown.push(m);
            const showSnippet = m.snippet && m.snippet.toLowerCase() !== String(m.title).toLowerCase();
            return `<div class="js-result" tabindex="0" data-i="${shown.length - 1}">
              <div class="js-result-title">${highlight(m.title, re)}</div>
              ${showSnippet ? `<div class="js-result-snippet">${highlight(m.snippet, re)}</div>` : ''}
            </div>`;
          }).join('') + (rows.length > GROUP_LIMIT && !open ? `<button type="button" class="js-more" data-group="${g}">Show all ${rows.length}</button>` : '');
        }).join('');
      }

      resultsEl.addEventListener('click', async (e) => {
        const more = e.target.closest('.js-more');
        if (more) { expanded.add(more.dataset.group); run(); return; }
        const row = e.target.closest('.js-result');
        if (!row) return;
        const m = shown[Number(row.dataset.i)];
        if (!m) return;
        resultsEl.style.display = 'none';
        try { await m.open(); } catch (err) { alert(friendlyError(err)); }
      });
      resultsEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.classList.contains('js-result')) e.target.click(); });

      let timer;
      input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 150); });
      input.addEventListener('focus', () => { if (input.value.trim().length >= 2) run(); else getItems().catch(() => {}); });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { input.value = ''; run(); }
        if (e.key === 'ArrowDown') { const first = resultsEl.querySelector('.js-result'); if (first) { e.preventDefault(); first.focus(); } }
      });
      clearBtn.addEventListener('click', () => { input.value = ''; expanded = new Set(); run(); input.focus(); });
      document.addEventListener('click', (e) => { if (!wrap.contains(e.target)) resultsEl.style.display = 'none'; });
    }

    // ---------- Job card checklist (Google Tasks style) ----------
    // Tasks are grouped Prejob / Onsite / Handover. Each group has a quick-add
    // line (type + Enter), tasks tick off with a checkbox (ticked ones drop
    // into a collapsed "Completed" list and can be un-ticked), and tapping a
    // task opens its details: title, notes, who, due date, star, subtasks,
    // move up / down and delete. The full "+ Add task" panel is still there
    // for the calendar / repeat / required-before-scheduling options.
    let jtExpanded = new Set();
    let jtDoneOpen = new Set();

    function ensureJobTaskStyles() {
      if (document.getElementById('jt-styles')) return;
      const st = document.createElement('style');
      st.id = 'jt-styles';
      st.textContent = `
        .jt-group { margin-bottom:18px; }
        .jt-photos { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
        .jt-photo { width:64px; height:64px; object-fit:cover; border-radius:6px; border:1px solid var(--border); cursor:pointer; }
        .jt-video { display:flex; align-items:center; justify-content:center; background:#000; color:#fff; text-decoration:none; font-size:20px; }
        .jt-photo-btn { font-size:13px; padding:6px 10px; border:1px solid var(--border); border-radius:8px; }
        .jt-group h3 { font-size:14px; margin:0 0 6px; }
        .jt-item { border-bottom:1px solid var(--border); }
        .jt-item.sub { margin-left:30px; }
        .jt-row { display:flex; align-items:flex-start; gap:4px; padding:9px 0; }
        .jt-check-hit { flex:0 0 48px; align-self:stretch; display:flex; justify-content:center; align-items:flex-start; margin:-9px 0; padding:9px 0; min-height:44px; cursor:pointer; }
        .jt-check { width:26px; height:26px; margin:0; padding:0; flex-shrink:0; cursor:pointer; }
        .jt-main { flex:1; min-width:0; cursor:pointer; }
        .jt-title { font-size:15px; color:var(--text); word-break:break-word; }
        .jt-item.done .jt-title { text-decoration:line-through; color:var(--muted); }
        .jt-meta { font-size:12px; color:var(--muted); margin-top:2px; }
        .jt-star { background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; padding:0; line-height:1; min-width:44px; min-height:44px; margin:-9px 0; display:inline-flex; align-items:center; justify-content:center; }
        .jt-star.on { color:#e0a030; }
        .jt-detail { padding:2px 0 12px 52px; display:grid; gap:8px; }
        .jt-detail label { margin:0; font-size:12px; color:var(--muted); }
        .jt-detail textarea { min-height:60px; }
        .jt-detail-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        .jt-actions { display:flex; gap:6px; flex-wrap:wrap; }
        .jt-actions button { font-size:12px; padding:5px 10px; }
        .jt-quick { margin:4px 0 8px; }
        .jt-done-toggle { background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; padding:6px 0; }
        @media (max-width: 600px) { .jt-detail-row { grid-template-columns:1fr; } .jt-item.sub { margin-left:18px; } .jt-detail { padding-left:18px; } }
      `;
      document.head.appendChild(st);
    }

    const JT_GROUPS = [
      { key: 'prejob', label: 'Prejob / office', types: ['prejob', 'quote'] },
      { key: 'onsite', label: 'Onsite', types: ['onsite'] },
      { key: 'handover', label: 'Handover (STC/compliance paperwork)', types: ['handover'] },
    ];

    const jtGroupOf = (t) => (JT_GROUPS.find(g => g.types.includes(t.task_type)) || JT_GROUPS[0]).key;

    async function loadJobTasks(projectId, focusSelector) {
      const listEl = document.getElementById('job-tasks-list');
      if (!listEl) return;
      ensureJobTaskStyles();

      // Wired up unconditionally, before any early return below - otherwise
      // a load error (e.g. job_tasks not migrated yet) leaves "+ Add task"
      // silently unresponsive with no listener attached at all.
      const addBtn = document.getElementById('add-task-btn');
      if (addBtn) addBtn.onclick = () => openAddTaskPanel(projectId);

      const [{ data: tasks, error }, { data: staff }, { data: taskPhotos }, { data: { session } }] = await Promise.all([
        supabaseClient.from('job_tasks').select('*').eq('project_id', projectId).order('created_at', { ascending: true }),
        supabaseClient.from('profiles').select('id, full_name, active'),
        supabaseClient.from('project_photos').select('id, url, task_id').eq('project_id', projectId).not('task_id', 'is', null).order('created_at'),
        supabaseClient.auth.getSession(),
      ]);
      if (error) { listEl.innerHTML = `<div class="error-box">${escapeHtml(friendlyError(error))}</div>`; return; }

      const summaryEl = document.getElementById('summary-tasks-line');
      if (summaryEl) {
        const outstanding = (tasks || []).filter(t => !t.completed);
        const requiredOutstanding = outstanding.filter(t => t.required_before_scheduling);
        summaryEl.innerHTML = !outstanding.length
          ? `<p class="subtitle">No open tasks.</p>`
          : `<p class="subtitle">${outstanding.length} task${outstanding.length === 1 ? '' : 's'} outstanding${requiredOutstanding.length ? `, <span style="color:var(--red);">${requiredOutstanding.length} required before scheduling</span>` : ''}.</p>`;
      }

      listEl._jt = { projectId, tasks: tasks || [], staff: staff || [], photos: taskPhotos || [], userId: session?.user?.id || null };
      bindJobTaskEvents(listEl);
      renderJobTasks(listEl);
      if (focusSelector) { const f = listEl.querySelector(focusSelector); if (f) f.focus(); }
    }

    function jtSort(a, b) {
      return (Number(b.starred) - Number(a.starred))
        || ((a.sort_order ?? 1e9) - (b.sort_order ?? 1e9))
        || String(a.created_at).localeCompare(String(b.created_at));
    }

    // Item 34: ticks, stars, assignees and due dates change on screen straight
    // away and save in the background; a failed save flips back with a red note.
    function renderJobTasks(listEl) { listEl.innerHTML = jobTasksHtml(listEl); }

    // Redraws one task's title and meta line only, leaving its open detail panel and focus alone.
    function jtRefreshRow(listEl, id) {
      const tmp = document.createElement('div');
      tmp.innerHTML = jobTasksHtml(listEl);
      const fresh = tmp.querySelector(`.jt-item[data-id="${id}"] > .jt-row .jt-main`);
      const live = listEl.querySelector(`.jt-item[data-id="${id}"] > .jt-row .jt-main`);
      if (fresh && live) live.replaceWith(fresh);
    }

    // Red note under a task row (anchor is an element or a task id). Cleared by the next redraw.
    function jtShowError(listEl, anchor, message) {
      listEl.querySelectorAll('.jt-err').forEach(el => el.remove());
      const box = document.createElement('div');
      box.className = 'error-box jt-err';
      box.style.cssText = 'margin:4px 0 8px; font-size:13px;';
      box.textContent = message;
      const target = anchor instanceof Element ? anchor : listEl.querySelector(`.jt-item[data-id="${anchor}"] > .jt-row`);
      if (target) target.after(box); else listEl.prepend(box);
    }

    function jobTasksHtml(listEl) {
      const { tasks, staff, photos } = listEl._jt;
      const photosOf = (id) => photos.filter(p => p.task_id === id);
      const staffName = (id) => (staff.find(s => s.id === id) || {}).full_name || 'Someone';
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const subsOf = (id) => tasks.filter(t => t.parent_task_id === id).sort((a, b) => (Number(a.completed) - Number(b.completed)) || jtSort(a, b));

      function itemHtml(t, isSub) {
        const subs = isSub ? [] : subsOf(t.id);
        const who = t.assigned_to_user_id ? staffName(t.assigned_to_user_id) : t.assigned_to_role ? `Anyone in ${t.assigned_to_role}` : '';
        const overdue = t.due_date && !t.completed && new Date(t.due_date + 'T00:00:00') < today;
        const due = t.due_date ? new Date(t.due_date + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }) : '';
        const bits = [];
        if (who) bits.push(escapeHtml(who));
