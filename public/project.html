    async function saveEdits(project) {
      const msg = document.getElementById('edit-msg');
      const saveBtn = document.getElementById('save-edit-btn');
      msg.innerHTML = '';

      const reasons = await checkProjectHasActivity(project);
      if (reasons.length) {
        msg.innerHTML = `<div class="error-box">Can't save stage changes - this quote already ${reasons.join(', ')}. Editing here would delete and re-create every stage, which isn't safe once real activity is attached.</div>`;
        return;
      }

      const name = document.getElementById('p-name').value.trim();
      const client_name = document.getElementById('p-client').value.trim();
      const client_email = document.getElementById('p-email').value.trim();
      const client_phone = document.getElementById('p-phone').value.trim();
      const client_address = document.getElementById('p-address').value.trim();
      const payment_terms = document.getElementById('p-payment-terms').value;
      const sow_text = document.getElementById('p-sow').value;
      const proposal_subtitle = document.getElementById('p-subtitle').value.trim();
      const terms_text = document.getElementById('p-terms').value;
      const deposit_percent = parseFloat(document.getElementById('p-deposit').value) || 0;
      const pylon_link = document.getElementById('p-pylon-link').value.trim();
      const pylon_project_id = document.getElementById('p-pylon-id').value.trim();

      const stageRows = [...document.querySelectorAll('#cc-rows .cc-row')];
      const stagesPayload = stageRows.map((row, i) => ({
        name: row.querySelector('.cc-name').value.trim(),
        description: row.querySelector('.cc-desc').value.trim(),
        markup_percent: parseFloat(row.querySelector('.cc-markup').value) || 0,
        stc_total: parseFloat(row.querySelector('.cc-stc-total').value) || 0,
        estimated_labour_cost: parseFloat(row.dataset.labourTotal) || 0,
        estimated_material_cost: parseFloat(row.dataset.materialTotal) || 0,
        quoted_amount: parseFloat(row.dataset.salePrice) || 0,
        sort_order: i,
        lineItems: [...row.querySelectorAll('.li-row')].map((li, j) => {
          const item_type = li.querySelector('.li-type').value;
          const rate_tier_id = li.querySelector('.li-tier').value || null;
          let description = li.querySelector('.li-desc').value.trim();
          // Labour description is optional - if left blank, fall back to
          // the rate tier's own name (e.g. "Principal Electrician") rather
          // than dropping the line entirely.
          if (!description && item_type === 'labour' && rate_tier_id) {
            description = RATE_TIERS.find(t => t.id === rate_tier_id)?.name || '';
          }
          return {
            description, item_type,
            quantity: parseFloat(li.querySelector('.li-qty').value) || 0,
            unit_cost: parseFloat(li.querySelector('.li-cost').value) || 0,
            rate_tier_id,
            sort_order: j,
          };
        }).filter(li => li.description),
        photoGroups: [...row.querySelectorAll('.pg-row')].map((pg, j) => ({
          description: pg.querySelector('.pg-desc').value.trim(),
          photos: JSON.parse(pg.dataset.photos || '[]').map(url => ({ url })),
          sort_order: j,
        })).filter(pg => pg.description || pg.photos.length),
      })).filter(s => s.name);

      if (!name || !client_name || stagesPayload.length === 0) {
        msg.innerHTML = `<div class="error-box">Please fill in the project name, client name, and at least one stage.</div>`;
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';
      try {
        let clientId = selectedClientId;
        const clientFields = { name: client_name, email: client_email || null, phone: client_phone || null, address: client_address || null, payment_terms };
        if (clientId) {
          await supabaseClient.from('clients').update(clientFields).eq('id', clientId);
        } else {
          const { data: newClient, error: clientErr } = await supabaseClient.from('clients').insert(clientFields).select().single();
          if (clientErr) throw clientErr;
          clientId = newClient.id;
        }

        const { data: settings } = await supabaseClient.from('company_settings').select('portfolio_photos').eq('id', 1).single();
        const allPhotos = (settings && settings.portfolio_photos) || [];
        const wantCategory = TEMPLATE_INFO[currentTemplate].photoCategory;
        const coverPhotos = allPhotos.filter(p => (p.category || 'general') === wantCategory);

        const projectFields = {
          name, client_id: clientId, client_name, client_email, client_phone, client_address,
          sow_text, proposal_subtitle, terms_text, deposit_percent, pylon_link, pylon_project_id,
          reference_photos: referencePhotos.map(url => ({ url })),
          cover_photos: coverPhotos,
          proposal_template: currentTemplate,
          estimate_disclaimer_text: document.getElementById('p-estimate-disclaimer').value,
          project_manager_contact_id: assignedContactIds.project_manager_contact_id || null,
          site_contact_id: assignedContactIds.site_contact_id || null,
          job_contact_id: assignedContactIds.job_contact_id || null,
          sales_contact_id: assignedContactIds.sales_contact_id || null,
          accounts_contact_id: assignedContactIds.accounts_contact_id || null,
        };

        const { error: updateErr } = await supabaseClient.from('projects').update(projectFields).eq('id', project.id);
        if (updateErr) throw updateErr;
        const { error: delErr } = await supabaseClient.from('cost_centres').delete().eq('project_id', project.id);
        if (delErr) throw delErr;

        const { data: insertedStages, error: ccErr } = await supabaseClient
          .from('cost_centres')
          .insert(stagesPayload.map(({ lineItems, photoGroups, ...s }) => ({ ...s, project_id: project.id })))
          .select();
        if (ccErr) throw ccErr;

        const allLineItems = [];
        const allPhotoGroups = [];
        insertedStages.forEach((stage, i) => {
          stagesPayload[i].lineItems.forEach(li => allLineItems.push({ ...li, cost_centre_id: stage.id }));
          stagesPayload[i].photoGroups.forEach(pg => allPhotoGroups.push({ ...pg, cost_centre_id: stage.id }));
        });
        if (allLineItems.length) {
          const { error: liErr } = await supabaseClient.from('cost_centre_line_items').insert(allLineItems);
          if (liErr) throw liErr;
        }
        if (allPhotoGroups.length) {
          const { error: pgErr } = await supabaseClient.from('cost_centre_photo_groups').insert(allPhotoGroups);
          if (pgErr) throw pgErr;
        }

        editMode = false;
        const refreshed = await loadProject();
        const myRole = await getMyRole();
        if (refreshed) render(refreshed, isPricingRole(myRole));
      } catch (err) {
        msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save changes';
      }
    }

    function openCreateInvoicePanel(btn, project, pricingVisible) {
      const centreId = btn.dataset.id;
      const centre = project.cost_centres.find(c => c.id === centreId);
      if (!centre) return;

      const stageInvoices = centre.invoices || [];
      const claimedTotal = stageInvoices.reduce((s, inv) => s + Number(inv.labour_amount) + Number(inv.material_amount), 0);
      const quotedAmount = Number(centre.quoted_amount) || 0;
      const remaining = Math.max(0, quotedAmount - claimedTotal);

      const labourCost = Number(centre.estimated_labour_cost) || 0;
      const materialCost = Number(centre.estimated_material_cost) || 0;
      const costTotal = labourCost + materialCost;
      const labourShare = costTotal > 0 ? labourCost / costTotal : 1;
      const defaultLabourAmount = Math.round(remaining * labourShare * 100) / 100;
      const defaultMaterialAmount = Math.round((remaining - defaultLabourAmount) * 100) / 100;

      const stcApplied = stageInvoices.reduce((s, inv) => s + Number(inv.stc_amount || 0), 0);
      const stcRemaining = Math.max(0, Number(centre.stc_total || 0) - stcApplied);

      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:480px; width:100%; max-height:85vh; overflow-y:auto;">
          <h2>Create &amp; send ${stageInvoices.length ? 'next claim' : 'invoice'}</h2>
          <p class="subtitle" style="margin-bottom:12px;">${centre.name} &middot; ${money(remaining)} remaining to claim. Adjust the amounts or invoice number if this claim shouldn't be for the full remaining balance.</p>

          <label style="margin-top:0">Invoice number</label>
          <input id="create-invoice-number" placeholder="Leave blank to auto-assign the next number" />

          <div class="grid cols-3">
            <div>
              <label>Labour amount</label>
              <input type="number" step="0.01" id="create-invoice-labour" value="${defaultLabourAmount}" />
            </div>
            <div>
              <label>Materials amount</label>
              <input type="number" step="0.01" id="create-invoice-materials" value="${defaultMaterialAmount}" />
            </div>
            <div>
              <label>Total</label>
              <input id="create-invoice-total" readonly style="background:var(--surface); color:var(--muted);" />
            </div>
          </div>

          ${stcRemaining > 0 ? `
            <label>STC credit to apply on this claim</label>
            <input type="number" step="0.01" id="create-invoice-stc" value="${stcRemaining}" />
            <p class="subtitle" style="margin:4px 0 0;">${money(stcRemaining)} STC credit outstanding for this stage. Set to 0 to defer it to a later claim - it'll still show as owing on the claim summary either way.</p>
          ` : '<input type="hidden" id="create-invoice-stc" value="0" />'}

          <div style="margin-top:14px;">
            <button id="create-invoice-confirm-btn">Create &amp; send</button>
            <button type="button" class="secondary" id="create-invoice-cancel-btn">Cancel</button>
          </div>
          <div id="create-invoice-panel-msg"></div>
        </div>`;

      function updateTotal() {
        const l = parseFloat(overlay.querySelector('#create-invoice-labour').value) || 0;
        const m = parseFloat(overlay.querySelector('#create-invoice-materials').value) || 0;
        const s = parseFloat(overlay.querySelector('#create-invoice-stc').value) || 0;
        overlay.querySelector('#create-invoice-total').value = money(l + m - s);
      }
      overlay.querySelector('#create-invoice-labour').addEventListener('input', updateTotal);
      overlay.querySelector('#create-invoice-materials').addEventListener('input', updateTotal);
      const stcInput = overlay.querySelector('#create-invoice-stc');
      if (stcInput) stcInput.addEventListener('input', updateTotal);

      overlay.querySelector('#create-invoice-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#create-invoice-confirm-btn').addEventListener('click', async () => {
        const confirmBtn = overlay.querySelector('#create-invoice-confirm-btn');
        const panelMsg = overlay.querySelector('#create-invoice-panel-msg');
        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Creating...';

        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          const labourAmt = parseFloat(overlay.querySelector('#create-invoice-labour').value) || 0;
          const materialAmt = parseFloat(overlay.querySelector('#create-invoice-materials').value) || 0;
          const claimPercent = quotedAmount > 0 ? Math.round(((claimedTotal + labourAmt + materialAmt) / quotedAmount) * 10000) / 100 : 100;

          const res = await fetch('/.netlify/functions/create-invoice', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
            body: JSON.stringify({
              costCentreId: centreId,
              labourAmount: labourAmt,
              materialAmount: materialAmt,
              stcAmount: parseFloat(overlay.querySelector('#create-invoice-stc').value) || 0,
              claimPercent,
              invoiceNumber: overlay.querySelector('#create-invoice-number').value.trim() || null,
            }),
          });
          const data = await res.json();
          if (!res.ok || !data.ok) throw new Error(data.error || 'Could not create the invoice');

          const invoiceUrl = `${window.location.origin}/invoice.html?token=${data.invoiceToken}`;
          panelMsg.innerHTML = `
            <div class="success-box">Created as ${data.invoiceNumber}.</div>
            <label>Invoice link</label>
            <input readonly value="${invoiceUrl}" onclick="this.select()" />
            <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
              <a class="btn secondary" target="_blank" href="${gmailComposeUrl({ to: project.client_email || '', subject: 'Invoice ' + data.invoiceNumber + ' - ' + project.name, body: 'Hi ' + project.client_name + ',\n\nPlease find your invoice here:\n' + invoiceUrl + '\n\nThanks,\nThomson Energy' })}">Email invoice to client</a>
              <a class="btn secondary" target="_blank" href="/invoice.html?token=${data.invoiceToken}&print=1">Download PDF</a>
            </div>
            <p class="subtitle" style="margin-top:6px;">Gmail opens in a new tab ready to send - the PDF downloads separately, so you'll need to attach it yourself once Gmail's open (no browser can auto-attach a file for you). The client's invoice page already has a Pay Online option alongside your bank details, generated automatically - nothing else to do here.</p>`;
          confirmBtn.style.display = 'none';
          overlay.querySelector('#create-invoice-cancel-btn').textContent = 'Close';

          const refreshed = await loadProject();
          if (refreshed) render(refreshed, pricingVisible);
        } catch (err) {
          panelMsg.innerHTML = `<div class="error-box">${err.message}</div>`;
          confirmBtn.disabled = false;
          confirmBtn.textContent = 'Create & send';
        }
      });

      document.body.appendChild(overlay);
      updateTotal();
    }

    async function pushExistingInvoiceToXero(btn) {
      const msg = document.getElementById('push-xero-msg');
      btn.disabled = true;
      btn.textContent = 'Pushing...';
      msg.innerHTML = '';
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        const res = await fetch('/.netlify/functions/push-invoice-to-xero', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify({ invoiceId: btn.dataset.invoiceId }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Push failed');
        msg.innerHTML = `<div class="success-box">Pushed ${data.invoiceNumber} to Xero.</div>`;
        location.reload();
      } catch (err) {
        msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        btn.disabled = false;
        btn.textContent = 'Push to Xero';
      }
    }

    async function initCcewSection(project) {
      const el = document.getElementById('ccew-section');
      if (!el) return;

      if (project.ccew_file_path) {
        let viewUrl = '#';
        try { viewUrl = await getSignedDocUrl(project.ccew_file_path); } catch {}
        el.innerHTML = `
          <div class="success-box" style="margin-bottom:10px;">CCEW uploaded.</div>
          <a class="btn secondary" href="${viewUrl}" target="_blank">View certificate</a>
          <button type="button" class="secondary" id="ccew-replace-btn" style="margin-left:8px;">Replace</button>`;
        el.querySelector('#ccew-replace-btn').addEventListener('click', () => renderCcewUploadForm(project));
      } else if (project.ccew_not_required_reason) {
        el.innerHTML = `
          <div class="badge draft" style="margin-bottom:10px; display:inline-block;">Not required</div>
          <p class="subtitle" style="margin-bottom:10px;">${project.ccew_not_required_reason}</p>
          <button type="button" class="secondary" id="ccew-change-btn">Upload one instead / change reason</button>`;
        el.querySelector('#ccew-change-btn').addEventListener('click', () => renderCcewUploadForm(project));
      } else {
        renderCcewUploadForm(project);
      }
    }

    function renderCcewUploadForm(project) {
      const el = document.getElementById('ccew-section');
      el.innerHTML = `
        <label style="margin-top:0">Upload the certificate</label>
        <input type="file" id="ccew-file-input" accept=".pdf,.jpg,.jpeg,.png" />
        <p class="subtitle" style="margin:10px 0 4px;">Or, if this job isn't electrical work and no CCEW applies:</p>
        <input id="ccew-reason-input" placeholder="e.g. Not electrical work" />
        <button id="ccew-save-reason-btn" style="margin-top:8px;">Save reason</button>
        <div id="ccew-msg"></div>`;

      el.querySelector('#ccew-file-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const msg = el.querySelector('#ccew-msg');
        msg.innerHTML = `<p class="subtitle">Uploading...</p>`;
        try {
          const path = await uploadPrivateFile(file, `ccew/${project.id}`);
          const { error } = await supabaseClient.from('projects').update({ ccew_file_path: path, ccew_not_required_reason: null }).eq('id', project.id);
          if (error) throw error;
          project.ccew_file_path = path;
          project.ccew_not_required_reason = null;
          await initCcewSection(project);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        }
      });

      el.querySelector('#ccew-save-reason-btn').addEventListener('click', async () => {
        const reason = el.querySelector('#ccew-reason-input').value.trim();
        const msg = el.querySelector('#ccew-msg');
        if (!reason) { msg.innerHTML = `<div class="error-box">Enter a reason.</div>`; return; }
        const { error } = await supabaseClient.from('projects').update({ ccew_not_required_reason: reason, ccew_file_path: null }).eq('id', project.id);
        if (error) { msg.innerHTML = `<div class="error-box">${error.message}</div>`; return; }
        project.ccew_not_required_reason = reason;
        project.ccew_file_path = null;
        await initCcewSection(project);
      });
    }

    function render(project, pricingVisible) {
      const centres = project.cost_centres.sort((a, b) => a.sort_order - b.sort_order);
      const quoted = centres.reduce((s, c) => s + Number(c.quoted_amount || 0), 0);
      // estimated_labour_cost is a SELL total (hours x the rate tier's sell
      // rate - there's no separate cost rate in this app), not a cost. For
      // the cost/profit breakdown below we need an actual cost, so it's
      // backed out using the same cost->sell relationship materials use
      // (sell = cost x (1 + markup%)), per stage since markup% varies.
      const labourSellTotal = centres.reduce((s, c) => s + Number(c.estimated_labour_cost || 0), 0);
      const labourCostTotal = centres.reduce((s, c) => {
        const markupFactor = 1 + (Number(c.markup_percent) || 45) / 100;
        return s + (Number(c.estimated_labour_cost) || 0) / markupFactor;
      }, 0);
      const materialCostTotal = centres.reduce((s, c) => s + Number(c.estimated_material_cost || 0), 0);
      const cost = labourCostTotal + materialCostTotal;
      const invoiced = centres.reduce((s, c) => s + Number(c.invoiced_amount || 0), 0);
      const profit = quoted - cost;
      const pctComplete = quoted ? Math.min(100, Math.round((invoiced / quoted) * 100)) : 0;
      const remaining = Math.max(0, quoted - invoiced);
      const quoteUrl = `${window.location.origin}/quote.html?token=${project.quote_token}`;
      const actualLabourTotal = centres.reduce((s, c) => s + Number(c.actual_labour_cost || 0), 0);
      const quotedHoursTotal = centres.reduce((s, c) => s + Number(c.quoted_hours || 0), 0);
      const actualHoursTotal = centres.reduce((s, c) => s + Number(c.actual_hours || 0), 0);

      // "Cost allocated" and "Profit" on jobs must always reflect real
      // spend, never the estimate - accrued labour comes from logged
      // timesheets (actual_labour_cost, per stage), accrued materials
      // from PO line items that have actually been received.
      const accruedMaterialTotal = Number(project.accrued_material_cost) || 0;
      const accruedTotal = actualLabourTotal + accruedMaterialTotal;
      const accruedProfit = quoted - accruedTotal;
      const costBarMax = Math.max(cost, accruedTotal, 1);
      const estimatedBarPct = Math.round((cost / costBarMax) * 100);
      const accruedBarPct = Math.round((accruedTotal / costBarMax) * 100);
      const accruedOverEstimate = accruedTotal > cost;

      const content = document.getElementById('content');
      const numberLine = [
        project.job_number ? `J${project.job_number}` : null,
        project.quote_number ? `Q${project.quote_number}` : null,
      ].filter(Boolean).join(' &middot; ');

      // Quoted-split donut (Materials/Labour/Profit) - only meaningful
      // when there's a positive quote and cost hasn't blown past it;
      // otherwise a slice would go negative, which conic-gradient can't
      // render, so we fall back to a plain text line instead.
      const donutOk = pricingVisible && quoted > 0 && profit >= 0;
      let materialsPct = 0, labourPct = 0;
      if (donutOk) {
        materialsPct = Math.min(100, Math.round((materialCostTotal / quoted) * 1000) / 10);
        labourPct = Math.min(100 - materialsPct, Math.round((labourCostTotal / quoted) * 1000) / 10);
      }
      const profitPct = donutOk ? Math.max(0, Math.round((100 - materialsPct - labourPct) * 10) / 10) : 0;

      const overallBudgetPercent = labourSellTotal > 0 ? Math.round((actualLabourTotal / labourSellTotal) * 100) : 0;
      const overallIsOver = overallBudgetPercent > 100;

      content.innerHTML = `
        <h1>${project.name}</h1>
        <p class="subtitle">${project.client_name} &middot; <span class="badge ${project.status}">${project.status.replace('_',' ')}</span>${numberLine ? ' &middot; ' + numberLine : ''}</p>
        <div style="margin-bottom:20px;">
          ${pricingVisible && !editMode ? `
            ${!project.job_number ? `<button id="edit-toggle-btn" class="secondary">Edit quote</button>` : ''}
            <button id="duplicate-btn" class="secondary">Duplicate as new project</button>
          ` : ''}
          ${editMode ? `
            <button id="save-edit-btn">Save changes</button>
            <button type="button" class="secondary" id="cancel-edit-btn">Cancel</button>
          ` : ''}
          <div id="action-msg"></div>
          <div id="edit-msg"></div>
        </div>

        <div class="settings-tabs" id="job-tabs" style="flex-direction:row; position:static; border-bottom:1px solid var(--border); margin-bottom:20px; overflow-x:auto;">
          <button class="settings-tab active" data-panel="summary">Summary</button>
          <button class="settings-tab" data-panel="costcentres">Cost Centres</button>
          ${project.job_number ? `<button class="settings-tab" data-panel="pos">Purchase Orders</button>` : ''}
          <button class="settings-tab" data-panel="details">Details</button>
          ${!editMode ? `<button class="settings-tab" data-panel="documents">Documents</button>` : ''}
        </div>

        <div class="job-tab-layout">
          <div class="job-tab-main">

            <div class="settings-panel active" id="panel-summary">
              ${pricingVisible ? `
                <div class="grid cols-${project.job_number ? '4' : '3'}">
                  <div class="stat"><div class="label">Quote total</div><div class="value">${money(quoted)}</div></div>
                  <div class="stat"><div class="label">Cost estimate</div><div class="value">${money(cost)}</div></div>
                  <div class="stat"><div class="label">Estimated profit</div><div class="value ${profit >= 0 ? 'positive' : 'negative'}">${money(profit)}</div></div>
                  ${project.job_number ? `<div class="stat"><div class="label">Invoiced</div><div class="value">${money(invoiced)}</div></div>` : ''}
                </div>

                ${project.job_number ? `
                <div class="card" style="margin-top:20px;">
                  <h2>Progress</h2>
                  <div class="progress-track"><div class="progress-fill" style="width:${pctComplete}%"></div></div>
                  <p class="subtitle" style="margin:8px 0 0;">${pctComplete}% invoiced (${money(invoiced)} of ${money(quoted)})</p>
                </div>

                <div class="card" style="margin-top:20px;">
                  <h2 style="margin-bottom:14px;">Estimated vs accrued cost</h2>
                  <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                    <span class="subtitle">Estimated</span>
                    <span style="font-weight:600;">${money(cost)}</span>
                  </div>
                  <div style="background:var(--surface-2); border-radius:999px; height:10px; overflow:hidden; margin-bottom:14px;">
                    <div style="background:var(--muted); width:${estimatedBarPct}%; height:100%; border-radius:999px;"></div>
                  </div>
                  <div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                    <span class="subtitle">Accrued (real)</span>
                    <span id="cost-allocated-value" style="font-weight:600; cursor:pointer; text-decoration:underline dotted; text-underline-offset:4px; color:${accruedOverEstimate ? 'var(--red)' : 'var(--green)'};" title="Click to see the timesheets behind this figure">${money(accruedTotal)}</span>
                  </div>
                  <div style="background:var(--surface-2); border-radius:999px; height:10px; overflow:hidden;">
                    <div style="background:${accruedOverEstimate ? 'var(--red)' : 'var(--green)'}; width:${accruedBarPct}%; height:100%; border-radius:999px;"></div>
                  </div>
                  <p class="subtitle" style="margin-top:8px;">Accrued = actual labour cost from timesheets + received purchase order line items. Click the accrued figure to see the timesheets behind it.</p>
                </div>
                ` : ''}
              ` : ''}

              <div class="card">
                <h2>Needs attention</h2>
                <div id="summary-po-line">${project.job_number ? `<p class="subtitle">Loading purchase orders...</p>` : `<p class="subtitle">Purchase orders start once this quote is approved and becomes a job.</p>`}</div>
              </div>

              ${!editMode ? `
              <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                  <h2 style="margin:0;">Tasks</h2>
                  <button type="button" id="add-task-btn" class="secondary">+ Add task</button>
                </div>
                <div id="job-tasks-list"><p class="subtitle">Loading...</p></div>
              </div>
              ` : ''}

              ${pricingVisible ? `
                <div class="card">
                  <h2>Quoted split</h2>
                  ${donutOk ? `
                    <div style="display:flex; align-items:center; gap:24px; flex-wrap:wrap;">
                      <div style="width:120px; height:120px; border-radius:50%; flex-shrink:0; background:conic-gradient(var(--accent) 0% ${materialsPct}%, var(--green) ${materialsPct}% ${materialsPct + labourPct}%, ${profit >= 0 ? 'var(--muted)' : 'var(--red)'} ${materialsPct + labourPct}% 100%);"></div>
                      <div>
                        <p style="margin:0 0 6px;"><span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--accent); margin-right:8px;"></span>Materials - ${money(materialCostTotal)} (${materialsPct}%)</p>
                        <p style="margin:0 0 6px;"><span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--green); margin-right:8px;"></span>Labour - ${money(labourCostTotal)} (${labourPct}%)</p>
                        <p style="margin:0;"><span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--muted); margin-right:8px;"></span>Profit - ${money(profit)} (${profitPct}%)</p>
                      </div>
                    </div>
                  ` : `<p class="subtitle">${quoted > 0 ? `Cost (${money(cost)}) has passed the quoted total (${money(quoted)}) - no split to show.` : 'Add quoted amounts to a stage to see the split.'}</p>`}
                </div>
              ` : ''}

              ${labourSellTotal > 0 || actualHoursTotal > 0 ? `
                <div class="card">
                  <h2 style="margin-bottom:2px;">Overall labour budget</h2>
                  <p class="subtitle" style="margin-bottom:14px;">${actualHoursTotal} hrs logged - ${quotedHoursTotal} hrs quoted, across every stage.</p>
                  <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                    <span class="subtitle">Labour budget</span>
                    <span style="font-weight:600; color:${overallIsOver ? 'var(--red)' : 'var(--green)'};">${overallBudgetPercent}%</span>
                  </div>
                  <div style="background:var(--surface-2); border-radius:999px; height:10px; overflow:hidden;">
                    <div style="background:${overallIsOver ? 'var(--red)' : 'var(--green)'}; width:${Math.min(100, overallBudgetPercent)}%; height:100%; border-radius:999px;"></div>
                  </div>
                  <p class="subtitle" style="margin-top:8px; color:${overallIsOver ? 'var(--red)' : 'var(--green)'};">${overallIsOver ? (overallBudgetPercent - 100) + '% over' : (100 - overallBudgetPercent) + '% remaining'}</p>
                </div>
              ` : ''}
            </div>

            <div class="settings-panel" id="panel-costcentres">
              ${editMode ? editorCostCentresHtml() : `
              <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
                  <h2 style="margin:0;">Stages</h2>
                  <button type="button" id="toggle-line-items-btn" class="secondary" style="font-size:12px; padding:6px 10px;">${showLineItems ? 'Hide line items' : 'Show line items'}</button>
                </div>
                <table class="responsive-stack">
                  <thead>
                    <tr>
                      <th>#</th><th>Stage</th>
                      ${pricingVisible ? '<th class="num">Quoted</th><th class="num">Labour</th><th class="num">Materials</th><th class="num">Invoiced</th>' : ''}
                    </tr>
                  </thead>
                  <tbody>
                    ${centres.map((c, i) => `
                      <tr>
                        <td data-label="#">${costCentreNumber(project.job_number, i + 1)}</td>
                        <td data-label="Stage">${c.name}</td>
                        ${pricingVisible ? `
                          <td class="num" data-label="Quoted">${moneyOrHidden(c.quoted_amount)}</td>
                          <td class="num" data-label="Labour">${moneyOrHidden(c.estimated_labour_cost)}</td>
                          <td class="num" data-label="Materials">${moneyOrHidden(c.estimated_material_cost)}</td>
                          <td class="num" data-label="Invoiced">${moneyOrHidden(c.invoiced_amount)}</td>
                        ` : ''}
                      </tr>
                      ${showLineItems ? (c.cost_centre_line_items || []).slice().sort((a, b) => a.sort_order - b.sort_order).map(li => `
                        <tr class="li-detail-row" style="background:var(--surface-2);">
                          <td data-label="#"></td>
                          <td data-label="Stage" style="padding-left:24px; font-size:13px; color:var(--muted);">&#8627; ${li.description}${li.item_type === 'labour' ? ` (${li.quantity} hrs)` : ` (x${li.quantity})`}</td>
                          ${pricingVisible ? `
                            <td class="num" data-label="Quoted">${money(Number(li.quantity) * Number(li.unit_cost))}</td>
                            <td class="num" data-label="Labour"></td>
                            <td class="num" data-label="Materials"></td>
                            <td class="num" data-label="Invoiced"></td>
                          ` : ''}
                        </tr>`).join('') : ''}`).join('')}
                  </tbody>
                </table>
              </div>

              ${centres.map((c, i) => {
                const quotedLabour = Number(c.estimated_labour_cost) || 0;
                const actualLabour = Number(c.actual_labour_cost) || 0;
                const quotedHours = Number(c.quoted_hours) || 0;
                const actualHours = Number(c.actual_hours) || 0;
                const budgetPercent = quotedLabour > 0 ? Math.round((actualLabour / quotedLabour) * 100) : 0;
                const isOver = budgetPercent > 100;

                if (pricingVisible) {
                  const marginPercent = quotedLabour > 0 ? Math.round(((quotedLabour - actualLabour) / quotedLabour) * 100) : null;
                  return `
                  <div class="card">
                    <h2 style="margin-bottom:2px;">${costCentreNumber(project.job_number, i + 1)} ${c.name} - labour</h2>
                    <p class="subtitle" style="margin-bottom:14px;">Labour only - full gross profit needs materials cost too, once the materials database exists.</p>
                    <div class="grid cols-3">
                      <div>
                        <p class="subtitle" style="margin:0 0 4px;">Quoted</p>
                        <p style="font-size:20px; font-weight:600; margin:0;">${money(quotedLabour)}</p>
                      </div>
                      <div>
                        <p class="subtitle" style="margin:0 0 4px;">Actual cost</p>
                        <p style="font-size:20px; font-weight:600; margin:0;">${money(actualLabour)}</p>
                      </div>
                      <div>
                        <p class="subtitle" style="margin:0 0 4px;">Labour margin</p>
                        <p style="font-size:20px; font-weight:600; margin:0; color:${marginPercent === null ? 'inherit' : marginPercent >= 0 ? 'var(--green)' : 'var(--red)'};">${marginPercent === null ? '-' : marginPercent + '%'}</p>
                      </div>
                    </div>
                  </div>`;
                }

                // Staff/Sales - hours only, budget-% bar (driven by real cost
                // internally, never shown as a dollar figure) so two apprentices
                // taking more hours at a lower rate can still correctly show as
                // under budget, rather than falsely flagging on hours alone.
                const barWidthPercent = Math.min(100, budgetPercent);
                const trackScale = isOver ? budgetPercent : 100;
                const markerPosition = isOver ? Math.round((100 / trackScale) * 100 * 10) / 10 : null;
                return `
                <div class="card">
                  <h2 style="margin-bottom:2px;">${costCentreNumber(project.job_number, i + 1)} ${c.name} - labour</h2>
                  <p class="subtitle" style="margin-bottom:14px;">${actualHours} hrs logged - ${quotedHours} hrs quoted</p>
                  <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                    <span class="subtitle">Labour budget</span>
                    <span style="font-weight:600; color:${isOver ? 'var(--red)' : 'var(--green)'};">${budgetPercent}%</span>
                  </div>
                  <div style="position:relative; background:var(--surface-2); border-radius:999px; height:10px; overflow:${isOver ? 'visible' : 'hidden'};">
                    <div style="background:${isOver ? 'var(--red)' : 'var(--green)'}; width:${isOver ? '100%' : barWidthPercent + '%'}; height:100%; border-radius:999px;"></div>
                    ${isOver ? `<div style="position:absolute; left:${markerPosition}%; top:-4px; width:2px; height:18px; background:var(--text);"></div>` : ''}
                  </div>
                  ${isOver ? `<div style="position:relative; height:14px;"><span style="position:absolute; left:${markerPosition}%; transform:translateX(-50%); font-size:11px; color:var(--muted);">100%</span></div>` : ''}
                  <p class="subtitle" style="margin-top:8px; color:${isOver ? 'var(--red)' : 'var(--green)'};">${isOver ? (budgetPercent - 100) + '% over' : (100 - budgetPercent) + '% remaining'}</p>
                </div>`;
              }).join('')}

              ${pricingVisible ? centres.map((c, i) => {
                const stageInvoices = (c.invoices || []).slice().sort((a, b) => new Date(a.sent_at) - new Date(b.sent_at));
                const claimedTotal = stageInvoices.reduce((s, inv) => s + Number(inv.labour_amount) + Number(inv.material_amount), 0);
                const quotedAmt = Number(c.quoted_amount) || 0;
                const remaining = Math.max(0, quotedAmt - claimedTotal);
                const stcApplied = stageInvoices.reduce((s, inv) => s + Number(inv.stc_amount || 0), 0);
                const stcRemaining = Math.max(0, Number(c.stc_total || 0) - stcApplied);
                return `
                <div class="card">
                  <h2>${costCentreNumber(project.job_number, i + 1)} ${c.name} - claims</h2>
                  ${stageInvoices.length ? `
                    <table class="responsive-stack">
                      <thead><tr><th>Invoice</th><th class="num">Amount</th><th>Sent</th><th></th></tr></thead>
                      <tbody>
                        ${stageInvoices.map(inv => `
                          <tr>
                            <td data-label="Invoice">${inv.invoice_number}</td>
                            <td class="num" data-label="Amount">${money(Number(inv.labour_amount) + Number(inv.material_amount))}</td>
                            <td data-label="Sent">${new Date(inv.sent_at).toLocaleDateString('en-AU')}</td>
                            <td data-label="">
                              ${inv.paid_at ? `<span class="badge accepted">Paid</span>` : `<span class="badge sent" style="margin-right:6px;">Sent</span>`}
                              <a class="link-quiet" href="/invoice.html?token=${inv.invoice_token}" target="_blank" style="font-size:12px; margin-right:6px;">View</a>
                              ${!inv.xero_invoice_id ? `<button class="secondary push-xero-btn" data-invoice-id="${inv.id}" style="font-size:12px; padding:6px 10px;">Push to Xero</button>` : `<span class="subtitle" style="font-size:11px;">In Xero</span>`}
                            </td>
                          </tr>`).join('')}
                      </tbody>
                    </table>
                  ` : `<p class="subtitle">No claims raised yet.</p>`}

                  <p class="subtitle" style="margin-top:14px;">Claimed to date: <strong style="color:var(--text);">${money(claimedTotal)}</strong> of ${money(quotedAmt)}. Remaining: <strong style="color:var(--text);">${money(remaining)}</strong>.</p>
                  ${c.stc_total > 0 ? `<p class="subtitle">STC entitlement: ${money(c.stc_total)} - applied so far: ${money(stcApplied)}, remaining: ${money(stcRemaining)}.</p>` : ''}
                  ${remaining > 0 ? `<button class="secondary create-invoice-btn" data-id="${c.id}" style="margin-top:6px;">Create &amp; send next claim</button>` : ''}
                </div>`;
              }).join('') : ''}
              <div id="push-xero-msg"></div>
              `}
            </div>

            ${project.job_number ? `
            <div class="settings-panel" id="panel-pos">
              <div class="card">
                <h2>Purchase orders &amp; supplier invoices</h2>
                <p class="subtitle" style="margin-bottom:14px;">Tracked separately so costs aren't double-counted.</p>
                <div id="po-list"></div>
                <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:${centres.length ? '16px' : '0'};">
                  <button type="button" id="create-po-btn" class="secondary">+ Create purchase order</button>
                  <button type="button" id="suggest-po-btn" class="secondary">Generate PO suggestions from quote</button>
                </div>
                <div id="po-msg"></div>
              </div>
            </div>
            ` : ''}

            <div class="settings-panel" id="panel-details">
              ${editMode ? editorPanelHtml() : `
              ${(() => {
                const contactRows = [
                  { label: 'Project manager', c: project.project_manager },
                  { label: 'Site supervisor', c: project.site_contact },
                  { label: 'Job contact', c: project.job_contact },
                  { label: 'Sales contact', c: project.sales_contact },
                  { label: 'Accounts contact', c: project.accounts_contact },
                ].filter(r => r.c && r.c.name);
                if (!contactRows.length) return '';
                return `
              <div class="card">
                <h2>Who's running this job</h2>
                <table>
                  <thead><tr><th>Role</th><th>Name</th><th>Phone</th><th>Email</th></tr></thead>
                  <tbody>
                    ${contactRows.map(r => `<tr><td>${r.label}</td><td>${r.c.name || ''}</td><td>${r.c.phone ? `<a class="link-quiet" href="tel:${r.c.phone}">${r.c.phone}</a>` : ''}</td><td>${r.c.email ? `<a class="link-quiet" href="mailto:${r.c.email}">${r.c.email}</a>` : ''}</td></tr>`).join('')}
                  </tbody>
                </table>
              </div>`;
              })()}

              ${!['time_and_materials', 'direct_job'].includes(project.proposal_template) ? `
              <div class="card">
                <h2>Client quote link</h2>
                <p class="subtitle" style="margin-bottom:10px;">Share this link with the client, or email them the quote directly.</p>
                <input readonly value="${quoteUrl}" style="margin-bottom:10px;" onclick="this.select()" />
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                  <a class="btn secondary" target="_blank" href="${gmailComposeUrl({ to: project.client_email || '', subject: 'Quote: ' + project.name, body: 'Hi ' + project.client_name + ',\n\nPlease find your quote here:\n' + quoteUrl + '\n\nThanks,\nThomson Energy' })}">Email quote to client</a>
                  <a class="btn secondary" target="_blank" href="${quoteUrl}${quoteUrl.includes('?') ? '&' : '?'}print=1">Download PDF</a>
                </div>
                ${pricingVisible ? `<p class="subtitle" style="margin-top:14px;">Deposit: ${project.deposit_percent}% (${money(quoted * (project.deposit_percent / 100))}) due on acceptance, remainder invoiced per stage on completion.</p>` : ''}
                ${project.proposal_template === 'solar' && project.pylon_link ? `<p class="subtitle" style="margin-top:6px;">Pylon design: <a class="link-quiet" href="${project.pylon_link}" target="_blank" rel="noopener">${project.pylon_link}</a></p>` : ''}
              </div>
              ` : ''}

              ${['client_handover', 'awaiting_payment', 'archived'].includes(project.pipeline_stage) ? `
              <div class="card">
                <h2>Compliance - CCEW</h2>
                <p class="subtitle" style="margin-bottom:10px;">Submitted through the Building and Energy Commission's own website - upload the resulting certificate here for the record, or state why one isn't needed.</p>
                <div id="ccew-section"></div>
              </div>
              ` : ''}
              `}
            </div>

            ${!editMode ? `
            <div class="settings-panel" id="panel-documents">
              <div class="card">
                <h2>Documents</h2>
                <p class="subtitle" style="margin-bottom:14px;">Shared between the quote and the job - it's the same list either way, since they're the same underlying record.</p>
                <div id="doc-folder-pills" style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;"></div>
                <div id="documents-list"><p class="subtitle">Loading...</p></div>
              </div>
              <div class="card">
                <h2>Upload</h2>
                <label style="margin-top:0">Folder</label>
                <div style="display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap;">
                  <select id="doc-folder-select" style="flex:1; min-width:160px;"><option value="General">General</option></select>
                  <span class="subtitle">or</span>
                  <input id="doc-new-folder" placeholder="New folder name" style="flex:1; min-width:160px;" />
                </div>
                <input type="file" id="doc-file-input" multiple />
                <button type="button" id="doc-upload-btn" class="secondary" style="margin-top:10px;">Upload</button>
                <div id="doc-upload-msg"></div>
              </div>
            </div>
            ` : ''}

          </div>

          <div class="job-activity-sidebar">
            <div class="card">
              <h2>Activity log</h2>
              <div id="job-activity-log"><p class="subtitle">Loading...</p></div>
            </div>
          </div>
        </div>
      `;

      document.querySelectorAll('#job-tabs .settings-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#job-tabs .settings-tab').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('.job-tab-main .settings-panel').forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
        });
      });

      renderActivityLog('project', project.id, 'job-activity-log');

      if (editMode) {
        wireEditForm(project);
        return;
      }

      if (project.job_number) loadPurchaseOrders(project.id, centres);
      loadJobTasks(project.id);
      loadDocuments(project.id);
      wireDocumentUpload(project);
      if (document.getElementById('ccew-section')) initCcewSection(project);

      const costAllocatedEl = document.getElementById('cost-allocated-value');
      if (costAllocatedEl) costAllocatedEl.addEventListener('click', () => openTimesheetDrilldown(project, pricingVisible));

      document.querySelectorAll('.create-invoice-btn').forEach(btn => {
        btn.addEventListener('click', () => openCreateInvoicePanel(btn, project, pricingVisible));
      });
      document.querySelectorAll('.push-xero-btn').forEach(btn => {
        btn.addEventListener('click', () => pushExistingInvoiceToXero(btn));
      });

      const editToggleBtn = document.getElementById('edit-toggle-btn');
      if (editToggleBtn) editToggleBtn.addEventListener('click', () => enterEditMode(project));

      document.getElementById('toggle-line-items-btn').addEventListener('click', () => {
        showLineItems = !showLineItems;
        render(project, pricingVisible);
        document.querySelector('#job-tabs .settings-tab[data-panel="costcentres"]').click();
      });

      const duplicateBtn = document.getElementById('duplicate-btn');
      if (duplicateBtn) duplicateBtn.addEventListener('click', async () => {
        const btn = document.getElementById('duplicate-btn');
        btn.disabled = true;
        btn.textContent = 'Duplicating...';
        try {
          const { data: fullProject, error: loadErr } = await supabaseClient
            .from('projects')
            .select('*, cost_centres(*, cost_centre_line_items(*), cost_centre_photo_groups(*))')
            .eq('id', project.id)
            .single();
          if (loadErr) throw loadErr;

          const { data: newProject, error: insErr } = await supabaseClient
            .from('projects')
            .insert({
              name: `${fullProject.name} (copy)`,
              client_name: fullProject.client_name,
              client_email: fullProject.client_email,
              client_address: fullProject.client_address,
              sow_text: fullProject.sow_text,
              proposal_subtitle: fullProject.proposal_subtitle,
              terms_text: fullProject.terms_text,
              deposit_percent: fullProject.deposit_percent,
              pylon_link: fullProject.pylon_link,
              reference_photos: fullProject.reference_photos,
              cover_photos: fullProject.cover_photos,
            })
            .select()
            .single();
          if (insErr) throw insErr;

          const stages = fullProject.cost_centres.sort((a, b) => a.sort_order - b.sort_order);
          const { data: newStages, error: stagesErr } = await supabaseClient
            .from('cost_centres')
            .insert(stages.map(s => ({
              project_id: newProject.id,
              name: s.name,
              description: s.description,
              sort_order: s.sort_order,
              markup_percent: s.markup_percent,
              estimated_labour_cost: s.estimated_labour_cost,
              estimated_material_cost: s.estimated_material_cost,
              quoted_amount: s.quoted_amount,
            })))
            .select();
          if (stagesErr) throw stagesErr;

          const allLineItems = [];
          const allPhotoGroups = [];
          stages.forEach((s, i) => {
            (s.cost_centre_line_items || []).forEach(li => {
              allLineItems.push({
                cost_centre_id: newStages[i].id,
                description: li.description,
                item_type: li.item_type,
                quantity: li.quantity,
                unit_cost: li.unit_cost,
                sort_order: li.sort_order,
              });
            });
            (s.cost_centre_photo_groups || []).forEach(pg => {
              allPhotoGroups.push({
                cost_centre_id: newStages[i].id,
                description: pg.description,
                photos: pg.photos,
                sort_order: pg.sort_order,
              });
            });
          });
          if (allLineItems.length) {
            const { error: liErr } = await supabaseClient.from('cost_centre_line_items').insert(allLineItems);
            if (liErr) throw liErr;
          }
          if (allPhotoGroups.length) {
            const { error: pgErr } = await supabaseClient.from('cost_centre_photo_groups').insert(allPhotoGroups);
            if (pgErr) throw pgErr;
          }

          window.location.href = `/new-project.html?id=${newProject.id}`;
        } catch (err) {
          document.getElementById('action-msg').innerHTML = `<div class="error-box">${err.message}</div>`;
          btn.disabled = false;
          btn.textContent = 'Duplicate as new project';
        }
      });

    }

    async function loadJobTasks(projectId) {
      const listEl = document.getElementById('job-tasks-list');
      const summaryEl = document.getElementById('summary-tasks-line');
      const [{ data: tasks, error }, { data: staff }] = await Promise.all([
        supabaseClient.from('job_tasks').select('*').eq('project_id', projectId)
          .order('completed', { ascending: true }).order('required_before_scheduling', { ascending: false }),
        supabaseClient.from('profiles').select('id, full_name'),
      ]);
      if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }

      if (summaryEl) {
        const outstanding = (tasks || []).filter(t => !t.completed);
        const requiredOutstanding = outstanding.filter(t => t.required_before_scheduling);
        summaryEl.innerHTML = !outstanding.length
          ? `<p class="subtitle">No open tasks.</p>`
          : `<p class="subtitle">${outstanding.length} task${outstanding.length === 1 ? '' : 's'} outstanding${requiredOutstanding.length ? `, <span style="color:var(--red);">${requiredOutstanding.length} required before scheduling</span>` : ''}.</p>`;
      }

      if (!tasks.length) { listEl.innerHTML = `<p class="subtitle">No tasks yet.</p>`; return; }

      const staffName = (id) => (staff || []).find(s => s.id === id)?.full_name || 'Someone';

      listEl.innerHTML = tasks.map(t => {
        const who = t.assigned_to_user_id ? staffName(t.assigned_to_user_id) : t.assigned_to_role ? `Anyone in ${t.assigned_to_role}` : 'Unassigned';
        return `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--border); ${t.completed ? 'opacity:0.5;' : ''}">
            <div>
              <span style="${t.completed ? 'text-decoration:line-through;' : ''}">${t.description}</span>
              <p class="subtitle" style="margin:2px 0 0; font-size:12px;">${who}${t.required_before_scheduling ? ' &middot; <span style="color:var(--red);">Required before scheduling</span>' : ''}</p>
            </div>
            ${!t.completed ? `<button type="button" class="secondary complete-job-task-btn" data-id="${t.id}" style="font-size:12px; padding:6px 10px;">Done</button>` : ''}
          </div>`;
      }).join('');

      listEl.querySelectorAll('.complete-job-task-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const { data: { user } } = await supabaseClient.auth.getUser();
          await supabaseClient.from('job_tasks').update({
            completed: true, completed_by: user.id, completed_at: new Date().toISOString(),
          }).eq('id', btn.dataset.id);
          await loadJobTasks(projectId);
        });
      });

      const addBtn = document.getElementById('add-task-btn');
      if (addBtn) addBtn.onclick = () => openAddTaskPanel(projectId);
    }

    async function openAddTaskPanel(projectId) {
      const { data: staff } = await supabaseClient.from('profiles').select('id, full_name').order('full_name');
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:420px; width:100%;">
          <h2>Add task</h2>
          <label style="margin-top:0">Description</label>
          <input id="at-desc" placeholder="e.g. Check POs and order stock" />
          <label>Assign to</label>
          <select id="at-assign-type">
            <option value="none">Leave unassigned - anyone can pick it up</option>
            <option value="person">A specific person</option>
            <option value="role">A role</option>
          </select>
          <div id="at-person-section" style="display:none; margin-top:8px;">
            <select id="at-person">${(staff || []).map(s => `<option value="${s.id}">${s.full_name}</option>`).join('')}</select>
          </div>
          <div id="at-role-section" style="display:none; margin-top:8px;">
            <select id="at-role">
              <option value="admin">Admin</option>
              <option value="finance">Finance</option>
              <option value="sales">Sales</option>
              <option value="staff">Staff</option>
            </select>
          </div>
          <label style="margin-top:14px; display:flex; align-items:center; gap:8px;">
            <input type="checkbox" id="at-required" style="width:auto;" /> Required before this job can be scheduled
          </label>
          <div style="margin-top:14px;">
            <button id="at-save-btn">Add task</button>
            <button type="button" class="secondary" id="at-cancel-btn">Cancel</button>
          </div>
          <div id="at-msg"></div>
        </div>`;
      document.body.appendChild(overlay);

      overlay.querySelector('#at-assign-type').addEventListener('change', (e) => {
        overlay.querySelector('#at-person-section').style.display = e.target.value === 'person' ? 'block' : 'none';
        overlay.querySelector('#at-role-section').style.display = e.target.value === 'role' ? 'block' : 'none';
      });

      overlay.querySelector('#at-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#at-save-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#at-msg');
        const description = overlay.querySelector('#at-desc').value.trim();
        if (!description) { msg.innerHTML = `<div class="error-box">Enter a description.</div>`; return; }
        const assignType = overlay.querySelector('#at-assign-type').value;

        try {
          const { data: { user } } = await supabaseClient.auth.getUser();
          const { error } = await supabaseClient.from('job_tasks').insert({
            project_id: projectId,
            description,
            assigned_to_user_id: assignType === 'person' ? overlay.querySelector('#at-person').value : null,
            assigned_to_role: assignType === 'role' ? overlay.querySelector('#at-role').value : null,
            required_before_scheduling: overlay.querySelector('#at-required').checked,
            created_by: user.id,
          });
          if (error) throw error;
          overlay.remove();
          await loadJobTasks(projectId);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        }
      });
    }

    // The "Cost allocated" stat's accrued labour figure is a sum of real
    // clocked time - this lets whoever can see that stat drill into the
    // timesheet entries behind it, and (admin only) correct which stage
    // an entry's hours are attributed to, or reclassify it as office/
    // training/other time entirely.
    async function openTimesheetDrilldown(project, pricingVisible) {
      const centres = (project.cost_centres || []).slice().sort((a, b) => a.sort_order - b.sort_order);
      const myRole = await getMyRole();
      const isAdmin = myRole === 'admin';

      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:640px; width:100%; max-height:85vh; overflow-y:auto;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <h2 style="margin:0;">Timesheets on this job</h2>
            <button type="button" class="secondary" id="td-close-btn">Close</button>
          </div>
          <p class="subtitle" style="margin-bottom:14px;">${isAdmin ? 'As admin you can correct which stage an entry belongs to, or move it to office/non-job time.' : 'Read-only - admins can edit the cost centre / office time split.'}</p>
          <div id="td-msg"></div>
          <div id="td-list"><p class="subtitle">Loading...</p></div>
        </div>`;
      document.body.appendChild(overlay);
      overlay.querySelector('#td-close-btn').addEventListener('click', () => overlay.remove());

      const centreName = (id) => centres.find(c => c.id === id)?.name || 'Unknown stage';
      const stageLabel = (entry) => {
        if (entry.time_category && entry.time_category !== 'job') {
          return entry.time_category.charAt(0).toUpperCase() + entry.time_category.slice(1);
        }
        const ids = (entry.selected_cost_centre_ids && entry.selected_cost_centre_ids.length)
          ? entry.selected_cost_centre_ids
          : (entry.cost_centre_id ? [entry.cost_centre_id] : []);
        return ids.length ? ids.map(centreName).join(', ') : 'Unassigned';
      };
      const hoursFor = (entry) => entry.clock_out
        ? Math.round(((new Date(entry.clock_out) - new Date(entry.clock_in)) / 3600000) * 100) / 100
        : null;

      async function refreshList() {
        const listEl = overlay.querySelector('#td-list');
        const { data: entries, error } = await supabaseClient
          .from('time_entries')
          .select('id, staff_id, clock_in, clock_out, cost_centre_id, selected_cost_centre_ids, time_category, profiles(full_name)')
          .eq('project_id', project.id)
          .order('clock_in', { ascending: false });
        if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }
        if (!entries.length) { listEl.innerHTML = `<p class="subtitle">No timesheet entries logged against this job yet.</p>`; return; }

        listEl.innerHTML = `
          <table class="responsive-stack">
            <thead><tr><th>Staff</th><th>Date</th><th class="num">Hours</th><th>Stage / category</th>${isAdmin ? '<th></th>' : ''}</tr></thead>
            <tbody>
              ${entries.map(e => {
                const hrs = hoursFor(e);
                return `
                <tr data-entry-id="${e.id}">
                  <td data-label="Staff">${e.profiles?.full_name || 'Unknown'}</td>
                  <td data-label="Date">${new Date(e.clock_in).toLocaleDateString()}</td>
                  <td class="num" data-label="Hours">${hrs === null ? 'In progress' : hrs.toFixed(2)}</td>
                  <td data-label="Stage / category">${stageLabel(e)}</td>
                  ${isAdmin ? `<td><button type="button" class="secondary td-edit-btn" data-id="${e.id}" style="font-size:12px; padding:4px 8px;">Edit</button></td>` : ''}
                </tr>
                <tr class="td-edit-row" data-edit-for="${e.id}" style="display:none;"><td colspan="${isAdmin ? 5 : 4}"></td></tr>`;
              }).join('')}
            </tbody>
          </table>`;

        if (!isAdmin) return;
        listEl.querySelectorAll('.td-edit-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const entry = entries.find(e => e.id === btn.dataset.id);
            openEditRow(entry);
          });
        });
      }

      function openEditRow(entry) {
        const editCell = overlay.querySelector(`tr[data-edit-for="${entry.id}"] td`);
        const selectedIds = (entry.selected_cost_centre_ids && entry.selected_cost_centre_ids.length)
          ? entry.selected_cost_centre_ids
          : (entry.cost_centre_id ? [entry.cost_centre_id] : []);
        const category = entry.time_category && entry.time_category !== 'job' ? entry.time_category : 'job';

        editCell.innerHTML = `
          <div style="padding:10px; background:var(--surface-2); border-radius:8px;">
            <label style="margin-top:0;">Category</label>
            <select class="td-category">
              <option value="job" ${category === 'job' ? 'selected' : ''}>Job - split across stage(s) below</option>
              <option value="office" ${category === 'office' ? 'selected' : ''}>Office / admin</option>
              <option value="training" ${category === 'training' ? 'selected' : ''}>Training</option>
              <option value="other" ${category === 'other' ? 'selected' : ''}>Other</option>
            </select>
            <div class="td-stage-section" style="margin-top:8px; ${category === 'job' ? '' : 'display:none;'}">
              <label>Stage(s) - tick every stage this entry's hours count against</label>
              ${centres.map(c => `
                <label style="display:flex; align-items:center; gap:8px; font-weight:400; margin-top:6px;">
                  <input type="checkbox" class="td-stage-check" value="${c.id}" style="width:auto;" ${selectedIds.includes(c.id) ? 'checked' : ''} />
                  ${c.name}
                </label>`).join('')}
            </div>
            <div style="margin-top:12px;">
              <button type="button" class="td-save-btn">Save</button>
              <button type="button" class="secondary td-cancel-btn">Cancel</button>
            </div>
            <div class="td-edit-msg"></div>
          </div>`;
        editCell.closest('tr').style.display = 'table-row';

        editCell.querySelector('.td-category').addEventListener('change', (e) => {
          editCell.querySelector('.td-stage-section').style.display = e.target.value === 'job' ? '' : 'none';
        });
        editCell.querySelector('.td-cancel-btn').addEventListener('click', () => {
          editCell.closest('tr').style.display = 'none';
          editCell.innerHTML = '';
        });
        editCell.querySelector('.td-save-btn').addEventListener('click', async () => {
          const msg = editCell.querySelector('.td-edit-msg');
          const newCategory = editCell.querySelector('.td-category').value;
          const checkedIds = Array.from(editCell.querySelectorAll('.td-stage-check:checked')).map(el => el.value);
          if (newCategory === 'job' && !checkedIds.length) {
            msg.innerHTML = `<div class="error-box">Tick at least one stage, or choose a non-job category.</div>`;
            return;
          }
          try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const res = await fetch('/.netlify/functions/admin-update-time-entry', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
              body: JSON.stringify({
                entryId: entry.id,
                project_id: newCategory === 'job' ? project.id : null,
                cost_centre_id: newCategory === 'job' && checkedIds.length === 1 ? checkedIds[0] : null,
                selected_cost_centre_ids: newCategory === 'job' && checkedIds.length > 1 ? checkedIds : null,
                time_category: newCategory,
              }),
            });
            const data = await res.json();
            if (!res.ok || !data.ok) throw new Error(data.error || 'Update failed');

            await refreshList();
            const refreshed = await loadProject();
            if (refreshed) render(refreshed, pricingVisible);
          } catch (err) {
            msg.innerHTML = `<div class="error-box">${err.message}</div>`;
          }
        });
      }

      await refreshList();
    }

    async function loadDocuments(projectId) {
      const listEl = document.getElementById('documents-list');
      const pillsEl = document.getElementById('doc-folder-pills');
      const folderSelect = document.getElementById('doc-folder-select');

      const { data: docs, error } = await supabaseClient
        .from('project_documents')
        .select('*, profiles(full_name)')
        .eq('project_id', projectId)
        .order('created_at', { ascending: false });
      if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }

      const folders = [...new Set((docs || []).map(d => d.folder))].sort();
      const folderOptions = ['General', ...folders.filter(f => f !== 'General')];
      folderSelect.innerHTML = folderOptions.map(f => `<option value="${f}">${f}</option>`).join('');

      pillsEl.innerHTML = ['All', ...folders].map(f => `
        <button type="button" class="secondary doc-folder-pill" data-folder="${f}" style="font-size:12px; padding:6px 12px; ${f === selectedDocFolder ? 'background:var(--accent-dim); color:var(--accent);' : ''}">${f}</button>
      `).join('');
      pillsEl.querySelectorAll('.doc-folder-pill').forEach(btn => {
        btn.addEventListener('click', () => { selectedDocFolder = btn.dataset.folder; loadDocuments(projectId); });
      });

      const visible = selectedDocFolder === 'All' ? (docs || []) : (docs || []).filter(d => d.folder === selectedDocFolder);
      if (!visible.length) {
        listEl.innerHTML = `<p class="subtitle">No documents${selectedDocFolder === 'All' ? '' : ' in this folder'} yet.</p>`;
        return;
      }

      listEl.innerHTML = visible.map(d => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border); gap:10px;">
          <div style="min-width:0;">
            <a href="#" class="link-quiet doc-view-link" data-path="${d.file_path}" style="font-weight:600;">${d.file_name}</a>
            <p class="subtitle" style="margin:2px 0 0; font-size:12px;">${d.folder} &middot; ${d.profiles?.full_name || 'Someone'} &middot; ${new Date(d.created_at).toLocaleDateString('en-AU')}</p>
          </div>
          <button type="button" class="secondary doc-delete-btn" data-id="${d.id}" data-path="${d.file_path}" style="font-size:12px; padding:6px 10px; flex-shrink:0;">Delete</button>
        </div>`).join('');

      listEl.querySelectorAll('.doc-view-link').forEach(a => {
        a.addEventListener('click', async (e) => {
          e.preventDefault();
          try {
            const url = await getSignedDocUrl(a.dataset.path);
            window.open(url, '_blank');
          } catch (err) { alert(err.message); }
        });
      });
      listEl.querySelectorAll('.doc-delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this document? This removes the file permanently.')) return;
          try {
            await supabaseClient.storage.from('project-documents').remove([btn.dataset.path]);
            const { error: delErr } = await supabaseClient.from('project_documents').delete().eq('id', btn.dataset.id);
            if (delErr) throw delErr;
            await logActivity('project', projectId, 'document_deleted', 'Deleted a document');
            await loadDocuments(projectId);
          } catch (err) { alert(err.message); }
        });
      });
    }

    function wireDocumentUpload(project) {
      document.getElementById('doc-upload-btn').addEventListener('click', async () => {
        const btn = document.getElementById('doc-upload-btn');
        const fileInput = document.getElementById('doc-file-input');
        const msg = document.getElementById('doc-upload-msg');
        const newFolder = document.getElementById('doc-new-folder').value.trim();
        const folder = newFolder || document.getElementById('doc-folder-select').value || 'General';
        if (!fileInput.files.length) { msg.innerHTML = `<div class="error-box">Choose one or more files first.</div>`; return; }

        msg.innerHTML = '';
        btn.disabled = true;
        btn.textContent = 'Uploading...';
        try {
          const { data: { user } } = await supabaseClient.auth.getUser();
          for (const file of fileInput.files) {
            const path = await uploadPrivateFile(file, `documents/${project.id}`);
            const { error } = await supabaseClient.from('project_documents').insert({
              project_id: project.id, folder, file_path: path, file_name: file.name, mime_type: file.type, uploaded_by: user.id,
            });
            if (error) throw error;
          }
          await logActivity('project', project.id, 'documents_uploaded', `Uploaded ${fileInput.files.length} document${fileInput.files.length === 1 ? '' : 's'} to ${folder}`);
          fileInput.value = '';
          document.getElementById('doc-new-folder').value = '';
          selectedDocFolder = folder;
          await loadDocuments(project.id);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        } finally {
          btn.disabled = false;
          btn.textContent = 'Upload';
        }
      });
    }
