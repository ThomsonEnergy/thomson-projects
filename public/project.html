  <script>
    const params = new URLSearchParams(window.location.search);
    const projectId = params.get('id');

    function entryHours(te) { return (new Date(te.clock_out) - new Date(te.clock_in)) / 3600000; }

    // Real accrued labour cost, per stage, from each employee's actual pay
    // rates - computed entirely server-side now (get-accrued-labour-cost.js)
    // so an individual's ordinary_rate/rate_1_5x/rate_2x never has to
    // reach any browser, no matter who's viewing this page. Pay rates stay
    // visible only to admin/finance (Settings > Users & Roles).
    async function fetchAccruedLabourCost(projectIds) {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const res = await fetch('/.netlify/functions/get-accrued-labour-cost', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
        body: JSON.stringify({ projectIds }),
      });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || 'Could not load accrued labour cost');
      return data.byProject;
    }

    async function loadProject() {
      const centreCols = await costCentreColumns();
      const { data: project, error } = await supabaseClient
        .from('projects')
        .select(`*, cost_centres(${centreCols}, invoices(*), invoice_claims(*, invoices(id, invoice_number, invoice_token, sent_at, created_at, paid_at, xero_invoice_id)), credit_note_claims(*), cost_centre_line_items(id, item_type, description, quantity, unit_cost, rate_tier_id, sort_order, prebuild_group_id, prebuild_client_description, prebuild_base_quantity), cost_centre_photo_groups(*)),
          project_manager:client_contacts!project_manager_contact_id(name, phone, email),
          site_contact:client_contacts!site_contact_id(name, phone, email),
          job_contact:client_contacts!job_contact_id(name, phone, email),
          sales_contact:client_contacts!sales_contact_id(name, phone, email),
          accounts_contact:client_contacts!accounts_contact_id(name, phone, email),
          source_quote:projects!source_quote_id(id, quote_token, quote_number),
          payment_milestones(*)`)
        .eq('id', projectId)
        .single();
      if (error) {
        document.getElementById('content').innerHTML = `<div class="error-box">${error.message}</div>`;
        return null;
      }

      // Real labour hours/cost per stage - fetched from a serverless
      // function that computes it from time_entries server-side, rather
      // than the get_stage_actual_hours/get_stage_actual_labour_cost
      // database functions (which were undercounting hours - only entries
      // with a direct cost_centre_id match, missing ones still tagged via
      // selected_cost_centre_ids pending a split - and returning the
      // billable SELL rate as if it were a cost), and rather than fetching
      // pay rates directly here, which would expose every employee's
      // ordinary_rate/rate_1_5x/rate_2x to whoever's browser loaded this
      // page. See get-accrued-labour-cost.js.
      let accruedByCentre = {};
      try {
        const byProject = await fetchAccruedLabourCost([projectId]);
        accruedByCentre = byProject[projectId]?.byCentre || {};
      } catch (err) {
        console.error('Accrued labour cost fetch failed:', err.message);
      }
      for (const centre of project.cost_centres || []) {
        centre.actual_hours = accruedByCentre[centre.id]?.actualHours || 0;
        centre.actual_labour_cost = accruedByCentre[centre.id]?.actualLabourCost || 0;
        centre.quoted_hours = (centre.cost_centre_line_items || [])
          .filter(li => li.item_type === 'labour')
          .reduce((sum, li) => sum + (Number(li.quantity) || 0), 0);
      }

      // Real material cost accrued so far - only line items actually
      // received count, so a PO that's just been placed doesn't inflate
      // "accrued" before anything's landed.
      if (project.job_number) {
        const { data: poRows } = await supabaseClient
          .from('purchase_orders')
          .select('purchase_order_line_items(quantity, unit_cost, received)')
          .eq('project_id', projectId);
        project.accrued_material_cost = (poRows || []).reduce((s, po) =>
          s + (po.purchase_order_line_items || [])
                .filter(li => li.received)
                .reduce((s2, li) => s2 + Number(li.quantity) * Number(li.unit_cost), 0), 0);
      } else {
        project.accrued_material_cost = 0;
      }

      // Same real material spend, but per stage - job_material_usage is the
      // authoritative "what actually got used against this cost centre"
      // record (stock draws + PO receipts landed straight on a job), same
      // role for materials that get_stage_actual_labour_cost's time_entries
      // query plays for labour. Unlike time_entries there's no split-pending
      // ambiguity here (each row already has exactly one cost_centre_id),
      // so summing client-side is safe without the caveats that pushed
      // actual_labour_cost out to a serverless function instead.
      if (project.job_number) {
        const { data: usageRows } = await supabaseClient
          .from('job_material_usage')
          .select('cost_centre_id, quantity, unit_cost')
          .eq('project_id', projectId);
        const materialByCentre = {};
        for (const row of usageRows || []) {
          if (!row.cost_centre_id) continue;
          materialByCentre[row.cost_centre_id] = (materialByCentre[row.cost_centre_id] || 0) + Number(row.quantity) * Number(row.unit_cost);
        }
        for (const centre of project.cost_centres || []) {
          centre.actual_material_cost = materialByCentre[centre.id] || 0;
        }
      } else {
        for (const centre of project.cost_centres || []) centre.actual_material_cost = 0;
      }

      // A quote never becomes the job in place any more - approval spins
      // up a separate project row (see create-job-from-quote.js). Once
      // approved, this looks up that job so "Go to job" can link straight
      // to it, rather than just reloading this same page and hoping.
      if (!project.job_number && project.status === 'approved') {
        const { data: resultingJob } = await supabaseClient
          .from('projects')
          .select('id, job_number')
          .eq('source_quote_id', project.id)
          .maybeSingle();
        project.resulting_job = resultingJob || null;
      }

      // This job IS a warranty job - pull just enough of the original
      // job's context (ref + scope of works) for the reference card on
      // the Summary tab. Photos aren't duplicated here, just linked to -
      // see the "View original job's documents" link, which points at
      // the original's own Documents tab instead.
      if (project.warranty_of_project_id) {
        const { data: original } = await supabaseClient
          .from('projects')
          .select('id, name, job_number, sow_text')
          .eq('id', project.warranty_of_project_id)
          .maybeSingle();
        project.warranty_original = original || null;
      }

      // This job HAS warranty jobs against it - net cost of all of them
      // (accrued labour+material, minus whatever each has itself
      // invoiced back out via a manufacturer/client-partial close-out)
      // rolls into "Actual profit" below, since warranty work was never
      // part of the original estimate. Invoiced (not paid) counts as
      // "recovered", same convention the rest of the job's own progress/
      // profit figures already use.
      project.warranty_jobs = [];
      project.net_warranty_cost = 0;
      if (project.job_number && !project.warranty_of_project_id) {
        const { data: warrantyJobs } = await supabaseClient
          .from('projects')
          .select('id, name, job_number, warranty_outcome, warranty_closed_at, cost_centres(id, invoiced_amount)')
          .eq('warranty_of_project_id', project.id)
          .order('created_at');
        if (warrantyJobs && warrantyJobs.length) {
          const warrantyIds = warrantyJobs.map(w => w.id);
          let accruedLabourByProject = {};
          try {
            accruedLabourByProject = await fetchAccruedLabourCost(warrantyIds);
          } catch (err) {
            console.error('Warranty accrued labour fetch failed:', err.message);
          }
          const { data: poRows } = await supabaseClient
            .from('purchase_orders')
            .select('project_id, purchase_order_line_items(quantity, unit_cost, received)')
            .in('project_id', warrantyIds);
          const materialByProject = {};
          (poRows || []).forEach(po => {
            const cost = (po.purchase_order_line_items || []).filter(li => li.received).reduce((s, li) => s + Number(li.quantity) * Number(li.unit_cost), 0);
            materialByProject[po.project_id] = (materialByProject[po.project_id] || 0) + cost;
          });

          project.warranty_jobs = warrantyJobs.map(w => {
            const labourCost = Object.values(accruedLabourByProject[w.id]?.byCentre || {}).reduce((s, c) => s + Number(c.actualLabourCost || 0), 0);
            const materialCost = materialByProject[w.id] || 0;
            const accrued = labourCost + materialCost;
            const invoicedBack = (w.cost_centres || []).reduce((s, c) => s + Number(c.invoiced_amount || 0), 0);
            const net = Math.max(0, accrued - invoicedBack);
            return { id: w.id, name: w.name, job_number: w.job_number, warranty_outcome: w.warranty_outcome, warranty_closed_at: w.warranty_closed_at, accrued, invoicedBack, net };
          });
          project.net_warranty_cost = project.warranty_jobs.reduce((s, w) => s + w.net, 0);
        }
      }

      return project;
    }

    // ============ Full quote editor (ported from new-project.html) ============
    // Lets a quote (no job_number yet) be edited entirely on this page instead
    // of navigating to new-project.html's separate scrolling form. Deliberately
    // NOT offered once a job_number exists - the save path below deletes and
    // re-inserts every cost centre, which would orphan any real invoices, POs,
    // or logged time already attached once a quote's been approved. That's the
    // same "block on real activity" principle as the bulk-delete feature.

    let editMode = false;
    let showLineItems = false;
    let selectedDocFolder = 'All';
    let RATE_TIERS = [];
    let companySettings = {};
    let selectedClientId = null;
    let referencePhotos = [];
    let sowDocs = [];
    let assignedContactIds = {};
    let currentTemplate = 'new_build';
    let templateAnswers = {};

    const TEMPLATE_INFO = {
      new_build: {
        note: 'Multi-stage project with a deposit and full scope of works.',
        photoCategory: 'electrical', singleStage: false, showDeposit: true, showPylon: false,
      },
      solar: {
        note: 'Pylon design link is prominent on the cover page. Defaults to a single stage - add more if needed.',
        photoCategory: 'solar', singleStage: false, showDeposit: true, showPylon: true,
      },
      renovation: {
        note: 'Multi-stage renovation with a deposit. Asks reno-specific questions (asbestos, switchboard, approvals, occupancy) that set up the pre-work and handover tasks.',
        photoCategory: 'electrical', singleStage: false, showDeposit: true, showPylon: false,
      },
      service_work: {
        note: 'Single-stage service call or repair with a deposit. Asks about urgency, access and parts, and sets up the pre-visit and sign-off tasks.',
        photoCategory: 'electrical', singleStage: true, showDeposit: true, showPylon: false,
      },
      quick_estimate: {
        note: 'Single cost centre, no deposit. Clearly labelled "Estimate only" on the client page - invoiced from actual hours and materials, not this figure.',
        photoCategory: 'general', singleStage: true, showDeposit: false, showPylon: false,
      },
    };

    function renumberEditStages() {
      document.querySelectorAll('#cc-rows .cc-row').forEach((row, i) => {
        const label = row.querySelector('.cc-number');
        if (label) label.textContent = `(stage ${i + 1})`;
      });
    }

    function lineItemTotal(li) {
      return (parseFloat(li.querySelector('.li-qty').value) || 0) * (parseFloat(li.querySelector('.li-cost').value) || 0);
    }

    function addLineItem(stageRow, { id = '', description = '', item_type = 'material', quantity = 1, unit_cost = '', rate_tier_id = '', prebuild_group_id = null, prebuild_client_description = null, prebuild_base_quantity = null } = {}, container = null) {
      const li = document.createElement('div');
      li.className = 'li-row';
      li.dataset.id = id;
      // Set only when this line came from "Add a prebuild" - lets the
      // client-facing quote collapse every component added in one click
      // back into a single line showing the prebuild's own client-facing
      // description, without changing how staff see/edit each line here.
      // prebuildBaseQuantity is the un-multiplied per-unit quantity from
      // the master prebuild - lets the group's own quantity control (see
      // renderPrebuildGroup) rescale every component from the same base
      // instead of compounding a rescale-of-a-rescale.
      li.dataset.prebuildGroupId = prebuild_group_id || '';
      li.dataset.prebuildClientDescription = prebuild_client_description || '';
      li.dataset.prebuildBaseQuantity = prebuild_base_quantity ?? '';
      li.style.cssText = 'display:grid; grid-template-columns:2fr 1fr 0.6fr 1fr 1fr auto; gap:8px; margin-bottom:6px; align-items:center;';
      const isLabour = item_type === 'labour';
      const descPlaceholder = isLabour ? 'Optional - defaults to the rate tier name' : 'e.g. Solar panels';
      li.innerHTML = `
        <input class="li-desc" placeholder="${descPlaceholder}" value="${description}" style="font-size:13px;" />
        <select class="li-type" style="font-size:13px;">
          <option value="material" ${item_type === 'material' ? 'selected' : ''}>Material</option>
          <option value="labour" ${item_type === 'labour' ? 'selected' : ''}>Labour</option>
        </select>
        <input class="li-qty" type="number" step="0.01" value="${quantity}" placeholder="${isLabour ? 'Hours' : 'Qty'}" style="font-size:13px;" />
        <select class="li-tier" style="font-size:13px; display:${isLabour ? 'block' : 'none'};">
          <option value="">-- Select tier --</option>
          ${RATE_TIERS.map(t => `<option value="${t.id}" data-rate="${t.sell_rate}" ${rate_tier_id === t.id ? 'selected' : ''}>${t.name} ($${t.sell_rate}/hr)</option>`).join('')}
        </select>
        <input class="li-cost" type="number" step="0.01" value="${unit_cost}" placeholder="Unit cost $" style="font-size:13px; display:${isLabour ? 'none' : 'block'};" />
        <div class="li-total" style="font-size:13px; font-weight:600;">$0.00</div>
        <button type="button" class="secondary li-remove" style="padding:6px 10px; font-size:12px;">x</button>
      `;
      (container || stageRow.querySelector('.li-rows')).appendChild(li);
      const recalc = () => updateStageTotals(stageRow);

      li.querySelector('.li-qty').addEventListener('input', recalc);
      li.querySelector('.li-cost').addEventListener('input', recalc);
      li.querySelector('.li-tier').addEventListener('change', (e) => {
        const selected = e.target.selectedOptions[0];
        li.querySelector('.li-cost').value = selected?.dataset.rate || '';
        recalc();
      });
      li.querySelector('.li-type').addEventListener('change', (e) => {
        const nowLabour = e.target.value === 'labour';
        li.querySelector('.li-qty').placeholder = nowLabour ? 'Hours' : 'Qty';
        li.querySelector('.li-desc').placeholder = nowLabour ? 'Optional - defaults to the rate tier name' : 'e.g. Solar panels';
        li.querySelector('.li-tier').style.display = nowLabour ? 'block' : 'none';
        li.querySelector('.li-cost').style.display = nowLabour ? 'none' : 'block';
        if (nowLabour) {
          const selected = li.querySelector('.li-tier').selectedOptions[0];
          li.querySelector('.li-cost').value = selected?.dataset.rate || '';
        }
        recalc();
      });
      li.querySelector('.li-remove').addEventListener('click', () => { li.remove(); recalc(); });
      updateStageTotals(stageRow);
    }

    function updateStageTotals(stageRow) {
      const items = [...stageRow.querySelectorAll('.li-row')];
      let labour = 0, material = 0;
      items.forEach(li => {
        const total = lineItemTotal(li);
        li.querySelector('.li-total').textContent = money(total);
        if (li.querySelector('.li-type').value === 'labour') labour += total; else material += total;
      });
      // Labour is priced straight off the billable rate tier's sell rate -
      // it's already a sell price, not a cost, so markup only applies to
      // materials (cost price -> sell price). Marking labour up again on
      // top would double the margin already baked into the tier rate.
      const markup = parseFloat(stageRow.querySelector('.cc-markup').value) || 0;
      const salePrice = material * (1 + markup / 100) + labour;
      stageRow.querySelector('.cc-labour-total').textContent = money(labour);
      stageRow.querySelector('.cc-material-total').textContent = money(material);
      stageRow.querySelector('.cc-sale-price').textContent = money(salePrice);
      stageRow.dataset.labourTotal = labour.toFixed(2);
      stageRow.dataset.materialTotal = material.toFixed(2);
      stageRow.dataset.salePrice = salePrice.toFixed(2);
      updateEditTotal();
    }

    // getPrebuilds()/getMaterials()/openStockPicker() are shared - see js/supabase-client.js

    // ---------- payment milestones ----------

    function milestoneRowHtml(m = {}) {
      return `
        <div class="milestone-row" style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
          <input class="milestone-label" placeholder="e.g. On booking install day" value="${m.label || ''}" style="flex:2;" />
          <input class="milestone-percent" type="number" step="1" min="0" max="100" placeholder="%" value="${m.percent ?? ''}" style="flex:1; max-width:90px;" />
          <button type="button" class="secondary remove-milestone-btn" style="padding:8px 10px;">&times;</button>
        </div>`;
    }

    function refreshMilestoneTotal() {
      const total = [...document.querySelectorAll('.milestone-percent')].reduce((s, inp) => s + (parseFloat(inp.value) || 0), 0);
      const rowCount = document.querySelectorAll('.milestone-row').length;
      const note = document.getElementById('milestone-total-note');
      if (!note) return;
      if (!rowCount) { note.textContent = ''; return; }
      note.innerHTML = Math.round(total) === 100
        ? `Total: ${total}% - looks right.`
        : `<span style="color:var(--red);">Total: ${total}% - should add up to 100%.</span>`;
    }

    function wireMilestoneRows() {
      document.querySelectorAll('.remove-milestone-btn').forEach(btn => {
        btn.onclick = () => { btn.closest('.milestone-row').remove(); refreshMilestoneTotal(); };
      });
      document.querySelectorAll('.milestone-percent').forEach(inp => { inp.oninput = refreshMilestoneTotal; });
    }

    function readMilestones() {
      return [...document.querySelectorAll('.milestone-row')]
        .map((row, i) => ({
          label: row.querySelector('.milestone-label').value.trim(),
          percent: parseFloat(row.querySelector('.milestone-percent').value) || 0,
          sort_order: i,
        }))
        .filter(m => m.label && m.percent > 0);
    }

    let pylonKw = null;

    function addRow({
      id = '', name = '', description = '', markup_percent = null, stc_total = 0,
      stc_system_kw = null, stc_zone_rating = null, stc_install_year = null, stc_price_per_certificate = null,
      lineItems = [], photoGroups = [],
    } = {}) {
      const rowsEl = document.getElementById('cc-rows');
      const defaultMarkup = markup_percent !== null ? markup_percent : (parseFloat(document.getElementById('default-markup').value) || 45);
      const defaultStcPrice = stc_price_per_certificate ?? (parseFloat(document.getElementById('default-stc-price').value) || 35);
      const defaultStcZone = Number(stc_zone_rating ?? (parseFloat(document.getElementById('default-stc-zone').value) || 1.382));
      const defaultStcKw = stc_system_kw ?? pylonKw ?? '';
      const defaultStcYear = stc_install_year || new Date().getFullYear();
      const div = document.createElement('div');
      div.className = 'cc-row';
      div.dataset.id = id;
      div.dataset.name = name;
      div.innerHTML = `
        <div class="cc-row-top">
          <div>
            <label style="margin-top:0">Stage name <span class="cc-number" style="color:var(--muted); font-weight:400;"></span></label>
            <input class="cc-name" placeholder="e.g. Rough In" value="${name}" />
          </div>
          <div>
            <label style="margin-top:0">Description</label>
            <input class="cc-desc" placeholder="What's covered in this stage" value="${description}" />
          </div>
        </div>
        <div style="margin-top:12px;">
          <label style="margin-top:0">Line items</label>
          <div class="li-rows"></div>
          <button type="button" class="secondary prebuild-add" style="font-size:12px; padding:6px 12px;">+ Search material / prebuild</button>
          <button type="button" class="secondary li-add" style="font-size:12px; padding:6px 12px;">+ Add custom line</button>
        </div>
        <div style="margin-top:16px;">
          <label style="margin-top:0">Photos for this stage</label>
          <div class="photo-groups"></div>
          <button type="button" class="secondary pg-add" style="font-size:12px; padding:6px 12px;">+ Add photo group</button>
        </div>
        <div class="cc-row-costs" style="grid-template-columns: 1fr 1fr 0.7fr 1fr;">
          <div><label style="margin-top:0">Labour total</label><div class="readout cc-labour-total">$0.00</div></div>
          <div><label style="margin-top:0">Materials total</label><div class="readout cc-material-total">$0.00</div></div>
          <div><label style="margin-top:0">Markup %</label><input class="cc-markup" type="number" step="1" value="${defaultMarkup}" /></div>
          <div><label style="margin-top:0">Sale price</label><div class="readout cc-sale-price">$0.00</div></div>
        </div>
        <div style="margin-top:10px; padding:12px; background:var(--surface-2); border-radius:8px;">
          <label style="margin-top:0; font-weight:600;">STC credit (optional)</label>
          <div class="grid cols-4" style="margin-top:6px;">
            <div><label style="margin-top:0; font-size:12px;">System size (kW)</label><input class="cc-stc-kw" type="number" step="0.01" value="${defaultStcKw}" placeholder="0.00" /></div>
            <div>
              <label style="margin-top:0; font-size:12px;">Zone rating</label>
              <select class="cc-stc-zone">
                ${STC_ZONES.map(z => `<option value="${z.rating}" ${defaultStcZone === z.rating ? 'selected' : ''}>${z.label}</option>`).join('')}
              </select>
            </div>
            <div><label style="margin-top:0; font-size:12px;">Install year</label><input class="cc-stc-year" type="number" step="1" value="${defaultStcYear}" /></div>
            <div><label style="margin-top:0; font-size:12px;">$ per STC</label><input class="cc-stc-price" type="number" step="0.01" value="${defaultStcPrice}" /></div>
          </div>
          <p class="subtitle cc-stc-calc-line" style="margin:8px 0 0;"></p>
          <label style="margin-top:10px;">STC total ($) - auto-filled from the calculator above, or type your own</label>
          <input class="cc-stc-total" type="number" step="0.01" value="${stc_total}" placeholder="0.00" />
        </div>
        <div style="text-align:right; margin-top:10px;">
          <button type="button" class="secondary remove-row">Remove stage</button>
        </div>`;
      rowsEl.appendChild(div);
      renumberEditStages();

      function recalcStc() {
        const kw = parseFloat(div.querySelector('.cc-stc-kw').value) || 0;
        const zoneRating = parseFloat(div.querySelector('.cc-stc-zone').value) || 0;
        const installYear = parseInt(div.querySelector('.cc-stc-year').value, 10) || new Date().getFullYear();
        const price = parseFloat(div.querySelector('.cc-stc-price').value) || 0;
        const qty = calculateStcQuantity({ kw, zoneRating, installYear });
        div.querySelector('.cc-stc-calc-line').textContent = qty
          ? `= ${qty} STCs x ${money(price)} = ${money(qty * price)}`
          : '';
        if (qty) div.querySelector('.cc-stc-total').value = (qty * price).toFixed(2);
      }
      div.querySelectorAll('.cc-stc-kw, .cc-stc-zone, .cc-stc-year, .cc-stc-price').forEach(el => {
        el.addEventListener('input', recalcStc);
        el.addEventListener('change', recalcStc);
      });
      recalcStc();

      div.querySelector('.cc-markup').addEventListener('input', () => updateStageTotals(div));
      div.querySelector('.cc-name').addEventListener('input', (e) => { div.dataset.name = e.target.value.trim(); });
      div.querySelector('.li-add').addEventListener('click', () => addLineItem(div));
      div.querySelector('.prebuild-add').addEventListener('click', () => openStockPicker(div));
      div.querySelector('.pg-add').addEventListener('click', () => addPhotoGroup(div));
      div.querySelector('.remove-row').addEventListener('click', () => { div.remove(); updateEditTotal(); renumberEditStages(); });
      if (TEMPLATE_INFO[currentTemplate].singleStage) div.querySelector('.remove-row').style.display = 'none';

      renderStageLineItems(div, lineItems);

      photoGroups.forEach(pg => addPhotoGroup(div, pg));
    }

    function addPhotoGroup(stageRow, { description = '', photos = [] } = {}) {
      const pg = document.createElement('div');
      pg.className = 'pg-row';
      pg.style.cssText = 'border:1px solid var(--border); border-radius:8px; padding:10px 12px; margin-bottom:10px;';
      pg.dataset.photos = JSON.stringify(photos);
      pg.innerHTML = `
        <input class="pg-desc" placeholder="e.g. Existing switchboard" value="${description}" style="margin-bottom:8px;" />
        <div class="pg-thumbs" style="margin-bottom:8px;"></div>
        <input type="file" class="pg-file" accept="image/*" multiple style="font-size:12px;" />
        <button type="button" class="secondary pg-remove" style="font-size:12px; padding:6px 12px;">Remove group</button>
      `;
      stageRow.querySelector('.photo-groups').appendChild(pg);

      const renderThumbs = () => {
        const arr = JSON.parse(pg.dataset.photos);
        renderPhotoThumbs(pg.querySelector('.pg-thumbs'), arr, () => { pg.dataset.photos = JSON.stringify(arr); });
      };
      renderThumbs();

      // Fires the moment photos are chosen - previously needed a second
      // "Upload" click that staff often skipped, assuming picking the
      // file was already the whole job done.
      pg.querySelector('.pg-file').addEventListener('change', async () => {
        const fileInput = pg.querySelector('.pg-file');
        if (!fileInput.files.length) return;
        const urls = await uploadPhotos(fileInput.files, 'stage-photos');
        const arr = JSON.parse(pg.dataset.photos);
        arr.push(...urls);
        pg.dataset.photos = JSON.stringify(arr);
        fileInput.value = '';
        renderThumbs();
      });
      pg.querySelector('.pg-remove').addEventListener('click', () => pg.remove());
    }

      if (document.getElementById('google-places-script')) return;

      script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(apiKey)}&libraries=places&callback=_initEditAddressAutocomplete`;

    function initEditAddressAutocomplete() {
      const input = document.getElementById('p-address');
      if (!input) return;
      const autocomplete = new google.maps.places.Autocomplete(input, {
        componentRestrictions: { country: 'au' }, fields: ['formatted_address'], types: ['address'],
      });
      autocomplete.addListener('place_changed', () => {
        const place = autocomplete.getPlace();
        if (place && place.formatted_address) input.value = place.formatted_address;
      });
    }

    async function wireEditForm(project) {
      // Once a job number exists, editing is scoped to Cost Centres only -
      // the Details tab (client/template/SOW/deposit/Pylon/T&Cs) stays
      // read-only, so all of that wiring below is quote-edit only.
      const isQuoteEdit = !project.job_number;

      try {
      if (isQuoteEdit) {
      document.querySelectorAll('.template-option').forEach(btn => btn.addEventListener('click', () => applyEditTemplate(btn.dataset.template, true)));

      document.getElementById('clear-client-btn').addEventListener('click', () => {
        document.getElementById('client-search-input').value = '';
        setSelectedEditClient(null);
        loadEditJobContactPickers(null);
      });

      let clientSearchTimeout = null;
      document.getElementById('client-search-input').addEventListener('input', (e) => {
        clearTimeout(clientSearchTimeout);
        const q = e.target.value.trim();
        const resultsEl = document.getElementById('client-search-results');
        if (q.length < 2) { resultsEl.style.display = 'none'; return; }
        clientSearchTimeout = setTimeout(async () => {
          const { data, error } = await supabaseClient.from('clients').select('*')
            .or(`name.ilike.%${q}%,email.ilike.%${q}%,phone.ilike.%${q}%`).limit(8);
          if (error || !data || !data.length) {
            resultsEl.innerHTML = `<div style="padding:10px 12px; font-size:13px; color:var(--muted);">No matches</div>`;
            resultsEl.style.display = 'block';
            return;
          }
          resultsEl.innerHTML = data.map(c => `
            <div class="client-result" data-id="${c.id}" style="padding:8px 12px; cursor:pointer; font-size:13px; border-bottom:1px solid var(--border);">
              <div style="font-weight:600;">${c.name}</div>
              <div style="color:var(--muted); font-size:12px;">${[c.email, c.phone].filter(Boolean).join(' &middot; ')}</div>
            </div>`).join('');
          resultsEl.querySelectorAll('.client-result').forEach(row => {
            row.addEventListener('click', () => {
              const client = data.find(c => c.id === row.dataset.id);
              document.getElementById('client-search-input').value = client.name;
              setSelectedEditClient(client);
              loadEditJobContactPickers(client.id);
            });
          });
          resultsEl.style.display = 'block';
        }, 250);
      });

      document.getElementById('sow-doc-file').addEventListener('change', async () => {
        const fileInput = document.getElementById('sow-doc-file');
        const msg = document.getElementById('sow-doc-msg');
        if (!fileInput.files.length) return;
        msg.innerHTML = `<p class="subtitle">Uploading...</p>`;
        try {
          for (const file of fileInput.files) {
            const path = await uploadPrivateFile(file, 'sow-source');
            sowDocs.push({ path, name: file.name, mime: file.type });
          }
