    function renderCcewUploadForm(project) {
      const el = document.getElementById('ccew-section');
      el.innerHTML = `
        <label style="margin-top:0">Upload the certificate</label>
        <input type="file" id="ccew-file-input" accept=".pdf,.jpg,.jpeg,.png" />
        <p class="subtitle" style="margin:10px 0 4px;">Or, if this job isn't electrical work and no CCEW applies:</p>
        <input id="ccew-reason-input" placeholder="e.g. Not electrical work" />
        <button id="ccew-save-reason-btn" style="margin-top:8px;">Save reason</button>
        <div id="ccew-msg"></div>`;

      el.querySelector('#ccew-file-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const msg = el.querySelector('#ccew-msg');
        msg.innerHTML = `<p class="subtitle">Uploading...</p>`;
        try {
          const path = await uploadPrivateFile(file, `ccew/${project.id}`);
          const { error } = await supabaseClient.from('projects').update({ ccew_file_path: path, ccew_not_required_reason: null }).eq('id', project.id);
          if (error) throw error;
          project.ccew_file_path = path;
          project.ccew_not_required_reason = null;
          await initCcewSection(project);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
        }
      });

      el.querySelector('#ccew-save-reason-btn').addEventListener('click', async () => {
        const reason = el.querySelector('#ccew-reason-input').value.trim();
        const msg = el.querySelector('#ccew-msg');
        if (!reason) { msg.innerHTML = `<div class="error-box">Enter a reason.</div>`; return; }
        const { error } = await supabaseClient.from('projects').update({ ccew_not_required_reason: reason, ccew_file_path: null }).eq('id', project.id);
        if (error) { msg.innerHTML = `<div class="error-box">${error.message}</div>`; return; }
        project.ccew_not_required_reason = reason;
        project.ccew_file_path = null;
        await initCcewSection(project);
      });
    }

    function render(project, pricingVisible) {
      const centres = project.cost_centres.sort((a, b) => a.sort_order - b.sort_order);
      const quoted = centres.reduce((s, c) => s + Number(c.quoted_amount || 0), 0);
      // estimated_labour_cost is a SELL total (hours x the rate tier's sell
      // rate - there's no separate cost rate in this app), not a cost. For
      // the cost/profit breakdown below we need an actual cost, so it's
      // backed out using the same cost->sell relationship materials use
      // (sell = cost x (1 + markup%)), per stage since markup% varies.
      const labourSellTotal = centres.reduce((s, c) => s + Number(c.estimated_labour_cost || 0), 0);
      const labourCostTotal = centres.reduce((s, c) => {
        const markupFactor = 1 + (Number(c.markup_percent) || 45) / 100;
        return s + (Number(c.estimated_labour_cost) || 0) / markupFactor;
      }, 0);
      const materialCostTotal = centres.reduce((s, c) => s + Number(c.estimated_material_cost || 0), 0);
      const cost = labourCostTotal + materialCostTotal;
      const invoiced = centres.reduce((s, c) => s + Number(c.invoiced_amount || 0), 0);
      const profit = quoted - cost;
      const pctComplete = quoted ? Math.min(100, Math.round((invoiced / quoted) * 100)) : 0;
      const remaining = Math.max(0, quoted - invoiced);
      const quoteUrl = `${window.location.origin}/quote.html?token=${project.quote_token}`;
      const actualLabourTotal = centres.reduce((s, c) => s + Number(c.actual_labour_cost || 0), 0);
      const quotedHoursTotal = centres.reduce((s, c) => s + Number(c.quoted_hours || 0), 0);
      const actualHoursTotal = centres.reduce((s, c) => s + Number(c.actual_hours || 0), 0);

      // "Cost allocated" and "Profit" on jobs must always reflect real
      // spend, never the estimate - accrued labour comes from logged
      // timesheets (actual_labour_cost, per stage), accrued materials
      // from PO line items that have actually been received. Net warranty
      // cost (any warranty jobs raised against this one, minus whatever
      // each has itself recovered - see loadProject()) folds in here too,
      // never into the quoted/estimated side, since warranty work by
      // definition wasn't part of the original estimate.
      const accruedMaterialTotal = Number(project.accrued_material_cost) || 0;
      const netWarrantyCost = Number(project.net_warranty_cost) || 0;
      const accruedTotal = actualLabourTotal + accruedMaterialTotal + netWarrantyCost;
      const accruedProfit = quoted - accruedTotal;
      const costBarMax = Math.max(cost, accruedTotal, 1);
      const estimatedBarPct = Math.round((cost / costBarMax) * 100);
      const accruedBarPct = Math.round((accruedTotal / costBarMax) * 100);
      const accruedOverEstimate = accruedTotal > cost;
      const isAccepted = ['accepted', 'approved', 'in_progress', 'complete'].includes(project.status);
      // A quote that's been approved is a frozen historical record - the
      // job it became is a separate project, edited from there instead.
      const isFrozenQuote = !project.job_number && project.status === 'approved';
      // Skipped the quote/estimate step entirely (dashboard.html's
      // "+ New job (no quote)") - quoted_amount is 0 on its one cost
      // centre, so every quote/estimate/% figure above is meaningless for
      // this job. Invoiced off whatever's actually accrued instead (see
      // openInvoiceActualCostsPanel), not a % of a quote that never existed.
      const isQuoteFree = project.proposal_template === 'direct_job';

      const content = document.getElementById('content');
      const numberLine = [
        project.job_number ? `J${project.job_number}` : null,
        project.quote_number ? `Q${project.quote_number}` : null,
      ].filter(Boolean).join(' &middot; ');

      // Quoted-split donut (Materials/Labour/Profit) - only meaningful
      // when there's a positive quote and cost hasn't blown past it;
      // otherwise a slice would go negative, which conic-gradient can't
      // render, so we fall back to a plain text line instead.
      const donutOk = pricingVisible && quoted > 0 && profit >= 0;
      let materialsPct = 0, labourPct = 0;
      if (donutOk) {
        materialsPct = Math.min(100, Math.round((materialCostTotal / quoted) * 1000) / 10);
        labourPct = Math.min(100 - materialsPct, Math.round((labourCostTotal / quoted) * 1000) / 10);
      }
      const profitPct = donutOk ? Math.max(0, Math.round((100 - materialsPct - labourPct) * 10) / 10) : 0;

      // Job split - the same breakdown, but from real spend instead of the
      // estimate: accrued materials/labour (see "Estimated vs accrued
      // cost" above) against the quoted total, so it's directly
      // comparable to the Quoted split donut next to it.
      const jobDonutOk = pricingVisible && !!project.job_number && quoted > 0 && accruedProfit >= 0;
      let actualMaterialsPct = 0, actualLabourPct = 0;
      if (jobDonutOk) {
        actualMaterialsPct = Math.min(100, Math.round((accruedMaterialTotal / quoted) * 1000) / 10);
        actualLabourPct = Math.min(100 - actualMaterialsPct, Math.round((actualLabourTotal / quoted) * 1000) / 10);
      }
      const actualProfitPct = jobDonutOk ? Math.max(0, Math.round((100 - actualMaterialsPct - actualLabourPct) * 10) / 10) : 0;

      const overallBudgetPercent = labourSellTotal > 0 ? Math.round((actualLabourTotal / labourSellTotal) * 100) : 0;
      const overallIsOver = overallBudgetPercent > 100;

      content.innerHTML = `
        <h1>${project.name}</h1>
        <p class="subtitle">${project.client_name} &middot; <span class="badge ${project.status}">${project.status.replace('_',' ')}</span>${numberLine ? ' &middot; ' + numberLine : ''}</p>
        ${isFrozenQuote && project.approved_at ? `<p class="subtitle" style="margin-top:2px;">Approved ${new Date(project.approved_at).toLocaleDateString('en-AU')}${project.approval_note ? ' - ' + project.approval_note : ' - approved online by the client'}</p>` : ''}
        <div style="margin-bottom:20px;">
          ${pricingVisible && !editMode ? `
            ${!isFrozenQuote ? `<button id="edit-toggle-btn" class="secondary">${project.job_number ? 'Edit stages' : 'Edit quote'}</button>` : ''}
            ${!isFrozenQuote ? `<button type="button" id="schedule-staff-btn" class="secondary">Schedule staff</button>` : ''}
            ${!project.job_number ? `<button id="duplicate-btn" class="secondary">Duplicate as new quote</button>` : ''}
            ${project.job_number && project.source_quote?.quote_token ? `<a class="btn secondary" href="/quote.html?token=${project.source_quote.quote_token}" target="_blank">Go to quote</a>` : ''}
            ${isFrozenQuote && project.resulting_job ? `<a class="btn secondary" href="/project.html?id=${project.resulting_job.id}">Go to job${project.resulting_job.job_number ? ' (J' + project.resulting_job.job_number + ')' : ''}</a>` : ''}
            ${!project.job_number && !isAccepted ? `<button type="button" class="secondary" id="mark-approved-btn">Mark approved manually</button>` : ''}
          ` : ''}
          ${editMode ? `
            <button id="save-edit-btn">Save changes</button>
            <button type="button" class="secondary" id="cancel-edit-btn">Cancel</button>
          ` : ''}
          <div id="action-msg"></div>
          <div id="edit-msg"></div>
        </div>

        ${!editMode ? `
        <div id="job-search-wrap">
          <input id="job-search-input" type="search" placeholder="Search this job - documents, photos, tasks, notes, quote items..." autocomplete="off" />
          <button type="button" id="job-search-clear" title="Clear search">&times;</button>
          <div id="job-search-results"></div>
        </div>` : ''}
        <div class="settings-tabs" id="job-tabs" style="flex-direction:row; position:static; border-bottom:1px solid var(--border); margin-bottom:20px; overflow-x:auto;">
          <button class="settings-tab active" data-panel="summary">Summary</button>
          <button class="settings-tab" data-panel="costcentres">Cost Centres</button>
          ${project.job_number && !editMode ? `<button class="settings-tab" data-panel="pos">Purchase Orders</button>` : ''}
          ${project.job_number && !editMode ? `<button class="settings-tab" data-panel="variations">Variations</button>` : ''}
          ${project.job_number && !editMode && pricingVisible ? `<button class="settings-tab" data-panel="invoices">Invoices</button>` : ''}
          <button class="settings-tab" data-panel="details">Details</button>
          ${!editMode ? `<button class="settings-tab" data-panel="feed">Feed</button>` : ''}
          ${!editMode ? `<button class="settings-tab" data-panel="documents">Documents</button>` : ''}
          ${!editMode ? `<button class="settings-tab" data-panel="photos">Site Photos</button>` : ''}
        </div>

        <div class="job-tab-layout">
          <div class="job-tab-main">

            <div class="settings-panel active" id="panel-summary">
              ${!editMode && (project.notes || (TEMPLATE_QUESTIONS[project.proposal_template] && Object.keys(project.template_answers || {}).length)) ? `
              <div class="card">
                ${project.notes ? `
                  <h2>Notes</h2>

      });
      document.querySelectorAll('.push-xero-btn').forEach(btn => {
        btn.addEventListener('click', () => pushExistingInvoiceToXero(btn));
      });

      const editToggleBtn = document.getElementById('edit-toggle-btn');
      if (editToggleBtn) editToggleBtn.addEventListener('click', () => enterEditMode(project));

      document.getElementById('toggle-line-items-btn').addEventListener('click', () => {
        showLineItems = !showLineItems;
        render(project, pricingVisible);
        document.querySelector('#job-tabs .settings-tab[data-panel="costcentres"]').click();
      });

      const scheduleStaffBtn = document.getElementById('schedule-staff-btn');
      if (scheduleStaffBtn) scheduleStaffBtn.addEventListener('click', () => openScheduleStaffPanel(project));

      const markApprovedBtn = document.getElementById('mark-approved-btn');
      if (markApprovedBtn) markApprovedBtn.addEventListener('click', () => openMarkApprovedPanel(project));

      const duplicateBtn = document.getElementById('duplicate-btn');
      if (duplicateBtn) duplicateBtn.addEventListener('click', async () => {
        const btn = document.getElementById('duplicate-btn');
        btn.disabled = true;
        btn.textContent = 'Duplicating...';
        try {
          const { data: fullProject, error: loadErr } = await supabaseClient
            .from('projects')
            .select('*, cost_centres(*, cost_centre_line_items(*), cost_centre_photo_groups(*))')
            .eq('id', project.id)
            .single();
          if (loadErr) throw loadErr;

          // Same draw new-project.html uses for a brand-new quote - a
          // duplicate is a new draft quote too (its own quote_number, no
          // job_number - that gets assigned automatically once it's
          // actually accepted, same as any other quote), not a clone of
          // whatever numbering the source project already had.
          const { data: quoteNum, error: qErr } = await supabaseClient.rpc('get_next_number', { counter_name: 'quote' });
          if (qErr) throw qErr;

          const { data: newProject, error: insErr } = await supabaseClient
            .from('projects')
            .insert({
              name: `${fullProject.name} (copy)`,
              quote_number: quoteNum,
              client_name: fullProject.client_name,
              client_email: fullProject.client_email,
              client_address: fullProject.client_address,
              sow_text: fullProject.sow_text,
              proposal_subtitle: fullProject.proposal_subtitle,
              terms_text: fullProject.terms_text,
              deposit_percent: fullProject.deposit_percent,
              pylon_link: fullProject.pylon_link,
              reference_photos: fullProject.reference_photos,
              cover_photos: fullProject.cover_photos,
              proposal_template: fullProject.proposal_template,
              template_answers: fullProject.template_answers,
            })
            .select()
            .single();
          if (insErr) throw insErr;

          const stages = fullProject.cost_centres.sort((a, b) => a.sort_order - b.sort_order);
          const { data: newStages, error: stagesErr } = await supabaseClient
            .from('cost_centres')
            .insert(stages.map(s => ({
              project_id: newProject.id,
              name: s.name,
              description: s.description,
              sort_order: s.sort_order,
              markup_percent: s.markup_percent,
              estimated_labour_cost: s.estimated_labour_cost,
              estimated_material_cost: s.estimated_material_cost,
              quoted_amount: s.quoted_amount,
              stc_total: s.stc_total,
              stc_system_kw: s.stc_system_kw,
              stc_zone_rating: s.stc_zone_rating,
              stc_install_year: s.stc_install_year,
              stc_price_per_certificate: s.stc_price_per_certificate,
            })))
            .select();
          if (stagesErr) throw stagesErr;

          const allLineItems = [];
          const allPhotoGroups = [];
          stages.forEach((s, i) => {
            // A duplicated prebuild group keeps its grouping (still shows as
            // one line to the client on the new quote) but gets its own
            // fresh group id per distinct source group, rather than literally
            // reusing the original's - that id would otherwise collide
            // across two now-separate quotes.
            const groupIdMap = {};
            (s.cost_centre_line_items || []).forEach(li => {
              let newGroupId = null;
              if (li.prebuild_group_id) {
                if (!groupIdMap[li.prebuild_group_id]) groupIdMap[li.prebuild_group_id] = crypto.randomUUID();
                newGroupId = groupIdMap[li.prebuild_group_id];
              }
              allLineItems.push({
                cost_centre_id: newStages[i].id,
                description: li.description,
                item_type: li.item_type,
                quantity: li.quantity,
                unit_cost: li.unit_cost,
                sort_order: li.sort_order,
                prebuild_group_id: newGroupId,
                prebuild_client_description: li.prebuild_client_description,
                prebuild_base_quantity: li.prebuild_base_quantity,
              });
            });
            (s.cost_centre_photo_groups || []).forEach(pg => {
              allPhotoGroups.push({
                cost_centre_id: newStages[i].id,
                description: pg.description,
                photos: pg.photos,
                sort_order: pg.sort_order,
              });
            });
          });
          if (allLineItems.length) {
            const { error: liErr } = await supabaseClient.from('cost_centre_line_items').insert(allLineItems);
            if (liErr) throw liErr;
          }
          if (allPhotoGroups.length) {
            const { error: pgErr } = await supabaseClient.from('cost_centre_photo_groups').insert(allPhotoGroups);
            if (pgErr) throw pgErr;
          }

          window.location.href = `/new-project.html?id=${newProject.id}`;
        } catch (err) {
          document.getElementById('action-msg').innerHTML = `<div class="error-box">${err.message}</div>`;
          btn.disabled = false;
          btn.textContent = 'Duplicate as new project';
        }
      });

    }

    // For an approval that didn't happen through the client clicking
    // Approve on their own quote page - a phone call, an email, an
    // in-person signature. Requires a note recording how/when consent was
    // actually given, since there's no client click to point to. Does
    // exactly what online acceptance does otherwise: freezes this quote
    // and creates the job as a separate record (manually-approve-quote.js).
    function openMarkApprovedPanel(project) {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:480px; width:100%;">
          <h2>Mark this quote approved</h2>
          <p class="subtitle" style="margin-bottom:12px;">For when the client agreed some other way - by phone, email, or in person - rather than clicking Approve on their own quote page. This does the same thing that would: the quote is frozen as approved, and a new job record is created from it.</p>
          <label style="margin-top:0">How and when was this approved?</label>
          <textarea id="ma-note" placeholder="e.g. Approved by phone call with Jane Smith, 28 Aug 2026" style="min-height:80px;"></textarea>
          <div style="margin-top:14px;">
            <button id="ma-confirm-btn">Mark approved</button>
            <button type="button" class="secondary" id="ma-cancel-btn">Cancel</button>
          </div>
          <div id="ma-msg"></div>
        </div>`;
      document.body.appendChild(overlay);

      overlay.querySelector('#ma-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#ma-confirm-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#ma-msg');
        const note = overlay.querySelector('#ma-note').value.trim();
        if (!note) { msg.innerHTML = `<div class="error-box">A note on how/when the client approved is required.</div>`; return; }

        const confirmBtn = overlay.querySelector('#ma-confirm-btn');
        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Marking approved...';
        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          const res = await fetch('/.netlify/functions/manually-approve-quote', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
            body: JSON.stringify({ quoteId: project.id, note }),
          });
          const data = await res.json();
          if (!res.ok || !data.ok) throw new Error(data.error || 'Could not mark this quote approved');
          overlay.remove();
          location.reload();
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
          confirmBtn.disabled = false;
          confirmBtn.textContent = 'Mark approved';
        }
      });
    }

    // Shared by the quote-stage and job-handover compliance panels - runs
    // check-solar-compliance.js for the given phase, shows what's missing,
    // and offers to turn the gaps into job_tasks via generate-solar-tasks.js
    // (see those functions for what's actually deterministic vs AI-worded).
    async function runComplianceCheck(projectId, phase, taskType, btnEl, resultEl) {
      btnEl.disabled = true;
      const originalLabel = btnEl.textContent;
      btnEl.textContent = 'Checking...';
      resultEl.innerHTML = '';
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        const checkRes = await fetch('/.netlify/functions/check-solar-compliance', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify({ projectId, phase }),
        });
        const checkJson = await checkRes.json();
        if (!checkJson.ok) throw new Error(checkJson.error);

        if (!checkJson.missing.length) {
          resultEl.innerHTML = `<div class="success-box">Everything on the checklist is in place.</div>`;
          return;
        }

        resultEl.innerHTML = `
          <div class="error-box">
            <p style="margin:0 0 8px; font-weight:600;">${checkJson.missing.length} thing${checkJson.missing.length === 1 ? '' : 's'} missing:</p>
            <ul style="margin:0 0 10px; padding-left:18px;">${checkJson.missing.map(m => `<li>${m.label}</li>`).join('')}</ul>
            <button type="button" class="secondary create-compliance-tasks-btn">Create tasks for these</button>
          </div>`;

        resultEl.querySelector('.create-compliance-tasks-btn').addEventListener('click', async (e) => {
          const createBtn = e.target;
          createBtn.disabled = true;
          createBtn.textContent = 'Creating...';
          try {
            const { data: proj } = await supabaseClient.from('projects').select('pylon_data').eq('id', projectId).single();
            const pylonData = proj?.pylon_data || {};
            const equipment = {
              panels: pylonData.module_types || [],
              inverters: pylonData.inverter_types || [],
              batteries: pylonData.storage_types || [],
            };
            const wordRes = await fetch('/.netlify/functions/generate-solar-tasks', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ missing: checkJson.missing, equipment }),
            });
            const wordJson = await wordRes.json();
            if (!wordJson.ok) throw new Error(wordJson.error);

            const { data: { user } } = await supabaseClient.auth.getUser();
            const { error: insErr } = await supabaseClient.from('job_tasks').insert(
              wordJson.tasks.map(t => ({ project_id: projectId, description: t.description, task_type: taskType, created_by: user.id }))
            );
            if (insErr) throw insErr;
            resultEl.innerHTML = `<div class="success-box">${wordJson.tasks.length} task${wordJson.tasks.length === 1 ? '' : 's'} added.</div>`;
            if (typeof loadJobTasks === 'function' && document.getElementById('job-tasks-list')) await loadJobTasks(projectId);
          } catch (err) {
            createBtn.disabled = false;
            createBtn.textContent = 'Create tasks for these';
            resultEl.insertAdjacentHTML('beforeend', `<div class="error-box">${err.message}</div>`);
          }
        });
      } catch (err) {
        resultEl.innerHTML = `<div class="error-box">${err.message}</div>`;
      } finally {
        btnEl.disabled = false;
        btnEl.textContent = originalLabel;
      }
    }

    // Sales-facing "documents to gather from the customer" checklist -
    // separate from the automatic Pylon/system checks above. Same
    // yes/no + conditional-photo item shape as the site inspection
    // checklists (see site-inspection.html), just scoped to
    // checklist_type 'quote_compliance' and answered here inline rather
    // than via a scheduled site visit - it's a conversation with the
    // customer, not a trip.
    async function loadQuoteComplianceChecklist(project) {
      const containerEl = document.getElementById('quote-doc-checklist');
      if (!containerEl) return;

      const { data: template } = await supabaseClient.from('inspection_checklist_templates')
        .select('id, name').eq('checklist_type', 'quote_compliance').eq('active', true).order('sort_order').limit(1).maybeSingle();
      if (!template) {
        containerEl.innerHTML = `<p class="subtitle">No document checklist set up yet - add one under Settings &gt; Inspection Checklists.</p>`;
        return;
      }

      const [{ data: itemsData }, { data: answersData }] = await Promise.all([
        supabaseClient.from('inspection_checklist_items').select('*').eq('template_id', template.id).order('sort_order'),
        supabaseClient.from('quote_compliance_answers').select('*').eq('project_id', project.id),
      ]);
      const items = itemsData || [];
      const answers = {};
      (answersData || []).forEach(a => { answers[a.item_id] = a; });

      function itemsVisible() {
        return items.filter(it => {
          if (!it.parent_item_id) return true;
          const parentAnswer = answers[it.parent_item_id];
          if (!parentAnswer || parentAnswer.answer_yes_no === null || parentAnswer.answer_yes_no === undefined) return false;
          return parentAnswer.answer_yes_no === it.show_when_parent_answer;
        });
      }

      async function saveAnswer(itemId, fields) {
        const { data: { user } } = await supabaseClient.auth.getUser();
        const row = { project_id: project.id, item_id: itemId, answered_by: user?.id || null, answered_at: new Date().toISOString(), ...fields };
        const { data, error } = await supabaseClient.from('quote_compliance_answers').upsert(row, { onConflict: 'project_id,item_id' }).select().single();
        if (error) throw error;
        answers[itemId] = data;
      }

      function renderChecklist() {
        const visible = itemsVisible();
        containerEl.innerHTML = visible.map(it => {
          const a = answers[it.id];
          const isChild = !!it.parent_item_id;
          const answered = it.item_type === 'photo' ? !!a?.photo_path : (a?.answer_yes_no !== null && a?.answer_yes_no !== undefined);
          return `
          <div class="${isChild ? 'insp-child' : ''}">
            <div class="insp-item ${answered ? 'answered' : ''}" data-item-id="${it.id}">
              <div class="insp-label">${it.label}${it.required ? '' : ' <span class="subtitle">(optional)</span>'}</div>
              ${it.description ? `<div class="insp-desc">${it.description}</div>` : ''}
              ${it.item_type === 'yes_no' ? `
                <button type="button" class="insp-yn-btn yn-yes ${a?.answer_yes_no === true ? 'selected' : ''}">Yes</button>
                <button type="button" class="insp-yn-btn secondary yn-no ${a?.answer_yes_no === false ? 'selected' : ''}">No</button>
              ` : `
                ${a?.photo_path ? `<img class="insp-photo-thumb insp-photo-view" src="${a.photo_path}" style="cursor:pointer;" />` : ''}
                <input type="file" class="insp-photo-file" accept="image/*,.pdf" style="display:block; margin-bottom:8px;" />
              `}
              <div class="insp-item-msg"></div>
            </div>
          </div>`;
        }).join('');

        containerEl.querySelectorAll('.insp-item').forEach(el => {
          const itemId = el.dataset.itemId;
          const msgEl = el.querySelector('.insp-item-msg');

          el.querySelectorAll('.yn-yes, .yn-no').forEach(btn => {
            btn.addEventListener('click', async () => {
              try { await saveAnswer(itemId, { answer_yes_no: btn.classList.contains('yn-yes') }); renderChecklist(); }
              catch (err) { msgEl.innerHTML = `<div class="error-box">${err.message}</div>`; }
            });
          });

          const photoViewImg = el.querySelector('.insp-photo-view');
          if (photoViewImg) photoViewImg.addEventListener('click', () => openPhotoLightbox([photoViewImg.src], 0));

          const fileInput = el.querySelector('.insp-photo-file');
          if (fileInput) {
            fileInput.addEventListener('change', async () => {
              if (!fileInput.files.length) return;
              fileInput.disabled = true;
              msgEl.innerHTML = `<p class="subtitle">Uploading...</p>`;
              try {
                const [url] = await uploadPhotos(fileInput.files, `quote-compliance/${project.id}`, 'site-photos');
                await saveAnswer(itemId, { photo_path: url });
                renderChecklist();
              } catch (err) {
                msgEl.innerHTML = `<div class="error-box">${err.message}</div>`;
                fileInput.disabled = false;
              }
            });
          }
        });
      }

      renderChecklist();
    }

    // ---------- Search within a job ----------
    // One search box above the job's tabs. It looks through everything on the
    // job (documents and plan pages, photos, tasks, feed, meetings, notes,
    // equipment, and - for pricing roles - line items, POs, invoices and

    // fetched once when you first type, then filtered in the browser.
    function ensureJobSearchStyles() {

        #job-search-results { margin-top:8px; border:1px solid var(--border); border-radius:10px; background:var(--surface); max-height:70vh; overflow-y:auto; display:none; }
        .js-group-title { font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); padding:10px 14px 4px; }
        .js-result { padding:8px 14px; cursor:pointer; border-top:1px solid var(--border); }
        .js-result:hover, .js-result:focus { background:var(--surface-2); outline:none; }

    function jsCollectStrings(v, out = []) {
      if (v == null) return out;
      if (typeof v === 'string') out.push(v);
      else if (typeof v === 'number') out.push(String(v));
      else if (Array.isArray(v)) v.forEach(x => jsCollectStrings(x, out));
      else if (typeof v === 'object') Object.values(v).forEach(x => jsCollectStrings(x, out));
      return out;
    }

    function initJobSearch(project, pricingVisible) {
      const wrap = document.getElementById('job-search-wrap');
      if (!wrap) return;
      ensureJobSearchStyles();
      const input = document.getElementById('job-search-input');
      const clearBtn = document.getElementById('job-search-clear');
      const resultsEl = document.getElementById('job-search-results');
      const pid = project.id;
      let cache = null;      // { at, items }
      let loading = null;
      let expanded = new Set();

      const goTab = (panel) => { const t = document.querySelector(`#job-tabs .settings-tab[data-panel="${panel}"]`); if (t) t.click(); };
      const flash = (el) => { if (!el) return; el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.remove('js-flash'); void el.offsetWidth; el.classList.add('js-flash'); };
      const textModal = (title, text) => {
        const o = document.createElement('div');
        o.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
        o.innerHTML = `<div class="card" style="max-width:560px; width:100%; max-height:85vh; overflow-y:auto;"><h2 style="margin-top:0;">${escapeHtml(title)}</h2><p style="white-space:pre-wrap;">${escapeHtml(text)}</p><button type="button" class="secondary">Close</button></div>`;
        o.addEventListener('click', (e) => { if (e.target === o || e.target.tagName === 'BUTTON') o.remove(); });
        document.body.appendChild(o);
      };

      async function build() {
        const q = (p) => Promise.resolve(p).then(r => r.data || []).catch(() => []);
        const sb = supabaseClient;
        const [docs, photos, tasks, posts, comments, meetings, fieldNotes, assets, pos, varEntries] = await Promise.all([
          q(sb.from('project_documents').select('id, folder, file_path, file_name, mime_type, page_names, plan_summary').eq('project_id', pid)),
          q(sb.from('project_photos').select('id, url, caption, created_at').eq('project_id', pid).order('created_at', { ascending: false })),
          q(sb.from('job_tasks').select('id, description, notes, parent_task_id, completed').eq('project_id', pid)),
          q(sb.from('feed_posts').select('id, message').eq('project_id', pid)),
          q(sb.from('feed_comments').select('id, post_id, message, feed_posts!inner(project_id)').eq('feed_posts.project_id', pid)),
          q(sb.from('meetings').select('id, title, notes, location').eq('project_id', pid)),
          q(sb.from('project_field_notes').select('id, note, signed_by_name, created_at').eq('project_id', pid)),
          q(sb.from('customer_assets').select('id, name, make, model, serial_numbers, notes').eq('project_id', pid)),
          q(sb.from('purchase_orders').select('id, supplier_name, po_number, description, file_name').eq('project_id', pid)),
          q(sb.from('job_variation_entries').select('id, description, materials').eq('project_id', pid)),
        ]);
        let centres = [], lines = [], invoices = [], variations = [];
        if (pricingVisible) {
          [centres, invoices, variations] = await Promise.all([
            q(sb.from('cost_centres').select('id, name, description').eq('project_id', pid)),
            q(sb.from('invoices').select('id, invoice_number, description').eq('project_id', pid)),
            q(sb.from('variations').select('id, description').eq('project_id', pid)),
          ]);
          if (centres.length) lines = await q(sb.from('cost_centre_line_items').select('id, cost_centre_id, description').in('cost_centre_id', centres.map(c => c.id)));
        }

        const items = [];
        const add = (group, title, fields, open) => items.push({ group, title, fields: fields.filter(Boolean).map(String), open });

        docs.forEach(d => add('Documents', d.file_name, [d.file_name, d.folder, ...jsCollectStrings(d.page_names), ...jsCollectStrings(d.plan_summary)], async () => {
          goTab('documents'); selectedDocFolder = d.folder; await loadDocuments(pid);
          const link = [...document.querySelectorAll('#documents-list .doc-view-link')].find(a => a.dataset.path === d.file_path);
          if (link) { flash(link.closest('.doc-tile')); link.click(); }
        }));
        photos.forEach((p, i) => {
          const fileName = decodeURIComponent((p.url || '').split('?')[0].split('/').pop() || '');
          add('Photos', p.caption || fileName || 'Site photo', [p.caption, fileName.replace(/[-_.]+/g, ' ')], async () => {
            goTab('photos');
            await loadSitePhotos(pid);
            const img = document.querySelector(`#site-photos-list .site-photo-view[data-i="${i}"]`);
            if (img) { flash(img); img.click(); }
          });
        });
        const taskById = Object.fromEntries(tasks.map(t => [t.id, t]));
        tasks.forEach(t => add('Tasks', t.description, [t.description, t.notes], () => {
          goTab('summary');
          const topId = t.parent_task_id && taskById[t.parent_task_id] ? t.parent_task_id : t.id;
          jtExpanded.add(topId); if (t.parent_task_id) jtExpanded.add(t.id);
          const listEl = document.getElementById('job-tasks-list');
          if (listEl && listEl._jt) renderJobTasks(listEl);
          flash(document.querySelector(`#job-tasks-list .jt-item[data-id="${t.id}"]`) || document.getElementById('job-tasks-list'));
        }));
        posts.forEach(p => add('Feed', p.message.length > 70 ? p.message.slice(0, 70) + '...' : p.message, [p.message], () => goTab('feed')));
        comments.forEach(c => add('Feed', 'Comment: ' + (c.message.length > 60 ? c.message.slice(0, 60) + '...' : c.message), [c.message], () => goTab('feed')));
        meetings.forEach(m => add('Meetings', m.title, [m.title, m.notes, m.location], () => { window.location.href = `/meetings.html?id=${m.id}`; }));

        if (project.notes) add('Notes', 'Job notes', [project.notes], () => { goTab('summary'); flash(document.querySelector('#panel-summary .card')); });
        if (project.template_answers) { const t = jsCollectStrings(project.template_answers); if (t.length) add('Notes', 'Job questions and answers', t, () => { goTab('summary'); flash(document.querySelector('#panel-summary .card')); }); }
        if (project.installer_summary) add('Notes', 'Installer summary', [project.installer_summary], () => { goTab('summary'); flash(document.getElementById('installer-summary-text')); });
        if (project.sow_text) add('Notes', 'Scope of work', [project.sow_text], () => textModal('Scope of work', project.sow_text));
        add('Notes', 'Job details', [project.name, project.client_name, project.client_address, project.client_email, project.client_phone, project.nmi, project.panel_serial_numbers, project.inverter_serial_numbers], () => goTab('details'));
        fieldNotes.forEach(n => add('Notes', 'Site visit note ' + new Date(n.created_at).toLocaleDateString('en-AU'), [n.note, n.signed_by_name], () => textModal('Site visit note ' + new Date(n.created_at).toLocaleDateString('en-AU'), n.note)));

        assets.forEach(a => add('Equipment', a.name, [a.name, a.make, a.model, a.serial_numbers, a.notes], () => { goTab('summary'); flash(document.getElementById('assets-card')); }));
        pos.forEach(p => add('Purchase orders', [p.po_number, p.supplier_name].filter(Boolean).join(' - ') || 'Purchase order', [p.po_number, p.supplier_name, p.description, p.file_name], () => goTab('pos')));
        const centreById = Object.fromEntries(centres.map(c => [c.id, c]));
        centres.forEach(c => add('Quote items', c.name, [c.name, c.description], () => goTab('costcentres')));
        lines.forEach(l => add('Quote items', l.description, [l.description, centreById[l.cost_centre_id] && centreById[l.cost_centre_id].name], () => goTab('costcentres')));
        invoices.forEach(i => add('Invoices', i.invoice_number || 'Invoice', [i.invoice_number, i.description], () => goTab('invoices')));
        variations.forEach(v => add('Variations', v.description || 'Variation', [v.description], () => goTab('variations')));
        varEntries.forEach(v => add('Variations', v.description, [v.description, v.materials], () => goTab('variations')));
        return items;
      }

      async function getItems() {
        if (cache && Date.now() - cache.at < 60000) return cache.items;
        if (!loading) loading = build().then(items => { cache = { at: Date.now(), items }; loading = null; return items; }).catch(err => { loading = null; throw err; });
        return loading;
      }

      const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      function highlight(raw, re) {
        return String(raw).split(re).map((part, i) => i % 2 ? `<mark>${escapeHtml(part)}</mark>` : escapeHtml(part)).join('');
      }

      const GROUP_ORDER = ['Documents', 'Photos', 'Tasks', 'Feed', 'Meetings', 'Notes', 'Equipment', 'Quote items', 'Purchase orders', 'Invoices', 'Variations'];
      const GROUP_LIMIT = 5;
      let shown = [];

      async function run() {
        const raw = input.value.trim();
        clearBtn.style.display = input.value ? 'block' : 'none';
        if (raw.length < 2) { resultsEl.style.display = 'none'; resultsEl.innerHTML = ''; return; }
        resultsEl.style.display = 'block';
        if (!cache) resultsEl.innerHTML = '<p class="subtitle" style="padding:12px 14px; margin:0;">Searching this job...</p>';
        let items;
        try { items = await getItems(); } catch (err) { resultsEl.innerHTML = `<div class="error-box" style="margin:10px;">${escapeHtml(err.message)}</div>`; return; }
        if (input.value.trim() !== raw) return; // typed on while loading
        const tokens = raw.toLowerCase().split(/\s+/).filter(Boolean);
        const re = new RegExp('(' + tokens.map(reEsc).join('|') + ')', 'i');
        shown = [];
        const matches = items.map(it => {
          const hay = it.fields.join(' \n ').toLowerCase();
          if (!tokens.every(t => hay.includes(t))) return null;
          // snippet: the first field that contains any of the words
          const field = it.fields.find(f => tokens.some(t => f.toLowerCase().includes(t))) || '';
          const at = field.toLowerCase().indexOf(tokens.find(t => field.toLowerCase().includes(t)) || '');
          let snippet = field.replace(/\s+/g, ' ');
          if (snippet.length > 110) { const from = Math.max(0, at - 40); snippet = (from ? '...' : '') + snippet.slice(from, from + 110) + '...'; }
          return { ...it, snippet };
        }).filter(Boolean);
        if (!matches.length) { resultsEl.innerHTML = `<p class="subtitle" style="padding:12px 14px; margin:0;">Nothing on this job matches "${escapeHtml(raw)}".</p>`; return; }
        resultsEl.innerHTML = GROUP_ORDER.map(g => {
          const rows = matches.filter(m => m.group === g);
          if (!rows.length) return '';
          const open = expanded.has(g);
          const visible = open ? rows : rows.slice(0, GROUP_LIMIT);
          return `<div class="js-group-title">${g} (${rows.length})</div>` + visible.map(m => {
            shown.push(m);
            const showSnippet = m.snippet && m.snippet.toLowerCase() !== String(m.title).toLowerCase();
            return `<div class="js-result" tabindex="0" data-i="${shown.length - 1}">
              <div class="js-result-title">${highlight(m.title, re)}</div>
              ${showSnippet ? `<div class="js-result-snippet">${highlight(m.snippet, re)}</div>` : ''}
            </div>`;
          }).join('') + (rows.length > GROUP_LIMIT && !open ? `<button type="button" class="js-more" data-group="${g}">Show all ${rows.length}</button>` : '');
        }).join('');
      }

      resultsEl.addEventListener('click', async (e) => {
        const more = e.target.closest('.js-more');
        if (more) { expanded.add(more.dataset.group); run(); return; }
        const row = e.target.closest('.js-result');
        if (!row) return;
        const m = shown[Number(row.dataset.i)];
        if (!m) return;
        resultsEl.style.display = 'none';
        try { await m.open(); } catch (err) { alert(err.message); }
      });
      resultsEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && e.target.classList.contains('js-result')) e.target.click(); });

      let timer;
      input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(run, 150); });
      input.addEventListener('focus', () => { if (input.value.trim().length >= 2) run(); else getItems().catch(() => {}); });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { input.value = ''; run(); }
        if (e.key === 'ArrowDown') { const first = resultsEl.querySelector('.js-result'); if (first) { e.preventDefault(); first.focus(); } }
      });
      clearBtn.addEventListener('click', () => { input.value = ''; expanded = new Set(); run(); input.focus(); });
      document.addEventListener('click', (e) => { if (!wrap.contains(e.target)) resultsEl.style.display = 'none'; });
    }

    // ---------- Job card checklist (Google Tasks style) ----------
    // Tasks are grouped Prejob / Onsite / Handover. Each group has a quick-add
    // line (type + Enter), tasks tick off with a checkbox (ticked ones drop
    // into a collapsed "Completed" list and can be un-ticked), and tapping a
    // task opens its details: title, notes, who, due date, star, subtasks,
    // move up / down and delete. The full "+ Add task" panel is still there
    // for the calendar / repeat / required-before-scheduling options.
    let jtExpanded = new Set();
    let jtDoneOpen = new Set();

    function ensureJobTaskStyles() {
      if (document.getElementById('jt-styles')) return;
      const st = document.createElement('style');
      st.id = 'jt-styles';
      st.textContent = `
        .jt-group { margin-bottom:18px; }
        .jt-group h3 { font-size:14px; margin:0 0 6px; }
        .jt-item { border-bottom:1px solid var(--border); }
        .jt-item.sub { margin-left:30px; }
        .jt-row { display:flex; align-items:flex-start; gap:10px; padding:9px 0; }
        .jt-check { width:20px; height:20px; margin-top:2px; flex-shrink:0; cursor:pointer; }
        .jt-main { flex:1; min-width:0; cursor:pointer; }
        .jt-title { font-size:15px; color:var(--text); word-break:break-word; }
        .jt-item.done .jt-title { text-decoration:line-through; color:var(--muted); }
        .jt-meta { font-size:12px; color:var(--muted); margin-top:2px; }
        .jt-star { background:none; border:none; color:var(--muted); font-size:18px; cursor:pointer; padding:0 4px; line-height:1; }
        .jt-star.on { color:#e0a030; }
        .jt-detail { padding:2px 0 12px 30px; display:grid; gap:8px; }
        .jt-detail label { margin:0; font-size:12px; color:var(--muted); }
        .jt-detail textarea { min-height:60px; }
        .jt-detail-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
        .jt-actions { display:flex; gap:6px; flex-wrap:wrap; }
        .jt-actions button { font-size:12px; padding:5px 10px; }
        .jt-quick { margin:4px 0 8px; }
        .jt-done-toggle { background:none; border:none; color:var(--muted); font-size:13px; cursor:pointer; padding:6px 0; }
        @media (max-width: 600px) { .jt-detail-row { grid-template-columns:1fr; } .jt-item.sub { margin-left:18px; } .jt-detail { padding-left:18px; } }
      `;
      document.head.appendChild(st);
    }

    const JT_GROUPS = [
      { key: 'prejob', label: 'Prejob / office', types: ['prejob', 'quote'] },
      { key: 'onsite', label: 'Onsite', types: ['onsite'] },
      { key: 'handover', label: 'Handover (STC/compliance paperwork)', types: ['handover'] },
    ];

    const jtGroupOf = (t) => (JT_GROUPS.find(g => g.types.includes(t.task_type)) || JT_GROUPS[0]).key;

    async function loadJobTasks(projectId, focusSelector) {
      const listEl = document.getElementById('job-tasks-list');
      if (!listEl) return;
      ensureJobTaskStyles();

      // Wired up unconditionally, before any early return below - otherwise
      // a load error (e.g. job_tasks not migrated yet) leaves "+ Add task"
      // silently unresponsive with no listener attached at all.
      const addBtn = document.getElementById('add-task-btn');
      if (addBtn) addBtn.onclick = () => openAddTaskPanel(projectId);

      const [{ data: tasks, error }, { data: staff }] = await Promise.all([
        supabaseClient.from('job_tasks').select('*').eq('project_id', projectId).order('created_at', { ascending: true }),
        supabaseClient.from('profiles').select('id, full_name, active'),
      ]);
      if (error) { listEl.innerHTML = `<div class="error-box">${escapeHtml(error.message)}</div>`; return; }

      const summaryEl = document.getElementById('summary-tasks-line');
      if (summaryEl) {
        const outstanding = (tasks || []).filter(t => !t.completed);
        const requiredOutstanding = outstanding.filter(t => t.required_before_scheduling);
        summaryEl.innerHTML = !outstanding.length
          ? `<p class="subtitle">No open tasks.</p>`
          : `<p class="subtitle">${outstanding.length} task${outstanding.length === 1 ? '' : 's'} outstanding${requiredOutstanding.length ? `, <span style="color:var(--red);">${requiredOutstanding.length} required before scheduling</span>` : ''}.</p>`;
      }

      listEl._jt = { projectId, tasks: tasks || [], staff: staff || [] };
      bindJobTaskEvents(listEl);
      renderJobTasks(listEl);
      if (focusSelector) { const f = listEl.querySelector(focusSelector); if (f) f.focus(); }
    }

    function jtSort(a, b) {
      return (Number(b.starred) - Number(a.starred))
        || ((a.sort_order ?? 1e9) - (b.sort_order ?? 1e9))
        || String(a.created_at).localeCompare(String(b.created_at));
    }

    function renderJobTasks(listEl) {
      const { tasks, staff } = listEl._jt;
      const staffName = (id) => (staff.find(s => s.id === id) || {}).full_name || 'Someone';
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const subsOf = (id) => tasks.filter(t => t.parent_task_id === id).sort((a, b) => (Number(a.completed) - Number(b.completed)) || jtSort(a, b));

      function itemHtml(t, isSub) {
        const subs = isSub ? [] : subsOf(t.id);
        const who = t.assigned_to_user_id ? staffName(t.assigned_to_user_id) : t.assigned_to_role ? `Anyone in ${t.assigned_to_role}` : '';
        const overdue = t.due_date && !t.completed && new Date(t.due_date + 'T00:00:00') < today;
        const due = t.due_date ? new Date(t.due_date + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short' }) : '';
        const bits = [];
        if (who) bits.push(escapeHtml(who));
        if (due) bits.push(`<span style="${overdue ? 'color:var(--red);' : ''}">Due ${due}</span>`);
        if (subs.length) bits.push(`${subs.filter(s => s.completed).length}/${subs.length} subtasks`);
        if (t.notes) bits.push('Has notes');
        if (t.recurrence) bits.push(`Repeats ${t.recurrence}`);
        if (t.schedule_assignment_id) bits.push('On calendar');
        if (t.required_before_scheduling && !t.completed) bits.push('<span style="color:var(--red);">Required before scheduling</span>');
        const open = jtExpanded.has(t.id);
        return `
          <div class="jt-item ${isSub ? 'sub' : ''} ${t.completed ? 'done' : ''}" data-id="${t.id}">
            <div class="jt-row">
              <input type="checkbox" class="jt-check" data-id="${t.id}" ${t.completed ? 'checked' : ''} title="${t.completed ? 'Mark as not done' : 'Tick off'}" />
              <div class="jt-main" data-toggle="${t.id}">
                <div class="jt-title">${escapeHtml(t.description)}</div>
                ${bits.length ? `<div class="jt-meta">${bits.join(' &middot; ')}</div>` : ''}
              </div>
              <button type="button" class="jt-star ${t.starred ? 'on' : ''}" data-act="star" data-id="${t.id}" title="${t.starred ? 'Remove star' : 'Star this task'}">${t.starred ? '&#9733;' : '&#9734;'}</button>
            </div>
            ${open ? `
              <div class="jt-detail">
                <div><label>Task</label><input class="jt-title-edit" data-id="${t.id}" value="${escapeHtml(t.description)}" /></div>
                <div><label>Notes</label><textarea class="jt-notes" data-id="${t.id}" placeholder="Add details...">${escapeHtml(t.notes || '')}</textarea></div>
                <div class="jt-detail-row">
                  <div><label>Assigned to</label><select class="jt-assign" data-id="${t.id}">
                    <option value="">${t.assigned_to_role && !t.assigned_to_user_id ? 'Anyone in ' + escapeHtml(t.assigned_to_role) : 'Unassigned'}</option>
                    ${staff.filter(s => s.active !== false || s.id === t.assigned_to_user_id).sort((a, b) => String(a.full_name).localeCompare(String(b.full_name))).map(s => `<option value="${s.id}" ${s.id === t.assigned_to_user_id ? 'selected' : ''}>${escapeHtml(s.full_name || 'Unnamed')}</option>`).join('')}
                  </select></div>
                  <div><label>Due date</label><input type="date" class="jt-due" data-id="${t.id}" value="${t.due_date || ''}" /></div>
                </div>
                ${!isSub ? `<div><label>Subtasks</label>
                  <input class="jt-sub-add" data-parent="${t.id}" placeholder="Add a subtask and press Enter" style="margin-top:4px;" /></div>` : ''}
                <div class="jt-actions">
                  <button type="button" class="secondary" data-act="up" data-id="${t.id}">Move up</button>
                  <button type="button" class="secondary" data-act="down" data-id="${t.id}">Move down</button>
                  <button type="button" class="secondary" data-act="delete" data-id="${t.id}">Delete</button>
                </div>
              </div>` : ''}
            ${subs.map(s => itemHtml(s, true)).join('')}
          </div>`;
      }

      listEl.innerHTML = JT_GROUPS.map(g => {
        const tops = tasks.filter(t => !t.parent_task_id && jtGroupOf(t) === g.key);
        const openTops = tops.filter(t => !t.completed).sort(jtSort);
        const doneTops = tops.filter(t => t.completed).sort((a, b) => String(b.completed_at || '').localeCompare(String(a.completed_at || '')));
        const showDone = jtDoneOpen.has(g.key);
        return `
          <div class="jt-group" data-group="${g.key}">
            <h3>${g.label}</h3>
            <input class="jt-quick" data-type="${g.key}" placeholder="+ Add a task and press Enter" />
            ${openTops.map(t => itemHtml(t, false)).join('') || (doneTops.length ? '<p class="subtitle" style="margin:4px 0;">All done.</p>' : '<p class="subtitle" style="margin:4px 0;">None.</p>')}
            ${doneTops.length ? `
              <button type="button" class="jt-done-toggle" data-act="toggle-done" data-group="${g.key}">${showDone ? '&#9662;' : '&#9656;'} Completed (${doneTops.length})</button>
              ${showDone ? doneTops.map(t => itemHtml(t, false)).join('') : ''}` : ''}
          </div>`;
      }).join('');
    }

    function bindJobTaskEvents(listEl) {
      if (listEl._jtBound) return;
      listEl._jtBound = true;
      const state = () => listEl._jt;
      const find = (id) => state().tasks.find(t => t.id === id);
      const reload = (focus) => loadJobTasks(state().projectId, focus);
      const patch = async (id, fields) => {
        const { error } = await supabaseClient.from('job_tasks').update(fields).eq('id', id);
        if (error) alert('Could not save that: ' + error.message);
        return !error;
      };

      async function setCompleted(t, done) {
        const { projectId, tasks } = state();
        const { data: { user } } = await supabaseClient.auth.getUser();
        const now = new Date().toISOString();
        const fields = done ? { completed: true, completed_by: user.id, completed_at: now } : { completed: false, completed_by: null, completed_at: null };
        if (!(await patch(t.id, fields))) { await reload(); return; }
        if (done && !t.parent_task_id) {
          // ticking a task finishes its subtasks too
          await supabaseClient.from('job_tasks').update(fields).eq('parent_task_id', t.id).eq('completed', false);
        }
        if (!done && t.parent_task_id) {
          const parent = tasks.find(p => p.id === t.parent_task_id);
          if (parent && parent.completed) await patch(parent.id, fields);
        }
        await logActivity('project', projectId, done ? 'task_completed' : 'task_reopened', `Task ${done ? 'completed' : 'reopened'}: ${t.description || ''}`);
        const top = t.parent_task_id ? tasks.find(p => p.id === t.parent_task_id) : t;
        if (top && top.required_before_scheduling) await refreshPipelineTaskGate(projectId);
        if (done && top && top.task_type === 'handover') await checkAndAdvanceHandover(projectId);
        await reload();
      }

      async function addTask(description, groupKey, parentId) {
        const { projectId, tasks } = state();
        const { data: { user } } = await supabaseClient.auth.getUser();
        const parent = parentId ? find(parentId) : null;
        const siblings = tasks.filter(t => (t.parent_task_id || null) === (parentId || null) && (parent || jtGroupOf(t) === groupKey));
        // Tasks made before ordering existed have no position yet - number
        // them in their current order first so a new one lands at the bottom.
        const ordered = siblings.slice().sort(jtSort);
        if (ordered.some(t => t.sort_order == null)) {
          await Promise.all(ordered.map((t, n) => supabaseClient.from('job_tasks').update({ sort_order: n + 1 }).eq('id', t.id)));
          ordered.forEach((t, n) => { t.sort_order = n + 1; });
        }
        const max = ordered.reduce((m, t) => Math.max(m, t.sort_order ?? 0), 0);
        const { error } = await supabaseClient.from('job_tasks').insert({
          project_id: projectId, description, task_type: parent ? parent.task_type : groupKey,
          parent_task_id: parentId || null, sort_order: max + 1, created_by: user.id,
        });
        if (error) { alert('Could not add that: ' + error.message); return; }
        if (!parentId) await logActivity('project', projectId, 'task_added', `Task added: ${description}`);
        if (parentId) jtExpanded.add(parentId);
        await reload(parentId ? `.jt-sub-add[data-parent="${parentId}"]` : `.jt-quick[data-type="${groupKey}"]`);
      }

      async function move(t, dir) {
        const { tasks } = state();
        const sibs = tasks.filter(x => (x.parent_task_id || null) === (t.parent_task_id || null) && !x.completed && (t.parent_task_id || jtGroupOf(x) === jtGroupOf(t))).sort(jtSort);
        const i = sibs.findIndex(x => x.id === t.id), j = i + dir;
        if (i < 0 || j < 0 || j >= sibs.length) return;
        [sibs[i], sibs[j]] = [sibs[j], sibs[i]];
        // starred tasks always float to the top, so only reorder within that tier
        await Promise.all(sibs.map((x, n) => (x.sort_order === n + 1 ? null : supabaseClient.from('job_tasks').update({ sort_order: n + 1 }).eq('id', x.id))));
        await reload();
      }

      listEl.addEventListener('click', async (e) => {
        const actEl = e.target.closest('[data-act]');
        if (actEl) {
          const act = actEl.dataset.act;
          if (act === 'toggle-done') {
            const g = actEl.dataset.group;
            if (jtDoneOpen.has(g)) jtDoneOpen.delete(g); else jtDoneOpen.add(g);
            renderJobTasks(listEl);
            return;
          }
          const t = find(actEl.dataset.id);
          if (!t) return;
          if (act === 'star') { await patch(t.id, { starred: !t.starred }); await reload(); }
          else if (act === 'up') await move(t, -1);
          else if (act === 'down') await move(t, 1);
          else if (act === 'delete') {
            const subs = state().tasks.filter(x => x.parent_task_id === t.id).length;
            if (!confirm(subs ? `Delete this task and its ${subs} subtask${subs === 1 ? '' : 's'}?` : 'Delete this task?')) return;
            await supabaseClient.from('job_tasks').delete().eq('id', t.id);
            jtExpanded.delete(t.id);
            if (t.required_before_scheduling) await refreshPipelineTaskGate(state().projectId);
            await logActivity('project', state().projectId, 'task_deleted', `Task deleted: ${t.description || ''}`);
            await reload();
          }
          return;
        }
        const tog = e.target.closest('[data-toggle]');
        if (tog) {
          const id = tog.dataset.toggle;
          if (jtExpanded.has(id)) jtExpanded.delete(id); else jtExpanded.add(id);
          renderJobTasks(listEl);
        }
      });

      listEl.addEventListener('change', async (e) => {
        const el = e.target;
        const t = el.dataset.id ? find(el.dataset.id) : null;
        if (!t) return;
        if (el.classList.contains('jt-check')) await setCompleted(t, el.checked);
        else if (el.classList.contains('jt-assign')) { await patch(t.id, { assigned_to_user_id: el.value || null, assigned_to_role: el.value ? null : t.assigned_to_role }); await reload(); }
        else if (el.classList.contains('jt-due')) { await patch(t.id, { due_date: el.value || null }); await reload(); }
      });

      listEl.addEventListener('keydown', async (e) => {
        if (e.key !== 'Enter' || e.isComposing) return;
        const el = e.target;
        if (el.classList.contains('jt-quick') || el.classList.contains('jt-sub-add')) {
          e.preventDefault();
          const text = el.value.trim();
          if (!text) return;
          el.disabled = true;
          await addTask(text, el.dataset.type, el.dataset.parent || null);
        } else if (el.classList.contains('jt-title-edit')) { e.preventDefault(); el.blur(); }
      });

      // Notes / title save when you click away, without re-rendering (which
      // would swallow whatever you clicked on next).
      listEl.addEventListener('focusout', async (e) => {
        const el = e.target;
        const t = el.dataset && el.dataset.id ? find(el.dataset.id) : null;
        if (!t) return;
        if (el.classList.contains('jt-notes')) {
          const v = el.value.trim() || null;
          if (v !== (t.notes || null) && await patch(t.id, { notes: v })) t.notes = v;
        } else if (el.classList.contains('jt-title-edit')) {
          const v = el.value.trim();
          if (!v) { el.value = t.description; return; }
          if (v !== t.description && await patch(t.id, { description: v })) {
            t.description = v;
            const titleEl = listEl.querySelector(`.jt-item[data-id="${t.id}"] .jt-title`);
            if (titleEl) titleEl.textContent = v;
          }
        }
      });
    }

        <div class="card" style="max-width:420px; width:100%;">

      // than disabled, so it's obvious why it's hidden rather than looking
      // broken.
      function refreshCalendarRowVisibility() {
        const assignType = overlay.querySelector('#at-assign-type').value;
        const hasDate = !!overlay.querySelector('#at-due-date').value;
        overlay.querySelector('#at-calendar-row').style.display = (assignType === 'person' && hasDate) ? 'flex' : 'none';
        if (!(assignType === 'person' && hasDate)) overlay.querySelector('#at-add-to-calendar').checked = false;
      }

      overlay.querySelector('#at-assign-type').addEventListener('change', (e) => {
        overlay.querySelector('#at-person-section').style.display = e.target.value === 'person' ? 'block' : 'none';
        overlay.querySelector('#at-role-section').style.display = e.target.value === 'role' ? 'block' : 'none';
        refreshCalendarRowVisibility();
      });
      overlay.querySelector('#at-due-date').addEventListener('change', refreshCalendarRowVisibility);

      function refreshRecurrenceHint() {
        const checked = overlay.querySelector('#at-recurring').checked;
        overlay.querySelector('#at-recurrence-section').style.display = checked ? 'block' : 'none';
        overlay.querySelector('#at-recurrence-hint').textContent = (checked && !overlay.querySelector('#at-due-date').value)
          ? 'Set a due date above - the next occurrence is created that many days/weeks/months after it.' : '';
      }
      overlay.querySelector('#at-recurring').addEventListener('change', refreshRecurrenceHint);
      overlay.querySelector('#at-due-date').addEventListener('input', refreshRecurrenceHint);
