<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('te-theme') || 'dark');</script>
<title>Tasks - Thomson Energy</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=8" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('mobile-menu-dropdown').classList.toggle('open')">&#9776;</button>
    <div class="mobile-menu-dropdown" id="mobile-menu-dropdown"></div>
    <nav class="topbar-tabs" id="topbar-tabs"></nav>
    <div class="topbar-right">
      <a href="/schedule.html" class="topbar-icon-link" title="Schedule">&#128197;</a>
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/home.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="wrap">
    <h1>Tasks</h1>
    <p class="subtitle">Assigned to you, your role, or open for anyone free to pick up.</p>

    <div class="card">
      <h2>Assigned to you</h2>
      <div id="my-tasks"><p class="subtitle">Loading...</p></div>
    </div>

    <div class="card">
      <h2>Assigned to your role</h2>
      <div id="role-tasks"><p class="subtitle">Loading...</p></div>
    </div>

    <div class="card">
      <h2>Unassigned - up for grabs</h2>
      <div id="open-tasks"><p class="subtitle">Loading...</p></div>
    </div>
  </div>

  <script src="/js/supabase-client.js?v=2"></script>
  <script src="/js/theme.js"></script>
  <script>
    function taskRow(task, showPickUp) {
      return `
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:10px 0; border-bottom:1px solid var(--border);">
          <div>
            <a href="/project.html?id=${task.project_id}" class="link-quiet">${task.description}</a>
            <p class="subtitle" style="margin:2px 0 0; font-size:12px;">
              ${task.projects?.job_number ? 'Job ' + task.projects.job_number : (task.projects?.name || '')}
              ${task.required_before_scheduling ? ' &middot; <span style="color:var(--red);">Required before scheduling</span>' : ''}
            </p>
          </div>
          <div style="display:flex; gap:6px; flex-shrink:0;">
            ${showPickUp ? `<button type="button" class="secondary pick-up-btn" data-id="${task.id}" style="font-size:12px; padding:6px 10px;">Pick up</button>` : ''}
            <button type="button" class="secondary complete-task-btn" data-id="${task.id}" style="font-size:12px; padding:6px 10px;">Done</button>
          </div>
        </div>`;
    }

    async function loadTasks() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      const myRole = await getMyRole();

      const { data: allTasks, error } = await supabaseClient
        .from('job_tasks')
        .select('*, projects(name, job_number)')
        .eq('completed', false)
        .order('required_before_scheduling', { ascending: false })
        .order('created_at', { ascending: true });

      if (error) {
        document.getElementById('my-tasks').innerHTML = `<div class="error-box">${error.message}</div>`;
        return;
      }

      const mine = allTasks.filter(t => t.assigned_to_user_id === user.id);
      const roleTasks = allTasks.filter(t => !t.assigned_to_user_id && t.assigned_to_role === myRole);
      const open = allTasks.filter(t => !t.assigned_to_user_id && !t.assigned_to_role);

      document.getElementById('my-tasks').innerHTML = mine.length ? mine.map(t => taskRow(t, false)).join('') : '<p class="subtitle">Nothing assigned to you right now.</p>';
      document.getElementById('role-tasks').innerHTML = roleTasks.length ? roleTasks.map(t => taskRow(t, false)).join('') : '<p class="subtitle">Nothing assigned to your role right now.</p>';
      document.getElementById('open-tasks').innerHTML = open.length ? open.map(t => taskRow(t, true)).join('') : '<p class="subtitle">Nothing unassigned right now.</p>';

      document.querySelectorAll('.complete-task-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          await supabaseClient.from('job_tasks').update({
            completed: true, completed_by: user.id, completed_at: new Date().toISOString(),
          }).eq('id', btn.dataset.id);
          await loadTasks();
        });
      });
      document.querySelectorAll('.pick-up-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          await supabaseClient.from('job_tasks').update({ assigned_to_user_id: user.id }).eq('id', btn.dataset.id);
          await loadTasks();
        });
      });
    }

    (async function () {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();
      renderMainNav('tasks');
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });
      await loadTasks();
    })();
  </script>
</body>
</html>
