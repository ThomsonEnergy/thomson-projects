<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('te-theme') || (matchMedia('(pointer: coarse)').matches ? 'dark' : 'navy'));</script>
<title>Tasks - Thomson Energy</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=22" />
<script src="/js/vendor/supabase-2.js?v=1"></script>
</head>
<body>
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('mobile-menu-dropdown').classList.toggle('open')">&#9776;</button>
    <div class="mobile-menu-dropdown" id="mobile-menu-dropdown"></div>
    <nav class="topbar-tabs" id="topbar-tabs"></nav>
    <div class="topbar-right">
      <a href="/schedule.html" class="topbar-icon-link" title="Schedule">&#128197;</a>
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/home.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="wrap">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:10px;">
      <div>
        <h1 style="margin-bottom:4px;">Tasks</h1>
        <p class="subtitle">Assigned to you, your role, or open for anyone free to pick up.</p>
      </div>
      <button type="button" id="add-task-btn">+ Add task</button>
    </div>

    <div class="card">
      <h2>Assigned to you</h2>
      <div id="my-tasks"><p class="subtitle">Loading...</p></div>
    </div>

    <div class="card">
      <h2>Assigned to your role</h2>
      <div id="role-tasks"><p class="subtitle">Loading...</p></div>
    </div>

    <div class="card">
      <h2>Unassigned - up for grabs</h2>
      <div id="open-tasks"><p class="subtitle">Loading...</p></div>
    </div>
  </div>

  <script src="/js/supabase-client.js?v=103"></script>
  <script src="/js/theme.js"></script>
  <script>
    function taskRow(task, showPickUp) {
      const TODAY = sydneyDateKey(new Date()); // per render, so a page left open overnight stays right
      const jobLabel = task.project_id
        ? (task.projects?.job_number ? 'J' + task.projects.job_number : escapeHtml(task.projects?.name || ''))
        : 'Office / General';
      const dueFmt = task.due_date ? new Date(task.due_date + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
      const dueHtml = !task.due_date ? '' : (task.due_date < TODAY ? ` &middot; <span style="color:var(--red); font-weight:600;">Overdue: ${dueFmt}</span>` : (task.due_date === TODAY ? ' &middot; <span style="font-weight:600;">Due today</span>' : ` &middot; Due ${dueFmt}`));
      return `
        <div style="display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-start; gap:12px; padding:10px 0; border-bottom:1px solid var(--border);">
          <div style="flex:1 1 200px; min-width:0;">
            ${task.project_id ? `<a href="/project.html?id=${task.project_id}" class="link-quiet">${escapeHtml(task.description)}</a>` : `<span>${escapeHtml(task.description)}</span>`}
            <p class="subtitle" style="margin:2px 0 0; font-size:12px;">
              ${jobLabel}
              ${dueHtml}
              ${task.meetings ? ` &middot; <a href="/meetings.html?id=${task.meeting_id}" class="link-quiet">Meeting: ${escapeHtml(task.meetings.title)}</a>` : ''}
              ${task.remind_at && new Date(task.remind_at) <= new Date() ? ' &middot; <span style="color:var(--red);">Reminder due</span>' : ''}
              ${task.recurrence ? ` &middot; Repeats ${escapeHtml(task.recurrence)}` : ''}
              ${task.required_before_scheduling ? ' &middot; <span style="color:var(--red);">Required before scheduling</span>' : ''}
            </p>
          </div>
          <div class="task-actions" style="display:flex; gap:8px; flex-shrink:0;">
            ${showPickUp ? `<button type="button" class="secondary pick-up-btn" data-id="${task.id}">Pick up</button>` : ''}
            <button type="button" class="secondary edit-task-btn" data-id="${task.id}">Edit</button>
            <button type="button" class="secondary complete-task-btn" data-id="${task.id}">Done</button>
          </div>
        </div>`;
    }

    async function loadTasks() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      const myRole = await getMyRole();

      const { data: allTasks, error } = await supabaseClient
        .from('job_tasks')
        .select('*, projects(name, job_number), meetings(id, title)')
        .eq('completed', false)
        .order('required_before_scheduling', { ascending: false })
        .order('due_date', { ascending: true, nullsFirst: false })
        .order('created_at', { ascending: true });

      if (error) {
        document.getElementById('my-tasks').innerHTML = `<div class="error-box">${error.message}</div>`;
        return;
      }

      const mine = allTasks.filter(t => t.assigned_to_user_id === user.id);
      const roleTasks = allTasks.filter(t => !t.assigned_to_user_id && t.assigned_to_role === myRole);
      const open = allTasks.filter(t => !t.assigned_to_user_id && !t.assigned_to_role);

      document.getElementById('my-tasks').innerHTML = mine.length ? mine.map(t => taskRow(t, false)).join('') : '<p class="subtitle">Nothing assigned to you right now.</p>';
      document.getElementById('role-tasks').innerHTML = roleTasks.length ? roleTasks.map(t => taskRow(t, false)).join('') : '<p class="subtitle">Nothing assigned to your role right now.</p>';
      document.getElementById('open-tasks').innerHTML = open.length ? open.map(t => taskRow(t, true)).join('') : '<p class="subtitle">Nothing unassigned right now.</p>';

      document.querySelectorAll('.complete-task-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const task = allTasks.find(t => t.id === btn.dataset.id);
          const label = btn.textContent;
          btn.disabled = true;
          btn.textContent = 'Saving...';
          try {
            const { error: doneErr } = await supabaseClient.from('job_tasks').update({
              completed: true, completed_by: user.id, completed_at: new Date().toISOString(),
            }).eq('id', btn.dataset.id);
            if (doneErr) throw doneErr;
            // Same gate as the job page: the last required task moves the job out of Awaiting Action.
            if (task?.project_id && task.required_before_scheduling) await refreshPipelineTaskGate(task.project_id);
            if (task?.project_id) await logActivity('project', task.project_id, 'task_completed', `Task completed: ${task.description || ''}`);
            await loadTasks();
          } catch (err) {
            alert('Could not tick that off: ' + (err.message || err));
          } finally {
            btn.disabled = false;
            btn.textContent = label;
          }
        });
      });
      document.querySelectorAll('.pick-up-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const task = allTasks.find(t => t.id === btn.dataset.id);
          const label = btn.textContent;
          btn.disabled = true;
          btn.textContent = 'Saving...';
          try {
            const { error: pickErr } = await supabaseClient.from('job_tasks').update({ assigned_to_user_id: user.id }).eq('id', btn.dataset.id);
            if (pickErr) throw pickErr;
            if (task?.project_id) await logActivity('project', task.project_id, 'task_picked_up', `Task picked up: ${task.description || ''}`);
            await loadTasks();
          } catch (err) {
            alert('Could not pick that up: ' + (err.message || err));
          } finally {
            btn.disabled = false;
            btn.textContent = label;
          }
        });
      });
      document.querySelectorAll('.edit-task-btn').forEach(btn => btn.addEventListener('click', () => {
        const t = allTasks.find(x => x.id === btn.dataset.id);
        if (t) openAddTaskPanel({ id: t.id, description: t.description, task_type: t.task_type, assignee_id: t.assigned_to_user_id, assigned_to_role: t.assigned_to_role, due_date: t.due_date, recurrence: t.recurrence, project_id: t.project_id, project_label: projectRef(t.projects), required_before_scheduling: t.required_before_scheduling });
      }));
    }

    // Job is optional here (unlike the "+ Add task" on a project's own
    // page) - leave it blank for an office/general task like "take the
    // bins out" that isn't tied to any job.
    async function openAddTaskPanel(prefill) {
      const editing = !!(prefill && prefill.id);
      const { data: { user } } = await supabaseClient.auth.getUser();
      const { data: staffRows } = await supabaseClient.from('profiles').select('id, full_name').eq('active', true).order('full_name');
      const staff = staffRows || [];
      if (editing && prefill.assignee_id && !staff.some(s => s.id === prefill.assignee_id)) {
        // Assigned to someone no longer active: keep them as an option so Save does not unassign the task
        const { data: gone } = await supabaseClient.from('profiles').select('id, full_name').eq('id', prefill.assignee_id).maybeSingle();
        if (gone) staff.push({ id: gone.id, full_name: `${gone.full_name || 'Former staff'} (inactive)` });
      }
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:440px; width:100%; max-height:85vh; overflow-y:auto;">
          <h2>${editing ? 'Edit task' : 'Add task'}</h2>
          <label style="margin-top:0">Job (optional - leave blank for an office/general task)</label>
          <input id="at-job-search" placeholder="Search job number, name, client..." autocomplete="off" />
          <div id="at-job-results"></div>
          <p class="subtitle" id="at-job-selected" style="margin-top:4px;"></p>

          <label>Description</label>
          <input id="at-desc" placeholder="e.g. Check POs and order stock, or Mow the lawn" />
          <label>Type</label>
          <select id="at-task-type">
            <option value="prejob">Prejob - office / handover docs</option>
            <option value="onsite">Onsite</option>
          </select>
          <label>Assign to</label>
          <select id="at-assign-type">
            <option value="none">Leave unassigned - anyone can pick it up</option>
            <option value="person">A specific person</option>
            <option value="role">A role</option>
          </select>
          <div id="at-person-section" style="display:none; margin-top:8px;">
            <select id="at-person">${(staff || []).map(s => `<option value="${s.id}">${escapeHtml(s.full_name)}</option>`).join('')}</select>
          </div>
          <div id="at-role-section" style="display:none; margin-top:8px;">
            <select id="at-role">
              <option value="admin">Admin</option>
              <option value="finance">Finance</option>
              <option value="sales">Sales</option>
              <option value="staff">Staff</option>
            </select>
          </div>
          <label>Due date (optional)</label>
          <input type="date" id="at-due-date" />
          <label style="display:flex; align-items:center; gap:8px; margin-top:10px;">
            <input type="checkbox" id="at-recurring" style="width:auto;" /> Repeats
          </label>
          <div id="at-recurrence-section" style="display:none; margin-top:8px;">
            <select id="at-recurrence">
              <option value="daily">Daily</option>
              <option value="weekly" selected>Weekly</option>
              <option value="monthly">Monthly</option>
            </select>
            <p class="subtitle" id="at-recurrence-hint" style="margin:4px 0 0;"></p>
          </div>
          <label id="at-required-row" style="margin-top:14px; display:none; align-items:center; gap:8px;">
            <input type="checkbox" id="at-required" style="width:auto;" /> Required before this job can be scheduled
          </label>
          <div style="margin-top:14px; display:flex; gap:8px; align-items:center;">
            <button id="at-save-btn">${editing ? 'Save' : 'Add task'}</button>
            <button type="button" class="secondary" id="at-cancel-btn">Cancel</button>
            ${editing ? '<button type="button" class="danger" id="at-delete-btn" style="margin-left:auto;">Delete</button>' : ''}
          </div>
          <div id="at-msg"></div>
        </div>`;
      document.body.appendChild(overlay);

      // A repeat needs a due date to advance from, so requiring one here
      // rather than silently ignoring "Repeats" when the date's blank.
      function refreshRecurrenceHint() {
        const checked = overlay.querySelector('#at-recurring').checked;
        overlay.querySelector('#at-recurrence-section').style.display = checked ? 'block' : 'none';
        overlay.querySelector('#at-recurrence-hint').textContent = (checked && !overlay.querySelector('#at-due-date').value)
          ? 'Set a due date above - the next occurrence is created that many days/weeks/months after it.' : '';
      }
      overlay.querySelector('#at-recurring').addEventListener('change', refreshRecurrenceHint);
      overlay.querySelector('#at-due-date').addEventListener('input', refreshRecurrenceHint);

      overlay.querySelector('#at-assign-type').addEventListener('change', (e) => {
        overlay.querySelector('#at-person-section').style.display = e.target.value === 'person' ? 'block' : 'none';
        overlay.querySelector('#at-role-section').style.display = e.target.value === 'role' ? 'block' : 'none';
      });

      let selectedJobId = null;
      let jobSearchTimeout;
      if (prefill) {
        // from the AI assistant: fill in what it knew, the person finishes and adds it
        if (typeof prefill.description === 'string') overlay.querySelector('#at-desc').value = prefill.description;
        if (['quote', 'prejob', 'onsite', 'handover'].includes(prefill.task_type)) {
          const typeSel = overlay.querySelector('#at-task-type');
          if (![...typeSel.options].some(o => o.value === prefill.task_type)) typeSel.insertAdjacentHTML('beforeend', `<option value="${prefill.task_type}">${prefill.task_type.charAt(0).toUpperCase() + prefill.task_type.slice(1)}</option>`);
          typeSel.value = prefill.task_type;
        }
        if (prefill.assignee_id && (staff || []).some(s => s.id === prefill.assignee_id)) {
          overlay.querySelector('#at-assign-type').value = 'person';
          overlay.querySelector('#at-assign-type').dispatchEvent(new Event('change'));
          overlay.querySelector('#at-person').value = prefill.assignee_id;
        } else if (['admin', 'finance', 'sales', 'staff'].includes(prefill.assigned_to_role)) {
          overlay.querySelector('#at-assign-type').value = 'role';
          overlay.querySelector('#at-assign-type').dispatchEvent(new Event('change'));
          overlay.querySelector('#at-role').value = prefill.assigned_to_role;
        }
        if (typeof prefill.due_date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(prefill.due_date)) overlay.querySelector('#at-due-date').value = prefill.due_date;
        if (['daily', 'weekly', 'monthly'].includes(prefill.recurrence)) {
          overlay.querySelector('#at-recurring').checked = true;
          overlay.querySelector('#at-recurring').dispatchEvent(new Event('change'));
          overlay.querySelector('#at-recurrence').value = prefill.recurrence;
        }
        if (typeof prefill.project_id === 'string' && /^[0-9a-f-]{36}$/i.test(prefill.project_id)) {
          selectedJobId = prefill.project_id;
          overlay.querySelector('#at-job-search').value = String(prefill.project_label || '').slice(0, 120);
          overlay.querySelector('#at-job-selected').textContent = prefill.project_label ? 'Selected: ' + String(prefill.project_label).slice(0, 120) : '';
          overlay.querySelector('#at-required-row').style.display = 'flex';
          overlay.querySelector('#at-required').checked = !!prefill.required_before_scheduling;
        }
      }
      overlay.querySelector('#at-job-search').addEventListener('input', (e) => {
        clearTimeout(jobSearchTimeout);
        selectedJobId = null;
        overlay.querySelector('#at-job-selected').textContent = '';
        overlay.querySelector('#at-required-row').style.display = 'none';
        const q = e.target.value.trim();
        const resultsEl = overlay.querySelector('#at-job-results');
        if (q.length < 2) { resultsEl.innerHTML = ''; return; }
        jobSearchTimeout = setTimeout(async () => {
          const results = await searchProjects(q);
          if (!results.length) { resultsEl.innerHTML = `<p class="subtitle" style="margin-top:4px;">No matches.</p>`; return; }
          resultsEl.innerHTML = `<div style="border:1px solid var(--border); border-radius:8px; margin-top:6px;">
            ${results.map(p => `<div class="job-pick-row" data-id="${p.id}" data-label="${escapeHtml(projectRef(p))}" style="padding:8px 12px; cursor:pointer; border-bottom:1px solid var(--border);">${escapeHtml(projectRef(p))} <span class="subtitle">${escapeHtml(p.client_name || '')}</span></div>`).join('')}
          </div>`;
          resultsEl.querySelectorAll('.job-pick-row').forEach(row => {
            row.addEventListener('click', () => {
              selectedJobId = row.dataset.id;
              overlay.querySelector('#at-job-search').value = row.dataset.label;
              overlay.querySelector('#at-job-selected').textContent = `Selected: ${row.dataset.label}`;
              overlay.querySelector('#at-required-row').style.display = 'flex';
              resultsEl.innerHTML = '';
            });
          });
        }, 250);
      });

      overlay.querySelector('#at-cancel-btn').addEventListener('click', () => overlay.remove());
      const delBtn = overlay.querySelector('#at-delete-btn');
      if (delBtn) delBtn.addEventListener('click', async () => {
        const { count: subCount } = await supabaseClient.from('job_tasks').select('id', { count: 'exact', head: true }).eq('parent_task_id', prefill.id);
        if (!confirm(subCount ? `Delete this task and its ${subCount} subtask${subCount === 1 ? '' : 's'}?` : 'Delete this task?')) return;
        const msg = overlay.querySelector('#at-msg');
        delBtn.disabled = true;
        delBtn.textContent = 'Deleting...';
        try {
          const { error } = await supabaseClient.from('job_tasks').delete().eq('id', prefill.id);
          if (error) throw error;
          overlay.remove();
          if (prefill.project_id) await refreshPipelineTaskGate(prefill.project_id); // subtasks may have been required too
          if (prefill.project_id) await logActivity('project', prefill.project_id, 'task_deleted', `Task deleted: ${prefill.description || ''}`);
          await loadTasks();
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`;
          delBtn.disabled = false;
          delBtn.textContent = 'Delete';
        }
      });
      overlay.querySelector('#at-save-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#at-msg');
        const description = overlay.querySelector('#at-desc').value.trim();
        if (!description) { msg.innerHTML = `<div class="error-box">Enter a description.</div>`; return; }
        const assignType = overlay.querySelector('#at-assign-type').value;
        const dueDate = overlay.querySelector('#at-due-date').value || null;
        const isRecurring = overlay.querySelector('#at-recurring').checked;
        if (isRecurring && !dueDate) { msg.innerHTML = `<div class="error-box">A repeating task needs a due date to count forward from.</div>`; return; }
        const saveBtn = overlay.querySelector('#at-save-btn');
        const saveLabel = saveBtn.textContent;
        saveBtn.disabled = true;
        saveBtn.textContent = editing ? 'Saving...' : 'Adding...';
        try {
          const fields = {
            project_id: selectedJobId,
            description,
            task_type: overlay.querySelector('#at-task-type').value,
            assigned_to_user_id: assignType === 'person' ? overlay.querySelector('#at-person').value : null,
            assigned_to_role: assignType === 'role' ? overlay.querySelector('#at-role').value : null,
            due_date: dueDate,
            recurrence: isRecurring ? overlay.querySelector('#at-recurrence').value : null,
            required_before_scheduling: selectedJobId ? overlay.querySelector('#at-required').checked : false,
          };
          // Edit leaves meeting_id, remind_at, notes, parent_task_id and sort_order untouched (not in fields).
          const { error } = editing
            ? await supabaseClient.from('job_tasks').update(fields).eq('id', prefill.id)
            : await supabaseClient.from('job_tasks').insert({ ...fields, created_by: user.id });
          if (error) throw error;
          if (editing) {
            if (prefill.required_before_scheduling || fields.required_before_scheduling) {
              if (prefill.project_id) await refreshPipelineTaskGate(prefill.project_id);
              if (selectedJobId && selectedJobId !== prefill.project_id) await refreshPipelineTaskGate(selectedJobId);
            }
            if (selectedJobId) await logActivity('project', selectedJobId, 'task_updated', `Task updated: ${description}`);
          }
          overlay.remove();
          await loadTasks();
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`;
          saveBtn.disabled = false;
          saveBtn.textContent = saveLabel;
        }
      });
    }

    (async function () {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();
      renderMainNav('tasks');
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });
      document.getElementById('add-task-btn').addEventListener('click', () => openAddTaskPanel());
      await loadTasks();
      const aiPf = aiPrefillRead('task');
      if (aiPf) { aiPrefillClear(); openAddTaskPanel({ ...aiPf, id: undefined }); }
    })();
  </script>
</body>
</html>
