<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('te-theme') || (matchMedia('(pointer: coarse)').matches ? 'dark' : 'navy'));</script>
<title>Site Inspection - Thomson Energy</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=21" />
<script src="/js/vendor/supabase-2.js?v=1"></script>
</head>
<body>
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('mobile-menu-dropdown').classList.toggle('open')">&#9776;</button>
    <div class="mobile-menu-dropdown" id="mobile-menu-dropdown"></div>
    <nav class="topbar-tabs" id="topbar-tabs"></nav>
    <div class="topbar-right">
      <a href="/schedule.html" class="topbar-icon-link" title="Schedule">&#128197;</a>
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/home.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="wrap" id="content">
    <p class="subtitle">Loading...</p>
  </div>

  <script src="/js/supabase-client.js?v=102"></script>
  <script src="/js/theme.js"></script>
  <script>
    const inspectionId = new URLSearchParams(window.location.search).get('id');
    let inspection, items, answers = {}; // answers keyed by item_id
    let myUserId = null;
    // Per item id, what is in flight: { saving: true|false } while a Yes/No
    // saves, { uploading: true } while a photo uploads, { error: 'text' }
    // after a failed save. renderItems reads it, so a re-render caused by
    // another item's save never wipes this item's state.
    const itemUi = {};

    function itemsVisible() {
      // An item with no parent is always visible; one with a parent is
      // only visible once the parent's own answer matches
      // show_when_parent_answer - same reveal logic the checklist
      // template editor uses to preview a template.
      return items.filter(it => {
        if (!it.parent_item_id) return true;
        const parentAnswer = answers[it.parent_item_id];
        if (!parentAnswer || parentAnswer.answer_yes_no === null || parentAnswer.answer_yes_no === undefined) return false;
        return parentAnswer.answer_yes_no === it.show_when_parent_answer;
      });
    }

    async function saveAnswer(itemId, fields) {
      const row = { inspection_id: inspectionId, item_id: itemId, answered_by: myUserId, answered_at: new Date().toISOString(), ...fields };
      const { data, error } = await supabaseClient.from('site_inspection_answers').upsert(row, { onConflict: 'inspection_id,item_id' }).select().single();
      if (error) throw error;
      answers[itemId] = data;
      if (inspection.status === 'scheduled') {
        await supabaseClient.from('site_inspections').update({ status: 'in_progress' }).eq('id', inspectionId);
        inspection.status = 'in_progress';
      }
    }

    function renderItems() {
      const visible = itemsVisible();
      const visibleIds = new Set(visible.map(i => i.id));
      const required = visible.filter(i => i.required);
      const answeredCount = required.filter(i => {
        const a = answers[i.id];
        return a && (i.item_type === 'photo' ? !!a.photo_path : a.answer_yes_no !== null && a.answer_yes_no !== undefined);
      }).length;

      document.getElementById('insp-progress').textContent = `${answeredCount} of ${required.length} required items done`;
      document.getElementById('mark-complete-btn').disabled = answeredCount < required.length;

      const listEl = document.getElementById('insp-items');
      listEl.innerHTML = visible.map(it => {
        const a = answers[it.id];
        const isChild = !!it.parent_item_id;
        const answered = it.item_type === 'photo' ? !!a?.photo_path : (a?.answer_yes_no !== null && a?.answer_yes_no !== undefined);
        const ui = itemUi[it.id] || {};
        const busy = ui.saving !== undefined || !!ui.uploading;
        const shown = ui.saving !== undefined ? ui.saving : a?.answer_yes_no;
        const msgHtml = ui.error ? `<div class="error-box">${escapeHtml(ui.error)}</div>`
          : ui.saving !== undefined ? '<p class="subtitle">Saving...</p>'
          : ui.uploading ? '<p class="subtitle">Uploading...</p>' : '';
        return `
        <div class="${isChild ? 'insp-child' : ''}">
          <div class="insp-item ${answered ? 'answered' : ''}" data-item-id="${it.id}">
            <div class="insp-label">${escapeHtml(it.label)}${it.required ? '' : ' <span class="subtitle">(optional)</span>'}</div>
            ${it.description ? `<div class="insp-desc">${escapeHtml(it.description)}</div>` : ''}
            ${it.item_type === 'yes_no' ? `
              <button type="button" class="insp-yn-btn yn-yes ${shown === true ? 'selected' : ''}" ${busy ? 'disabled' : ''}>Yes</button>
              <button type="button" class="insp-yn-btn secondary yn-no ${shown === false ? 'selected' : ''}" ${busy ? 'disabled' : ''}>No</button>
            ` : `
              ${a?.photo_path ? `<img class="insp-photo-thumb insp-photo-view" src="${escapeHtml(a.photo_path)}" style="cursor:pointer;" />` : ''}
              <label class="btn ${a?.photo_path ? 'secondary' : ''} insp-photo-btn ${ui.uploading ? 'is-loading' : ''}">&#128247; ${a?.photo_path ? 'Retake photo' : 'Take photo'}<input type="file" class="insp-photo-file" accept="image/*" capture="environment" style="display:none;" ${ui.uploading ? 'disabled' : ''} /></label>
            `}
            <div class="insp-item-msg">${msgHtml}</div>
          </div>
        </div>`;
      }).join('');

      listEl.querySelectorAll('.insp-item').forEach(el => {
        const itemId = el.dataset.itemId;
        const item = items.find(i => i.id === itemId);

        el.querySelectorAll('.yn-yes, .yn-no').forEach(btn => {
          btn.addEventListener('click', async () => {
            const value = btn.classList.contains('yn-yes');
            if ((itemUi[itemId] || {}).saving !== undefined) return;
            if (answers[itemId]?.answer_yes_no === value) {
              if (itemUi[itemId]) { delete itemUi[itemId]; renderItems(); }
              return;
            }
            itemUi[itemId] = { saving: value };
            renderItems();
            try {
              await saveAnswer(itemId, { answer_yes_no: value });
              delete itemUi[itemId];
            } catch (err) {
              itemUi[itemId] = { error: 'Not saved. ' + friendlyError(err) };
            }
            renderItems();
          });
        });

        const photoViewImg = el.querySelector('.insp-photo-view');
        if (photoViewImg) photoViewImg.addEventListener('click', () => openPhotoLightbox([photoViewImg.src], 0));

        const fileInput = el.querySelector('.insp-photo-file');
        if (fileInput) {
          fileInput.addEventListener('change', async () => {
            if (!fileInput.files.length) return;
            const files = Array.from(fileInput.files);
            itemUi[itemId] = { uploading: true };
            renderItems();
            try {
              const [url] = await uploadPhotos(files, `inspections/${inspectionId}`, 'site-photos');
              await saveAnswer(itemId, { photo_path: url });
              delete itemUi[itemId];
            } catch (err) {
              itemUi[itemId] = { error: 'Photo not saved. ' + friendlyError(err) };
            }
            renderItems();
          });
        }
      });
    }

    async function loadInspection() {
      const content = document.getElementById('content');
      const { data: insp, error } = await supabaseClient
        .from('site_inspections')
        .select('*, inspection_checklist_templates(name), leads(name, address_formatted, phone, email), projects(name, job_number, quote_number, client_name, client_address)')
        .eq('id', inspectionId)
        .single();
      if (error || !insp) {
        content.innerHTML = `<div class="error-box">Could not load this inspection.</div>`;
        return;
      }
      inspection = insp;

      const [{ data: itemsData }, { data: answersData }] = await Promise.all([
        supabaseClient.from('inspection_checklist_items').select('*').eq('template_id', insp.template_id).order('sort_order'),
        supabaseClient.from('site_inspection_answers').select('*').eq('inspection_id', inspectionId),
      ]);
      items = itemsData || [];
      answers = {};
      (answersData || []).forEach(a => { answers[a.item_id] = a; });

      const subject = insp.leads
        ? `${insp.leads.name || 'Lead'}${insp.leads.address_formatted ? ' - ' + insp.leads.address_formatted : ''}`
        : `${projectRef(insp.projects)}${insp.projects?.client_address ? ' - ' + insp.projects.client_address : ''}`;
      const backLink = insp.lead_id ? '/leads.html' : `/project.html?id=${insp.project_id}`;

      content.innerHTML = `
        <a class="link-quiet" href="${backLink}" style="font-size:13px;">&larr; Back</a>
        <h1 style="margin-top:6px;">Site Inspection</h1>
        <p class="subtitle">${escapeHtml(subject)}</p>
        <div class="card" style="margin-bottom:16px;">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
            <div>
              <strong>${escapeHtml(insp.inspection_checklist_templates?.name || 'Checklist')}</strong>
              <span class="badge ${insp.status === 'completed' ? 'accepted' : 'sent'}" style="margin-left:8px;">${insp.status.replace('_', ' ')}</span>
              <p class="subtitle" id="insp-progress" style="margin:6px 0 0;"></p>
            </div>
            <button type="button" id="mark-complete-btn" ${insp.status === 'completed' ? 'disabled' : ''}>${insp.status === 'completed' ? 'Completed' : 'Mark complete'}</button>
          </div>
          <div id="insp-complete-msg"></div>
        </div>
        <div id="insp-items"></div>`;

      document.getElementById('mark-complete-btn').addEventListener('click', async () => {
        if (inspection.status === 'completed') return;
        const btn = document.getElementById('mark-complete-btn');
        btn.disabled = true;
        btn.textContent = 'Saving...';
        try {
          const { error: updErr } = await supabaseClient.from('site_inspections').update({ status: 'completed', completed_at: new Date().toISOString() }).eq('id', inspectionId);
          if (updErr) throw updErr;
          inspection.status = 'completed';
          location.reload();
        } catch (err) {
          document.getElementById('insp-complete-msg').innerHTML = `<div class="error-box">${escapeHtml(friendlyError(err))}</div>`;
          btn.disabled = false;
          btn.textContent = 'Mark complete';
        }
      });

      renderItems();
    }

    (async function () {
      const session = await requireLogin();
      if (!session) return;
      myUserId = session.user.id;
      syncThemeFromProfile();
      renderMainNav(null);
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });

      if (!inspectionId) {
        document.getElementById('content').innerHTML = `<div class="error-box">No inspection specified.</div>`;
        return;
      }
      await loadInspection();
    })();
  </script>
</body>
</html>
