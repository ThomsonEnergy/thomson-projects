<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('te-theme') || (matchMedia('(pointer: coarse)').matches ? 'dark' : 'navy'));</script>
<title>Site Inspection - Thomson Energy</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=25" />
<script src="/js/vendor/supabase-2.js?v=1"></script>
<style>
  /* Page-only: one compact row per photo label or question, green edge once it has something. */
  .si-row { border: 1px solid var(--border); border-left-width: 3px; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .si-row.done { border-left-color: var(--green); }
  .si-row-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .si-add { width: auto; min-height: 40px; padding: 6px 12px; margin: 0; cursor: pointer; flex-shrink: 0; }
  .si-thumbs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .si-thumb { position: relative; }
  .si-thumb img { width: 72px; height: 72px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; display: block; }
  .si-thumb-x { position: absolute; top: -6px; right: -6px; width: 24px; height: 24px; padding: 0; border-radius: 50%; font-size: 15px; line-height: 1; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); cursor: pointer; }
  .si-q { flex-wrap: wrap; }
  .si-q > div:first-child { flex: 1 1 180px; }
  .si-control { display: flex; gap: 6px; align-items: center; flex: 0 1 auto; }
  .si-control select, .si-control .si-text { min-width: 150px; margin: 0; }
  .si-note-btn { width: auto; min-height: 40px; padding: 6px 10px; font-size: 12px; font-weight: 400; white-space: nowrap; flex-shrink: 0; }
  .si-yn { width: auto; min-height: 40px; padding: 6px 16px; }
  .si-yn.selected { background: var(--btn-bg); color: #fff; }
  .si-note { margin-top: 6px; font-size: 13px; }
  .si-task { display: flex; align-items: center; gap: 8px; font-weight: 400; margin: 0 0 6px; min-height: 32px; }
  .si-task span { flex: 1; }
</style>
</head>
<body>
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('mobile-menu-dropdown').classList.toggle('open')">&#9776;</button>
    <div class="mobile-menu-dropdown" id="mobile-menu-dropdown"></div>
    <nav class="topbar-tabs" id="topbar-tabs"></nav>
    <div class="topbar-right">
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/home.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="wrap fill" id="content">
    <p class="subtitle">Loading...</p>
  </div>

  <script src="/js/supabase-client.js?v=152"></script>
  <script src="/js/theme.js?v=2"></script>
  <script src="/js/site-inspection.js?v=1"></script>
  <script>
    (async function () {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();
      renderMainNav(null);
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });
      const inspectionId = new URLSearchParams(window.location.search).get('id');
      if (!inspectionId) {
        document.getElementById('content').innerHTML = '<div class="error-box">No inspection specified.</div>';
        return;
      }
      await initSiteInspection(inspectionId, session.user.id);
    })();
  </script>
</body>
</html>
