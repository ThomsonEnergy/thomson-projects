<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('te-theme') || (matchMedia('(pointer: coarse)').matches ? 'dark' : 'navy'));</script>
<title>Projects - Thomson Energy</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=13" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('mobile-menu-dropdown').classList.toggle('open')">&#9776;</button>
    <div class="mobile-menu-dropdown" id="mobile-menu-dropdown"></div>
    <nav class="topbar-tabs" id="topbar-tabs"></nav>
    <div class="topbar-right">
      <a href="/schedule.html" class="topbar-icon-link" title="Schedule">&#128197;</a>
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/home.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="wrap wide">
    <div style="display:flex; justify-content:space-between; align-items:start; flex-wrap:wrap; gap:12px;">
      <div>
        <h1>Job pipeline</h1>
        <p class="subtitle">Every project, left to right through its lifecycle. Quote Approved through Job Booked now move automatically (quote approval, deposit paid, mandatory tasks, scheduling) - Job Not Complete onward still moves by hand until later phases land.</p>
      </div>
      <button class="secondary" id="new-direct-job-btn">+ New job (no quote)</button>
    </div>

    <div id="board" class="pipeline-board">
      <p class="subtitle">Loading...</p>
    </div>
  </div>

  <script src="/js/supabase-client.js?v=30"></script>
  <script src="/js/theme.js"></script>
  <script>
    const STAGES = [
      { key: 'lead',              label: 'Lead' },
      { key: 'draft_quote',       label: 'Draft Quote' },
      { key: 'quote_sent',        label: 'Quote Sent' },
      { key: 'quote_approved',    label: 'Quote Approved' },
      { key: 'deposit_paid',      label: 'Deposit Paid' },
      { key: 'awaiting_action',   label: 'Awaiting Action' },
      { key: 'ready_to_book',     label: 'Ready to Book' },
      { key: 'job_booked',        label: 'Job Booked' },
      { key: 'job_not_complete',  label: 'Job Not Complete' },
      { key: 'client_handover',   label: 'Client Handover' },
      { key: 'ready_to_invoice',  label: 'Ready to Invoice' },
      { key: 'awaiting_payment',  label: 'Invoice Sent - Awaiting Payment' },
      { key: 'complete',          label: 'Complete' },
    ];
    // Archived sits off-board per the spec - it's a valid stage value but
    // doesn't get its own column here. The scheduled archive-completed-
    // jobs.js function moves a job here 2 days after it hits 'complete';
    // the "(Archived ->)" link next to that column is the only way to
    // see them again from this page.
    async function openArchivedPanel() {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:200; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:640px; width:100%; max-height:85vh; overflow-y:auto;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
            <h2 style="margin:0;">Archived jobs</h2>
            <button type="button" class="secondary" id="archived-close-btn" style="font-size:12px; padding:6px 10px;">Close</button>
          </div>
          <div id="archived-list" style="margin-top:14px;"><p class="subtitle">Loading...</p></div>
        </div>`;
      document.body.appendChild(overlay);
      overlay.querySelector('#archived-close-btn').addEventListener('click', () => overlay.remove());
      overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });

      const listEl = overlay.querySelector('#archived-list');
      const { data, error } = await supabaseClient
        .from('projects')
        .select('id, name, client_name, job_number, quote_number, completed_at')
        .eq('pipeline_stage', 'archived')
        .not('job_number', 'is', null)
        .order('completed_at', { ascending: false });
      if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }
      if (!data.length) { listEl.innerHTML = `<p class="subtitle">Nothing archived yet.</p>`; return; }

      listEl.innerHTML = data.map(p => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border);">
          <div>
            <a class="link-quiet" href="/project.html?id=${p.id}">${projectRef(p)}</a>
            <div class="subtitle" style="font-size:12px;">${p.client_name || ''}</div>
          </div>
          <div class="subtitle" style="font-size:12px;">${p.completed_at ? 'Completed ' + new Date(p.completed_at).toLocaleDateString('en-AU') : ''}</div>
        </div>`).join('');
    }

    document.getElementById('new-direct-job-btn').addEventListener('click', () => {
      openQuickJobPanel((project) => { window.location.href = `/project.html?id=${project.id}`; });
    });

    (async function () {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();
      renderMainNav('job-pipeline');

      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });

      const { data: projects, error } = await supabaseClient
        .from('projects')
        .select('id, name, client_name, pipeline_stage, job_number, quote_number')
        .neq('pipeline_stage', 'archived')
        .order('created_at', { ascending: false });

      const board = document.getElementById('board');

      if (error) {
        board.innerHTML = `<div class="error-box">${error.message}${error.message.includes('pipeline_stage') ? ' - looks like migration_006 hasn\'t been run against this database yet.' : ''}</div>`;
        return;
      }

      const byStage = {};
      STAGES.forEach(s => byStage[s.key] = []);
      (projects || []).forEach(p => {
        const stage = byStage[p.pipeline_stage] ? p.pipeline_stage : 'lead';
        byStage[stage].push(p);
      });

      board.innerHTML = STAGES.map(stage => `
        <div class="pipeline-column">
          <div class="pipeline-column-header">
            <span>${stage.label}${stage.key === 'complete' ? ' <a class="link-quiet" id="view-archived-link" href="#" style="font-size:11px; font-weight:400;">(Archived &rarr;)</a>' : ''}</span>
            <span class="count">${byStage[stage.key].length}</span>
          </div>
          <div class="pipeline-column-body">
            ${byStage[stage.key].length ? byStage[stage.key].map(p => cardHtml(p)).join('') : `<div class="pipeline-column-empty">No projects here</div>`}
          </div>
        </div>
      `).join('');

      const viewArchivedLink = document.getElementById('view-archived-link');
      if (viewArchivedLink) viewArchivedLink.addEventListener('click', (e) => { e.preventDefault(); openArchivedPanel(); });

      function cardHtml(p) {
        return `
          <div class="pipeline-card" data-id="${p.id}">
            <a class="name" href="/project.html?id=${p.id}">${projectRef(p)}</a>
            <div class="client">${p.client_name || ''}</div>
            <select class="stage-select" data-id="${p.id}">
              ${STAGES.map(s => `<option value="${s.key}" ${s.key === p.pipeline_stage ? 'selected' : ''}>${s.label}</option>`).join('')}
              <option value="archived" ${p.pipeline_stage === 'archived' ? 'selected' : ''}>Archived</option>
            </select>
          </div>`;
      }

      board.querySelectorAll('.stage-select').forEach(sel => {
        sel.addEventListener('change', async () => {
          const id = sel.dataset.id;
          const newStage = sel.value;
          sel.disabled = true;
          const { error: updateErr } = await supabaseClient
            .from('projects')
            .update({ pipeline_stage: newStage })
            .eq('id', id);
          if (updateErr) {
            alert('Could not move this card: ' + updateErr.message);
            sel.disabled = false;
            return;
          }
          // Re-render so the card lands in its new column.
          location.reload();
        });
      });
    })();
  </script>
</body>
</html>
