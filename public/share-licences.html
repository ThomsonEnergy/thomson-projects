<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow" />
<script>document.documentElement.setAttribute('data-theme', 'navy');</script>
<title>Licences and insurance - Thomson Energy</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=13" />
<style>
  body { padding-top: 0; }
  .sl-head { display:flex; align-items:center; gap:14px; padding:18px 16px; border-bottom:1px solid var(--border); }
  .sl-head img { height:34px; }
  .sl-item { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; padding:12px 0; border-top:1px solid var(--border); flex-wrap:wrap; }
  .sl-item:first-child { border-top:none; }
  .sl-name { font-weight:600; }
  .sl-meta { font-size:13px; color:var(--muted); margin-top:2px; }
  .sl-btns { display:flex; gap:8px; flex-wrap:wrap; }
  .sl-btns a, .sl-btns button { font-size:13px; padding:7px 12px; }
  a.sl-btn { display:inline-block; border-radius:8px; border:1px solid var(--border); background:var(--surface-2); color:var(--text); text-decoration:none; font-weight:600; }
</style>
</head>
<body>
  <div class="sl-head">
    <img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" />
  </div>
  <div class="wrap">
    <div id="sl-root"><p class="subtitle">Loading...</p></div>
  </div>

  <script src="/js/licence-share.js?v=1"></script>
  <script>
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmt = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' });

    function expiryText(iso) {
      if (!iso) return '<span>No expiry date</span>';
      const days = Math.ceil((new Date(iso + 'T00:00:00') - new Date(new Date().toDateString())) / 86400000);
      if (days < 0) return `<span style="color:var(--red); font-weight:600;">Expired ${fmt(iso)}</span>`;
      if (days <= 30) return `<span style="color:#d9a23b; font-weight:600;">Expires ${fmt(iso)} (${days} days)</span>`;
      return `<span>Valid until ${fmt(iso)}</span>`;
    }

    (async function () {
      const root = document.getElementById('sl-root');
      const token = new URLSearchParams(location.search).get('token') || '';
      let data;
      try {
        const res = await fetch('/.netlify/functions/get-licence-share?token=' + encodeURIComponent(token));
        data = await res.json();
      } catch (e) { data = { ok: false, error: 'Could not load this page. Check your connection and try again.' }; }
      if (!data.ok) { root.innerHTML = `<div class="card"><h2 style="margin-top:0;">Not available</h2><p>${esc(data.error || 'This link is not available.')}</p></div>`; return; }

      const companyName = (data.company && data.company.name) || 'Thomson Energy';
      document.title = `Licences and insurance - ${companyName}`;
      const groups = [];
      data.items.forEach(it => { let g = groups.find(x => x.name === it.group); if (!g) groups.push(g = { name: it.group, items: [] }); g.items.push(it); });
      groups.sort((a, b) => (a.name === 'Company' ? -1 : b.name === 'Company' ? 1 : a.name.localeCompare(b.name)));
      const filesCount = data.items.filter(i => i.url).length;

      root.innerHTML = `
        <h1 style="margin-bottom:4px;">Licences and insurance</h1>
        <p class="subtitle">${esc(companyName)}${data.company && data.company.abn ? ' &middot; ABN ' + esc(data.company.abn) : ''}${data.label ? ' &middot; ' + esc(data.label) : ''}</p>
        <p class="subtitle" style="margin-top:0;">These are our current documents, so this page always shows the latest versions.${data.expires_at ? ' This link is available until ' + esc(new Date(data.expires_at).toLocaleDateString('en-AU')) + '.' : ''}</p>
        ${filesCount > 1 ? '<div style="margin:14px 0;"><button type="button" id="sl-zip">Download everything (zip)</button> <span id="sl-zip-msg" class="subtitle"></span></div>' : ''}
        ${groups.map(g => `
          <div class="card">
            <h2 style="margin-top:0;">${esc(g.name === 'Company' ? companyName : g.name)}</h2>
            ${g.items.map(it => `
              <div class="sl-item">
                <div>
                  <div class="sl-name">${esc(it.name)}</div>
                  <div class="sl-meta">${[it.kind === 'insurance' ? 'Insurance' : (g.name === 'Company' ? 'Licence' : ''), it.provider ? esc(it.provider) : '', it.number ? 'No. ' + esc(it.number) : ''].filter(Boolean).join(' &middot; ')}</div>
                  <div class="sl-meta">${expiryText(it.expiry)}</div>
                </div>
                <div class="sl-btns">${it.url ? `<a class="sl-btn" href="${esc(it.url)}" target="_blank" rel="noopener">View</a>` : '<span class="sl-meta">No file attached</span>'}</div>
              </div>`).join('')}
          </div>`).join('') || '<div class="card"><p class="subtitle" style="margin:0;">Nothing to show.</p></div>'}
        <p class="subtitle" style="font-size:12px;">Questions? Contact ${esc(companyName)}${data.company && data.company.phone ? ' on ' + esc(data.company.phone) : ''}.</p>`;

      const zipBtn = document.getElementById('sl-zip');
      if (zipBtn) zipBtn.addEventListener('click', async () => {
        const msg = document.getElementById('sl-zip-msg');
        zipBtn.disabled = true;
        try {
          await downloadLicenceZip(data.items.map(i => ({ group: i.group === 'Company' ? 'Company' : i.group, name: i.name, kind: i.kind, number: i.number, provider: i.provider, expiry: i.expiry, ext: i.file_ext, url: i.url })), `${companyName} licences and insurance`, (n, total) => { msg.textContent = `Preparing ${n} of ${total}...`; });
          msg.textContent = '';
        } catch (err) { msg.innerHTML = `<span style="color:var(--red);">${esc(err.message)}</span>`; }
        zipBtn.disabled = false;
      });
    })();
  </script>
</body>
</html>
