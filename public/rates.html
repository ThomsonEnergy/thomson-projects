<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Schedule of Rates - Thomson Energy</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/document-fonts.css?v=1" />
<link rel="stylesheet" href="/css/style.css?v=21" />
<script src="/js/vendor/supabase-2.js?v=1"></script>
<style>
  /* The Schedule of Rates on its own: the same A4 page as in an estimate (quote.html), with no
     estimate parts. Public, so it can be linked; generate-client-document-pdf.js prints it
     (?print=1) when it is added to a job from the Documents page. */
  @page { size: A4; margin: 0; }

  body { background: #e6e9ef; }
  .qdoc {
    --q-blue: #1a6be6;
    --q-ink: #0a0a0a;
    --q-grey: #5b6472;
    font-family: 'Instrument Sans', 'Segoe UI', Arial, sans-serif;
    color: var(--q-ink);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .qdoc * { box-sizing: border-box; }
  .qdoc h1 { font-family: 'Archivo', 'Segoe UI', Arial, sans-serif; text-transform: uppercase; margin: 0; }
  .qdoc p { margin: 0; }

  .pg {
    position: relative;
    width: 100%; max-width: 794px; margin: 0 auto 24px;
    min-height: 1123px;
    background: #fff; color: var(--q-ink);
    overflow: hidden;
    box-shadow: 0 6px 28px rgba(15, 23, 42, 0.18);
    padding: 64px 64px 72px;
  }
  .pg-body { position: relative; z-index: 2; }
  .pg-head { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; }
  .pg-logo { display: block; height: 84px; width: auto; max-width: 280px; }
  .pg-contact { text-align: right; font-size: 12.5px; line-height: 1.45; }
  .pg-contact a { color: inherit; text-decoration: none; }
  .pg-contact .pg-date { display: block; margin-top: 5px; font-size: 12.5px; font-weight: 700; }
  .pg-brand-name { font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 20px; text-transform: uppercase; }
  .qdoc .pg-title { font-weight: 500; font-size: 66px; line-height: 0.98; letter-spacing: -0.02em; margin-bottom: 22px; }

  .slabs { position: absolute; z-index: 1; pointer-events: none; right: 0; bottom: 0; width: 30%; height: auto; aspect-ratio: 554 / 710; opacity: 0.4; }

  .qtable { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .qtable th { text-align: left; font-weight: 500; color: var(--q-blue); padding: 7px 8px 7px 0; border-bottom: 1px solid var(--q-blue); font-size: 12.5px; }
  .qtable td { padding: 7px 8px 7px 0; border-bottom: 1px solid var(--q-ink); font-size: 12.5px; vertical-align: top; }
  .qtable .num, .qtable th.num { text-align: right; white-space: nowrap; padding-right: 0; }
  .note-line { font-size: 12px; color: var(--q-grey); line-height: 1.55; margin-top: 12px; }
  .sor .sor-h { font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 14px; text-transform: uppercase; margin: 16px 0 5px; }
  .sor p { font-size: 12.5px; line-height: 1.55; margin-bottom: 6px; }
  .sor ul { margin: 2px 0 6px; padding-left: 18px; font-size: 12.5px; line-height: 1.55; }

  @media (max-width: 700px) {
    .pg { padding: 28px 22px 48px; min-height: 0; margin-bottom: 14px; box-shadow: none; }
    .pg-head { margin-bottom: 30px; flex-wrap: wrap; gap: 12px; }
    .pg-logo { height: 64px; }
    .pg-contact { text-align: left; }
    .qdoc .pg-title { font-size: 44px; }
  }

  .as-paper .topbar { display: none !important; }
  .as-paper .wrap { max-width: none !important; width: 794px !important; margin: 0 !important; padding: 0 !important; }
  .as-paper .pg { width: 794px; max-width: none; margin: 0; box-shadow: none; height: 1123px; min-height: 0; }

  @media print {
    .topbar { display: none !important; }
    html, body { background: #fff !important; }
    .wrap { max-width: none !important; width: 210mm !important; margin: 0 !important; padding: 0 !important; }
    .pg { width: 210mm; max-width: none; margin: 0; box-shadow: none; height: 297mm; min-height: 0; page-break-after: always; break-after: page; }
    .pg:last-child { page-break-after: auto; break-after: auto; }
    .qdoc, .qdoc * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <span id="brand-mark" class="brand">SCHEDULE OF RATES</span>
    <div class="topbar-right">
      <button class="secondary" onclick="window.print()">Print / Save as PDF</button>
    </div>
  </div>

  <div class="wrap" style="max-width:860px;">
    <div id="content" class="qdoc"><p class="subtitle" style="padding:24px;">Loading...</p></div>
  </div>

  <script src="/js/supabase-client.js?v=102"></script>
  <script src="/js/schedule-of-rates.js?v=2"></script>
  <script>
    const printMode = new URLSearchParams(window.location.search).get('print') === '1';
    if (printMode) document.documentElement.classList.add('as-paper');

    // the blue corner slabs from the estimate's content pages
    const SLABS = `<svg class="slabs" viewBox="860 1290 554 710" preserveAspectRatio="xMaxYMax meet" aria-hidden="true"><defs>
        <linearGradient id="sd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a6be6"/><stop offset="0.55" stop-color="#8fb6f0"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
        <linearGradient id="se" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#1a6be6"/></linearGradient>
        <linearGradient id="sf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1a6be6"/><stop offset="1" stop-color="#2a74e8"/></linearGradient>
      </defs>
        <polygon points="930,1655 1414,1290 1414,1540 930,1896" fill="url(#sf)" opacity="0.9"/>
        <polygon points="1366,1622 1366,1862 1190,2000 860,2000" fill="url(#se)"/>
        <polygon points="1140,2000 1414,1790 1414,2000" fill="url(#sd)" opacity="0.55"/>
      </svg>`;

    async function load() {
      const esc = escapeHtml;
      const content = document.getElementById('content');
      const [{ data, error }, { data: settings }] = await Promise.all([
        supabaseClient.rpc('get_schedule_of_rates'),
        supabaseClient.from('company_settings').select('*').eq('id', 1).single(),
      ]);
      if (error || !data) { content.innerHTML = `<div class="error-box" style="margin:24px;">The Schedule of Rates could not be loaded. Please try again or contact us.</div>`; return; }

      const s = settings || {};
      s.logo_url = await smallLogoUrl(s.logo_url);
      const QUOTE_EMAIL = 'sales@thomsonenergy.com.au';
      const licenceText = (s.licenses || '').split('|').map(x => x.trim()).filter(Boolean).join(' | ');
      const contactHtml = `<div class="pg-contact">
        <a href="mailto:${QUOTE_EMAIL}">${QUOTE_EMAIL}</a><br>
        ${s.phone ? `Tel. <a href="tel:${esc(String(s.phone).replace(/[^+\d]/g, ''))}">${esc(s.phone)}</a><br>` : ''}
        ${s.address ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.address)}">${esc(s.address)}</a><br>` : ''}
        ${s.abn ? `ABN ${esc(s.abn)}<br>` : ''}
        ${licenceText ? `${esc(licenceText)}<br>` : ''}
        <span class="pg-date">${esc(ratesAsAtText(data.reviewed_on))}</span></div>`;
      const siteLink = s.website ? (/^https?:/i.test(s.website) ? s.website : 'https://' + s.website) : '';
      const logoImg = s.logo_url
        ? `<img class="pg-logo" src="${s.logo_url}" alt="${esc(s.company_name || '')}" />`
        : `<span class="pg-brand-name">${esc(s.company_name || '')}</span>`;

      const head = `<div class="pg-head"><div>${siteLink ? `<a href="${esc(siteLink)}">${logoImg}</a>` : logoImg}</div>${contactHtml}</div>`;
      const [first, second] = scheduleOfRatesParts(data.rates, data.reviewed_on);
      content.innerHTML = `
        <section class="pg">
          ${SLABS}
          ${head}
          <div class="pg-body sor">
            <h1 class="pg-title">Schedule<br>of rates</h1>
            ${first}
          </div>
        </section>
        <section class="pg">
          ${SLABS.replace(/id="s([def])"/g, 'id="t$1"').replace(/url\(#s([def])\)/g, 'url(#t$1)')}
          ${head}
          <div class="pg-body sor">${second}</div>
        </section>`;
    }

    load().then(async () => {
      // generate-client-document-pdf.js waits for data-print-ready (images and fonts loaded)
      const images = [...document.querySelectorAll('img')];
      await Promise.all(images.map((img) => img.complete ? Promise.resolve() : new Promise((res) => { img.onload = img.onerror = res; })));
      try { await Promise.race([document.fonts.ready, new Promise((res) => setTimeout(res, 4000))]); } catch (e) { /* fonts are cosmetic */ }
      document.body.dataset.printReady = 'true';
    });
  </script>
</body>
</html>
