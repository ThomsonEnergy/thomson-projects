<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('te-theme') || 'dark');</script>
<title>Log in - Thomson Energy Projects</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=8" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="wrap" style="max-width:420px; padding-top:80px;">
    <img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" style="height:64px; display:block; margin-bottom:24px;" />
    <h1>Projects</h1>
    <p class="subtitle">Staff login</p>
    <div class="card">
      <form id="login-form">
        <label>Email</label>
        <input type="email" id="email" required autocomplete="username" />
        <label>Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
        <div style="margin-top:20px;">
          <button type="submit" style="width:100%">Log in</button>
        </div>
      </form>
      <div id="msg"></div>
    </div>
    <p class="subtitle">First time setup? Create your team's logins in Supabase under Authentication &gt; Users, then log in here.</p>
  </div>

  <script src="/js/supabase-client.js?v=2"></script>
  <script src="/js/theme.js"></script>
  <script>
    const landingPage = '/home.html';

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg');
      msg.innerHTML = '';

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        msg.innerHTML = `<div class="error-box">${error.message}</div>`;
        return;
      }
      window.location.href = landingPage;
    });

    // If already logged in, skip straight to the landing page.
    supabaseClient.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = landingPage;
    });
  </script>
</body>
</html>
