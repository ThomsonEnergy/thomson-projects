<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('te-theme') || (matchMedia('(pointer: coarse)').matches ? 'dark' : 'navy'));</script>
<title>Vehicle Stock - Thomson Energy</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=23" />
<script src="/js/vendor/supabase-2.js?v=1"></script>
</head>
<body>
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('mobile-menu-dropdown').classList.toggle('open')">&#9776;</button>
    <div class="mobile-menu-dropdown" id="mobile-menu-dropdown"></div>
    <nav class="topbar-tabs" id="topbar-tabs"></nav>
    <div class="topbar-right">
      <a href="/schedule.html" class="topbar-icon-link" title="Schedule">&#128197;</a>
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/home.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="wrap" id="content">
    <p class="subtitle">Loading...</p>
  </div>

  <script src="/js/supabase-client.js?v=107"></script>
  <script src="/js/theme.js?v=2"></script>
  <script>
    const vehicleId = new URLSearchParams(window.location.search).get('id');
    let currentVehicle = null;

    async function loadVehicleStock() {
      const { data: vehicle, error } = await supabaseClient.from('fleet_vehicles').select('*').eq('id', vehicleId).single();
      if (error || !vehicle) {
        document.getElementById('content').innerHTML = `<div class="error-box">Vehicle not found.</div>`;
        return;
      }
      currentVehicle = vehicle;

      const { data: stockRows } = await supabaseClient
        .from('material_stock_by_location')
        .select('*, materials(id, name, cost_price, is_consumable, pack_label)')
        .eq('vehicle_id', vehicleId)
        .eq('location_type', 'vehicle')
        .gt('quantity', 0);

      const { data: pos } = await supabaseClient
        .from('purchase_orders')
        .select('*, purchase_order_line_items(*), suppliers(name)')
        .eq('vehicle_id', vehicleId)
        .order('created_at', { ascending: false });

      const billsByPo = await loadBillsForPos((pos || []).map(p => p.id));
      const myRole = await getMyRole();
      render(vehicle, stockRows || [], pos || [], billsByPo, myRole);
    }

    function render(vehicle, stockRows, pos, billsByPo, myRole) {
      document.getElementById('content').innerHTML = `
        <a href="/fleet.html" class="link-quiet">&larr; Fleet</a>
        <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px; margin-top:8px;">
          <div>
            <h1>${escapeHtml(vehicle.vehicle_name || vehicle.rego)}</h1>
            <p class="subtitle">${escapeHtml(vehicle.rego)}${vehicle.asset_number ? ' &middot; Asset ' + escapeHtml(vehicle.asset_number) : ''}</p>
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" class="secondary" id="move-stock-btn">+ Move stock here from Warehouse</button>
            <button type="button" class="secondary" id="stocktake-btn">Stocktake</button>
            <button id="create-po-btn">+ Buy for this vehicle (PO)</button>
          </div>
        </div>

        <div class="card">
          <h2>Current stock</h2>
          ${!stockRows.length ? '<p class="subtitle">No stock assigned to this vehicle yet.</p>' : `
            <table class="responsive-stack">
              <thead><tr><th>Material</th><th class="num">Quantity</th><th class="num">Value</th></tr></thead>
              <tbody>
                ${stockRows.map(r => `
                  <tr>
                    <td data-label="Material">${escapeHtml(r.materials?.name || 'Unknown')}</td>
                    <td class="num" data-label="Quantity"><button type="button" class="secondary btn-sm veh-qty-btn" data-material-id="${escapeHtml(r.material_id)}" data-name="${escapeHtml(r.materials?.name || '')}" data-qty="${escapeHtml(r.quantity)}" title="Tap to correct the count">${escapeHtml(r.quantity)}</button>${r.materials?.is_consumable ? ` <button type="button" class="secondary btn-sm veh-low-btn" data-material-id="${escapeHtml(r.material_id)}" data-name="${escapeHtml(r.materials?.name || '')}" title="One tap: Admin is told to restock">Running low</button>` : ''}</td>
                    <td class="num" data-label="Value">${money(r.quantity * (r.materials?.cost_price || 0))}</td>
                  </tr>`).join('')}
              </tbody>
            </table>`}
        </div>

        <div class="card">
          <h2>Purchase orders for this vehicle</h2>
          <div id="veh-po-list">
            ${!pos.length ? '<p class="subtitle">None yet.</p>' : pos.map(po => {
              const isStockPull = !po.supplier_id;
              return `
                <div style="border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px;">
                  <div style="display:flex; justify-content:space-between;">
                    <strong>${isStockPull ? 'From Warehouse stock' : escapeHtml(po.suppliers?.name || po.supplier_name || 'Unknown supplier')}</strong>
                    ${renderPoBadges(po)}
                  </div>
                  ${renderPoLineItemsReceivable(po, true)}
                  ${renderPoBills(billsByPo[po.id], po, myRole)}
                  ${po.supplier_id && !po.closed_at ? `<button type="button" class="secondary upload-invoice-btn" data-po-id="${po.id}" style="font-size:12px; padding:6px 10px; margin-top:8px;">Upload invoice</button>` : ''}
                </div>`;
            }).join('')}
          </div>
        </div>
      `;

      document.getElementById('create-po-btn').addEventListener('click', openCreatePoPanel);
      const vehLabel = vehicle.vehicle_name || vehicle.rego;
      document.getElementById('move-stock-btn').addEventListener('click', () => openStockTransferPanel({ fromLoc: 'warehouse', fromVehicleId: null, fromLabel: 'Warehouse', toLoc: 'vehicle', toVehicleId: vehicleId, toLabel: vehLabel, onDone: loadVehicleStock }));
      document.getElementById('stocktake-btn').addEventListener('click', () => openStocktakePanel({ loc: 'vehicle', vehicleId, placeLabel: vehLabel, onDone: loadVehicleStock }));
      document.querySelectorAll('.veh-low-btn').forEach(btn => btn.addEventListener('click', async () => {
        btn.disabled = true;
        const { error } = await supabaseClient.rpc('stock_flag_low', { p_material_id: btn.dataset.materialId, p_loc: 'vehicle', p_vehicle_id: vehicleId, p_note: null });
        if (error) { alert(friendlyError(error)); btn.disabled = false; return; }
        showToast(`${btn.dataset.name}: flagged running low, Admin has been told`);
        btn.textContent = 'Flagged';
      }));

      // Tap a count to correct it: one server step, logged on the item with who and why.
      document.querySelectorAll('.veh-qty-btn').forEach(btn => btn.addEventListener('click', async () => {
        const raw = prompt(`How many ${btn.dataset.name} are actually in ${vehicle.vehicle_name || vehicle.rego}? (app has ${btn.dataset.qty})`, btn.dataset.qty);
        if (raw === null) return;
        const qty = Number(raw);
        if (!(qty >= 0)) { alert('Enter a number, 0 or more.'); return; }
        if (qty === Number(btn.dataset.qty)) return;
        const reason = prompt('Why is the count different? (e.g. stocktake, used on a job, damaged)', '');
        if (reason === null) return;
        btn.disabled = true;
        try {
          await setStockCount(btn.dataset.materialId, 'vehicle', vehicleId, qty, reason);
          showToast(`${btn.dataset.name}: count set to ${qty}`);
          await loadVehicleStock();
        } catch (err) { alert(friendlyError(err)); btn.disabled = false; }
      }));

      document.querySelectorAll('.upload-invoice-btn').forEach(btn => {
        btn.addEventListener('click', () => uploadInvoiceForPo(pos.find(p => p.id === btn.dataset.poId)));
      });

      wirePoBillButtons(document.getElementById('veh-po-list'), loadVehicleStock);
      wireReceiveLineItemButtons(
        document.getElementById('veh-po-list'),
        pos,
        () => 'vehicle', // POs on this page default to this vehicle
        loadVehicleStock
      );
    }

    async function openCreatePoPanel() {
      const { data: suppliers } = await supabaseClient.from('suppliers').select('id, name').order('name');
      const { data: materials } = await supabaseClient.from('materials').select('id, name, cost_price').order('name');

      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:560px; width:100%; max-height:90vh; overflow-y:auto;">
          <h2>Buy for ${escapeHtml(currentVehicle.vehicle_name || currentVehicle.rego)}</h2>
          <p class="subtitle" style="margin-bottom:8px;">A PO to a supplier, received into this vehicle. Gear from the shed is moved with "Move stock here from Warehouse" instead (no PO).</p>

          <div id="cp-supplier-section">
            <label>Supplier</label>
            ${supplierPickerHtml({ search: 'cp-supplier-search', results: 'cp-supplier-results', selected: 'cp-supplier-selected', newSection: 'cp-supplier-new-section', newEmail: 'cp-supplier-new-email', newPhone: 'cp-supplier-new-phone' })}
            <button type="button" class="secondary" id="cp-upload-invoice-btn" style="margin-top:8px; font-size:12px; padding:6px 10px;">Or upload the supplier's invoice instead</button>
          </div>

          ${poTypeChoiceHtml('cp')}
          <div id="cp-items-container"></div>
          <button type="button" class="secondary" id="cp-add-line-btn" style="font-size:12px; padding:6px 10px;">+ Add item</button>

          <div style="margin-top:14px;">
            <button id="cp-save-btn">Create PO</button>
            <button type="button" class="secondary" id="cp-cancel-btn">Cancel</button>
          </div>
          <div id="cp-msg"></div>
        </div>`;
      document.body.appendChild(overlay);

      const resolveSupplier = wireSupplierPicker(overlay, suppliers, { search: 'cp-supplier-search', results: 'cp-supplier-results', selected: 'cp-supplier-selected', newSection: 'cp-supplier-new-section', newEmail: 'cp-supplier-new-email', newPhone: 'cp-supplier-new-phone' });
      wireUploadInvoiceButton(overlay.querySelector('#cp-upload-invoice-btn'), overlay.querySelector('#cp-msg'));

      buildMaterialSearchRow(materials || [], 'cp-items-container');
      overlay.querySelector('#cp-add-line-btn').addEventListener('click', () => buildMaterialSearchRow(materials || [], 'cp-items-container'));

      overlay.querySelector('#cp-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#cp-save-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#cp-msg');
        const source = 'supplier';
        const btn = overlay.querySelector('#cp-save-btn');
        const label = btn.textContent;
        const lineProblem = materialLineRowsProblem('cp-items-container');
        if (lineProblem) { msg.innerHTML = `<div class="error-box">${escapeHtml(lineProblem)}</div>`; return; }
        btn.disabled = true;
        btn.textContent = 'Creating...';

        try {
          let supplierId = null, supplierName = null;
          if (source === 'supplier') {
            ({ supplierId, supplierName } = await resolveSupplier());
            if (!supplierId) { msg.innerHTML = `<div class="error-box">Search for an existing supplier or type a new one.</div>`; return; }
          }

          const { data: { user } } = await supabaseClient.auth.getUser();

          const { data: newPo, error: poErr } = await supabaseClient.from('purchase_orders').insert({
            project_id: null, vehicle_id: vehicleId, supplier_id: supplierId, supplier_name: supplierName || 'Warehouse', // supplier_name is required
            po_type: supplierId ? readPoTypeChoice(overlay, 'cp') : 'fixed', locked: false, status: 'ordered', amount: 0,
            description: source === 'stock' ? 'Pulled from Warehouse stock' : 'Purchased for vehicle',
          }).select('id, po_number').single();
          if (poErr) throw poErr;
          await logActivity('purchase_order', newPo.id, 'created', `PO ${newPo.po_number || ''} created for ${currentVehicle.vehicle_name || currentVehicle.rego} - ${source === 'stock' ? 'pulled from Warehouse' : supplierName}`);

          const lines = readMaterialLineRows('cp-items-container').map(l => ({
            po_id: newPo.id, material_id: l.materialId, description: l.description,
            quantity: l.quantity, unit_cost: l.unit_cost, added_by: user.id,
          }));
          if (lines.length) {
            const { error: liErr } = await supabaseClient.from('purchase_order_line_items').insert(lines);
            if (liErr) throw liErr;
          }

          overlay.remove();
          await loadVehicleStock();
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`;
        } finally {
          btn.disabled = false;
          btn.textContent = label;
        }
      });
    }

    (async function () {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();
      renderMainNav('fleet');
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });
      if (!vehicleId) {
        document.getElementById('content').innerHTML = `<div class="error-box">No vehicle specified.</div>`;
        return;
      }
      await loadVehicleStock();
    })();
  </script>
</body>
</html>
