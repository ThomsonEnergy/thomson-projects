        + (open.length ? '' : '<p class="subtitle" style="font-size:11px; margin:2px 10px;">For matters that are not a job, like a supplier dispute or a licence application.</p>')
        + (finished.length ? `<div class="side-head"><span>Finished (${finished.length})</span><a href="#" id="finished-toggle">${showFinished ? 'hide' : 'show'}</a></div>` + (showFinished ? finished.map(l => `<a class="side-item ${S.view === 'label:' + l.id ? 'on' : ''}" data-view="label:${l.id}"><span style="color:var(--muted);">${escapeHtml(l.name)}</span></a>`).join('') : '') : '')
        + `<div class="side-head"><span>Jobs</span></div>` + item('jobs', 'Tagged to jobs')
        + `<div class="side-head"><span>Tools</span></div>` + item('cleanup', 'Clean up')
        + (S.box === 'mine' ? `<a class="side-item" id="disconnect-link"><span style="color:var(--muted); font-size:12px;">Disconnect my Gmail</span></a>` : '');
      side.querySelectorAll('[data-view]').forEach(a => a.addEventListener('click', () => {
        S.view = a.dataset.view; S.activeThreadId = null; S.search = ''; document.getElementById('inbox-search').value = '';
        clearInterval(S.cleanupTimer); renderSide(); S.view === 'cleanup' ? renderCleanup() : loadList();
      }));
      document.getElementById('new-label-link').addEventListener('click', (e) => { e.preventDefault(); openLabelEditor(null); });
      const ft = document.getElementById('finished-toggle');
      if (ft) ft.addEventListener('click', (e) => { e.preventDefault(); S.showFinished = !S.showFinished; renderSide(); });
      const dl = document.getElementById('disconnect-link');
      if (dl) dl.addEventListener('click', disconnectMine);
      // right-click (hold on the phone) on a label: its menu
      side.querySelectorAll('[data-view^="label:"]').forEach(a => {
        a.addEventListener('contextmenu', (e) => { e.preventDefault(); const l = S.labels.find(x => x.id === a.dataset.view.slice(6)); if (l) labelMenu(l, e.clientX, e.clientY, a); });
        holdToOpen(a, (x, y) => { const l = S.labels.find(x2 => x2.id === a.dataset.view.slice(6)); if (l) labelMenu(l, x, y, a); });
      });
    }

    // ---------- menus: right-click on a laptop, hold on the phone (item 81) ----------

    let menuOff = null; // the open menu's document listeners, removed with it
    function closeMenu() { document.querySelectorAll('.ctx-menu').forEach(m => m.remove()); if (menuOff) { menuOff(); menuOff = null; } }
    // items: { label, run, danger } or { head } or '-' for a line. src: the element asked, so a
    // hold and a contextmenu on the same spot (Android fires both) open one menu, not two
    function showMenu(x, y, items, src) {
      if (src && src.dataset.menuAt && Date.now() - +src.dataset.menuAt < 700) return;
      if (src) src.dataset.menuAt = String(Date.now());
      closeMenu();
      const m = document.createElement('div');
      m.className = 'ctx-menu';
      m.innerHTML = items.map((it, i) => it === '-' ? '<div class="sep"></div>' : it.head ? `<div class="head">${escapeHtml(it.head)}</div>` : `<button type="button" data-i="${i}" class="${it.danger ? 'danger' : ''}">${escapeHtml(it.label)}</button>`).join('');
      document.body.appendChild(m);
      const r = m.getBoundingClientRect();
      m.style.left = Math.max(4, Math.min(x, window.innerWidth - r.width - 8)) + 'px';
      m.style.top = Math.max(4, Math.min(y, window.innerHeight - r.height - 8)) + 'px';
      m.addEventListener('click', (e) => e.stopPropagation());
      m.querySelectorAll('button').forEach(b => b.addEventListener('click', () => { const it = items[+b.dataset.i]; closeMenu(); it.run(); }));
      setTimeout(() => {
        if (!m.isConnected) return;
        const esc = (e) => { if (e.key === 'Escape') closeMenu(); };
        const away = () => closeMenu();
        document.addEventListener('click', away);
        document.addEventListener('contextmenu', away);
        document.addEventListener('keydown', esc);
        menuOff = () => { document.removeEventListener('click', away); document.removeEventListener('contextmenu', away); document.removeEventListener('keydown', esc); };
      }, 0);
    }
    // hold (500 ms, no movement) opens a menu on a touch screen
    function holdToOpen(el, open) {
      let timer = null, sx = 0, sy = 0;
      el.addEventListener('touchstart', (e) => {
        if (e.touches.length !== 1) return;
        sx = e.touches[0].clientX; sy = e.touches[0].clientY;
        timer = setTimeout(() => { timer = null; el.dataset.held = '1'; open(sx, sy); }, 500);
      }, { passive: true });
      el.addEventListener('touchmove', (e) => { if (timer && (Math.abs(e.touches[0].clientX - sx) > 10 || Math.abs(e.touches[0].clientY - sy) > 10)) { clearTimeout(timer); timer = null; } }, { passive: true });
      const stop = () => { if (timer) { clearTimeout(timer); timer = null; } };
      el.addEventListener('touchend', (e) => { stop(); if (el.dataset.held) { delete el.dataset.held; e.preventDefault(); } });
      el.addEventListener('touchcancel', stop);
    }
    // a menu of labels to pick one (move, merge)
    function pickLabel(x, y, { head, exclude, onPick, allowNew }) {
      const items = [{ head }];
      S.labels.filter(l => l.status === 'open' && l.id !== exclude).sort((a, b) => a.name.localeCompare(b.name)).forEach(l => items.push({ label: l.name, run: () => onPick(l) }));
      if (allowNew) items.push('-', { label: 'New label...', run: async () => {
        const name = prompt('Name for the new label (who: what, e.g. Supplier dispute: Middys)');
        if (!name || !name.trim()) return;
        try { const r = await act('create_label', { mailbox_id: mb().id, name: name.trim() }); await loadLabels(); onPick(r.label); } catch (err) { alert(err.message); }
      } });
      if (items.length === 1) items.push({ label: 'No other label yet', run: () => {} });
      showMenu(x, y, items);
    }
    const afterChange = async (threadId) => { await Promise.all([loadLabels(), loadDrafts()]); await renderSide(); await loadList(); if (threadId && S.activeThreadId === threadId) openThread(threadId, { keepUrl: true }); };
    function labelMenu(label, x, y, src) {
      const done = label.status === 'done';
      showMenu(x, y, [
        { head: label.name },
        { label: 'Open', run: () => { S.view = 'label:' + label.id; S.activeThreadId = null; S.search = ''; document.getElementById('inbox-search').value = ''; renderSide(); loadList(); } },
        { label: 'Rename', run: async () => { const name = prompt('New name', label.name); if (!name || !name.trim() || name.trim() === label.name) return; try { await act('update_label', { label_id: label.id, name: name.trim() }); } catch (err) { alert(err.message); } afterChange(); } },
        { label: 'What belongs here', run: () => openLabelEditor(label) },
        { label: 'Merge into...', run: () => pickLabel(x, y, { head: `Merge "${label.name}" into`, exclude: label.id, onPick: async (into) => {
          if (!confirm(`Move every conversation from "${label.name}" into "${into.name}" and remove "${label.name}"?`)) return;
          try { await act('merge_label', { label_id: label.id, into_label_id: into.id }); } catch (err) { alert(err.message); return; }
          if (S.view === 'label:' + label.id) S.view = 'label:' + into.id;
          afterChange();
        } }) },
        { label: done ? 'Reopen' : 'Finished', run: async () => { try { await act('update_label', { label_id: label.id, status: done ? 'open' : 'done' }); } catch (err) { alert(err.message); } afterChange(); } },
        '-',
        { label: 'Delete', danger: true, run: async () => {
          if (!confirm(`Delete "${label.name}"? The emails stay, only the label goes.${label.by_ai ? ' Postie will not label these senders again.' : ''}`)) return;
          try { await act('delete_label', { label_id: label.id }); } catch (err) { alert(err.message); return; }
          if (S.view === 'label:' + label.id) S.view = 'priority';
          afterChange();
        } },
      ], src);
    }
    function rowMenu(t, x, y, src) {
      const inLabel = !S.search && S.view.startsWith('label:') ? S.view.slice(6) : null;
      const onThread = (S.rowLabels[t.id] || []).map(x2 => S.labels.find(l => l.id === x2.label_id)).filter(Boolean);
      const items = [
        { label: 'Open', run: () => openThread(t.id) },
        !t.assigned_to || t.assigned_to !== S.me.id ? { label: !t.assigned_to ? "I've got this" : 'Take over', run: async () => { try { await act('assign', { thread_id: t.id, user_id: S.me.id }); } catch (err) { alert(err.message); } afterChange(t.id); } }
          : { label: 'Not mine any more', run: async () => { try { await act('assign', { thread_id: t.id, user_id: null }); } catch (err) { alert(err.message); } afterChange(t.id); } },
        { label: t.is_done ? 'Move back to inbox' : 'Done', run: async () => { try { await act('done', { thread_id: t.id, done: !t.is_done }); } catch (err) { alert(err.message); } if (S.activeThreadId === t.id) { closeReading(); setUrl(); } afterChange(); } },
        { label: t.is_read ? 'Mark unread' : 'Mark read', run: async () => { try { await setRead(t.id, !t.is_read); } catch (err) { alert(err.message); } afterChange(); } },
        { label: 'Tag to a job...', run: () => openTagEmailModal({ threadId: t.id, onSaved: () => afterChange(t.id) }) },
        '-',
        { label: inLabel ? 'Move to label...' : 'Add a label...', run: () => pickLabel(x, y, { head: inLabel ? 'Move to' : 'Add label', exclude: inLabel, allowNew: true, onPick: async (l) => {
          try { await act(inLabel ? 'move_label' : 'add_label', inLabel ? { thread_id: t.id, from_label_id: inLabel, to_label_id: l.id } : { thread_id: t.id, label_id: l.id }); } catch (err) { alert(err.message); }
          afterChange(t.id);
        } }) },
        ...onThread.map(l => ({ label: `Remove label: ${l.name}`, run: async () => { try { await act('remove_label', { thread_id: t.id, label_id: l.id }); } catch (err) { alert(err.message); } afterChange(t.id); } })),
      ];
      showMenu(x, y, items, src);
    }
    // the phone: swipe left on a row for Done, right for Read or Unread; a hold opens the menu
    function bindRowTouch(listBody) {
      let sw = null, holdTimer = null;
      const reset = (row) => { row.classList.remove('swiping', 'swipe-done', 'swipe-read'); row.style.transform = ''; row.dataset.swipe = ''; };
      listBody.addEventListener('touchstart', (e) => {
        const row = e.target.closest('.ib-row');
        if (!row || e.touches.length !== 1 || row.dataset.id.startsWith('draft:')) { sw = null; return; }
        sw = { row, x: e.touches[0].clientX, y: e.touches[0].clientY, dx: 0, lock: null, held: false };
        holdTimer = setTimeout(() => { holdTimer = null; if (sw && !sw.lock) { sw.held = true; const t = S.rowThreads[row.dataset.id]; if (t) rowMenu(t, sw.x, sw.y, row); } }, 500);
      }, { passive: true });
      listBody.addEventListener('touchmove', (e) => {
        if (!sw) return;
        const dx = e.touches[0].clientX - sw.x, dy = e.touches[0].clientY - sw.y;
        if (!sw.lock) { if (Math.abs(dx) < 12 && Math.abs(dy) < 12) return; sw.lock = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y'; if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; } }
        if (sw.lock !== 'x' || sw.held) return;
        const t = S.rowThreads[sw.row.dataset.id] || {};
        sw.dx = Math.max(-140, Math.min(140, dx));
        sw.row.classList.add('swiping');
        sw.row.style.transform = `translateX(${sw.dx}px)`;
        const armed = Math.abs(sw.dx) >= 70;
        sw.row.classList.toggle('swipe-done', sw.dx < 0 && armed);
        sw.row.classList.toggle('swipe-read', sw.dx > 0 && armed);
        sw.row.dataset.swipe = !armed ? '' : sw.dx < 0 ? 'Done' : (t.is_read ? 'Unread' : 'Read');
      }, { passive: true });
      const end = async (e) => {
        if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
        if (!sw) return;
        const { row, dx, held, lock } = sw; sw = null;
        if (held) { e.preventDefault(); return; }
        if (lock !== 'x') return;
        const t = S.rowThreads[row.dataset.id];
        if (!t || Math.abs(dx) < 70) { reset(row); return; }
        e.preventDefault();
        try {
          if (dx < 0) { row.classList.add('gone'); row.style.transform = 'translateX(-110%)'; await act('done', { thread_id: t.id, done: true }); if (S.activeThreadId === t.id) { closeReading(); setUrl(); } }
          else { reset(row); await setRead(t.id, !t.is_read); }
        } catch (err) { alert(err.message); }
        afterChange();
      };
      listBody.addEventListener('touchend', end);
      listBody.addEventListener('touchcancel', () => { if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; } if (sw) reset(sw.row); sw = null; });
    }

    // ---------- the list ----------

    // `waitFor`: labels and drafts still loading (first load of a box); the list paints
    // without their chips first, then again once they and the latest emails are in.
    // Two short lines per conversation (who and time, then subject and status), like Gmail's
    // list squeezed beside a reading pane; a search box
    // above it looks through the whole inbox (subject, sender, client, words in the email).
    async function loadList(waitFor) {
      const listEl = document.getElementById('thread-list');
      onePane(false);
      const m = mb();
      const seq = ++S.listSeq;
      const key = [S.box, S.view, S.unreadOnly, S.mineOnly, S.search].join('|');
      if (key !== S.listKey) { S.listKey = key; listEl.innerHTML = '<p class="subtitle" style="padding:8px 10px;">Loading...</p>'; }
      let threads = [], header = '', latest = {}, sentRows = null, jobGroups = null;
      const q = S.search.trim();
      const draftsView = !q && S.view === 'drafts';
      const labelId = !q && S.view.startsWith('label:') ? S.view.slice(6) : null;
      let label = labelId ? S.labels.find(l => l.id === labelId) : null;
      const mineBox = `<label title="Only conversations assigned to you"><input type="checkbox" id="mine-only" style="width:auto;" ${S.mineOnly ? 'checked' : ''} /> Mine</label>`;

      if (q) {
        // the whole inbox: subject, the client's name, the sender or words in an email
        // (words in the email only from three letters: that leg reads every email in the inbox)
        const like = '%' + q.replace(/[%,()"'\\]/g, ' ').trim() + '%';
        const legs = await Promise.all([
          baseThreads().ilike('subject', like).order('last_message_at', { ascending: false, nullsFirst: false }).limit(100),
          supabaseClient.from('clients').select('id').ilike('name', like).limit(50)
            .then((r) => (r.error ? r : r.data.length ? baseThreads().in('client_id', r.data.map(c => c.id)).order('last_message_at', { ascending: false, nullsFirst: false }).limit(100) : { data: [] })),
          q.length < 3 ? { data: [] } : supabaseClient.from('emails').select('thread_id, email_threads!inner(mailbox_id, is_supplier_bill)').eq('email_threads.mailbox_id', m.id).eq('email_threads.is_supplier_bill', false)
            .or(`from_address.ilike.${like},body_text.ilike.${like}`).order('sent_at', { ascending: false }).limit(150)
            .then((r) => { if (r.error) return r; const ids = [...new Set(r.data.map(e => e.thread_id))]; return ids.length ? baseThreads().in('id', ids).limit(150) : { data: [] }; }),
        ]);
        if (seq !== S.listSeq) return;
        const failed = legs.find(r => r.error);
        if (failed) { listEl.innerHTML = `<div class="error-box">The search did not work: ${escapeHtml(failed.error.message)}</div>`; return; }
        const seen = new Map();
        legs.forEach(r => (r.data || []).forEach(t => seen.set(t.id, t)));
        threads = [...seen.values()].sort((a, b) => String(b.last_message_at || '').localeCompare(String(a.last_message_at || ''))).slice(0, 200);
      } else if (draftsView) {
        // the rows come from S.drafts when the list paints
      } else if (S.view === 'jobs') {
        // the last 30 days of this inbox's conversations that are tagged to a job, grouped by job
        const since = new Date(Date.now() - 30 * 86400000).toISOString();
        let jq = supabaseClient.from('email_job_links')
          .select('thread_id, kind, project_id, projects(id, name, job_number, quote_number, client_name), email_threads!inner(*, clients(name))')
          .eq('email_threads.mailbox_id', m.id).eq('email_threads.is_supplier_bill', false).gt('email_threads.last_message_at', since).limit(600);
        if (S.mineOnly) jq = jq.eq('email_threads.assigned_to', S.me.id);
        const { data, error } = await jq;
        if (seq !== S.listSeq) return;
        if (error) { listEl.innerHTML = `<div class="error-box">${escapeHtml(error.message)}</div>`; return; }
        const groups = new Map();
        (data || []).filter(l => l.projects && l.email_threads).forEach(l => {
          const g = groups.get(l.project_id) || { project: l.projects, threads: new Map() };
          g.threads.set(l.thread_id, l.email_threads);
          groups.set(l.project_id, g);
        });
        jobGroups = [...groups.values()].map(g => ({ project: g.project, threads: [...g.threads.values()].sort((a, b) => String(b.last_message_at || '').localeCompare(String(a.last_message_at || ''))) }))
          .sort((a, b) => String(b.threads[0].last_message_at || '').localeCompare(String(a.threads[0].last_message_at || '')));
        threads = jobGroups.flatMap(g => g.threads);
      } else if (S.view === 'sent') {
        const { data, error } = await supabaseClient.from('emails')
          .select('id, thread_id, to_addresses, sent_at, email_threads!inner(id, subject, mailbox_id, is_supplier_bill, clients(name))')
          .eq('direction', 'outbound').eq('email_threads.mailbox_id', m.id).eq('email_threads.is_supplier_bill', false)
          .order('sent_at', { ascending: false }).limit(150);
        if (seq !== S.listSeq) return;
        if (error) { listEl.innerHTML = `<div class="error-box">${escapeHtml(error.message)}</div>`; return; }
        sentRows = data || [];
      } else {
        let tq = baseThreads();
        if (labelId) {
          const { data: links } = await supabaseClient.from('email_thread_labels').select('thread_id').eq('label_id', labelId).limit(1000);
          tq = tq.in('id', (links || []).map(l => l.thread_id).concat(['00000000-0000-0000-0000-000000000000']));
        } else {
          tq = viewFilter[S.view](tq);
        }
        if (S.unreadOnly) tq = tq.eq('is_read', false);
        if (S.mineOnly) tq = tq.eq('assigned_to', S.me.id);
        const { data, error } = await tq.order('last_message_at', { ascending: false, nullsFirst: false }).limit(200);
        if (seq !== S.listSeq) return;
        if (error) { listEl.innerHTML = `<div class="error-box">${escapeHtml(error.message)}</div>`; return; }
        threads = data || [];
        // Priority: nobody on it first, so an unclaimed client is never buried under claimed ones
        if (S.view === 'priority') threads.sort((a, b) => (a.assigned_to ? 1 : 0) - (b.assigned_to ? 1 : 0));
      }
      const threadIds = sentRows ? [...new Set(sentRows.map(r => r.thread_id))] : threads.map(t => t.id);
      const labelsBy = {};
      // First paint straight away (no who line or chips yet), then the rest in parallel.
      if (threadIds.length || draftsView) paint(true);
      await Promise.all([
        threads.length ? supabaseClient.from('emails').select('thread_id, direction, from_address, to_addresses, sent_at, created_by')
          .in('thread_id', threads.map(t => t.id)).order('sent_at', { ascending: false }).limit(1500)
          .then(({ data: recent }) => { (recent || []).forEach(e => { if (!latest[e.thread_id]) latest[e.thread_id] = e; }); }) : null,
        threadIds.length ? supabaseClient.from('email_thread_labels').select('thread_id, label_id, by_ai').in('thread_id', threadIds)
          .then(({ data: tl }) => { (tl || []).forEach(x => { (labelsBy[x.thread_id] = labelsBy[x.thread_id] || []).push(x); }); }) : null,
        waitFor,
      ]);
      if (seq !== S.listSeq) return;
      if (labelId) label = S.labels.find(l => l.id === labelId) || null;
      paint(false);

      function paint(partial) {
        S.rowThreads = Object.fromEntries(threads.map(t => [t.id, t]));
        S.rowLabels = labelsBy;
        const draftBy = Object.fromEntries(S.drafts.filter(d => d.thread_id).map(d => [d.thread_id, d]));
        const chips = (id) => (labelsBy[id] || []).map(x => { const l = S.labels.find(y => y.id === x.label_id); return l ? `<span class="chip ${x.by_ai ? 'ai' : ''}"><span class="label-dot"></span>${escapeHtml(l.name)}</span>` : ''; }).join('')
          + (draftBy[id] ? `<span class="chip draft">${draftBy[id].by_ai ? escapeHtml(S.assistant) + ' drafted a reply' : 'Draft'}</span>` : '');
        const filters = `<label><input type="checkbox" id="unread-only" style="width:auto;" ${S.unreadOnly ? 'checked' : ''} /> Unread only</label>${mineBox}`;
        const note = (text) => `<p class="subtitle note">${text}</p>`;

        if (q) {
          header = `<h3>Search</h3><span class="subtitle" style="font-size:12px;">${threads.length} conversation${threads.length === 1 ? '' : 's'} for "${escapeHtml(q)}"</span>`;
        } else if (draftsView) {
          header = `<h3>Drafts</h3>` + note(`Replies waiting to be checked and sent. ${escapeHtml(S.assistant)} drafts replies to Priority emails here; a draft opens its conversation.`);
        } else if (labelId && !label) {
          header = '<h3>Label</h3>';
        } else if (label) {
          const sweep = label.sweep_requested_at ? `${escapeHtml(S.assistant)} is checking the last 60 days of mail for this label...` : label.sweep_done_at ? `Older mail checked ${timeAgo(label.sweep_done_at)}.` : '';
          header = `<h3>${escapeHtml(label.name)}</h3><span class="chip">${label.status === 'done' ? 'Finished' : 'Open'}</span>${label.by_ai ? `<span class="chip ai" title="Made by ${escapeHtml(S.assistant)}">AI</span>` : ''}<button type="button" class="secondary" id="edit-label-btn" style="font-size:12px; padding:3px 10px; margin-left:auto;">Edit</button>`
            + (label.description || sweep ? note(`${escapeHtml(label.description || '')}${label.description && sweep ? ' ' : ''}${sweep}`) : '');
        } else if (jobGroups) {
          header = `<h3>Tagged to jobs</h3>${mineBox}` + note('Last 30 days, newest job first. The job\'s Emails tab shows every inbox.');
        } else {
          const titles = { priority: 'Needs a reply', other: 'Other', updates: 'Subscriptions and updates', sent: 'Sent', done: 'Done', all: 'All' };
          header = `<h3>${titles[S.view]}</h3>` + (S.view === 'sent' ? '' : `<span style="margin-left:auto; display:flex; gap:8px;">${filters}</span>`);
          if (S.view === 'updates') header += note(`Skim when you have time to check ${escapeHtml(S.assistant)} did not miss anything. Wrong place? Open it and move it.`);
          if (S.view === 'priority') header += note('Nobody on it first. Open one and press "I\'ve got this" so the team knows you are handling it.');
        }

        // one row: who (From, or To when we wrote last) and the time, then subject, chips and status
        const rowHtml = (id, { who, client, subject, st, chips: ch, when, unread, title, acts }) => `<a class="ib-row ${id === S.activeThreadId ? 'active' : ''} ${unread ? 'unread' : ''}" data-id="${id}" title="${escapeHtml(title || '')}">`
          + `<span class="who">${escapeHtml(who || 'unknown')}${client ? ` <span style="color:var(--muted); font-weight:400;">&middot; ${escapeHtml(client)}</span>` : ''}</span>`
          + `<span class="mid"><span class="subj">${escapeHtml(subject || '(no subject)')}</span>${st ? `<span class="st ${st.cls || ''}">${escapeHtml(st.text)}</span>` : ''}${ch || ''}</span>`
          + `<span class="when">${when}</span>${acts || ''}</a>`;
        let body;
        if (draftsView) {
          body = S.drafts.map(d => rowHtml('draft:' + d.id, {
            who: 'To ' + (addrName(String(d.to_addresses || '').split(',')[0]) || 'nobody yet'),
            subject: d.subject || d.email_threads?.subject,
            st: { text: String(d.body_text || '').replace(/\s+/g, ' ').trim().slice(0, 140) },
            chips: d.by_ai ? `<span class="chip draft">By ${escapeHtml(S.assistant)}</span>` : '',
            when: whenShort(d.updated_at), title: d.subject || '',
          })).join('') || `<p class="subtitle" style="padding:8px 10px;">No drafts.</p>`;
        } else if (sentRows) {
          body = sentRows.map(e => {
            const t = e.email_threads;
            return rowHtml(t.id, { who: 'To ' + (addrName((e.to_addresses || [])[0]) || 'unknown'), client: t.clients?.name, subject: t.subject, chips: chips(t.id), when: whenShort(e.sent_at), title: t.subject || '' });
          }).join('') || '<p class="subtitle" style="padding:8px 10px;">Nothing sent yet.</p>';
        } else {
          const row = (t) => {
            const l = latest[t.id];
            const out = !!l && l.direction === 'outbound';
            const who = !l ? '' : out ? 'To ' + (addrName((l.to_addresses || [])[0]) || 'unknown') : (addrShort(l.from_address) || 'unknown');
            const reason = t.section === 'priority' && t.section_reason && !out ? t.section_reason : '';
            // first paint: who replied is not known yet when the last message went out
            const st = partial && !l && t.last_direction === 'outbound' ? null : threadStatus(t, l);
            const acts = `<span class="acts">${t.is_done ? '' : '<button type="button" class="secondary" data-act="done" title="Done: out of the inbox">Done</button>'}<button type="button" class="secondary" data-act="read">${t.is_read ? 'Unread' : 'Read'}</button></span>`;
            return rowHtml(t.id, {
              who, client: t.clients?.name, subject: t.subject, chips: chips(t.id), when: whenShort(t.last_message_at), unread: !t.is_read, acts,
              st: st || (reason ? { cls: 'reason', text: reason } : null),
              title: [t.subject, st && st.text, reason].filter(Boolean).join(' | '),
            });
          };
          if (jobGroups) {
            body = jobGroups.map(g => {
              const waiting = g.threads.filter(t => threadStatus(t, latest[t.id])?.cls === 'waiting').length;
              const p = g.project;
              return `<div class="job-group"><span><a href="/project.html?id=${p.id}&tab=emails" class="link-quiet">${escapeHtml(projectRef(p))} ${escapeHtml(p.name || '')}</a>${p.client_name ? `<span class="subtitle" style="font-size:12px;"> &middot; ${escapeHtml(p.client_name)}</span>` : ''}</span><span class="n" ${waiting ? 'style="color:var(--red); font-weight:700;"' : ''}>${waiting ? `${waiting} need${waiting === 1 ? 's' : ''} a reply` : `${g.threads.length} conversation${g.threads.length === 1 ? '' : 's'}`}</span></div>` + g.threads.map(row).join('');
            }).join('') || `<p class="subtitle" style="padding:8px 10px;">${S.mineOnly ? 'Nothing tagged to a job is assigned to you.' : 'No conversations tagged to a job in the last 30 days. Open one and press "+ Tag to a job".'}</p>`;
          } else {
            body = threads.map(row).join('') || `<p class="subtitle" style="padding:8px 10px;">${q ? 'Nothing found.' : S.mineOnly ? 'Nothing here is assigned to you.' : S.view === 'priority' ? 'Nothing waiting on a reply.' : 'Nothing here.'}</p>`;
          }
        }
        listEl.innerHTML = `<div class="list-filters">${header}</div>` + body;

        const uo = document.getElementById('unread-only');
        if (uo) uo.addEventListener('change', () => { S.unreadOnly = uo.checked; loadList(); });
        const mo = document.getElementById('mine-only');
        if (mo) mo.addEventListener('change', () => { S.mineOnly = mo.checked; loadList(); });
        const el = document.getElementById('edit-label-btn');
        if (el) el.addEventListener('click', () => openLabelEditor(label));
        listEl.querySelectorAll('.ib-row').forEach(a => a.addEventListener('click', () => {
          if (!a.dataset.id.startsWith('draft:')) { openThread(a.dataset.id); return; }
          const d = S.drafts.find(x => x.id === a.dataset.id.slice(6));
          if (!d) return;
          if (d.thread_id) openThread(d.thread_id);
          else openEmailComposer({ title: 'Draft', to: d.to_addresses, cc: d.cc_addresses, subject: d.subject, body: d.body_text, mailbox: mb(), draftId: d.id, onDraftSaved: draftsChanged, onSent: async (tid) => { await loadDrafts(); await loadList(); openThread(tid); } });
        }));
        // right-click on a row: the menu (hold on the phone is bound once on the list, bindRowTouch)
        listEl.querySelectorAll('.ib-row').forEach(a => a.addEventListener('contextmenu', (e) => {
          const t = S.rowThreads[a.dataset.id];
          if (!t) return;
          e.preventDefault(); rowMenu(t, e.clientX, e.clientY, a);
        }));
        // Done and Read or Unread on hover (the row itself opens the conversation)
        listEl.querySelectorAll('.ib-row [data-act]').forEach(b => b.addEventListener('click', async (e) => {
          e.preventDefault(); e.stopPropagation();
          const id = b.closest('.ib-row').dataset.id;
          const t = threads.find(x => x.id === id);
          try {
            if (b.dataset.act === 'done') { await act('done', { thread_id: id, done: true }); if (S.activeThreadId === id) { closeReading(); setUrl(); } }
            else await setRead(id, !(t && t.is_read));
          } catch (err) { alert(err.message); }
          renderSide(); loadList();
        }));
        if (!S.activeThreadId && !partial) document.getElementById('thread-detail').innerHTML = '<p class="subtitle" style="padding:16px;">Select a conversation, or press Compose to start a new one.</p>';
      }
    }

    // ---------- one conversation ----------

    function messageHtml(m, staffName, folded) {
      const out = m.direction === 'outbound';
      const as = S.box === 'mine' ? '' : ' (as sales@)';
      const senderLabel = out
        ? (m.created_by ? (m.created_by === S.me.id ? 'You' : staffName(m.created_by)) + as : (S.box === 'mine' ? 'You (sent from Gmail)' : 'sales@ (sent from Gmail)'))
        : (addrName(m.from_address) || 'Client');
      const fromFull = out ? '' : addrFull(m.from_address);
      const toLine = (m.to_addresses || []).map(addrName).filter(Boolean).join(', ');
      const snippet = String(m.body_text || '').replace(/\s+/g, ' ').trim().slice(0, 160);
      return `
        <div class="inbox-message ${m.direction} ${folded ? 'folded' : ''}" data-email-id="${m.id}">
          <div class="msg-head" title="${folded ? 'Open this email' : 'Fold this email'}"><span class="dir-badge ${m.direction}">${out ? 'Sent' : 'Received'}</span><strong>${escapeHtml(senderLabel)}</strong>${fromFull && fromFull !== senderLabel ? ' <span class="to" title="Sent from this address">&lt;' + escapeHtml(addrOnlyOf(fromFull)) + '&gt;</span>' : ''}${toLine ? ' <span class="to">to ' + escapeHtml(toLine) + '</span>' : ''}<span class="snip">${escapeHtml(snippet)}</span><span class="when">${whenFull(m.sent_at)}</span></div>
          <div class="msg-body"><div class="email-body" data-email-id="${m.id}"></div></div>
        </div>`;
    }

    // The jobs this conversation is tagged to, as chips, plus "Tag to a job".
    async function loadThreadTags(threadId) {
      const el = document.getElementById('thread-tags');
      if (!el) return;
      const { data: links } = await supabaseClient.from('email_job_links')
        .select('id, kind, note, by_ai, projects(id, name, job_number, quote_number)').eq('thread_id', threadId);
      // the jobs feed Save to job on the attachments and Add from job in the reply box (item 53)
      if (S.activeThreadId !== threadId) return; // another conversation was opened meanwhile
      S.threadJobs = (links || []).filter(l => l.projects).map(l => ({ id: l.projects.id, label: projectRef(l.projects) }));
      if (typeof emailSaveJobRefresh === 'function') emailSaveJobRefresh(document.getElementById('thread-messages'), S.threadJobs);
      if (S.replyPicker) S.replyPicker.setJobs(S.threadJobs);
      el.innerHTML = (links || []).map(l => `<span style="font-size:12px; padding:3px 10px; border:1px ${l.by_ai ? 'dashed' : 'solid'} var(--accent); border-radius:20px; display:inline-flex; gap:6px; align-items:center;">
          <a href="/project.html?id=${l.projects.id}&tab=emails" class="link-quiet" title="${escapeHtml(l.note || '')}">${escapeHtml(projectRef(l.projects))} &middot; ${EMAIL_KINDS[l.kind] || 'Other'}${l.by_ai ? ' &middot; tagged by ' + escapeHtml(S.assistant) : ''}</a>
          <a href="#" data-untag="${l.id}" title="Remove this tag">&times;</a></span>`).join('')
        + '<button type="button" class="secondary" id="tag-email-btn" style="font-size:12px; padding:4px 10px;">+ Tag to a job</button>'
        // pricing roles only: other roles cannot create clients or open the quote page (F46)
        + (isPricingRole(S.role) ? '<button type="button" id="create-from-email-btn" style="font-size:12px; padding:4px 10px;">Create quote / job from this email</button>' : '');
      el.querySelectorAll('[data-untag]').forEach(a => a.addEventListener('click', async (e) => {
        e.preventDefault();
        if (!confirm('Remove this tag? The email itself is not deleted.')) return;
        await supabaseClient.from('email_job_links').delete().eq('id', a.dataset.untag);
        loadThreadTags(threadId);
      }));
      const createBtn = document.getElementById('create-from-email-btn');
      if (createBtn) createBtn.addEventListener('click', () => openCreateFromEmailModal(threadId));
      document.getElementById('tag-email-btn').addEventListener('click', () => openTagEmailModal({ threadId, onSaved: () => loadThreadTags(threadId) }));
    }

    async function loadThreadLabels(thread) {
      const el = document.getElementById('thread-labels');
      if (!el) return;
      const { data: tl } = await supabaseClient.from('email_thread_labels').select('label_id, by_ai').eq('thread_id', thread.id);
      const on = new Set((tl || []).map(x => x.label_id));
      el.innerHTML = (tl || []).map(x => { const l = S.labels.find(y => y.id === x.label_id); return l ? `<span class="chip ${x.by_ai ? 'ai' : ''}" style="font-size:12px; padding:3px 10px;" title="${x.by_ai ? 'Added by ' + escapeHtml(S.assistant) : ''}"><span class="label-dot"></span>${escapeHtml(l.name)} <a href="#" data-unlabel="${l.id}" title="Remove label">&times;</a></span>` : ''; }).join('')
        + '<span style="position:relative;"><button type="button" class="secondary" id="label-btn" style="font-size:12px; padding:4px 10px;">+ Label</button></span>';
      el.querySelectorAll('[data-unlabel]').forEach(a => a.addEventListener('click', async (e) => {
        e.preventDefault();
        await act('remove_label', { thread_id: thread.id, label_id: a.dataset.unlabel });
        await loadLabels(); loadThreadLabels(thread); renderSide();
      }));
      document.getElementById('label-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.menu').forEach(x => x.remove());
        const menu = document.createElement('div');
        menu.className = 'menu';
        menu.style.top = '30px'; menu.style.left = '0';
        menu.innerHTML = S.labels.filter(l => l.status === 'open' || on.has(l.id)).map(l => `<label><input type="checkbox" data-l="${l.id}" style="width:auto;" ${on.has(l.id) ? 'checked' : ''} /> ${escapeHtml(l.name)}</label>`).join('')
          + `<div style="border-top:1px solid var(--border); margin-top:6px; padding-top:6px;"><input id="menu-new-label" placeholder="New label, e.g. Supplier dispute: Middys" style="font-size:13px;" /><button type="button" id="menu-new-btn" style="font-size:12px; padding:4px 10px; margin-top:6px;">Create and add</button></div>`;
        e.target.parentElement.appendChild(menu);
        menu.addEventListener('click', ev => ev.stopPropagation());
        menu.querySelectorAll('[data-l]').forEach(c => c.addEventListener('change', async () => {
          await act(c.checked ? 'add_label' : 'remove_label', { thread_id: thread.id, label_id: c.dataset.l });
          await loadLabels(); loadThreadLabels(thread); renderSide();
        }));
        menu.querySelector('#menu-new-btn').addEventListener('click', async () => {
          const name = menu.querySelector('#menu-new-label').value.trim();
          if (!name) return;
          try { await act('create_label', { mailbox_id: mb().id, name, thread_id: thread.id }); } catch (err) { alert(err.message); return; }
          menu.remove(); await loadLabels(); loadThreadLabels(thread); renderSide();
        });
        setTimeout(() => document.addEventListener('click', () => menu.remove(), { once: true }), 0);
      });
    }

    async function openThread(threadId, opts = {}) {
      const fromList = !S.activeThreadId;
      S.activeThreadId = threadId;
      if (!opts.keepUrl) setUrl(fromList);
      document.getElementById('inbox-layout').classList.add('reading');
      onePane(false);
      document.querySelectorAll('.ib-row').forEach(el => el.classList.toggle('active', el.dataset.id === threadId));
      const detailEl = document.getElementById('thread-detail');
      detailEl.innerHTML = '<p class="subtitle" style="padding:16px;">Loading...</p>';
      detailEl.scrollTop = 0;

      const [{ data: thread }, { data: emails }, { data: drafts }] = await Promise.all([
        supabaseClient.from('email_threads').select('*, clients(name), projects:suggested_project_id(id, name, job_number, quote_number)').eq('id', threadId).single(),
        supabaseClient.from('emails').select('*').eq('thread_id', threadId).order('sent_at', { ascending: true }),
        supabaseClient.from('email_drafts').select('*').eq('thread_id', threadId).eq('status', 'draft').order('updated_at', { ascending: false }).limit(1),
        emailJobFilesReady().catch(() => null), // Save to job on the attachments (item 53)
      ]);
      if (S.activeThreadId !== threadId) return; // another conversation was opened meanwhile
      if (!thread) { detailEl.innerHTML = '<p class="subtitle" style="padding:16px;">That conversation is not available.</p>'; return; }
      let draft = (drafts || [])[0] || null; // let: a Draft reply that lands while the person types is adopted (item 55)
      const lastMsg = (emails || []).slice(-1)[0];
      const lastOut = lastMsg?.direction === 'outbound';
      const sec = thread.section || 'other';
      const waiting = sec === 'priority' && !lastOut && !thread.answered_at; // still waiting on us
      const gmailUrl = `https://mail.google.com/mail/u/?authuser=${encodeURIComponent(mb().address)}#all/${thread.gmail_thread_id}`;
      const others = S.staff.filter(s => s.active && s.id !== thread.assigned_to);
      const assignCtl = `<span style="display:inline-flex; gap:6px; align-items:center;">`
        + (!thread.assigned_to ? '<button type="button" id="claim-btn" title="Tell the team you are handling this">I\'ve got this</button>'
          : thread.assigned_to === S.me.id ? '<button type="button" class="secondary" id="unclaim-btn">Not mine any more</button>'
          : '<button type="button" class="secondary" id="claim-btn">Take over</button>')
        + `<select id="assign-select" title="Assign to someone"><option value="">Assign to...</option>${others.map(s => `<option value="${s.id}">${escapeHtml(s.full_name || '')}</option>`).join('')}</select></span>`;
      const someoneElse = thread.assigned_to && thread.assigned_to !== S.me.id && !thread.is_done;
      // Reply to whoever last wrote to us. If they haven't replied yet (we sent the last one), a
      // follow-up goes to the people we sent it to, not back to ourselves.
      const lastInbound = (emails || []).filter(m => m.direction === 'inbound').slice(-1)[0];
      const lastOutbound = (emails || []).filter(m => m.direction === 'outbound').slice(-1)[0];
      const replyTo = draft?.to_addresses || (lastInbound
        ? emailAddressOnly(lastInbound.from_address || '')
        : (lastOutbound ? (lastOutbound.to_addresses || []).map(a => emailAddressOnly(a)).filter(Boolean).join(', ') : ''));
      const replyName = lastInbound ? addrName(lastInbound.from_address) : (lastOutbound ? addrName((lastOutbound.to_addresses || [])[0]) : '');
      // newest first, open; every older email folded to one line (Outlook's reading pane)
      const ordered = [...(emails || [])].reverse();

      detailEl.innerHTML = `
        <div class="ib-read-head">
          <button type="button" class="secondary back-btn" id="back-btn" style="font-size:12px; padding:4px 10px; margin-bottom:6px;">&larr; Back</button>
          <h2>${escapeHtml(thread.subject || '(no subject)')}</h2>
          <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-size:12px;">
            ${thread.clients?.name ? `<span style="color:var(--muted);">${escapeHtml(thread.clients.name)}</span>` : ''}
            ${statusHtml(thread, lastMsg)}
            <span style="color:var(--muted);">${ordered.length} email${ordered.length === 1 ? '' : 's'}</span>
          </div>
          <div class="thread-bar">
            ${assignCtl}
            <span class="section-pill ${waiting ? 'priority' : ''}">${sec === 'priority' && !waiting ? 'Replied, waiting on them' : SECTION_NAMES[sec]}${thread.section_reason && waiting ? ': ' + escapeHtml(thread.section_reason) : ''}</span>
            <select id="move-section" title="Move to">
              <option value="">Move to...</option>
              ${Object.entries(SECTION_NAMES).filter(([k]) => k !== sec).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}
            </select>
            <label style="margin:0; font-size:12px; font-weight:400; display:flex; align-items:center; gap:4px;"><input type="checkbox" id="move-always" style="width:auto;" /> always for this sender</label>
            <button type="button" class="secondary" id="done-btn">${thread.is_done ? 'Move back to inbox' : 'Done'}</button>
            <a href="${gmailUrl}" target="_blank" rel="noopener" style="font-size:12px; margin-left:auto;">Open in Gmail</a>
          </div>
        </div>
        <div class="ib-read-body">
          ${someoneElse && waiting ? `<div class="claim-banner"><strong>${escapeHtml(staffName(thread.assigned_to))} is on this</strong>${thread.assigned_at ? ', claimed ' + timeAgo(thread.assigned_at) : ''}. Check with them before you reply, so the client is not chased twice.</div>` : ''}
          ${thread.suggested_label ? `<div class="suggest">${escapeHtml(S.assistant)} suggests a label: <strong>${escapeHtml(thread.suggested_label)}</strong><button type="button" id="accept-label">Add</button><button type="button" class="secondary" id="dismiss-label">No</button></div>` : ''}
          ${thread.projects ? `<div class="suggest">${escapeHtml(S.assistant)} thinks this is about <strong>${escapeHtml(projectRef(thread.projects))} ${escapeHtml(thread.projects.name || '')}</strong><button type="button" id="accept-job">Tag it</button><button type="button" class="secondary" id="dismiss-job">No</button></div>` : ''}
          <div class="thread-chips" id="thread-labels"></div>
          <div class="thread-chips" id="thread-tags"></div>
          <div class="reply-card ${draft ? 'open' : ''}" id="reply-card">
            <label class="reply-more">${draft ? (draft.by_ai ? `Reply drafted by ${escapeHtml(S.assistant)}: check it, fill any [gaps], then send` : 'Your draft reply') : 'Reply'}</label>
            <div class="reply-top">
              <textarea id="reply-body" placeholder="Reply${replyName ? ' to ' + escapeHtml(replyName) : ''}...">${escapeHtml(draft ? draft.body_text : '')}</textarea>
              ${!draft && S.draftingThread !== threadId && (emails || []).some(e => e.direction === 'inbound') ? `<button type="button" class="secondary" id="reply-ai-btn" style="white-space:nowrap; font-size:12px; padding:6px 10px;" title="${escapeHtml(S.assistant)} writes a draft for you to check">Draft reply</button>` : ''}
            </div>
            <div class="reply-more">
              <div id="reply-attach" style="margin-top:8px;"></div>
              <div class="reply-row">
                <button type="button" id="reply-send-btn">Send reply</button>
                <button type="button" class="secondary" id="reply-save-btn">Save draft</button>
                ${draft ? '<button type="button" class="secondary" id="reply-discard-btn">Discard draft</button>' : ''}
              </div>
            </div>
            <div id="reply-msg"></div>
          </div>
          <div id="thread-messages">${ordered.map((m, i) => messageHtml(m, staffName, i > 0)).join('')}</div>
        </div>`;

      // the reply box is one line until it is used
      const replyCard = document.getElementById('reply-card');
      document.getElementById('reply-body').addEventListener('focus', () => replyCard.classList.add('open'));
      // an older email opens on a tap (its body is fetched then, not before) and folds again on another
      const mountOne = (box) => {
        if (box.dataset.mounted) return;
        box.dataset.mounted = '1';
        const m = (emails || []).find(e => e.id === box.dataset.emailId);
        if (m) mountEmailBody(box.querySelector('.email-body'), m, { fetchAttachment: fetchEmailAttachment, fetchStored: fetchStoredAttachment, jobs: () => S.threadJobs });
      };
      detailEl.querySelectorAll('.msg-head').forEach(h => h.addEventListener('click', () => {
        const box = h.parentElement;
        box.classList.toggle('folded');
        h.title = box.classList.contains('folded') ? 'Open this email' : 'Fold this email';
        if (!box.classList.contains('folded')) mountOne(box);
      }));
      S.threadJobs = [];
      const replyPicker = S.replyPicker = emailLocalFilePicker(document.getElementById('reply-attach'));
      loadThreadTags(threadId);
      loadThreadLabels(thread);
      detailEl.querySelectorAll('.inbox-message:not(.folded)').forEach(mountOne);

      // the Messages icon rows for this thread are read now (bell is never involved)
      supabaseClient.from('notifications').update({ read_at: new Date().toISOString() })
        .eq('user_id', S.me.id).is('read_at', null).eq('link', '/inbox.html?thread=' + threadId)
        .then(() => { if (window.refreshChatBadge) refreshChatBadge(); }, () => {});
      if (!thread.is_read) { setRead(threadId, true).catch(() => {}).then(renderSide); }

      const reload = async (keepOpen) => { await Promise.all([loadLabels(), loadDrafts()]); await renderSide(); await loadList(); if (keepOpen) openThread(threadId); };
      document.getElementById('back-btn').addEventListener('click', leaveThread);
      document.getElementById('move-section').addEventListener('change', async (e) => {
        if (!e.target.value) return;
        try { await act('set_section', { thread_id: threadId, section: e.target.value, always: document.getElementById('move-always').checked }); } catch (err) { alert(err.message); }
        reload(true);
      });
      document.getElementById('done-btn').addEventListener('click', async () => {
        try { await act('done', { thread_id: threadId, done: !thread.is_done }); } catch (err) { alert(err.message); return; }
        leaveThread(); reload(false);
      });
      const bind = (id, action) => { const b = document.getElementById(id); if (b) b.addEventListener('click', async () => { try { await act(action, { thread_id: threadId }); } catch (err) { alert(err.message); } reload(true); }); };
      bind('accept-label', 'accept_label'); bind('dismiss-label', 'dismiss_label'); bind('accept-job', 'accept_job'); bind('dismiss-job', 'dismiss_job');
      const assign = async (userId) => { try { await act('assign', { thread_id: threadId, user_id: userId }); } catch (err) { alert(err.message); } reload(true); };
      const claimBtn = document.getElementById('claim-btn');
      if (claimBtn) claimBtn.addEventListener('click', () => assign(S.me.id));
      const unclaimBtn = document.getElementById('unclaim-btn');
      if (unclaimBtn) unclaimBtn.addEventListener('click', () => assign(null));
      document.getElementById('assign-select').addEventListener('change', (e) => { if (e.target.value) assign(e.target.value); });

      const subject = thread.subject || '';
      document.getElementById('reply-save-btn').addEventListener('click', async () => {
        const msg = document.getElementById('reply-msg');
        try {
          await act('save_draft', { draft_id: draft ? draft.id : undefined, mailbox_id: mb().id, thread_id: threadId, to: replyTo, subject: /^re:/i.test(subject) ? subject : 'Re: ' + subject, body: document.getElementById('reply-body').value });
          msg.innerHTML = '<p class="subtitle" style="font-size:12px;">Draft saved' + (canMirror(mb()) ? ', also in Gmail.' : '.') + '</p>';
          await draftsChanged();
        } catch (err) { msg.innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`; }
      });
      // Draft reply (item 55): Postie only drafts by itself when an email asks for an answer;
      // for anything else it drafts on request, in the background, and the box fills when ready
      const aiBtn = document.getElementById('reply-ai-btn');
      if (aiBtn) aiBtn.addEventListener('click', async () => {
        const msg = () => document.getElementById('reply-msg');
        // what is in the reply box now (looked up each time: the card may be drawn again meanwhile)
        const typed = () => {
          const box = document.getElementById('reply-body'), p = S.replyPicker;
          return (box ? box.value : '') + '|' + (p ? p.files().length + (p.refs ? p.refs().length : 0) : 0);
        };
        const atClick = typed();
        if (atClick !== '|0' && !confirm('Replace what you have typed or attached with a draft from ' + S.assistant + '?')) return;
        S.draftingThread = threadId;
        aiBtn.disabled = true;
        aiBtn.textContent = 'Drafting...';
        msg().innerHTML = `<p class="subtitle" style="font-size:12px;">${escapeHtml(S.assistant)} is writing a draft. It takes about a minute and fills in here.</p>`;
        try {
          await act('draft_reply', { thread_id: threadId });
          for (let i = 0; i < 30; i++) {
            await new Promise(r => setTimeout(r, 3000));
            if (S.activeThreadId !== threadId) return; // moved on: the draft waits in Drafts
            const { data } = await supabaseClient.from('email_drafts').select('*').eq('thread_id', threadId).eq('status', 'draft').order('updated_at', { ascending: false }).limit(1);
            if (!data || !data.length) continue;
            S.draftingThread = null;
            if (typed() === atClick) { reload(true); return; }
            // typed or attached something meanwhile: never wipe it. Save and Send now update and
            // close this draft, so it is never left open beside the reply.
            draft = data[0];
            msg().innerHTML = `<p class="subtitle" style="font-size:12px;">The draft is ready. <a href="#" id="reply-ai-use">Use it</a> (replaces what you have typed), or Save draft to keep yours in its place.</p>`;
            document.getElementById('reply-ai-use').addEventListener('click', (e) => { e.preventDefault(); reload(true); });
            document.getElementById('reply-ai-btn')?.remove();
            return;
          }
          throw new Error(`${S.assistant} did not finish a draft. Try again, or write it yourself.`);
        } catch (err) {
          S.draftingThread = null;
          if (S.activeThreadId !== threadId || !msg()) return;
          msg().innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`;
          const b = document.getElementById('reply-ai-btn');
          if (b) { b.disabled = false; b.textContent = 'Draft reply'; }
        }
      });
      const discard = document.getElementById('reply-discard-btn');
      if (discard) discard.addEventListener('click', async () => {
        if (!confirm('Discard this draft?')) return;
        await act('discard_draft', { draft_id: draft.id });
        reload(true);
      });
      document.getElementById('reply-send-btn').addEventListener('click', async () => {
        const btn = document.getElementById('reply-send-btn');
        const msg = document.getElementById('reply-msg');
        const bodyText = document.getElementById('reply-body').value.trim();
        if (!bodyText) { msg.innerHTML = '<div class="error-box">Enter a reply first.</div>'; return; }
        if (/\[[^\]]{1,40}\]/.test(bodyText) && !confirm('The reply still has a [gap] in square brackets. Send anyway?')) return;
        if (!replyTo) { msg.innerHTML = '<div class="error-box">Couldn\'t work out who to reply to.</div>'; return; }
        const refs = replyPicker.refs();
        const limit = replyPicker.limitError();
        if (limit) { msg.innerHTML = `<div class="error-box">${escapeHtml(limit)}</div>`; return; }
        btn.disabled = true;
        btn.textContent = replyPicker.files().length ? 'Uploading...' : 'Sending...';
        try {
          const uploaded = await emailUploadFiles(replyPicker.files());
          btn.textContent = 'Sending...';
          await emailSendNow({ to: replyTo, subject, bodyText, replyToThreadId: threadId, draftId: draft ? draft.id : undefined, attachments: [...uploaded, ...refs].map(u => ({ bucket: u.bucket, path: u.path, name: u.name })) });
          reload(true);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`;
          btn.disabled = false;
          btn.textContent = 'Send reply';
        }
      });
    }

    // ---------- labels ----------

    function openLabelEditor(label) {
      const overlay = openModal(`
          <h2 style="margin-top:0;">${label ? 'Edit label' : 'New label'}</h2>
          <p class="subtitle" style="font-size:12px; margin:0 0 8px;">For a matter that is not a job, so its emails stay together and nothing gets missed. ${S.box === 'mine' ? 'Only you see labels in My inbox.' : 'Labels in the Sales inbox are shared with the team.'} ${label ? 'Changing what belongs here makes' : 'Saving makes'} ${escapeHtml(S.assistant)} check the last 60 days of mail and file what fits (you get a notification when it is done).</p>
          <label style="margin-top:0">Name</label>
          <input id="lb-name" value="${escapeHtml(label ? label.name : '')}" placeholder="Supplier dispute: Middys" />
          <label>What belongs here (helps ${escapeHtml(S.assistant)} file new emails)</label>
          <textarea id="lb-desc" style="min-height:70px;" placeholder="Emails with Middys about the overcharged switchboard order in September">${escapeHtml(label?.description || '')}</textarea>
          <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;">
            <button type="button" id="lb-save">Save</button>
            ${label ? `<button type="button" class="secondary" id="lb-status">${label.status === 'done' ? 'Reopen' : 'Matter finished'}</button><button type="button" class="secondary" id="lb-delete">Delete label</button>` : ''}
            <button type="button" class="secondary" id="lb-cancel">Cancel</button>
          </div>
          <div id="lb-msg" style="margin-top:8px;"></div>`, { maxWidth: 480, zIndex: 120 });
      const close = async (refresh) => { overlay.remove(); if (refresh) { await loadLabels(); await renderSide(); await loadList(); } };
      const run = async (fn) => { try { await fn(); close(true); } catch (err) { overlay.querySelector('#lb-msg').innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`; } };
      overlay.querySelector('#lb-cancel').addEventListener('click', () => close(false));
      overlay.querySelector('#lb-save').addEventListener('click', () => run(async () => {
        const name = overlay.querySelector('#lb-name').value.trim(), description = overlay.querySelector('#lb-desc').value.trim();
        if (label) await act('update_label', { label_id: label.id, name, description });
        else { const r = await act('create_label', { mailbox_id: mb().id, name, description }); S.view = 'label:' + r.label.id; }
      }));
      if (label) {
        overlay.querySelector('#lb-status').addEventListener('click', () => run(() => act('update_label', { label_id: label.id, status: label.status === 'done' ? 'open' : 'done' })));
        overlay.querySelector('#lb-delete').addEventListener('click', () => {
          if (!confirm('Delete this label? The emails stay, only the label goes.')) return;
          run(async () => { await act('delete_label', { label_id: label.id }); S.view = 'priority'; });
        });
      }
    }

    // ---------- My inbox: connect and disconnect (js/inbox-connect.js, loaded when needed) ----------

    async function withConnectScript() {
      if (!window.renderInboxConnect) {
        S.connectLoad = S.connectLoad || new Promise((ok, fail) => { const sc = document.createElement('script'); sc.src = '/js/inbox-connect.js?v=1'; sc.onload = ok; sc.onerror = () => { S.connectLoad = null; fail(new Error('That part did not load. Refresh and try again.')); }; document.head.appendChild(sc); });
        await S.connectLoad;
      }
    }
    async function renderConnect() {
      try { await withConnectScript(); await renderInboxConnect({ S, onePane, act, loadMailboxes, showBox }); }
      catch (err) { document.getElementById('thread-list').innerHTML = `<div class="error-box" style="margin:10px;">${escapeHtml(err.message)}</div>`; }
    }
    async function disconnectMine() {
      try { await withConnectScript(); await disconnectMyInbox({ S, act, loadMailboxes, showBox }); } catch (err) { alert(err.message); }
    }

    // ---------- clean up (js/inbox-cleanup.js, loaded when it is opened) ----------

    async function renderCleanup() {
      try {
        if (!window.renderInboxCleanup) {
          S.cleanupLoad = S.cleanupLoad || new Promise((ok, fail) => { const sc = document.createElement('script'); sc.src = '/js/inbox-cleanup.js?v=1'; sc.onload = ok; sc.onerror = () => { S.cleanupLoad = null; fail(new Error('Clean up did not load. Refresh and try again.')); }; document.head.appendChild(sc); });
          await S.cleanupLoad;
        }
        await renderInboxCleanup({ S, mb, act, onePane, canMirror });
      } catch (err) {
        document.getElementById('thread-list').innerHTML = `<div class="error-box" style="margin:10px;">${escapeHtml(err.message)}</div>`;
      }
    }

    // ---------- buttons ----------

    document.querySelectorAll('#box-toggle button').forEach(b => b.addEventListener('click', () => { S.view = 'priority'; showBox(b.dataset.box); }));
    document.getElementById('compose-btn').addEventListener('click', () => {
      if (S.box === 'mine' && !mineConnected()) { alert('Connect your Gmail first.'); return; }
      openEmailComposer({
        title: S.box === 'mine' ? 'New email from ' + S.mine.address : 'New email',
        mailbox: mb(),
        onDraftSaved: draftsChanged,
        onSent: async (threadId) => { await loadList(); await openThread(threadId); },
      });
    });

    let searchTimer = null;
    document.getElementById('inbox-search').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        const q = e.target.value.trim();
        if (q === S.search || !mb()) return;
        S.search = q; S.activeThreadId = null; clearInterval(S.cleanupTimer);
        if (S.view === 'cleanup') { S.view = 'all'; renderSide(); }
        loadList();
      }, 300);
    });

    document.getElementById('sync-now-btn').addEventListener('click', async () => {
      const btn = document.getElementById('sync-now-btn');
      btn.disabled = true;
      btn.textContent = 'Syncing...';
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        const res = await fetch('/.netlify/functions/sync-gmail-now', { method: 'POST', headers: { Authorization: `Bearer ${session.access_token}` } });
        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch (e) { throw new Error(`The sync did not answer properly (status ${res.status}). Try again in a minute.`); }
        if (!data.ok) throw new Error(data.error || 'The sync failed.');
        await loadMailboxes();
        await showBox(S.box);
        if (data.done === false) alert('Pulled in some of the mail so far. Press Sync now again to bring in the rest.');
      } catch (err) {
        alert(err.message);
      }
      btn.disabled = false;
      btn.textContent = 'Sync now';
    });

    (async function () {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();
      renderMainNav('inbox');
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });
      S.me = session.user;
      bindRowTouch(document.getElementById('thread-list'));
      fitHeight();
      if (window.visualViewport) window.visualViewport.addEventListener('resize', fitHeight);
      window.addEventListener('resize', fitHeight);
      const params = new URLSearchParams(window.location.search);
      const deepThread = params.get('thread');
      const deepLabel = params.get('label');
      // Settings, staff, mailboxes and (for a link to a conversation) which inbox it is in, all at once.
      const [{ data: cs }, { data: staff }, , deep, role] = await Promise.all([
        supabaseClient.from('company_settings').select('ai_assistant_name').eq('id', 1).maybeSingle(),
        supabaseClient.from('profiles').select('id, full_name, active').order('full_name'),
        loadMailboxes(),
        deepThread && !params.get('box') ? supabaseClient.from('email_threads').select('mailbox_id').eq('id', deepThread).maybeSingle() : null,
        getMyRole(),
      ]);
      S.role = role || 'staff';
      S.assistant = (cs && cs.ai_assistant_name && cs.ai_assistant_name.trim()) || 'Sparky';
      S.staff = staff || [];
      // a link to a conversation: open it in whichever inbox it is in
      const t = deep && deep.data;
      if (t && S.mine && t.mailbox_id === S.mine.id) params.set('box', 'mine');
      if (deepThread) S.view = 'all';
      if (deepLabel) S.view = 'label:' + deepLabel;
      if (params.get('view') === 'jobs') S.view = 'jobs';
      await showBox(params.get('box') === 'mine' ? 'mine' : 'sales');
      if (deepLabel && !S.labels.some(l => l.id === deepLabel)) { S.view = 'priority'; await renderSide(); await loadList(); }
      if (deepThread) openThread(deepThread);
    })();
  </script>
</body>
</html>
