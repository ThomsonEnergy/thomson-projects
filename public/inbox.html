<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('te-theme') || (matchMedia('(pointer: coarse)').matches ? 'dark' : 'navy'));</script>
<title>Inbox - TEops</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=24" />
<script src="/js/vendor/supabase-2.js?v=1"></script>
<style>
  /* Whole screen (owner's rule, 12 Nov 2026): three columns under the top bar, like Team chat.
     Left: Compose, the inbox switch and the folders (Gmail). Middle: search and one line per
     conversation. Right: the conversation, Outlook style (subject and actions stuck at the top,
     the reply box, the newest email open, older ones folded). Each column scrolls on its own.
     Phone: the folders as a strip above the list, then the conversation on its own screen.
     --ib-vh follows the visible screen (iPhone keyboard), set by fitHeight(). */
  body.inbox-page { overflow:hidden; height:100%; }
  .inbox-app { --ib-top:76px; display:grid; grid-template-columns:212px minmax(380px, 30%) minmax(0,1fr); height:calc(var(--ib-vh, 100dvh) - var(--ib-top)); background:var(--bg); }
  .inbox-app.one-pane { grid-template-columns:212px minmax(0,1fr); }
  .inbox-app.one-pane .ib-read { display:none; }
  .ib-side, .ib-list, .ib-read { min-height:0; min-width:0; display:flex; flex-direction:column; }
  .ib-side { border-right:1px solid var(--border); background:var(--surface); overflow-y:auto; padding:10px 8px; }
  .ib-side > div { display:flex; flex-direction:column; }
  .ib-nav { flex:1; }
  .ib-compose { width:100%; margin:0 0 8px; padding:9px 12px; font-size:14px; font-weight:700; }
  .box-toggle { display:flex; border:1px solid var(--border); border-radius:20px; overflow:hidden; }
  .box-toggle button { flex:1; border:0; border-radius:0; font-size:12px; padding:5px 8px; background:transparent; color:var(--text); white-space:nowrap; }
  .box-toggle button.on { background:var(--accent); color:var(--accent-contrast, #fff); }
  .ib-addr { font-size:11px; color:var(--muted); margin:4px 6px 6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .side-item { display:flex; justify-content:space-between; align-items:center; gap:6px; padding:5px 10px; border-radius:8px; cursor:pointer; font-size:13px; color:var(--text); text-decoration:none; }
  .side-item:hover { background:var(--surface-2); }
  .side-item.on { background:var(--surface-2); font-weight:700; border-left:3px solid var(--accent); }
  .side-item .n { font-size:12px; color:var(--muted); }
  .side-item.on .n, .side-item .n.hot { color:var(--accent); font-weight:700; }
  .side-head { display:flex; justify-content:space-between; align-items:center; margin:10px 10px 2px; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); }
  .side-head a { font-size:12px; text-transform:none; letter-spacing:0; font-weight:400; }
  .label-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--accent); margin-right:6px; vertical-align:1px; }
  .ib-foot { margin-top:8px; }
  .ib-foot button { width:100%; font-size:12px; padding:6px 10px; }
  .ib-list { border-right:1px solid var(--border); background:var(--surface); }
  .ib-list-top { padding:8px 10px; border-bottom:1px solid var(--border); }
  .ib-list-top input[type=search] { margin:0; padding:7px 12px; border-radius:999px; font-size:13px; width:100%; }
  .ib-list-body { overflow-y:auto; flex:1; min-height:0; }
  .list-filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:6px 10px; border-bottom:1px solid var(--border); font-size:12px; position:sticky; top:0; background:var(--surface); z-index:1; }
  .list-filters h3 { margin:0; font-size:14px; }
  .list-filters label { margin:0; font-size:12px; font-weight:400; display:flex; align-items:center; gap:4px; }
  .list-filters .note { width:100%; margin:0; font-size:12px; }
  /* two short lines per conversation: who and the time, then subject, chips and status; Done and Read on hover */
  .ib-row { display:grid; grid-template-columns:minmax(0,1fr) 58px; align-items:center; column-gap:8px; row-gap:1px; padding:5px 10px; border-bottom:1px solid var(--border); cursor:pointer; font-size:13px; color:var(--text); text-decoration:none; position:relative; }
  .ib-row .who { grid-column:1; grid-row:1; }
  .ib-row .when { grid-column:2; grid-row:1; }
  .ib-row .mid { grid-column:1 / -1; grid-row:2; }
  .ib-row:hover { background:var(--surface-2); }
  .ib-row.active { background:var(--accent-dim); box-shadow:inset 3px 0 0 var(--accent); }
  .ib-row .who, .ib-row .subj { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ib-row.unread .who, .ib-row.unread .subj { font-weight:700; }
  .ib-row .mid { display:flex; align-items:center; gap:6px; min-width:0; white-space:nowrap; overflow:hidden; }
  .ib-row .subj { flex:1 1 auto; min-width:45%; }
  .ib-row .st { flex:0 1 auto; min-width:0; max-width:50%; overflow:hidden; text-overflow:ellipsis; color:var(--muted); font-size:12px; }
  .ib-row .st.waiting { color:var(--red); font-weight:700; }
  .ib-row .st.onit { color:#e0a526; font-weight:700; }
  .ib-row .st.replied { color:var(--green); }
  .ib-row .st.reason { font-style:italic; color:var(--accent); }
  .ib-row .when { font-size:12px; color:var(--muted); text-align:right; white-space:nowrap; }
  .ib-row .chip { margin:0; flex:none; display:inline-block; max-width:120px; overflow:hidden; text-overflow:ellipsis; vertical-align:middle; }
  .ib-row .acts { display:none; position:absolute; right:6px; top:0; bottom:0; align-items:center; gap:4px; padding-left:14px; background:linear-gradient(90deg, transparent, var(--surface-2) 30%); }
  .ib-row .acts button { font-size:11px; padding:3px 8px; }
  @media (hover:hover) { .ib-row:hover .acts { display:flex; } }
  .job-group { display:flex; justify-content:space-between; gap:8px; align-items:baseline; padding:8px 10px 3px; border-bottom:1px solid var(--border); }
  .job-group a { font-weight:700; font-size:13px; }
  .job-group .n { font-size:12px; color:var(--muted); white-space:nowrap; }
  .chip { display:inline-flex; align-items:center; gap:4px; font-size:10px; padding:0 7px; border:1px solid var(--border); border-radius:20px; white-space:nowrap; line-height:16px; }
  .chip.draft { border-color:var(--accent); color:var(--accent); font-weight:700; }
  .chip.ai { border-style:dashed; }
  /* the conversation, Outlook style */
  .ib-read { overflow-y:auto; background:var(--bg); }
  .ib-read-head { position:sticky; top:0; z-index:2; background:var(--bg); padding:10px 16px 8px; border-bottom:1px solid var(--border); }
  .ib-read-head h2 { margin:0 0 4px; font-size:17px; line-height:1.3; }
  .ib-read-body { padding:10px 16px 24px; }
  .inbox-status { font-size:12px; color:var(--muted); }
  .inbox-status.waiting { color:var(--red); font-weight:700; }
  .inbox-status.onit { color:#e0a526; font-weight:700; }
  .inbox-status.replied { color:var(--green); }
  .thread-bar { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:6px 0 0; }
  .thread-bar button, .thread-bar select { font-size:12px; padding:4px 10px; width:auto; }
  .claim-banner { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:8px 12px; border-radius:8px; margin:0 0 10px; font-size:13px; border:1px solid #e0a526; background:rgba(224,165,38,.12); }
  .claim-banner button { font-size:12px; padding:3px 10px; }
  .suggest { display:flex; flex-wrap:wrap; gap:8px; align-items:center; font-size:13px; padding:6px 10px; border:1px dashed var(--accent); border-radius:8px; margin:0 0 8px; }
  .suggest button { font-size:12px; padding:3px 10px; }
  .section-pill { display:inline-block; font-size:12px; padding:2px 10px; border-radius:20px; background:var(--surface-2); }
  .section-pill.priority { background:var(--accent); color:var(--accent-contrast, #fff); }
  .thread-chips { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:0 0 8px; }
  .thread-chips .chip { font-size:12px; padding:3px 10px; line-height:1.4; }
  .reply-card { border:1px solid var(--border); border-radius:8px; padding:8px 10px; margin:0 0 12px; background:var(--surface); }
  .reply-card .reply-top { display:flex; gap:8px; align-items:flex-start; }
  .reply-card textarea { min-height:38px; margin:0; resize:vertical; flex:1; }
  .reply-card.open textarea { min-height:160px; }
  .reply-card .reply-more { display:none; }
  .reply-card.open .reply-more { display:block; }
  .reply-card .reply-row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .reply-card label { font-size:12px; margin:0 0 6px; }
  .inbox-message { border:1px solid var(--border); border-radius:8px; margin-bottom:8px; background:var(--surface); }
  .inbox-message.inbound { border-left:4px solid #3fb97a; }
  .inbox-message.outbound { border-left:4px solid var(--accent); }
  .msg-head { display:flex; gap:8px; align-items:center; padding:8px 12px; cursor:pointer; font-size:12px; color:var(--muted); min-width:0; }
  .msg-head strong { color:var(--text); font-size:13px; white-space:nowrap; }
  .msg-head .to { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:40%; }
  .msg-head .snip { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .msg-head .when { margin-left:auto; white-space:nowrap; }
  .msg-body { padding:0 12px 12px; }
  .inbox-message.folded .msg-body { display:none; }
  .inbox-message:not(.folded) .snip { display:none; }
  .dir-badge { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:1px 7px; border-radius:20px; vertical-align:1px; }
  .dir-badge.inbound { color:#3fb97a; border:1px solid #3fb97a; }
  .dir-badge.outbound { color:var(--accent); border:1px solid var(--accent); }
  .email-body { white-space:normal; }
  @media (pointer: coarse) { .thread-bar select { min-height: 40px; } .thread-bar button, .claim-banner button, .suggest button { padding: 6px 12px; } }
  .menu { position:absolute; z-index:50; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px; min-width:240px; max-height:320px; overflow-y:auto; box-shadow:0 6px 24px rgba(0,0,0,.35); }
  .menu label { display:flex; align-items:center; gap:8px; margin:0 0 4px; font-weight:400; font-size:13px; }
  .notice { white-space:pre-line; font-size:14px; line-height:1.5; max-height:55vh; overflow-y:auto; border:1px solid var(--border); border-radius:8px; padding:12px; }
  .cleanup-table { width:100%; border-collapse:collapse; font-size:13px; }
  .cleanup-table td, .cleanup-table th { padding:8px 6px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; }
  .cleanup-table button { font-size:12px; padding:3px 8px; margin:0 4px 4px 0; }
  .progress { height:8px; border-radius:4px; background:var(--surface-2); overflow:hidden; }
  .progress > div { height:100%; background:var(--accent); }
  /* right-click or hold menus, and the phone swipe on a row (item 81) */
  .ctx-menu { position:fixed; z-index:200; background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:4px; min-width:210px; max-width:320px; max-height:70vh; overflow-y:auto; box-shadow:0 6px 24px rgba(0,0,0,.35); }
  .ctx-menu button { display:block; width:100%; text-align:left; border:0; background:transparent; color:var(--text); font-size:13px; padding:8px 10px; border-radius:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ctx-menu button:hover { background:var(--surface-2); }
  .ctx-menu button.danger { color:var(--red); }
  .ctx-menu .sep { border-top:1px solid var(--border); margin:4px 0; }
  .ctx-menu .head { font-size:11px; color:var(--muted); padding:6px 10px 2px; text-transform:uppercase; letter-spacing:.05em; }
  .ib-row, .side-item { -webkit-touch-callout:none; user-select:none; -webkit-user-select:none; }
  .ib-row { touch-action:pan-y; }
  .ib-row.swiping { transition:none; }
  .ib-row.swipe-done { background:var(--green-dim); }
  .ib-row.swipe-read { background:var(--accent-dim); }
  .ib-row[data-swipe]:not([data-swipe=""])::after { content:attr(data-swipe); position:absolute; top:0; bottom:0; display:flex; align-items:center; font-weight:700; font-size:13px; padding:0 12px; }
  .ib-row.swipe-done::after { left:100%; color:var(--green); }
  .ib-row.swipe-read::after { right:100%; color:var(--accent); }
  .ib-row.gone { transition:transform .2s, opacity .2s; opacity:0; }
  .back-btn { display:none; }
  @media (max-width: 1000px) {
    .inbox-app, .inbox-app.one-pane { grid-template-columns:minmax(0,1fr); grid-template-rows:auto minmax(0,1fr); }
    .ib-side { flex-direction:row; align-items:center; overflow-x:auto; overflow-y:hidden; border-right:0; border-bottom:1px solid var(--border); padding:6px 8px; gap:6px; }
    .ib-side > div { display:contents; }
    .ib-side .side-head, .ib-side p, .ib-addr { display:none; }
    .ib-read-head { position:static; }
    .ib-compose { width:auto; margin:0; padding:5px 12px; font-size:13px; white-space:nowrap; }
    .box-toggle { flex:none; }
    .side-item { white-space:nowrap; border:1px solid var(--border); border-radius:20px; padding:4px 10px; }
    .side-item.on { border-left:1px solid var(--accent); }
    .ib-foot button { width:auto; white-space:nowrap; }
    .ib-list { border-right:0; }
    .inbox-app.reading { grid-template-rows:minmax(0,1fr); }
    .inbox-app.reading .ib-side, .inbox-app.reading .ib-list { display:none; }
    .inbox-app:not(.reading) .ib-read { display:none; }
    .back-btn { display:inline-block; }
    .ib-row { padding:7px 12px; row-gap:2px; }
    .ib-row .chip { max-width:110px; }
    .ib-row .acts { display:none !important; }
    .ib-list-body { overflow-x:hidden; }
    .msg-head .to { display:none; }
  }
  @media (max-width: 700px) { .inbox-app { --ib-top:64px; } }
</style>
</head>
<body class="inbox-page">
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('mobile-menu-dropdown').classList.toggle('open')">&#9776;</button>
    <div class="mobile-menu-dropdown" id="mobile-menu-dropdown"></div>
    <nav class="topbar-tabs" id="topbar-tabs"></nav>
    <div class="topbar-right">
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/home.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="inbox-app" id="inbox-layout">
    <div class="ib-side">
      <div>
        <button type="button" class="ib-compose" id="compose-btn">+ Compose</button>
        <div class="box-toggle" id="box-toggle">
          <button type="button" data-box="sales" class="on">Sales inbox</button>
          <button type="button" data-box="mine">My inbox</button>
        </div>
        <p class="ib-addr" id="inbox-subtitle">sales@thomsonenergy.com.au</p>
      </div>
      <div class="ib-nav" id="inbox-side"></div>
      <div class="ib-foot"><button type="button" class="secondary" id="sync-now-btn">Sync now</button></div>
    </div>
    <div class="ib-list">
      <div class="ib-list-top">
        <input type="search" id="inbox-search" placeholder="Search this inbox: subject, sender, client, words" autocomplete="off" />
        <div id="inbox-banner"></div>
      </div>
      <div class="ib-list-body" id="thread-list"><p class="subtitle" style="padding:8px 10px;">Loading...</p></div>
    </div>
    <div class="ib-read" id="thread-detail">
      <p class="subtitle" style="padding:16px;">Select a conversation, or press Compose to start a new one.</p>
    </div>
  </div>

  <script src="/js/supabase-client.js?v=134"></script>
  <script src="/js/theme.js?v=2"></script>
  <script src="/js/email-view.js?v=4"></script>
  <script src="/js/email-compose.js?v=11"></script>
  <script>
    // Sales inbox (sales@, shared) and My inbox (the logged-in person's own Gmail, private).
    // The email agent sorts conversations into Priority (needs a reply), Other and
    // Subscriptions and updates; labels hold non-job matters; drafts wait in the Drafts
    // list and at the bottom of their conversation. Every row says who replied or who is
    // handling it (assigned_to, "I've got this"), and "Tagged to jobs" groups the last 30
    // days by job. See docs/PROJECT_SPEC.md A18.

    const SECTION_NAMES = { priority: 'Priority', other: 'Other', updates: 'Subscriptions and updates' };
    const S = {
      me: null, role: 'staff', assistant: 'Sparky', box: 'sales', view: 'priority', unreadOnly: false, mineOnly: false, search: '', staff: [],
      shared: null, mine: null, labels: [], drafts: [], activeThreadId: null, cleanupFilter: 'archive', cleanupTimer: null,
      rowThreads: {}, rowLabels: {}, showFinished: false,
      listSeq: 0, listKey: '',
    };
    const staffName = (id) => (S.staff.find(s => s.id === id) || {}).full_name || 'A team member';
    const who = (id) => (id === S.me.id ? 'You' : staffName(id));
    // How a conversation stands, from its newest message `l`: who replied, who is on it, or
    // nobody yet. Null when there is nothing to say (an FYI email, a newsletter).
    function threadStatus(t, l) {
      if (t.is_done) return { cls: 'done', text: 'Done' };
      const claimed = t.assigned_to ? `${who(t.assigned_to)} ${t.assigned_to === S.me.id ? 'are' : 'is'} on it` : '';
      if (l && l.direction === 'outbound') {
        const by = l.created_by ? `${who(l.created_by)} replied` : (S.box === 'mine' ? 'You replied from Gmail' : 'Replied from Gmail (sales@)');
        const also = t.assigned_to && t.assigned_to !== l.created_by ? `, ${claimed.replace('You are', 'you are')}` : '';
        return { cls: 'replied', text: `${by} ${timeAgo(l.sent_at)}${t.section === 'priority' ? ', waiting on them' : ''}${also}` };
      }
      // we emailed them another way (a booking, a quote, another thread), item 80
      if (t.answered_at) {
        const also = t.assigned_to && t.assigned_to !== t.answered_by ? `, ${claimed.replace('You are', 'you are')}` : '';
        return { cls: 'replied', text: `${who(t.answered_by)} emailed them ${timeAgo(t.answered_at)} (a new email)${t.section === 'priority' ? ', waiting on them' : ''}${also}` };
      }
      if (t.assigned_to) return { cls: 'onit', text: `${claimed.replace('You are', "You're")}${t.assigned_at ? ' (claimed ' + timeAgo(t.assigned_at) + ')' : ''}` };
      if (t.section === 'priority') return { cls: 'waiting', text: 'Nobody has replied yet' };
      return null;
    }
    const statusHtml = (t, l) => { const st = threadStatus(t, l); return st ? `<span class="inbox-status ${st.cls}">${escapeHtml(st.text)}</span>` : ''; };
    const mb = () => (S.box === 'mine' ? S.mine : S.shared);
    // the list: today's time, else the day ("10:42 am", "11 Nov", "11 Nov 25"); a message: both
    const SYD = 'Australia/Sydney';
    function whenShort(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      const day = (x) => x.toLocaleDateString('en-CA', { timeZone: SYD });
      if (day(d) === day(new Date())) return d.toLocaleTimeString('en-AU', { timeZone: SYD, hour: 'numeric', minute: '2-digit' });
      const sameYear = d.toLocaleDateString('en-AU', { timeZone: SYD, year: 'numeric' }) === new Date().toLocaleDateString('en-AU', { timeZone: SYD, year: 'numeric' });
      return d.toLocaleDateString('en-AU', { timeZone: SYD, day: 'numeric', month: 'short', ...(sameYear ? {} : { year: '2-digit' }) });
    }
    const whenFull = (iso) => (iso ? new Date(iso).toLocaleString('en-AU', { timeZone: SYD, day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : '');
    // Read or unread, in Gmail too for a My inbox (its sync would otherwise flip it back)
    async function setRead(threadId, read) {
      if (S.box === 'mine') return act(read ? 'mark_read' : 'mark_unread', { thread_id: threadId });
      const { error } = await supabaseClient.from('email_threads').update({ is_read: read }).eq('id', threadId);
      if (error) throw error;
    }
    // Drafts changed: the count, and the Drafts folder if it is open
    async function draftsChanged() { await loadDrafts(); if (S.view === 'drafts' && !S.search) loadList(); }
    // Clean up and Connect take the whole width: the reading pane goes while they show
    const onePane = (on) => document.getElementById('inbox-layout').classList.toggle('one-pane', !!on);
    // Keeps the page the height of the visible screen (iPhone keyboard), like Team chat.
    function fitHeight() {
      const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      document.documentElement.style.setProperty('--ib-vh', h + 'px');
      if (window.visualViewport && isNarrow()) window.scrollTo(0, 0);
    }
    const mineConnected = () => !!(S.mine && S.mine.connected_at);

    function timeAgo(dateStr) {
      if (!dateStr) return '';
      const mins = Math.floor((Date.now() - new Date(dateStr).getTime()) / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `${hours}h ago`;
      return `${Math.floor(hours / 24)}d ago`;
    }
    // "Bob Jones <bob@x.com>" -> "Bob Jones"; a bare address stays as it is
    function addrName(raw) {
      const m = String(raw || '').match(/^\s*"?([^"<]*?)"?\s*<([^>]+)>\s*$/);
      return m ? (m[1].trim() || m[2]) : String(raw || '').trim();
    }
    function addrFull(raw) {
      const m = String(raw || '').match(/^\s*"?([^"<]*?)"?\s*<([^>]+)>\s*$/);
      if (!m) return String(raw || '').trim();
      const name = m[1].trim();
      return name && name.toLowerCase() !== m[2].toLowerCase() ? name + ' <' + m[2].trim() + '>' : m[2].trim();
    }
    // Short form for the list: the name, plus the sender's domain so "admin" says who it is from
    function addrShort(raw) {
      const m = String(raw || '').match(/^\s*"?([^"<]*?)"?\s*<([^>]+)>\s*$/);
      const name = addrName(raw);
      if (!m || !m[1].trim()) return name;
      const dom = (m[2].split('@')[1] || '').trim();
      return dom && !/^(gmail|hotmail|outlook|yahoo|bigpond|icloud)\./i.test(dom) && !name.toLowerCase().includes(dom.split('.')[0].toLowerCase()) ? name + ' (' + dom + ')' : name;
    }
    const addrOnlyOf = (full) => { const m = String(full).match(/<([^>]+)>/); return m ? m[1] : full; };
    const canMirror = (m) => !!m && String(m.scopes || '').includes('gmail.modify');
    async function act(action, body) { return emailAction(action, body); }
    // Phones and narrow screens (list and conversation are separate screens): opening a
    // conversation from the list adds a history entry, so the iPhone back swipe returns to
    // the list instead of leaving Inbox. Back runs the same close code through popstate.
    const isNarrow = () => window.matchMedia('(max-width: 1000px)').matches;
    function setUrl(push) {
      const p = new URLSearchParams();
      if (S.box === 'mine') p.set('box', 'mine');
      if (S.activeThreadId) p.set('thread', S.activeThreadId);
      const url = '/inbox.html' + (p.toString() ? '?' + p : '');
      if (push && isNarrow()) history.pushState({ teInbox: 1 }, '', url);
      else history.replaceState(history.state, '', url);
    }
    function closeReading() {
      S.activeThreadId = null;
      document.getElementById('inbox-layout').classList.remove('reading');
      document.querySelectorAll('.ib-row.active').forEach(el => el.classList.remove('active'));
    }
    function leaveThread() {
      if (history.state && history.state.teInbox) { history.back(); return; }
      closeReading(); setUrl();
    }
    window.addEventListener('popstate', async () => {
      if (!S.me) return;
      const p = new URLSearchParams(location.search);
      const box = p.get('box') === 'mine' ? 'mine' : 'sales';
      const thread = p.get('thread');
      if (box !== S.box) { await showBox(box); if (thread) { openThread(thread, { keepUrl: true }); setUrl(); } return; }
      if (thread) { if (thread !== S.activeThreadId) openThread(thread, { keepUrl: true }); }
      else if (S.activeThreadId) closeReading();
    });

    // ---------- loading ----------

    async function loadMailboxes() {
      const { data } = await supabaseClient.from('mailboxes').select('*');
      S.shared = (data || []).find(m => m.kind === 'shared') || null;
      S.mine = (data || []).find(m => m.kind === 'personal' && m.owner_id === S.me.id) || null;
    }

    async function loadLabels() {
      const m = mb();
      if (!m) { S.labels = []; return; }
      const { data: labels } = await supabaseClient.from('email_labels').select('*').eq('mailbox_id', m.id).order('name');
      S.labels = labels || [];
      if (!S.labels.length) return;
      const { data: links } = await supabaseClient.from('email_thread_labels').select('label_id, email_threads!inner(is_done, last_message_at)').in('label_id', S.labels.map(l => l.id)).limit(5000);
      const open = {}, all = {}, last = {};
      (links || []).forEach(l => {
        all[l.label_id] = (all[l.label_id] || 0) + 1;
        if (!l.email_threads.is_done) open[l.label_id] = (open[l.label_id] || 0) + 1;
        const at = l.email_threads.last_message_at || '';
        if (at > (last[l.label_id] || '')) last[l.label_id] = at;
      });
      S.labels.forEach(l => { l.count = all[l.id] || 0; l.openCount = open[l.id] || 0; l.lastMail = last[l.id] || ''; });
    }

    async function loadDrafts() {
      const m = mb();
      if (!m) { S.drafts = []; renderDraftsCount(); return; }
      const { data } = await supabaseClient.from('email_drafts').select('*, email_threads(subject)').eq('mailbox_id', m.id).eq('status', 'draft').order('updated_at', { ascending: false }).limit(200);
      S.drafts = data || [];
      renderDraftsCount();
    }
    function renderDraftsCount() {
      const el = document.querySelector('#inbox-side [data-view="drafts"]');
      if (el) el.innerHTML = `<span>Drafts</span>${S.drafts.length ? `<span class="n">${S.drafts.length}</span>` : ''}`;
    }

    function baseThreads(select) {
      return supabaseClient.from('email_threads').select(select || '*, clients(name)').eq('mailbox_id', mb().id).eq('is_supplier_bill', false);
    }
    const viewFilter = {
      // answered_at: we emailed them another way (a booking, a quote), so it is not waiting on us (item 80)
      priority: (q) => q.eq('section', 'priority').eq('last_direction', 'inbound').eq('is_done', false).is('answered_at', null),
      other: (q) => q.eq('is_done', false).or('section.is.null,section.eq.other,and(section.eq.priority,last_direction.eq.outbound),and(section.eq.priority,answered_at.not.is.null)'),
      updates: (q) => q.eq('section', 'updates').eq('is_done', false),
      done: (q) => q.eq('is_done', true),
      all: (q) => q,
    };

    // Priority: everything waiting on a reply. Other and updates: unread only.
    async function loadCounts() {
      const count = (view, unread) => {
        let q = viewFilter[view](supabaseClient.from('email_threads').select('id', { count: 'exact', head: true }).eq('mailbox_id', mb().id).eq('is_supplier_bill', false));
        if (unread) q = q.eq('is_read', false);
        return q.then(r => r.count || 0);
      };
      const [priority, other, updates] = await Promise.all([count('priority'), count('other', true), count('updates', true)]);
      return { priority, other, updates };
    }

    // ---------- page shell ----------

    async function showBox(box) {

      S.search = '';

      const banner = document.getElementById('inbox-banner');
      banner.innerHTML = '';
      setUrl();
      if (box === 'mine' && !mineConnected()) {
        document.getElementById('inbox-subtitle').textContent = 'Your own work email, private to you';
        S.drafts = []; renderDraftsCount();

      }
      const m = mb();

      // Labels, drafts, side counts and the thread list all go out together; the list
      // paints as soon as its own query lands and fills in chips once labels are in.
      const countsP = loadCounts();
      const labelsP = loadLabels();
      const draftsP = loadDrafts();
      await Promise.all([
        labelsP.then(() => renderSide(countsP)),
        draftsP,

    async function renderSide(countsP) {
      const side = document.getElementById('inbox-side');

      const item = (view, label, n, hot) => `<a class="side-item ${S.view === view ? 'on' : ''}" data-view="${view}"><span>${label}</span>${n ? `<span class="n ${hot ? 'hot' : ''}">${n}</span>` : ''}</a>`;
      const byMail = (a, b) => String(b.lastMail || '').localeCompare(String(a.lastMail || '')) || a.name.localeCompare(b.name);
      const open = S.labels.filter(l => l.status === 'open').sort(byMail), finished = S.labels.filter(l => l.status === 'done').sort(byMail);
      // Finished stays folded unless asked for, or the open label is in it
      const showFinished = S.showFinished || finished.some(l => S.view === 'label:' + l.id);
      side.innerHTML = item('priority', 'Priority', counts.priority, true)
