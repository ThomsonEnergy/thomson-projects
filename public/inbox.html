<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('te-theme') || (matchMedia('(pointer: coarse)').matches ? 'dark' : 'navy'));</script>
<title>Inbox - Thomson Energy</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=16" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .inbox-layout { display:flex; gap:16px; align-items:flex-start; }
  .inbox-thread-list { width:400px; flex-shrink:0; max-height:calc(100vh - 220px); overflow-y:auto; }
  .inbox-thread-item { display:block; padding:12px; border-bottom:1px solid var(--border); cursor:pointer; }
  .inbox-thread-item:hover { background:var(--surface-2); }
  .inbox-thread-item.active { background:var(--surface-2); border-left:3px solid var(--accent); }
  .inbox-thread-item.unread .inbox-subject { font-weight:700; }
  .inbox-detail { flex:1; min-width:0; }
  .inbox-message { border:1px solid var(--border); border-radius:8px; padding:14px; margin-bottom:12px; white-space:pre-wrap; }
  .inbox-message.inbound { margin-right:48px; border-left:4px solid #3fb97a; }
  .inbox-message.outbound { margin-left:48px; border-right:4px solid var(--accent); background:var(--accent-dim, var(--surface-2)); }
  .dir-badge { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:1px 7px; border-radius:20px; margin-right:6px; vertical-align:1px; }
  .dir-badge.inbound { color:#3fb97a; border:1px solid #3fb97a; }
  .dir-badge.outbound { color:var(--accent); border:1px solid var(--accent); }
  .inbox-filters { display:flex; gap:6px; flex-wrap:wrap; align-items:center; padding:8px 4px 10px; position:sticky; top:0; background:var(--surface); z-index:1; }
  .inbox-filters button { font-size:12px; padding:5px 12px; }
  .inbox-filters button.on { background:var(--accent); color:var(--accent-contrast, #fff); border-color:var(--accent); }
  .inbox-thread-item.sent-last { border-right:3px solid var(--accent); }
  .inbox-thread-item.recv-last { border-right:3px solid #3fb97a; }
  .inbox-who { font-size:12px; color:var(--text); margin:3px 0 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .email-body { white-space:normal; }
  @media (max-width: 800px) {
    .inbox-layout { flex-direction:column; }
    .inbox-thread-list { width:100%; max-height:300px; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('mobile-menu-dropdown').classList.toggle('open')">&#9776;</button>
    <div class="mobile-menu-dropdown" id="mobile-menu-dropdown"></div>
    <nav class="topbar-tabs" id="topbar-tabs"></nav>
    <div class="topbar-right">
      <a href="/schedule.html" class="topbar-icon-link" title="Schedule">&#128197;</a>
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/home.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="wrap wide">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
      <h1 style="margin:0;">Inbox</h1>
      <div>
        <button type="button" class="secondary" id="sync-now-btn">Sync now</button>
        <button type="button" id="compose-btn">Compose</button>
      </div>
    </div>
    <p class="subtitle">Shared inbox for sales@thomsonenergy.com.au - visible to every staff member.</p>

    <div class="card">
      <div class="inbox-layout">
        <div class="inbox-thread-list" id="thread-list"><p class="subtitle">Loading...</p></div>
        <div class="inbox-detail" id="thread-detail">
          <p class="subtitle">Select a conversation on the left, or click Compose to start a new one.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/supabase-client.js?v=75"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/email-view.js?v=3"></script>
  <script src="/js/email-compose.js?v=4"></script>
  <script>
    function timeAgo(dateStr) {
      if (!dateStr) return '';
      const diffMs = Date.now() - new Date(dateStr).getTime();
      const mins = Math.floor(diffMs / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins}m ago`;
      const hours = Math.floor(mins / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.floor(hours / 24);
      return `${days}d ago`;
    }

    let activeThreadId = null;
    let inboxBox = 'inbox';   // inbox | sent | all | spam
    let unreadOnly = false;
    let loadedThreads = [], loadedLatest = {}, loadedRecent = [], draftThreads = new Set();

    // The email workers (netlify/functions/email-workers.js) and their undo buttons.
    async function workerAction(body) {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const res = await fetch('/.netlify/functions/email-worker-action', {
        method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` }, body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => ({ ok: false, error: `Did not answer properly (status ${res.status}).` }));
      if (!data.ok) throw new Error(data.error || 'That did not work.');
      if (data.warning) alert(data.warning);
      return data;
    }
    const workerBadge = (text) => '<span class="dir-badge" style="color:var(--accent); border:1px solid var(--accent);">' + text + '</span>';

    // "Bob Jones <bob@x.com>" -> "Bob Jones"; a bare address stays as it is
    function addrName(raw) {
      const m = String(raw || '').match(/^\s*"?([^"<]*?)"?\s*<([^>]+)>\s*$/);
      return m ? (m[1].trim() || m[2]) : String(raw || '').trim();
    }

    // "Bob Jones <bob@x.com>" -> "Bob Jones <bob@x.com>" with a bare address kept as is, for the message header
    function addrFull(raw) {
      const m = String(raw || '').match(/^\s*"?([^"<]*?)"?\s*<([^>]+)>\s*$/);
      if (!m) return String(raw || '').trim();
      const name = m[1].trim();
      return name && name.toLowerCase() !== m[2].toLowerCase() ? name + ' <' + m[2].trim() + '>' : m[2].trim();
    }
    // Short form for the list: the name, plus the sender's domain so "admin" says who it is from
    function addrShort(raw) {
      const m = String(raw || '').match(/^\s*"?([^"<]*?)"?\s*<([^>]+)>\s*$/);
      const name = addrName(raw);
      if (!m || !m[1].trim()) return name;
      const dom = (m[2].split('@')[1] || '').trim();
      return dom && !/^(gmail|hotmail|outlook|yahoo|bigpond|icloud)\./i.test(dom) && !name.toLowerCase().includes(dom.split('.')[0].toLowerCase()) ? name + ' (' + dom + ')' : name;
    }

    async function loadThreadList() {
      const listEl = document.getElementById('thread-list');
      const { data: threads, error } = await supabaseClient
        .from('email_threads')
        .select('*, clients(name)')
        .order('last_message_at', { ascending: false, nullsFirst: false })
        .limit(100);
      if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }

      if (!threads.length) {
        listEl.innerHTML = `<p class="subtitle">No emails yet - click "Sync now" once sales@ is connected in Settings.</p>`;
        return;
      }

      // each conversation's messages tell us what we sent and what we received
      const { data: recent } = await supabaseClient.from('emails')
        .select('thread_id, direction, from_address, to_addresses, sent_at')
        .in('thread_id', threads.map(t => t.id)).order('sent_at', { ascending: false }).limit(1500);
      const latest = {};
      (recent || []).forEach(e => { if (!latest[e.thread_id]) latest[e.thread_id] = e; });
      const { data: drafts } = await supabaseClient.from('email_drafts').select('thread_id').eq('status', 'ready').in('thread_id', threads.map(t => t.id));
      draftThreads = new Set((drafts || []).map(d => d.thread_id));
      loadedThreads = threads; loadedLatest = latest; loadedRecent = recent || [];
      renderThreadList();
    }

    // Three boxes: Inbox (conversations with mail we have received), Sent (every email we
    // sent) and All. Each row says whether it was sent or received, and to / from whom.
    function renderThreadList() {
      const listEl = document.getElementById('thread-list');
      const threads = loadedThreads, latest = loadedLatest;
      const byId = Object.fromEntries(threads.map(t => [t.id, t]));
      const hasInbound = new Set(loadedRecent.filter(e => e.direction === 'inbound').map(e => e.thread_id));
      const unreadCount = threads.filter(t => !t.is_read && !t.spam_at && hasInbound.has(t.id)).length;
      const spamCount = threads.filter(t => t.spam_at).length;
      const tab = (key, label, extra) => '<button type="button" class="secondary ' + (inboxBox === key ? 'on' : '') + '" data-box="' + key + '">' + label + (extra || '') + '</button>';
      const sub = (t, when) => '<p class="subtitle" style="margin:2px 0 0; font-size:12px;">' + (t.clients?.name ? escapeHtml(t.clients.name) + ' &middot; ' : '') + when + '</p>';

      let body;
      if (inboxBox === 'sent') {
        body = loadedRecent.filter(e => e.direction === 'outbound' && byId[e.thread_id]).map(e => {
          const t = byId[e.thread_id];
          return '<a class="inbox-thread-item sent-last ' + (t.id === activeThreadId ? 'active' : '') + '" data-id="' + t.id + '">'
            + '<div class="inbox-subject">' + escapeHtml(t.subject || '(no subject)') + '</div>'
            + '<div class="inbox-who"><span class="dir-badge outbound">Sent</span>To ' + escapeHtml(addrName((e.to_addresses || [])[0]) || 'unknown') + '</div>'
            + sub(t, timeAgo(e.sent_at)) + '</a>';
        }).join('') || '<p class="subtitle" style="padding:8px 4px;">Nothing sent yet.</p>';
      } else {
        const shown = inboxBox === 'spam'
          ? threads.filter(t => t.spam_at)
          : threads.filter(t => !t.spam_at && (inboxBox === 'all' || hasInbound.has(t.id)) && (!unreadOnly || !t.is_read));
        body = shown.map(t => {
          const l = latest[t.id];
          const out = !!l && l.direction === 'outbound';
          const who = !l ? '' : out
            ? '<span class="dir-badge outbound">Sent</span>To ' + escapeHtml(addrName((l.to_addresses || [])[0]) || 'unknown')
            : '<span class="dir-badge inbound">Received</span>From ' + escapeHtml(addrShort(l.from_address) || 'unknown');
          return '<a class="inbox-thread-item ' + (t.id === activeThreadId ? 'active' : '') + ' ' + (!t.is_read ? 'unread' : '') + ' ' + (l ? (out ? 'sent-last' : 'recv-last') : '') + '" data-id="' + t.id + '">'
            + '<div class="inbox-subject">' + escapeHtml(t.subject || '(no subject)') + '</div>'
            + '<div class="inbox-who">' + who + '</div>'
            + (draftThreads.has(t.id) || t.ai_suggested_project_id ? '<div style="margin-top:3px;">' + (draftThreads.has(t.id) ? workerBadge('Draft ready') : '') + (t.ai_suggested_project_id ? workerBadge('Job suggested') : '') + '</div>' : '')
            + sub(t, timeAgo(t.last_message_at)) + '</a>';
        }).join('') || '<p class="subtitle" style="padding:8px 4px;">' + (inboxBox === 'spam' ? 'No spam. Bouncer archives junk here; nothing is deleted.' : 'Nothing here.') + '</p>';
      }
      listEl.innerHTML = '<div class="inbox-filters">' + tab('inbox', 'Inbox', unreadCount ? ' (' + unreadCount + ')' : '') + tab('sent', 'Sent') + tab('all', 'All') + tab('spam', 'Spam', spamCount ? ' (' + spamCount + ')' : '')
        + (inboxBox === 'sent' || inboxBox === 'spam' ? '' : '<label style="margin:0 0 0 auto; font-size:12px; font-weight:400; display:flex; align-items:center; gap:4px;"><input type="checkbox" id="unread-only" style="width:auto;" ' + (unreadOnly ? 'checked' : '') + ' /> Unread only</label>')
        + '</div>' + body;

      listEl.querySelectorAll('[data-box]').forEach(b => b.addEventListener('click', () => { inboxBox = b.dataset.box; renderThreadList(); }));
      const uo = document.getElementById('unread-only');
      if (uo) uo.addEventListener('change', () => { unreadOnly = uo.checked; renderThreadList(); });
      listEl.querySelectorAll('.inbox-thread-item').forEach(el => {
        el.addEventListener('click', () => openThread(el.dataset.id));
      });
    }

    const addrOnlyOf = (full) => { const m = String(full).match(/<([^>]+)>/); return m ? m[1] : full; };

    function messageHtml(m, myUserId, staffName) {
      const out = m.direction === 'outbound';
      const senderLabel = out
        ? (m.created_by ? (m.created_by === myUserId ? 'You' : staffName(m.created_by)) + ' (as sales@)' : 'sales@ (sent from Gmail)')
        : (addrName(m.from_address) || 'Client');
      const fromFull = out ? '' : addrFull(m.from_address);
      const toLine = (m.to_addresses || []).map(addrName).filter(Boolean).join(', ');
      return `
        <div class="inbox-message ${m.direction}">
          <p class="subtitle" style="margin:0 0 8px; font-size:12px;"><span class="dir-badge ${m.direction}">${out ? 'Sent' : 'Received'}</span><strong style="color:var(--text);">${escapeHtml(senderLabel)}</strong>${fromFull && fromFull !== senderLabel ? ' <span title="Sent from this address">&lt;' + escapeHtml(addrOnlyOf(fromFull)) + '&gt;</span>' : ''}${toLine ? ' to ' + escapeHtml(toLine) : ''} &middot; ${new Date(m.sent_at).toLocaleString('en-AU')}</p>
          <div class="email-body" data-email-id="${m.id}"></div>
        </div>`;
    }

    // The jobs this conversation is tagged to, as chips, plus "Tag to a job".
    async function loadThreadTags(threadId) {
      const el = document.getElementById('thread-tags');
      if (!el) return;
      const [{ data: links }, { data: thread }] = await Promise.all([
        supabaseClient.from('email_job_links').select('id, kind, note, tagged_by_ai, projects(id, name, job_number, quote_number)').eq('thread_id', threadId),
        supabaseClient.from('email_threads').select('ai_suggested_project_id, ai_suggested_reason, projects:ai_suggested_project_id(id, name, job_number, quote_number)').eq('id', threadId).single(),
      ]);
      const suggestion = !(links || []).length && thread?.projects ? thread.projects : null;
      el.innerHTML = (links || []).map(l => `<span style="font-size:12px; padding:3px 10px; border:1px solid var(--accent); border-radius:20px; display:inline-flex; gap:6px; align-items:center;">
          <a href="/project.html?id=${l.projects.id}&tab=emails" class="link-quiet" title="${escapeHtml(l.note || '')}">${escapeHtml(projectRef(l.projects))} &middot; ${EMAIL_KINDS[l.kind] || 'Other'}</a>
          ${l.tagged_by_ai ? '<span class="subtitle" style="font-size:11px;" title="' + escapeHtml(l.note || '') + '">tagged by Tagger</span>' : ''}
          <a href="#" data-untag="${l.id}" title="${l.tagged_by_ai ? 'Undo' : 'Remove this tag'}">&times;</a></span>`).join('')
        + (suggestion ? `<span style="font-size:12px; padding:3px 10px; border:1px dashed var(--accent); border-radius:20px; display:inline-flex; gap:8px; align-items:center;" title="${escapeHtml(thread.ai_suggested_reason || '')}">
          Tagger suggests <a href="/project.html?id=${suggestion.id}" class="link-quiet">${escapeHtml(projectRef(suggestion))}</a>
          <a href="#" id="suggest-yes">Tag it</a><a href="#" id="suggest-no" title="Not this job">&times;</a></span>` : '')
        + '<button type="button" class="secondary" id="tag-email-btn" style="font-size:12px; padding:4px 10px;">+ Tag to a job</button>'
        + '<button type="button" id="create-from-email-btn" style="font-size:12px; padding:4px 10px;">Create quote / job from this email</button>';
      el.querySelectorAll('[data-untag]').forEach(a => a.addEventListener('click', async (e) => {
        e.preventDefault();
        if (!confirm('Remove this tag? The email itself is not deleted.')) return;
        await supabaseClient.from('email_job_links').delete().eq('id', a.dataset.untag);
        loadThreadTags(threadId);
      }));
      const clearSuggestion = () => supabaseClient.from('email_threads').update({ ai_suggested_project_id: null, ai_suggested_reason: null }).eq('id', threadId);
      document.getElementById('suggest-yes')?.addEventListener('click', async (e) => {
        e.preventDefault();
        const { data: { user } } = await supabaseClient.auth.getUser();
        const { error } = await supabaseClient.from('email_job_links').insert({ thread_id: threadId, project_id: suggestion.id, kind: 'client', note: 'Tagger: ' + (thread.ai_suggested_reason || ''), created_by: user.id });
        if (error) { alert(error.message); return; }
        await clearSuggestion(); loadThreadTags(threadId); loadThreadList();
      });
      document.getElementById('suggest-no')?.addEventListener('click', async (e) => {
        e.preventDefault();
        await clearSuggestion(); loadThreadTags(threadId); loadThreadList();
      });
      document.getElementById('create-from-email-btn').addEventListener('click', () => openCreateFromEmailModal(threadId));
      document.getElementById('tag-email-btn').addEventListener('click', () => openTagEmailModal({ threadId, onSaved: () => loadThreadTags(threadId) }));
    }

    async function openThread(threadId) {
      activeThreadId = threadId;
      document.querySelectorAll('.inbox-thread-item').forEach(el => el.classList.toggle('active', el.dataset.id === threadId));

      const detailEl = document.getElementById('thread-detail');
      detailEl.innerHTML = `<p class="subtitle">Loading...</p>`;

      const [{ data: thread }, { data: emails }, { data: staff }, { data: { user } }, { data: drafts }] = await Promise.all([
        supabaseClient.from('email_threads').select('*, clients(name)').eq('id', threadId).single(),
        supabaseClient.from('emails').select('*').eq('thread_id', threadId).order('sent_at', { ascending: true }),
        supabaseClient.from('profiles').select('id, full_name'),
        supabaseClient.auth.getUser(),
        supabaseClient.from('email_drafts').select('id, body_text').eq('thread_id', threadId).eq('status', 'ready').order('created_at', { ascending: false }).limit(1),
      ]);
      const draft = (drafts || [])[0] || null;
      const staffName = (id) => (staff || []).find(s => s.id === id)?.full_name || 'A team member';

      detailEl.innerHTML = `
        <h2 style="margin:0 0 4px;">${escapeHtml(thread.subject || '(no subject)')}</h2>
        ${thread.clients?.name ? `<p class="subtitle" style="margin:0 0 6px;">${escapeHtml(thread.clients.name)}</p>` : ''}
        ${thread.spam_at ? `<div class="error-box" style="display:flex; gap:10px; align-items:center; justify-content:space-between; margin:0 0 10px;"><span>Bouncer archived this as spam (out of the Inbox here and in Gmail, not deleted).</span><button type="button" class="secondary" id="not-spam-btn" style="font-size:12px; padding:4px 10px;">Not spam</button></div>` : ''}
        <div id="thread-tags" style="display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:0 0 14px;"></div>
        <div id="thread-messages">${(emails || []).map(m => messageHtml(m, user.id, staffName)).join('')}</div>
        <div class="card" style="margin-top:16px;">
          <label style="margin-top:0">Reply</label>
          ${draft ? `<p class="subtitle" id="draft-note" style="margin:0 0 6px; font-size:12px;">${workerBadge('Ghostwriter')} Drafted for you, also in Gmail Drafts. Check it, fill in anything in [brackets], then send. <a href="#" id="discard-draft">Discard draft</a></p>` : ''}
          <textarea id="reply-body" style="min-height:${draft ? 220 : 120}px;" placeholder="Type your reply...">${draft ? escapeHtml(draft.body_text) : ''}</textarea>
          <div id="reply-attach" style="margin-top:8px;"></div>
          <button type="button" id="reply-send-btn" style="margin-top:10px;">Send reply</button>
          <div id="reply-msg"></div>
        </div>`;

      const replyPicker = emailLocalFilePicker(document.getElementById('reply-attach'));
      let draftId = draft ? draft.id : null;
      document.getElementById('discard-draft')?.addEventListener('click', async (e) => {
        e.preventDefault();
        if (!confirm('Discard this draft? It is also removed from Gmail Drafts.')) return;
        try { await workerAction({ action: 'discard_draft', draft_id: draftId }); } catch (err) { alert(err.message); return; }
        draftId = null;
        document.getElementById('draft-note')?.remove();
        document.getElementById('reply-body').value = '';
        loadThreadList();
      });
      document.getElementById('not-spam-btn')?.addEventListener('click', async () => {
        try { await workerAction({ action: 'not_spam', thread_id: threadId }); } catch (err) { alert(err.message); return; }
        inboxBox = 'inbox';
        await loadThreadList();
        await openThread(threadId);
      });
      loadThreadTags(threadId);
      (emails || []).forEach(m => mountEmailBody(detailEl.querySelector(`.email-body[data-email-id="${m.id}"]`), m, { fetchAttachment: fetchEmailAttachment, fetchStored: fetchStoredAttachment }));

      if (!thread.is_read) {
        await supabaseClient.from('email_threads').update({ is_read: true }).eq('id', threadId);
        await loadThreadList();
      }

      document.getElementById('reply-send-btn').addEventListener('click', async () => {
        const btn = document.getElementById('reply-send-btn');
        const msg = document.getElementById('reply-msg');
        const bodyText = document.getElementById('reply-body').value.trim();
        if (!bodyText) { msg.innerHTML = `<div class="error-box">Enter a reply first.</div>`; return; }

        const lastInbound = (emails || []).filter(m => m.direction === 'inbound').slice(-1)[0];
        const lastAny = (emails || []).slice(-1)[0];
        const toAddress = (lastInbound || lastAny)?.from_address;
        if (!toAddress) { msg.innerHTML = `<div class="error-box">Couldn't work out who to reply to.</div>`; return; }

        btn.disabled = true;
        btn.textContent = replyPicker.files().length ? 'Uploading...' : 'Sending...';
        try {
          const uploaded = await emailUploadFiles(replyPicker.files());
          btn.textContent = 'Sending...';
          await emailSendNow({ to: emailAddressOnly(toAddress), subject: thread.subject || '', bodyText, replyToThreadId: threadId, draftId, attachments: uploaded.map(u => ({ bucket: u.bucket, path: u.path, name: u.name })) });
          await loadThreadList();
          await openThread(threadId);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
          btn.disabled = false;
          btn.textContent = 'Send reply';
        }
      });
    }

    function openComposePanel() {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:520px; width:100%;">
          <h2>New email</h2>
          <label style="margin-top:0">To</label>
          <input id="compose-to" placeholder="client@example.com" />
          <label>Subject</label>
          <input id="compose-subject" />
          <label>Message</label>
          <textarea id="compose-body" style="min-height:160px;"></textarea>
          <div style="margin-top:14px;">
            <button id="compose-send-btn">Send</button>
            <button type="button" class="secondary" id="compose-cancel-btn">Cancel</button>
          </div>
          <div id="compose-msg"></div>
        </div>`;
      document.body.appendChild(overlay);
      overlay.querySelector('#compose-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#compose-send-btn').addEventListener('click', async () => {
        const btn = overlay.querySelector('#compose-send-btn');
        const msg = overlay.querySelector('#compose-msg');
        const to = overlay.querySelector('#compose-to').value.trim();
        const subject = overlay.querySelector('#compose-subject').value.trim();
        const bodyText = overlay.querySelector('#compose-body').value.trim();
        if (!to || !subject || !bodyText) { msg.innerHTML = `<div class="error-box">Fill in all fields.</div>`; return; }

        btn.disabled = true;
        btn.textContent = 'Sending...';
        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          const res = await fetch('/.netlify/functions/send-gmail', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
            body: JSON.stringify({ to, subject, bodyText }),
          });
          const data = await res.json();
          if (!data.ok) throw new Error(data.error);
          overlay.remove();
          await loadThreadList();
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${err.message}</div>`;
          btn.disabled = false;
          btn.textContent = 'Send';
        }
      });
    }

    document.getElementById('compose-btn').addEventListener('click', () => openEmailComposer({
      title: 'New email',
      onSent: async (threadId) => { await loadThreadList(); await openThread(threadId); },
    }));

    document.getElementById('sync-now-btn').addEventListener('click', async () => {
      const btn = document.getElementById('sync-now-btn');
      btn.disabled = true;
      btn.textContent = 'Syncing...';
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        const res = await fetch('/.netlify/functions/sync-gmail-now', {
          method: 'POST',
          headers: { Authorization: `Bearer ${session.access_token}` },
        });
        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch (e) { throw new Error(`The sync did not answer properly (status ${res.status}). Try again in a minute.`); }
        if (!data.ok) throw new Error(data.error || 'The sync failed.');
        await loadThreadList();
        if (data.done === false) alert('Pulled in some of the mail so far. Press Sync now again to bring in the rest.');
      } catch (err) {
        alert(err.message);
      }
      btn.disabled = false;
      btn.textContent = 'Sync now';
    });

    (async function () {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();
      renderMainNav('inbox');
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });
      await loadThreadList();
      const deepThread = new URLSearchParams(window.location.search).get('thread');
      if (deepThread) openThread(deepThread);
    })();
  </script>
</body>
</html>
