<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Your proposal</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/document-fonts.css?v=1" />
<link rel="stylesheet" href="/css/style.css?v=22" />
<script src="/js/vendor/supabase-2.js?v=1"></script>
<style>
  /* The proposal is a set of A4 "pages" (black cover, white content pages
     with blue diagonal accents), styled after the Canva proposal template
     the company picked. On screen they stack as cards; when printed (and
     when generate-client-document-pdf.js renders the PDF) each one is
     exactly one A4 sheet, so the web quote and the PDF are the same
     document. Everything is sized for a 794px (A4 at 96dpi) page. */
  @page { size: A4; margin: 0; }

  body { background: #e6e9ef; }
  /* The proposal is a light document on every theme, so native pickers and form chrome stay light too. */
  html, html[data-theme] { color-scheme: light; }
  /* Sign form fields are white on every theme, so their placeholder needs its own readable grey. */
  .sign-form input::placeholder, .sign-form textarea::placeholder { color: #6b7280; }
  .qdoc {
    --q-blue: #1a6be6;
    --q-ink: #0a0a0a;
    --q-grey: #5b6472;
    font-family: 'Instrument Sans', 'Segoe UI', Arial, sans-serif;
    color: var(--q-ink);
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
  .qdoc * { box-sizing: border-box; }
  .qdoc h1, .qdoc h2, .qdoc h3, .qdoc h4 { font-family: 'Archivo', 'Segoe UI', Arial, sans-serif; text-transform: uppercase; margin: 0; }
  .qdoc p { margin: 0; }

  .pg {
    position: relative;
    width: 100%; max-width: 794px; margin: 0 auto 24px;
    min-height: 1123px;
    background: #fff; color: var(--q-ink);
    overflow: hidden;
    box-shadow: 0 6px 28px rgba(15, 23, 42, 0.18);
    padding: 64px 64px 72px;
  }
  .pg.dark { background: #000; color: #fff; }
  .pg.fixed { height: 1123px; }
  .pg-body { position: relative; z-index: 2; }

  .pg-head { position: relative; z-index: 2; display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 40px; }
  /* Every page but the title page carries the logo and the company details at the top. */
  .pg-logo { display: block; height: 84px; width: auto; max-width: 280px; }
  .pg-contact { text-align: right; font-size: 12.5px; line-height: 1.45; }
  .pg-contact a { color: inherit; text-decoration: none; }
  .pg-contact .pg-date { display: block; margin-top: 5px; font-size: 12.5px; font-weight: 700; }
  .invest-top .pg-contact, .pg.dark .pg-contact { color: #e6eaf2; }
  .invest-top .pg-contact .pg-date { color: #fff; }
  .logo-pill { display: inline-flex; align-items: center; background: #fff; border-radius: 6px; padding: 5px 9px; }
  .logo-pill img { display: block; max-height: 38px; max-width: 190px; }
  .pg-brand-name { font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 20px; text-transform: uppercase; }
  .pg-date { font-size: 14px; font-weight: 500; }

  .qdoc .pg-title { font-weight: 500; font-size: 66px; line-height: 0.98; letter-spacing: -0.02em; margin-bottom: 40px; }
  .qdoc .pg.cover .pg-title { font-size: 92px; margin: 70px 0 56px; }
  .pg-sub { font-family: 'Archivo', sans-serif; font-weight: 500; font-size: 17px; text-transform: uppercase; margin: 0 0 14px; letter-spacing: 0; }
  .qdoc .pg-lead { font-size: 13.5px; line-height: 1.62; text-align: justify; margin-bottom: 14px; }

  .cover-photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
  .cover-scrim { position: absolute; inset: 0; z-index: 0; background: linear-gradient(180deg, rgba(0,0,0,0.80) 0%, rgba(0,0,0,0.50) 42%, rgba(0,0,0,0.30) 62%, rgba(0,0,0,0.72) 100%); }
  .pg.cover .slabs { opacity: 0.62; }
  .cover-tag { border-left: 4px solid var(--q-blue); padding-left: 14px; font-family: 'Archivo', sans-serif; font-size: 19px; line-height: 1.35; text-transform: uppercase; max-width: 430px; }
  .cover-tag small { display: block; font-family: 'Instrument Sans', sans-serif; font-size: 13px; text-transform: none; opacity: 0.8; margin-top: 4px; }
  .cover-meta { position: absolute; left: 64px; bottom: 64px; z-index: 2; font-size: 13px; line-height: 1.55; max-width: 330px; text-shadow: 0 1px 8px rgba(0,0,0,0.6); }
  .cover-meta .lbl { font-size: 14px; opacity: 0.9; }
  .cover-meta b { display: block; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 20px; text-transform: uppercase; margin: 2px 0 6px; }
  .cover-meta .co { opacity: 0.95; }
  .logo-light { display: block; width: auto; }
  .logo-light.logo-cover, .logo-pill.logo-cover img { height: 150px; max-height: none; max-width: none; }
  .logo-light.logo-invest, .logo-pill.logo-invest img { height: 84px; max-height: none; max-width: none; }

  .dots { position: absolute; z-index: 1; width: 86px; height: 52px; background-image: radial-gradient(circle, #8a93a2 1px, transparent 1.6px); background-size: 17px 17px; }
  .pg.dark .dots { background-image: radial-gradient(circle, #cfd6e2 1px, transparent 1.6px); }
  .slabs { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  .slabs.corner { inset: auto; right: 0; bottom: 0; width: 30%; height: auto; aspect-ratio: 554 / 710; }
  .band-panel .slabs.corner { width: 250px; z-index: 1; }
  .pg > .slabs.corner { opacity: 0.4; }

  /* Intro page: a photo with a black panel overlapping its lower right. */
  .band-photo { position: absolute; left: 0; right: 0; top: 52%; bottom: 0; z-index: 1; }
  .band-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .band-panel { position: absolute; left: 9%; right: 0; top: 58.5%; bottom: 0; z-index: 2; background: rgba(0, 0, 0, 0.58); color: #fff; padding: 38px 40px 34px 40px; overflow: hidden; }
  .band-panel .txt { position: relative; z-index: 3; max-width: 64%; }
  .band-panel h3 { font-weight: 500; font-size: 21px; margin-bottom: 14px; }
  .band-panel h3, .band-panel p, .band-panel .det { text-shadow: 0 1px 6px rgba(0,0,0,0.55); }
  .band-panel p { font-size: 13px; line-height: 1.55; margin-bottom: 9px; }
  .band-panel .det a { color: inherit; text-decoration: none; }
  .band-panel .det { margin-top: 14px; font-size: 13px; line-height: 1.6; opacity: 0.95; }
  /* the intro page has a fixed amount of room above its photo: keep the summary inside it */
  .pg.intro .pg-head { margin-bottom: 26px; }
  .qdoc .pg.intro .pg-title { margin-bottom: 24px; }
  .pg.intro .intro-facts { gap: 14px 28px; margin: 0 0 16px; }
  .pg.intro .pg-lead { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 8px; }
  .intro-facts { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; margin: 4px 0 26px; }
  .intro-facts .k { font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--q-grey); margin-bottom: 3px; }
  .intro-facts .v { font-size: 15px; font-weight: 600; line-height: 1.35; }
  .intro-facts a { color: inherit; }

  /* Ruled rows with a blue cross, as on the Objectives page of the template. */
  .rows { margin: 8px 0 0; }
  .row-x { display: grid; grid-template-columns: 22px 1fr; gap: 0 4px; padding: 14px 0 15px; border-bottom: 1px solid var(--q-ink); break-inside: avoid; page-break-inside: avoid; }
  .row-x:first-child { border-top: 1px solid var(--q-ink); }
  .row-x .x { color: var(--q-blue); line-height: 1; padding-top: 1px; }
  .row-x .x svg { display: block; width: 15px; height: 20px; fill: currentColor; }
  .row-x .h { font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 15px; text-transform: uppercase; margin-bottom: 4px; }
  .row-x .b { font-size: 13px; line-height: 1.58; color: #2b303a; }
  .row-x .b p + p { margin-top: 6px; }
  .row-x ul { margin: 4px 0 0; padding-left: 18px; }
  .photo-row { display: grid; gap: 14px; margin: 22px 0 26px; grid-template-columns: repeat(2, 1fr); }
  .photo-row img { width: 100%; height: 200px; object-fit: cover; display: block; }
  .design-box { margin-top: 26px; padding: 18px 20px; background: #f1f5fd; border-left: 4px solid var(--q-blue); }
  .design-box p { font-size: 13px; line-height: 1.6; margin-bottom: 10px; }
  .q-btn { display: inline-block; background: var(--q-blue); color: #fff !important; text-decoration: none; padding: 10px 18px; font-weight: 600; font-size: 13px; }

  /* Tables in the template style: blue header text, thin rules. */
  .qtable { width: 100%; border-collapse: collapse; margin-top: 6px; }
  .qtable th { text-align: left; font-weight: 500; font-size: 15px; color: var(--q-blue); padding: 8px 8px 10px 0; border-bottom: 1px solid var(--q-blue); }
  .qtable td { padding: 13px 8px 13px 0; border-bottom: 1px solid var(--q-ink); font-size: 13.5px; vertical-align: top; }
  .qtable .num { text-align: right; white-space: nowrap; padding-right: 0; }
  .qtable th.num { text-align: right; padding-right: 0; }
  .qtable .muted { color: var(--q-grey); }
  .qtable .stage-detail td { border-bottom: none; padding: 5px 8px 5px 0; font-size: 12.5px; color: var(--q-grey); }
  .qtable .stage-detail .sub td { border-top: 1px solid #c9ced8; color: var(--q-ink); font-weight: 600; padding-top: 8px; }
  .qtable .stage-detail-row > td { padding: 0 0 8px 18px; border-bottom: 1px solid var(--q-ink); background: #f6f8fc; }
  .qtable .stage-summary-row { cursor: pointer; }
  .totals { text-align: right; margin-top: 22px; }
  .totals .l { font-size: 13px; color: var(--q-grey); margin-top: 3px; }
  .totals .big { font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 26px; margin-top: 14px; }
  .totals .stc { font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 20px; color: #15803d; margin-top: 12px; }
  .note-line { font-size: 12px; color: var(--q-grey); line-height: 1.55; margin-top: 12px; }
  .sec-title { font-family: 'Archivo', sans-serif; font-weight: 500; font-size: 19px; text-transform: uppercase; margin: 36px 0 6px; }
  .sor .pg-title { margin-bottom: 22px; }
  .sor .sor-h { font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 14px; text-transform: uppercase; margin: 16px 0 5px; }
  .sor p { font-size: 12.5px; line-height: 1.55; margin-bottom: 6px; }
  .sor ul { margin: 2px 0 6px; padding-left: 18px; font-size: 12.5px; line-height: 1.55; }
  .sor .qtable td, .sor .qtable th { padding-top: 7px; padding-bottom: 7px; font-size: 12.5px; }
  .est-note { border: 1px solid var(--q-blue); padding: 12px 16px; font-weight: 600; font-size: 13px; margin-bottom: 22px; }

  .pg.invest { padding-top: 0; }
  .invest-top { background: #000; color: #fff; margin: 0 -64px 34px; padding: 48px 64px 44px; position: relative; }
  .invest-top .pg-head { margin-bottom: 36px; }
  .invest-top .pg-title { margin-bottom: 0; }

  .terms-cols { column-count: 2; column-gap: 28px; font-size: 9.6px; line-height: 1.5; color: #2b303a; }
  .terms-cols h4 { font-size: 10.5px; font-weight: 600; margin: 12px 0 3px; color: var(--q-ink); break-after: avoid; }
  .terms-cols p { margin-bottom: 5px; white-space: pre-wrap; }
  .accepted-box { margin-top: 26px; display: inline-block; background: #e8f6ec; color: #14532d; padding: 12px 18px; font-weight: 600; font-size: 14px; }

  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .gallery img { width: 100%; height: 150px; object-fit: cover; display: block; }

  @media (max-width: 700px) {
    .pg { padding: 28px 22px 48px; min-height: 0; margin-bottom: 14px; box-shadow: none; }
    .pg.fixed { height: auto; min-height: 640px; }
    .pg-head { margin-bottom: 30px; flex-wrap: wrap; gap: 12px; }
    .pg-logo { height: 64px; }
    .pg-contact { text-align: left; }
    .qdoc .pg-title, .qdoc .pg.cover .pg-title { font-size: 44px; margin-bottom: 26px; }
    .qdoc .pg.cover .pg-title { margin-top: 36px; }
    .cover-meta { position: relative; left: auto; bottom: auto; margin-top: 40px; }
    .pg.cover.fixed { min-height: 860px; }
    .pg.cover .slabs { top: auto; bottom: 0; height: 36%; }
    .pg.cover .dots { display: none; }
    .terms-cols h4:first-child { margin-top: 0; }
    .band-photo { position: static; height: 240px; }
    .band-panel { position: static; background: #000; padding: 26px 22px 120px; margin: 0 -22px -48px; }
    .band-panel .txt { max-width: 100%; }
    .intro-facts { grid-template-columns: 1fr; }
    .photo-row { grid-template-columns: 1fr; }
    .photo-row img { height: 200px; }
    .invest-top { margin: 0 -22px 28px; padding: 28px 22px 30px; }
    .terms-cols { column-count: 1; font-size: 11px; }
    .gallery { grid-template-columns: repeat(2, 1fr); }
  }

  /* Phone: a fixed bottom bar with the total and the approve button while there is something to approve.
     It hides (.away) while the sign form itself is on screen so there are never two approve buttons at once. */
  .q-approve-bar { display: none; }
  @media (max-width: 700px) {
    #print-btn { display: none; }
    body.has-approve-bar #topbar-total, body.has-approve-bar #topbar-accept { display: none; }
    body.has-approve-bar .q-approve-bar { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 100; min-height: 48px; padding: 6px 14px calc(6px + env(safe-area-inset-bottom)); align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border-top: 1px solid var(--border); box-shadow: 0 -4px 16px rgba(0,0,0,0.18); }
    body.has-approve-bar .q-approve-bar.away { display: none; }
    .q-approve-bar .ab-total span { display: block; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .q-approve-bar .ab-total b { font-size: 17px; color: var(--text); }
    body.has-approve-bar .wrap { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  }

  /* When the PDF is made (?print=1) the page is laid out at true sheet width before it is cut into
     sheets, so what is measured is exactly what is printed, whatever size the window is. */
  .as-paper .topbar, .as-paper #accept-error, .as-paper .q-approve-bar { display: none !important; }
  .as-paper .wrap { max-width: none !important; width: 794px !important; margin: 0 !important; padding: 0 !important; }
  .as-paper .pg { width: 794px; max-width: none; margin: 0; box-shadow: none; }

  @media print {
    .topbar, #accept-error, .q-approve-bar { display: none !important; }
    html, body { background: #fff !important; }
    .wrap { max-width: none !important; width: 210mm !important; margin: 0 !important; padding: 0 !important; }
    .pg { width: 210mm; max-width: none; margin: 0; box-shadow: none; min-height: 297mm; page-break-after: always; break-after: page; }
    .pg.fixed { height: 297mm; }
    .pg:last-child { page-break-after: auto; break-after: auto; }
    .qdoc, .qdoc * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .stage-toggle-arrow { display: none; }
    .sign-form { display: none !important; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <span id="brand-mark" class="brand">PROPOSAL</span>
    <div class="topbar-right">
      <div id="topbar-total" style="text-align:right;"></div>
      <div id="topbar-accept"></div>
      <button class="secondary" id="print-btn" onclick="window.print()">Print / Save as PDF</button>
    </div>
  </div>

  <div class="wrap" style="max-width:860px;">
    <div id="accept-error"></div>
    <div id="content" class="qdoc"><p class="subtitle" style="padding:24px;">Loading your proposal...</p></div>
  </div>
  <div id="approve-bar" class="q-approve-bar"></div>

  <script src="/js/supabase-client.js?v=103"></script>
  <script src="/js/schedule-of-rates.js?v=2"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');
    // ?variation=<token>: the page a client gets to approve a fixed-price variation - their original
    // quote with the variation (and the reason for it) added on a page of its own, ready to sign.
    const variationToken = new URLSearchParams(window.location.search).get('variation');
    if (new URLSearchParams(window.location.search).get('print') === '1') document.documentElement.classList.add('as-paper');

    // Company showcase photos, shipped with the site. A job's own cover
    // photos (chosen when quoting) are used first; these fill in the rest.
    // Shown in the About panel on the intro page. A company_settings.about_text,
    // if one is ever added, would take priority over this.
    const ABOUT_TEXT = [
      'At Thomson Energy, we specialise in off-grid and commercial solar solutions built to last and tailored to each site. Based in the Northern Rivers and working Australia-wide, we design and install solar, battery and electrical systems for remote properties, farms, businesses and independent households, and we also take on commercial electrical work.',
      'We are electricians first: experienced, licensed and committed to doing things properly. You get honest communication, quality workmanship and support well beyond the install. No sales pressure, just smart advice, reliable power and a team you can count on.',
    ];

    // Trading entity shown with the ABN and licence numbers on the cover and
    // the investment summary page.
    const LEGAL_NAME = 'Thomson Energy Australia Pty. Ltd.';

    // The logo for the black pages: its own full colours with no background box. A logo that
    // already has a see-through background (a PNG) keeps it. One on a plain white
    // background (a JPG) has the white taken out: each pixel keeps its colour and becomes more see-through
    // the closer it is to white. Returns a PNG data URL, the original address, or null if the image
    // can't be read (then the caller falls back to the plain logo).
    // The logo's darkest colour (the navy of "ENERGY") nearly disappears on a black page. Rather than put
    // an outline or a box around the logo, its dark colours are brightened a little (same hues, no
    // outline, no background) so it stays readable straight on black.
    function brightenForBlack(c) {
      const ctx = c.getContext('2d');
      const px = ctx.getImageData(0, 0, c.width, c.height);
      const d = px.data;
      for (let i = 0; i < d.length; i += 4) {
        if (d[i + 3] === 0) continue;
        const luma = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        if (luma >= 110) continue;
        const f = Math.min(2, 110 / Math.max(luma, 40));
        d[i] = Math.min(255, Math.round(d[i] * f));
        d[i + 1] = Math.min(255, Math.round(d[i + 1] * f));
        d[i + 2] = Math.min(255, Math.round(d[i + 2] * f));
      }
      ctx.putImageData(px, 0, 0);
      return c.toDataURL('image/png');
    }

    function makeLightLogo(url) {
      return new Promise((resolve) => {
        if (!url) return resolve(null);
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => {
          try {
            const scale = Math.min(1, 900 / img.naturalWidth);
            const c = document.createElement('canvas');
            c.width = Math.max(1, Math.round(img.naturalWidth * scale));
            c.height = Math.max(1, Math.round(img.naturalHeight * scale));
            const ctx = c.getContext('2d');
            ctx.drawImage(img, 0, 0, c.width, c.height);
            const px = ctx.getImageData(0, 0, c.width, c.height);
            const d = px.data;
            let hasAlpha = false;
            for (let i = 3; i < d.length; i += 4) { if (d[i] < 250) { hasAlpha = true; break; } }
            if (hasAlpha) return resolve(brightenForBlack(c));
            for (let i = 0; i < d.length; i += 4) {
              const ink = 255 - Math.min(d[i], d[i + 1], d[i + 2]);
              const a = Math.max(0, Math.min(1, (ink - 10) * 1.5 / 255));
              if (a > 0) {
                // undo the white the colour was mixed with
                d[i] = Math.max(0, Math.min(255, Math.round(255 - (255 - d[i]) / a)));
                d[i + 1] = Math.max(0, Math.min(255, Math.round(255 - (255 - d[i + 1]) / a)));
                d[i + 2] = Math.max(0, Math.min(255, Math.round(255 - (255 - d[i + 2]) / a)));
              }
              d[i + 3] = Math.round(a * 255);
            }
            ctx.putImageData(px, 0, 0);
            resolve(brightenForBlack(c));
          } catch (e) { resolve(null); }
        };
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    // The cover page background (the black shed with the panels on it).
    const COVER_PHOTO = '/img/showcase/shed-solar.jpg';

    const SHOWCASE_PHOTOS = [
      '/img/showcase/campus-solar.jpg',
      '/img/showcase/school-roof.jpg',
      '/img/showcase/mobile-solar.jpg',
      '/img/showcase/battery.jpg',
      '/img/showcase/led-lighting.jpg',
      '/img/showcase/shed-ridge.jpg',
    ];

    // Labour shows as hours worked; everything else (materials, and a
    // collapsed prebuild's own instance count - see get_quote_by_token)
    // shows as a plain multiplier. item_type is only present for an
    // ungrouped line - a prebuild group has no single item_type of its own.
    function fmtQty(qty, item_type) {
      const n = Math.round((Number(qty) || 0) * 100) / 100;
      return item_type === 'labour' ? `${n} hrs` : `&times;${n}`;
    }

    // Same quote always gets the same photos (seeded by its token), but
    // different quotes get a different mix.
    function seededShuffle(list, seed) {
      let h = 2166136261;
      for (const ch of String(seed || 'x')) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
      const out = list.slice();
      for (let i = out.length - 1; i > 0; i--) {
        h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0;
        const j = h % (i + 1);
        [out[i], out[j]] = [out[j], out[i]];
      }
      return out;
    }

    // The scope of works is free text: a title line, a lead paragraph, then
    // short heading lines each followed by their paragraph. Pull that apart
    // so it can be laid out as ruled rows; anything unstructured still
    // comes out as plain paragraphs.
    // lightning bolt used as the bullet on the scope of works rows
    const BOLT_SVG = '<svg viewBox="0 0 24 32" aria-hidden="true"><path d="M14.5 0 2 18h8l-3 14L22 12h-8.5z"/></svg>';

    function parseScope(text) {
      const blocks = [];
      let cur = [];
      String(text || '').replace(/\r/g, '').split('\n').forEach((l) => {
        if (!l.trim()) { if (cur.length) blocks.push(cur); cur = []; } else cur.push(l.trim());
      });
      if (cur.length) blocks.push(cur);
      if (blocks.length && blocks[0].length === 1 && /^scope of works?\b/i.test(blocks[0][0])) blocks.shift();

      const isHeading = (line) => line.length <= 70 && !/[.!?]$/.test(line) && !/^[-*•]/.test(line);
      const intro = [];
      const rows = [];
      blocks.forEach((b) => {
        if (b.length > 1 && isHeading(b[0])) {
          rows.push({ h: b[0], body: b.slice(1) });
        } else if (b.length === 1 && isHeading(b[0]) && b[0].split(' ').length <= 8) {
          rows.push({ h: b[0], body: [] });
        } else if (rows.length) {
          rows[rows.length - 1].body.push(...b);
        } else {
          intro.push(b.join(' '));
        }
      });
      return { intro, rows };
    }

    function bodyHtml(lines) {
      const out = [];
      let list = [];
      const flush = () => { if (list.length) { out.push(`<ul>${list.map(i => `<li>${escapeHtml(i)}</li>`).join('')}</ul>`); list = []; } };
      lines.forEach((l) => {
        if (/^[-*•]\s+/.test(l)) list.push(l.replace(/^[-*•]\s+/, ''));
        else { flush(); out.push(`<p>${escapeHtml(l)}</p>`); }
      });
      flush();
      return out.join('');
    }

    function termsHtml(text) {
      const out = [];
      String(text || '').replace(/\r/g, '').split('\n').forEach((l) => {
        const t = l.trim();
        if (!t) return;
        if (/^\d+(\.\d+)*\.?\s+\S/.test(t) && t.length <= 90 && !/[.;,]$/.test(t.replace(/^\d+(\.\d+)*\.?\s+/, ''))) out.push(`<h4>${escapeHtml(t)}</h4>`);
        else out.push(`<p>${escapeHtml(t)}</p>`);
      });
      return out.join('');
    }

    // Blue diagonal slabs, drawn the same way on screen and in the PDF.
    // kind: 'cover' (three big slabs), 'dark' / 'light' (two small ones).
    let slabSeq = 0;
    function slabsSvg(kind) {
      const n = ++slabSeq;
      const g = (id, stops) => `<linearGradient id="${id}${n}" x1="0" y1="0" x2="1" y2="0">${stops.map(([o, c]) => `<stop offset="${o}" stop-color="${c}"/>`).join('')}</linearGradient>`;
      if (kind === 'cover') {
        return `<svg class="slabs" viewBox="0 0 1414 2000" preserveAspectRatio="none" aria-hidden="true"><defs>
          ${g('a', [[0, '#1a6be6'], [0.5, '#46577a'], [1, '#15181d']])}
          ${g('b', [[0, '#3d69b3'], [0.28, '#12151a'], [0.62, '#46557a'], [1, '#1a6be6']])}
          ${g('c', [[0, '#3f4f70'], [1, '#1a6be6']])}
        </defs>
          <polygon points="704,1146 1414,615 1414,975 704,1500" fill="url(#a${n})"/>
          <polygon points="130,2000 1414,1037 1414,1395 600,2000" fill="url(#b${n})"/>
          <polygon points="1355,1503 1355,1858 1165,2000 690,2000" fill="url(#c${n})"/>
        </svg>`;
      }
      const dark = kind === 'dark';
      const top = dark ? [[0, '#1a6be6'], [0.6, '#46577a'], [1, '#15181d']] : [[0, '#1a6be6'], [0.55, '#8fb6f0'], [1, '#ffffff']];
      const low = dark ? [[0, '#4a5b80'], [1, '#1a6be6']] : [[0, '#ffffff'], [1, '#1a6be6']];
      return `<svg class="slabs corner" viewBox="860 1290 554 710" preserveAspectRatio="xMaxYMax meet" aria-hidden="true"><defs>
          ${g('d', top)}${g('e', low)}${g('f', [[0, '#1a6be6'], [1, '#2a74e8']])}
        </defs>
          <polygon points="930,1655 1414,1290 1414,1540 930,1896" fill="url(#f${n})" opacity="${dark ? 1 : 0.9}"/>
          <polygon points="1366,1622 1366,1862 1190,2000 860,2000" fill="url(#e${n})"/>
          <polygon points="1140,2000 1414,1790 1414,2000" fill="url(#d${n})" opacity="0.55"/>
        </svg>`;
    }

    // Signing a variation. Handlers are delegated from the document (not attached to the
    // canvas / buttons directly) because the page can move blocks onto new A4 sheets after
    // it has drawn them.
    let sigDrawing = false, sigHasInk = false;
    const sigPoint = (canvas, e) => {
      const rect = canvas.getBoundingClientRect();
      return { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height) };
    };
    document.addEventListener('pointerdown', (e) => {
      const c = e.target.closest ? e.target.closest('#vs-canvas') : null;
      if (!c) return;
      const ctx = c.getContext('2d');
      ctx.strokeStyle = '#0a0a0a'; ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      sigDrawing = true; sigHasInk = true;
      const p = sigPoint(c, e); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 0.1, p.y + 0.1); ctx.stroke();
      try { c.setPointerCapture(e.pointerId); } catch (err) { /* not essential */ }
    });
    document.addEventListener('pointermove', (e) => {
      if (!sigDrawing) return;
      const c = document.getElementById('vs-canvas'); if (!c) return;
      const ctx = c.getContext('2d'); const p = sigPoint(c, e); ctx.lineTo(p.x, p.y); ctx.stroke();
    });
    const sigStop = () => { sigDrawing = false; };
    document.addEventListener('pointerup', sigStop);
    document.addEventListener('pointercancel', sigStop);
    document.addEventListener('click', async (e) => {
      const t = e.target.closest ? e.target.closest('#vs-jump, #vs-jump-bar, #vs-clear, #vs-sign, #vs-decline-open, #vs-decline') : null;
      if (!t) return;
      if (t.id === 'vs-decline-open') { document.getElementById('vs-decline-form').style.display = 'block'; t.style.display = 'none'; return; }
      if (t.id === 'vs-decline') {
        const declineLabel = t.textContent;
        t.disabled = true; t.textContent = 'Declining...';
        try {
          const res = await fetch('/.netlify/functions/decline-by-client', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ quoteToken: variationToken ? undefined : token, variationToken: variationToken || undefined, reason: document.getElementById('vs-decline-reason').value }),
          });
          const d = await res.json();
          if (!res.ok || !d.ok) throw new Error(d.error || 'Could not decline this');
          window.location.reload();
        } catch (err) {
          document.getElementById('vs-msg').innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`;
          t.disabled = false; t.textContent = declineLabel;
        }
        return;
      }
      if (t.id === 'vs-jump' || t.id === 'vs-jump-bar') { const s = document.getElementById('var-sign-section'); if (s) s.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
      const canvas = document.getElementById('vs-canvas');
      if (t.id === 'vs-clear') { canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height); sigHasInk = false; return; }
      const msg = document.getElementById('vs-msg');
      const name = document.getElementById('vs-name').value.trim();
      if (!name) { msg.innerHTML = `<div class="error-box">Please type your full name.</div>`; return; }
      if (!sigHasInk) { msg.innerHTML = `<div class="error-box">Please draw your signature.</div>`; return; }
      const label = t.textContent;
      t.disabled = true; t.textContent = 'Approving...';
      try {
        const res = await fetch(variationToken ? '/.netlify/functions/accept-variation' : '/.netlify/functions/accept-quote', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: variationToken || token, name, signature: canvas.toDataURL('image/png') }),
        });
        const d = await res.json();
        if (!res.ok || !d.ok) throw new Error(d.error || 'Could not approve this');
        // A deposit is due on accepting a quote - straight to the invoice / pay page.
        if (!variationToken && d.invoiceToken) { window.location.href = `/invoice.html?token=${d.invoiceToken}`; return; }
        window.location.reload();
      } catch (err) {
        msg.innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`;
        t.disabled = false; t.textContent = label;
      }
    });

    async function load() {
      const [{ data: rpcData, error: rpcError }, { data: settings }] = await Promise.all([
        variationToken
          ? supabaseClient.rpc('get_variation_by_token', { p_token: variationToken })

        supabaseClient.from('company_settings').select('*').eq('id', 1).single(),
      ]);
      const content = document.getElementById('content');
      const vInfo = variationToken && rpcData ? rpcData : null; // { variation, quote, other_variations }
      const data = variationToken ? (rpcData ? rpcData.quote : null) : rpcData;
      const error = rpcError;
      if (error || !data) {
        content.innerHTML = `<div class="error-box" style="margin:24px;">This ${variationToken ? 'variation' : 'quote'} link isn't valid. Please check the link or contact us.</div>`;

      }

      const s = settings || {};
      s.logo_url = await smallLogoUrl(s.logo_url);

      } else if (s.company_name) {
        document.getElementById('brand-mark').textContent = s.company_name;
      }

      const project = data.project;
      const template = project.proposal_template || 'new_build';
      const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
      const varLinesTotal = (lines) => r2((lines || []).reduce((s, l) => s + (Number(l.amount) || 0), 0));
      // A variation shown as a stage row: its priced lines, the reason as its description.
      const varAsCentre = (v) => ({
        name: `Variation ${v.number || ''}: ${v.description}`.replace(/\s+:/, ':'), description: v.reason || '',
        quoted_amount: varLinesTotal(v.lines), stc_total: 0, is_variation: true, photo_groups: [],
        line_items: (v.lines || []).map(l => ({ description: l.description, amount: Number(l.amount) || 0, quantity: 1, item_type: l.item_type })),
      });
      const storedCentres = data.cost_centres.sort((a, b) => a.sort_order - b.sort_order);
      const thisVariation = vInfo ? vInfo.variation : null;
      if (vInfo) document.title = `Variation ${thisVariation.number || ''}`.trim();
      // On the variation page the original quote is shown as the client accepted it, then the
      // variations they have already approved, then this one.
      const centres = vInfo
        ? storedCentres.filter(c => !c.is_variation)
            .concat((vInfo.other_variations || []).map(varAsCentre))
            .concat([varAsCentre(thisVariation)])
        : storedCentres;
      const baseCentres = centres.filter(c => !c.is_variation); // what the original quote's deposit and payment schedule are worked out on
      const baseTotal = baseCentres.reduce((sum, c) => sum + Number(c.quoted_amount), 0);
      const total = centres.reduce((sum, c) => sum + Number(c.quoted_amount), 0);
      // stc_total is ex GST; a company client's credit carries GST on top,
      // the same as the invoice and Xero (stc_credit_inc_gst, migration 153).
      const isCompanyClient = data.client_type === 'company';
      const stcExGst = centres.reduce((sum, c) => sum + Number(c.stc_total || 0), 0);
      const stcTotal = isCompanyClient ? Math.round(stcExGst * 1.1 * 100) / 100 : stcExGst;
      const gstAmount = Math.round(total * 0.10 * 100) / 100;
      const totalIncGst = total + gstAmount;
      const totalAfterStc = totalIncGst - stcTotal;
      // On the variation page "accepted" means this variation is signed, not the original quote.
      const isAccepted = vInfo ? thisVariation.approval_status === 'approved' : ['accepted', 'approved', 'in_progress', 'complete'].includes(project.status);
      const isDeclined = !vInfo && project.status === 'declined';
      // a stored signature is only drawn when it is a plain PNG data URL
      const safeSig = (u) => (typeof u === 'string' && /^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(u)) ? u : '';
      // valid until (YYYY-MM-DD, migration 20261030000000), shown while it is still open
      const validText = (d) => d ? new Date(d + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
      const validLine = (d, noun) => d ? `<p class="note-line" style="margin:10px 0 0;"><strong>This ${noun} is valid until ${esc(validText(d))}.</strong></p>` : '';
      const ownPhotos = (project.cover_photos || []).map(p => p.url || p).filter(Boolean);
      const referencePhotos = (project.reference_photos || []).map(p => p.url || p);
      const depositPercent = Number(project.deposit_percent) || 0;
      const depositAmount = baseTotal * (depositPercent / 100);
      const esc = escapeHtml;

      const docLabel = vInfo ? 'Variation' : ({ quick_estimate: 'Estimate', service_work: 'Service quote' }[template] || 'Proposal');
      const qNum = project.quote_number ? `Q${project.quote_number}` : '';
      const jobNo = vInfo ? thisVariation.job_number : project.job_number; // the quote row has none once it became a job
      const jNum = jobNo ? `J${jobNo}` : '';
      const coverSub = vInfo
        ? [`${thisVariation.number ? 'No. ' + thisVariation.number + ' ' : ''}to ${qNum ? 'Quote ' + qNum : 'your quote'}`, jNum].filter(Boolean).join(' \u00b7 ')
        : qNum;
      // A variation is dated when it was sent (today while it is still a draft), not the original quote.
      const docDate = new Date((vInfo ? thisVariation.sent_at : project.sent_at) || (vInfo ? Date.now() : project.created_at) || Date.now())
        .toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });

      // Photo mix for this quote: the job's own photos first, then showcase.
      const showcaseMix = seededShuffle(SHOWCASE_PHOTOS, token);
      // The intro page photo is always a showcase one (the job's own photos already feature elsewhere).
      const introPhoto = supaImageVariant(showcaseMix[0], 1300, 72);
      const scopePool = ownPhotos.concat(showcaseMix.slice(1));
      const photo = (i, w) => supaImageVariant(scopePool[i % scopePool.length], w || 1100, 72);

      const lightLogo = await makeLightLogo(s.logo_url);
      const logoHtml = s.logo_url
        ?`<span class="logo-pill"><img src="${s.logo_url}" alt="${esc(s.company_name || '')}" /></span>`
        : `<span class="pg-brand-name">${esc(s.company_name || '')}</span>`;
      // company details for the top of every page except the title page
      const QUOTE_EMAIL = 'sales@thomsonenergy.com.au';
      const licenceText = (s.licenses || '').split('|').map(x => x.trim()).filter(Boolean).join(' | ');
      const contactHtml = `<div class="pg-contact">
        <a href="mailto:${QUOTE_EMAIL}">${QUOTE_EMAIL}</a><br>
        ${s.phone ? `Tel. <a href="tel:${esc(String(s.phone).replace(/[^+\d]/g, ''))}">${esc(s.phone)}</a><br>` : ''}
        ${s.address ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.address)}">${esc(s.address)}</a><br>` : ''}
        ${s.abn ? `ABN ${esc(s.abn)}<br>` : ''}
        ${licenceText ? `${esc(licenceText)}<br>` : ''}
        <span class="pg-date">${esc(docDate)}</span></div>`;
      const siteLink = s.website ? (/^https?:/i.test(s.website) ? s.website : 'https://' + s.website) : '';
      const lightLogoImg = s.logo_url
        ? `<img class="pg-logo" src="${s.logo_url}" alt="${esc(s.company_name || '')}" />`
        : `<span class="pg-brand-name">${esc(s.company_name || '')}</span>`;
      const headHtml = `<div class="pg-head"><div>${siteLink ? `<a href="${esc(siteLink)}">${lightLogoImg}</a>` : lightLogoImg}</div>${contactHtml}</div>`;
      // On the black pages (cover, investment header) the logo is drawn in its own
      // colours straight on the page, with no white box behind it.
      const darkLogoHtml = (cls) => lightLogo
        ? `<img class="logo-light ${cls}" src="${lightLogo}" alt="${esc(s.company_name || '')}" />`
        : `<span class="logo-pill ${cls}"><img src="${s.logo_url}" alt="" /></span>`;
      // the same header on the black investment block: logo in its own colours, details in white
      const darkContactHeadHtml = () => `<div class="pg-head"><div>${s.logo_url ? darkLogoHtml('logo-invest') : `<span class="pg-brand-name">${esc(s.company_name || '')}</span>`}</div>${contactHtml}</div>`;
      const darkHeadHtml = (cls) => `<div class="pg-head"><div>${s.logo_url ? darkLogoHtml(cls) : `<span class="pg-brand-name">${esc(s.company_name || '')}</span>`}</div><div class="pg-date">${esc(docDate)}</div></div>`;

      const detailLines = [s.abn ? `ABN ${s.abn}` : '', s.address, s.phone, s.website].filter(Boolean);
      // the contact details on the intro page are links (they stay clickable in the PDF)
      const detailLinesHtml = [
        s.abn ? esc(`ABN ${s.abn}`) : '',
        s.address ? `<a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.address)}">${esc(s.address)}</a>` : '',
        s.phone ? `<a href="tel:${esc(String(s.phone).replace(/[^+\d]/g, ''))}">${esc(s.phone)}</a>` : '',
        s.website ? `<a href="${esc(/^https?:/i.test(s.website) ? s.website : 'https://' + s.website)}">${esc(s.website)}</a>` : '',
      ].filter(Boolean).join('<br>');
      const licenseParts = (s.licenses || '').trim();
      // Company block shown on the cover (with who prepared it) and again in the
      // investment summary header: legal name, ABN, address and licence numbers.
      const companyLines = [LEGAL_NAME, s.abn ? `ABN ${s.abn}` : '', s.address, licenseParts].filter(Boolean);
      const preparedBy = data.prepared_by ? String(data.prepared_by).trim() : '';

      // 1. Cover
      const coverHtml = `
        <section class="pg dark cover fixed">
          <img class="cover-photo" src="${COVER_PHOTO}" alt="" />
          <div class="cover-scrim"></div>
          ${slabsSvg('cover')}
          ${darkHeadHtml('logo-cover')}
          <div class="pg-body">
            <h1 class="pg-title">${esc(docLabel)}${coverSub ? `<br><span style="font-size:0.42em; letter-spacing:0; opacity:0.9;">${esc(coverSub)}</span>` : ''}</h1>
            <div class="cover-tag">${esc(project.name)}<small>Prepared for ${esc(project.client_name)}${(project.client_office_address || project.client_address) ? ' &middot; ' + esc(project.client_office_address || project.client_address) : ''}</small></div>
          </div>
          <div class="cover-meta">
            <div class="lbl">Prepared by:</div>
            ${preparedBy ? `<b>${esc(preparedBy)}</b>` : ''}
            <div class="co">${companyLines.map(esc).join('<br>')}</div>
          </div>
        </section>`;

      // 2. Introduction: who it is for, what the system is, who we are.
      const pylonSummary = pylonSystemSummary(project.pylon_data);
      // What the page says about the project: the quote's own summary line, otherwise the opening
      // paragraph of its scope of works, so the page is never just facts and a gap.
      const introText = project.proposal_subtitle || (parseScope(project.sow_text).intro || [])[0] || '';
      const introHtml = `
        <section class="pg fixed intro">
          ${headHtml}
          <div class="pg-body">
            <h1 class="pg-title">The<br>project</h1>
            <div class="intro-facts">
              <div><div class="k">Prepared for</div><div class="v">${esc(project.client_name)}</div></div>
              <div><div class="k">Site</div><div class="v">${project.client_address ? mapsLink(project.client_address) : '&nbsp;'}</div></div>
              <div><div class="k">Job</div><div class="v">${esc(project.name)}</div></div>
              <div><div class="k">${qNum ? 'Quote number' : 'Date'}</div><div class="v">${esc(qNum || docDate)}</div></div>
            </div>
            ${introText ? `<p class="pg-lead">${esc(introText)}</p>` : ''}
            ${pylonSummary ? `<p class="pg-lead">${esc(pylonSummary)}</p>` : ''}
          </div>
          <div class="band-photo"><img src="${introPhoto}" alt="" /></div>
          <div class="band-panel">
            ${slabsSvg('dark')}
            <div class="txt">
              <h3>About ${esc(s.company_name || 'us')}</h3>
              ${(s.about_text ? String(s.about_text).split(/\n\s*\n/) : ABOUT_TEXT).map(t => `<p>${esc(t)}</p>`).join('')}
            </div>

      // 3. Scope of works
      const scope = parseScope(project.sow_text);
      const scopeRowsHtml = scope.rows.map(r => `
        <div class="row-x"><span class="x">${BOLT_SVG}</span><div><div class="h">${esc(r.h)}</div>${r.body.length ? `<div class="b">${bodyHtml(r.body)}</div>` : ''}</div></div>`).join('');
      const designHtml = (template === 'solar' && project.pylon_link) ? `
        <div class="design-box">
          <div class="sec-title" style="margin:0 0 8px;">System design</div>
          <p>${pylonSummary ? esc(pylonSummary) : 'See the full interactive design, panel layout, and return-on-investment calculation online.'}</p>
          <a class="q-btn" href="${project.pylon_link}" target="_blank" rel="noopener">View interactive design &amp; ROI &rarr;</a>
        </div>` : '';
      const scopeHtml = (project.sow_text || designHtml) ? `

        : `
          <tr><td>Deposit (${depositPercent}%), due on acceptance</td><td class="num">${money(depositAmount * 1.1)}</td></tr>
          ${baseCentres.map(c => `<tr><td>${esc(c.name)}, due on completion</td><td class="num">${money(c.quoted_amount * 1.1 * (1 - depositPercent / 100))}</td></tr>`).join('')}
        `;
      // Approved variations are invoiced on their own, once that work is done.
      const variationScheduleRows = centres.filter(c => c.is_variation).map(c => `<tr><td>${esc(c.name)}, invoiced when the work is done</td><td class="num">${money(c.quoted_amount * 1.1)}</td></tr>`).join('');
      const paymentScheduleHtml = (template === 'quick_estimate' || template === 'time_and_materials') ? '' : `
        <div class="sec-title">Payment schedule</div>
        <table class="qtable">
          <thead><tr><th>Milestone</th><th class="num">Amount (inc GST)</th></tr></thead>
          <tbody>${milestoneRowsHtml}${variationScheduleRows}</tbody>
        </table>
        <p class="note-line">For projects that span multiple months, we reserve the right to invoice each milestone in part at the end of the month, based on the percentage of that stage completed at the time, rather than waiting until it is fully finished.</p>`;

      const stageRowsHtml = centres.map((c, i) => {
        const hasItems = (c.line_items || []).length > 0;

        : `

        <section class="pg">

      // The variation itself, on a page of its own: what is changing and why, what it costs,
      // what the contract comes to with it, and where to sign.
      let variationPageHtml = '';
      if (vInfo) {
        const v = thisVariation;
        const vTotal = varLinesTotal(v.lines);
        const vGst = r2(vTotal * 0.10);
        const prevVars = (vInfo.other_variations || []).reduce((s, o) => s + varLinesTotal(o.lines), 0);
        const dateText = (d) => new Date(d).toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' });
        const inputStyle = 'width:100%; padding:10px 12px; border:1px solid #c9ced8; border-radius:6px; background:#fff; color:#0a0a0a; font-size:14px;';
        const origDate = project.approved_at ? dateText(project.approved_at) : '';
        const origLink = project.quote_token ? `${shareOrigin()}/quote.html?token=${encodeURIComponent(project.quote_token)}` : '';
        const METHOD_TEXT = { email: 'by email', phone: 'by phone', in_person: 'in person' };
        const signHtml = v.approval_status === 'approved' ? `
          <div class="accepted-box">${v.approval_method && v.approval_method !== 'online'

          ${safeSig(v.signature_data_url) ? `<div><img src="${safeSig(v.signature_data_url)}" alt="Signature" style="max-width:280px; max-height:90px; margin-top:10px; border-bottom:1px solid #0a0a0a;" /></div>` : ''}`
          : (v.approval_status === 'declined' ? `<div class="accepted-box" style="background:#fdf2f2; border-color:#f5c2c0; color:#7a271a;">${v.expired
            ? `This variation expired${v.valid_until ? ' on ' + esc(validText(v.valid_until)) : ''}. Please contact us if you would like to go ahead.`
            : `This variation was declined${v.declined_at ? ' on ' + esc(dateText(v.declined_at)) : ''}. If you would like to go ahead after all, please contact us.`}</div>` : (v.approval_status !== 'sent' ? '' : `
          <div class="sign-form" id="var-sign-section">
            <div class="sec-title">Approve this variation</div>
            ${validLine(v.valid_until, 'variation')}
            <p class="note-line" style="margin-bottom:12px;">By signing you approve this variation at the price above. It is then added to your original quote and invoiced when the work is done.</p>
            <label style="display:block; font-size:12px; color:var(--q-grey); margin-bottom:4px;">Your full name</label>
            <input id="vs-name" placeholder="Full name" autocomplete="name" style="${inputStyle}" />
            <label style="display:block; font-size:12px; color:var(--q-grey); margin:12px 0 4px;">Signature (draw with your finger or mouse)</label>
            <canvas id="vs-canvas" width="620" height="170" style="border:1px solid #c9ced8; border-radius:6px; background:#fff; touch-action:none; width:100%; max-width:620px; height:170px; display:block;"></canvas>
            <div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap;">
              <button type="button" id="vs-sign" class="q-btn" style="border:0; cursor:pointer;">Sign and approve variation</button>
              <button type="button" id="vs-clear" style="background:#fff; color:#0a0a0a; border:1px solid #c9ced8; padding:10px 16px; font-weight:600; font-size:13px; cursor:pointer;">Clear signature</button>
            </div>
            <div id="vs-msg" style="margin-top:10px;"></div>
            <div class="decline-box" style="margin-top:18px; padding-top:14px; border-top:1px solid #e3e6ec;">
              <button type="button" id="vs-decline-open" style="background:none; border:0; padding:0; color:var(--q-grey); font-size:13px; text-decoration:underline; cursor:pointer;">Not going ahead? Decline this variation</button>

                <button type="button" id="vs-decline" style="margin-top:8px; background:#fff; color:#b42318; border:1px solid #b42318; padding:10px 16px; font-weight:600; font-size:13px; cursor:pointer;">Decline variation</button>

        variationPageHtml = `
        <section class="pg" id="variation-page">

            <div class="sec-title" style="margin-top:0;">What is changing</div>
            <p class="pg-lead">${esc(v.description)}</p>
            ${v.reason ? `<div class="sec-title">Reason for the variation</div><p class="pg-lead" style="white-space:pre-wrap;">${esc(v.reason)}</p>` : ''}
            <div class="sec-title">Price of this variation</div>
            <table class="qtable">
              <thead><tr><th>Item</th><th class="num">Price (ex GST)</th></tr></thead>
              <tbody>${(v.lines || []).map(l => `<tr><td>${esc(l.description)}</td><td class="num">${money(l.amount)}</td></tr>`).join('')}</tbody>
            </table>
            <div class="totals">
              <div class="l">This variation (ex GST): ${money(vTotal)}</div>
              <div class="l">GST (10%): ${money(vGst)}</div>
              <div class="big">This variation inc GST: ${money(vTotal + vGst)}</div>
            </div>
            <div class="sec-title">Your contract with this variation</div>
            <table class="qtable">
              <tbody>
                <tr><td>Original quote ${qNum ? esc(qNum) : ''} (inc GST)</td><td class="num">${money(baseTotal * 1.1)}</td></tr>
                ${prevVars > 0 ? `<tr><td>Variations already approved (inc GST)</td><td class="num">${money(prevVars * 1.1)}</td></tr>` : ''}
                <tr><td>This variation (inc GST)</td><td class="num">${money(vTotal + vGst)}</td></tr>

            ${signHtml}

        </section>`;
      }

      // A variation is its own document: the cover, then the variation. It points back to the
      // original quote rather than repeating it.
      content.innerHTML = vInfo
        ? coverHtml + variationPageHtml
        : coverHtml + introHtml + scopeHtml + investHtml + photosPageHtml + ratesPageHtml + termsPageHtml;

      content.querySelectorAll('.stage-summary-row').forEach(row => {
        row.addEventListener('click', () => {
          const detailRow = content.querySelector(`.stage-detail-row[data-idx="${row.dataset.idx}"]`);
          if (!detailRow) return;

      const topTotal = money(vInfo ? varLinesTotal(thisVariation.lines) * 1.1 : (stcTotal > 0 ? totalAfterStc : totalIncGst));
      document.getElementById('topbar-total').innerHTML = `
        <p class="subtitle" style="margin:0 0 2px; font-size:10px; text-transform:uppercase; letter-spacing:0.04em;">${vInfo ? 'This variation' : 'Total'}</p>
        <p style="margin:0; font-weight:700; font-size:16px;">${topTotal}</p>
      `;
      document.getElementById('topbar-accept').innerHTML = vInfo
        ? (isAccepted ? `<span class="badge accepted">Variation approved</span>` : thisVariation.approval_status === 'declined' ? `<span class="badge">${thisVariation.expired ? 'Expired' : 'Declined'}</span>` : (thisVariation.approval_status === 'sent' ? `<button type="button" id="vs-jump">Review &amp; sign</button>` : ''))
        : isDeclined ? `<span class="badge">${project.expired ? 'Expired' : 'Declined'}</span>` : isAccepted
          ? `<span class="badge accepted">${template === 'quick_estimate' ? 'Estimate accepted' : 'Quote accepted'}</span>`
          : `<button type="button" id="vs-jump">${template === 'quick_estimate' ? 'Approve estimate' : 'Approve quote'}</button>`;

      // Phone bottom bar: same logic as #topbar-accept, shown only while there is something to approve.
      const approveLabel = vInfo
        ? (!isAccepted && thisVariation.approval_status === 'sent' ? 'Review & sign' : '')
        : (!isDeclined && !isAccepted ? (template === 'quick_estimate' ? 'Approve estimate' : 'Approve quote') : '');
      const bar = document.getElementById('approve-bar');
      if (approveLabel) {
        bar.innerHTML = `<div class="ab-total"><span>${vInfo ? 'This variation' : 'Total'}</span><b>${topTotal}</b></div><button type="button" id="vs-jump-bar">${escapeHtml(approveLabel)}</button>`;
        document.body.classList.add('has-approve-bar');
      } else {
        bar.innerHTML = '';
        document.body.classList.remove('has-approve-bar');
      }
      // Hide the bar while the sign form is on screen so there are not two approve buttons at once.
      if (window.__approveIO) window.__approveIO.disconnect();
      const signSec = document.getElementById('var-sign-section');
      if (approveLabel && signSec && 'IntersectionObserver' in window) {
        window.__approveIO = new IntersectionObserver(([en]) => bar.classList.toggle('away', en.isIntersecting), { threshold: 0.15 });
        window.__approveIO.observe(signSec);
      }

      const acceptBtn = document.getElementById('accept-btn');
      if (acceptBtn) {
        acceptBtn.addEventListener('click', async () => {
          acceptBtn.disabled = true;
          acceptBtn.textContent = 'Approving...';
          try {
            const res = await fetch('/.netlify/functions/accept-quote', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token }),
            });
            const result = await res.json();
            if (!res.ok || !result.ok) throw new Error(result.error || 'Could not approve this quote');
            // A deposit is due on acceptance - straight to the invoice/pay
            // page rather than leaving them accepted with no way to pay
            // until a staff member gets to it.
            if (result.invoiceToken) {
              window.location.href = `/invoice.html?token=${result.invoiceToken}`;
              return;
            }
            load();
          } catch (err) {
            document.getElementById('accept-error').innerHTML = `<div class="error-box" style="margin-bottom:16px;">${err.message}</div>`;
            acceptBtn.disabled = false;

          }
        });
      }
    }

    // Makes every page of the proposal exactly one A4 sheet (794 x 1123 px at 96 dpi). A page whose
    // content runs past the bottom (a long scope, the terms) has its overflow moved onto a new sheet with
    // the same header, instead of spilling over the page edge or leaving a sliver on an extra sheet.
    const A4_HEIGHT = 1123, A4_BOTTOM_PAD = 72;
    function paginateToA4() {
      const content = document.getElementById('content');
      const spill = (pg) => { const body = pg.querySelector('.pg-body'); return body ? body.offsetTop + body.offsetHeight + A4_BOTTOM_PAD > A4_HEIGHT : false; };
      // takes the last block off the end of a page body (looking inside lists of rows / photos / terms);
      // returns { wrapper class, element } or null when only the title is left
      const takeLast = (body) => {
        const last = body.lastElementChild;
        if (!last || last.tagName === 'H1' || body.children.length < 2 && !/\b(rows|gallery|terms-cols|photo-row)\b/.test(last.className)) return null;
        if (/\b(rows|gallery|terms-cols)\b/.test(last.className) && last.children.length > 1) {
          return { wrap: last.className, wrapTag: last.tagName, el: last.lastElementChild };
        }
        if (/\b(rows|gallery|terms-cols)\b/.test(last.className) && last.children.length === 1) {
          const only = last.lastElementChild;
          return { wrap: last.className, wrapTag: last.tagName, el: only, removeWrap: last };
        }
        return { wrap: null, el: last };
      };
      [...content.querySelectorAll('.pg')].forEach((first) => {
        if (first.classList.contains('cover') || first.classList.contains('invest') || first.querySelector('.band-panel')) return;
        let cur = first;
        let guard = 0;
        while (spill(cur) && guard++ < 12) {
          const moved = [];
          const body = cur.querySelector('.pg-body');
          let more = true;
          while (spill(cur) && more) {
            const t = takeLast(body);
            if (!t) { more = false; break; }
            t.el.remove(); if (t.removeWrap) t.removeWrap.remove();
            moved.unshift(t);
            // a heading left stranded at the bottom goes with what follows it
            const nowLast = body.lastElementChild;
            if (nowLast && /\b(sec-title|sor-h)\b/.test(nowLast.className) && !spill(cur)) { moved.unshift({ wrap: null, el: nowLast }); nowLast.remove(); }
          }
          if (!moved.length) break;
          const cont = document.createElement('section');
          cont.className = 'pg fixed cont';
          const head = first.querySelector('.pg-head');
          const slabs = first.querySelector(':scope > .slabs');
          cont.innerHTML = (slabs ? slabs.outerHTML : '') + (head ? head.outerHTML : '') + '<div class="' + body.className + '"></div>';
          const nbody = cont.querySelector('.pg-body');
          let open = null;
          moved.forEach((m) => {
            if (m.wrap) {
              if (!open || open.className !== m.wrap) { open = document.createElement(m.wrapTag || 'div'); open.className = m.wrap; nbody.appendChild(open); }
              open.appendChild(m.el);
            } else { open = null; nbody.appendChild(m.el); }
          });
          cur.after(cont);
          cur.classList.add('fixed');
          cur = cont;
        }
      });
      content.querySelectorAll('.pg').forEach(p => p.classList.add('fixed'));
    }

    load().then(async () => {
      // Wait for every image actually in the DOM (the logo and photos) and
      // the web fonts to finish loading before signalling done - a fixed
      // setTimeout guessed at "probably rendered by now," which raced real
      // loads on a slow connection. generate-client-document-pdf.js
      // (headless Chromium) polls for data-print-ready instead of guessing
      // a delay of its own; ?print=1 keeps triggering the browser's own
      // print dialog for a person following the existing "Download PDF" link.
      const images = [...document.querySelectorAll('img')];
      await Promise.all(images.map((img) => img.complete ? Promise.resolve() : new Promise((res) => { img.onload = img.onerror = res; })));
      try { await Promise.race([document.fonts.ready, new Promise((res) => setTimeout(res, 4000))]); } catch (e) { /* fonts are cosmetic */ }
      // sheets are only cut to A4 at a sheet-sized width (the PDF, or a desktop screen); a phone keeps its flowing layout
      if (new URLSearchParams(window.location.search).get('print') === '1' || window.innerWidth >= 860) { try { paginateToA4(); } catch (e) { console.error('A4 pagination failed:', e); } }
      document.body.dataset.printReady = 'true';
      if (new URLSearchParams(window.location.search).get('print') === '1') {
        window.print();
      }
    });
  </script>
</body>
</html>
