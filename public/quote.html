<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Your proposal</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=9" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @media print {
    .topbar, #accept-section { display: none; }
    body { background: white; color: black; }
    .card { border: 1px solid #ccc; background: white; page-break-inside: avoid; }

    /* The cover is an intentional dark branded photo banner - force it
       to actually print with its real colors, rather than being
       flattened to black-on-white like the rest of the page. Without
       this, the dark background gets stripped (browsers default to not
       printing background colors/images to save ink) but the light
       text colors don't, leaving white text invisible against
       unprinted white space - what looked like faint "ghost" text. */
    .cover-banner, .cover-scrim, .cover-photo-grid img, .cover-details, .cover-logo-badge {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }
    .cover-banner {
      background: #1a1f27 !important;
      color: #fff !important;
      page-break-inside: avoid;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .cover-title, .cover-eyebrow { color: #fff !important; }
    .cover-subtitle, .cover-tagline { color: #cfd6e2 !important; }
    .cover-details { background: rgba(0,0,0,0.35) !important; color: #cfd6e2 !important; }
  }
  .cover-banner {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    min-height: 380px;
    background: #1a1f27;
    color: #fff;
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .cover-photo-grid {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    z-index: 0;
  }
  .cover-photo-grid img { width: 100%; height: 100%; object-fit: cover; }
  .cover-scrim {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(10,12,16,0.82) 0%, rgba(10,12,16,0.55) 45%, rgba(10,12,16,0.2) 100%);
    z-index: 1;
  }
  .cover-content { position: relative; z-index: 2; padding: 36px 36px 28px; }
  .cover-logo-badge { display: inline-block; background: #fff; border-radius: 8px; padding: 8px 14px; margin-bottom: 12px; }
  .cover-logo { max-height: 40px; max-width: 200px; display: block; }
  .cover-tagline { font-size: 12px; letter-spacing: 0.12em; color: #cfd6e2; text-transform: uppercase; margin: 0 0 40px; }
  .cover-eyebrow { font-size: 13px; letter-spacing: 0.14em; color: var(--accent); text-transform: uppercase; margin: 0 0 8px; }
  .cover-title { font-size: 32px; font-weight: 700; margin: 0 0 6px; max-width: 520px; text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
  .cover-subtitle { font-size: 15px; color: #cfd6e2; margin: 0; text-shadow: 0 1px 8px rgba(0,0,0,0.6); }
  .cover-details {
    position: relative; z-index: 2;
    padding: 16px 36px; background: rgba(0,0,0,0.35);
    font-size: 12px; color: #cfd6e2; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px;
  }
</style>
</head>
<body>
  <div class="topbar">
    <span id="brand-mark" class="brand">PROPOSAL</span>
    <div class="topbar-right">
      <div id="topbar-total" style="text-align:right;"></div>
      <div id="topbar-accept"></div>
      <button class="secondary" onclick="window.print()">Print / Save as PDF</button>
    </div>
  </div>

  <div class="wrap" style="max-width:800px;">
    <div id="accept-error"></div>
    <div id="content"><p class="subtitle">Loading your proposal...</p></div>
  </div>

  <script src="/js/supabase-client.js?v=2"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');

    async function load() {
      const [{ data, error }, { data: settings }] = await Promise.all([
        supabaseClient.rpc('get_quote_by_token', { p_token: token }),
        supabaseClient.from('company_settings').select('*').eq('id', 1).single(),
      ]);
      const content = document.getElementById('content');
      if (error || !data) {
        content.innerHTML = `<div class="error-box">This quote link isn't valid. Please check the link or contact us.</div>`;
        return;
      }

      const s = settings || {};
      if (s.logo_url) {
        document.getElementById('brand-mark').innerHTML = `<img src="${s.logo_url}" style="max-height:28px;" />`;
      } else if (s.company_name) {
        document.getElementById('brand-mark').textContent = s.company_name;
      }

      const project = data.project;
      const template = project.proposal_template || 'new_build';
      const centres = data.cost_centres.sort((a, b) => a.sort_order - b.sort_order);
      const total = centres.reduce((sum, c) => sum + Number(c.quoted_amount), 0);
      const isAccepted = project.status === 'accepted' || project.status === 'in_progress' || project.status === 'complete';
      const coverPhotos = (project.cover_photos || []).map(p => p.url || p).slice(0, 3);
      const referencePhotos = (project.reference_photos || []).map(p => p.url || p);
      const depositPercent = Number(project.deposit_percent) || 0;
      const depositAmount = total * (depositPercent / 100);

      const detailParts = [s.abn ? `ABN ${s.abn}` : '', s.address, s.phone, s.website].filter(Boolean);
      const licenseParts = (s.licenses || '').trim();

      const coverHtml = `
        <div class="cover-banner">
          ${coverPhotos.length ? `<div class="cover-photo-grid">${coverPhotos.map(url => `<img src="${url}" />`).join('')}</div>` : ''}
          <div class="cover-scrim"></div>
          <div class="cover-content">
            ${s.logo_url ? `<div class="cover-logo-badge"><img src="${s.logo_url}" class="cover-logo" /></div>` : `<p style="font-size:22px; font-weight:700; margin:0 0 8px;">${s.company_name || ''}</p>`}
            ${s.tagline ? `<p class="cover-tagline">${s.tagline}</p>` : '<div style="margin-bottom:40px;"></div>'}
            <p class="cover-eyebrow">${template === 'quick_estimate' ? 'Estimate' : 'Proposal'}</p>
            <h1 class="cover-title">${project.name}</h1>
            <p class="cover-subtitle">${project.proposal_subtitle || ('Prepared for ' + project.client_name)}</p>
            ${template === 'solar' && project.pylon_link ? `<div style="margin-top:18px;"><a class="btn" href="${project.pylon_link}" target="_blank" rel="noopener">View interactive system design</a></div>` : ''}
          </div>
          ${(detailParts.length || licenseParts) ? `
            <div class="cover-details">
              <span>${s.company_name || ''}${detailParts.length ? ' &middot; ' + detailParts.join(' &middot; ') : ''}</span>
              ${licenseParts ? `<span>${licenseParts}</span>` : ''}
            </div>` : ''}
        </div>
        <p class="subtitle" style="margin:0 0 24px;">Prepared for ${project.client_name}${project.client_address ? ' &middot; ' + mapsLink(project.client_address) : ''}</p>
        ${template === 'quick_estimate' ? `<div class="card" style="border-color:var(--accent); margin-bottom:24px;"><p style="margin:0; font-weight:600;">${project.estimate_disclaimer_text || 'Estimate only - final invoice based on actual hours and materials used.'}</p></div>` : ''}
      `;

      const stagePhotosHtml = centres.some(c => (c.photo_groups || []).length) ? `
        <div class="card">
          <h2>Stage photos</h2>
          ${centres.filter(c => (c.photo_groups || []).length).map(c => `
            <p style="font-weight:600; margin:16px 0 8px;">${c.name}</p>
            ${c.photo_groups.map(g => `
              <p class="subtitle" style="margin:0 0 6px;">${g.description || ''}</p>
              <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:8px; margin-bottom:14px;">
                ${(g.photos || []).map(p => `<img src="${p.url || p}" style="width:100%; height:130px; object-fit:cover; border-radius:8px;" />`).join('')}
              </div>
            `).join('')}
          `).join('')}
        </div>` : '';

      const paymentScheduleHtml = (template === 'quick_estimate' || template === 'time_and_materials') ? '' : `
        <div class="card">
          <h2>Payment schedule</h2>
          <table>
            <thead><tr><th>Milestone</th><th class="num">Amount</th></tr></thead>
            <tbody>
              <tr><td>Deposit (${depositPercent}%), due on acceptance</td><td class="num">${money(depositAmount)}</td></tr>
              ${centres.map(c => `<tr><td>${c.name}, due on completion</td><td class="num">${money(c.quoted_amount * (1 - depositPercent / 100))}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>`;

      const sowHtml = project.sow_text ? `
        <div class="card">
          <h2>Scope of works</h2>
          <p class="subtitle" style="white-space:pre-wrap; line-height:1.7; color:var(--text);">${project.sow_text}</p>
        </div>` : '';

      const referenceHtml = referencePhotos.length ? `
        <div class="card">
          <h2>What it will look like</h2>
          <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:10px;">
            ${referencePhotos.map(url => `<img src="${url}" style="width:100%; height:150px; object-fit:cover; border-radius:8px;" />`).join('')}
          </div>
        </div>` : '';

      const termsHtml = project.terms_text ? `
        <div class="card">
          <h2>Terms and conditions</h2>
          <p class="subtitle" style="white-space:pre-wrap; line-height:1.6;">${project.terms_text}</p>
        </div>` : '';

      content.innerHTML = `
        ${coverHtml}
        ${sowHtml}

        <div class="card">
          <h2>Investment summary</h2>
          <table>
            <thead><tr><th>Stage</th><th>Description</th><th class="num">Price</th></tr></thead>
            <tbody>
              ${centres.map(c => `
                <tr>
                  <td>${c.name}</td>
                  <td style="color:var(--muted)">${c.description || ''}</td>
                  <td class="num">${money(c.quoted_amount)}</td>
                </tr>`).join('')}
            </tbody>
          </table>
          <div style="text-align:right; margin-top:16px; font-size:20px; font-weight:700;">
            Total: ${money(total)}
          </div>
        </div>

        ${referenceHtml}
        ${stagePhotosHtml}
        ${paymentScheduleHtml}
        ${termsHtml}

        ${isAccepted ? `
        <div class="card" id="accept-section">
          <p class="success-box" style="display:inline-block">${template === 'quick_estimate' ? 'Estimate accepted, thank you.' : 'Quote accepted, thank you.'} Work will begin as scheduled.</p>
        </div>` : ''}
      `;

      document.getElementById('topbar-total').innerHTML = `
        <p class="subtitle" style="margin:0 0 2px; font-size:10px; text-transform:uppercase; letter-spacing:0.04em;">Total</p>
        <p style="margin:0; font-weight:700; font-size:16px;">${money(total)}</p>
      `;
      document.getElementById('topbar-accept').innerHTML = isAccepted
        ? `<span class="badge accepted">${template === 'quick_estimate' ? 'Estimate accepted' : 'Quote accepted'}</span>`
        : `<button id="accept-btn">${template === 'quick_estimate' ? 'Approve estimate' : 'Approve quote'}</button>`;

      const acceptBtn = document.getElementById('accept-btn');
      if (acceptBtn) {
        acceptBtn.addEventListener('click', async () => {
          acceptBtn.disabled = true;
          const { error: acceptErr } = await supabaseClient.rpc('accept_quote', { p_token: token });
          if (acceptErr) {
            document.getElementById('accept-error').innerHTML = `<div class="error-box" style="margin-bottom:16px;">${acceptErr.message}</div>`;
            acceptBtn.disabled = false;
            return;
          }
          load();
        });
      }
    }

    load().then(() => {
      if (new URLSearchParams(window.location.search).get('print') === '1') {
        setTimeout(() => window.print(), 400);
      }
    });
  </script>
</body>
</html>
