<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('te-theme') || (matchMedia('(pointer: coarse)').matches ? 'dark' : 'navy'));</script>
<title>Logs - Thomson Energy</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=11" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('mobile-menu-dropdown').classList.toggle('open')">&#9776;</button>
    <div class="mobile-menu-dropdown" id="mobile-menu-dropdown"></div>
    <nav class="topbar-tabs" id="topbar-tabs"></nav>
    <div class="topbar-right">
      <a href="/schedule.html" class="topbar-icon-link" title="Schedule">&#128197;</a>
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/home.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="wrap wide">
    <h1>Logs</h1>
    <p class="subtitle">Admin only - who signed in and when, plus every logged create/edit/delete across the app.</p>

    <div class="card">
      <h2>Recent logins</h2>
      <div id="login-list"><p class="subtitle">Loading...</p></div>
      <button type="button" class="secondary" id="login-load-more-btn" style="margin-top:10px; display:none;">Load more</button>
    </div>

    <div class="card">
      <h2>Activity feed</h2>
      <p class="subtitle" style="margin-bottom:10px;">Every create/edit/delete logged anywhere in the app - jobs, quotes, invoices, POs, stock, clients, suppliers, tasks and more.</p>
      <div class="grid cols-3">
        <div>
          <label style="margin-top:0">Staff</label>
          <select id="log-staff-filter"><option value="">All staff</option></select>
        </div>
        <div>
          <label style="margin-top:0">Type</label>
          <select id="log-type-filter"><option value="">All types</option></select>
        </div>
        <div>
          <label style="margin-top:0">Search</label>
          <input id="log-search" placeholder="Search descriptions..." autocomplete="off" />
        </div>
      </div>
      <div id="activity-list" style="margin-top:14px;"><p class="subtitle">Loading...</p></div>
      <button type="button" class="secondary" id="activity-load-more-btn" style="margin-top:10px; display:none;">Load more</button>
    </div>
  </div>

  <script src="/js/supabase-client.js?v=14"></script>
  <script src="/js/theme.js"></script>
  <script>
    const PAGE_SIZE = 50;
    let loginOffset = 0;
    let activityOffset = 0;
    let allStaff = [];

    function fmtWhen(iso) {
      return new Date(iso).toLocaleString('en-AU', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    // A human-readable label for entity_type values, since the raw values
    // (e.g. "purchase_order", "time_entry") are written for the database,
    // not for reading in a filter dropdown.
    const ENTITY_LABELS = {
      project: 'Jobs & quotes', purchase_order: 'Purchase orders', supplier: 'Suppliers',
      material: 'Materials', client: 'Clients', time_entry: 'Timesheets', login: 'Logins',
    };
    function entityLabel(type) { return ENTITY_LABELS[type] || (type.charAt(0).toUpperCase() + type.slice(1).replace(/_/g, ' ')); }

    async function loadStaffFilter() {
      const { data } = await supabaseClient.from('profiles').select('id, full_name').order('full_name');
      allStaff = data || [];
      const sel = document.getElementById('log-staff-filter');
      sel.innerHTML = `<option value="">All staff</option>` + allStaff.map(s => `<option value="${s.id}">${s.full_name || 'Unnamed'}</option>`).join('');
    }

    async function loadTypeFilter() {
      // No cheap DISTINCT via the client library - entity_type is a short,
      // low-cardinality column, so pulling every value and de-duplicating
      // here is simpler than a dedicated RPC just for a filter dropdown.
      const { data } = await supabaseClient.from('activity_log').select('entity_type').neq('entity_type', 'login');
      const types = [...new Set((data || []).map(r => r.entity_type))].sort();
      const sel = document.getElementById('log-type-filter');
      sel.innerHTML = `<option value="">All types</option>` + types.map(t => `<option value="${t}">${entityLabel(t)}</option>`).join('');
    }

    async function loadLogins(append = false) {
      const listEl = document.getElementById('login-list');
      if (!append) { loginOffset = 0; listEl.innerHTML = `<p class="subtitle">Loading...</p>`; }
      const { data: entries, error } = await supabaseClient
        .from('activity_log')
        .select('id, description, created_at, profiles(full_name)')
        .eq('entity_type', 'login')
        .order('created_at', { ascending: false })
        .range(loginOffset, loginOffset + PAGE_SIZE - 1);
      if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }

      const rowsHtml = entries.map(e => `
        <div style="display:flex; justify-content:space-between; gap:12px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px;">
          <span>${e.profiles?.full_name || 'Someone'}</span>
          <span class="subtitle">${fmtWhen(e.created_at)}</span>
        </div>`).join('');

      if (append) listEl.insertAdjacentHTML('beforeend', rowsHtml);
      else listEl.innerHTML = rowsHtml || `<p class="subtitle">No logins recorded yet.</p>`;

      loginOffset += entries.length;
      document.getElementById('login-load-more-btn').style.display = entries.length === PAGE_SIZE ? 'inline-block' : 'none';
    }

    async function loadActivity(append = false) {
      const listEl = document.getElementById('activity-list');
      if (!append) { activityOffset = 0; listEl.innerHTML = `<p class="subtitle">Loading...</p>`; }

      const staffId = document.getElementById('log-staff-filter').value;
      const type = document.getElementById('log-type-filter').value;
      const q = document.getElementById('log-search').value.trim();

      let query = supabaseClient
        .from('activity_log')
        .select('id, entity_type, action, description, created_at, profiles(full_name)')
        .neq('entity_type', 'login')
        .order('created_at', { ascending: false })
        .range(activityOffset, activityOffset + PAGE_SIZE - 1);
      if (staffId) query = query.eq('changed_by', staffId);
      if (type) query = query.eq('entity_type', type);
      if (q) query = query.ilike('description', `%${q}%`);

      const { data: entries, error } = await query;
      if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }

      const rowsHtml = entries.map(e => `
        <div style="padding:10px 0; border-bottom:1px solid var(--border); font-size:13px;">
          <div style="display:flex; justify-content:space-between; gap:12px;">
            <span>${e.description}</span>
            <span class="subtitle" style="white-space:nowrap;">${fmtWhen(e.created_at)}</span>
          </div>
          <div class="subtitle" style="font-size:11px; margin-top:2px;">${e.profiles?.full_name || 'Someone'} - ${entityLabel(e.entity_type)}</div>
        </div>`).join('');

      if (append) listEl.insertAdjacentHTML('beforeend', rowsHtml);
      else listEl.innerHTML = rowsHtml || `<p class="subtitle">No matching activity.</p>`;

      activityOffset += entries.length;
      document.getElementById('activity-load-more-btn').style.display = entries.length === PAGE_SIZE ? 'inline-block' : 'none';
    }

    let searchTimeout;
    document.getElementById('log-staff-filter').addEventListener('change', () => loadActivity());
    document.getElementById('log-type-filter').addEventListener('change', () => loadActivity());
    document.getElementById('log-search').addEventListener('input', () => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => loadActivity(), 250);
    });
    document.getElementById('login-load-more-btn').addEventListener('click', () => loadLogins(true));
    document.getElementById('activity-load-more-btn').addEventListener('click', () => loadActivity(true));

    (async () => {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();
      renderMainNav('logs');
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });

      const role = await getMyRole();
      if (role !== 'admin') { window.location.href = '/home.html'; return; }

      await Promise.all([loadStaffFilter(), loadTypeFilter(), loadLogins(), loadActivity()]);
    })();
  </script>
</body>
</html>
