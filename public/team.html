<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('te-theme') || (matchMedia('(pointer: coarse)').matches ? 'dark' : 'navy'));</script>
<title>Team - Thomson Energy</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=9" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .team-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 16px; text-align: center; }
  .team-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: var(--surface-1); margin: 0 auto 10px; display: block; }
  .team-avatar-fallback {
    width: 64px; height: 64px; border-radius: 50%; background: var(--accent-dim); color: var(--accent);
    display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 18px; margin: 0 auto 10px;
  }
</style>
</head>
<body>
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('mobile-menu-dropdown').classList.toggle('open')">&#9776;</button>
    <div class="mobile-menu-dropdown" id="mobile-menu-dropdown"></div>
    <nav class="topbar-tabs" id="topbar-tabs"></nav>
    <div class="topbar-right">
      <a href="/schedule.html" class="topbar-icon-link" title="Schedule">&#128197;</a>
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/home.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="wrap wide">
    <h1>Team</h1>
    <p class="subtitle">Everyone at Thomson Energy. Rates and allowances are managed by an admin under Settings &gt; Users &amp; Roles - licences are shown below where recorded, and can also be managed under Settings &gt; Insurance &amp; Licensing.</p>

    <div class="card">
      <div id="team-list" class="team-grid"><p class="subtitle">Loading...</p></div>
    </div>
  </div>

  <script src="/js/supabase-client.js?v=2"></script>
  <script src="/js/theme.js"></script>
  <script>
    let teamCanEditTitles = false;

    async function loadTeam() {
      const listEl = document.getElementById('team-list');
      const [{ data, error }, { data: licences }, emailsResult] = await Promise.all([
        supabaseClient.from('profiles').select('id, full_name, role, job_title, mobile_number, photo_url, active').eq('active', true).order('full_name'),
        supabaseClient.from('profile_licences').select('*'),
        // Email lives in Supabase Auth, not profiles - only readable via
        // the service role, so it comes from a small serverless function
        // rather than a direct table query.
        (async () => {
          try {
            const { data: { session } } = await supabaseClient.auth.getSession();
            const res = await fetch('/.netlify/functions/list-staff-emails', { headers: { Authorization: `Bearer ${session.access_token}` } });
            const json = await res.json();
            return res.ok && json.ok ? json.emails : [];
          } catch { return []; }
        })(),
      ]);
      if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }
      if (!data.length) { listEl.innerHTML = `<p class="subtitle">No active team members.</p>`; return; }

      const emailById = Object.fromEntries((emailsResult || []).map(e => [e.id, e.email]));
      const roleLabels = { admin: 'Admin', finance: 'Finance', sales: 'Sales', staff: 'Staff' };
      listEl.innerHTML = data.map(p => {
        const initials = (p.full_name || '?').split(' ').map(w => w[0]).slice(0, 2).join('').toUpperCase();
        const myLicences = (licences || []).filter(l => l.profile_id === p.id);
        const email = emailById[p.id];
        return `
          <div class="team-card" data-id="${p.id}">
            ${p.photo_url
              ? `<img class="team-avatar" src="${p.photo_url}" />`
              : `<div class="team-avatar-fallback">${initials}</div>`}
            <p style="font-weight:600; margin:0 0 2px;">${p.full_name || 'Unnamed'}</p>
            <p class="subtitle job-title-display" style="margin:0 0 6px;">${p.job_title || roleLabels[p.role] || p.role}</p>
            ${teamCanEditTitles ? `<button type="button" class="secondary edit-title-btn" style="font-size:11px; padding:3px 8px; margin-bottom:6px;">Edit title</button>` : ''}
            ${p.mobile_number ? `<p class="subtitle" style="margin:0 0 4px; font-size:12px;"><a class="link-quiet" href="tel:${p.mobile_number}">${p.mobile_number}</a></p>` : ''}
            ${email ? `<p class="subtitle" style="margin:0 0 6px; font-size:12px;"><a class="link-quiet" href="mailto:${email}">${email}</a></p>` : ''}
            ${myLicences.length ? `
              <div style="text-align:left; margin-top:8px; padding-top:8px; border-top:1px solid var(--border);">
                ${myLicences.map(l => `<p style="margin:0 0 4px; font-size:11px;">${l.licence_name}: ${l.licence_number || '<span class="subtitle">no number set</span>'}</p>`).join('')}
              </div>` : ''}
          </div>`;
      }).join('');

      if (teamCanEditTitles) {
        listEl.querySelectorAll('.edit-title-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            const card = btn.closest('.team-card');
            const display = card.querySelector('.job-title-display');
            const current = display.textContent;
            display.outerHTML = `<div class="job-title-edit" style="display:flex; gap:6px; margin-bottom:6px;">
              <input class="job-title-input" value="${current}" style="margin:0; font-size:13px; padding:6px 8px;" />
              <button type="button" class="job-title-save-btn" style="font-size:11px; padding:3px 8px;">Save</button>
            </div>`;
            btn.style.display = 'none';
            card.querySelector('.job-title-save-btn').addEventListener('click', async () => {
              const value = card.querySelector('.job-title-input').value.trim();
              const { error: updErr } = await supabaseClient.from('profiles').update({ job_title: value || null }).eq('id', card.dataset.id);
              if (updErr) { alert(updErr.message); return; }
              await loadTeam();
            });
          });
        });
      }
    }

    (async function () {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();
      renderMainNav('team');
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });
      const myRole = await getMyRole();
      teamCanEditTitles = myRole === 'admin' || myRole === 'finance';
      await loadTeam();
    })();
  </script>
</body>
</html>
