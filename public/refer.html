<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex, nofollow" />
<script>document.documentElement.setAttribute('data-theme', 'navy');</script>
<title>Send us a job - Thomson Energy</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=25" />
<link rel="stylesheet" href="/css/client-page.css?v=1" />
<style>
  /* The referral link (backlog item 74b): no login, one page, phone first. js/refer.js. */
  body { padding-top: 0; }
  .pt-head { display:flex; align-items:center; gap:14px; padding:14px 16px; border-bottom:1px solid var(--border); }
  .pt-head img { height:32px; }
  .wrap { max-width: 560px; }
  .rf-card { border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin:12px 0; background:var(--surface); }
  .rf-choice { display:block; width:100%; text-align:left; margin:8px 0; padding:12px 14px; font-size:16px; border-radius:10px; border:1px solid var(--border); background:var(--surface); color:var(--text); }
  .rf-choice.on { border-color:var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .rf-choice small { display:block; color:var(--muted); font-size:13px; margin-top:2px; }
  .rf label { display:block; margin:10px 0 4px; font-size:14px; }
  .rf input, .rf select, .rf textarea { width:100%; font-size:16px; }
  .rf .tick { display:flex; gap:8px; align-items:flex-start; font-weight:400; }
  .rf .tick input { width:auto; margin-top:3px; }
  .rf-muted { color:var(--muted); font-size:13px; }
  .rf button.big { width:100%; font-size:16px; padding:12px; margin-top:14px; }
</style>
</head>
<body class="client-page">
  <div class="pt-head"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></div>
  <div class="wrap rf" id="rf-root" style="padding:8px 16px 40px;"><p class="subtitle">Loading...</p></div>
  <script src="/js/template-questions.js?v=9"></script>
  <script src="/js/address-box.js?v=3"></script>
  <script src="/js/refer.js?v=3"></script>
</body>
</html>
