<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Your statement</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/document-fonts.css?v=1" />
<link rel="stylesheet" href="/css/style.css?v=25" />
<link rel="stylesheet" href="/css/client-page.css?v=1" />
<script src="/js/vendor/supabase-2.js?v=1"></script>
<style>
  /* A client's statement (owner, 15 Nov 2026): every unpaid invoice across their jobs, each linking to
     its own invoice page, the total owing and how to pay by bank transfer. Laid out as A4 sheets like
     invoice.html (794 x 1123 px), the same on screen and in the PDF; a long list carries on to the
     next sheet and the totals and How To Pay close the last one. */
  @page { size: A4; margin: 0; }
  body { background: #e6e9ef; }
  .st-sheets { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .st-sheet { position: relative; width: 794px; height: 1123px; margin: 0 auto 22px; overflow: hidden; background: #fff; color: #000;
    box-shadow: 0 6px 28px rgba(15, 23, 42, 0.18); font-family: 'Arimo', Arial, Helvetica, sans-serif; font-size: 13px; line-height: 1.3; padding: 34px 38px 0; }
  .st-sheet * { box-sizing: border-box; }
  .st-head { display: flex; justify-content: space-between; align-items: flex-start; }
  .st-logo { display: block; height: 112px; width: auto; max-width: 300px; }
  .st-web { font-size: 12px; margin-top: 8px; }
  .st-contact { font-size: 13.5px; line-height: 1.38; margin-top: 2px; }
  .st-meta-row { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 52px; }
  .st-bill { font-size: 13px; line-height: 1.38; padding: 10px 0 0 8px; max-width: 330px; }
  .st-right { width: 340px; }
  .st-strip { display: flex; border: 1px solid #6b6b6b; border-radius: 6px; overflow: hidden; }
  .st-strip > div { flex: 1; text-align: center; padding: 8px 4px 9px; border-right: 1px solid #6b6b6b; }
  .st-strip > div:last-child { border-right: none; }
  .st-strip .k { font-size: 10px; text-transform: uppercase; letter-spacing: 0.02em; }
  .st-strip .v { font-size: 14px; font-weight: 700; margin-top: 8px; white-space: nowrap; }
  .st-strip .amt { background: #98989d; color: #fff; }
  .st-title { text-align: right; font-size: 20px; font-weight: 700; margin: 14px 0 0; letter-spacing: 0.01em; }
  .st-body { margin-top: 20px; }
  .st-sec h3 { margin: 0 0 4px; font-size: 13px; font-weight: 700; }
  .st-sheet table { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; border: none; margin: 0; }
  .st-sheet th { background: #98989d; color: #fff; font-weight: 700; font-size: 12px; padding: 2px 6px; text-align: left; border: none; text-transform: none; letter-spacing: 0; }
  .st-sheet th:first-child { border-top-left-radius: 6px; }
  .st-sheet th:last-child { border-top-right-radius: 6px; }
  .st-sheet td { border: 1px solid #8e8e93; border-top: none; padding: 3px 6px; font-size: 12px; background: #fff; color: #000; vertical-align: top; overflow-wrap: anywhere; }
  .st-sheet td + td { border-left: none; }
  .st-sheet .num { text-align: right; }
  .st-sheet td a { color: #0b3d91; font-weight: 700; }
  .st-sheet td .sub { color: #555; font-size: 11px; }
  .st-sheet td .late { color: #b42318; font-weight: 700; }
  .st-foot { position: absolute; left: 38px; right: 38px; bottom: 26px; text-align: center; font-size: 11px; font-weight: 700; }
  .st-final { margin-top: 14px; }
  .st-aging { display: flex; border: 1px solid #8e8e93; border-radius: 6px; overflow: hidden; }
  .st-aging > div { flex: 1; text-align: center; padding: 6px 4px; border-right: 1px solid #8e8e93; }
  .st-aging > div:last-child { border-right: none; background: #ececec; }
  .st-aging .k { font-size: 10px; text-transform: uppercase; }
  .st-aging .v { font-size: 13px; font-weight: 700; margin-top: 4px; }
  .st-note { font-size: 12px; line-height: 1.5; margin: 10px 0 0; }
  .st-howto { border-top: 1.5px dashed #555; margin-top: 14px; padding-top: 8px; }
  .st-howto h4 { margin: 0; font-size: 18px; font-weight: 700; text-transform: none; }
  .st-howto-cols { display: flex; gap: 40px; margin-top: 12px; font-size: 11px; }
  .st-howto-cols h5 { margin: 0 0 6px; font-size: 11px; font-weight: 700; text-transform: none; }
  .st-howto-cols .row { display: flex; gap: 14px; margin-bottom: 1px; }
  .st-howto-cols .row .k { width: 62px; flex: none; }
  .st-howto-cols .row .v { font-weight: 700; }

  @media print {
    .topbar { display: none !important; }
    html, body { background: #fff !important; }
    .wrap { max-width: none !important; width: 210mm !important; margin: 0 !important; padding: 0 !important; }
    .st-sheets { zoom: 1 !important; }
    .st-sheet { margin: 0; box-shadow: none; page-break-after: always; break-after: page; }
    .st-sheet:last-child { page-break-after: auto; break-after: auto; }
  }
  .as-paper .topbar { display: none !important; }
  .as-paper .wrap { max-width: none !important; width: 794px !important; margin: 0 !important; padding: 0 !important; }
  .as-paper .st-sheet { margin: 0; box-shadow: none; }
  /* Phone: a plain full-size summary card above the zoomed sheet (never printed, never in the PDF). */
  .doc-sum { display: none; }
  @media (max-width: 839px) {
    .wrap { padding-left: 8px !important; padding-right: 8px !important; }
    .doc-sum { display: block; background: #fff; color: #0a0a0a; border-radius: 12px; padding: 18px 16px; margin: 0 0 18px; box-shadow: 0 4px 18px rgba(15,23,42,0.12); font-size: 16px; line-height: 1.45; }
    .doc-sum .ds-kicker { font-size: 14px; font-weight: 600; color: #4b5563; }
    .doc-sum .ds-amount { font-size: 34px; font-weight: 700; margin: 2px 0; }
    .doc-sum .ds-late { color: #b42318; font-weight: 700; }
    .doc-sum h3 { font-size: 16px; margin: 16px 0 6px; padding-top: 14px; border-top: 1px solid #e5e7eb; }
    .doc-sum .ds-row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; }
    .doc-sum .ds-row .k { color: #4b5563; }
    .doc-sum .ds-row .v { font-weight: 700; text-align: right; overflow-wrap: anywhere; }
    .doc-sum .ds-note { font-size: 14px; color: #4b5563; margin: 14px 0 0; }
    .doc-sum a { color: #0b3d91; font-weight: 700; }
  }
  @media print { .doc-sum { display: none !important; } }
  .as-paper .doc-sum { display: none !important; }
</style>
</head>
<body class="client-page">
  <div class="topbar">
    <span class="brand">STATEMENT</span>
    <button class="secondary" onclick="window.print()">Print / Save as PDF</button>
  </div>

  <div class="wrap" style="max-width:860px;">
    <div id="content"><p class="subtitle">Loading your statement...</p></div>
  </div>

  <script src="/js/supabase-client.js?v=150"></script>
  <script src="/js/statement-page.js?v=2"></script>
</body>
</html>
