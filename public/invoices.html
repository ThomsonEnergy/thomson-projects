<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('te-theme') || (matchMedia('(pointer: coarse)').matches ? 'dark' : 'navy'));</script>
<title>Invoices - TEops</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=23" />
<script src="/js/vendor/supabase-2.js?v=1"></script>
</head>
<body>
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('mobile-menu-dropdown').classList.toggle('open')">&#9776;</button>
    <div class="mobile-menu-dropdown" id="mobile-menu-dropdown"></div>
    <nav class="topbar-tabs" id="topbar-tabs"></nav>
    <div class="topbar-right">
      <a href="/schedule.html" class="topbar-icon-link" title="Schedule">&#128197;</a>
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/home.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="wrap">
    <h1>Invoices</h1>
    <p class="subtitle">Every claim raised from the app, across every job. Push to Xero and payment status still happen from the job page - this is the overview.</p>

    <div class="grid cols-4">
      <div class="stat"><div class="label">Total</div><div class="value" id="stat-total">-</div></div>
      <div class="stat"><div class="label">This month</div><div class="value" id="stat-month">-</div></div>
      <div class="stat"><div class="label">Outstanding (inc GST)</div><div class="value" id="stat-outstanding">-</div></div>
      <div class="stat"><div class="label">Overdue (inc GST)</div><div class="value" id="stat-overdue">-</div></div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;">
        <input id="invoice-search" placeholder="Search by invoice, job number, job or client..." style="max-width:340px;" />
        <select id="invoice-filter">
          <option value="unpaid" selected>Unpaid</option>
          <option value="overdue">Overdue</option>
          <option value="paid">Paid</option>
          <option value="no_xero">Not yet in Xero</option>
          <option value="all">All</option>
        </select>
      </div>
      <div id="invoices-list"><p class="subtitle">Loading...</p></div>
    </div>
  </div>

  <script src="/js/supabase-client.js?v=112"></script>
  <script src="/js/theme.js?v=2"></script>
  <script>
    let allInvoices = null, allMappings = [];
    // ?id= (from the top bar search) shows just that invoice until the user asks for all
    let focusInvoiceId = new URLSearchParams(window.location.search).get('id');

    function clearInvoiceFocus() {
      if (!focusInvoiceId) return;
      focusInvoiceId = null;
      try { history.replaceState(null, '', '/invoices.html'); } catch (e) { /* not supported */ }
      document.title = 'Invoices - TEops';
      if (typeof setPageTitle === 'function') setPageTitle('Invoices');
    }

    async function loadInvoices() {
      const listEl = document.getElementById('invoices-list');
      const [{ data, error }, { data: mappings }] = await Promise.all([
        supabaseClient
          .from('invoices')
          .select(`*, cost_centres(name, project_id, projects(name, job_number, client_name, clients(client_type))), projects(name, job_number, client_name, clients(client_type)), invoice_claims(*, cost_centres(name, sort_order))`)
          .order('sent_at', { ascending: false }),
        supabaseClient.from('xero_account_mapping').select('*'),
      ]);

      if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }
      if (!data.length) {
        listEl.innerHTML = `<p class="subtitle">No invoices raised yet - create one from a job's stage claims card.</p>`;
        document.getElementById('stat-total').textContent = money(0);
        document.getElementById('stat-month').textContent = money(0);
        document.getElementById('stat-outstanding').textContent = money(0);
        document.getElementById('stat-overdue').textContent = money(0);
        return;
      }

      const now = new Date();
      const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);

      let total = 0, thisMonth = 0;

      data.forEach(inv => {
        const amount = Number(inv.labour_amount) + Number(inv.material_amount) - Number(inv.stc_amount || 0);
        const sentAt = new Date(inv.sent_at);
        total += amount;
        if (sentAt >= startOfMonth) thisMonth += amount;
      });

      document.getElementById('stat-total').textContent = money(total);
      document.getElementById('stat-month').textContent = money(thisMonth);

      // Outstanding / Overdue: the balance due each unpaid invoice shows (inc GST, less the
      // STC credit with GST for a company, less credit notes), from get_invoice_balance_due.
      // Only unpaid invoices are asked for, all at once.
      const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
      const unpaid = data.filter(inv => !inv.paid_at);
      document.getElementById('stat-outstanding').textContent = unpaid.length ? '...' : money(0);
      document.getElementById('stat-overdue').textContent = unpaid.length ? '...' : money(0);
      Promise.all(unpaid.map(async (inv) => {
        const { data: bal, error: balErr } = await supabaseClient.rpc('get_invoice_balance_due', { p_invoice_id: inv.id });
        if (!balErr && bal != null) return { inv, due: Number(bal) };
        // Fallback (no credit notes): the same sum calculate_balance_due does.
        const sub = r2(Number(inv.labour_amount || 0) + Number(inv.material_amount || 0));
        const project = inv.cost_centres?.projects || inv.projects;
        const stc = Number(inv.stc_amount || 0);
        const stcIncGst = project?.clients?.client_type === 'company' ? r2(stc * 1.10) : r2(stc);
        return { inv, due: r2(sub + r2(sub * 0.10) - stcIncGst) };
      })).then((rows) => {
        let outstanding = 0, overdue = 0;
        rows.forEach(({ inv, due }) => {
          outstanding += due;
          if (inv.due_date && new Date(inv.due_date + 'T00:00:00') < now) overdue += due;
        });
        document.getElementById('stat-outstanding').textContent = money(outstanding);
        document.getElementById('stat-overdue').textContent = money(overdue);
      });

      allInvoices = data;
      allMappings = mappings || [];
      renderInvoiceList();
    }

    function renderInvoiceList() {
      if (!allInvoices) return;
      const listEl = document.getElementById('invoices-list');
      const q = document.getElementById('invoice-search').value.trim().toLowerCase();
      const filter = document.getElementById('invoice-filter').value;
      const now = new Date();
      const isOverdue = (inv) => !inv.paid_at && inv.due_date && new Date(inv.due_date + 'T00:00:00') < now;

      const focusInv = focusInvoiceId && allInvoices.find(inv => inv.id === focusInvoiceId);
      if (focusInvoiceId && !focusInv) { showToast('That invoice could not be found', { error: true }); clearInvoiceFocus(); }
      if (focusInv) {
        const ref = focusInv.invoice_number || 'Invoice';
        if (typeof setPageTitle === 'function') setPageTitle(ref); else document.title = `${ref} - TEops`;
      }
      let rows = allInvoices;
      if (focusInv) rows = [focusInv];
      else if (filter === 'unpaid') rows = rows.filter(inv => !inv.paid_at);
      else if (filter === 'overdue') rows = rows.filter(inv => isOverdue(inv));
      else if (filter === 'paid') rows = rows.filter(inv => !!inv.paid_at);
      else if (filter === 'no_xero') rows = rows.filter(inv => !inv.xero_invoice_id);

      if (q && !focusInv) {
        rows = rows.filter(inv => {
          const project = inv.cost_centres?.projects || inv.projects;
          return [inv.invoice_number, project?.job_number, project?.name, project?.client_name]
            .some(v => v != null && String(v).toLowerCase().includes(q));
        });
      }

      if (!rows.length) {
        listEl.innerHTML = `<p class="subtitle">No invoices match. ${allInvoices.length} in total; try All or clear the search.</p>`;
        return;
      }

      listEl.innerHTML = (focusInv ? `<p class="subtitle" style="margin:0 0 10px;">Showing ${escapeHtml(focusInv.invoice_number || 'one invoice')} only. <a href="/invoices.html" class="link-quiet" id="inv-show-all">Show all invoices</a></p>` : '') + `
        <table class="responsive-stack">
          <thead><tr><th>Invoice</th><th>Job</th><th>Stage</th><th class="num">Amount</th><th>Sent</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${rows.map(inv => {
              const cc = inv.cost_centres;
              const claimStages = (inv.invoice_claims || []).map(ic => ic.cost_centres?.name).filter(Boolean);
              const project = cc?.projects || inv.projects;
              const projectId = cc?.project_id || inv.project_id;
              const clientType = project?.clients?.client_type || 'individual';
              const stageLabel = cc ? (cc.name || '-') : (claimStages.length ? (claimStages.length > 1 ? `${claimStages.length} stages` : claimStages[0]) : '-');
              const amount = Number(inv.labour_amount) + Number(inv.material_amount) - Number(inv.stc_amount || 0);
              const overdue = isOverdue(inv);
              return `
                <tr>
                  <td data-label="Invoice">${escapeHtml(inv.invoice_number)}</td>
                  <td data-label="Job">${project ? `#${escapeHtml(project.job_number || '-')} ${escapeHtml(project.name)}` : '-'}</td>
                  <td data-label="Stage" title="${escapeHtml(claimStages.join(', '))}">${escapeHtml(stageLabel)}</td>
                  <td class="num" data-label="Amount">${money(amount)}</td>
                  <td data-label="Sent">${new Date(inv.sent_at).toLocaleDateString('en-AU')}</td>
                  <td data-label="Status">
                    ${inv.paid_at ? '<span class="badge accepted">Paid</span>'
                      : overdue ? '<span class="badge red">Overdue</span>'
                      : '<span class="badge sent">Awaiting payment</span>'}
                    ${inv.xero_invoice_id ? '' : '<span class="subtitle" style="font-size:11px; display:block;">Not yet in Xero</span>'}
                  </td>
                  <td data-label="">
                    <a class="link-quiet" href="/invoice.html?token=${inv.invoice_token}" target="_blank" style="font-size:12px; margin-right:8px;">View</a>
                    ${project && projectId ? `<a class="link-quiet" href="/project.html?id=${projectId}&tab=invoices" style="font-size:12px; margin-right:8px;">Job</a>` : ''}
                    <button type="button" class="secondary xero-toggle-btn" data-id="${inv.id}" style="font-size:12px; padding:4px 8px;">Xero breakdown</button>
                  </td>
                </tr>
                <tr class="xero-row" data-for="${inv.id}" style="display:none;">
                  <td colspan="7" style="background:var(--surface-2);">${xeroBreakdownHtml(inv, allMappings, clientType)}</td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>`;

      const showAll = listEl.querySelector('#inv-show-all');
      if (showAll) showAll.addEventListener('click', (e) => { e.preventDefault(); clearInvoiceFocus(); document.getElementById('invoice-filter').value = 'all'; renderInvoiceList(); });

      listEl.querySelectorAll('.xero-toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const row = listEl.querySelector(`.xero-row[data-for="${btn.dataset.id}"]`);
          const showing = row.style.display !== 'none';
          row.style.display = showing ? 'none' : 'table-row';
          btn.textContent = showing ? 'Xero breakdown' : 'Hide breakdown';
        });
      });
    }

    (async function () {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();
      renderMainNav('invoices');
      // Opened from a search link: show every match, not just unpaid ones
      if (new URLSearchParams(window.location.search).get('q')) document.getElementById('invoice-filter').value = 'all';
      document.getElementById('invoice-search').addEventListener('input', () => { clearInvoiceFocus(); renderInvoiceList(); });
      document.getElementById('invoice-filter').addEventListener('change', () => { clearInvoiceFocus(); renderInvoiceList(); });
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });
      await loadInvoices();
    })();
  </script>
</body>
</html>
