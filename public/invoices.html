<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('te-theme') || 'dark');</script>
<title>Invoices - Thomson Energy</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=9" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('mobile-menu-dropdown').classList.toggle('open')">&#9776;</button>
    <div class="mobile-menu-dropdown" id="mobile-menu-dropdown"></div>
    <nav class="topbar-tabs" id="topbar-tabs"></nav>
    <div class="topbar-right">
      <a href="/schedule.html" class="topbar-icon-link" title="Schedule">&#128197;</a>
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/home.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="wrap">
    <h1>Invoices</h1>
    <p class="subtitle">Every claim raised from the app, across every job. Push to Xero and payment status still happen from the job page - this is the overview.</p>

    <div class="grid cols-4">
      <div class="stat"><div class="label">Total</div><div class="value" id="stat-total">-</div></div>
      <div class="stat"><div class="label">This month</div><div class="value" id="stat-month">-</div></div>
      <div class="stat"><div class="label">Outstanding</div><div class="value" id="stat-outstanding">-</div></div>
      <div class="stat"><div class="label">Overdue</div><div class="value" id="stat-overdue">-</div></div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
        <h2 style="margin:0;">All invoices</h2>
        <button class="secondary" id="standalone-invoice-btn">Create standalone invoice</button>
      </div>
      <div id="invoices-list"><p class="subtitle">Loading...</p></div>
    </div>
  </div>

  <script src="/js/supabase-client.js?v=2"></script>
  <script src="/js/theme.js"></script>
  <script>
    async function loadInvoices() {
      const listEl = document.getElementById('invoices-list');
      const [{ data, error }, { data: mappings }] = await Promise.all([
        supabaseClient
          .from('invoices')
          .select(`*, cost_centres(name, project_id, projects(name, job_number, client_name, clients(client_type))), projects(name, job_number, client_name, clients(client_type)), invoice_claims(*, cost_centres(name, sort_order))`)
          .order('sent_at', { ascending: false }),
        supabaseClient.from('xero_account_mapping').select('*'),
      ]);

      if (error) { listEl.innerHTML = `<div class="error-box">${error.message}</div>`; return; }
      if (!data.length) {
        listEl.innerHTML = `<p class="subtitle">No invoices raised yet - create one from a job's stage claims card.</p>`;
        document.getElementById('stat-total').textContent = money(0);
        document.getElementById('stat-month').textContent = money(0);
        document.getElementById('stat-outstanding').textContent = money(0);
        document.getElementById('stat-overdue').textContent = money(0);
        return;
      }

      const now = new Date();
      const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
      const DUE_DAYS = 14; // treat unpaid invoices older than this as overdue - no formal due-date field yet

      let total = 0, thisMonth = 0, outstanding = 0, overdue = 0;

      data.forEach(inv => {
        const amount = Number(inv.labour_amount) + Number(inv.material_amount) - Number(inv.stc_amount || 0);
        const sentAt = new Date(inv.sent_at);
        total += amount;
        if (sentAt >= startOfMonth) thisMonth += amount;
        if (!inv.paid_at) {
          outstanding += amount;
          const daysSince = (now - sentAt) / 86400000;
          if (daysSince > DUE_DAYS) overdue += amount;
        }
      });

      document.getElementById('stat-total').textContent = money(total);
      document.getElementById('stat-month').textContent = money(thisMonth);
      document.getElementById('stat-outstanding').textContent = money(outstanding);
      document.getElementById('stat-overdue').textContent = money(overdue);

      listEl.innerHTML = `
        <table class="responsive-stack">
          <thead><tr><th>Invoice</th><th>Job</th><th>Stage</th><th class="num">Amount</th><th>Sent</th><th>Status</th><th></th></tr></thead>
          <tbody>
            ${data.map(inv => {
              const cc = inv.cost_centres;
              const claimStages = (inv.invoice_claims || []).map(ic => ic.cost_centres?.name).filter(Boolean);
              const project = cc?.projects || inv.projects;
              const projectId = cc?.project_id || inv.project_id;
              const clientType = project?.clients?.client_type || 'individual';
              const stageLabel = cc ? (cc.name || '-') : (claimStages.length ? (claimStages.length > 1 ? `${claimStages.length} stages` : claimStages[0]) : '-');
              const amount = Number(inv.labour_amount) + Number(inv.material_amount) - Number(inv.stc_amount || 0);
              const daysSince = (now - new Date(inv.sent_at)) / 86400000;
              const isOverdue = !inv.paid_at && daysSince > DUE_DAYS;
              return `
                <tr>
                  <td data-label="Invoice">${inv.invoice_number}</td>
                  <td data-label="Job">${project ? `#${project.job_number || '-'} ${project.name}` : '-'}</td>
                  <td data-label="Stage" title="${claimStages.join(', ')}">${stageLabel}</td>
                  <td class="num" data-label="Amount">${money(amount)}</td>
                  <td data-label="Sent">${new Date(inv.sent_at).toLocaleDateString('en-AU')}</td>
                  <td data-label="Status">
                    ${inv.paid_at ? '<span class="badge accepted">Paid</span>'
                      : isOverdue ? '<span class="badge draft" style="color:var(--red);">Overdue</span>'
                      : '<span class="badge sent">Awaiting payment</span>'}
                    ${inv.xero_invoice_id ? '' : '<span class="subtitle" style="font-size:11px; display:block;">Not yet in Xero</span>'}
                  </td>
                  <td data-label="">
                    <a class="link-quiet" href="/invoice.html?token=${inv.invoice_token}" target="_blank" style="font-size:12px; margin-right:8px;">View</a>
                    ${project && projectId ? `<a class="link-quiet" href="/project.html?id=${projectId}" style="font-size:12px; margin-right:8px;">Job</a>` : ''}
                    <button type="button" class="secondary xero-toggle-btn" data-id="${inv.id}" style="font-size:12px; padding:4px 8px;">Xero breakdown</button>
                  </td>
                </tr>
                <tr class="xero-row" data-for="${inv.id}" style="display:none;">
                  <td colspan="7" style="background:var(--surface-2);">${xeroBreakdownHtml(inv, mappings, clientType)}</td>
                </tr>`;
            }).join('')}
          </tbody>
        </table>`;

      listEl.querySelectorAll('.xero-toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const row = listEl.querySelector(`.xero-row[data-for="${btn.dataset.id}"]`);
          const showing = row.style.display !== 'none';
          row.style.display = showing ? 'none' : 'table-row';
          btn.textContent = showing ? 'Xero breakdown' : 'Hide breakdown';
        });
      });
    }

    function openStandaloneInvoicePanel() {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px;';
      overlay.innerHTML = `
        <div class="card" style="max-width:480px; width:100%; max-height:85vh; overflow-y:auto;">
          <h2>Create standalone invoice</h2>
          <p class="subtitle" style="margin-bottom:12px;">No job or quote attached - for a one-off charge, callout, or anything else that isn't part of the job pipeline.</p>

          <label style="margin-top:0">Client - search existing, or just type a new one below</label>
          <input id="standalone-client-search" placeholder="Search existing clients..." autocomplete="off" />
          <div id="standalone-client-results" style="position:relative;"></div>

          <div class="grid cols-2" style="margin-top:8px;">
            <div>
              <label style="margin-top:0">Client name</label>
              <input id="standalone-client-name" required />
            </div>
            <div>
              <label style="margin-top:0">Client email</label>
              <input id="standalone-client-email" type="email" />
            </div>
          </div>

          <label>What's this for</label>
          <input id="standalone-description" placeholder="e.g. Callout - switchboard fault" />

          <label>Invoice number</label>
          <input id="standalone-invoice-number" placeholder="Leave blank to auto-assign the next number" />

          <div class="grid cols-3">
            <div>
              <label>Labour amount</label>
              <input type="number" step="0.01" id="standalone-labour" value="0" />
            </div>
            <div>
              <label>Materials amount</label>
              <input type="number" step="0.01" id="standalone-materials" value="0" />
            </div>
            <div>
              <label>Total</label>
              <input id="standalone-total" readonly style="background:var(--surface); color:var(--muted);" />
            </div>
          </div>

          <div style="margin-top:14px;">
            <button id="standalone-confirm-btn">Create &amp; send</button>
            <button type="button" class="secondary" id="standalone-cancel-btn">Cancel</button>
          </div>
          <div id="standalone-panel-msg"></div>
        </div>`;

      let selectedClientId = null;

      function updateTotal() {
        const l = parseFloat(overlay.querySelector('#standalone-labour').value) || 0;
        const m = parseFloat(overlay.querySelector('#standalone-materials').value) || 0;
        overlay.querySelector('#standalone-total').value = money(l + m);
      }
      overlay.querySelector('#standalone-labour').addEventListener('input', updateTotal);
      overlay.querySelector('#standalone-materials').addEventListener('input', updateTotal);

      let searchTimeout;
      overlay.querySelector('#standalone-client-search').addEventListener('input', (e) => {
        clearTimeout(searchTimeout);
        const q = e.target.value.trim();
        selectedClientId = null;
        if (q.length < 2) { overlay.querySelector('#standalone-client-results').innerHTML = ''; return; }
        searchTimeout = setTimeout(async () => {
          const { data } = await supabaseClient
            .from('clients')
            .select('id, name, email, address')
            .or(`name.ilike.%${q}%,email.ilike.%${q}%`)
            .limit(8);
          const resultsEl = overlay.querySelector('#standalone-client-results');
          if (!data || !data.length) { resultsEl.innerHTML = `<p class="subtitle" style="margin-top:4px;">No matches - fill in the fields below to add them as a new client.</p>`; return; }
          resultsEl.innerHTML = `<div style="border:1px solid var(--border); border-radius:8px; margin-top:6px;">
            ${data.map(c => `<div class="client-pick-row" data-id="${c.id}" data-name="${c.name}" data-email="${c.email || ''}" style="padding:8px 12px; cursor:pointer; border-bottom:1px solid var(--border);">${c.name} <span class="subtitle">${c.email || ''}</span></div>`).join('')}
          </div>`;
          resultsEl.querySelectorAll('.client-pick-row').forEach(row => {
            row.addEventListener('click', () => {
              selectedClientId = row.dataset.id;
              overlay.querySelector('#standalone-client-search').value = row.dataset.name;
              overlay.querySelector('#standalone-client-name').value = row.dataset.name;
              overlay.querySelector('#standalone-client-email').value = row.dataset.email;
              resultsEl.innerHTML = '';
            });
          });
        }, 250);
      });

      overlay.querySelector('#standalone-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#standalone-confirm-btn').addEventListener('click', async () => {
        const confirmBtn = overlay.querySelector('#standalone-confirm-btn');
        const panelMsg = overlay.querySelector('#standalone-panel-msg');
        const clientName = overlay.querySelector('#standalone-client-name').value.trim();
        const clientEmail = overlay.querySelector('#standalone-client-email').value.trim();

        if (!clientName) {
          panelMsg.innerHTML = `<div class="error-box">Client name is required - search for an existing client or type a new one.</div>`;
          return;
        }

        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Creating...';
        try {
          let clientId = selectedClientId;
          if (!clientId) {
            const { data: newClient, error: clientErr } = await supabaseClient
              .from('clients')
              .insert({ name: clientName, email: clientEmail })
              .select('id')
              .single();
            if (clientErr) throw clientErr;
            clientId = newClient.id;
          }

          const { data: { session } } = await supabaseClient.auth.getSession();
          const res = await fetch('/.netlify/functions/create-invoice', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
            body: JSON.stringify({
              clientId,
              description: overlay.querySelector('#standalone-description').value.trim() || 'Invoice',
              labourAmount: parseFloat(overlay.querySelector('#standalone-labour').value) || 0,
              materialAmount: parseFloat(overlay.querySelector('#standalone-materials').value) || 0,
              invoiceNumber: overlay.querySelector('#standalone-invoice-number').value.trim() || null,
            }),
          });
          const data = await res.json();
          if (!res.ok || !data.ok) throw new Error(data.error || 'Could not create the invoice');

          const invoiceUrl = `${window.location.origin}/invoice.html?token=${data.invoiceToken}`;
          panelMsg.innerHTML = `
            <div class="success-box">Created as ${data.invoiceNumber}.</div>
            <label>Invoice link</label>
            <input readonly value="${invoiceUrl}" onclick="this.select()" />
            <div style="display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;">
              <a class="btn secondary" target="_blank" href="${gmailComposeUrl({ to: clientEmail, subject: 'Invoice ' + data.invoiceNumber, body: 'Hi ' + clientName + ',\n\nPlease find your invoice here:\n' + invoiceUrl + '\n\nThanks,\nThomson Energy' })}">Email invoice to client</a>
              <a class="btn secondary" target="_blank" href="/invoice.html?token=${data.invoiceToken}&print=1">Download PDF</a>
            </div>
            <p class="subtitle" style="margin-top:6px;">Gmail opens ready to send - the PDF downloads separately for you to attach, since no browser can auto-attach a file into an email. The client's invoice page already has a Pay Online option alongside your bank details, generated automatically - nothing else to do here.</p>`;
          confirmBtn.style.display = 'none';
          overlay.querySelector('#standalone-cancel-btn').textContent = 'Close';

          await loadInvoices();
        } catch (err) {
          panelMsg.innerHTML = `<div class="error-box">${err.message}</div>`;
          confirmBtn.disabled = false;
          confirmBtn.textContent = 'Create & send';
        }
      });

      document.body.appendChild(overlay);
      updateTotal();
    }

    document.getElementById('standalone-invoice-btn').addEventListener('click', openStandaloneInvoicePanel);

    (async function () {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();
      renderMainNav('invoices');
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });
      await loadInvoices();
    })();
  </script>
</body>
</html>
