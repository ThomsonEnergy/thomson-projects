<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('te-theme') || (matchMedia('(pointer: coarse)').matches ? 'dark' : 'navy'));</script>
<title>Quotes - Thomson Energy</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=24" />
<script src="/js/vendor/supabase-2.js?v=1"></script>
</head>
<body>
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('mobile-menu-dropdown').classList.toggle('open')">&#9776;</button>
    <div class="mobile-menu-dropdown" id="mobile-menu-dropdown"></div>
    <nav class="topbar-tabs" id="topbar-tabs"></nav>
    <div class="topbar-right">
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/home.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="wrap">
    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
      <div>
        <h1>Quotes</h1>
        <p class="subtitle">Every quote built through this tool.</p>
      </div>
      <a href="/new-project.html" class="btn" id="new-quote-btn">+ New quote</a>
    </div>

    <div class="card">
      <div id="list"><p class="subtitle">Loading...</p></div>
    </div>
  </div>

  <script src="/js/supabase-client.js?v=122"></script>
  <script src="/js/theme.js?v=2"></script>
  <script>
    (async function () {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();
      renderMainNav('quotes');

      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });

      const myRole = await getMyRole();
      const pricingVisible = isPricingRole(myRole);
      if (!pricingVisible) document.getElementById('new-quote-btn').style.display = 'none';
      const centreCols = await costCentreColumns();

      const { data: projects, error } = await supabaseClient
        .from('projects')
        .select(`*, cost_centres(${centreCols})`)
        .is('job_number', null)
        .order('created_at', { ascending: false });

      const list = document.getElementById('list');
      if (error) {
        list.innerHTML = `<div class="error-box">${escapeHtml(error.message)}</div>`;
        return;
      }

      // Pending leads (backlog item 39): still new, reachable (phone or email), and no quote or
      // job made from them yet; plus website call requests not done. Pricing roles only (the
      // leads table is theirs). Read-only: the row opens the lead on the Leads page.
      let pendingLeads = [], openCalls = [];
      if (pricingVisible) {
        const [leadsRes, linkedRes, callsRes] = await Promise.all([
          supabaseClient.from('leads').select('id, created_at, name, ai_title, email, phone, suburb, source, needs_site_visit, status')
            .or('status.eq.new,status.is.null').order('created_at', { ascending: false }).limit(200),
          supabaseClient.from('projects').select('lead_id').not('lead_id', 'is', null),
          supabaseClient.from('callback_requests').select('id, created_at, name, phone, requested_date, requested_time, message, status')
            .in('status', ['pending', 'scheduled']).order('requested_date').order('requested_time').limit(100),
        ]);
        const taken = new Set((linkedRes.data || []).map(r => r.lead_id));
        pendingLeads = (leadsRes.data || []).filter(l => (l.email || l.phone) && !taken.has(l.id));
        openCalls = callsRes.data || [];
      }

      if (!projects.length && !pendingLeads.length && !openCalls.length) {
        list.innerHTML = `<div class="empty-state">
          <div class="empty-icon">&#128203;</div>
          <h2>No quotes yet</h2>
          <p>Build your first one to see it here.</p>
          <a class="btn" style="margin-top:10px; display:inline-flex;" href="/new-project.html">+ New quote</a>
        </div>`;
        return;
      }

      // Four distinct groups - Active means still pending (never sent),
      // Sent to Client once it has been, Approved once accepted (the
      // quote itself is now a frozen record - the job that was created
      // from it is a separate project entirely, not shown here), and
      // Archived for anything else (withdrawn, expired, etc).
      const pendingQuotes = projects.filter(p => p.status === 'draft');
      const sentQuotes = projects.filter(p => p.status === 'sent');
      const approvedQuotes = projects.filter(p => p.status === 'approved');
      const declinedQuotes = projects.filter(p => p.status === 'declined'); // the client said no (on the quote page, or marked by us)
      const archived = projects.filter(p => !['draft', 'sent', 'approved', 'declined'].includes(p.status));

      function buildRowsHtml(rowProjects) {
        return rowProjects.map((p, i) => {
          const stageCount = p.cost_centres.length;
          const stageLabel = `${stageCount} stage${stageCount === 1 ? '' : 's'}`;
          const nameDisplay = `${p.quote_number ? '#' + p.quote_number + ' - ' : ''}${escapeHtml(p.name)}`;
          const isLast = i === rowProjects.length - 1;
          const rowInner = !pricingVisible ? `
                <a class="project-list-item" href="/project.html?id=${p.id}" style="${isLast ? 'border-bottom:none;' : ''}">
                  <div>
                    <div class="name">${nameDisplay}</div>
                    <div class="meta">${escapeHtml(p.client_name)} &middot; ${stageLabel}</div>
                  </div>
                  <div style="text-align:right; min-width:160px;">
                    <span class="badge ${p.status}">${p.expired && p.status === 'declined' ? 'expired' : p.status.replace('_',' ')}</span>${p.status === 'sent' && p.valid_until ? ` <span class="subtitle" style="font-size:11px;">until ${new Date(p.valid_until + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })}</span>` : ''}
                  </div>
                </a>` : (() => {
            const quoted = p.cost_centres.reduce((s, c) => s + Number(c.quoted_amount), 0);
            const invoiced = p.cost_centres.reduce((s, c) => s + Number(c.invoiced_amount), 0);
            const pctInvoiced = quoted ? Math.min(100, Math.round((invoiced / quoted) * 100)) : 0;
            return `
                <a class="project-list-item" href="/project.html?id=${p.id}" style="${isLast ? 'border-bottom:none;' : ''}">
                  <div>
                    <div class="name">${nameDisplay}</div>
                    <div class="meta">${escapeHtml(p.client_name)} &middot; ${stageLabel} &middot; ${money(quoted)} quoted</div>
                  </div>
                  <div style="text-align:right; min-width:160px;">
                    <span class="badge ${p.status}">${p.expired && p.status === 'declined' ? 'expired' : p.status.replace('_',' ')}</span>${p.status === 'sent' && p.valid_until ? ` <span class="subtitle" style="font-size:11px;">until ${new Date(p.valid_until + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })}</span>` : ''}
                    <div class="meta" style="margin-top:6px;">${pctInvoiced}% invoiced</div>
                  </div>
                </a>`;
          })();

          if (!pricingVisible || !isDevModeActive()) return rowInner;
          return `
            <div style="display:flex; align-items:center; gap:10px; ${isLast ? '' : 'border-bottom:1px solid var(--border);'}">
              <input type="checkbox" class="quote-select" data-id="${p.id}" style="width:auto; flex-shrink:0;" />
              <div style="flex:1; min-width:0;">${rowInner}</div>
            </div>`;
        }).join('');
      }

      function bulkBarHtml() {
        if (!pricingVisible) return '';
        if (!isDevModeActive()) {
          return `<p class="subtitle" style="margin-bottom:10px;">Enable Dev Mode in Settings to bulk-select and delete quotes.</p>`;
        }
        return `
          <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
            <label style="display:flex; align-items:center; gap:8px; margin:0;">
              <input type="checkbox" class="select-all-quotes" style="width:auto;" /> Select all
            </label>
            <button type="button" class="bulk-delete-btn secondary" style="display:none;">Delete selected</button>
          </div>
          <div class="bulk-delete-msg"></div>`;
      }

      // Age of a lead: amber past 48 hours, red past 7 days, so nothing sits unnoticed.
      const HOUR = 60 * 60 * 1000;
      function ageInfo(iso) {
        const ms = Date.now() - new Date(iso).getTime();
        const label = ms < HOUR ? 'just now' : ms < 24 * HOUR ? Math.floor(ms / HOUR) + 'h' : Math.floor(ms / (24 * HOUR)) + (Math.floor(ms / (24 * HOUR)) === 1 ? ' day' : ' days');
        const colour = ms > 7 * 24 * HOUR ? 'var(--red)' : ms > 48 * HOUR ? 'var(--amber)' : 'var(--muted)';
        return { label, colour, late: ms > 48 * HOUR };
      }
      const sydneyToday = new Date().toLocaleDateString('en-CA', { timeZone: 'Australia/Sydney' });
      const sydneyHm = new Date().toLocaleTimeString('en-GB', { timeZone: 'Australia/Sydney', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
      const callLate = c => c.requested_date < sydneyToday || (c.requested_date === sydneyToday && String(c.requested_time).slice(0, 5) <= sydneyHm);
      const leadsLate = pendingLeads.some(l => ageInfo(l.created_at).late) || openCalls.some(callLate);

      function buildLeadRowsHtml() {
        const leadRows = pendingLeads.map((l, i) => {
          const age = ageInfo(l.created_at);
          const who = l.name || l.ai_title || l.email || l.phone;
          const meta = [l.suburb, l.source ? 'from ' + l.source : null].filter(Boolean).map(escapeHtml).join(' &middot; ');
          return `
            <a class="project-list-item" href="/leads.html?id=${encodeURIComponent(l.id)}" style="${i === pendingLeads.length - 1 ? 'border-bottom:none;' : ''}">
              <div>
                <div class="name">${escapeHtml(who)}</div>
                <div class="meta">${meta || 'Lead'}${l.ai_title && l.name ? ' &middot; ' + escapeHtml(l.ai_title) : ''}</div>
              </div>
              <div style="text-align:right; min-width:120px;">
                ${l.needs_site_visit ? '<span class="badge sent">site visit</span>' : '<span class="badge draft">new</span>'}
                <div class="meta" style="margin-top:6px; color:${age.colour}; font-weight:${age.late ? 600 : 400};">${age.label}</div>
              </div>
            </a>`;
        }).join('');
        const callRows = openCalls.map((c, i) => {
          const late = callLate(c);
          const when = new Date(c.requested_date + 'T00:00:00').toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' }) + ' ' + String(c.requested_time).slice(0, 5);
          return `
            <a class="project-list-item" href="/leads.html" style="${i === openCalls.length - 1 ? 'border-bottom:none;' : ''}">
              <div>
                <div class="name">${escapeHtml(c.name || c.phone)}</div>
                <div class="meta">${escapeHtml(c.phone)}${c.message ? ' &middot; ' + escapeHtml(String(c.message).slice(0, 80)) : ''}</div>
              </div>
              <div style="text-align:right; min-width:120px;">
                <span class="badge ${c.status === 'scheduled' ? 'sent' : 'draft'}">call ${escapeHtml(c.status)}</span>
                <div class="meta" style="margin-top:6px; color:${late ? 'var(--amber)' : 'inherit'}; font-weight:${late ? 600 : 400};">${escapeHtml(when)}</div>
              </div>
            </a>`;
        }).join('');
        return `
          ${pendingLeads.length ? leadRows : '<p class="subtitle">No leads waiting. New website leads land here until a quote or job is made from them.</p>'}
          ${openCalls.length ? `<h3 style="margin:18px 0 6px;">Call requests</h3>${callRows}` : ''}
          <p class="subtitle" style="margin-top:12px;"><a class="link-quiet" href="/leads.html">Open the Leads page</a></p>`;
      }

      list.innerHTML = `
        <div class="settings-tabs" id="quotes-tabs" style="flex-direction:row; position:static; border-bottom:1px solid var(--border); margin-bottom:16px; overflow-x:auto;">
          ${pricingVisible ? `<button class="settings-tab" data-panel="leads">Leads (${pendingLeads.length + openCalls.length})${leadsLate ? ' <span title="Waiting over 48 hours" style="display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--amber); vertical-align:middle; margin-left:4px;"></span>' : ''}</button>` : ''}
          <button class="settings-tab active" data-panel="active">Active (${pendingQuotes.length})</button>
          <button class="settings-tab" data-panel="sent">Sent to Client (${sentQuotes.length})</button>
          <button class="settings-tab" data-panel="approved">Approved (${approvedQuotes.length})</button>
          <button class="settings-tab" data-panel="declined">Declined (${declinedQuotes.length})</button>
          <button class="settings-tab" data-panel="archived">Archived (${archived.length})</button>
        </div>
        ${pricingVisible ? `<div class="settings-panel" id="panel-leads">${buildLeadRowsHtml()}</div>` : ''}
        <div class="settings-panel active" id="panel-active">
          ${bulkBarHtml()}
          ${pendingQuotes.length ? buildRowsHtml(pendingQuotes) : `<p class="subtitle">No pending quotes - still need to be sent to the client.</p>`}
        </div>
        <div class="settings-panel" id="panel-sent">
          ${bulkBarHtml()}
          ${sentQuotes.length ? buildRowsHtml(sentQuotes) : `<p class="subtitle">Nothing sent to a client yet.</p>`}
        </div>
        <div class="settings-panel" id="panel-approved">
          ${bulkBarHtml()}
          ${approvedQuotes.length ? buildRowsHtml(approvedQuotes) : `<p class="subtitle">No approved quotes yet - a quote stays here as a frozen record once accepted; the job it becomes is a separate record, in Projects.</p>`}
        </div>
        <div class="settings-panel" id="panel-declined">
          ${bulkBarHtml()}
          ${declinedQuotes.length ? buildRowsHtml(declinedQuotes) : `<p class="subtitle">No declined quotes. A quote lands here when the client declines it, or you mark it declined. Open it to reopen.</p>`}
        </div>
        <div class="settings-panel" id="panel-archived">
          ${bulkBarHtml()}
          ${archived.length ? buildRowsHtml(archived) : `<p class="subtitle">Nothing archived.</p>`}
        </div>`;

      document.querySelectorAll('#quotes-tabs .settings-tab').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('#quotes-tabs .settings-tab').forEach(b => b.classList.remove('active'));
          document.querySelectorAll('#list .settings-panel').forEach(p => p.classList.remove('active'));
          btn.classList.add('active');
          document.getElementById('panel-' + btn.dataset.panel).classList.add('active');
        });
      });

      if (pricingVisible) {
        wireBulkDelete(document.getElementById('panel-active'), projects);
        wireBulkDelete(document.getElementById('panel-sent'), projects);
        wireBulkDelete(document.getElementById('panel-approved'), projects);
        wireBulkDelete(document.getElementById('panel-declined'), projects);
        wireBulkDelete(document.getElementById('panel-archived'), projects);
      }
    })();

    function wireBulkDelete(panel, projects) {
      const selectAll = panel.querySelector('.select-all-quotes');
      const deleteBtn = panel.querySelector('.bulk-delete-btn');
      const msg = panel.querySelector('.bulk-delete-msg');
      if (!selectAll) return;

      function selectedCheckboxes() { return [...panel.querySelectorAll('.quote-select:checked')]; }
      function refreshDeleteBtn() {
        const n = selectedCheckboxes().length;
        deleteBtn.style.display = n ? 'inline-flex' : 'none';
        deleteBtn.textContent = `Delete selected (${n})`;
      }

      selectAll.addEventListener('change', () => {
        panel.querySelectorAll('.quote-select').forEach(cb => { cb.checked = selectAll.checked; });
        refreshDeleteBtn();
      });
      panel.querySelectorAll('.quote-select').forEach(cb => {
        cb.addEventListener('change', () => {
          if (!cb.checked) selectAll.checked = false;
          refreshDeleteBtn();
        });
      });

      deleteBtn.addEventListener('click', async () => {
        const ids = selectedCheckboxes().map(cb => cb.dataset.id);
        if (!ids.length) return;
        deleteBtn.disabled = true;
        deleteBtn.textContent = 'Checking...';
        msg.innerHTML = '';

        const blocked = [];
        const clear = [];
        for (const id of ids) {
          const project = projects.find(p => p.id === id);
          const reasons = await checkProjectHasActivity(project);
          if (reasons.length) blocked.push({ project, reasons });
          else clear.push(project);
        }

        const parts = [];
        if (blocked.length) {
          parts.push(`<div class="error-box">Not deleted, has real activity against it:<ul style="margin:6px 0 0 18px;">${blocked.map(b => `<li>${escapeHtml(b.project.name)} - ${b.reasons.join(', ')}</li>`).join('')}</ul></div>`);
        }
        if (!clear.length) {
          msg.innerHTML = parts.join('');
          deleteBtn.disabled = false;
          refreshDeleteBtn();
          return;
        }
        if (!confirm(`Delete ${clear.length} quote${clear.length === 1 ? '' : 's'} permanently? This can't be undone.\n\n${clear.map(p => p.name).join('\n')}`)) {
          deleteBtn.disabled = false;
          refreshDeleteBtn();
          return;
        }

        deleteBtn.textContent = 'Deleting...';
        const deleted = [];
        try {
          for (const p of clear) { await deleteProject(p.id); deleted.push(p); }
          parts.push(`<div class="success-box">Deleted ${clear.length} quote${clear.length === 1 ? '' : 's'}.</div>`);
          msg.innerHTML = parts.join('');
          location.reload();
        } catch (err) {
          // deleteProject stops at the first failed step. The quotes already gone come off the list here
          // (a page reload would wipe this message), so what is shown matches the database.
          parts.push(`<div class="error-box">${escapeHtml(err.message)}${deleted.length ? ` Deleted before it stopped: ${escapeHtml(deleted.map(p => p.name).join(', '))}.` : ''}</div>`);
          msg.innerHTML = parts.join('');
          deleted.forEach(p => { const cb = panel.querySelector(`.quote-select[data-id="${p.id}"]`); if (cb) cb.parentElement.remove(); });
          deleteBtn.disabled = false;
          refreshDeleteBtn();
        }
      });
    }
  </script>
</body>
</html>
