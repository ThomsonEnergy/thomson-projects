<!DOCTYPE html>

<meta charset="UTF-8" />

<title>Home - Thomson Energy</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />

<link rel="stylesheet" href="/css/style.css?v=12" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .quick-nav { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:12px; margin-bottom:24px; }
  .quick-nav a {
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
    background:var(--surface); border:1px solid var(--border); border-radius:10px;
    padding:20px 10px; text-decoration:none; color:var(--text); font-weight:600; font-size:13px;
    text-align:center;
  }
  .quick-nav a:hover { border-color:var(--accent); }
  .quick-nav .icon { font-size:26px; }
  .action-item {
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:10px 0; border-bottom:1px solid var(--border);
  }
  .action-item:last-child { border-bottom:none; }
  .feed-post { border-bottom:1px solid var(--border); padding:16px 0; }
  .feed-post:last-child { border-bottom:none; }
  .feed-author { font-weight:600; }
  .feed-meta { color:var(--muted); font-size:12px; }
  .feed-actions { display:flex; gap:16px; margin-top:8px; }
  .feed-like-btn { background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px; padding:2px 0; }
  .feed-like-btn.liked { color:var(--accent); font-weight:600; }
  .feed-comment { padding:8px 0 0 0; font-size:13px; }
  .feed-comment .feed-author { font-size:13px; }
</style>
</head>
<body>
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('mobile-menu-dropdown').classList.toggle('open')">&#9776;</button>
    <div class="mobile-menu-dropdown" id="mobile-menu-dropdown"></div>
    <nav class="topbar-tabs" id="topbar-tabs"></nav>
    <div class="topbar-right">
      <a href="/schedule.html" class="topbar-icon-link" title="Schedule">&#128197;</a>
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/home.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="wrap">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:4px;">
      <h1 id="greeting" style="margin:0 0 20px;">Home</h1>
      <div style="text-align:right;">
        <button type="button" id="clock-btn" class="btn" style="white-space:nowrap;">Clock in</button>
        <div id="clocked-into-line" class="subtitle" style="display:none; margin-top:6px; font-size:12px;"></div>
      </div>
    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <p class="subtitle" style="margin:0;">Your shortcuts - star any tab up top to add one, or edit here.</p>
      <button type="button" class="secondary" id="edit-quick-nav-btn" style="font-size:12px; padding:6px 10px;">Edit</button>
    </div>
    <div class="quick-nav" id="quick-nav"><p class="subtitle">Loading...</p></div>

    <div class="card">
      <h2>Needs attention</h2>
      <div id="action-items"><p class="subtitle">Loading...</p></div>
    </div>

    <div class="card">
      <h2>Company feed</h2>
      <textarea id="new-post-text" placeholder="Post something to the team..." style="min-height:70px;"></textarea>
      <button id="new-post-btn" style="margin-top:8px;">Post</button>
      <div id="feed-msg"></div>
      <div id="feed-list" style="margin-top:16px;"><p class="subtitle">Loading...</p></div>
    </div>
  </div>

  <script src="/js/supabase-client.js?v=19"></script>
  <script src="/js/theme.js"></script>
  <script>
    let myUserId, myRole, myName;

    // Reflects whether you're actually clocked in right now, rather than
    // always saying "Clock in" - clocking out from here uses the same
    // midnight-safe logic as My Day, so someone who just wants to knock
    // off doesn't have to go find the button on another page.
    async function refreshClockButton() {
      const btn = document.getElementById('clock-btn');
      const lineEl = document.getElementById('clocked-into-line');
      const { data } = await supabaseClient
        .from('time_entries')
        .select('id, staff_id, project_id, cost_centre_id, selected_cost_centre_ids, time_category, clock_in, projects(name, job_number, quote_number)')
        .eq('staff_id', myUserId)
        .is('clock_out', null)
        .order('clock_in', { ascending: false })
        .limit(1)
        .maybeSingle();

      if (data) {
        btn.textContent = 'Clock out';
        btn.classList.add('danger');
        btn.onclick = () => openClockOutModal(data, refreshClockButton);
        const jobLabel = data.projects ? projectRef(data.projects) : 'General / Office';
        lineEl.innerHTML = `Clocked into: ${jobLabel} &middot; <a href="/my-day.html" class="link-quiet">Switch job</a>`;
        lineEl.style.display = 'block';
      } else {
        btn.textContent = 'Clock in';
        btn.classList.remove('danger');
        btn.disabled = false;
        btn.onclick = () => { window.location.href = '/my-day.html'; };
        lineEl.style.display = 'none';
      }
    }

    // Driven by profiles.home_shortcuts (see MAIN_NAV_ITEMS/
    // getMyHomeShortcuts in supabase-client.js) - the same starred set the
    // topbar tabs' star toggle writes to, so starring a tab up top and
    // editing the order here are two views onto the one list.
    async function renderQuickNav() {
      const el = document.getElementById('quick-nav');
      const role = await getMyRole();
      const available = MAIN_NAV_ITEMS.filter(item => (!item.adminOnly || role === 'admin') && (!item.pricingOnly || isPricingRole(role)));
      const byKey = {}; available.forEach(i => { byKey[i.key] = i; });
      const shortcuts = await getMyHomeShortcuts();
      const ordered = shortcuts.map(k => byKey[k]).filter(Boolean);
      el.innerHTML = ordered.length
        ? ordered.map(item => `<a href="${item.href}"><span class="icon">${item.icon}</span>${item.label}</a>`).join('')
        : `<p class="subtitle">No shortcuts yet - star a tab up top, or click Edit to add some.</p>`;
    }

    // Persists a new shortcuts order/set - reverts the in-memory list and
    // shows what actually went wrong if the save fails, rather than
    // leaving the UI showing a change that never actually made it to the
    // database (exactly what happened before migration_107 - the write
    // itself was fine, but a missing column-level SELECT grant made every
    // *read-back* silently fall back to the defaults, which looked
    // identical to "didn't save").
    async function persistShortcuts(newShortcuts, previousShortcuts, msgEl) {
      try {
        await setMyHomeShortcuts(newShortcuts);
        if (msgEl) msgEl.innerHTML = '';
        return true;
      } catch (err) {
        if (msgEl) msgEl.innerHTML = `<div class="error-box">Could not save: ${err.message}</div>`;
        newShortcuts.length = 0;
        newShortcuts.push(...previousShortcuts);
        return false;
      }
    }

    function openEditQuickNavPanel() {
      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:200; padding:16px;';
      overlay.innerHTML = `<div class="card" style="max-width:480px; width:100%; max-height:85vh; overflow-y:auto;"><p class="subtitle">Loading...</p></div>`;
      document.body.appendChild(overlay);

      (async () => {
        const role = await getMyRole();
        const available = MAIN_NAV_ITEMS.filter(item => (!item.adminOnly || role === 'admin') && (!item.pricingOnly || isPricingRole(role)));
        const byKey = {}; available.forEach(i => { byKey[i.key] = i; });
        let shortcuts = (await getMyHomeShortcuts()).filter(k => byKey[k]);
        const notShown = () => available.filter(i => !shortcuts.includes(i.key));
        // Hoisted above render() so it survives the re-renders a drag
        // itself triggers (each swap rebuilds the whole list, which would
        // otherwise reset a locally-scoped drag state back to "not
        // dragging" after the very first swap). dragStartOrder is
        // captured once, at pointerdown - "previous" for a revert-on-
        // failure has to mean "before this drag started", not "one swap
        // ago", or a failed save would just re-show the already-reordered
        // list instead of actually reverting anything.
        let draggingKey = null;
        let dragStartOrder = null;

        function render() {
          overlay.innerHTML = `
            <div class="card" style="max-width:480px; width:100%; max-height:85vh; overflow-y:auto;">
              <h2>Edit shortcuts</h2>
              <p class="subtitle" style="margin-bottom:10px;">Drag the handle to reorder, or remove/add below.</p>
              <div id="eqn-current">
                ${shortcuts.length ? shortcuts.map((key) => `
                  <div class="eqn-row" data-key="${key}" style="display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 0; border-bottom:1px solid var(--border); background:var(--surface);">
                    <span style="display:flex; align-items:center; gap:8px;">
                      <span class="eqn-drag-handle" style="cursor:grab; touch-action:none; color:var(--muted); font-size:16px; padding:4px;">&#9776;</span>
                      ${byKey[key].icon ? byKey[key].icon + ' ' : ''}${byKey[key].label}
                    </span>
                    <button type="button" class="secondary eqn-remove-btn" data-key="${key}" style="font-size:11px; padding:4px 8px;">Remove</button>
                  </div>`).join('') : '<p class="subtitle">Nothing shown yet.</p>'}
              </div>
              <div id="eqn-msg"></div>

              ${notShown().length ? `
                <p class="subtitle" style="margin:14px 0 6px; font-weight:600;">Add</p>
                <div id="eqn-add-list">
                  ${notShown().map(item => `
                    <div style="display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid var(--border);">
                      <span>${item.icon ? item.icon + ' ' : ''}${item.label}</span>
                      <button type="button" class="secondary eqn-add-btn" data-key="${item.key}" style="font-size:11px; padding:4px 8px;">+ Add</button>
                    </div>`).join('')}
                </div>
              ` : ''}

              <button type="button" id="eqn-close-btn" style="margin-top:14px; width:100%;">Done</button>
            </div>`;

          const msgEl = overlay.querySelector('#eqn-msg');
          const listEl = overlay.querySelector('#eqn-current');

          // Drag-to-reorder via Pointer Events (covers mouse and touch in
          // one code path, unlike HTML5 drag-and-drop which never fires on
          // touch at all - see the same fix applied to schedule.html).
          // Swaps live as the pointer crosses another row's position,
          // rather than trying to animate a floating dragged element -
          // simpler to get right, and the list is short enough that a
          // full re-render per swap is imperceptible.
          listEl.querySelectorAll('.eqn-drag-handle').forEach(handle => {
            handle.addEventListener('pointerdown', (e) => {
              e.preventDefault();
              draggingKey = handle.closest('.eqn-row').dataset.key;
              dragStartOrder = shortcuts.slice();
              handle.setPointerCapture(e.pointerId);
              handle.closest('.eqn-row').style.opacity = '0.5';
            });
          });
          listEl.addEventListener('pointermove', (e) => {
            if (!draggingKey) return;
            const overRow = document.elementFromPoint(e.clientX, e.clientY)?.closest('.eqn-row');
            if (!overRow || overRow.dataset.key === draggingKey) return;
            const fromIdx = shortcuts.indexOf(draggingKey);
            const toIdx = shortcuts.indexOf(overRow.dataset.key);
            if (fromIdx === -1 || toIdx === -1) return;
            shortcuts.splice(toIdx, 0, shortcuts.splice(fromIdx, 1)[0]);
            render();
          });
          listEl.addEventListener('pointerup', async () => {
            if (!draggingKey) return;
            draggingKey = null;
            await persistShortcuts(shortcuts, dragStartOrder, msgEl);
            render();
            renderQuickNav();
          });
          listEl.addEventListener('pointercancel', () => { draggingKey = null; });

          overlay.querySelectorAll('.eqn-remove-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
              const previous = shortcuts.slice();
              shortcuts = shortcuts.filter(k => k !== btn.dataset.key);
              await persistShortcuts(shortcuts, previous, msgEl);
              render();
              renderQuickNav();
            });
          });
          overlay.querySelectorAll('.eqn-add-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
              const previous = shortcuts.slice();
              shortcuts = [...shortcuts, btn.dataset.key];
              await persistShortcuts(shortcuts, previous, msgEl);
              render();
              renderQuickNav();
            });
          });
          overlay.querySelector('#eqn-close-btn').addEventListener('click', () => overlay.remove());
        }
        render();
      })();
    }
    document.getElementById('edit-quick-nav-btn').addEventListener('click', openEditQuickNavPanel);

    async function loadActionItems() {
      const el = document.getElementById('action-items');
      const items = [];
      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

      // Today's schedule for this person
      const { data: mySchedule } = await supabaseClient
        .from('schedule_assignments')
        .select('project_id, projects(name, job_number, quote_number)')
        .eq('staff_id', myUserId)
        .eq('assignment_date', todayStr);
      (mySchedule || []).forEach(a => {
        items.push({ label: `You're scheduled today: ${a.projects ? projectRef(a.projects) : 'General / Office'}`, link: a.project_id ? `/project.html?id=${a.project_id}` : null });
      });

      // Tasks assigned to you or your role
      const { data: myTasks } = await supabaseClient
        .from('job_tasks')
        .select('id')
        .eq('completed', false)
        .or(`assigned_to_user_id.eq.${myUserId},assigned_to_role.eq.${myRole}`);
      if (myTasks && myTasks.length) {
        items.push({ label: `${myTasks.length} task${myTasks.length === 1 ? '' : 's'} assigned to you`, link: '/tasks.html' });
      }

      // Jobs flagged Not Complete - relevant to everyone, no $ involved
      const { data: notComplete } = await supabaseClient
        .from('projects')
        .select('id, name, job_number')
        .eq('pipeline_stage', 'job_not_complete');
      (notComplete || []).forEach(p => {
        items.push({ label: `Job flagged not complete: #${p.job_number || '-'} ${p.name}`, link: `/project.html?id=${p.id}` });
      });

      const isPricing = ['admin', 'finance', 'sales'].includes(myRole);
      if (isPricing) {
        const { data: draftQuotes } = await supabaseClient
          .from('projects')
          .select('id, name, quote_number')
          .eq('pipeline_stage', 'draft_quote');
        (draftQuotes || []).forEach(p => {
          items.push({ label: `Draft quote needs finishing: ${projectRef(p)}`, link: `/new-project.html?id=${p.id}` });
        });

        const { data: invoices } = await supabaseClient
          .from('invoices')
          .select('id, invoice_number, sent_at, paid_at, labour_amount, material_amount, stc_amount')
          .is('paid_at', null);
        (invoices || []).forEach(inv => {
          const daysSince = (today - new Date(inv.sent_at)) / 86400000;
          if (daysSince > 14) {
            items.push({ label: `Overdue: invoice ${inv.invoice_number} (${Math.floor(daysSince)} days)`, link: '/invoices.html' });
          }
        });
      }

      if (myRole === 'admin' || myRole === 'finance') {
        const { data: pendingLeave } = await supabaseClient
          .from('leave_requests')
          .select('id, profiles(full_name)')
          .eq('status', 'pending');
        (pendingLeave || []).forEach(lr => {
          items.push({ label: `Leave request pending: ${lr.profiles ? lr.profiles.full_name : 'a staff member'}`, link: '/timesheets.html' });
        });

        // Onboarding no longer blocks on a pending employment contract (an
        // admin might still be drafting it), so this is Finance/Admin's own
        // visibility that one's still outstanding for an active staff
        // member - easy to lose track of otherwise since nothing else
        // surfaces it once someone's already using the app day to day.
        const [{ data: allContracts }, { data: activeStaff }] = await Promise.all([
          supabaseClient.from('employee_contracts').select('profile_id, status'),
          supabaseClient.from('profiles').select('id, full_name').eq('active', true),
        ]);
        (activeStaff || []).forEach(s => {
          const c = (allContracts || []).find(x => x.profile_id === s.id);
          if (!c || c.status !== 'signed') {
            items.push({ label: `Employment contract not completed: ${s.full_name || 'a staff member'}${c ? ` (${c.status.replace(/_/g, ' ')})` : ' (not started)'}`, link: '/settings.html' });
          }
        });
      }

      // Your own employment contract, if not yet fully signed - the same
      // reason as above, just addressed to you instead of Finance/Admin.
      const { data: myContract } = await supabaseClient.from('employee_contracts').select('status').eq('profile_id', myUserId).maybeSingle();
      if (!myContract || myContract.status !== 'signed') {
        items.push({
          label: `Your employment contract isn't completed yet${myContract?.status === 'ready_to_sign' ? " - it's ready for you to sign" : ' - still being prepared'}`,
          link: '/onboarding.html',
        });
      }

      if (myRole === 'admin') {
        const in30 = new Date(today.getTime() + 30 * 86400000);
        const in30Str = `${in30.getFullYear()}-${String(in30.getMonth() + 1).padStart(2, '0')}-${String(in30.getDate()).padStart(2, '0')}`;

        const { data: credentials } = await supabaseClient
          .from('company_credentials')
          .select('name, expiry_date')
          .not('expiry_date', 'is', null)
          .lte('expiry_date', in30Str);
        (credentials || []).forEach(c => {
          const isExpired = c.expiry_date < todayStr;
          items.push({ label: `${isExpired ? 'Expired' : 'Expiring soon'}: ${c.name} (${new Date(c.expiry_date).toLocaleDateString('en-AU')})`, link: '/settings.html' });
        });

        const [{ data: expiringLicences }, { data: staffForLicences }] = await Promise.all([
          supabaseClient.from('profile_licences').select('profile_id, licence_name, expiry_date').not('expiry_date', 'is', null).lte('expiry_date', in30Str),
          supabaseClient.from('profiles').select('id, full_name'),
        ]);
        (expiringLicences || []).forEach(l => {
          const isExpired = l.expiry_date < todayStr;
          const who = (staffForLicences || []).find(s => s.id === l.profile_id)?.full_name || 'a staff member';
          items.push({ label: `${isExpired ? 'Expired' : 'Expiring soon'}: ${who}'s ${l.licence_name} (${new Date(l.expiry_date).toLocaleDateString('en-AU')})`, link: '/settings.html' });
        });
      }

      if (!items.length) {
        el.innerHTML = `<p class="subtitle">Nothing needs your attention right now.</p>`;
        return;
      }
      el.innerHTML = items.map(i => `
        <div class="action-item">
          <span>${i.label}</span>
          ${i.link ? `<a class="link-quiet" href="${i.link}" style="font-size:12px;">View</a>` : ''}
        </div>`).join('');
    }

    // Real, verified quotes only - an AI-generated "famous quote" risks
    // misattributing or slightly misquoting someone, which matters when
    // it's presented as a genuine quote from a real person. Picked
    // deterministically by day of year (Sydney date, matching how the
    // rest of the app treats "today") rather than Math.random(), so
    // everyone sees the same one on a given day and it changes daily
    // without needing a shared cache/DB round-trip the old AI version
    // needed.
    const INSPIRATIONAL_QUOTES = [
      { text: 'The only way to do great work is to love what you do.', author: 'Steve Jobs' },
      { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: 'Winston Churchill' },
      { text: 'The future belongs to those who believe in the beauty of their dreams.', author: 'Eleanor Roosevelt' },
      { text: 'It does not matter how slowly you go as long as you do not stop.', author: 'Confucius' },
      { text: 'Our greatest glory is not in never falling, but in rising every time we fall.', author: 'Confucius' },
      { text: 'The way to get started is to quit talking and begin doing.', author: 'Walt Disney' },
      { text: "Believe you can and you're halfway there.", author: 'Theodore Roosevelt' },
      { text: "Whether you think you can or you think you can't, you're right.", author: 'Henry Ford' },
      { text: "I have not failed. I've just found 10,000 ways that won't work.", author: 'Thomas Edison' },
      { text: 'The only limit to our realization of tomorrow is our doubts of today.', author: 'Franklin D. Roosevelt' },
      { text: 'Do not wait to strike till the iron is hot, but make it hot by striking.', author: 'William Butler Yeats' },
      { text: 'Hard work beats talent when talent fails to work hard.', author: 'Tim Notke' },
      { text: 'Quality means doing it right when no one is looking.', author: 'Henry Ford' },
      { text: "You miss 100% of the shots you don't take.", author: 'Wayne Gretzky' },
      { text: 'The harder I work, the luckier I get.', author: 'Samuel Goldwyn' },
      { text: 'Perseverance is not a long race; it is many short races one after the other.', author: 'Walter Elliot' },
      { text: 'Well done is better than well said.', author: 'Benjamin Franklin' },
      { text: 'A journey of a thousand miles begins with a single step.', author: 'Lao Tzu' },
      { text: 'The best way to predict the future is to create it.', author: 'Peter Drucker' },
      { text: 'Great things are done by a series of small things brought together.', author: 'Vincent van Gogh' },
      { text: 'The secret of getting ahead is getting started.', author: 'Mark Twain' },
      { text: "It always seems impossible until it's done.", author: 'Nelson Mandela' },
      { text: 'Action is the foundational key to all success.', author: 'Pablo Picasso' },
      { text: 'You are never too old to set another goal or to dream a new dream.', author: 'C.S. Lewis' },
      { text: 'Start where you are. Use what you have. Do what you can.', author: 'Arthur Ashe' },
      { text: "Don't watch the clock; do what it does. Keep going.", author: 'Sam Levenson' },
      { text: 'Success usually comes to those who are too busy to be looking for it.', author: 'Henry David Thoreau' },
      { text: 'The only place where success comes before work is in the dictionary.', author: 'Vidal Sassoon' },
      { text: 'Energy and persistence conquer all things.', author: 'Benjamin Franklin' },
      { text: 'If you want to lift yourself up, lift up someone else.', author: 'Booker T. Washington' },
      { text: "You can't build a reputation on what you are going to do.", author: 'Henry Ford' },
      { text: 'Never let the fear of striking out keep you from playing the game.', author: 'Babe Ruth' },
      { text: "Don't be afraid to give up the good to go for the great.", author: 'John D. Rockefeller' },
      { text: 'Try not to become a person of success, but rather try to become a person of value.', author: 'Albert Einstein' },
    ];

    function loadDailyGreeting(firstName) {
      // #greeting already shows a plain "Welcome back, {name}" fallback -
      // only swap it out once the quote's actually picked, so there's
      // never a blank heading, though this resolves instantly (no fetch).
      const el = document.getElementById('greeting');
      const sydneyDateStr = new Date().toLocaleDateString('en-CA', { timeZone: 'Australia/Sydney' });
      const dayOfYear = Math.floor((new Date(sydneyDateStr) - new Date(sydneyDateStr.slice(0, 4) + '-01-01')) / 86400000);
      const quote = INSPIRATIONAL_QUOTES[dayOfYear % INSPIRATIONAL_QUOTES.length];
      el.textContent = `Welcome back, ${firstName || 'there'}. "${quote.text}" - ${quote.author}`;
    }

    async function loadFeed() {
      const el = document.getElementById('feed-list');
      const { data: posts, error } = await supabaseClient
        .from('feed_posts')
        .select('*, profiles(full_name)')
        .order('created_at', { ascending: false })
        .limit(30);
      if (error) { el.innerHTML = `<div class="error-box">${error.message}</div>`; return; }
      if (!posts.length) { el.innerHTML = `<p class="subtitle">No posts yet - be the first.</p>`; return; }

      const postIds = posts.map(p => p.id);
      const { data: likes } = await supabaseClient.from('feed_likes').select('post_id, author_id').in('post_id', postIds);
      const { data: comments } = await supabaseClient.from('feed_comments').select('*, profiles(full_name)').in('post_id', postIds).order('created_at');

      el.innerHTML = posts.map(post => {
        const postLikes = (likes || []).filter(l => l.post_id === post.id);
        const iLiked = postLikes.some(l => l.author_id === myUserId);
        const postComments = (comments || []).filter(c => c.post_id === post.id);
        return `
          <div class="feed-post" data-post-id="${post.id}">
            <div class="feed-author">${post.profiles ? post.profiles.full_name : 'Someone'}</div>
            <div class="feed-meta">${new Date(post.created_at).toLocaleString('en-AU', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })}</div>
            <p style="margin:8px 0 0; white-space:pre-wrap;">${post.message}</p>
            <div class="feed-actions">
              <button class="feed-like-btn ${iLiked ? 'liked' : ''}" data-post-id="${post.id}" data-liked="${iLiked}">
                &#128077; ${postLikes.length || ''} ${iLiked ? 'Liked' : 'Like'}
              </button>
              <button class="feed-like-btn toggle-comments-btn" data-post-id="${post.id}">&#128172; Comment${postComments.length ? ' (' + postComments.length + ')' : ''}</button>
            </div>
            <div class="feed-comments" data-post-id="${post.id}" style="display:none; margin-top:10px; padding-left:12px; border-left:2px solid var(--border);">
              ${postComments.map(c => `
                <div class="feed-comment">
                  <span class="feed-author">${c.profiles ? c.profiles.full_name : 'Someone'}</span>
                  <span class="feed-meta">${new Date(c.created_at).toLocaleString('en-AU', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })}</span>
                  <div>${c.message}</div>
                </div>`).join('')}
              <div style="display:flex; gap:8px; margin-top:8px;">
                <input class="new-comment-input" data-post-id="${post.id}" placeholder="Write a comment..." style="flex:1;" />
                <button class="secondary send-comment-btn" data-post-id="${post.id}" style="padding:8px 14px;">Send</button>
              </div>
            </div>
          </div>`;
      }).join('');

      el.querySelectorAll('.feed-like-btn[data-liked]').forEach(btn => {
        btn.addEventListener('click', async () => {
          const postId = btn.dataset.postId;
          const liked = btn.dataset.liked === 'true';
          if (liked) {
            await supabaseClient.from('feed_likes').delete().eq('post_id', postId).eq('author_id', myUserId);
          } else {
            await supabaseClient.from('feed_likes').insert({ post_id: postId, author_id: myUserId });
          }
          await loadFeed();
        });
      });

      el.querySelectorAll('.toggle-comments-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const panel = el.querySelector(`.feed-comments[data-post-id="${btn.dataset.postId}"]`);
          panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        });
      });

      el.querySelectorAll('.send-comment-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          const postId = btn.dataset.postId;
          const input = el.querySelector(`.new-comment-input[data-post-id="${postId}"]`);
          const message = input.value.trim();
          if (!message) return;
          btn.disabled = true;
          const { error } = await supabaseClient.from('feed_comments').insert({ post_id: postId, author_id: myUserId, message });
          if (error) { alert(error.message); btn.disabled = false; return; }
          await loadFeed();
        });
      });
    }

    document.getElementById('new-post-btn').addEventListener('click', async () => {
      const msg = document.getElementById('feed-msg');
      const textEl = document.getElementById('new-post-text');
      const message = textEl.value.trim();
      if (!message) return;
      const btn = document.getElementById('new-post-btn');
      btn.disabled = true;
      const { error } = await supabaseClient.from('feed_posts').insert({ author_id: myUserId, message });
      if (error) { msg.innerHTML = `<div class="error-box">${error.message}</div>`; btn.disabled = false; return; }
      textEl.value = '';
      msg.innerHTML = '';
      btn.disabled = false;
      await loadFeed();
    });

    (async function () {
      const session = await requireLogin();
      if (!session) return;
      myUserId = session.user.id;
      syncThemeFromProfile();
      renderMainNav(null);
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });

      const { data: profile } = await supabaseClient.from('profiles').select('role, full_name').eq('id', myUserId).maybeSingle();
      myRole = profile?.role || 'staff';
      myName = profile?.full_name || '';
      const firstName = myName ? myName.split(' ')[0] : '';
      loadDailyGreeting(firstName);

      await refreshClockButton();
      await renderQuickNav();
      await loadActionItems();
      await loadFeed();
    })();
  </script>
</body>
</html>
