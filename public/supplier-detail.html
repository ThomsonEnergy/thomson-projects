<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('te-theme') || (matchMedia('(pointer: coarse)').matches ? 'dark' : 'navy'));</script>
<title>Supplier - TEops</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=23" />
<script src="/js/vendor/supabase-2.js?v=1"></script>
</head>
<body>
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('mobile-menu-dropdown').classList.toggle('open')">&#9776;</button>
    <div class="mobile-menu-dropdown" id="mobile-menu-dropdown"></div>
    <nav class="topbar-tabs" id="topbar-tabs"></nav>
    <div class="topbar-right">
      <a href="/schedule.html" class="topbar-icon-link" title="Schedule">&#128197;</a>
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/home.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="wrap wide" id="content">
    <p class="subtitle">Loading...</p>
  </div>

  <script src="/js/supabase-client.js?v=112"></script>
  <script src="/js/theme.js?v=2"></script>
  <script>
    const supplierId = new URLSearchParams(window.location.search).get('id');
    let currentSupplier = null;
    const CREDIT_TERMS_LABELS = { cod: 'COD', net_days: 'days', eom_days: 'days after end of month' };

    async function loadSupplier() {
      const { data: supplier, error } = await supabaseClient.from('suppliers').select('*').eq('id', supplierId).single();
      if (error || !supplier) {
        document.getElementById('content').innerHTML = `<div class="error-box">Supplier not found.</div>`;
        return;
      }
      currentSupplier = supplier;

      const { data: summaryRows } = await supabaseClient.rpc('get_supplier_financial_summary', { p_supplier_id: supplierId });
      const summary = summaryRows?.[0] || { invoiced_not_paid: 0, approved_for_payment: 0, not_approved: 0, overdue: 0 };

      const { data: bills } = await supabaseClient
        .from('supplier_bills')
        .select('*, purchase_orders(id, po_number, description, received, closed_at)')
        .eq('supplier_id', supplierId)
        .order('bill_date', { ascending: false });

      const { data: flaggedItems } = await supabaseClient
        .from('supplier_bill_line_items')
        .select('*, supplier_bills!inner(supplier_id, bill_number)')
        .eq('supplier_bills.supplier_id', supplierId)
        .not('flag_reason', 'is', null);

      const { data: pos } = await supabaseClient
        .from('purchase_orders')
        .select('*, purchase_order_line_items(*)')
        .eq('supplier_id', supplierId)
        .order('created_at', { ascending: false });

      const myRole = await getMyRole();
      const billsByPo = await loadBillsForPos((pos || []).map(p => p.id));
      render(supplier, summary, bills || [], flaggedItems || [], pos || [], myRole, billsByPo);
    }

    function render(supplier, summary, bills, flaggedItems, pos, myRole, billsByPo) {
      const canPay = isFinanceRole(myRole);
      const dayText = (iso) => iso ? new Date(iso + 'T00:00:00').toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : '-';
      const terms = supplier.credit_terms_type === 'cod' ? 'COD' : `${supplier.credit_terms_days} ${CREDIT_TERMS_LABELS[supplier.credit_terms_type]}`;
      if (typeof setPageTitle === 'function') setPageTitle(supplier.name || 'Supplier');
      else document.title = `${supplier.name || 'Supplier'} - TEops`;

      document.getElementById('content').innerHTML = `
        <a href="/suppliers.html" class="link-quiet">&larr; Suppliers</a>
        <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px; margin-top:8px;">
          <div>
            <h1>${escapeHtml(supplier.name)}${supplier.kind === 'contractor' ? ' <span class="badge draft" style="vertical-align:middle;">Contractor</span>' : ''}</h1>
            <p class="subtitle">${supplier.abn ? 'ABN ' + escapeHtml(supplier.abn) + (supplier.abn_legal_name ? ' (' + escapeHtml(supplier.abn_legal_name) + (supplier.gst_registered === false ? ', not registered for GST' : '') + ')' : '') + ' &middot; ' : ''}${escapeHtml(terms)}${supplier.contact_email ? ' &middot; ' + escapeHtml(supplier.contact_email) : ''}${supplier.contact_phone ? ' &middot; ' + escapeHtml(supplier.contact_phone) : ''}</p>
          </div>
          <div>
            <button class="secondary" id="edit-supplier-btn" style="margin-right:8px;">Edit details</button>
            <button class="secondary" id="upload-bill-btn" style="margin-right:8px;">Upload bill</button>
            <button class="secondary" id="upload-pricelist-btn" style="margin-right:8px;">Upload pricelist</button>
            <button class="secondary" id="upload-statement-btn">Upload statement</button>
          </div>
        </div>

        ${supplier.needs_review ? `<div class="error-box" style="margin:10px 0;">Created automatically from ${supplier.created_from === 'price_list' ? 'a price list' : 'an emailed bill'}. Check the details, especially the bank account (call them on a number you already have), then press Edit details and Save. Bills from them cannot be approved for payment until then.</div>` : ''}
        <div class="grid cols-4">
          <div class="stat"><div class="label">Invoiced, not paid</div><div class="value">${money(summary.invoiced_not_paid)}</div></div>
          <div class="stat"><div class="label">Approved for payment</div><div class="value">${money(summary.approved_for_payment)}</div></div>
          <div class="stat"><div class="label">Not approved</div><div class="value">${money(summary.not_approved)}</div></div>
          <div class="stat"><div class="label">Overdue</div><div class="value" style="color:${Number(summary.overdue) > 0 ? 'var(--red)' : 'inherit'};">${money(summary.overdue)}</div></div>
        </div>

        ${flaggedItems.length ? `
        <div class="card">
          <h2>Needs attention</h2>
          <p class="subtitle" style="margin-bottom:10px;">Line items that don't match an approved PO, or were charged higher than expected.</p>
          ${flaggedItems.map(fi => `
            <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--border);">
              <div>
                <p style="margin:0 0 2px;">${escapeHtml(fi.description)}</p>
                <p class="subtitle" style="margin:0; color:var(--red);">${escapeHtml(fi.flag_reason)} - bill ${escapeHtml(fi.supplier_bills.bill_number)}</p>
              </div>
            </div>`).join('')}
        </div>` : ''}

        <div class="card">
          <h2>Bills</h2>
          <div id="bills-list">
            ${!bills.length ? '<p class="subtitle">No bills logged yet.</p>' : `
            <table class="responsive-stack">
              <thead><tr><th>Bill #</th><th>Date</th><th>PO</th><th class="num">Amount</th><th>Terms due</th><th>Pay on</th><th>Status</th><th></th></tr></thead>
              <tbody>
                ${bills.map(b => `
                  <tr>
                    <td data-label="Bill #">${escapeHtml(b.bill_number || '-')}</td>
                    <td data-label="Date">${b.bill_date ? new Date(b.bill_date).toLocaleDateString('en-AU') : '-'}</td>
                    <td data-label="PO">${escapeHtml(b.purchase_orders?.po_number || '-')}</td>
                    <td class="num" data-label="Amount">${money(b.amount)}</td>
                    <td data-label="Terms due">${dayText(b.due_date)}</td>
                    <td data-label="Pay on">${b.paid ? '-' : (b.approved_for_payment ? dayText(b.pay_on || b.due_date) : '<span class="subtitle" style="font-size:12px;">after approval</span>')}</td>
                    <td data-label="Status">${b.paid ? `<span class="badge accepted" title="${escapeHtml(b.payment_reference || '')}">Paid ${b.paid_at ? dayText(b.paid_at.slice(0, 10)) : ''}</span>`
                      : b.approved_for_payment ? '<span class="badge sent">Approved</span>'
                      : b.purchase_orders && !b.purchase_orders.closed_at ? '<span class="badge draft">Waiting on PO close</span>'
                      : '<span class="badge draft">Not approved</span>'}</td>
                    <td data-label="">${!b.paid && !b.approved_for_payment ? (
                      b.purchase_orders
                        ? (b.purchase_orders.closed_at ? '<span class="subtitle" style="font-size:12px;">See Bill checks</span>' : '<span class="subtitle" style="font-size:12px;">Approved when the PO is closed</span>')
                        : (supplier.needs_review ? '<span class="subtitle" style="font-size:12px;">Check supplier details first</span>' : `<button class="secondary approve-bill-btn" data-id="${b.id}" style="font-size:12px; padding:6px 10px;">Approve</button>`)
                    ) : ''}${!b.paid && b.approved_for_payment && canPay ? `<button class="secondary paid-bill-btn" data-id="${b.id}" data-number="${escapeHtml(b.bill_number || '')}" style="font-size:12px; padding:6px 10px;">Paid</button>` : ''}${b.paid && canPay ? `<button class="secondary unpaid-bill-btn" data-id="${b.id}" style="font-size:12px; padding:6px 10px;">Not paid</button>` : ''}</td>
                  </tr>`).join('')}
              </tbody>
            </table>`}
          </div>
        </div>

        <div class="card">
          <h2>Purchase orders</h2>
          <div id="pos-list">
            ${!pos.length ? '<p class="subtitle">No purchase orders for this supplier yet.</p>' : pos.map(po => `
              <div style="border:1px solid var(--border); border-radius:8px; padding:12px; margin-bottom:10px;">
                <div style="display:flex; justify-content:space-between;">
                  <strong>${escapeHtml(po.po_number || 'PO')}</strong>${renderPoBadges(po)}
                </div>
                <p class="subtitle" style="margin:4px 0 8px;">${escapeHtml(po.description)}</p>
                ${renderPoLineItemsReceivable(po, true)}
                ${renderPoBills(billsByPo[po.id], po, myRole)}
                ${po.budget_cap ? `<p class="subtitle" style="margin-top:8px;">Budget cap: ${money(po.budget_cap)}</p>` : ''}
                ${!po.closed_at ? `<button type="button" class="secondary upload-invoice-btn" data-po-id="${po.id}" style="font-size:12px; padding:6px 10px; margin-top:8px;">Upload invoice for this PO</button>` : ''}
              </div>`).join('')}
          </div>
        </div>

        <div class="card">
          <h2>Activity log</h2>
          <div id="supplier-activity-log"><p class="subtitle">Loading...</p></div>
        </div>
      `;

      renderActivityLog('supplier', supplier.id, 'supplier-activity-log');
      // Approve, Paid and Not paid all run on the server (who, when, pay-on date, the payment batch).
      async function callServer(fn, body) {
        const { data: { session } } = await supabaseClient.auth.getSession();
        const res = await fetch(`/.netlify/functions/${fn}`, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` }, body: JSON.stringify(body) });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.ok) throw new Error(data.error || `Failed (${res.status})`);
        return data;
      }
      const busy = async (btn, working, fn) => {
        const label = btn.textContent;
        btn.disabled = true; btn.textContent = working;
        try { await fn(); await loadSupplier(); }
        catch (err) { alert(friendlyError(err)); btn.disabled = false; btn.textContent = label; }
      };
      document.querySelectorAll('.approve-bill-btn').forEach(btn => btn.addEventListener('click', () =>
        busy(btn, 'Approving...', () => callServer('supplier-checks', { action: 'approve_bill', id: btn.dataset.id }))));
      document.querySelectorAll('.paid-bill-btn').forEach(btn => btn.addEventListener('click', () => {
        const paidOn = prompt(`Bill ${btn.dataset.number} paid on which day? (YYYY-MM-DD)`, sydneyDateKey(new Date()));
        if (paidOn === null) return;
        if (!/^\d{4}-\d{2}-\d{2}$/.test(paidOn.trim())) { alert('Enter the date as YYYY-MM-DD.'); return; }
        const reference = prompt('Payment reference (optional, e.g. Airwallex transfer or bank reference)', '');
        if (reference === null) return;
        busy(btn, 'Saving...', () => callServer('run-supplier-payments', { action: 'mark_paid', bill_ids: [btn.dataset.id], paid_on: paidOn.trim(), reference }));
      }));
      document.querySelectorAll('.unpaid-bill-btn').forEach(btn => btn.addEventListener('click', () => {
        const note = prompt('Mark this bill as not paid. Why?', '');
        if (note === null) return;
        busy(btn, 'Saving...', () => callServer('run-supplier-payments', { action: 'undo_paid', bill_id: btn.dataset.id, note }));
      }));

      document.querySelectorAll('.upload-invoice-btn').forEach(btn => {
        btn.addEventListener('click', () => uploadInvoiceForPo(pos.find(p => p.id === btn.dataset.poId)));
      });
      wirePoBillButtons(document.getElementById('pos-list'), loadSupplier);

      wireReceiveLineItemButtons(
        document.getElementById('pos-list'),
        pos,
        (po) => po.project_id ? 'job' : po.vehicle_id ? 'vehicle' : 'warehouse',
        loadSupplier
      );

      document.getElementById('edit-supplier-btn').addEventListener('click', () => openEditPanel(supplier));
      document.getElementById('upload-bill-btn').addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.pdf,.jpg,.jpeg,.png';
        input.onchange = async (e) => {
          const file = e.target.files[0];
          if (file) await runExtraction(file);
        };
        input.click();
      });
      document.getElementById('upload-pricelist-btn').addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.pdf,.jpg,.jpeg,.png';
        input.onchange = async (e) => {
          const file = e.target.files[0];
          if (file) await runPricelistExtraction(file);
        };
        input.click();
      });
      document.getElementById('upload-statement-btn').addEventListener('click', () => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.pdf,.jpg,.jpeg,.png';
        input.onchange = async (e) => {
          const file = e.target.files[0];
          if (file) await runStatementExtraction(file);
        };
        input.click();
      });
    }

    async function runStatementExtraction(file) {
      const overlay = openModal(`<p class="subtitle">Reading the statement...</p>`, { maxWidth: 400 });

      try {
        const fileBase64 = await fileToBase64(file);
        const { data: { session } } = await supabaseClient.auth.getSession();
        const res = await fetch('/.netlify/functions/extract-statement', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify({ fileBase64, mediaType: file.type }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Extraction failed');
        overlay.remove();
        await openStatementReviewPanel(data.extracted, file);
      } catch (err) {
        overlay.querySelector('.card').innerHTML = `<h2>Couldn't read that statement</h2><div class="error-box">${escapeHtml(err.message)}</div><button type="button" class="secondary" id="st-err-close">Close</button>`;
        overlay.querySelector('#st-err-close').addEventListener('click', () => overlay.remove());
      }
    }

    async function openStatementReviewPanel(extracted, sourceFile) {
      const { data: ourBills } = await supabaseClient.from('supplier_bills').select('*').eq('supplier_id', supplierId);
      const bills = ourBills || [];
      // payments and credits are listed on statements too; only invoices are matched to bills
      const statementInvoices = (extracted.invoices || []).filter(inv => !inv.type || inv.type === 'invoice');

      // Reconcile: for each line the statement shows, does it match one of
      // our own bills (by bill number), and if so, does the amount agree?
      const reconciled = statementInvoices.map(inv => {
        const match = bills.find(b => b.bill_number && inv.bill_number && b.bill_number.trim().toLowerCase() === inv.bill_number.trim().toLowerCase());
        if (!match) return { ...inv, status: 'not_on_file', note: 'On the statement but we have no record of this bill.' };
        if (Math.abs(Number(match.amount) - Number(inv.amount)) > 0.5) {
          return { ...inv, status: 'amount_mismatch', note: `We have this at ${money(match.amount)}, statement shows ${money(inv.amount)}.` };
        }
        return { ...inv, status: 'matches', note: 'Matches our records.' };
      });

      const mismatches = reconciled.filter(r => r.status !== 'matches');

      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; overflow-y:auto;';
      overlay.innerHTML = `
        <div class="card" style="max-width:700px; width:100%; max-height:90vh; overflow-y:auto;">
          <h2>Statement reconciliation</h2>
          <p class="subtitle" style="margin-bottom:14px;">Statement total: ${money(extracted.total_amount || 0)} - dated ${escapeHtml(extracted.statement_date || 'unknown')}</p>

          ${mismatches.length ? `
            <div style="border:1px solid var(--red); border-radius:8px; padding:12px; margin-bottom:14px;">
              <p style="margin:0 0 8px; color:var(--red); font-weight:600;">${mismatches.length} discrepanc${mismatches.length === 1 ? 'y' : 'ies'} found</p>
              ${mismatches.map(m => `
                <div style="padding:6px 0; border-bottom:1px solid var(--border); font-size:13px;">
                  <strong>${escapeHtml(m.bill_number || 'Unlisted')}</strong> - ${money(m.amount)}
                  <p class="subtitle" style="margin:2px 0 0; color:var(--red);">${escapeHtml(m.note)}</p>
                </div>`).join('')}
            </div>` : `<div class="success-box" style="margin-bottom:14px;">Every invoice on this statement matches our own records.</div>`}

          <label>Reconciliation notes (optional)</label>
          <textarea id="st-notes" style="min-height:60px;" placeholder="Anything to follow up with the supplier about"></textarea>

          <div style="margin-top:14px;">
            <button id="st-save-btn">Save statement</button>
            <button type="button" class="secondary" id="st-cancel-btn">Cancel</button>
          </div>
          <div id="st-msg"></div>
        </div>`;
      document.body.appendChild(overlay);

      overlay.querySelector('#st-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#st-save-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#st-msg');
        try {
          const { data: { user } } = await supabaseClient.auth.getUser();
          const filePath = await uploadPrivateFile(sourceFile, `statements/${supplierId}`);
          const { data: savedSt, error } = await supabaseClient.from('supplier_statements').insert({
            supplier_id: supplierId,
            statement_date: extracted.statement_date || null,
            total_amount: extracted.total_amount || 0,
            file_path: filePath,
            file_name: sourceFile.name,
            lines: extracted.invoices || [],
            reconciliation_notes: overlay.querySelector('#st-notes').value.trim() || null,
            created_by: user.id,
          }).select('id').single();
          if (error) throw error;
          // full two-way reconciliation, kept on the Bill checks page
          const { data: { session } } = await supabaseClient.auth.getSession();
          await fetch('/.netlify/functions/supplier-checks', {
            method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
            body: JSON.stringify({ action: 'reconcile', id: savedSt.id }),
          }).catch(e => console.error('statement reconcile did not run:', e.message));
          overlay.remove();
          alert('Statement saved. The full check (both ways, duplicates, balance) is on the Bill checks page.');
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`;
        }
      });
    }

    async function runPricelistExtraction(file) {
      const overlay = openModal(`<p class="subtitle">Reading the price list - this can take a little longer for a long document...</p>`, { maxWidth: 400 });

      try {
        const data = await runBackgroundExtraction('pricelist', 'extract-pricelist-background', file, file.type);
        overlay.remove();
        await openPricelistReviewPanel(data.items);
      } catch (err) {
        overlay.querySelector('.card').innerHTML = `<h2>Couldn't read that price list</h2><div class="error-box">${escapeHtml(err.message)}</div><button type="button" class="secondary" id="pl-err-close">Close</button>`;
        overlay.querySelector('#pl-err-close').addEventListener('click', () => overlay.remove());
      }
    }

    async function openPricelistReviewPanel(items) {
      const { data: allMaterials } = await supabaseClient.from('materials').select('id, name, cost_price');
      const materials = allMaterials || [];

      const rows = items.map(item => {
        let bestMatch = null, bestScore = 0;
        materials.forEach(m => {
          const score = fuzzyMatchScore(m.name, item.description);
          if (score > bestScore) { bestScore = score; bestMatch = m; }
        });
        return { ...item, suggestedMatchId: bestScore >= 0.3 ? bestMatch?.id : null };
      });

      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; overflow-y:auto;';
      overlay.innerHTML = `
        <div class="card" style="max-width:900px; width:100%; max-height:90vh; overflow-y:auto;">
          <h2>Review price list - ${rows.length} item${rows.length === 1 ? '' : 's'} found</h2>
          <p class="subtitle" style="margin-bottom:14px;">Uncheck anything you don't want applied. Matched items update that material's cost price - nothing else changes unless you pick "create new".</p>
          <div id="pl-rows">
            ${rows.map((r, i) => `
              <div class="pl-row" data-index="${i}" style="display:grid; grid-template-columns:24px 2fr 1.5fr 1fr; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--border); font-size:13px;">
                <input type="checkbox" class="pl-include" checked style="width:auto;" />
                <span>${escapeHtml(r.description)}</span>
                <select class="pl-match" style="font-size:12px;">
                  <option value="__new__">+ Create as new material</option>
                  ${materials.map(m => `<option value="${m.id}" ${r.suggestedMatchId === m.id ? 'selected' : ''}>${escapeHtml(m.name)} (currently ${money(m.cost_price)})</option>`).join('')}
                </select>
                <input class="pl-cost" type="number" step="0.01" value="${escapeHtml(r.unit_cost)}" style="font-size:12px;" />
              </div>`).join('')}
          </div>
          <div style="margin-top:14px;">
            <button id="pl-confirm-btn">Apply price updates</button>
            <button type="button" class="secondary" id="pl-cancel-btn">Cancel</button>
          </div>
          <div id="pl-msg"></div>
        </div>`;
      document.body.appendChild(overlay);

      overlay.querySelector('#pl-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#pl-confirm-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#pl-msg');
        const confirmBtn = overlay.querySelector('#pl-confirm-btn');
        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Applying...';

        try {
          const { data: companySettings } = await supabaseClient.from('company_settings').select('default_markup_percent').eq('id', 1).single();
          const markup = Number(companySettings?.default_markup_percent) || 45;

          let updated = 0, created = 0;
          const rowEls = [...overlay.querySelectorAll('.pl-row')];
          for (const rowEl of rowEls) {
            if (!rowEl.querySelector('.pl-include').checked) continue;
            const description = rowEl.querySelector('span').textContent.trim();
            const unitCost = parseFloat(rowEl.querySelector('.pl-cost').value);
            if (isNaN(unitCost)) continue;
            const matchValue = rowEl.querySelector('.pl-match').value;

            if (matchValue === '__new__') {
              await supabaseClient.from('materials').insert({
                name: description, cost_price: unitCost,
                sell_price: Math.round(unitCost * (1 + markup / 100) * 100) / 100,
                supplier_id: supplierId,
              });
              created++;
            } else {
              await supabaseClient.from('materials').update({ cost_price: unitCost }).eq('id', matchValue);
              updated++;
            }
          }

          overlay.remove();
          alert(`Done - ${updated} material${updated === 1 ? '' : 's'} updated, ${created} created.`);
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`;
          confirmBtn.disabled = false;
          confirmBtn.textContent = 'Apply price updates';
        }
      });
    }

    function openEditPanel(supplier) {

          <label>Type</label>
          <select id="ed-kind"><option value="supplier" ${supplier.kind !== 'contractor' ? 'selected' : ''}>Supplier (goods, materials)</option><option value="contractor" ${supplier.kind === 'contractor' ? 'selected' : ''}>Contractor (labour, services)</option></select>
          <div class="grid cols-2">

            <div><label>Account number</label><input id="ed-account" inputmode="numeric" value="${escapeHtml(supplier.bank_account_number)}" /></div>
          </div>
          <p class="subtitle" style="margin-top:14px;">BPAY - if this supplier is paid that way instead.</p>
          <div class="grid cols-2">

            <div><label style="margin-top:0">Reference</label><input id="ed-bpay-ref" inputmode="numeric" value="${escapeHtml(supplier.bpay_reference)}" /></div>

          <label>Notes</label>

      overlay.querySelector('#ed-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#ed-save-btn').addEventListener('click', async () => {

        const label = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Saving...';
        try {
        const { error } = await supabaseClient.from('suppliers').update({
          name: overlay.querySelector('#ed-name').value.trim(),
          kind: overlay.querySelector('#ed-kind').value,
          needs_review: false, // a person has now gone through the details
          contact_email: overlay.querySelector('#ed-email').value.trim() || null,

          bank_account_name: overlay.querySelector('#ed-bank-name').value.trim() || null,

          btn.textContent = label;

    }

    // --- AI bill extraction, scoped to this supplier ---
    // fileToBase64 and fuzzyMatchScore now live in supabase-client.js,
    // shared with the Suppliers page's own upload-and-detect flow.

    async function runExtraction(file) {
      const overlay = openModal(`<p class="subtitle">Reading the invoice...</p>`, { maxWidth: 400 });

      try {
        const fileBase64 = await fileToBase64(file);
        const { data: { session } } = await supabaseClient.auth.getSession();
        const res = await fetch('/.netlify/functions/extract-supplier-invoice', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify({ fileBase64, mediaType: file.type }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || 'Extraction failed');
        overlay.remove();
        await openReviewPanel(data.extracted, null, file);
      } catch (err) {
        overlay.querySelector('.card').innerHTML = `<h2>Couldn't read that invoice</h2><div class="error-box">${escapeHtml(err.message)}</div><button type="button" class="secondary" id="extract-err-close">Close</button>`;
        overlay.querySelector('#extract-err-close').addEventListener('click', () => overlay.remove());
      }
    }

    // inboxItemId: set when the bill came from the Emailed bills page; saving ticks it off there.
    async function openReviewPanel(extracted, preselectedPoId = null, sourceFile = null, inboxItemId = null) {
      const { data: allMaterials } = await supabaseClient.from('materials').select('id, name, cost_price, sell_price, quantity_on_hand');
      const materials = allMaterials || [];

      const { data: openPOs } = await supabaseClient
        .from('purchase_orders')
        .select('id, po_number, description, status, closed_at, purchase_order_line_items(id, material_id, description, quantity, unit_cost)')
        .eq('supplier_id', supplierId)
        .is('closed_at', null);

      // If the invoice itself references our PO number (e.g. "Your
      // Order: PO2014"), auto-match against it rather than making the
      // person hunt for it in a dropdown - still just a suggestion,
      // shown clearly so it can be corrected if wrong.
      let autoMatchedPoId = preselectedPoId;
      if (!autoMatchedPoId && extracted.our_order_reference) {
        const ref = extracted.our_order_reference.toLowerCase().trim();
        const matchedPO = (openPOs || []).find(po => po.po_number && ref.includes(po.po_number.toLowerCase()));
        if (matchedPO) autoMatchedPoId = matchedPO.id;
      }

      const matchedPOForLines = autoMatchedPoId ? (openPOs || []).find(po => po.id === autoMatchedPoId) : null;
      const genericPoLines = matchedPOForLines ? (matchedPOForLines.purchase_order_line_items || []).filter(pl => !pl.material_id) : [];

      const lineItems = (extracted.line_items || []).map(li => {
        let bestMatch = null, bestScore = 0;
        materials.forEach(m => {
          const score = fuzzyMatchScore(m.name, li.description);
          if (score > bestScore) { bestScore = score; bestMatch = m; }
        });

        // A generic PO line (e.g. "10A power point", no Stock link) that
        // this specific invoiced item plausibly fulfils - offer to
        // update the PO to the real item, never done automatically.
        let genericPoMatch = null, genericPoScore = 0;
        genericPoLines.forEach(pl => {
          const score = fuzzyMatchScore(pl.description, li.description);
          if (score > genericPoScore) { genericPoScore = score; genericPoMatch = pl; }
        });

        return {
          ...li,
          suggestedMatchId: bestScore >= 0.3 ? bestMatch?.id : null,
          genericPoLineId: genericPoScore >= 0.3 ? genericPoMatch?.id : null,
          genericPoLineDescription: genericPoScore >= 0.3 ? genericPoMatch?.description : null,
        };
      });

      const nameWarning = extracted.supplier && !fuzzyMatchScore(currentSupplier.name, extracted.supplier)
        ? `<div class="error-box" style="margin-bottom:10px;">The invoice says "${escapeHtml(extracted.supplier)}" - check this is actually a ${escapeHtml(currentSupplier.name)} bill before saving.</div>` : '';

      const overlay = document.createElement('div');
      overlay.style.cssText = 'position:fixed; inset:0; background:rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; z-index:100; padding:16px; overflow-y:auto;';
      overlay.innerHTML = `
        <div class="card" style="max-width:720px; width:100%; max-height:90vh; overflow-y:auto;">
          <h2>Review before saving</h2>
          <p class="subtitle" style="margin-bottom:14px;">Saving against ${escapeHtml(currentSupplier.name)}. Nothing's saved yet.</p>
          ${nameWarning}

          <div class="grid cols-2">
            <div><label style="margin-top:0">Bill number</label><input id="rev-bill-number" value="${escapeHtml(extracted.bill_number)}" /></div>
            <div><label style="margin-top:0">Date</label><input type="date" id="rev-bill-date" value="${escapeHtml(extracted.bill_date)}" /></div>
          </div>
          <label>Total amount</label>
          <input type="number" step="0.01" id="rev-total" value="${escapeHtml(extracted.total || '')}" />

          <label style="margin-top:14px;">Purchase order</label>
          ${autoMatchedPoId ? `<p class="subtitle" style="color:var(--green); margin-bottom:6px;">${preselectedPoId ? 'Uploaded directly to this PO.' : `Matched to PO ${escapeHtml((openPOs.find(p => p.id === autoMatchedPoId) || {}).po_number)} from the invoice's own reference - check this is correct.`}</p>` : ''}
          <select id="rev-po-mode">
            <option value="none" ${!autoMatchedPoId ? 'selected' : ''}>No PO for this bill</option>
            ${openPOs?.length ? `<option value="existing" ${autoMatchedPoId ? 'selected' : ''}>Link to an existing open PO</option>` : ''}
            <option value="new">Create a new PO from this bill</option>
          </select>

          <div id="rev-po-existing-section" style="display:${autoMatchedPoId ? 'block' : 'none'}; margin-top:8px;">
            <select id="rev-po"><option value="">-- Select --</option>${(openPOs || []).map(po => `<option value="${po.id}" ${po.id === autoMatchedPoId ? 'selected' : ''}>${escapeHtml(po.po_number || 'PO')} - ${escapeHtml(po.description)}</option>`).join('')}</select>
          </div>

          <div id="rev-po-new-section" style="display:none; margin-top:8px;">
            <p class="subtitle" style="margin-bottom:8px;">Auto-filled from this bill's line items below - creates a PO so it can be signed off once everything's arrived, before this bill gets approved for payment.</p>
            <select id="rev-po-assign-type">
              <option value="stock">Assign to Stock (not a specific job)</option>
              <option value="job">Assign to a job</option>
            </select>
            <div id="rev-po-job-search-wrap" style="display:none; margin-top:8px;">
              <input id="rev-po-job-search" placeholder="Search for the job..." autocomplete="off" />
              <div id="rev-po-job-results"></div>
              <div id="rev-po-job-selected" class="subtitle" style="margin-top:4px;"></div>
            </div>
          </div>

          <label style="margin-top:14px;">Line items</label>
          <div id="rev-line-items">
            ${lineItems.map((li, i) => `
              <div class="rev-line-item" data-index="${i}" style="border:1px solid var(--border); border-radius:8px; padding:10px; margin-bottom:8px;">
                <input class="rli-desc" value="${escapeHtml(li.description)}" placeholder="Description" style="margin-bottom:6px;" />
                <div class="grid cols-2">
                  <div><label style="margin-top:0; font-size:11px;">Quantity</label><input class="rli-qty" type="number" step="0.01" value="${escapeHtml(li.quantity ?? 1)}" /></div>
                  <div><label style="margin-top:0; font-size:11px;">Unit cost</label><input class="rli-cost" type="number" step="0.01" value="${escapeHtml(li.unit_cost ?? 0)}" /></div>
                </div>
                <label style="margin-top:6px; font-size:11px;">Match to Stock</label>
                <select class="rli-match">
                  <option value="__new__">+ Create as new material</option>
                  ${materials.map(m => `<option value="${m.id}" ${li.suggestedMatchId === m.id ? 'selected' : ''}>${escapeHtml(m.name)} (currently ${money(m.cost_price)})</option>`).join('')}
                </select>
                ${li.suggestedMatchId ? `<p class="subtitle" style="margin:4px 0 0; font-size:11px;">Suggested match - check this is actually the same item before confirming.</p>` : ''}
                ${li.genericPoLineId ? `
                  <label style="margin-top:8px; display:flex; align-items:flex-start; gap:6px; font-size:12px;">
                    <input type="checkbox" class="rli-replace-generic" data-po-line-id="${li.genericPoLineId}" checked style="width:auto; margin-top:2px;" />
                    Update the PO's "${escapeHtml(li.genericPoLineDescription)}" to this specific item
                  </label>` : ''}
              </div>`).join('')}
          </div>

          <div style="margin-top:14px;">
            <button id="rev-confirm-btn">Confirm &amp; save</button>
            <button type="button" class="secondary" id="rev-cancel-btn">Cancel</button>
          </div>
          <div id="rev-msg"></div>
        </div>`;
      document.body.appendChild(overlay);

      overlay.querySelector('#rev-po-mode').addEventListener('change', (e) => {
        overlay.querySelector('#rev-po-existing-section').style.display = e.target.value === 'existing' ? 'block' : 'none';
        overlay.querySelector('#rev-po-new-section').style.display = e.target.value === 'new' ? 'block' : 'none';
      });

      const assignTypeSelect = overlay.querySelector('#rev-po-assign-type');
      if (assignTypeSelect) {
        assignTypeSelect.addEventListener('change', (e) => {
          overlay.querySelector('#rev-po-job-search-wrap').style.display = e.target.value === 'job' ? 'block' : 'none';
        });
      }

      let selectedJobForNewPO = null;
      const jobSearchInput = overlay.querySelector('#rev-po-job-search');
      if (jobSearchInput) {
        let jobSearchTimeout;
        jobSearchInput.addEventListener('input', (e) => {
          clearTimeout(jobSearchTimeout);
          selectedJobForNewPO = null;
          const q = e.target.value.trim();
          if (q.length < 2) { overlay.querySelector('#rev-po-job-results').innerHTML = ''; return; }
          jobSearchTimeout = setTimeout(async () => {
            const results = await searchProjects(q);
            const resultsEl = overlay.querySelector('#rev-po-job-results');
            resultsEl.innerHTML = `<div style="border:1px solid var(--border); border-radius:8px; margin-top:6px;">
              ${results.map(p => `<div class="rev-job-pick" data-id="${p.id}" data-name="${escapeHtml(p.name)}" data-job-number="${escapeHtml(p.job_number)}" data-quote-number="${escapeHtml(p.quote_number)}" style="padding:8px 12px; cursor:pointer; border-bottom:1px solid var(--border);">${escapeHtml(projectRef(p))}</div>`).join('')}
            </div>`;
            resultsEl.querySelectorAll('.rev-job-pick').forEach(row => {
              row.addEventListener('click', () => {
                selectedJobForNewPO = { id: row.dataset.id, name: row.dataset.name, job_number: row.dataset.jobNumber || null, quote_number: row.dataset.quoteNumber || null };
                jobSearchInput.value = row.dataset.name;
                overlay.querySelector('#rev-po-job-selected').textContent = `Selected: ${projectRef(selectedJobForNewPO)}`;
                resultsEl.innerHTML = '';
              });
            });
          }, 250);
        });
      }

      overlay.querySelector('#rev-cancel-btn').addEventListener('click', () => overlay.remove());
      overlay.querySelector('#rev-confirm-btn').addEventListener('click', async () => {
        const msg = overlay.querySelector('#rev-msg');
        const confirmBtn = overlay.querySelector('#rev-confirm-btn');
        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Saving...';

        try {
          const poMode = overlay.querySelector('#rev-po-mode').value;
          let poId = null, newPo = null;
          if (poMode === 'existing') {
            poId = overlay.querySelector('#rev-po').value || null;
            if (!poId) throw new Error('Pick the PO, or switch to "No PO for this bill".');
          } else if (poMode === 'new') {
            const assignType = overlay.querySelector('#rev-po-assign-type').value;
            if (assignType === 'job' && !selectedJobForNewPO) {
              throw new Error('Search for and select a job, or switch to assigning this PO to Stock instead.');
            }
            newPo = { project_id: assignType === 'job' ? selectedJobForNewPO.id : null };
          }
          const billDate = overlay.querySelector('#rev-bill-date').value || null;
          const lines = [...overlay.querySelectorAll('.rev-line-item')].map(row => {
            const replaceCheckbox = row.querySelector('.rli-replace-generic');
            const matchValue = row.querySelector('.rli-match').value;
            return {
              description: row.querySelector('.rli-desc').value.trim(),
              quantity: parseFloat(row.querySelector('.rli-qty').value) || 0,
              unit_cost: parseFloat(row.querySelector('.rli-cost').value) || 0,
              material_id: matchValue === '__new__' ? null : matchValue,
              create_material: matchValue === '__new__',
              replace_po_line_id: replaceCheckbox && replaceCheckbox.checked ? replaceCheckbox.dataset.poLineId : null,
            };
          }).filter(l => l.description);
          if (!lines.length) throw new Error('Add at least one line item.');

          // Keeps the original scan/PDF, same as the sibling statement upload does.
          let filePath = null, fileName = null;
          if (sourceFile) {
            filePath = await uploadPrivateFile(sourceFile, `bills/${supplierId}`);
            fileName = sourceFile.name;
          }

          // One server step, all or nothing: duplicate check by bill number, the PO (linked or new), the
          // bill and its lines linked or flagged against the PO. Stock counts are not touched here: gear
          // goes into stock or onto the job when its PO line is received.
          const { data: billId, error: saveErr } = await supabaseClient.rpc('supplier_bill_save_review', { p: {
            supplier_id: supplierId,
            bill_number: overlay.querySelector('#rev-bill-number').value.trim() || null,
            bill_date: billDate,
            amount: parseFloat(overlay.querySelector('#rev-total').value) || 0,
            po_mode: poMode, po_id: poId, new_po: newPo,
            file_path: filePath, file_name: fileName,
            lines,
          } });
          if (saveErr) throw saveErr;
          const newBill = { id: billId };

          // check the new bill line by line against its PO (Bill checks page)
          {
            const { data: { session } } = await supabaseClient.auth.getSession();
            await fetch('/.netlify/functions/supplier-checks', {
              method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
              body: JSON.stringify({ action: 'check_bill', id: newBill.id }),
            }).catch(e => console.error('bill check did not run:', e.message));
          }

          if (inboxItemId) {
            const { data: { session } } = await supabaseClient.auth.getSession();
            await fetch('/.netlify/functions/supplier-bill-inbox', {
              method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
              body: JSON.stringify({ action: 'mark_saved', id: inboxItemId, bill_id: newBill.id }),
            }).catch(e => console.error('could not tick off the emailed bill:', e.message));
          }

          overlay.remove();
          await loadSupplier();
        } catch (err) {
          msg.innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`;
          confirmBtn.disabled = false;
          confirmBtn.textContent = 'Confirm & save';
        }
      });
    }

    (async function () {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();
      renderMainNav('suppliers');
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });
      if (!supplierId) {
        document.getElementById('content').innerHTML = `<div class="error-box">No supplier specified.</div>`;
        return;
      }
      await loadSupplier();

      if (new URLSearchParams(window.location.search).get('resume_upload') === '1') {
        const pending = sessionStorage.getItem('pending_upload');
        if (pending) {
          sessionStorage.removeItem('pending_upload');
          const { type, extracted, fileBase64, fileName, fileType, preselectedPoId, inboxItemId } = JSON.parse(pending);
          const byteString = atob(fileBase64);
          const bytes = new Uint8Array(byteString.length);
          for (let i = 0; i < byteString.length; i++) bytes[i] = byteString.charCodeAt(i);
          const file = new File([bytes], fileName, { type: fileType });

          if (type === 'bill') await openReviewPanel(extracted, preselectedPoId || null, file, inboxItemId || null);
          else if (type === 'pricelist') await openPricelistReviewPanel(extracted.items);
          else if (type === 'statement') await openStatementReviewPanel(extracted, file);
        }
      }
    })();
  </script>
