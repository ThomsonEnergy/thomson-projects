<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('te-theme') || (matchMedia('(pointer: coarse)').matches ? 'dark' : 'navy'));</script>
<title>Jobs - TEops</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=25" />
<script src="/js/vendor/supabase-2.js?v=1"></script>
<style>
  /* the stage folders stay on one line and scroll sideways when there are many */
  #jobs-folders .settings-tab { white-space: nowrap; }
  /* Phone: a job is one compact card, the number and name across the top and the rest two to a
     line with the label above, so a dozen columns do not make a dozen lines */
  @media (max-width: 700px) {
    #projects-list table.responsive-stack tr { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px; }
    #projects-list table.responsive-stack td, #projects-list table.responsive-stack td.num { flex-direction: column; align-items: flex-start; justify-content: flex-start; gap: 0; padding: 0; text-align: left; }
    #projects-list table.responsive-stack td::before { font-size: 10px; }
    #projects-list td[data-label="#"], #projects-list td[data-label="Name"], #projects-list td[data-label="Site address"], #projects-list td[data-label="Client email"] { grid-column: 1 / -1; }
    #projects-list td[data-label="#"] { font-weight: 700; }
    #projects-list td[data-label="#"]::before { display: none; }
  }
</style>
</head>
<body>
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('mobile-menu-dropdown').classList.toggle('open')">&#9776;</button>
    <div class="mobile-menu-dropdown" id="mobile-menu-dropdown"></div>
    <nav class="topbar-tabs" id="topbar-tabs"></nav>
    <div class="topbar-right">
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/home.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="wrap fill">
    <div class="page-head">
      <div style="flex:1 1 320px;">
        <h1>Jobs</h1>
        <p class="subtitle">Every job with its money position at a glance. To move jobs between stages, use the <a class="link-quiet" href="/dashboard.html">Pipeline</a>.</p>
      </div>
      <div class="grid cols-4" style="flex:1 1 560px; max-width:760px;">
        <div class="stat"><div class="label">Total signed</div><div class="value" id="stat-signed">-</div></div>
        <div class="stat"><div class="label">Cost outlayed</div><div class="value" id="stat-cost">-</div><div class="subtitle" id="stat-cost-incl" style="margin:2px 0 0; font-size:12px;"></div></div>
        <div class="stat"><div class="label">Total partial invoiced</div><div class="value" id="stat-invoiced">-</div></div>
        <div class="stat"><div class="label">Left to invoice</div><div class="value" id="stat-left">-</div></div>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; flex:1 1 100%;">
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; flex:1 1 320px;">
          <input id="project-search" placeholder="Search by name, client, address or job number..." style="max-width:320px; margin:0;" />
          <button type="button" class="secondary" id="new-job-btn" style="white-space:nowrap;">+ New job</button>
          <button type="button" class="secondary" id="jobs-columns-btn" style="white-space:nowrap;" title="Choose which columns show, and their order">Columns</button>
        </div>
        <div id="bulk-delete-projects-controls" style="display:none; align-items:center; gap:10px;">
          <label style="display:flex; align-items:center; gap:6px; margin:0;"><input type="checkbox" id="select-all-projects" style="width:auto;" /> Select all</label>
          <button type="button" id="bulk-delete-projects-btn" class="secondary" style="display:none;">Delete selected</button>
        </div>
        <p class="subtitle" id="bulk-delete-projects-hint" style="margin:0;">Enable Dev Mode in Settings to bulk-select and delete jobs.</p>
      </div>
      <div class="settings-tabs" id="jobs-folders" style="flex:1 1 100%; flex-direction:row; position:static; border-bottom:1px solid var(--border); overflow-x:auto;"></div>
    </div>

    <div class="page-cols">
      <div class="page-col">
        <div class="card">
          <div id="bulk-delete-projects-msg"></div>
          <div id="projects-list"><p class="subtitle">Loading...</p></div>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/supabase-client.js?v=137"></script>
  <script src="/js/jobs-columns.js?v=1"></script>
  <script src="/js/left-to-invoice.js?v=1"></script>
  <script src="/js/theme.js?v=2"></script>
  <script>
    let allRows = [];
    // Which columns show and in what order (js/jobs-columns.js): the device's copy first, the profile's when it answers.
    let jobCols = jobsColumnsCached();

    let costsLoaded = false;

    // Stage folders: All (everything not archived), one per pipeline stage that has jobs, Archived.
    // The folder last used is remembered on this device.
    let currentFolder = 'all';
    try { currentFolder = localStorage.getItem('te-jobs-folder') || 'all'; } catch (e) { /* no storage: start on All */ }

    // Per job, in one call (jobs_list_facts, migration 20261203000000): the last day on site, the
    // next booked day and who, open tasks, open POs, and for pricing roles the materials cost to
    // date: every PO line received to the job and every item taken from stock for it, the moment
    // it is received or used. The job page's Actual cost adds up the same records.
    async function loadFacts(ids) {
      const { data, error } = await supabaseClient.rpc('jobs_list_facts', { p_project_ids: ids });
      if (error) { console.error('Jobs facts fetch failed:', error.message); return { facts: {}, error: friendlyError(error) }; }
      return { facts: Object.fromEntries((data || []).map(f => [f.project_id, f])), error: '' };
    }

    // Actual labour cost, per job - computed entirely server-side
    // (get-accrued-labour-cost.js) from each employee's real pay rate,
    // banded by the same daily overtime rule used on the job page, so
    // an individual's ordinary_rate/rate_1_5x/rate_2x never has to reach
    // this (or any) browser directly. Labour includes direct overheads;
    // indirect only shows as the "incl. overheads" line.
    async function loadLabourCosts(ids) {
      const labour = {}, indirect = {}, hours = {};
      try {
        const { data: { session } } = await supabaseClient.auth.getSession();
        const res = await fetch('/.netlify/functions/get-accrued-labour-cost', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${session.access_token}` },
          body: JSON.stringify({ projectIds: ids }),
        });
        const data = await res.json();
        if (res.ok && data.ok) {
          Object.entries(data.byProject).forEach(([pid, info]) => {
            labour[pid] = info.totalActualLabourCost;
            indirect[pid] = info.totalIndirectOverhead || 0;
            hours[pid] = info.totalActualHours;
          });
        }
      } catch (err) {
        console.error('Accrued labour cost fetch failed:', err.message);
      }
      return { labour, indirect, hours };
    }

    let loadSeq = 0; // a slower earlier load must not repaint over a newer one, or mark its figures as landed
    let listReady = false; // the jobs have landed: until then a redraw would say "No jobs yet"
    let factsLoaded = false, factsError = '';
    // Left to invoice on do and charge jobs lands in two goes: the jobs not archived with the list,
    // the archived ones the first time the Archived folder is opened (most old jobs end up there).
    let leftLoaded = false, leftArchivedLoaded = false;
    let loadArchivedLeft = () => {};
    async function loadProjects() {
      const seq = ++loadSeq;
      const live = () => seq === loadSeq;
      const listEl = document.getElementById('projects-list');
      const { data: projects, error } = await supabaseClient.from('projects')
        .select('id, name, job_number, quote_number, client_name, client_address, client_phone, client_email, created_at, pipeline_stage, proposal_template, source_quote_id, cost_centres(id, quoted_amount, markup_percent, invoiced_amount)')
        .not('job_number', 'is', null)
        .order('created_at', { ascending: false });
      if (!live()) return;
      if (error) { listEl.innerHTML = `<div class="error-box">${escapeHtml(error.message)}</div>`; return; }

      // Cost outlayed is labour (wages and direct overhead, each shift from the moment it is clocked
      // out) plus the materials figure above; null when the person's role is not shown costs.
      // Left to invoice: a quoted job is signed minus invoiced; a do and charge job is the work not
      // yet invoiced at sell price (js/left-to-invoice.js), null until it lands or when not shown.
      let facts = {}, labour = { labour: {}, indirect: {}, hours: {} };
      const left = {}, quoteNumbers = {};
      const buildRows = () => (projects || []).map(p => {
        const signed = (p.cost_centres || []).reduce((s, c) => s + (Number(c.quoted_amount) || 0), 0);
        const invoiced = (p.cost_centres || []).reduce((s, c) => s + (Number(c.invoiced_amount) || 0), 0);
        const f = facts[p.id] || null;
        const labourCost = labour.labour[p.id], materials = f ? f.materials_cost : null;
        const costOutlayed = labourCost == null && materials == null ? null : (Number(labourCost) || 0) + (Number(materials) || 0);
        const isDnc = p.proposal_template === 'direct_job';
        const leftToInvoice = isDnc ? (left[p.id] != null ? left[p.id] : null) : Math.max(0, signed - invoiced);
        return { ...p, facts: f, quoteNumber: quoteNumbers[p.source_quote_id] || p.quote_number || null, signed, invoiced, costOutlayed, costInclOverheads: costOutlayed == null ? null : costOutlayed + (labour.indirect[p.id] || 0), hours: labour.hours[p.id], isDnc, leftToInvoice };
      });
      const repaint = () => { if (!live()) return; allRows = buildRows(); renderProjects(); };

      // The list paints as soon as the jobs land; dates, costs and do and charge figures fill in after.
      const empty = !(projects && projects.length);
      costsLoaded = factsLoaded = leftLoaded = leftArchivedLoaded = empty;
      factsError = '';
      loadArchivedLeft = () => {};
      listReady = true;
      repaint();
      if (empty) return;

      const ids = projects.map(p => p.id);
      // A job made from a quote has no quote number of its own: read its quote's (the Quote column).
      const quoteIds = [...new Set(projects.map(p => p.source_quote_id).filter(Boolean))];
      if (quoteIds.length) {
        supabaseClient.from('projects').select('id, quote_number').in('id', quoteIds).then(({ data }) => {
          if (!live()) return;
          (data || []).forEach(q => { quoteNumbers[q.id] = q.quote_number; });
          repaint();
        });
      }
      const factsDone = loadFacts(ids).then(r => { if (!live()) return; facts = r.facts; factsError = r.error; factsLoaded = true; });
      const labourDone = loadLabourCosts(ids).then(l => { if (live()) labour = l; });
      factsDone.then(repaint);
      Promise.all([factsDone, labourDone]).then(() => { if (!live()) return; costsLoaded = true; repaint(); });
      const dnc = (archived) => projects.filter(p => p.proposal_template === 'direct_job' && (p.pipeline_stage === 'archived') === archived).map(p => p.id);
      fetchLeftToInvoice(dnc(false)).then(l => { if (!live()) return; Object.assign(left, l || {}); leftLoaded = true; repaint(); });
      let archivedAsked = false;
      loadArchivedLeft = () => {
        if (archivedAsked) return;
        archivedAsked = true;
        fetchLeftToInvoice(dnc(true)).then(l => { if (!live()) return; Object.assign(left, l || {}); leftArchivedLoaded = true; repaint(); });
      };
    }

    function renderProjects() {
      if (!listReady) return;
      const listEl = document.getElementById('projects-list');
      const q = document.getElementById('project-search').value.trim().toLowerCase();
      // Folder counts ignore the search box, as the Quotes tabs do.
      const inFolder = (p, f) => f === 'all' ? p.pipeline_stage !== 'archived' : p.pipeline_stage === f;
      const counts = { all: 0, archived: 0 };
      allRows.forEach(p => {
        if (p.pipeline_stage === 'archived') counts.archived++;
        else { counts.all++; counts[p.pipeline_stage] = (counts[p.pipeline_stage] || 0) + 1; }
      });
      const stageKeys = PIPELINE_STAGES.map(s => s.key);
      const folderKeys = ['all',
        ...stageKeys.filter(k => counts[k]),
        ...Object.keys(counts).filter(k => k !== 'all' && k !== 'archived' && !stageKeys.includes(k)),
        'archived'];
      if (allRows.length && !folderKeys.includes(currentFolder)) currentFolder = 'all'; // a remembered stage with no jobs left
      const foldersEl = document.getElementById('jobs-folders');
      foldersEl.innerHTML = folderKeys.map(k => `<button type="button" class="settings-tab${k === currentFolder ? ' active' : ''}" data-folder="${escapeHtml(k)}">${escapeHtml(k === 'all' ? 'All' : pipelineStageLabel(k))} (${counts[k] || 0})</button>`).join('');
      foldersEl.querySelectorAll('.settings-tab').forEach(btn => btn.addEventListener('click', () => {
        currentFolder = btn.dataset.folder;
        try { localStorage.setItem('te-jobs-folder', currentFolder); } catch (e) { /* remembered only when storage works */ }
        renderProjects();
      }));

      const folderRows = allRows.filter(p => inFolder(p, currentFolder));
      if (currentFolder === 'archived') loadArchivedLeft();
      const leftNow = currentFolder === 'archived' ? leftArchivedLoaded : leftLoaded;
      const filtered = q
        ? folderRows.filter(p => (p.name || '').toLowerCase().includes(q) || (p.client_name || '').toLowerCase().includes(q) || (p.client_address || '').toLowerCase().includes(q) || String(p.job_number || '').includes(q) || String(p.quote_number || '').includes(q))
        : folderRows;

      const totals = filtered.reduce((acc, p) => ({
        signed: acc.signed + p.signed, cost: acc.cost + (p.costOutlayed || 0), costIncl: acc.costIncl + (p.costInclOverheads || 0), invoiced: acc.invoiced + p.invoiced, left: acc.left + (p.leftToInvoice || 0),
      }), { signed: 0, cost: 0, costIncl: 0, invoiced: 0, left: 0 });
      const costShown = filtered.some(p => p.costOutlayed != null);
      document.getElementById('stat-signed').textContent = money(totals.signed);
      document.getElementById('stat-cost').textContent = !costsLoaded ? '...' : costShown ? money(totals.cost) : '-';
      document.getElementById('stat-cost-incl').textContent = costsLoaded && costShown ? `incl. overheads ${money(totals.costIncl)}` : '';
      document.getElementById('stat-invoiced').textContent = money(totals.invoiced);
      // a total with a job's figure missing (not this role's to see, or it could not be read) would read low: show none
      document.getElementById('stat-left').textContent = !leftNow ? '...' : filtered.every(p => p.leftToInvoice != null) ? money(totals.left) : '-';

      if (!filtered.length) { listEl.innerHTML = `<p class="subtitle">${allRows.length ? (q ? 'No jobs match.' : 'No jobs in this folder.') : 'No jobs yet.'}</p>`; return; }

      const devMode = isDevModeActive();
      document.getElementById('bulk-delete-projects-controls').style.display = devMode ? 'flex' : 'none';
      document.getElementById('bulk-delete-projects-hint').style.display = devMode ? 'none' : 'block';

      listEl.innerHTML = (factsError ? `<div class="error-box" style="margin:0 0 8px;">The dates, counts and materials costs could not be loaded: ${escapeHtml(factsError)}</div>` : '')
        + jobsTableHtml(filtered, jobCols, { today: sydneyDateKey(new Date()), costsLoaded, factsLoaded, leftLoaded: leftNow }, devMode);

      // The number and name are real links (long-press, new tab, copy); a
      // click anywhere else on the row follows them, except the Dev Mode tick box.
      listEl.querySelectorAll('.project-row-link').forEach(row => {
        row.addEventListener('click', (e) => { if (!e.target.closest('a, input')) row.querySelector('.project-link').click(); });
      });
      wireBulkDeleteProjects(filtered);
    }

    function wireBulkDeleteProjects(rows) {
      const selectAll = document.getElementById('select-all-projects');
      const deleteBtn = document.getElementById('bulk-delete-projects-btn');
      const msg = document.getElementById('bulk-delete-projects-msg');

      function selectedCheckboxes() { return [...document.querySelectorAll('.project-select:checked')]; }
      function refreshDeleteBtn() {
        const n = selectedCheckboxes().length;
        deleteBtn.style.display = n ? 'inline-flex' : 'none';
        deleteBtn.textContent = `Delete selected (${n})`;
      }

      selectAll.checked = false;
      selectAll.onchange = () => {
        document.querySelectorAll('.project-select').forEach(cb => { cb.checked = selectAll.checked; });
        refreshDeleteBtn();
      };
      document.querySelectorAll('.project-select').forEach(cb => {
        cb.addEventListener('change', () => {
          if (!cb.checked) selectAll.checked = false;
          refreshDeleteBtn();
        });
      });

      deleteBtn.onclick = async () => {
        const ids = selectedCheckboxes().map(cb => cb.dataset.id);
        if (!ids.length) return;
        deleteBtn.disabled = true;
        deleteBtn.textContent = 'Checking...';
        msg.innerHTML = '';

        // Dev mode can delete any job outright - invoices, POs, and their
        // line items all cascade away cleanly with the project (their
        // FKs are set up for it). Logged time is the one thing worth
        // pausing on, since it's real payroll history - if any is
        // attached, a picker lets it be moved to a different job instead
        // of being destroyed along with this one.
        const withReasons = [];
        for (const id of ids) {
          const project = rows.find(p => p.id === id);
          const reasons = await checkProjectHasActivity(project);
          withReasons.push({ project, reasons });
        }

        if (!confirm(`Delete ${withReasons.length} job${withReasons.length === 1 ? '' : 's'} permanently? This can't be undone.\n\n${withReasons.map(w => `${projectRef(w.project)}${w.reasons.length ? ' (' + w.reasons.join(', ') + ')' : ''}`).join('\n')}`)) {
          deleteBtn.disabled = false;
          refreshDeleteBtn();
          return;
        }

        deleteBtn.textContent = 'Deleting...';
        const skipped = [];
        try {
          for (const { project } of withReasons) {
            const { count: timeCount } = await supabaseClient.from('time_entries').select('id', { count: 'exact', head: true }).eq('project_id', project.id);
            if (timeCount > 0) {
              const outcome = await openReassignHoursModal(project, timeCount, rows.filter(p => p.id !== project.id));
              if (outcome.action === 'cancel') { skipped.push(project); continue; }
              if (outcome.action === 'reassign') {
                const { error: moveErr } = await supabaseClient.from('time_entries').update({ project_id: outcome.targetProjectId, cost_centre_id: null, selected_cost_centre_ids: null }).eq('project_id', project.id);
                if (moveErr) throw new Error(`Delete stopped at moving the logged time: ${moveErr.message}`);
              } else {
                const { error: timeErr } = await supabaseClient.from('time_entries').delete().eq('project_id', project.id);
                if (timeErr) throw new Error(`Delete stopped at the logged time: ${timeErr.message}`);
              }
            }
            await deleteProject(project.id);
          }
          const deletedCount = withReasons.length - skipped.length;
          msg.innerHTML = `<div class="success-box">Deleted ${deletedCount} job${deletedCount === 1 ? '' : 's'}.${skipped.length ? ` Skipped: ${escapeHtml(skipped.map(p => projectRef(p)).join(', '))}.` : ''}</div>`;
          await loadProjects();
        } catch (err) {
          // deleteProject stops at the first failed step; reload so the list shows what is really left
          msg.innerHTML = `<div class="error-box">${escapeHtml(err.message)}</div>`;
          await loadProjects();
          deleteBtn.disabled = false;
          refreshDeleteBtn();
        }
      };
    }

    // Offers a choice for the logged time attached to a job about to be
    // deleted: move it onto a different job (searched the same way as
    // every other job picker in this app), or delete it along with the
    // job. Resolves { action: 'reassign', targetProjectId } | { action:
    // 'delete' } | { action: 'cancel' } (skip deleting this one job).
    function openReassignHoursModal(project, timeCount, otherProjects) {
      return new Promise((resolve) => {
        const overlay = openModal(`
            <h2>Move logged hours first</h2>
            <p class="subtitle" style="margin-bottom:12px;">${escapeHtml(projectRef(project))} has ${timeCount} logged time ${timeCount === 1 ? 'entry' : 'entries'}. Move them to a different job, or delete them along with this one.</p>
            <label style="margin-top:0">Move hours to</label>
            <input id="rh-job-search" placeholder="Search jobs..." autocomplete="off" />
            <div id="rh-job-results" style="position:relative;"></div>
            <p class="subtitle" id="rh-selected" style="margin-top:6px;"></p>
            <div style="margin-top:14px; display:flex; gap:8px; flex-wrap:wrap;">
              <button id="rh-move-btn" disabled>Move hours &amp; delete</button>
              <button type="button" class="secondary" id="rh-delete-hours-btn">Delete hours too</button>
              <button type="button" class="secondary" id="rh-cancel-btn">Skip this job</button>
            </div>
            <div id="rh-msg"></div>`, { maxWidth: 480 });

        let targetProjectId = null;
        let searchTimeout;
        overlay.querySelector('#rh-job-search').addEventListener('input', (e) => {
          clearTimeout(searchTimeout);
          targetProjectId = null;
          overlay.querySelector('#rh-move-btn').disabled = true;
          const q = e.target.value.trim().toLowerCase();
          const resultsEl = overlay.querySelector('#rh-job-results');
          if (q.length < 2) { resultsEl.innerHTML = ''; return; }
          searchTimeout = setTimeout(() => {
            const matches = otherProjects.filter(p => (p.name || '').toLowerCase().includes(q) || String(p.job_number || '').includes(q) || String(p.quote_number || '').includes(q)).slice(0, 8);
            resultsEl.innerHTML = matches.length
              ? `<div style="border:1px solid var(--border); border-radius:8px; margin-top:6px;">
                  ${matches.map(p => `<div class="rh-job-pick" data-id="${p.id}" data-label="${escapeHtml(projectRef(p))}" style="padding:8px 12px; cursor:pointer; border-bottom:1px solid var(--border);">${escapeHtml(projectRef(p))}</div>`).join('')}
                </div>`
              : `<p class="subtitle" style="margin-top:4px;">No matches.</p>`;
            resultsEl.querySelectorAll('.rh-job-pick').forEach(row => {
              row.addEventListener('click', () => {
                targetProjectId = row.dataset.id;
                overlay.querySelector('#rh-job-search').value = row.dataset.label;
                overlay.querySelector('#rh-selected').textContent = `Selected: ${row.dataset.label}`;
                overlay.querySelector('#rh-move-btn').disabled = false;
                resultsEl.innerHTML = '';
              });
            });
          }, 200);
        });

        overlay.querySelector('#rh-move-btn').addEventListener('click', () => {
          overlay.remove();
          resolve({ action: 'reassign', targetProjectId });
        });
        overlay.querySelector('#rh-delete-hours-btn').addEventListener('click', () => {
          if (!confirm(`Permanently delete ${timeCount} logged time ${timeCount === 1 ? 'entry' : 'entries'}? This can't be undone.`)) return;
          overlay.remove();
          resolve({ action: 'delete' });
        });
        overlay.querySelector('#rh-cancel-btn').addEventListener('click', () => {
          overlay.remove();
          resolve({ action: 'cancel' });
        });
      });
    }

    document.getElementById('project-search').addEventListener('input', renderProjects);

    (async function () {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();
      renderMainNav('projects');
      document.getElementById('new-job-btn').addEventListener('click', () => {
        openQuickJobPanel((project) => { window.location.href = `/project.html?id=${project.id}`; });
      });
      document.getElementById('jobs-columns-btn').addEventListener('click', async () => {
        await loadJsOnce('/js/jobs-columns-panel.js?v=1', () => typeof openJobsColumnsPanel === 'function');
        openJobsColumnsPanel(jobCols, (keys) => { jobCols = keys; renderProjects(); });
      });
      // the columns saved on the profile (another device may have changed them) replace the device's copy
      loadJobsColumns().then((keys) => { if (keys && keys.join() !== jobCols.join()) { jobCols = keys; renderProjects(); } });
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });
      await loadProjects();
    })();
