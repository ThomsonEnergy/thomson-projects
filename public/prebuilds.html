<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('te-theme') || (matchMedia('(pointer: coarse)').matches ? 'dark' : 'navy'));</script>
<title>Prebuilds - Thomson Energy</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=23" />
<script src="/js/vendor/supabase-2.js?v=1"></script>
</head>
<body>
  <div class="topbar">
    <button class="mobile-menu-btn" id="mobile-menu-btn" onclick="document.getElementById('mobile-menu-dropdown').classList.toggle('open')">&#9776;</button>
    <div class="mobile-menu-dropdown" id="mobile-menu-dropdown"></div>
    <nav class="topbar-tabs" id="topbar-tabs"></nav>
    <div class="topbar-right">
      <a href="/schedule.html" class="topbar-icon-link" title="Schedule">&#128197;</a>
      <a href="/settings.html" class="topbar-icon-link" title="Settings">&#9881;</a>
      <a href="#" id="logout-link" class="topbar-icon-link" title="Log out">&#9099;</a>
      <a href="/home.html" class="topbar-logo"><img src="/icons/logo-wordmark-full.png" alt="Thomson Energy" /></a>
    </div>
  </div>

  <div class="wrap wide">
    <h1>Prebuilds</h1>
    <p class="subtitle">Reusable supply-and-install packages. Staff pick these on a quote and set a quantity - every component scales automatically.</p>

    <div class="card" id="pb-form-root"></div>

    <div class="card">
      <h2>Library</h2>
      <input id="pb-search" placeholder="Search by name or category..." style="margin-bottom:12px; max-width:320px;" autocomplete="off" />
      <div id="pb-list"><p class="subtitle">Loading...</p></div>
    </div>
  </div>

  <script src="/js/supabase-client.js?v=114"></script>
  <script src="/js/prebuild-form.js?v=2"></script>
  <script src="/js/theme.js?v=2"></script>
  <script>
    // The form itself is shared with the quote pages: js/prebuild-form.js.
    let allPrebuilds = [];
    let prebuildForm = null;

    async function loadPrebuilds() {
      const listEl = document.getElementById('pb-list');
      const { data, error } = await supabaseClient
        .from('prebuilds')
        .select('*, prebuild_components(*)')
        .order('category').order('name');
      if (error) {
        listEl.innerHTML = `<div class="error-box">${escapeHtml(error.message)}</div>`;
        return;
      }
      allPrebuilds = data || [];
      renderPrebuildList();
    }

    function renderPrebuildList() {
      const listEl = document.getElementById('pb-list');
      const q = document.getElementById('pb-search').value.trim().toLowerCase();
      const data = q
        ? allPrebuilds.filter(pb => (pb.name || '').toLowerCase().includes(q) || (pb.category || '').toLowerCase().includes(q) || (pb.subcategory || '').toLowerCase().includes(q))
        : allPrebuilds;

      if (!allPrebuilds.length) {
        listEl.innerHTML = `<p class="subtitle">No prebuilds yet - add your first one above.</p>`;
        return;
      }
      if (!data.length) {
        listEl.innerHTML = `<p class="subtitle">No matches.</p>`;
        return;
      }
      listEl.innerHTML = data.map(pb => {
        const total = (pb.prebuild_components || []).reduce((s, c) => s + Number(c.quantity) * Number(c.unit_cost), 0);
        return `
        <div class="project-list-item" data-id="${pb.id}">
          <div>
            <div class="name">${escapeHtml(pb.name)}</div>
            <div class="meta">${escapeHtml(pb.category)}${pb.subcategory ? ' / ' + escapeHtml(pb.subcategory) : ''} &middot; ${(pb.prebuild_components || []).length} component${(pb.prebuild_components || []).length === 1 ? '' : 's'} &middot; ${money(total)} base cost</div>
          </div>
          <div>
            <button class="secondary pb-edit-btn" data-id="${pb.id}">Edit</button>
            <button class="secondary danger pb-delete-btn" data-id="${pb.id}">Delete</button>
          </div>
        </div>`;
      }).join('');

      listEl.querySelectorAll('.pb-edit-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const pb = allPrebuilds.find(p => p.id === btn.dataset.id);
          prebuildForm.loadForEdit(pb);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
      listEl.querySelectorAll('.pb-delete-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          if (!confirm('Delete this prebuild? This cannot be undone.')) return;
          const { error: delErr } = await supabaseClient.from('prebuilds').delete().eq('id', btn.dataset.id);
          if (delErr) { alert(delErr.message); return; }
          await loadPrebuilds();
        });
      });
    }
    document.getElementById('pb-search').addEventListener('input', renderPrebuildList);

    (async () => {
      const session = await requireLogin();
      if (!session) return;
      syncThemeFromProfile();
      renderMainNav('prebuilds');
      document.getElementById('logout-link').addEventListener('click', async (e) => {
        e.preventDefault();
        await supabaseClient.auth.signOut();
        window.location.href = '/login.html';
      });

      const role = await getMyRole();
      if (!isPricingRole(role)) { window.location.href = '/home.html'; return; }

      const formRoot = document.getElementById('pb-form-root');
      formRoot.innerHTML = prebuildFormHtml();
      prebuildForm = mountPrebuildForm(formRoot, { onSaved: loadPrebuilds });
      await loadPrebuilds();
    })();
  </script>
</body>
</html>
