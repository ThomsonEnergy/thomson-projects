<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Your invoice</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=9" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @media print {
    .topbar { display: none; }
    body { background: white; color: black; }
    .card { border: 1px solid #ccc; background: white; }
    .page-break { page-break-before: always; }
  }
  .inv-header-bar { display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:20px; }
  .inv-header-bar div { flex:1; padding:12px 16px; text-align:center; border-right:1px solid var(--border); }
  .inv-header-bar div:last-child { border-right:none; }
  .inv-header-bar .label { font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin-bottom:4px; }
  .inv-header-bar .val { font-weight:700; font-size:15px; }
  .inv-header-bar .amount { background:var(--accent-dim); }
  .meta-box { background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:14px 16px; font-size:13px; }
  .meta-box div { margin-bottom:4px; }
  .meta-box span.k { color:var(--muted); display:inline-block; width:110px; }
</style>
</head>
<body>
  <div class="topbar">
    <span id="brand-mark" class="brand">INVOICE</span>
    <button class="secondary" onclick="window.print()">Print / Save as PDF</button>
  </div>

  <div class="wrap" style="max-width:750px;">
    <div id="content"><p class="subtitle">Loading your invoice...</p></div>
  </div>

  <script src="/js/supabase-client.js?v=2"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');

    async function load() {
      const { data, error } = await supabaseClient.rpc('get_invoice_by_token_v3', { p_token: token });
      const content = document.getElementById('content');
      if (error || !data) {
        content.innerHTML = `<div class="error-box">This invoice link isn't valid. Please check the link or contact us.</div>`;
        return;
      }

      const inv = data.invoice;
      const project = data.project || {};
      const s = data.company || {};
      const claims = data.claims || [];
      const previousInvoices = data.previous_invoices || [];
      const isStandalone = !!data.is_standalone;

      if (s.logo_url) {
        document.getElementById('brand-mark').innerHTML = `<img src="${s.logo_url}" style="max-height:28px;" />`;
      } else if (s.company_name) {
        document.getElementById('brand-mark').textContent = s.company_name;
      }

      const labourAmount = Number(inv.labour_amount) || 0;
      const materialAmount = Number(inv.material_amount) || 0;
      const stcAmount = Number(inv.stc_amount) || 0;
      const subtotal = labourAmount + materialAmount;
      const gst = Math.round(subtotal * 0.10 * 100) / 100;
      const totalIncGst = subtotal + gst;
      // Balance due comes straight from the server (get_invoice_balance_due,
      // via the RPC) rather than being recalculated here - this is the
      // exact same number Airwallex charges, computed in exactly one
      // place, specifically so the two can never drift apart again.
      const balanceDue = Number(inv.balance_due);
      const isPaid = !!inv.paid_at;
      const isMultiStage = claims.length > 1;

      const detailParts = [s.abn ? `ABN ${s.abn}` : '', mapsLink(s.address), s.phone, s.website].filter(Boolean);
      const stageLabel = isStandalone ? '' : (isMultiStage ? claims.map(c => c.cost_centre_name).join(', ') : (claims[0]?.cost_centre_name || ''));

      content.innerHTML = `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px;">
            <div>
              ${s.logo_url ? `<img src="${s.logo_url}" style="max-height:48px;" />` : `<h1 style="margin:0;">${s.company_name || ''}</h1>`}
              <p class="subtitle" style="margin:10px 0 0;">${detailParts.join(' &middot; ')}</p>
            </div>
            <div style="text-align:right;">
              <h1 style="margin:0;">Tax Invoice</h1>
              <p class="subtitle" style="margin:2px 0 0;">${inv.invoice_number}</p>
            </div>
          </div>

          <div class="grid cols-3" style="margin-bottom:20px;">
            <div style="grid-column: span 2;">
              <p class="subtitle" style="margin:0 0 4px; text-transform:uppercase; font-size:11px;">Bill to</p>
              <p style="margin:0; font-weight:600;">${project.client_name || ''}</p>
              ${project.client_address ? `<p class="subtitle" style="margin:2px 0 0;">${mapsLink(project.client_address)}</p>` : ''}
            </div>
            <div class="meta-box">
              ${!isStandalone && project.job_number ? `<div><span class="k">Job No.</span>J${project.job_number}</div>` : ''}
              <div><span class="k">${isStandalone ? 'For' : (isMultiStage ? 'Stages' : 'Stage')}</span>${isStandalone ? (inv.description || 'Invoice') : stageLabel}</div>
            </div>
          </div>

          <div class="inv-header-bar">
            <div><div class="label">Invoice date</div><div class="val">${new Date(inv.sent_at).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' })}</div></div>
            <div class="amount"><div class="label">Amount due</div><div class="val">${money(balanceDue)}</div></div>
            <div>${isPaid ? '<div class="label">Status</div><div class="val" style="color:var(--green);">Paid</div>' : '<div class="label">Status</div><div class="val">Awaiting payment</div>'}</div>
          </div>

          ${isStandalone ? `
            <h2 style="margin-bottom:10px;">${inv.description || 'Invoice'}</h2>
            <p class="subtitle">Labour and materials as invoiced.</p>
          ` : `
            <h2 style="margin-bottom:10px;">Invoice summary</h2>
            <table>
              <thead><tr><th>Stage</th><th class="num">Amount</th></tr></thead>
              <tbody>
                ${claims.map(c => `<tr><td>${c.cost_centre_name}</td><td class="num">${money(Number(c.labour_amount) + Number(c.material_amount) - Number(c.stc_amount || 0))}</td></tr>`).join('')}
              </tbody>
            </table>
          `}

          <div style="text-align:right; margin-top:16px; padding-top:16px; border-top:1px solid var(--border);">
            <p class="subtitle" style="margin:0;">Subtotal: ${money(subtotal)}</p>
            <p class="subtitle" style="margin:2px 0 0;">GST (10%): ${money(gst)}</p>
            <p class="subtitle" style="margin:2px 0 0;">Total inc GST: ${money(totalIncGst)}</p>
            ${stcAmount > 0 ? `<p style="margin:6px 0 0; color:var(--green); font-weight:600;">STC Credit: -${money(stcAmount)}</p>` : ''}
            <p style="font-size:20px; font-weight:700; margin:6px 0 0;">Balance Due: ${money(balanceDue)}</p>
          </div>
        </div>

        ${!isPaid ? `
        <div class="card">
          <h2>Payment details</h2>
          <button id="pay-online-btn" data-token="${token}" style="background:var(--accent); color:var(--accent-contrast); padding:12px 24px; border-radius:8px; border:none; font-weight:600; font-size:15px; cursor:pointer; margin-bottom:16px;">Pay online now</button>
          <div id="pay-online-msg"></div>
          <p class="subtitle" style="margin-bottom:16px;">Or pay by direct deposit using the details below.</p>
          ${s.bank_name || s.bank_account_number ? `
            <table>
              <tbody>
                ${s.bank_account_name ? `<tr><td>Account name</td><td>${s.bank_account_name}</td></tr>` : ''}
                ${s.bank_name ? `<tr><td>Bank</td><td>${s.bank_name}</td></tr>` : ''}
                ${s.bank_bsb ? `<tr><td>BSB</td><td>${s.bank_bsb}</td></tr>` : ''}
                ${s.bank_account_number ? `<tr><td>Account number</td><td>${s.bank_account_number}</td></tr>` : ''}
                <tr><td>Reference</td><td><strong>${inv.invoice_number}</strong></td></tr>
              </tbody>
            </table>
          ` : ''}
          ${s.payment_details_text ? `<p class="subtitle" style="white-space:pre-wrap; margin-top:10px;">${s.payment_details_text}</p>` : ''}
          ${!s.bank_name && !s.bank_account_number && !s.payment_details_text ? `<p class="subtitle">Contact us for payment details.</p>` : ''}
        </div>` : ''}

        ${!isStandalone ? `
        <div class="card page-break">
          <h2 style="margin-bottom:2px;">Claim breakdown</h2>
          <p class="subtitle" style="margin-bottom:16px;">Which section this invoice covers, and how much of each.${project.job_number ? ` J${project.job_number}` : ''}</p>
          ${claims.map(c => {
            const claimedBefore = Number(c.claimed_before) || 0;
            const thisClaim = Number(c.labour_amount) + Number(c.material_amount);
            const quotedAmount = Number(c.quoted_amount) || 0;
            const claimedToDate = claimedBefore + thisClaim;
            const remaining = Math.max(0, quotedAmount - claimedToDate);
            const stcTotal = Number(c.stc_total) || 0;
            const stcAmt = Number(c.stc_amount) || 0;
            const lineItems = c.line_items || [];
            return `
            <div style="margin-bottom:22px; padding-bottom:18px; border-bottom:1px solid var(--border);">
              <h3 style="margin-bottom:8px;">${c.cost_centre_name}</h3>
              ${lineItems.length ? `
                <table style="margin-bottom:10px;">
                  <thead><tr><th>Item</th><th class="num">Quantity</th><th class="num">Unit Price</th><th class="num">Total</th></tr></thead>
                  <tbody>
                    ${lineItems.map(li => `<tr><td>${li.description}</td><td class="num">${li.quantity}</td><td class="num">${money(li.unit_cost)}</td><td class="num">${money(li.quantity * li.unit_cost)}</td></tr>`).join('')}
                  </tbody>
                </table>
              ` : `<p class="subtitle" style="margin-bottom:10px;">Labour and materials as quoted.</p>`}
              <table>
                <thead><tr><th></th><th class="num">Total</th><th class="num">Claimed to date</th><th class="num">This claim</th><th class="num">Remaining</th></tr></thead>
                <tbody>
                  <tr>
                    <td>Stage value</td>
                    <td class="num">${money(quotedAmount)}</td>
                    <td class="num">${money(claimedToDate)} (${quotedAmount ? Math.round((claimedToDate / quotedAmount) * 100) : 0}%)</td>
                    <td class="num">${money(thisClaim)}</td>
                    <td class="num">${money(remaining)}</td>
                  </tr>
                  ${stcTotal > 0 ? `
                  <tr>
                    <td>STC credit</td>
                    <td class="num">${money(stcTotal)}</td>
                    <td class="num">-</td>
                    <td class="num">${money(stcAmt)}</td>
                    <td class="num">${money(Math.max(0, stcTotal - stcAmt))}</td>
                  </tr>` : ''}
                </tbody>
              </table>
            </div>`;
          }).join('')}
        </div>
        ` : ''}

        ${previousInvoices.length ? `
        <div class="card">
          <h2>Previous claims</h2>
          <table>
            <thead><tr><th>Invoice</th><th class="num">Amount</th><th>Date</th></tr></thead>
            <tbody>
              ${previousInvoices.map(p => `<tr><td>${p.invoice_number}</td><td class="num">${money(p.amount)}</td><td>${new Date(p.sent_at).toLocaleDateString('en-AU')}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>` : ''}
      `;

      const payBtn = document.getElementById('pay-online-btn');
      if (payBtn) {
        payBtn.addEventListener('click', async () => {
          const msgEl = document.getElementById('pay-online-msg');
          payBtn.disabled = true;
          payBtn.textContent = 'Preparing secure payment...';
          msgEl.innerHTML = '';
          try {
            const res = await fetch('/.netlify/functions/get-or-create-payment-link', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ token: payBtn.dataset.token }),
            });
            const result = await res.json();
            if (!res.ok || !result.ok) throw new Error(result.error || 'Could not start payment');
            window.location.href = result.url;
          } catch (err) {
            msgEl.innerHTML = `<p class="subtitle" style="color:var(--red, #e05252);">${err.message}</p>`;
            payBtn.disabled = false;
            payBtn.textContent = 'Pay online now';
          }
        });
      }
    }

    load().then(() => {
      if (new URLSearchParams(window.location.search).get('print') === '1') {
        setTimeout(() => window.print(), 400); // brief pause so the content's actually rendered first
      }
    });
  </script>
</body>
</html>
