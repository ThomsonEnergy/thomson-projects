<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Your invoice</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<meta name="theme-color" content="#12161c" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="/css/style.css?v=8" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  @media print {
    .topbar { display: none; }
    body { background: white; color: black; }
    .card { border: 1px solid #ccc; background: white; }
  }
  .inv-header-bar { display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:20px; }
  .inv-header-bar div { flex:1; padding:12px 16px; text-align:center; border-right:1px solid var(--border); }
  .inv-header-bar div:last-child { border-right:none; }
  .inv-header-bar .label { font-size:10px; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); margin-bottom:4px; }
  .inv-header-bar .val { font-weight:700; font-size:15px; }
  .inv-header-bar .amount { background:var(--accent-dim); }
  .meta-box { background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:14px 16px; font-size:13px; }
  .meta-box div { margin-bottom:4px; }
  .meta-box span.k { color:var(--muted); display:inline-block; width:110px; }
</style>
</head>
<body>
  <div class="topbar">
    <span id="brand-mark" class="brand">INVOICE</span>
    <button class="secondary" onclick="window.print()">Print / Save as PDF</button>
  </div>

  <div class="wrap" style="max-width:750px;">
    <div id="content"><p class="subtitle">Loading your invoice...</p></div>
  </div>

  <script src="/js/supabase-client.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');

    async function load() {
      const { data, error } = await supabaseClient.rpc('get_invoice_by_token_v2', { p_token: token });
      const content = document.getElementById('content');
      if (error || !data) {
        content.innerHTML = `<div class="error-box">This invoice link isn't valid. Please check the link or contact us.</div>`;
        return;
      }

      const inv = data.invoice;
      const cc = data.cost_centre;
      const project = data.project;
      const s = data.company || {};
      const lineItems = data.line_items || [];
      const previousClaims = data.previous_claims || [];

      if (s.logo_url) {
        document.getElementById('brand-mark').innerHTML = `<img src="${s.logo_url}" style="max-height:28px;" />`;
      } else if (s.company_name) {
        document.getElementById('brand-mark').textContent = s.company_name;
      }

      const labourAmount = Number(inv.labour_amount) || 0;
      const materialAmount = Number(inv.material_amount) || 0;
      const stcAmount = Number(inv.stc_amount) || 0;
      const subtotal = labourAmount + materialAmount;
      const gst = Math.round(subtotal * 0.10 * 100) / 100;
      const totalIncGst = subtotal + gst;
      const balanceDue = totalIncGst - stcAmount;
      const isPaid = !!inv.paid_at;

      const detailParts = [s.abn ? `ABN ${s.abn}` : '', s.address, s.phone, s.website].filter(Boolean);

      const previouslyClaimed = previousClaims.reduce((sum, p) => sum + Number(p.labour_amount) + Number(p.material_amount), 0);
      const quotedAmount = Number(cc.quoted_amount) || 0;
      const claimedToDate = previouslyClaimed + subtotal;
      const remaining = Math.max(0, quotedAmount - claimedToDate);

      const stcTotal = Number(cc.stc_total) || 0;
      const stcAppliedPreviously = 0; // previous_claims doesn't carry stc breakdown separately here, kept simple
      const stcRemaining = Math.max(0, stcTotal - stcAmount - stcAppliedPreviously);
      const isStandalone = !project.job_number;

      content.innerHTML = `
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:20px;">
            <div>
              ${s.logo_url ? `<img src="${s.logo_url}" style="max-height:48px;" />` : `<h1 style="margin:0;">${s.company_name || ''}</h1>`}
              <p class="subtitle" style="margin:10px 0 0;">${detailParts.join(' &middot; ')}</p>
            </div>
            <div style="text-align:right;">
              <h1 style="margin:0;">Tax Invoice</h1>
              <p class="subtitle" style="margin:2px 0 0;">${inv.invoice_number}</p>
            </div>
          </div>

          <div class="grid cols-3" style="margin-bottom:20px;">
            <div style="grid-column: span 2;">
              <p class="subtitle" style="margin:0 0 4px; text-transform:uppercase; font-size:11px;">Bill to</p>
              <p style="margin:0; font-weight:600;">${project.client_name}</p>
              ${project.client_address ? `<p class="subtitle" style="margin:2px 0 0;">${project.client_address}</p>` : ''}
            </div>
            <div class="meta-box">
              ${!isStandalone ? `<div><span class="k">Job No.</span>${project.job_number}</div>` : ''}
              <div><span class="k">${isStandalone ? 'For' : 'Stage'}</span>${cc.name}</div>
            </div>
          </div>

          <div class="inv-header-bar">
            <div><div class="label">Invoice date</div><div class="val">${new Date(inv.sent_at).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' })}</div></div>
            <div class="amount"><div class="label">Amount due</div><div class="val">${money(balanceDue)}</div></div>
            <div>${isPaid ? '<div class="label">Status</div><div class="val" style="color:var(--green);">Paid</div>' : '<div class="label">Status</div><div class="val">Awaiting payment</div>'}</div>
          </div>

          <h2 style="margin-bottom:10px;">${cc.name}</h2>
          ${lineItems.length ? `
            <table>
              <thead><tr><th>Item</th><th class="num">Quantity</th><th class="num">Unit Price</th><th class="num">Total</th></tr></thead>
              <tbody>
                ${lineItems.map(li => `<tr><td>${li.description}</td><td class="num">${li.quantity}</td><td class="num">${money(li.unit_cost)}</td><td class="num">${money(li.quantity * li.unit_cost)}</td></tr>`).join('')}
              </tbody>
            </table>
          ` : `<p class="subtitle">${isStandalone ? 'Labour and materials as invoiced.' : cc.name + ' - labour and materials as quoted.'}</p>`}

          <div style="text-align:right; margin-top:16px; padding-top:16px; border-top:1px solid var(--border);">
            <p class="subtitle" style="margin:0;">Subtotal: ${money(subtotal)}</p>
            <p class="subtitle" style="margin:2px 0 0;">GST (10%): ${money(gst)}</p>
            <p class="subtitle" style="margin:2px 0 0;">Total inc GST: ${money(totalIncGst)}</p>
            ${stcAmount > 0 ? `<p style="margin:6px 0 0; color:var(--green); font-weight:600;">STC Credit: -${money(stcAmount)}</p>` : ''}
            <p style="font-size:20px; font-weight:700; margin:6px 0 0;">Balance Due: ${money(balanceDue)}</p>
          </div>
        </div>

        ${!isStandalone ? `
        <div class="card">
          <h2 style="margin-bottom:2px;">Claim summary</h2>
          <p class="subtitle" style="margin-bottom:16px;">${cc.name} &middot; Job ${project.job_number}</p>
          <table>
            <thead><tr><th></th><th class="num">Total</th><th class="num">Claimed to date</th><th class="num">This claim</th><th class="num">Remaining</th></tr></thead>
            <tbody>
              <tr>
                <td>Stage value</td>
                <td class="num">${money(quotedAmount)}</td>
                <td class="num">${money(claimedToDate)} (${quotedAmount ? Math.round((claimedToDate / quotedAmount) * 100) : 0}%)</td>
                <td class="num">${money(subtotal)}</td>
                <td class="num">${money(remaining)}</td>
              </tr>
              ${stcTotal > 0 ? `
              <tr>
                <td>STC credit</td>
                <td class="num">${money(stcTotal)}</td>
                <td class="num">${money(stcAppliedPreviously)}</td>
                <td class="num">${money(stcAmount)}</td>
                <td class="num">${money(stcRemaining)}</td>
              </tr>` : ''}
            </tbody>
          </table>
          ${stcTotal > 0 ? (stcAmount > 0
            ? `<p class="subtitle" style="margin-top:12px;">This customer is entitled to a ${money(stcTotal)} STC credit. ${money(stcAmount)} of it is applied on this claim.</p>`
            : `<p class="subtitle" style="margin-top:12px;">This customer is entitled to a ${money(stcTotal)} STC credit. It has not been applied on this claim - it will be credited on a future invoice for this stage.</p>`
          ) : ''}
        </div>
        ` : ''}

        ${previousClaims.length ? `
        <div class="card">
          <h2>Previous claims</h2>
          <table>
            <thead><tr><th>Invoice</th><th class="num">Amount</th><th>Date</th></tr></thead>
            <tbody>
              ${previousClaims.map(p => `<tr><td>${p.invoice_number}</td><td class="num">${money(Number(p.labour_amount) + Number(p.material_amount))}</td><td>${new Date(p.sent_at).toLocaleDateString('en-AU')}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>` : ''}

        ${!isPaid ? `
        <div class="card">
          <h2>Payment details</h2>
          ${s.bank_name || s.bank_account_number ? `
            <table>
              <tbody>
                ${s.bank_account_name ? `<tr><td>Account name</td><td>${s.bank_account_name}</td></tr>` : ''}
                ${s.bank_name ? `<tr><td>Bank</td><td>${s.bank_name}</td></tr>` : ''}
                ${s.bank_bsb ? `<tr><td>BSB</td><td>${s.bank_bsb}</td></tr>` : ''}
                ${s.bank_account_number ? `<tr><td>Account number</td><td>${s.bank_account_number}</td></tr>` : ''}
                <tr><td>Reference</td><td><strong>${inv.invoice_number}</strong></td></tr>
              </tbody>
            </table>
          ` : ''}
          ${s.payment_details_text ? `<p class="subtitle" style="white-space:pre-wrap; margin-top:10px;">${s.payment_details_text}</p>` : ''}
          ${!s.bank_name && !s.bank_account_number && !s.payment_details_text ? `<p class="subtitle">Contact us for payment details.</p>` : ''}
        </div>` : ''}
      `;
    }

    load();
  </script>
</body>
</html>
